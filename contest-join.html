<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>المشاركة | MZAD</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--p:#247b83;--bg:#f4f5f8;--ink:#202735;--muted:#747d8c;--line:#e4e7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;padding:env(safe-area-inset-top) 16px 30px}main{max-width:520px;margin:auto}header{height:62px;display:flex;align-items:center;gap:12px}header a{font-size:25px;color:var(--p);text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;margin-top:12px}h1{font-size:19px;margin:0}h2{font-size:21px;margin:8px 0}p{color:var(--muted);line-height:1.9}.field{display:block;margin-top:18px;font-weight:700;font-size:13px}textarea{width:100%;font:inherit;padding:13px;border:1px solid var(--line);border-radius:12px;margin-top:7px}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:var(--p);color:#fff;font:inherit;font-weight:700;margin-top:17px}.btn:disabled{opacity:.5}.msg{min-height:24px;color:#b44855;font-size:13px;line-height:1.8}
</style></head><body><main><header><a href="contests.html">‹</a><h1>المشاركة بالمسابقة</h1></header><section class="card"><div style="color:var(--p);font-size:11px;font-weight:700">MZAD PHONE</div><h2 id="title">جاري تحميل المسابقة…</h2><p id="desc">—</p><p>بطاقتك راح تظهر باسمك ومحافظتك فقط، بدون صورة. كل حساب يگدر يشارك مرة واحدة بهذي المسابقة.</p><label class="field">نبذة قصيرة عنك (اختياري)<textarea id="note" rows="3" maxlength="180" placeholder="اكتب تعريف بسيط حتى الناس تعرفك"></textarea></label><button class="btn" id="join">تأكيد المشاركة</button><p id="msg" class="msg" role="status"></p></section></main>
<script type="module">
import{supabase}from"./js/supabase.js";const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get("id");let contest=null,busy=false;
async function init(){const s=await supabase.auth.getSession();if(!s.data.session){location.href="index.html?login=1&returnTo="+encodeURIComponent(location.pathname+location.search);return}if(!id)throw Error("رابط المسابقة غير مكتمل");const r=await supabase.from("mzad_contests").select("id,title_ar,short_description,status,starts_at,ends_at").eq("id",id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error("المسابقة غير موجودة");contest=r.data;$("title").textContent=contest.title_ar;$("desc").textContent=contest.short_description||"شارك باسمك وخلي الناس تدعمك.";const own=await supabase.from("mzad_contest_entries").select("id").eq("contest_id",id).eq("user_id",s.data.session.user.id).maybeSingle();if(own.error)throw own.error;if(own.data){$("join").textContent="أنت مشارك بالفعل";$("join").disabled=true;$("msg").textContent="حسابك مسجل مرة واحدة بهذه المسابقة.";return}if(!["active","scheduled"].includes(contest.status)||new Date(contest.ends_at)<=new Date()||new Date(contest.starts_at)>new Date()){$("join").disabled=true;$("msg").textContent="التسجيل غير متاح حالياً."}}
$("join").onclick=async()=>{if(busy||!contest)return;busy=true;$("join").disabled=true;$("join").textContent="جارٍ تسجيل المشاركة…";try{const r=await supabase.rpc("mzad_join_contest",{p_contest_id:id,p_answer_text:$("note").value.trim()||null});if(r.error)throw r.error;location.href="contestant.html?id="+encodeURIComponent(r.data.entry_id)}catch(e){$("msg").textContent=e.message||"تعذر تسجيل المشاركة";$("join").disabled=false;$("join").textContent="تأكيد المشاركة";busy=false}};
init().catch(e=>$("msg").textContent=e.message||String(e));
</script></body></html>
