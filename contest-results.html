<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>النتائج | MZAD PHONE</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#8E3B46;--i:#F5E9DA;--line:rgba(142,59,70,.16);--soft:rgba(142,59,70,.08);--mute:rgba(142,59,70,.65);--ob:rgba(245,233,218,.7);--obl:rgba(245,233,218,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--i);color:var(--b);font-family:'Tajawal',system-ui,sans-serif}
body{display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100vh;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hero{background-color:var(--b);color:var(--i);border-radius:0 0 32px 32px;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 24px;
  }
.bar{display:flex;align-items:center;justify-content:space-between}
.bar h1{font-size:18px;font-weight:800}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--obl);background:var(--b);color:var(--i);display:grid;place-items:center;text-decoration:none}
.lead{margin-top:22px;border:1px solid var(--obl);border-radius:24px;padding:18px;background:var(--b);display:flex;align-items:center;gap:14px}
.lead .tro{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--i);display:grid;place-items:center;flex:none}
.lead .tro svg{width:28px;height:28px}
.lead small{font-size:13px;color:var(--ob)}
.lead h2{font-size:24px;font-weight:800;line-height:1.2}
.lead p{font-size:14px;color:var(--ob);margin-top:2px;font-variant-numeric:tabular-nums}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:20px 20px 0}
.tab{height:46px;border-radius:14px;border:1.5px solid var(--b);background:transparent;color:var(--b);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
.tab[aria-selected=true]{background:var(--b);color:var(--i)}
.tab:focus-visible{outline:2px solid var(--b);outline-offset:3px}

.list{padding:14px 20px 0;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.rk{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:800}
.row.top .rk{background:var(--b);color:var(--i);border-color:var(--b)}
.nm{font-weight:700;font-size:16px}
.st{font-size:12.5px;color:var(--mute);margin-top:2px}
.tm{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}

.draw{margin:26px 20px 0;border:1px solid var(--line);border-radius:24px;padding:18px}
.draw h3{font-size:18px;font-weight:800}
.draw p{font-size:14px;color:var(--mute);margin-top:4px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.slot{height:84px;border-radius:18px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:6px;font-weight:700;font-size:14px;transition:background .25s,color .25s,border-color .25s}
.slot small{font-size:11.5px;font-weight:500;color:var(--mute)}
.slot.spin{border-style:solid;border-color:var(--b);background:var(--soft)}
.slot.done{border-style:solid;background:var(--b);border-color:var(--b);color:var(--i)}
.slot.done small{color:var(--ob)}
.go{margin-top:16px;width:100%;height:54px;border-radius:18px;background:var(--b);color:var(--i);border:0;font-family:inherit;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,opacity .15s}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.4;cursor:not-allowed}
.go:focus-visible{outline:2px solid var(--b);outline-offset:3px}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="bar">
      <a class="ib" href="contests.html" aria-label="رجوع"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></a>
      <h1>النتائج</h1>
      <span style="width:42px"></span>
    </div>
    <section class="lead">
      <div class="tro"><svg class="ic" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 01-10 0V4zM7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3M12 14v4M8 20h8"/></svg></div>
      <div><small>المتصدر</small><h2 id="lname"></h2><p id="ltime"></p></div>
    </section>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-r="0" aria-selected="false">الجولة 1</button>
    <button class="tab" role="tab" data-r="1" aria-selected="false">الجولة 2</button>
    <button class="tab" role="tab" data-r="2" aria-selected="true">النهائي</button>
  </div>
  <main class="list" id="list"></main>

  <section class="draw">
    <h3>سحب الداعمين</h3>
    <p id="dtxt"></p>
    <div class="slots" id="slots">
      <div class="slot"><span>?</span></div><div class="slot"><span>?</span></div><div class="slot"><span>?</span></div>
    </div>
  </section>
</div>

<script>
/* بيانات تجريبية: استبدلها لاحقاً ببيانات Supabase */
const rounds = [
  [['علي حسين',1820],['محمد صابر',1640],['زينب كريم',1410],['حسن جاسم',1200],['سارة نبيل',980]],
  [['علي حسين',2410],['محمد صابر',2300],['زينب كريم',1950],['حسن جاسم',1500]],
  [['علي حسين',3120],['محمد صابر',2890]]
];
const status = ['انتهت','انتهت','النهائي'];
const supporters = ['كرار علي','دعاء حسن','يوسف مهدي','هبة سالم','مرتضى كاظم','رقية فاضل','ليث عدنان','آية جبار','سجاد ناصر','تبارك هادي'];
const fmt = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

function show(r){
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.r == r));
  document.getElementById('list').innerHTML = rounds[r].map((p,i)=>`
    <div class="row ${i===0?'top':''}">
      <div class="rk">${i+1}</div>
      <div><div class="nm">${p[0]}</div><div class="st">${i===0?'الأول':'متأهل'}</div></div>
      <div class="tm">${fmt(p[1])}</div>
    </div>`).join('');
}
document.getElementById('tabs').onclick = e => { const t = e.target.closest('.tab'); if(t) show(+t.dataset.r); };
show(2);
const w = rounds[2][0];
document.getElementById('lname').textContent = w[0];
document.getElementById('ltime').textContent = 'وقت الدعم ' + fmt(w[1]);

/* السحب تلقائي عند انتهاء المسابقة بدون أي زر.
   ENDED: خليها true إذا المسابقة انتهت (من قاعدة البيانات لاحقاً).
   ملاحظة: الاختيار الحقيقي للفائزين لازم يصير بالسيرفر مو بالمتصفح. هذا عرض تصميم فقط. */
const ENDED = true;
const slots = [...document.querySelectorAll('.slot')];
const dtxt = document.getElementById('dtxt');
if(!ENDED){
  dtxt.textContent = 'السحب يصير تلقائياً بمجرد انتهاء المسابقة.';
}else{
  dtxt.textContent = 'اختار النظام 3 داعمين عشوائياً عند انتهاء المسابقة.';
  const winners = [...supporters].sort(() => Math.random() - .5).slice(0,3);
  slots.forEach(s => { s.className = 'slot spin'; });
  const timer = setInterval(() => {
    slots.forEach(s => { if(s.classList.contains('spin')) s.innerHTML = '<span>' + supporters[Math.floor(Math.random()*supporters.length)] + '</span>'; });
  }, 80);
  slots.forEach((s,i) => setTimeout(() => {
    s.className = 'slot done';
    s.innerHTML = '<span>' + winners[i] + '</span><small>داعم فائز</small>';
    if(i === 2) clearInterval(timer);
  }, 1000 + i*700));
}
</script>
</body>
</html>
