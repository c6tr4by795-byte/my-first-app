<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>MZAD PHONE</title>

  <style>
    :root {
      --primary: #238f98;
      --primary-dark: #176f77;
      --primary-soft: #eaf6f7;

      --ink: #172124;
      --text: #252d2f;
      --muted: #7b8587;
      --muted-light: #a7afb1;

      --white: #ffffff;
      --surface: #f7f9f9;
      --line: #e5eaeb;

      --radius-xl: 26px;
      --radius-lg: 21px;
      --radius-md: 16px;
      --radius-sm: 13px;

      --shadow-soft:
        0 10px 35px rgba(22, 38, 40, 0.07);

      --shadow-card:
        0 7px 25px rgba(22, 38, 40, 0.06);

      --nav-height: 76px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      background: var(--white);
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--white);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      background: none;
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--white);
      position: relative;
    }

    .page {
      padding-bottom: calc(
        var(--nav-height) +
        var(--safe-bottom) +
        35px
      );
    }

    /* =========================
       TOP HEADER
    ========================= */

    .top-header {
      padding:
        max(12px, env(safe-area-inset-top))
        18px
        0;

      background: var(--white);
    }

    .header-row {
      min-height: 48px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 2px;
      text-decoration: none;
      color: var(--ink);
      direction: ltr;
      flex-shrink: 0;
    }

    .brand-main {
      font-size: 29px;
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .brand-sub {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 4px;
      margin-top: 19px;
      margin-left: -53px;
      color: var(--primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      width: 43px;
      height: 43px;

      border: 1px solid var(--line);
      border-radius: 50%;

      display: grid;
      place-items: center;

      background: var(--white);

      color: var(--ink);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .icon-button:active {
      transform: scale(0.94);
      background: var(--primary-soft);
      border-color: transparent;
    }

    .icon-button svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
    }

    .notification {
      position: relative;
    }

    .notification-badge {
      position: absolute;

      top: -3px;
      right: -2px;

      min-width: 17px;
      height: 17px;

      padding: 0 4px;

      display: grid;
      place-items: center;

      border-radius: 99px;

      background: var(--primary);
      color: white;

      font-size: 9px;
      font-weight: 800;

      border: 2px solid white;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-wrap {
      padding: 12px 18px 0;
    }

    .search-box {
      height: 47px;

      display: flex;
      align-items: center;

      gap: 10px;

      padding: 0 15px;

      border-radius: 15px;

      background: #f5f7f7;

      border: 1px solid #edf0f0;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .search-box:focus-within {
      border-color: rgba(35, 143, 152, 0.35);

      box-shadow:
        0 0 0 4px rgba(35, 143, 152, 0.07);
    }

    .search-icon {
      width: 20px;
      height: 20px;

      flex-shrink: 0;

      color: var(--muted);
    }

    .search-input {
      width: 100%;

      border: 0;
      outline: 0;

      background: transparent;

      color: var(--text);

      font-size: 14px;
      font-weight: 600;

      text-align: right;
    }

    .search-input::placeholder {
      color: #929b9d;
    }

    /* =========================
       LOCATION
    ========================= */

    .location-row {
      padding: 12px 19px 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      color: var(--muted);
    }

    .location {
      display: flex;
      align-items: center;
      gap: 6px;

      font-size: 12px;
      font-weight: 700;
    }

    .location svg {
      width: 17px;
      height: 17px;

      color: var(--primary);
      stroke: currentColor;
    }

    .change-location {
      color: var(--primary);

      font-size: 11px;
      font-weight: 800;
    }

    /* =========================
       SECTION HEADER
    ========================= */

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 21px 18px 10px;
    }

    .section-title {
      margin: 0;

      font-size: 19px;
      font-weight: 850;

      color: var(--ink);
      letter-spacing: -0.4px;
    }

    .section-action {
      color: var(--primary);

      font-size: 12px;
      font-weight: 800;
    }

    /* =========================
       AUCTION CAROUSEL
    ========================= */

    .auction-area {
      overflow: hidden;
    }

    .auction-track {
      display: flex;

      direction: rtl;

      gap: 12px;

      overflow-x: auto;

      padding:
        4px
        18px
        5px;

      scroll-snap-type: x mandatory;

      scrollbar-width: none;

      touch-action: pan-x;
    }

    .auction-track::-webkit-scrollbar {
      display: none;
    }

    .auction-card {
      position: relative;

      flex: 0 0 min(
        89vw,
        530px
      );

      min-height: 166px;

      scroll-snap-align: center;

      border-radius: 25px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #f4fbfb 0%,
          #eaf6f7 55%,
          #dceff1 100%
        );

      border: 1px solid #dfeff0;

      box-shadow: var(--shadow-soft);
    }

    .auction-card::after {
      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      left: -75px;
      bottom: -110px;

      border-radius: 50%;

      background: rgba(35, 143, 152, 0.08);
    }

    .auction-content {
      position: relative;
      z-index: 2;

      height: 100%;

      min-height: 166px;

      display: flex;
      align-items: center;

      padding: 17px 18px;

      gap: 15px;
    }

    .auction-info {
      flex: 1;
      min-width: 0;

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      text-align: right;
    }

    .auction-label {
      display: inline-flex;
      align-items: center;

      height: 25px;

      padding: 0 9px;

      border-radius: 99px;

      background: rgba(35, 143, 152, 0.11);

      color: var(--primary-dark);

      font-size: 10px;
      font-weight: 850;
    }

    .auction-title {
      margin: 9px 0 0;

      color: var(--ink);

      font-size: 20px;
      line-height: 1.15;
      font-weight: 900;

      letter-spacing: -0.5px;
    }

    .auction-meta {
      margin-top: 5px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 650;
    }

    .auction-price-row {
      display: flex;
      align-items: baseline;
      gap: 5px;

      margin-top: 12px;
    }

    .auction-price {
      color: var(--primary-dark);

      font-size: 19px;
      font-weight: 950;
    }

    .auction-currency {
      color: var(--muted);

      font-size: 9px;
      font-weight: 700;
    }

    .auction-button {
      margin-top: 11px;

      height: 34px;

      padding: 0 14px;

      border-radius: 11px;

      background: var(--ink);
      color: white;

      font-size: 11px;
      font-weight: 850;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .auction-button:active {
      transform: scale(0.95);
      background: var(--primary-dark);
    }

    /* =========================
       DEVICE VISUAL
    ========================= */

    .device-stage {
      width: 125px;
      height: 138px;

      flex-shrink: 0;

      position: relative;

      display: grid;
      place-items: center;
    }

    .device-glow {
      position: absolute;

      width: 110px;
      height: 110px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,0.9),
          rgba(255,255,255,0)
        );
    }

    .phone {
      position: relative;

      width: 68px;
      height: 122px;

      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          #31393b,
          #111719
        );

      border: 2px solid #657174;

      box-shadow:
        0 15px 24px rgba(15, 29, 31, 0.18);

      transform: rotate(-8deg);

      overflow: hidden;
    }

    .phone::before {
      content: "";

      position: absolute;

      top: 6px;
      left: 50%;

      transform: translateX(-50%);

      width: 25px;
      height: 6px;

      border-radius: 99px;

      background: #111719;

      z-index: 3;
    }

    .phone-screen {
      position: absolute;

      inset: 3px;

      border-radius: 12px;

      background:
        linear-gradient(
          160deg,
          #dff4f5,
          #9ccfd3 40%,
          #367e84 100%
        );
    }

    .camera-module {
      position: absolute;

      top: 10px;
      left: 8px;

      width: 26px;
      height: 32px;

      border-radius: 8px;

      background: #171c1d;

      z-index: 5;
    }

    .camera-module span {
      position: absolute;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #556164;

      border: 1px solid #90999b;
    }

    .camera-module span:nth-child(1) {
      top: 5px;
      left: 5px;
    }

    .camera-module span:nth-child(2) {
      top: 5px;
      right: 5px;
    }

    .camera-module span:nth-child(3) {
      bottom: 5px;
      left: 9px;
    }

    .auction-arrow {
      position: absolute;

      left: 13px;
      top: 12px;

      width: 29px;
      height: 29px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background: rgba(255,255,255,0.72);

      color: var(--primary-dark);

      z-index: 5;
    }

    .auction-arrow svg {
      width: 15px;
      height: 15px;
    }

    /* =========================
       DOTS
    ========================= */

    .carousel-dots {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 5px;

      padding-top: 8px;
    }

    .dot {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #ccd5d6;

      transition:
        width 0.25s ease,
        background 0.25s ease;
    }

    .dot.active {
      width: 17px;

      border-radius: 99px;

      background: var(--primary);
    }

    /* =========================
       DEVICES
    ========================= */

    .devices-section {
      margin-top: 4px;
    }

    .devices-scroll {
      display: flex;

      gap: 10px;

      overflow-x: auto;

      padding:
        2px
        18px
        8px;

      scrollbar-width: none;
    }

    .devices-scroll::-webkit-scrollbar {
      display: none;
    }

    .device-category {
      flex: 0 0 75px;

      text-align: center;
    }

    .device-icon-box {
      width: 70px;
      height: 70px;

      margin: 0 auto;

      border-radius: 19px;

      background: #fafbfb;

      border: 1px solid var(--line);

      display: grid;
      place-items: center;

      box-shadow:
        0 5px 17px rgba(23, 33, 36, 0.045);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .device-category:active .device-icon-box {
      transform: scale(0.94);
      background: var(--primary-soft);
      border-color: rgba(35, 143, 152, 0.25);
    }

    .device-icon-box svg {
      width: 32px;
      height: 32px;

      color: var(--ink);

      stroke: currentColor;
    }

    .device-name {
      display: block;

      margin-top: 7px;

      color: #4f595b;

      font-size: 11px;
      font-weight: 800;
    }

    /* =========================
       QUICK ACTIONS
    ========================= */

    .quick-section {
      margin-top: 4px;
    }

    .quick-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 9px;

      padding: 0 18px;
    }

    .quick-card {
      min-height: 84px;

      padding: 10px 6px;

      border: 1px solid var(--line);

      border-radius: 18px;

      background: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 7px;

      box-shadow:
        0 6px 18px rgba(23, 33, 36, 0.04);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .quick-card:active {
      transform: scale(0.96);
      background: var(--primary-soft);
    }

    .quick-icon {
      width: 36px;
      height: 36px;

      border-radius: 12px;

      display: grid;
      place-items: center;

      background: var(--primary-soft);

      color: var(--primary-dark);
    }

    .quick-icon svg {
      width: 19px;
      height: 19px;

      stroke: currentColor;
    }

    .quick-label {
      color: #4d5759;

      font-size: 9px;
      font-weight: 850;

      white-space: nowrap;
    }

    /* =========================
       UPCOMING / EMPTY
    ========================= */

    .upcoming {
      margin: 8px 18px 0;

      padding: 18px;

      border-radius: 21px;

      background: #f7f9f9;

      border: 1px solid #edf1f1;

      display: flex;
      align-items: center;

      gap: 14px;
    }

    .upcoming-icon {
      width: 48px;
      height: 48px;

      flex-shrink: 0;

      border-radius: 15px;

      display: grid;
      place-items: center;

      background: var(--white);

      color: var(--primary);

      box-shadow: 0 5px 15px rgba(23, 33, 36, 0.04);
    }

    .upcoming-icon svg {
      width: 23px;
      height: 23px;
    }

    .upcoming-text {
      min-width: 0;
    }

    .upcoming-title {
      margin: 0;

      font-size: 14px;
      font-weight: 900;

      color: var(--ink);
    }

    .upcoming-sub {
      margin: 4px 0 0;

      font-size: 10px;
      line-height: 1.5;

      color: var(--muted);
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav-wrap {
      position: fixed;

      z-index: 100;

      left: 50%;

      bottom:
        max(10px, env(safe-area-inset-bottom));

      transform: translateX(-50%);

      width: min(
        calc(100% - 28px),
        430px
      );

      pointer-events: none;
    }

    .bottom-nav {
      pointer-events: auto;

      height: 69px;

      padding:
        7px
        9px;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      align-items: center;

      background: rgba(255,255,255,0.86);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border:
        1px solid rgba(226, 232, 233, 0.92);

      border-radius: 23px;

      box-shadow:
        0 12px 38px rgba(18, 31, 33, 0.12);
    }

    .nav-item {
      height: 56px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 4px;

      border-radius: 17px;

      color: #8a9395;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .nav-item:active {
      transform: scale(0.94);
    }

    .nav-item.active {
      color: var(--primary-dark);
    }

    .nav-icon {
      width: 31px;
      height: 31px;

      border-radius: 11px;

      display: grid;
      place-items: center;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .nav-item.active .nav-icon {
      background: var(--primary-soft);
    }

    .nav-icon svg {
      width: 20px;
      height: 20px;

      stroke: currentColor;
    }

    .nav-label {
      font-size: 9px;
      font-weight: 850;
    }

    /* =========================
       TABLET / BIG SCREENS
    ========================= */

    @media (min-width: 621px) {

      body {
        background: #eef2f2;
      }

      .app {
        min-height: 100vh;

        box-shadow:
          0 0 70px rgba(20, 35, 37, 0.08);
      }

      .auction-card {
        flex-basis: 530px;
      }

      .bottom-nav-wrap {
        width: 430px;
      }
    }

    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 360px) {

      .brand-main {
        font-size: 26px;
      }

      .brand-sub {
        font-size: 8px;
        letter-spacing: 3px;
        margin-left: -48px;
      }

      .header-actions {
        gap: 5px;
      }

      .icon-button {
        width: 39px;
        height: 39px;
      }

      .auction-card {
        min-height: 155px;
      }

      .auction-content {
        min-height: 155px;
        padding: 14px;
      }

      .device-stage {
        width: 106px;
        height: 130px;
      }

      .phone {
        transform: scale(0.9) rotate(-8deg);
      }

      .auction-title {
        font-size: 18px;
      }

      .device-icon-box {
        width: 64px;
        height: 64px;
      }

      .device-category {
        flex-basis: 69px;
      }

      .quick-grid {
        gap: 6px;
      }

      .quick-card {
        min-height: 79px;
      }

      .quick-label {
        font-size: 8px;
      }
    }

    /* =========================
       MOTION
    ========================= */

    @keyframes softAppear {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .top-header,
    .search-wrap,
    .location-row,
    .auction-area,
    .devices-section,
    .quick-section,
    .upcoming {
      animation: softAppear 0.45s ease both;
    }

    .search-wrap {
      animation-delay: 0.05s;
    }

    .location-row {
      animation-delay: 0.08s;
    }

    .auction-area {
      animation-delay: 0.12s;
    }

    .devices-section {
      animation-delay: 0.17s;
    }

    .quick-section {
      animation-delay: 0.21s;
    }

    .upcoming {
      animation-delay: 0.25s;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="page">

      <!-- =========================
           HEADER
      ========================== -->

      <header class="top-header">

        <div class="header-row">

          <a class="brand" href="#">
            <span class="brand-main">MZAD</span>
            <span class="brand-sub">PHONE</span>
          </a>

          <div class="header-actions">

            <button
              class="icon-button notification"
              aria-label="الإشعارات"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
                <path d="M10 21h4"/>
              </svg>

              <span class="notification-badge">3</span>
            </button>

            <button
              class="icon-button"
              aria-label="الحساب"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="8" r="3.2"/>
                <path d="M5 20c.8-3.4 3.1-5.2 7-5.2s6.2 1.8 7 5.2"/>
              </svg>
            </button>

          </div>

        </div>

      </header>

      <!-- =========================
           SEARCH
      ========================== -->

      <section class="search-wrap">

        <label class="search-box">

          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>
          </svg>

          <input
            class="search-input"
            type="search"
            placeholder="ابحث عن جهاز أو موديل أو مزاد"
            autocomplete="off"
          >

        </label>

      </section>

      <!-- =========================
           LOCATION
      ========================== -->

      <div class="location-row">

        <div class="location">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/>
            <circle cx="12" cy="10" r="2.5"/>
          </svg>

          <span>النجف</span>

        </div>

        <button class="change-location">
          تغيير الموقع
        </button>

      </div>


      <!-- =========================
           AUCTION
      ========================== -->

      <section class="auction-area">

  <script>

    /* ==========================================
       AUCTION CAROUSEL
    ========================================== */

    const track =
      document.getElementById("auctionTrack");

    const dots =
      document.querySelectorAll(".dot");

    let currentSlide = 0;

    function getCardWidth() {

      const card =
        track.querySelector(".auction-card");

      if (!card) return 0;

      const gap = 12;

      return card.offsetWidth + gap;
    }

    function updateDots(index) {

      dots.forEach((dot, i) => {

        dot.classList.toggle(
          "active",
          i === index
        );

      });

    }

    function goToSlide(index) {

      const width = getCardWidth();

      if (!width) return;

      currentSlide = index;

      track.scrollTo({
        left:
          index === 0
            ? 0
            : width * index,
        behavior: "smooth"
      });

      updateDots(index);
    }

    let autoSlide =
      setInterval(() => {

        currentSlide++;

        if (currentSlide >= dots.length) {
          currentSlide = 0;
        }

        goToSlide(currentSlide);

      }, 3000);


    track.addEventListener(
      "touchstart",
      () => {
        clearInterval(autoSlide);
      },
      { passive: true }
    );


    track.addEventListener(
      "touchend",
      () => {

        autoSlide =
          setInterval(() => {

            currentSlide++;

            if (currentSlide >= dots.length) {
              currentSlide = 0;
            }

            goToSlide(currentSlide);

          }, 3000);

      },
      { passive: true }
    );


    track.addEventListener(
      "scroll",
      () => {

        const width = getCardWidth();

        if (!width) return;

        const index =
          Math.round(track.scrollLeft / width);

        const safeIndex =
          Math.max(
            0,
            Math.min(index, dots.length - 1)
          );

        currentSlide = safeIndex;

        updateDots(safeIndex);

      },
      { passive: true }
    );


    /* ==========================================
       BOTTOM NAV ACTIVE STATE
    ========================================== */

    const navItems =
      document.querySelectorAll(".nav-item");

    navItems.forEach(item => {

      item.addEventListener("click", () => {

        navItems.forEach(nav =>
          nav.classList.remove("active")
        );

        item.classList.add("active");

      });

    });


    /* ==========================================
       DEVICE / QUICK BUTTON FEEDBACK
    ========================================== */

    document
      .querySelectorAll(
        ".device-category, .quick-card, .auction-button"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            button.animate(
              [
                {
                  transform: "scale(1)"
                },
                {
                  transform: "scale(.96)"
                },
                {
                  transform: "scale(1)"
                }
              ],
              {
                duration: 180,
                easing: "ease-out"
              }
            );

          }
        );

      });

  </script>
