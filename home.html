<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="format-detection"
    content="telephone=no,email=no,address=no">

  <title>العراق الأخضر</title>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: "Cairo", Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,0.10) 0 90px, transparent 91px),
        radial-gradient(circle at 100% 90%, rgba(255,255,255,0.08) 0 150px, transparent 151px),
        #e91d4f;

      color: white;
    }

    .page {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      padding: 22px 18px 45px;
    }

    /* زخارف الخلفية */

    .circle-one {
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: rgba(255,255,255,0.045);
      top: -100px;
      right: -80px;
    }

    .circle-two {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      bottom: -120px;
      left: -110px;
    }

    .star {
      position: absolute;
      color: rgba(255,255,255,0.85);
      font-size: 34px;
      line-height: 1;
    }

    .star.one {
      top: 170px;
      left: 30px;
    }

    .star.two {
      top: 390px;
      right: 24px;
      font-size: 25px;
    }

    .star.three {
      bottom: 220px;
      left: 45px;
      font-size: 27px;
    }

    /* زر تسجيل الخروج */

    .logout {
      position: absolute;
      top: 22px;
      left: 18px;

      border: none;
      background: #32b8c4;
      color: #111;

      padding: 9px 16px;

      border-radius: 13px;

      font-family: "Cairo", Arial, sans-serif;
      font-size: 13px;
      font-weight: 800;

      box-shadow:
        0 4px 0 rgba(0,0,0,0.18),
        0 8px 18px rgba(0,0,0,0.08);

      cursor: pointer;

      z-index: 10;
    }

    .logout:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }

    /* المحتوى */

    .content {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 520px;

      margin: 0 auto;
      padding-top: 65px;
    }

    /* الترحيب */

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .tree {
      font-size: 62px;
      line-height: 1;
      margin-bottom: 18px;

      filter: drop-shadow(0 5px 5px rgba(0,0,0,0.12));
    }

    .title {
      margin: 0;

      color: white;

      font-size: clamp(39px, 10vw, 62px);
      line-height: 1.2;

      font-weight: 900;

      letter-spacing: -1px;

      text-shadow:
        0 3px 0 rgba(0,0,0,0.06);
    }

    .subtitle {
      margin: 12px 0 0;

      color: white;

      font-size: 22px;
      font-weight: 700;
    }

    /* بطاقة الحساب */

    .card {
      background: #fffaf7;

      color: #222;

      border-radius: 30px;

      padding: 27px 24px;

      margin-bottom: 20px;

      box-shadow:
        0 12px 30px rgba(80,0,20,0.14);
    }

    .card-label {
      margin: 0 0 18px;

      color: #17853e;

      font-size: 27px;
      font-weight: 900;
    }

    /* الإيميل */

    .email {
      text-align: center;

      color: #4d4d4d;

      font-family: Arial, sans-serif;

      font-size: 19px;
      font-weight: 700;

      direction: ltr;

      /* يمنع تحديده كرابط */
      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;

      text-decoration: none;
    }

    /* البطاقة الثانية */

    .welcome-card {
      background: #fffaf7;

      color: #222;

      border-radius: 30px;

      padding: 30px 22px;

      text-align: center;

      box-shadow:
        0 12px 30px rgba(80,0,20,0.12);
    }

    .welcome-title {
      margin: 0;

      color: #17853e;

      font-size: clamp(25px, 6vw, 34px);

      font-weight: 900;

      line-height: 1.45;
    }

    .welcome-text {
      margin: 12px 0 0;

      color: #777;

      font-size: 17px;

      font-weight: 600;
    }

    /* شريط صغير تركوازي */

    .accent {
      width: 70px;
      height: 7px;

      background: #32b8c4;

      border-radius: 20px;

      margin: 22px auto 0;
    }

    #message {
      text-align: center;

      margin-top: 15px;

      color: white;

      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 420px) {

      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .content {
        padding-top: 62px;
      }

      .logout {
        top: 18px;
        left: 14px;

        padding: 8px 13px;

        font-size: 12px;
      }

      .tree {
        font-size: 55px;
      }

      .subtitle {
        font-size: 19px;
      }

      .card,
      .welcome-card {
        border-radius: 26px;
      }

      .email {
        font-size: 17px;
      }
    }

  </style>
</head>

<body>

  <div class="page">

    <div class="circle-one"></div>
    <div class="circle-two"></div>

    <div class="star one">✦</div>
    <div class="star two">✦</div>
    <div class="star three">✦</div>

    <!-- تسجيل الخروج -->
    <button
      class="logout"
      id="logoutBtn">
      تسجيل الخروج
    </button>

    <main class="content">

      <section class="hero">

        <div class="tree">🌳</div>

        <h1 class="title">
          العراق الأخضر
        </h1>

        <p class="subtitle">
          أهلاً وسهلاً بك
        </p>

      </section>


      <section class="card">

        <h2 class="card-label">
          حسابك
        </h2>

        <div
          class="email"
          id="userEmail">
          جاري تحميل الحساب...
        </div>

      </section>


      <section class="welcome-card">

        <h2 class="welcome-title">
          مرحباً بك في العراق الأخضر
        </h2>

        <p class="welcome-text">
          حسابك مسجل بنجاح
        </p>

        <div class="accent"></div>

      </section>

      <div id="message"></div>

    </main>

  </div>


  <script type="module">

    import { auth } from "./js/firebase.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    const userEmail =
      document.getElementById("userEmail");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const message =
      document.getElementById("message");


    onAuthStateChanged(auth, (user) => {

      if (user) {

        userEmail.textContent =
          user.email || "حساب Google";

      } else {

        window.location.href = "index.html";

      }

    });


    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

        window.location.href = "index.html";

      } catch (error) {

        message.textContent =
          "حدث خطأ أثناء تسجيل الخروج.";

        console.error(error);

      }

    });

  </script>

</body>

</html>
