<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff4b00">
<title>MZAD PHONE - الرئيسية</title>
<style>
:root {
  --orange: #ff4b00;
  --text: #222;
  --muted: #858585;
  --cream: #f5eddf;
  --border: #e2e2e2;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: #fff;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
}
button,input { font: inherit; }
button { cursor: pointer; }
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100dvh;
  margin: auto;
  padding-bottom: calc(145px + env(safe-area-inset-bottom));
  overflow: hidden;
}
/* الهيدر */
.header {
  background: var(--orange);
  padding: calc(env(safe-area-inset-top) + 12px) 20px 28px;
  border-radius: 0 0 30px 30px;
  position: relative;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  min-height: 58px;
}
.brand {
  color: white;
  font-size: 19px;
  font-weight: 900;
  letter-spacing: -.5px;
}
.brand span { color: #fff2c9; }
.header-actions { display: flex; gap: 10px; align-items: center; }
.icon-btn {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: white;
  display: grid;
  place-items: center;
  color: #222;
  position: relative;
}
.icon-btn svg { width: 25px; height: 25px; }
.notification {
  position: absolute;
  top: -3px;
  left: -3px;
  background: #222;
  color: white;
  border: 2px solid var(--orange);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  font-size: 11px;
  display: grid;
  place-items: center;
}
.greeting { margin: 20px 0 17px; color: white; }
.greeting h1 { font-size: 25px; margin: 0 0 5px; font-weight: 900; }
.greeting p { font-size: 13px; margin: 0; opacity: .9; }
.search {
  height: 54px;
  border-radius: 30px;
  background: #fff;
  display: flex;
  align-items: center;
  padding: 0 17px;
  gap: 10px;
}
.search svg { width: 24px; height: 24px; flex-shrink: 0; color: #999; }
.search input {
  border: 0;
  outline: 0;
  width: 100%;
  min-width: 0;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  color: #222;
}
.search input::placeholder { color: #555; opacity: 1; }
/* الأقسام */
.categories {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 25px 20px 8px;
  scrollbar-width: none;
}
.categories::-webkit-scrollbar,.products::-webkit-scrollbar { display: none; }
.category {
  flex: 0 0 82px;
  border: 0;
  background: transparent;
  padding: 0;
  text-align: center;
  color: #222;
}
.category-icon {
  width: 82px;
  height: 86px;
  border-radius: 22px;
  background: var(--cream);
  display: grid;
  place-items: center;
  margin-bottom: 8px;
}
.category-icon svg { width: 53px; height: 53px; }
.category-name { font-size: 14px; font-weight: 800; white-space: nowrap; }
/* البانر */
.banner-wrap { padding: 24px 20px 0; }
.banner {
  border-radius: 26px;
  overflow: hidden;
  min-height: 220px;
  display: flex;
  background: var(--orange);
  color: white;
}
.banner-art {
  width: 43%;
  background: linear-gradient(145deg,#19684c,#083d2c);
  display: grid;
  place-items: center;
  padding: 12px;
}
.banner-art svg { width: 100%; max-width: 135px; }
.banner-content {
  flex: 1;
  padding: 27px 10px 20px;
  display: flex;
  align-items: center;
  flex-direction: column;
  text-align: center;
}
.banner-content h2 {
  margin: 8px 0 24px;
  color: #d6ff23;
  font-size: clamp(24px, 6vw, 34px);
  font-weight: 950;
  white-space: nowrap;
}
.banner-price {
  width: 100%;
  background: #371608;
  padding: 12px 5px;
  border-radius: 8px;
  font-size: clamp(14px, 3.5vw, 19px);
  font-weight: 900;
  white-space: nowrap;
}
.banner-content p { font-size: 13px; margin: 17px 0 0; }
.dots { display: flex; justify-content: center; gap: 9px; margin: 15px 0 27px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #ddd; border: 0; padding: 0; }
.dot.active { background: #222; }
/* المنتجات */
.section { margin-bottom: 30px; }
.section-heading {
  margin: 0 20px 16px;
  font-size: 25px;
  font-weight: 950;
}
.products {
  display: flex;
  gap: 11px;
  overflow-x: auto;
  padding: 0 20px 5px;
  scrollbar-width: none;
}
.product {
  flex: 0 0 112px;
  height: 126px;
  border: 1.5px solid var(--border);
  border-radius: 24px;
  position: relative;
  background: #fff;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding: 10px 5px;
}
.heart {
  position: absolute;
  top: 8px;
  left: 8px;
  border: 0;
  background: transparent;
  padding: 0;
  font-size: 24px;
  line-height: 1;
  color: #222;
}
.heart.active { color: var(--orange); }
.product-art { width: 59px; height: 65px; display: grid; place-items: center; margin-bottom: 6px; }
.product-art svg { width: 58px; height: 58px; }
.product-name { font-size: 13px; font-weight: 900; white-space: nowrap; }
.auction-info { display: none; }
/* شريط سفلي */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: calc(70px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: #fff;
  border-top: 1px solid #eee;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 5;
}
.nav-item {
  flex: 1;
  height: 100%;
  border: 0;
  background: transparent;
  color: #858585;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.nav-item svg { width: 26px; height: 26px; }
.nav-item span { font-size: 12px; }
.nav-item.active { color: var(--orange); }
.nav-item.active span { color: #222; font-weight: 900; }
.promo {
  position: fixed;
  bottom: calc(70px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  min-height: 55px;
  background: var(--orange);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  z-index: 4;
}
.promo-text { font-size: 12px; font-weight: 900; }
.promo button {
  background: white;
  color: #222;
  border: 0;
  border-radius: 7px;
  padding: 10px;
  font-size: 12px;
  font-weight: 900;
  white-space: nowrap;
}
.toast {
  position: fixed;
  z-index: 10;
  bottom: 145px;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: #fff;
  padding: 12px 17px;
  border-radius: 12px;
  font-size: 13px;
  display: none;
  white-space: nowrap;
}
.empty { display: none; padding: 20px; color: #777; text-align: center; }
@media (min-width: 481px) {
  body { background: #f2f2f2; }
  .app { background: white; }
}
</style>
</head>

<div class="toast" id="toast"></div>
<script>
const search = document.getElementById('searchInput');
const empty = document.getElementById('empty');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('.product').forEach(card => {
    const match = (card.dataset.name || '').toLowerCase().includes(q);
    card.style.display = match ? '' : 'none';
    if (match) shown++;
  });
  document.querySelectorAll('.category').forEach(card => {
    const match = (card.dataset.name || '').toLowerCase().includes(q);
    card.style.opacity = (!q || match) ? '1' : '.4';
  });
  empty.style.display = (q && shown === 0) ? 'block' : 'none';
});
function favorite(button) {
  button.classList.toggle('active');
  button.textContent = button.classList.contains('active') ? '♥' : '♡';
  notify(button.classList.contains('active') ? 'تمت الإضافة للمفضلة' : 'تمت الإزالة من المفضلة');
}
function nav(button, page) {
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  button.classList.add('active');
  notify(page);
}
let toastTimer;
function notify(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.style.display = 'none', 1800);
}
</script>
