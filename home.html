<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#6246d9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MZAD PHONE">
<link rel="manifest" href="/manifest.json">
<title>MZAD PHONE — الرئيسية</title>
<style>
/* ============ المتغيرات ============ */
:root{
  --bg:#f9f8fd;--ink:#17202a;--muted:#6b7280;--line:#ece8fb;--edge:#ddd8f8;
  --p:#6246d9;--p-dark:#4a34b8;--p-soft:#f3f0ff;--hot:#e8590c;--ok:#1e8a5a;--ok-soft:#e8f6ef;
  --safe-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
.page{width:min(100%,520px);margin:0 auto;padding:0 14px calc(76px + var(--safe-bottom));overflow-x:clip}

/* ============ أنميشن بسيط ============ */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shimmer{to{background-position:-200% 0}}
header{animation:fade .5s backwards}
.page>.section{animation:up .55s cubic-bezier(.2,.8,.3,1) backwards}
.page>.section:nth-of-type(1){animation-delay:.05s}
.page>.section:nth-of-type(2){animation-delay:.12s}
.page>.section:nth-of-type(3){animation-delay:.19s}
.page>.section:nth-of-type(4){animation-delay:.26s}
.page>.section:nth-of-type(5){animation-delay:.33s}
.page>.section:nth-of-type(6){animation-delay:.40s}
.category,.action-card,.dc,.ad-card,.icon-btn,.location-box,.nav-item{transition:transform .18s ease}
.category:active,.action-card:active,.dc:active,.ad-card:active{transform:scale(.97)}
.icon-btn:active,.location-box:active,.nav-item:active{transform:scale(.93)}

/* ============ الهيدر ============ */
header{margin-inline:-14px;padding:0 14px 14px;background:linear-gradient(145deg,#fff 0%,#f7f5ff 55%,#ece8ff 100%);
  border-radius:0 0 24px 24px;border-bottom:1px solid var(--line);box-shadow:0 10px 26px rgba(23,32,42,.06)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px 9px}
.topbar-side{display:flex;align-items:center;gap:8px}
.location-box{display:flex;align-items:center;gap:7px;padding:7px 5px;min-width:0}
.location-copy{min-width:0}
.location-label{display:block;color:#8a96a3;font-size:9px;line-height:1.2;margin-bottom:1px}
.location-name{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:850;line-height:1.2;white-space:nowrap}
.icon-btn{width:39px;height:34px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--p);box-shadow:0 7px 18px rgba(23,32,42,.045);flex:0 0 auto}
.brand-mini{display:flex;flex-direction:column;align-items:flex-start;line-height:.9;padding-inline:2px}
.brand-mini strong{font-size:16px;letter-spacing:-.03em}
.brand-mini span{font-size:7px;font-weight:800;letter-spacing:.15em;color:#8a96a3;margin-top:3px}
.search-wrap{position:relative;margin-top:1px}
.search{width:100%;height:45px;border:1.5px solid var(--edge);border-radius:15px;background:#fff;padding:0 44px 0 42px;outline:none;color:var(--ink);
  box-shadow:0 8px 22px rgba(98,70,217,.08);transition:border-color .25s,box-shadow .25s}
.search::placeholder{color:#a8b0bb}
.search:focus{border-color:#a99cf0;box-shadow:0 0 0 4px rgba(98,70,217,.10)}
.search-icon{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);width:21px;height:21px;pointer-events:none;color:var(--p)}
.search-clear{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);opacity:0;pointer-events:none;width:33px;height:33px;border-radius:11px;background:var(--p-soft);display:grid;place-items:center;transition:opacity .2s}
.search-wrap.has-value .search-clear{opacity:1;pointer-events:auto}

/* ============ الأقسام ============ */
.section{margin-top:20px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.section-title{margin:0;font-size:19px;letter-spacing:-.03em;font-weight:900}
.section-sub{display:block;margin-top:2px;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:0}
.section-link{font-size:11px;color:var(--p-dark);font-weight:800}

/* مساحة للظل داخل الشرائط الأفقية */
.horizontal,.ad-track,.rail{display:flex;width:auto;margin:-8px -10px -14px;padding:8px 10px 20px;scroll-padding-inline:10px;
  overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.horizontal::-webkit-scrollbar,.ad-track::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}

/* ============ التصنيفات ============ */
.horizontal{gap:12px;scroll-snap-type:x proximity}
.category{width:64px;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:5px;scroll-snap-align:start}
.category-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:#fff;border:1px solid var(--edge);box-shadow:0 8px 18px rgba(98,70,217,.08);color:#29393e;transition:background .25s,border-color .25s,box-shadow .25s}
.category.active .category-icon{border-color:#8977e9;background:var(--p-soft);box-shadow:0 10px 22px rgba(98,70,217,.18);color:var(--p-dark)}
.category-name{font-size:10px;font-weight:800;color:#354449;white-space:nowrap}
.category.active .category-name{color:var(--p-dark)}

/* ============ الإعلانات ============ */
.ad-track{gap:12px;scroll-snap-type:x mandatory}
.ad-card{position:relative;isolation:isolate;overflow:hidden;flex:0 0 100%;height:224px;min-height:200px;padding:14px 16px;border-radius:22px;border:1px solid var(--edge);
  scroll-snap-align:center;scroll-snap-stop:always;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  background:radial-gradient(circle at 0 0,rgba(98,70,217,.12),transparent 55%),linear-gradient(145deg,#fff 0%,#f7f5ff 60%,#efeaff 100%);
  box-shadow:0 10px 22px -8px rgba(98,70,217,.25)}
.ad-copy{max-width:56%;display:flex;flex-direction:column;gap:7px;position:relative;z-index:1}
.ad-top{display:flex;align-items:center;gap:8px}
.ad-badge{padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--edge);color:var(--p-dark);font-size:10px;font-weight:900}
.ad-kicker{font-size:11px;font-weight:800;color:var(--muted)}
.ad-title{margin:0;font-size:20px;font-weight:950;line-height:1.25;letter-spacing:-.03em}
.ad-text{margin:0;font-size:11.5px;font-weight:700;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ad-cta{align-self:flex-start;position:relative;z-index:1;padding:10px 18px;border-radius:12px;color:#fff;font-size:12px;font-weight:900;background:linear-gradient(145deg,#6246d9,#8b6cf0);box-shadow:0 6px 14px rgba(98,70,217,.25)}
.ad-dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.ad-dot{width:6px;height:6px;border-radius:50%;background:#d6d2ea;transition:.25s ease}
.ad-dot.active{width:19px;border-radius:999px;background:var(--p)}
.ad-art{position:absolute;inset-block:0;inset-inline-end:0;width:46%;pointer-events:none;z-index:0}
.ad-art svg{width:100%;height:100%;display:block}
.ad-art svg *{transform-box:fill-box;transform-origin:center}
.ad-art svg .grow{transform-origin:50% 100%}
.ad-art .float{animation:adfloat 3.2s ease-in-out infinite}
.ad-art .rise{animation:adrise 2.6s ease-in infinite}
.ad-art .grow{animation:adgrow 2.4s ease-in-out infinite}
.ad-art .twk{animation:adtwk 1.8s ease-in-out infinite}
.ad-art .ring{animation:adring 2.8s ease-out infinite}
.ad-art .pop{animation:adpop 3s ease-in-out infinite}
@keyframes adfloat{50%{transform:translateY(-6px)}}
@keyframes adrise{0%{opacity:0;transform:translateY(14px) scale(.8)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
@keyframes adgrow{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@keyframes adtwk{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes adring{0%{opacity:.55;transform:scale(.5)}100%{opacity:0;transform:scale(1.7)}}
@keyframes adpop{0%,12%{opacity:0;transform:scale(.3)}22%,85%{opacity:1;transform:none}100%{opacity:0;transform:scale(.3)}}

/* ============ الإجراءات ============ */
.actions-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.action-card{position:relative;overflow:hidden;min-height:105px;border-radius:18px;border:1px solid var(--edge);padding:13px 10px 12px;display:flex;flex-direction:column;justify-content:space-between;
  background:#fff;box-shadow:0 10px 24px -10px rgba(98,70,217,.22);text-align:start}
.action-card:before{content:"";position:absolute;width:72px;height:72px;border-radius:50%;top:-30px;right:-24px;background:rgba(98,70,217,.06)}
.action-icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--p-soft);color:var(--p-dark)}
.action-title{font-size:13px;font-weight:900}
.action-sub{font-size:10px;color:var(--muted);margin-top:2px}
.live-dot{position:absolute;top:12px;inset-inline-end:12px;width:9px;height:9px;border-radius:50%;background:var(--ok);animation:livepulse 1.6s infinite;z-index:1}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(30,138,90,.5)}70%{box-shadow:0 0 0 8px rgba(30,138,90,0)}100%{box-shadow:0 0 0 0 rgba(30,138,90,0)}}

/* ============ كروت الأجهزة (مميزة + أحدث: نفس التصميم) ============ */
.rail{gap:11px;scroll-snap-type:x mandatory}
.dc{position:relative;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;scroll-snap-align:start;animation:up .45s ease backwards}
.dc img{opacity:0;transition:opacity .35s ease}
.dc img.is-ready{opacity:1}

.fcard{flex:0 0 206px;height:296px;border-radius:26px;background:#1d2430;box-shadow:0 14px 28px -10px rgba(74,52,184,.5)}
.fmedia{position:absolute;inset:0;overflow:hidden;background:linear-gradient(160deg,#7b61e8,#3b2a92)}
.fmedia img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fmedia img.is-ready{animation:slowzoom 12s ease-in-out infinite alternate}
@keyframes slowzoom{from{transform:scale(1)}to{transform:scale(1.08)}}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,14,48,.96) 0%,rgba(20,14,48,.78) 34%,rgba(20,14,48,0) 66%)}
/* لمعة هادئة تمر على الكرت */
.fcard:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.13) 50%,transparent 58%);
  transform:translateX(130%);animation:sweep 8s ease-in-out infinite;animation-delay:calc(var(--i,0)*1.3s + 1s)}
@keyframes sweep{0%,55%{transform:translateX(130%)}100%{transform:translateX(-130%)}}

.fresh{position:absolute;top:10px;inset-inline-end:10px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.28);color:#fff;font-size:10px;font-weight:900;z-index:3}
.fbody{position:absolute;inset-inline:0;bottom:0;padding:12px 13px 13px;color:#fff;display:flex;flex-direction:column;gap:7px;z-index:2}
.fbody .cd{align-self:flex-start}
.ftitle{margin:0;font-size:16px;font-weight:950;line-height:1.25;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.specs{display:flex;flex-wrap:wrap;gap:5px}
.spec{padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.16);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-size:9.5px;font-weight:800;color:#fff}
.frow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-top:9px;border-top:1px solid rgba(255,255,255,.18)}
.frow small{display:block;font-size:9px;font-weight:800;color:#ffffffb3}
.frow b{display:block;margin-top:1px;font-size:15px;font-weight:950;white-space:nowrap}

.type{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:900;white-space:nowrap}
.type.auc{background:var(--p);color:#fff}
.type.dir{background:rgba(255,255,255,.95);color:var(--ok)}

.cd{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:#fff;font-size:10px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr}
.cd:before{content:"";width:6px;height:6px;border-radius:50%;background:#7CFFB2;animation:pulse2 1.6s infinite}
.cd.urgent{background:rgba(232,89,12,.94)}
.cd.urgent:before{background:#fff}
@keyframes pulse2{50%{opacity:.3}}

.favorite-btn{position:absolute;top:9px;inset-inline-start:9px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;padding:0;
  background:rgba(255,255,255,.96);color:#7b7f84;box-shadow:0 5px 13px rgba(23,32,42,.15);z-index:10;transition:transform .18s,color .2s}
.favorite-btn:active{transform:scale(.85)}
.favorite-btn svg{width:18px;height:18px}
.favorite-btn.active{color:#e5365f}
.favorite-btn.active svg{fill:currentColor}
.no-img{position:absolute;inset:0;display:grid;place-items:center}
.no-img svg{width:44px;height:44px;opacity:.5}

/* هيكل التحميل + الحالات الفارغة */
.sk{flex:0 0 206px;height:296px;border-radius:26px;border:1px solid var(--line);scroll-snap-align:start;
  background:linear-gradient(90deg,#f1eefb 25%,#faf8ff 50%,#f1eefb 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.state-card{flex:1 0 100%;border:1px dashed var(--edge);border-radius:20px;background:#fff;padding:26px 16px;text-align:center}
.state-card h3{margin:0;font-size:14px;font-weight:900}
.state-card p{margin:5px 0 0;font-size:11px;font-weight:700;color:var(--muted)}
.retry{margin-top:12px;padding:9px 18px;border-radius:12px;background:var(--p);color:#fff;font-size:12px;font-weight:900}

/* ============ الثقة ============ */
.trust-card{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:8px 7px;background:#fff;border:1px solid var(--edge);border-radius:18px;margin-top:2px;min-height:112px}
.trust-item{text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.trust-icon{width:29px;height:29px;margin:0 auto 3px;border-radius:10px;background:var(--p-soft);display:grid;place-items:center;color:var(--p-dark)}
.trust-title{font-size:10px;font-weight:900;line-height:1.25}
.trust-copy{font-size:8px;color:var(--muted);margin-top:1px;line-height:1.3;white-space:nowrap}

/* ============ الشريط السفلي (القصير) ============ */
.bottom-wrap{position:fixed;left:0;right:0;bottom:-6px;width:100%;padding:6px 12px calc(6px + var(--safe-bottom));z-index:100;pointer-events:none}
.bottom-nav{width:min(100%,500px);margin:0 auto;min-height:54px;padding:4px;border-radius:19px;background:rgba(255,255,255,.96);border:1px solid var(--line);
  box-shadow:0 8px 24px rgba(23,32,42,.10);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);pointer-events:auto}
.bottom-inner{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;align-items:center}
.nav-item{min-width:0;min-height:46px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:#7e8992}
.nav-item.active{color:var(--p-dark);background:var(--p-soft)}
.nav-icon{width:19px;height:19px;flex:0 0 19px}
.nav-item>span:not(.add-button){font-size:8.5px;line-height:1;font-weight:900;white-space:nowrap}
.add-button{width:34px;height:34px;flex:0 0 34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#6246d9,#8b6cf0);color:#fff;box-shadow:0 5px 12px rgba(98,70,217,.3)}
.add-button svg{width:19px;height:19px}

/* ============ التوست ============ */
.toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-bottom));transform:translateX(-50%) translateY(16px);max-width:calc(100% - 40px);padding:10px 14px;border-radius:13px;
  background:#1e2c30;color:#fff;font-size:11px;font-weight:800;box-shadow:0 14px 34px rgba(24,44,49,.14);opacity:0;pointer-events:none;transition:.25s ease;z-index:120;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:360px){.nav-icon{width:18px;height:18px}.nav-item>span:not(.add-button){font-size:8px}.fcard,.sk{flex-basis:192px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="page">

<header>
  <div class="topbar">
    <div class="topbar-side">
      <div class="brand-mini"><strong>MZAD</strong><span>PHONE</span></div>
      <button class="icon-btn" id="notificationBtn" type="button" aria-label="الإشعارات">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
      </button>
    </div>
    <button class="location-box" id="locationBtn" type="button">
      <div class="location-copy">
        <span class="location-label">موقعك الحالي</span>
        <span class="location-name">النجف
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--p)" stroke-width="2"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
    </button>
  </div>

  <div class="search-wrap" id="searchWrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="searchInput" class="search" type="search" autocomplete="off" inputmode="search" placeholder='ابحث عن جهاز، مثل "iPhone 15 Pro"' aria-label="البحث عن جهاز">
    <button id="searchClear" class="search-clear" type="button" aria-label="مسح البحث">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 7l10 10M17 7 7 17"/></svg>
    </button>
  </div>
</header>

<!-- التصنيفات -->
<section class="section">
  <div class="section-head">
    <h2 class="section-title">التصنيفات</h2>
    <a class="section-link" href="market.html">عرض الكل</a>
  </div>
  <div class="horizontal" id="categories"></div>
</section>

<!-- الإعلانات -->
<section class="section" id="adsSection" hidden>
  <div class="ad-track" id="adTrack"></div>
  <div class="ad-dots" id="adDots"></div>
</section>

<!-- الإجراءات -->
<section class="section">
  <div class="actions-grid">

    <button class="action-card" data-go="auctions.html">
      <i class="live-dot" id="liveDot" hidden></i>
      <span class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m14 13-8.5 8.5a2.12 2.12 0 0 1-3-3L11 10"/><path d="m16 16 6-6"/><path d="m8 8 6-6"/><path d="m9 7 8 8"/><path d="m21 11-8-8"/></svg>
      </span>
      <span><span class="action-title">المزادات</span><br><span class="action-sub" id="auctionsSub">شاهد الأجهزة</span></span>
    </button>

    <button class="action-card" data-go="sell-auction.html">
      <span class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </span>
      <span><span class="action-title">بيع مزاد</span><br><span class="action-sub">اعرض جهازك بالمزاد</span></span>
    </button>

    <button class="action-card" data-go="sell.html">
      <span class="action-icon">

async function isLoggedIn(){
  try{

    return !!data?.session;
  }catch(error){

  if(await isLoggedIn()){ go(url); return; }

/* ================================
   SEARCH
================================ */
function normalizeArabicSearch(value){
  return String(value || "")
    .toLowerCase().normalize("NFKC")
    .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
    .replace(/ئ/g,"ي").replace(/ؤ/g,"و").replace(/ـ/g,"")
    .replace(/[\u064B-\u065F\u0670]/g,"")
    .replace(/\s+/g," ").trim();
}

const ALIASES = [
  [/ايفون/g,"iphone"],[/ايفن/g,"iphone"],[/ابل/g,"apple"],[/سامسونج/g,"samsung"],[/سامسنك/g,"samsung"],
  [/جوجل/g,"google"],[/قوقل/g,"google"],[/هواوي/g,"huawei"],[/شاومي/g,"xiaomi"],[/شياومي/g,"xiaomi"],
  [/ون بلس/g,"oneplus"],[/اوبو/g,"oppo"],[/هونر/g,"honor"],[/ريلمي/g,"realme"],[/موتورولا/g,"motorola"],
  [/نوكيا/g,"nokia"],[/سوني/g,"sony"],[/تكنو/g,"tecno"],[/انفنكس/g,"infinix"]
];

function arabicBrandAliases(value){
  let text = normalizeArabicSearch(value);
  ALIASES.forEach(([pattern, replacement]) => { text = text.replace(pattern, replacement); });
  return text;
}

function buildSearchVariants(value){
  const raw = String(value || "").trim();
  if(!raw) return [];
  const branded = arabicBrandAliases(raw);
  const englishDigits = branded.replace(/[٠-٩]/g, d => String("٠١٢٣٤٥٦٧٨٩".indexOf(d)));
  return [...new Set([raw, normalizeArabicSearch(raw), branded, englishDigits].map(v => v.trim()).filter(Boolean))];
}

function bindSearch(){
  const sync = () => searchWrap.classList.toggle("has-value", searchInput.value.trim().length > 0);

  function performSearch(){
    const query = searchInput.value.trim();
    if(!query){ showToast("اكتب اسم الجهاز أولاً"); return; }
    sessionStorage.setItem("mzad_search_query", query);
    sessionStorage.setItem("mzad_search_variants", JSON.stringify(buildSearchVariants(query)));
    go(`market.html?search=${encodeURIComponent(query)}`);
  }

  searchInput.addEventListener("input", sync);
  searchClear.addEventListener("click", () => { searchInput.value = ""; sync(); searchInput.focus(); });
  searchInput.addEventListener("keydown", event => {
    if(event.key !== "Enter") return;
    event.preventDefault();
    performSearch();
  });
  searchInput.addEventListener("search", () => { if(searchInput.value.trim()) performSearch(); });
}

/* ================================

================================ */
const normalizeText = v => (v === null || v === undefined) ? "" : String(v).trim();
const isAuction = d => String(d.sale_type || "").toLowerCase().includes("auction");
const deviceName = d => [d.brand, d.model].filter(Boolean).join(" ") || "جهاز";

function getDeviceImages(images){
  if(!images) return [];
  if(Array.isArray(images)) return images.filter(Boolean);
  if(typeof images === "string"){
    const value = images.trim();
    if(!value) return [];
    try{
      const parsed = JSON.parse(value);
      if(Array.isArray(parsed)) return parsed.filter(Boolean);
    }catch(error){}
    return [value];
  }
  return [];
}

function getDeviceImageUrl(path){
  if(!path) return "";
  const value = String(path).trim();
  if(/^(https?:|data:)/.test(value)) return value;
  const { data } = supabase.storage.from("device-images").getPublicUrl(value);
  return data?.publicUrl || "";
}

function formatDevicePrice(price){
  const number = Number(price);
  if(!Number.isFinite(number)) return "السعر غير محدد";
  return new Intl.NumberFormat("en-US").format(number) + " د.ع";
}

/* ================================
   المؤقت الحي للمزادات
================================ */
function fmtLeft(ms){
  if(ms <= 0) return "انتهى";
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  const p = n => String(n).padStart(2, "0");
  return d > 0 ? `${d} يوم ${h} س` : `${p(h)}:${p(m)}:${p(sec)}`;
}

function tickTimers(){
  const now = Date.now();
  document.querySelectorAll("[data-end]").forEach(el => {
    const left = new Date(el.dataset.end).getTime() - now;
    el.textContent = fmtLeft(left);
    el.classList.toggle("urgent", left > 0 && left < 3600e3);
  });
}

      <div class="frow">
        <div><small>${auction ? "السعر الحالي" : "السعر"}</small><b>${esc(formatDevicePrice(d.price))}</b></div>
        ${auction ? '<span class="type auc">مزاد</span>' : '<span class="type dir">بيع مباشر</span>'}
      </div>
    </div>
  </article>`;
}

const featuredCard = (d, i, f) => deviceCard(d, i, f);
const latestCard   = (d, i, f) => deviceCard(d, i, f, { showFresh: true });

/* ================================
   FEATURED SCORE
================================ */
function storageToNumber(value){
  const match = normalizeText(value).toUpperCase().match(/(\d+(?:\.\d+)?)\s*(TB|GB)/);
  if(!match) return 0;
  const number = Number(match[1]);
  if(!Number.isFinite(number)) return 0;
  return match[2] === "TB" ? number * 1024 : number;
}

function scoreFeaturedDevice(device){
  let score = 0;
  const images = getDeviceImages(device.images);
  if(images.length >= 2) score += 2;
  if(images.length >= 4) score += 1;

  const battery = parseFloat(String(device.battery_health || "").replace("%",""));
  if(Number.isFinite(battery)){
    if(battery >= 95) score += 4;
    else if(battery >= 90) score += 3;
    else if(battery >= 85) score += 1;
  }

  const condition = normalizeText(device.condition).toLowerCase();
  if(["ممتاز","excellent","جيد جدا","جيد جدًا","very good"].some(w => condition.includes(w))) score += 4;
  else if(["جيد","good"].some(w => condition.includes(w))) score += 2;

  const great = v => ["ممتاز","excellent","جديد"].some(w => normalizeText(v).toLowerCase().includes(w));
  if(great(device.screen_condition)) score += 2;
  if(great(device.body_condition)) score += 2;

  const completeness = [device.brand, device.model, device.storage, device.color, device.price, device.location, device.condition, device.screen_condition, device.body_condition, device.notes]
    .filter(v => normalizeText(v)).length;
  if(completeness >= 7) score += 2;
  if(completeness >= 9) score += 1;

  const storage = storageToNumber(device.storage);
  if(storage >= 512) score += 2;
  else if(storage >= 256) score += 1;

  return score;
}

/* ================================
   RENDER
================================ */
function skeletons(trackId, n = 3){
  $(trackId).innerHTML = Array.from({ length: n }, () => '<div class="sk"></div>').join("");
}

function showState(trackId, title, copy, retry){
  $(trackId).innerHTML = `
    <div class="state-card">
      <h3>${esc(title)}</h3><p>${esc(copy)}</p>
      ${retry ? '<button class="retry" type="button" data-retry>إعادة المحاولة</button>' : ""}
    </div>`;
}

function renderRail(trackId, devices, builder){
  const track = $(trackId);
  const favs = getFavs();
  track.innerHTML = devices.map((d, i) => builder(d, i, favs)).join("");
  bindRail(track);
  tickTimers();
}

/* ================================
   LOAD
================================ */
const COLS = "id,created_at,brand,model,storage,color,battery_health,price,condition,screen_condition,body_condition,location,sale_type,images,notes";

async function fetchDevices(){
  let res = await supabase.from("devices").select(COLS + ",ends_at")
    .order("created_at", { ascending: false }).limit(40);
  let hasEnds = true;

  if(res.error){          // العمود ends_at مو موجود بعد؟ نرجع للطريقة القديمة
    hasEnds = false;
    res = await supabase.from("devices").select(COLS)
      .order("created_at", { ascending: false }).limit(40);
  }
  return { data: res.data || [], error: res.error, hasEnds };
}

async function loadLiveCount(hasEnds){
  try{
    let q = supabase.from("devices").select("id", { count: "exact", head: true }).ilike("sale_type", "%auction%");
    if(hasEnds) q = q.gt("ends_at", new Date().toISOString());
    const { count, error } = await q;
    if(error || !count) return;
    $("liveDot").hidden = false;
    $("auctionsSub").textContent = `${count} مزاد مباشر الآن`;
  }catch(error){
    console.error("LIVE AUCTIONS ERROR:", error);
  }
}

async function loadDevices(){
  skeletons("featuredTrack");
  skeletons("latestTrack");

  try{
    const { data, error, hasEnds } = await fetchDevices();

    if(error){
      console.error("HOME DEVICES ERROR:", error);
      $("featuredSection").hidden = true;
      showState("latestTrack", "تعذر تحميل الأجهزة", "تأكد من الاتصال وحاول مرة ثانية", true);
      return;
    }

    const now = Date.now();
    const byDate = (a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0);

    /* نشيل المزادات المنتهية */
    const devices = data.filter(d => !(isAuction(d) && d.ends_at && new Date(d.ends_at).getTime() <= now));

    /* مميزة */
    const featured = devices
      .map(device => ({ device, score: scoreFeaturedDevice(device) }))
      .sort((a, b) => b.score - a.score || byDate(a.device, b.device))
      .filter(item => item.score >= 5)
      .slice(0, 5)
      .map(item => item.device);

    if(featured.length){
      $("featuredSection").hidden = false;
      renderRail("featuredTrack", featured, featuredCard);
    }else{
      $("featuredSection").hidden = true;
    }

    /* أحدث */
    const featuredIds = new Set(featured.map(d => String(d.id)));
    const latest = [...devices].sort(byDate).filter(d => !featuredIds.has(String(d.id))).slice(0, 8);

    if(latest.length) renderRail("latestTrack", latest, latestCard);
    else showState("latestTrack", "لا توجد أجهزة حالياً", "عند نشر جهاز جديد سيظهر هنا", false);

    loadLiveCount(hasEnds);
  }catch(error){
    console.error("HOME DEVICES LOAD ERROR:", error);
    $("featuredSection").hidden = true;
    showState("latestTrack", "تعذر تحميل الأجهزة", "تأكد من الاتصال وحاول مرة ثانية", true);
  }
}

document.addEventListener("click", event => {
  if(event.target.closest("[data-retry]")) loadDevices();
});

/* ================================
   RAIL (سحب + تشغيل تلقائي)
================================ */
function bindRail(track){
  const cards = [...track.querySelectorAll(".dc")];

  /* المفضلة */
  if(!track.dataset.favBound){
    track.dataset.favBound = "1";
    track.addEventListener("click", async event => {
      const btn = event.target.closest(".favorite-btn");
      if(!btn) return;
      event.preventDefault();
      event.stopPropagation();

      if(!(await isLoggedIn())){ await requireAuth("favorites.html"); return; }

      const id = btn.dataset.fav;
      const favs = getFavs();
      const on = !favs.has(id);
      on ? favs.add(id) : favs.delete(id);
      saveFavs(favs);

      document.querySelectorAll(`.favorite-btn[data-fav="${CSS.escape(id)}"]`)
        .forEach(b => b.classList.toggle("active", on));
      showToast(on ? "تمت إضافة الجهاز إلى المفضلة" : "تمت إزالة الجهاز من المفضلة");
    });
  }

  bindCardClicks(track);
  if(cards.length < 2) return;

  let current = 0;
  function goToCard(index){
    current = (index + cards.length) % cards.length;
    track.scrollTo({ left: cards[current].offsetLeft - track.offsetLeft, behavior: "smooth" });
  }

  clearInterval(track._timer);
  track._restart = () => {
    clearInterval(track._timer);
    track._timer = setInterval(() => goToCard(current + 1), 10000);
  };

  if(!track.dataset.touchBound){
    track.dataset.touchBound = "1";
    track.addEventListener("touchstart", () => clearInterval(track._timer), { passive: true });
    track.addEventListener("touchend", () => track._restart && track._restart(), { passive: true });
  }

  track._restart();
}

function bindCardClicks(track){
  if(track.dataset.clickBound) return;
  track.dataset.clickBound = "1";

  let touchStarted = false, touchMoved = false, startX = 0, startY = 0, suppressClickUntil = 0;

  track.addEventListener("touchstart", event => {
    const t = event.touches[0];
    touchStarted = true; touchMoved = false; startX = t.clientX; startY = t.clientY;
  }, { passive: true });

  track.addEventListener("touchmove", event => {
    if(!touchStarted) return;
    const t = event.touches[0];
    if(Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) touchMoved = true;
  }, { passive: true });

  track.addEventListener("touchend", event => {
    if(!touchStarted) return;
    const t = event.changedTouches[0];
    if(Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) touchMoved = true;
    if(touchMoved) suppressClickUntil = Date.now() + 700;
    touchStarted = false;
  }, { passive: true });

  track.addEventListener("touchcancel", () => { touchStarted = false; touchMoved = false; }, { passive: true });

  track.addEventListener("click", event => {
    if(event.target.closest(".favorite-btn")) return;
    const card = event.target.closest(".dc");
    if(!card) return;
    if(touchMoved || Date.now() < suppressClickUntil){ event.preventDefault(); event.stopPropagation(); return; }
    const id = card.dataset.id;
    if(id) go(`device.html?id=${encodeURIComponent(id)}`);
  }, true);
}
