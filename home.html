<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>العراق الأخضر</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eef8f0;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 22px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      margin-bottom: 18px;
    }

    .logo {
      font-size: 45px;
    }

    h1 {
      margin: 8px 0;
      color: #16833b;
      font-size: 26px;
    }

    .welcome {
      color: #777;
      font-size: 15px;
    }

    .box {
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      margin-bottom: 18px;
    }

    .box h2 {
      margin-top: 0;
      color: #16833b;
      font-size: 20px;
    }

    .email {
      background: #f4f7f5;
      padding: 14px;
      border-radius: 12px;
      color: #555;
      word-break: break-word;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #16833b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      color: #16833b;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">🌳</div>

      <h1>العراق الأخضر</h1>

      <div class="welcome">
        أهلاً وسهلاً بك
      </div>
    </div>

    <div class="box">

      <h2>حسابك</h2>

      <div class="email" id="userEmail">
        جاري تحميل الحساب...
      </div>

    </div>

    <div class="box">

      <button id="logoutBtn">
        تسجيل الخروج
      </button>

      <div id="message"></div>

    </div>

  </div>

  <script type="module">

    import { auth } from "./js/firebase.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    const userEmail = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");
    const message = document.getElementById("message");

    onAuthStateChanged(auth, (user) => {

      if (user) {

        userEmail.textContent = user.email || "حساب Google";

      } else {

        window.location.href = "index.html";

      }

    });

    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

        window.location.href = "index.html";

      } catch (error) {

        message.textContent = "حدث خطأ أثناء تسجيل الخروج.";

        console.error(error);

      }

    });

  </script>

</body>
</html>
