<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#176b87">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MZAD PHONE">
<link rel="manifest" href="/manifest.json">
<title>MZAD PHONE — الرئيسية</title>
<style>
:root{--bg:#f7f8fa;--surface:#fff;--surface-2:#eef3f7;--ink:#17202a;--muted:#667085;--line:#e6e9ed;--primary:#176b87;--primary-dark:#125a73;--primary-soft:#e8f3f6;--purple:#6246d9;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
.page{width:min(100%,520px);margin:0 auto;padding:0 14px calc(82px + var(--safe-bottom))}

/* HEADER */
header{margin-inline:-14px;padding:0 14px 14px;background:linear-gradient(145deg,#fff 0%,#f5f2ff 45%,#e6e1ff 100%);border-radius:0 0 24px 24px;border-bottom:1px solid var(--line);box-shadow:0 10px 26px rgba(23,32,42,.06)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px 9px}
.topbar-side{display:flex;align-items:center;gap:8px}
.location-box{display:flex;align-items:center;gap:7px;padding:7px 5px;min-width:0}
.location-copy{min-width:0}
.location-label{display:block;color:#8a96a3;font-size:9px;line-height:1.2;margin-bottom:1px}
.location-name{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:850;line-height:1.2;white-space:nowrap}
.icon-btn{width:39px;height:34px;display:grid;place-items:center;border:1px solid #d8d0f5;border-radius:12px;background:#fff;color:var(--primary);box-shadow:0 7px 18px rgba(23,32,42,.045);flex:0 0 auto}
.brand-mini{display:flex;flex-direction:column;align-items:flex-start;line-height:.9;padding-inline:2px}
.brand-mini strong{font-size:16px;letter-spacing:-.03em}
.brand-mini span{font-size:7px;font-weight:800;letter-spacing:.15em;color:#8a96a3;margin-top:3px}
.search-wrap{position:relative;margin-top:1px}
.search{width:100%;height:45px;border:1px solid #9edfe3;border-radius:15px;background:#fff;padding:0 44px 0 42px;outline:none;color:var(--ink);box-shadow:0 8px 22px rgba(18,57,62,.09),0 5px 20px rgba(109,92,231,.13)}
.search::placeholder{color:#9ba6aa}
.search:focus{border-color:#8bd3d9;box-shadow:0 12px 28px rgba(33,152,164,.10)}
.search-icon{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);width:21px;height:21px;pointer-events:none}
.search-clear{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);opacity:0;pointer-events:none;width:33px;height:33px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center}
.search-wrap.has-value .search-clear{opacity:1;pointer-events:auto}

/* SECTIONS */
.section{margin-top:20px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.section-title{margin:0;font-size:19px;letter-spacing:-.03em;font-weight:900}
.section-link{font-size:11px;color:var(--primary-dark);font-weight:800}

/* CATEGORIES */
.horizontal{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.horizontal::-webkit-scrollbar{display:none}
.category{width:64px;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:5px;scroll-snap-align:start}
.category-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#fff 0%,#f4f1ff 100%);border:1px solid #ddd8f8;box-shadow:0 8px 18px rgba(98,70,217,.09);color:#29393e;position:relative;overflow:hidden}
.category-icon:before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;top:6px;inset-inline-end:7px;background:rgba(98,70,217,.10)}
.category-icon:after{content:"";position:absolute;width:6px;height:6px;border-radius:2px;bottom:7px;inset-inline-start:7px;background:rgba(23,107,135,.10)}
.category-icon>*{position:relative;z-index:1}
.category.active .category-icon{border-color:#8977e9;background:linear-gradient(145deg,#f7f5ff 0%,#e8e3ff 100%);box-shadow:0 10px 22px rgba(98,70,217,.20);color:var(--primary-dark)}
.category-name{font-size:10px;font-weight:800;color:#354449;white-space:nowrap}
.category.active .category-name{color:var(--primary-dark)}

/* ADS */
.ad-track{display:flex;gap:12px;width:100%;overflow-x:auto;padding:1px 2px 6px;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.ad-track::-webkit-scrollbar{display:none}
.ad-card{position:relative;isolation:isolate;overflow:hidden;flex:0 0 100%;height:188px;min-height:166px;padding:12px 14px;border-radius:22px;border:1px solid #ddd8f8;scroll-snap-align:center;scroll-snap-stop:always;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:radial-gradient(circle at 0 0,rgba(98,70,217,.14),transparent 55%),linear-gradient(145deg,#fff 0%,#f6f3ff 55%,#ece7ff 100%);box-shadow:0 12px 28px rgba(98,70,217,.10)}
.ad-copy{max-width:58%;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.ad-top{display:flex;align-items:center;gap:8px}
.ad-badge{padding:3px 9px;border-radius:999px;background:#fff;border:1px solid #ddd8f8;color:#4a34b8;font-size:9px;font-weight:900}
.ad-kicker{font-size:10px;font-weight:800;color:var(--muted)}
.ad-title{margin:0;font-size:17px;font-weight:950;line-height:1.25;letter-spacing:-.03em}
.ad-text{margin:0;font-size:10.5px;font-weight:700;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad-cta{align-self:flex-start;position:relative;z-index:1;padding:8px 14px;border-radius:12px;color:#fff;font-size:11px;font-weight:900;background:linear-gradient(145deg,#6246d9,#8b6cf0);box-shadow:0 6px 14px rgba(98,70,217,.25)}
.ad-dots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.ad-dot{width:6px;height:6px;border-radius:50%;background:#d6d2ea;transition:.2s ease}
.ad-dot.active{width:19px;border-radius:999px;background:var(--purple)}

/* AD ART (رسوم متحركة) */
.ad-art{position:absolute;inset-block:0;inset-inline-end:0;width:44%;pointer-events:none;z-index:0}
.ad-art svg{width:100%;height:100%;display:block}
.ad-art svg *{transform-box:fill-box;transform-origin:center}
.ad-art svg .grow{transform-origin:50% 100%}
.ad-art .float{animation:adfloat 3.2s ease-in-out infinite}
.ad-art .rise{animation:adrise 2.6s ease-in infinite}
.ad-art .grow{animation:adgrow 2.4s ease-in-out infinite}
.ad-art .twk{animation:adtwk 1.8s ease-in-out infinite}
.ad-art .ring{animation:adring 2.8s ease-out infinite}
.ad-art .pop{animation:adpop 3s ease-in-out infinite}
@keyframes adfloat{50%{transform:translateY(-6px)}}
@keyframes adrise{0%{opacity:0;transform:translateY(14px) scale(.8)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
@keyframes adgrow{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@keyframes adtwk{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes adring{0%{opacity:.55;transform:scale(.5)}100%{opacity:0;transform:scale(1.7)}}
@keyframes adpop{0%,12%{opacity:0;transform:scale(.3)}22%,85%{opacity:1;transform:none}100%{opacity:0;transform:scale(.3)}}

/* ACTIONS */
.actions-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.action-card{position:relative;overflow:hidden;min-height:105px;border-radius:18px;border:1px solid #ddd8f8;padding:13px 10px 12px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#fff 0%,#f4f1ff 48%,#e7e1ff 100%);box-shadow:0 12px 28px rgba(98,70,217,.09);text-align:start}
.action-card:before{content:"";position:absolute;width:72px;height:72px;border-radius:50%;top:-30px;right:-24px;background:rgba(98,70,217,.08)}
.action-icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-dark)}
.action-title{font-size:13px;font-weight:900}
.action-sub{font-size:10px;color:var(--muted);margin-top:2px}
.live-dot{position:absolute;top:12px;inset-inline-end:12px;width:9px;height:9px;border-radius:50%;background:#1e8a5a;animation:livepulse 1.6s infinite;z-index:1}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(30,138,90,.5)}70%{box-shadow:0 0 0 8px rgba(30,138,90,0)}100%{box-shadow:0 0 0 0 rgba(30,138,90,0)}}

/* DEVICES */
.featured-devices-track{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 5px;scrollbar-width:none;scroll-behavior:smooth;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.featured-devices-track::-webkit-scrollbar{display:none}
.featured-devices-track .device-card{flex:0 0 168px;height:286px;display:flex;flex-direction:column;border:1px solid #dfe4e8;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 8px 20px rgba(23,32,42,.08);scroll-snap-align:start;cursor:pointer;position:relative}
.featured-devices-track .device-image{height:142px;flex:0 0 142px;display:block;position:relative;overflow:hidden;background:#f3f5f6;border-bottom:1px solid #e5e8eb}
.featured-devices-track .device-image img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;opacity:0;transition:opacity .18s ease;background:#f3f5f6}
.featured-devices-track .device-image img.is-ready{opacity:1}
.featured-devices-track .device-body{position:relative;flex:1;min-height:0;overflow:hidden;padding:10px 11px;background:#fff}
.featured-devices-track .device-title{margin:0;font-size:14px;font-weight:900;line-height:1.3;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.featured-devices-track .device-meta{margin-top:6px;color:#68747c;font-size:10px;line-height:1.55;font-weight:750;min-height:30px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.featured-devices-track .device-time{margin-top:3px;color:#9aa3aa;font-size:8.5px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.featured-devices-track .device-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:7px;padding-top:7px;border-top:1px solid #edf0f2}
.featured-devices-track .device-price{color:var(--primary);font-size:12.5px;font-weight:950;white-space:nowrap}
.featured-devices-track .device-type{color:var(--primary);background:#eaf6f8;font-size:8.5px;padding:5px 6px;border-radius:8px;white-space:nowrap}
.featured-devices-track .favorite-btn{position:absolute;top:8px;inset-inline-start:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;padding:0;background:rgba(255,255,255,.97);color:#7b7f84;box-shadow:0 5px 13px rgba(23,32,42,.11);z-index:10}
.featured-devices-track .favorite-btn svg{width:19px;height:19px}
.featured-devices-track .favorite-btn.active{color:var(--purple)}

/* TRUST */
.trust-card{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:8px 7px;background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:2px;min-height:112px}
.trust-item{text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.trust-icon{width:29px;height:29px;margin:0 auto 3px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:#466066}
.trust-title{font-size:10px;font-weight:900;line-height:1.25}
.trust-copy{font-size:8px;color:var(--muted);margin-top:1px;line-height:1.3;white-space:nowrap}

/* BOTTOM NAV */
.bottom-wrap{position:fixed;left:0;right:0;bottom:-7px;width:100%;padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));z-index:100;pointer-events:none}
.bottom-nav{position:relative;width:min(100%,520px);margin:0 auto;min-height:64px;padding:5px;border-radius:20px;background:rgba(255,255,255,.97);border:1px solid #e7ecef;box-shadow:0 10px 28px rgba(23,32,42,.10);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);pointer-events:auto}
.bottom-inner{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;align-items:center}
.nav-item{min-width:0;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:15px;background:transparent;color:#7e8992}
.nav-item.active{color:#176b87;background:#eaf6f8}
.nav-icon{width:20px;height:20px;flex:0 0 20px;color:currentColor}
.nav-item>span:not(.add-button){margin:0;font-size:8.5px;line-height:1;font-weight:900;white-space:nowrap}
.add-button{width:38px;height:38px;flex:0 0 38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#176b87,#32b8c4);color:#fff;box-shadow:0 6px 14px rgba(23,107,135,.18)}
.add-button svg{width:20px;height:20px}

/* TOAST */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);max-width:calc(100% - 40px);padding:10px 14px;border-radius:13px;background:#1e2c30;color:#fff;font-size:11px;font-weight:800;box-shadow:0 14px 34px rgba(24,44,49,.12);opacity:0;pointer-events:none;transition:.25s ease;z-index:120;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:360px){.bottom-wrap{bottom:-6px;padding-left:8px;padding-right:8px}.bottom-nav{border-radius:18px}.nav-item{min-height:50px;border-radius:14px}.nav-icon{width:19px;height:19px;flex-basis:19px}.nav-item>span:not(.add-button){font-size:8px}}
@media(prefers-reduced-motion:reduce){.live-dot{animation:none}.ad-dot,.toast{transition:none}.ad-art svg *{animation:none!important}}
</style>
</head>
<body>

<main class="page">

<header>
  <div class="topbar">
    <div class="topbar-side">
      <div class="brand-mini"><strong>MZAD</strong><span>PHONE</span></div>
      <button class="icon-btn" id="notificationBtn" type="button" aria-label="الإشعارات">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
      </button>
    </div>
    <button class="location-box" id="locationBtn" type="button">
      <div class="location-copy">
        <span class="location-label">موقعك الحالي</span>
        <span class="location-name">النجف
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
    </button>
  </div>

  <div class="search-wrap" id="searchWrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="searchInput" class="search" type="search" autocomplete="off" inputmode="search" placeholder='ابحث عن جهاز، مثل "iPhone 15 Pro"' aria-label="البحث عن جهاز">
    <button id="searchClear" class="search-clear" type="button" aria-label="مسح البحث">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 7l10 10M17 7 7 17"/></svg>
    </button>
  </div>
</header>

<!-- CATEGORIES -->
<section class="section">
  <div class="section-head">
    <h2 class="section-title">التصنيفات</h2>
    <a class="section-link" href="market.html">عرض الكل</a>
  </div>
  <div class="horizontal" id="categories"></div>
</section>

<!-- ADS: يظهر فقط إذا كو إعلانات -->
<section class="section" id="adsSection" hidden>
  <div class="ad-track" id="adTrack"></div>
  <div class="ad-dots" id="adDots"></div>
</section>

<!-- ACTIONS -->
<section class="section">
  <div class="actions-grid">

    <button class="action-card" data-go="auctions.html">
      <i class="live-dot" id="liveDot" hidden></i>
      <span class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m14 13-8.5 8.5a2.12 2.12 0 0 1-3-3L11 10"/><path d="m16 16 6-6"/><path d="m8 8 6-6"/><path d="m9 7 8 8"/><path d="m21 11-8-8"/></svg>
      </span>
      <span><span class="action-title">المزادات</span><br><span class="action-sub" id="auctionsSub">شاهد الأجهزة</span></span>
    </button>

    <button class="action-card" data-go="sell-auction.html">
      <span class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </span>
      <span><span class="action-title">بيع مزاد</span><br><span class="action-sub">اعرض جهازك بالمزاد</span></span>
    </button>

    <button class="action-card" data-go="sell.html">
      <span class="action-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </span>
      <span><span class="action-title">بيع جهاز</span><br><span class="action-sub">أضف جهازك</span></span>
    </button>

  </div>
</section>

<!-- FEATURED -->
<section class="section">
  <div class="section-head">
    <h2 class="section-title">أجهزة مميزة</h2>
    <a class="section-link" href="market.html">عرض الكل</a>
  </div>
  <div class="featured-devices-track" id="featuredDevicesTrack"></div>
</section>

<!-- LATEST -->
<section class="section">
  <div class="section-head">
    <h2 class="section-title">أحدث الأجهزة</h2>
    <a class="section-link" href="market.html">عرض الكل</a>
  </div>
  <div class="featured-devices-track" id="latestDevicesTrack"></div>
</section>

<!-- TRUST -->
<section class="section">
  <div class="trust-card">
    <div class="trust-item">
      <div class="trust-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 5 6v5c0 4.5 3 7.8 7 10 4-2.2 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg></div>

      <div class="trust-title">سعر واضح</div><div class="trust-copy">مزاد أو بيع مباشر</div>
    </div>
    <div class="trust-item">
      <div class="trust-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg></div>
      <div class="trust-title">بائع معروف</div><div class="trust-copy">تقييم محفوظ للحساب</div>
    </div>
  </div>
</section>

</main>

<!-- BOTTOM NAV -->
<div class="bottom-wrap">
  <nav class="bottom-nav">
    <div class="bottom-inner">
      <a class="nav-item active" href="home.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg><span>الرئيسية</span>
      </a>
      <a class="nav-item" href="market.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8"/><path d="M8 13h8"/><path d="M8 17h5"/></svg><span>الأجهزة</span>
      </a>

/* ================================
   SEARCH
================================ */
function normalizeArabicSearch(value){
  return String(value || "")
    .toLowerCase().normalize("NFKC")
    .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
    .replace(/ئ/g,"ي").replace(/ؤ/g,"و").replace(/ـ/g,"")
    .replace(/[\u064B-\u065F\u0670]/g,"")
    .replace(/\s+/g," ").trim();
}

const ALIASES = [
  [/ايفون/g,"iphone"],[/ايفن/g,"iphone"],[/ابل/g,"apple"],[/سامسونج/g,"samsung"],[/سامسنك/g,"samsung"],
  [/جوجل/g,"google"],[/قوقل/g,"google"],[/هواوي/g,"huawei"],[/شاومي/g,"xiaomi"],[/شياومي/g,"xiaomi"],
  [/ون بلس/g,"oneplus"],[/اوبو/g,"oppo"],[/هونر/g,"honor"],[/ريلمي/g,"realme"],[/موتورولا/g,"motorola"],
  [/نوكيا/g,"nokia"],[/سوني/g,"sony"],[/تكنو/g,"tecno"],[/انفنكس/g,"infinix"]
];

function arabicBrandAliases(value){
  let text = normalizeArabicSearch(value);
  ALIASES.forEach(([pattern, replacement]) => { text = text.replace(pattern, replacement); });
  return text;
}

function buildSearchVariants(value){
  const raw = String(value || "").trim();
  if(!raw) return [];
  const branded = arabicBrandAliases(raw);
  const englishDigits = branded.replace(/[٠-٩]/g, d => String("٠١٢٣٤٥٦٧٨٩".indexOf(d)));
  return [...new Set([raw, normalizeArabicSearch(raw), branded, englishDigits].map(v => v.trim()).filter(Boolean))];
}

function bindSearch(){
  const sync = () => searchWrap.classList.toggle("has-value", searchInput.value.trim().length > 0);

  function performSearch(){
    const query = searchInput.value.trim();
    if(!query){ showToast("اكتب اسم الجهاز أولاً"); return; }
    sessionStorage.setItem("mzad_search_query", query);
    sessionStorage.setItem("mzad_search_variants", JSON.stringify(buildSearchVariants(query)));
    go(`market.html?search=${encodeURIComponent(query)}`);
  }

  searchInput.addEventListener("input", sync);
  searchClear.addEventListener("click", () => { searchInput.value = ""; sync(); searchInput.focus(); });
  searchInput.addEventListener("keydown", event => {
    if(event.key !== "Enter") return;
    event.preventDefault();
    performSearch();
  });
  searchInput.addEventListener("search", () => { if(searchInput.value.trim()) performSearch(); });
}

/* ================================
   DEVICE HELPERS
================================ */
const normalizeText = v => (v === null || v === undefined) ? "" : String(v).trim();

function getDeviceImages(images){
  if(!images) return [];
  if(Array.isArray(images)) return images.filter(Boolean);
  if(typeof images === "string"){
    const value = images.trim();
    if(!value) return [];
    try{
      const parsed = JSON.parse(value);
      if(Array.isArray(parsed)) return parsed.filter(Boolean);
    }catch(error){}
    return [value];
  }
  return [];
}

function getDeviceImageUrl(path){
  if(!path) return "";
  const value = String(path).trim();
  if(/^(https?:|data:)/.test(value)) return value;
  const { data } = supabase.storage.from("device-images").getPublicUrl(value);
  return data?.publicUrl || "";
}

function formatDevicePrice(price){
  const number = Number(price);
  if(!Number.isFinite(number)) return "السعر غير محدد";
  return new Intl.NumberFormat("en-US").format(number) + " د.ع";
}

function formatDeviceTime(value){
  if(!value) return "نُشر الآن";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "نُشر الآن";

  const diff = Math.max(0, Date.now() - date.getTime());
  const minute = 60 * 1000, hour = 60 * minute, day = 24 * hour;

  const unit = (n, one, two, few, many) =>
    n === 1 ? one : n === 2 ? two : n < 11 ? `منذ ${n} ${few}` : `منذ ${n} ${many}`;

  if(diff < minute) return "نُشر الآن";
  if(diff < hour) return unit(Math.floor(diff / minute), "منذ دقيقة", "منذ دقيقتين", "دقائق", "دقيقة");
  if(diff < day)  return unit(Math.floor(diff / hour), "منذ ساعة", "منذ ساعتين", "ساعات", "ساعة");
  return unit(Math.floor(diff / day), "منذ يوم", "منذ يومين", "أيام", "يوم");
}

function buildDeviceMeta(device){
  return [device.storage, device.color, device.location].map(normalizeText).filter(Boolean).join(" • ");
}

/* ================================
   FEATURED SCORE
================================ */
function storageToNumber(value){
  const match = normalizeText(value).toUpperCase().match(/(\d+(?:\.\d+)?)\s*(TB|GB)/);
  if(!match) return 0;
  const number = Number(match[1]);
  if(!Number.isFinite(number)) return 0;
  return match[2] === "TB" ? number * 1024 : number;
}

function scoreFeaturedDevice(device){
  let score = 0;
  const images = getDeviceImages(device.images);
  if(images.length >= 2) score += 2;
  if(images.length >= 4) score += 1;

  const battery = parseFloat(String(device.battery_health || "").replace("%",""));
  if(Number.isFinite(battery)){
    if(battery >= 95) score += 4;
    else if(battery >= 90) score += 3;
    else if(battery >= 85) score += 1;
  }

  const condition = normalizeText(device.condition).toLowerCase();
  if(["ممتاز","excellent","جيد جدا","جيد جدًا","very good"].some(w => condition.includes(w))) score += 4;
  else if(["جيد","good"].some(w => condition.includes(w))) score += 2;

  const great = v => ["ممتاز","excellent","جديد"].some(w => normalizeText(v).toLowerCase().includes(w));
  if(great(device.screen_condition)) score += 2;
  if(great(device.body_condition)) score += 2;

  const completeness = [device.brand, device.model, device.storage, device.color, device.price, device.location, device.condition, device.screen_condition, device.body_condition, device.notes]
    .filter(v => normalizeText(v)).length;
  if(completeness >= 7) score += 2;
  if(completeness >= 9) score += 1;

  const storage = storageToNumber(device.storage);
  if(storage >= 512) score += 2;
  else if(storage >= 256) score += 1;

  return score;
}

/* ================================
   DEVICE CARD
================================ */
function noImage(){
  const empty = document.createElement("span");
  empty.textContent = "لا توجد صورة";
  empty.style.cssText = "width:100%;height:100%;display:grid;place-items:center;color:#9aa3aa;font-size:11px;font-weight:800;";
  return empty;
}

function createDeviceCard(device){
  const card = document.createElement("article");
  card.className = "device-card";
  card.dataset.deviceId = device.id;

  const image = document.createElement("div");
  image.className = "device-image";

  const imageUrl = getDeviceImageUrl(getDeviceImages(device.images)[0]);

  if(imageUrl){
    const img = document.createElement("img");
    img.src = imageUrl;
    img.alt = [device.brand, device.model].filter(Boolean).join(" ");
    img.loading = "lazy";
    img.decoding = "async";
    img.draggable = false;
    img.addEventListener("load", () => img.classList.add("is-ready"), { once: true });
    img.addEventListener("error", () => { img.remove(); image.prepend(noImage()); }, { once: true });
    image.appendChild(img);
    if(img.complete && img.naturalWidth > 0) img.classList.add("is-ready");
  }else{
    image.appendChild(noImage());
  }

  const favorite = document.createElement("button");
  favorite.className = "favorite-btn";
  favorite.type = "button";
  favorite.setAttribute("aria-label", "إضافة إلى المفضلة");
  favorite.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/></svg>';
  favorite.addEventListener("click", async event => {
    event.preventDefault();
    event.stopPropagation();
    if(!(await isLoggedIn())){ await requireAuth("favorites.html"); return; }
    favorite.classList.toggle("active");
    showToast(favorite.classList.contains("active") ? "تمت إضافة الجهاز إلى المفضلة" : "تمت إزالة الجهاز من المفضلة");
  });
  image.appendChild(favorite);

  const body = document.createElement("div");
  body.className = "device-body";

  const make = (tag, cls, text) => {
    const el = document.createElement(tag);
    el.className = cls;
    el.textContent = text;
    return el;
  };

  const title = make("h3", "device-title", [device.brand, device.model].filter(Boolean).join(" ") || "جهاز");
  const meta = make("div", "device-meta", buildDeviceMeta(device) || "تفاصيل الجهاز");
  const time = make("div", "device-time", formatDeviceTime(device.created_at));

  const row = document.createElement("div");
  row.className = "device-row";
  row.append(
    make("span", "device-price", formatDevicePrice(device.price)),
    make("span", "device-type", String(device.sale_type || "").toLowerCase().includes("auction") ? "مزاد" : "بيع مباشر")
  );

  body.append(title, meta, time, row);
  card.append(image, body);
  return card;
}

      .order("created_at", { ascending: false })
      .limit(30);

    if(error){ console.error("HOME DEVICES ERROR:", error); return; }

    const devices = data || [];
    const byDate = (a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0);

    const featured = devices
      .map(device => ({ device, score: scoreFeaturedDevice(device) }))
      .sort((a, b) => b.score - a.score || byDate(a.device, b.device))
      .filter(item => item.score >= 5)
      .slice(0, 4)
      .map(item => item.device);

    const featuredIds = new Set(featured.map(d => String(d.id)));
    const latest = [...devices].sort(byDate).filter(d => !featuredIds.has(String(d.id))).slice(0, 6);

    renderDevices("featuredDevicesTrack", featured, "لا توجد أجهزة مميزة حالياً", "ستظهر الأجهزة المميزة هنا تلقائياً");
    renderDevices("latestDevicesTrack", latest, "لا توجد أجهزة أحدث حالياً", "عند نشر جهاز جديد سيظهر هنا");
  }catch(error){
    console.error("HOME DEVICES LOAD ERROR:", error);
  }
}

/* ================================
   DEVICE RAIL
================================ */
function bindDeviceRail(track){
  const cards = [...track.querySelectorAll(".device-card")];
  if(cards.length < 2) return;

  let current = 0, timer = null;
  let touchStarted = false, touchMoved = false, startX = 0, startY = 0, suppressClickUntil = 0;

  function goToDevice(index){
    current = (index + cards.length) % cards.length;
    track.scrollTo({ left: cards[current].offsetLeft - track.offsetLeft, behavior: "smooth" });
  }
  const restart = () => { clearInterval(timer); timer = setInterval(() => goToDevice(current + 1), 10000); };

  track.addEventListener("touchstart", event => {
    const t = event.touches[0];
    touchStarted = true; touchMoved = false; startX = t.clientX; startY = t.clientY;
    clearInterval(timer);
  }, { passive: true });

  track.addEventListener("touchmove", event => {
    if(!touchStarted) return;
    const t = event.touches[0];
    if(Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) touchMoved = true;
  }, { passive: true });

  track.addEventListener("touchend", event => {
    if(!touchStarted) return;
    const t = event.changedTouches[0];
    if(Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) touchMoved = true;
    if(touchMoved) suppressClickUntil = Date.now() + 700;
    touchStarted = false;
    restart();
  }, { passive: true });

  track.addEventListener("touchcancel", () => { touchStarted = false; touchMoved = false; restart(); }, { passive: true });

  track.addEventListener("click", event => {
    if(event.target.closest(".favorite-btn")) return;
    const card = event.target.closest(".device-card");
    if(!card) return;
    if(touchMoved || Date.now() < suppressClickUntil){ event.preventDefault(); event.stopPropagation(); return; }
    const deviceId = card.dataset.deviceId;
    if(!deviceId) return;
    go(`device.html?id=${encodeURIComponent(deviceId)}`);
  }, true);

  goToDevice(0);
  restart();
}
