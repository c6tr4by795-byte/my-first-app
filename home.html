<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#6f5ce0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MZAD PHONE">
<link rel="manifest" href="/manifest.json">
<title>MZAD PHONE — الرئيسية</title>

<style>
:root{
  --bg:#f9f8fd;--ink:#17202a;--muted:#6b7280;--line:#ece8fb;--edge:#ddd8f8;
  --p:#6246d9;--p-dark:#4a34b8;--p-soft:#f3f0ff;--hot:#e8590c;--ok:#1e8a5a;--ok-soft:#e8f6ef;
  --safe-bottom:env(safe-area-inset-bottom,0px)
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility
}

button,input{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}

.page{
  width:min(100%,520px);
  margin:0 auto;
  padding:0 14px calc(112px + var(--safe-bottom));
  overflow-x:clip
}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shimmer{to{background-position:-200% 0}}

header{animation:fade .5s backwards}

.page .section{animation:up .55s cubic-bezier(.2,.8,.3,1) backwards}
.page .section:nth-of-type(1){animation-delay:.05s}
.page .section:nth-of-type(2){animation-delay:.12s}
.page .section:nth-of-type(3){animation-delay:.19s}
.page .section:nth-of-type(4){animation-delay:.26s}
.page .section:nth-of-type(5){animation-delay:.33s}
.page .section:nth-of-type(6){animation-delay:.40s}

.category,.action-card,.dc,.ad-card,.icon-btn,.location-box,.nav-item{transition:transform .18s ease}

.category:active,.action-card:active,.dc:active,.ad-card:active{transform:scale(.97)}
.icon-btn:active,.location-box:active,.nav-item:active{transform:scale(.93)}

/* ============ أول شاشة: البنر والأزرار تنزل لحد الشريط السفلي ============ */

.first-screen{
  display:flex;flex-direction:column;
  min-height:calc(100svh - 82px - var(--safe-bottom))
}

#adsSection{margin-top:auto;padding-top:16px;margin-inline:-12px}
.actions-section{margin-top:14px;margin-bottom:2px}
/* إذا البنر مخفي، الأزرار هي اللي تنزل */
#adsSection[hidden]+.actions-section{margin-top:auto}

/* ============ الهيدر (بنفسجي أغمق متدرج) ============ */

header{
  margin-inline:-14px;
  padding:env(safe-area-inset-top,0px) 14px 16px;
  background:linear-gradient(145deg,#6a56dd 0%,#8473ec 48%,#aa9df4 100%);
  border-radius:0 0 24px 24px;
  border-bottom:1px solid #5f4cd0;
  box-shadow:0 10px 26px rgba(74,52,184,.28)
}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 11px}
.topbar-side{display:flex;align-items:center;gap:8px}
.location-box{display:flex;align-items:center;gap:5px;padding:6px 11px 6px 9px;color:#fff;
  border-radius:999px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.32)}
.location-name{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:850;line-height:1.2;white-space:nowrap;color:#fff}

.icon-btn{
  width:40px;height:36px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.6);border-radius:12px;background:rgba(255,255,255,.9);color:var(--p);
  box-shadow:0 7px 18px rgba(23,32,42,.08);flex:0 0 auto
}

.brand-mini{display:flex;align-items:baseline;gap:7px;color:#fff}
.brand-mini strong{font-size:21px;font-weight:950;letter-spacing:-.03em}
.brand-mini span{font-size:9px;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.82)}

.search-wrap{position:relative;margin-top:1px}

.search{
  width:100%;height:46px;border:1.5px solid var(--edge);border-radius:15px;background:#fff;
  padding:0 44px 0 42px;outline:none;color:var(--ink);
  box-shadow:0 8px 22px rgba(40,24,120,.16);transition:border-color .25s,box-shadow .25s
}

.search::placeholder{color:#a8b0bb}
.search:focus{border-color:#a99cf0;box-shadow:0 0 0 4px rgba(255,255,255,.25)}

.search-icon{
  position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);
  width:21px;height:21px;pointer-events:none;color:var(--p)
}

.search-clear{
  position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);
  opacity:0;pointer-events:none;width:33px;height:33px;border-radius:11px;
  background:var(--p-soft);display:grid;place-items:center;transition:opacity .2s
}

.search-wrap.has-value .search-clear{opacity:1;pointer-events:auto}

/* ============ الأقسام ============ */

.section{margin-top:16px}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.section-title{margin:0;font-size:19px;letter-spacing:-.03em;font-weight:900}
.section-sub{display:block;margin-top:2px;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:0}
.section-link{font-size:11px;color:var(--p-dark);font-weight:800}

.horizontal,.ad-track,.rail{
  display:flex;width:auto;margin:-8px -10px -14px;padding:8px 10px 20px;
  scroll-padding-inline:10px;overflow-x:auto;scrollbar-width:none;
  overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch
}

.horizontal::-webkit-scrollbar,.ad-track::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}

/* ============ التصنيفات ============ */

.horizontal{gap:12px;scroll-snap-type:x proximity}

.category{width:64px;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:5px;scroll-snap-align:start}
.category-icon{
  width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:#fff;
  border:1px solid var(--edge);box-shadow:0 8px 18px rgba(98,70,217,.08);color:#29393e;
  transition:background .25s,border-color .25s,box-shadow .25s
}

.category.active .category-icon{border-color:#8977e9;background:var(--p-soft);box-shadow:0 10px 22px rgba(98,70,217,.18);color:var(--p-dark)}
.category-name{font-size:10px;font-weight:800;color:#354449;white-space:nowrap}
.category.active .category-name{color:var(--p-dark)}

/* ============ الإعلانات (بنرات بالصور) ============ */

.ad-track{gap:12px;scroll-snap-type:x mandatory}

.ad-card{
  position:relative;isolation:isolate;overflow:hidden;flex:0 0 100%;
  height:clamp(176px,25dvh,212px);
  padding:16px 20px;border-radius:22px;border:0;
  scroll-snap-align:center;scroll-snap-stop:always;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  color:#fff;background-color:#1d2430;background-size:cover;background-position:center;background-repeat:no-repeat;
  box-shadow:0 10px 22px -8px rgba(98,70,217,.35)
}

.ad-card::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(to left,rgba(20,14,48,.93) 0%,rgba(20,14,48,.78) 42%,rgba(20,14,48,.15) 75%,rgba(20,14,48,0) 100%)
}

.ad-copy{max-width:68%;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.ad-top{display:flex;align-items:center;gap:8px}

.ad-badge{
  padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.3);color:#fff;font-size:10px;font-weight:900
}

.ad-kicker{font-size:11px;font-weight:800;color:rgba(255,255,255,.8)}
.ad-title{margin:0;font-size:20px;font-weight:950;line-height:1.25;letter-spacing:-.03em;color:#fff}

.ad-text{
  margin:0;font-size:12.5px;font-weight:700;line-height:1.55;color:rgba(255,255,255,.85);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}

.ad-cta{
  align-self:flex-start;position:relative;z-index:1;padding:10px 22px;border-radius:13px;color:#fff;
  font-size:13px;font-weight:900;background:linear-gradient(145deg,#6246d9,#8b6cf0);
  box-shadow:0 6px 14px rgba(98,70,217,.35)
}

.ad-dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.ad-dot{width:6px;height:6px;border-radius:50%;background:#d6d2ea;transition:.25s ease}
.ad-dot.active{width:19px;border-radius:999px;background:var(--p)}

/* ============ الإجراءات (المزادات / بيع مزاد / بيع جهاز) ============ */

.actions-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.action-card{
  position:relative;overflow:hidden;min-height:124px;border-radius:20px;
  border:1.5px solid #cfc7f5;padding:16px 12px 14px;
  display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(160deg,#fff 0%,#f1edff 100%);
  box-shadow:0 14px 26px -12px rgba(98,70,217,.42);
  text-align:start
}

.action-card:before{
  content:"";position:absolute;width:76px;height:76px;border-radius:50%;
  top:-32px;inset-inline-start:-26px;background:rgba(98,70,217,.07)
}

.action-icon{
  position:relative;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(145deg,#6246d9,#8b6cf0);color:#fff;
  box-shadow:0 8px 16px -6px rgba(98,70,217,.6)
}

.action-icon svg{width:22px;height:22px}

.action-title{display:block;font-size:14px;font-weight:950;color:var(--ink)}
.action-sub{display:block;margin-top:3px;font-size:10.5px;font-weight:700;color:#5b6472;line-height:1.35}

.live-dot{
  position:absolute;top:12px;inset-inline-end:12px;width:9px;height:9px;border-radius:50%;
  background:var(--ok);animation:livepulse 1.6s infinite;z-index:1
}

@keyframes livepulse{
  0%{box-shadow:0 0 0 0 rgba(30,138,90,.5)}
  70%{box-shadow:0 0 0 8px rgba(30,138,90,0)}
  100%{box-shadow:0 0 0 0 rgba(30,138,90,0)}
}

/* ============ كروت الأجهزة ============ */

.rail{gap:10px;scroll-snap-type:x mandatory}

.dc{position:relative;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;scroll-snap-align:start;animation:up .45s ease backwards}
.dc img{opacity:0;transition:opacity .35s ease}
.dc img.is-ready{opacity:1}

.fcard,.sk{flex:0 0 calc((100% - 10px) / 2);height:auto;aspect-ratio:7/10;border-radius:22px}

.fcard{background:#1d2430;box-shadow:0 12px 24px -12px rgba(74,52,184,.45),inset 0 0 0 1px rgba(255,255,255,.08)}

.fmedia{position:absolute;inset:0;overflow:hidden;background:linear-gradient(160deg,#7b61e8,#3b2a92)}
.fmedia img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}
.fmedia img.is-ready{animation:slowzoom 12s ease-in-out infinite alternate}

@keyframes slowzoom{from{transform:scale(1)}to{transform:scale(1.08)}}

.shade{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(20,14,48,.95) 0%,rgba(20,14,48,.72) 32%,rgba(20,14,48,0) 62%)
}

.fcard:after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.13) 50%,transparent 58%);
  transform:translateX(130%);animation:sweep 8s ease-in-out infinite;
  animation-delay:calc(var(--i,0)*1.3s + 1s)
}

@keyframes sweep{0%,55%{transform:translateX(130%)}100%{transform:translateX(-130%)}}

.fresh{
  position:absolute;top:9px;inset-inline-end:9px;padding:4px 9px;border-radius:999px;
  background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.28);color:#fff;font-size:9px;font-weight:900;z-index:3
}

.fbody{position:absolute;inset-inline:0;bottom:0;padding:10px 11px 11px;color:#fff;display:flex;flex-direction:column;gap:6px;z-index:2}
.fbody .cd{align-self:flex-start}

.ftitle{
  margin:0;font-size:12.5px;font-weight:950;line-height:1.28;letter-spacing:-.015em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}

.specs{display:flex;flex-wrap:wrap;gap:4px}

.spec{
  padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.16);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-size:9px;font-weight:800;color:#fff
}

.frow{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,.18)}
.frow-main{min-width:0;flex:1}
.frow small{display:block;font-size:8.5px;font-weight:800;color:#ffffffb3}
.frow b{display:block;margin-top:1px;font-size:16px;font-weight:950;white-space:nowrap}

.published-time{
  display:block;margin-top:2px;font-size:8px;line-height:1.2;font-weight:800;
  color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

.type{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:8.5px;font-weight:900;white-space:nowrap}
.type.auc{background:var(--p);color:#fff}
.type.dir{background:rgba(255,255,255,.95);color:var(--ok)}

.cd{
  display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:#fff;font-size:12px;font-weight:950;font-variant-numeric:tabular-nums;direction:ltr
}

.cd:before{content:"";width:5px;height:5px;border-radius:50%;background:#7CFFB2;animation:pulse2 1.6s infinite}
.cd.urgent{background:rgba(232,89,12,.94)}
.cd.urgent:before{background:#fff}

@keyframes pulse2{50%{opacity:.3}}

.favorite-btn{
  position:absolute;top:8px;inset-inline-start:8px;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;padding:0;background:rgba(255,255,255,.96);color:#7b7f84;
  box-shadow:0 5px 13px rgba(23,32,42,.15);z-index:10;transition:transform .18s,color .2s
}

.favorite-btn:active{transform:scale(.85)}
.favorite-btn svg{width:16px;height:16px}
.favorite-btn.active{color:#e5365f}
.favorite-btn.active svg{fill:currentColor}

.no-img{position:absolute;inset:0;display:grid;place-items:center}
.no-img svg{width:38px;height:38px;opacity:.5}

/* ============ التحميل والحالات الفارغة ============ */

.sk{
  border:1px solid var(--line);scroll-snap-align:start;
  background:linear-gradient(90deg,#f1eefb 25%,#faf8ff 50%,#f1eefb 75%);
  background-size:200% 100%;animation:shimmer 1.4s linear infinite
}

.state-card{
  flex:1 0 100%;min-height:148px;border:1px solid var(--edge);border-radius:22px;
  background:linear-gradient(145deg,#fff 0%,#faf8ff 100%);padding:22px 16px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 10px 24px -14px rgba(98,70,217,.22)
}

.state-icon{width:42px;height:42px;border-radius:14px;background:var(--p-soft);color:var(--p-dark);display:grid;place-items:center;margin-bottom:9px}
.state-card h3{margin:0;font-size:14px;font-weight:900}
.state-card p{margin:5px 0 0;font-size:10.5px;line-height:1.55;font-weight:700;color:var(--muted);max-width:250px}
.retry{margin-top:12px;padding:9px 18px;border-radius:12px;background:var(--p);color:#fff;font-size:12px;font-weight:900}

/* ============ الثقة ============ */

.trust-card{
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:13px;
  padding:15px 16px;background:linear-gradient(145deg,#f3f0ff 0%,#faf9ff 100%);
  border:1px solid var(--edge);border-radius:20px;margin-top:2px;min-height:82px;
  box-shadow:0 10px 22px -16px rgba(98,70,217,.25)
}

.trust-card:before{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:rgba(98,70,217,.05);top:-58px;inset-inline-end:-32px}

.trust-main-icon{
  position:relative;z-index:1;width:43px;height:43px;flex:0 0 43px;border-radius:14px;
  background:#ebe6ff;color:var(--p-dark);display:grid;place-items:center
}

.trust-content{position:relative;z-index:1;min-width:0}
.trust-title{font-size:12px;font-weight:950;line-height:1.3}
.trust-copy{margin-top:3px;font-size:9.5px;line-height:1.45;color:var(--muted);font-weight:700}
.trust-points{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

.trust-point{
  padding:3px 7px;border-radius:999px;background:#fff;border:1px solid #e3defa;
  color:var(--p-dark);font-size:8px;font-weight:900;white-space:nowrap
}

/* ============ الشريط السفلي (أضخم) ============ */

.bottom-wrap{
  position:fixed;left:0;right:0;bottom:-6px;width:100%;
  padding:6px 12px calc(6px + var(--safe-bottom));z-index:100;pointer-events:none
}

.bottom-nav{
  width:min(100%,500px);margin:0 auto;min-height:66px;padding:6px;border-radius:22px;
  background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 10px 28px rgba(23,32,42,.13);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);pointer-events:auto
}

.bottom-inner{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;align-items:center}

.nav-item{
  min-width:0;min-height:54px;padding:4px 2px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;border-radius:16px;color:#7e8992
}

.nav-item.active{color:var(--p-dark);background:var(--p-soft)}
.nav-icon{width:23px;height:23px;flex:0 0 23px}
.nav-item>span:not(.add-button){font-size:10px;line-height:1;font-weight:900;white-space:nowrap}

.add-button{
  width:40px;height:40px;flex:0 0 40px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(145deg,#6246d9,#8b6cf0);color:#fff;box-shadow:0 6px 14px rgba(98,70,217,.32)
}

.add-button svg{width:22px;height:22px}

/* ============ التوست ============ */

.toast{
  position:fixed;left:50%;bottom:calc(92px + var(--safe-bottom));
  transform:translateX(-50%) translateY(16px);max-width:calc(100% - 40px);
  padding:10px 14px;border-radius:13px;background:#1e2c30;color:#fff;font-size:11px;font-weight:800;
  box-shadow:0 14px 34px rgba(24,44,49,.14);opacity:0;pointer-events:none;transition:.25s ease;z-index:120;text-align:center
}

.toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:360px){
  .nav-icon{width:21px;height:21px}
  .nav-item>span:not(.add-button){font-size:9px}
  .action-title{font-size:13px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* رفع البنر مباشرة بعد التصنيفات وإلغاء الفراغ العمودي الكبير */
.first-screen{min-height:0 !important}
#adsSection:not([hidden]){
  margin-top:8px !important;
  padding-top:0 !important;
}
.horizontal{padding-bottom:8px !important;margin-bottom:-8px !important}


/* تكبير البنر فقط مع إبقاء أزرار المزادات وبيع المزاد والبيع المباشر بمكانها */
.first-screen{min-height:0 !important}
#adsSection:not([hidden]){margin-top:8px !important;padding-top:0 !important}
.ad-card{height:clamp(235px,34dvh,280px) !important}
.actions-section{margin-top:14px !important;margin-bottom:2px !important}


/* توازن البنر مع التصنيفات وكروت الإجراءات على شاشة الهاتف */
#adsSection:not([hidden]){
  margin-top:10px !important;
  padding-top:0 !important;
}
.ad-card{
  height:clamp(205px,28dvh,230px) !important;
}
.actions-section{
  margin-top:18px !important;
  margin-bottom:2px !important;
}

/* ============ هيدر شبكة عنكبوت هندسية (ثابت) ============ */

header{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  animation:none;
  background:
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 46%),
    linear-gradient(145deg,#5a45d4 0%,#7a67e8 50%,#a496f3 100%)
}

.topbar,.search-wrap{position:relative;z-index:2}

.web{position:absolute;top:0;z-index:0;pointer-events:none;opacity:.26}
.web svg{display:block;width:100%;height:100%}
.web-a{left:0;width:190px;height:190px}

<script type="module">

import { supabase } from "./js/supabase.js";

const $ = id => document.getElementById(id);

const toast = $("toast");
const searchInput = $("searchInput");
const searchWrap = $("searchWrap");
const searchClear = $("searchClear");

let toastTimer;

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

function esc(v){
  return String(v ?? "").replace(
    /[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])
  );
}

const go = url => { window.location.href = url; };

/* ================================
   AUTH
================================ */

async function isLoggedIn(){
  try{
    const { data, error } = await supabase.auth.getSession();
    if(error){
      console.error("SESSION ERROR:", error);
      return false;
    }
    return !!data?.session;
  }catch(error){
    console.error("AUTH ERROR:", error);
    return false;
  }
}

async function requireAuth(url){

  if(await isLoggedIn()){
    go(url);
    return;
  }

  sessionStorage.setItem("mzad_pending_action", url);

  showToast("سجّل دخولك أو أنشئ حساباً أولاً");

  setTimeout(
    () => go(`index.html?login=1&returnTo=${encodeURIComponent(url)}`),
    450
  );
}

/* ================================
   NAVIGATION
================================ */

const PROTECTED = [
  "sell.html",
  "sell-auction.html",
  "favorites.html",
  "profile.html"
];

function bindNavigation(){

  document.querySelectorAll("[data-go]").forEach(el => {

    el.addEventListener("click", async event => {

      event.preventDefault();

      const url = el.dataset.go;

      if(!url) return;

      if(PROTECTED.includes(url.split("?")[0])){
        await requireAuth(url);
        return;
      }

      go(url);
    });

  });
}

/* ================================
   CATEGORIES
================================ */

const PHONE_SVG =

const ENDING_WINDOW_MS = 30 * 60 * 1000;
const MAX_ENDING = 2;
const ENDING_DWELL = 13000;

const END_WEB = '<svg viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0L184.0 0.0M0 0L170.0 70.4M0 0L130.1 130.1M0 0L70.4 170.0M0 0L0.0 184.0M46.0 0.0L42.5 17.6L32.5 32.5L17.6 42.5L0.0 46.0M92.0 0.0L85.0 35.2L65.1 65.1L35.2 85.0L0.0 92.0M138.0 0.0L127.5 52.8L97.6 97.6L52.8 127.5L0.0 138.0"/></svg>';

let endCards = [];
let endDotEls = [];
let endCur = 0;
let endSig = null;
let endInteracted = false;

function endingAuctions(){

  const now = Date.now();

  return LIVE_DEVICES
    .filter(d => isAuction(d) && d.ends_at)
    .map(d => ({ d, left: new Date(d.ends_at).getTime() - now }))
    .filter(x => x.left > 0 && x.left <= ENDING_WINDOW_MS)
    .sort((a,b) => a.left - b.left)

}

/* كل شريحة مزاد تبقى 13 ثانية */
function endSchedule(){

  clearTimeout(endTimer);

  if(endCards.length < 2) return;

  endTimer = setTimeout(() => endGoTo(endCur + 1), ENDING_DWELL);
}

function endGoTo(i){

  const track = $("endingTrack");

  if(!track || !endCards.length) return;

  endCur = (i + endCards.length) % endCards.length;

  track.scrollTo({
    left: endCards[endCur].offsetLeft - track.offsetLeft,
    behavior:"smooth"
  });

  endSetActive(endCur);
  endSchedule();
}

/* زر المزايدة: يحتاج تسجيل دخول، بعدها يفتح صفحة المزاد */
function bidNow(id){
  requireAuth(`auction-details.html?auction=${encodeURIComponent(id)}&bid=1`);
}

function bindEndSlider(track){

  if(track.dataset.bound) return;

  track.dataset.bound = "1";

  track.addEventListener("scroll", () => {

    if(!endCards.length) return;

    const step = endCards[0].offsetWidth + 12;

    endCur = Math.min(
      endCards.length - 1,
      Math.round(Math.abs(track.scrollLeft) / step)
    );

    endSetActive(endCur);

  }, {passive:true});

  track.addEventListener("touchstart", () => {
    endInteracted = true;
    clearTimeout(endTimer);
  }, {passive:true});

  track.addEventListener("touchend", () => {
    clearTimeout(endTimer);
    endTimer = setTimeout(endSchedule, 400);
  }, {passive:true});

  track.addEventListener("click", event => {

    const bid = event.target.closest("[data-bid]");

    if(bid){
      event.preventDefault();
      event.stopPropagation();
      bidNow(bid.dataset.bid);
      return;
    }

    const card = event.target.closest(".end-ban");

    if(card && card.dataset.id)
      go(`auction-details.html?auction=${encodeURIComponent(card.dataset.id)}`);
  });
}

function renderEnding(){

  const sec = $("endingSection");
  const track = $("endingTrack");
  const dotsBox = $("endingDots");

  if(!sec || !track) return;

  const aucs = endingAuctions();

  const sig = aucs.map(d => d.id + ":" + d.price).join("|");

  /* ما نعيد رسم البنر إلا إذا تغيّرت المزادات المعروضة */
  if(sig === endSig) return;

  endSig = sig;

  if(!aucs.length){
    clearTimeout(endTimer);
    sec.hidden = true;
    track.innerHTML = "";
    dotsBox.innerHTML = "";
    endCards = [];
    endDotEls = [];
    return;
  }

  const keepKey = endCards[endCur] ? endCards[endCur].dataset.key : null;

  track.innerHTML = aucs.map(endSlideHTML).join("");

  sec.hidden = false;

  endCards = [...track.querySelectorAll(".end-ban")];

  dotsBox.innerHTML =
    endCards.length > 1
      ? endCards.map((_,i) => `<span class="ad-dot${i ? "" : " active"}"></span>`).join("")
      : "";

  endDotEls = [...dotsBox.children];

  /* إذا المستخدم يتصفح السلايد نبقيه على نفس المزاد، وإلا نبدأ من الأقرب للانتهاء */
  const keepIndex = endCards.findIndex(c => c.dataset.key === keepKey);

  endCur = endInteracted && keepIndex > 0 ? keepIndex : 0;

  track.scrollTo({
    left: endCards[endCur].offsetLeft - track.offsetLeft,
    behavior:"auto"
  });

  endSetActive(endCur);

  bindEndSlider(track);

  tickTimers();

  endSchedule();
}

function normalizeArabicSearch(value){
  return String(value || "")
    .toLowerCase()
    .normalize("NFKC")
    .replace(/[أإآٱ]/g,"ا")
    .replace(/ة/g,"ه")
    .replace(/ى/g,"ي")
    .replace(/ئ/g,"ي")
    .replace(/ؤ/g,"و")
    .replace(/ـ/g,"")
    .replace(/[\u064B-\u065F\u0670]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

const ALIASES = [
  [/ايفون/g,"iphone"],
  [/ايفن/g,"iphone"],
  [/ابل/g,"apple"],
  [/سامسونج/g,"samsung"],
  [/سامسنك/g,"samsung"],
  [/جوجل/g,"google"],
  [/قوقل/g,"google"],
  [/هواوي/g,"huawei"],
  [/شاومي/g,"xiaomi"],
  [/شياومي/g,"xiaomi"],
  [/ون بلس/g,"oneplus"],
  [/اوبو/g,"oppo"],
  [/هونر/g,"honor"],
  [/ريلمي/g,"realme"],
  [/موتورولا/g,"motorola"],
  [/نوكيا/g,"nokia"],
  [/سوني/g,"sony"],
  [/تكنو/g,"tecno"],
  [/انفنكس/g,"infinix"]
];

function arabicBrandAliases(value){
  let text = normalizeArabicSearch(value);
  ALIASES.forEach(([pattern,replacement]) => {
    text = text.replace(pattern, replacement);
  });
  return text;
}

function buildSearchVariants(value){

  const raw = String(value || "").trim();

  if(!raw) return [];

  const branded = arabicBrandAliases(raw);

  const englishDigits =
    branded.replace(/[٠-٩]/g, d => String("٠١٢٣٤٥٦٧٨٩".indexOf(d)));

  return [
    raw,
    normalizeArabicSearch(raw),
    branded,
    englishDigits
  ]
    .map(v => v.trim())
    .filter(Boolean)
    .filter((v,i,a) => a.indexOf(v) === i);
}

function bindSearch(){

  const sync = () =>
    searchWrap.classList.toggle(
      "has-value",
      searchInput.value.trim().length > 0
    );

  function performSearch(){

    const query = searchInput.value.trim();

    if(!query){
      showToast("اكتب اسم الجهاز أولاً");
      return;
    }

    sessionStorage.setItem("mzad_search_query", query);

    sessionStorage.setItem(
      "mzad_search_variants",
      JSON.stringify(buildSearchVariants(query))
    );

    go(`market.html?search=${encodeURIComponent(query)}`);
  }

  searchInput.addEventListener("input", sync);

  searchClear.addEventListener("click", () => {
    searchInput.value = "";
    sync();
    searchInput.focus();
  });

  searchInput.addEventListener("keydown", event => {
    if(event.key !== "Enter") return;
    event.preventDefault();
    performSearch();
  });

  searchInput.addEventListener("search", () => {
    if(searchInput.value.trim()) performSearch();
  });
}

const normalizeText = v =>

const deviceName = d =>
  [d.brand, d.model].filter(Boolean).join(" ") || "جهاز";

function getDeviceImages(images){

  if(!images) return [];

  if(Array.isArray(images))
    return images.filter(Boolean);

  if(typeof images === "string"){

    const value = images.trim();

    if(!value) return [];

    try{
      const parsed = JSON.parse(value);
      if(Array.isArray(parsed))
        return parsed.filter(Boolean);
    }catch(error){}

    return [value];
  }

  return [];
}

function getDeviceImageUrl(path){

  if(!path) return "";

  const value = String(path).trim();

  if(/^(https?:|data:)/.test(value))
    return value;

  const { data } =
    supabase.storage
      .from("device-images")
      .getPublicUrl(value);

  return data?.publicUrl || "";
}

function formatDevicePrice(price){

  const number = Number(price);

  if(!Number.isFinite(number))
    return "السعر غير محدد";

  return new Intl.NumberFormat("en-US").format(number) + " د.ع";
}

/* ================================
   وقت النشر
================================ */

function formatPublishedTime(value){

  const date = new Date(value);

  if(!value || Number.isNaN(date.getTime()))
    return "";

  const diff = Date.now() - date.getTime();

  if(diff < 0)
    return "نُشر للتو";

  const minutes = Math.floor(diff / 60000);

  if(minutes < 1)
    return "نُشر للتو";

  if(minutes < 60)
    return `منذ ${minutes} دقيقة`;

  const hours = Math.floor(minutes / 60);

  if(hours < 24)
    return `منذ ${hours} ساعة`;

  const days = Math.floor(hours / 24);

  if(days < 30)
    return `منذ ${days} يوم`;

  const months = Math.floor(days / 30);

  if(months < 12)
    return `منذ ${months} شهر`;

  const years = Math.floor(days / 365);

  return `منذ ${years} سنة`;
}

function refreshPublishedTimes(){
  document
    .querySelectorAll(".published-time[data-created-at]")
    .forEach(el => {
      el.textContent = formatPublishedTime(el.dataset.createdAt);

function fmtLeft(ms){

  if(ms <= 0)
    return "انتهى";

  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;

  const p = n => String(n).padStart(2,"0");

  return d > 0
    ? `${d} يوم ${h} س`
    : `${p(h)}:${p(m)}:${p(sec)}`;
}

function tickTimers(){

  const now = Date.now();

  document.querySelectorAll("[data-end]").forEach(el => {

    const left = new Date(el.dataset.end).getTime() - now;

    el.textContent = fmtLeft(left);

    el.classList.toggle("urgent", left > 0 && left < 3600e3);
  });
}

/* ================================

================================ */

function storageToNumber(value){

  const match =
    normalizeText(value)
      .toUpperCase()
      .match(/(\d+(?:\.\d+)?)\s*(TB|GB)/);

  if(!match)
    return 0;

  const number = Number(match[1]);

  if(!Number.isFinite(number))
    return 0;

  return match[2] === "TB" ? number * 1024 : number;
}

function scoreFeaturedDevice(device){

  let score = 0;

  const images = getDeviceImages(device.images);

  if(images.length >= 2) score += 2;
  if(images.length >= 4) score += 1;

  const battery =
    parseFloat(String(device.battery_health || "").replace("%",""));

  if(Number.isFinite(battery)){
    if(battery >= 95) score += 4;
    else if(battery >= 90) score += 3;
    else if(battery >= 85) score += 1;
  }

  const condition = normalizeText(device.condition).toLowerCase();

  if(
    ["ممتاز","excellent","جيد جدا","جيد جدًا","very good","نظيف"]
      .some(w => condition.includes(w))
  )
    score += 4;

  else if(
    ["جيد","good"].some(w => condition.includes(w))
  )
    score += 2;

  const great = v =>
    ["ممتاز","excellent","جديد","نظيف"]
      .some(w => normalizeText(v).toLowerCase().includes(w));

  if(great(device.screen_condition)) score += 2;
  if(great(device.body_condition)) score += 2;

  const completeness = [
    device.brand,
    device.model,
    device.storage,
    device.color,
    device.price,
    device.location,
    device.condition,
    device.screen_condition,
    device.body_condition,
    device.notes
  ].filter(v => normalizeText(v)).length;

  if(completeness >= 7) score += 2;
  if(completeness >= 9) score += 1;

  const storage = storageToNumber(device.storage);

  if(storage >= 512) score += 2;
  else if(storage >= 256) score += 1;

  return score;
}

/* المزادات المباشرة الحقيقية من mzad_auctions */
async function fetchLiveAuctions(){

  const r = await supabase
    .from("mzad_auctions")
    .select("id,device_id,starting_price_iqd,current_price_iqd,status,ends_at,created_at")
    .eq("status","live")
    .gt("ends_at", new Date().toISOString())
    .order("created_at",{ascending:false})
    .limit(20);

  if(r.error){
    console.error("HOME AUCTIONS ERROR:", r.error);
    return [];
  }

  return Promise.all((r.data || []).map(async a => {

    const [dr, ir] = await Promise.all([
      supabase.from("mzad_devices").select("brand,model,storage").eq("id", a.device_id).maybeSingle(),
      supabase.from("mzad_device_images").select("storage_path,is_primary,sort_order").eq("device_id", a.device_id).limit(8)
    ]);

    const imgs = [...(ir.data || [])]
      .sort((x,y) => (Number(y.is_primary) - Number(x.is_primary)) || (Number(x.sort_order) - Number(y.sort_order)))
      .map(i => i.storage_path)
      .filter(Boolean);

    const d = dr.data || {};

    return {
      id: a.id,
      created_at: a.created_at,
      brand: d.brand,
      model: d.model,
      storage: d.storage,
      price: Number(a.current_price_iqd || a.starting_price_iqd) || 0,
      sale_type: "auction",
      ends_at: a.ends_at,
      images: imgs
    };
  }));
}

async function fetchDevices(){

  /* البيع المباشر من جدول devices، وأي صف قديم نوعه مزاد نتجاهله */
  const res = await supabase
    .from("devices")
    .select(COLS)
    .order("created_at",{ascending:false})
    .limit(40);

  const direct = (res.data || []).filter(d => !isAuction(d));

  let auctions = [];
  try{ auctions = await fetchLiveAuctions(); }
  catch(error){ console.error("HOME AUCTIONS LOAD ERROR:", error); }

  /* نعتبره خطأ فقط إذا الاثنين فشلوا */
  const failed = res.error && !auctions.length;

  return {
    data: [...auctions, ...direct],
    error: failed ? res.error : null,
    hasEnds: true
  };
}

async function loadLiveCount(){

  try{

    const { count, error } = await supabase
      .from("mzad_auctions")
      .select("id",{count:"exact",head:true})
      .eq("status","live")
      .gt("ends_at", new Date().toISOString());

    if(error){
      console.error("LIVE AUCTIONS ERROR:", error);
      return;
    }

    $("liveDot").hidden = !count;

    $("auctionsSub").textContent =
      count ? `${count} مزاد مباشر الآن` : "شاهد الأجهزة";

  }catch(error){
    console.error("LIVE AUCTIONS ERROR:", error);
  }
}

async function loadDevices(){

  skeletons("featuredTrack");
  skeletons("latestTrack");

  try{

    const { data, error } = await fetchDevices();

    if(error){

      console.error("HOME DEVICES ERROR:", error);

      showState(
        "featuredTrack",
        "تعذر تحميل الأجهزة المميزة",
        "تأكد من الاتصال وحاول مرة ثانية",
        true
      );

      showState(
        "latestTrack",
        "تعذر تحميل الأجهزة",
        "تأكد من الاتصال وحاول مرة ثانية",
        true
      );

      return;
    }

    const now = Date.now();

    const byDate = (a,b) =>
      new Date(b.created_at || 0) - new Date(a.created_at || 0);

    const devices =
      data.filter(
        d =>
          !(
            isAuction(d) &&
            d.ends_at &&
            new Date(d.ends_at).getTime() <= now
          )
      );

    const featured =
      devices
        .map(device => ({ device, score: scoreFeaturedDevice(device) }))
        .sort((a,b) => b.score - a.score || byDate(a.device, b.device))
        .filter(item => item.score >= 5)
        .slice(0,5)
        .map(item => item.device);

    LIVE_DEVICES = devices;

    renderEnding();

    $("featuredSection").hidden = false;

    if(featured.length){

      renderRail("featuredTrack", featured, featuredCard);

    }else{

      showState(
        "featuredTrack",
        "لسه ماكو أجهزة مميزة",
        "أول ما ينضاف جهاز بمواصفات وحالة مميزة راح يظهر هنا.",
        false
      );

    }

    const featuredIds = new Set(featured.map(d => String(d.id)));

    const latest =
      [...devices]
        .sort(byDate)
        .filter(d => !featuredIds.has(String(d.id)))
        .slice(0,8);

    if(latest.length){

      renderRail("latestTrack", latest, latestCard);

    }else{

      showState(
        "latestTrack",
        "لسه ماكو أجهزة مضافة",
        "أول ما ينضاف جهاز جديد راح يظهر هنا.",
        false
      );

    }

    await loadLiveCount();

  }catch(error){

    console.error("HOME DEVICES LOAD ERROR:", error);

    $("featuredSection").hidden = false;

    showState(
      "featuredTrack",
      "تعذر تحميل الأجهزة المميزة",
      "تأكد من الاتصال وحاول مرة ثانية",
      true
    );

    showState(
      "latestTrack",
      "تعذر تحميل الأجهزة",
      "تأكد من الاتصال وحاول مرة ثانية",
      true
    );

  }
}

function bindRail(track){

  const cards = [...track.querySelectorAll(".dc")];

  if(!track.dataset.favBound){

    track.dataset.favBound = "1";

    track.addEventListener("click", async event => {

      const btn = event.target.closest(".favorite-btn");

      if(!btn) return;

      event.preventDefault();
      event.stopPropagation();

      if(!(await isLoggedIn())){
        await requireAuth("favorites.html");
        return;
      }

      const id = btn.dataset.fav;

      const favs = getFavs();

      const on = !favs.has(id);

      on ? favs.add(id) : favs.delete(id);

      saveFavs(favs);

      document
        .querySelectorAll(`.favorite-btn[data-fav="${CSS.escape(id)}"]`)
        .forEach(b => b.classList.toggle("active", on));

      showToast(
        on
          ? "تمت إضافة الجهاز إلى المفضلة"
          : "تمت إزالة الجهاز من المفضلة"
      );

    });

  }

  bindCardClicks(track);

  if(cards.length < 2)
    return;

  let current = 0;

  function goToCard(index){

    current = (index + cards.length) % cards.length;

    track.scrollTo({
      left: cards[current].offsetLeft - track.offsetLeft,
      behavior:"smooth"
    });
  }

  clearInterval(track._timer);

  track._restart = () => {
    clearInterval(track._timer);
    track._timer = setInterval(() => goToCard(current + 1), 10000);
  };

  if(!track.dataset.touchBound){

    track.dataset.touchBound = "1";

    track.addEventListener(
      "touchstart",
      () => clearInterval(track._timer),
      {passive:true}
    );

    track.addEventListener(
      "touchend",
      () => track._restart && track._restart(),
      {passive:true}
    );
  }

  track._restart();
}

/* ================================
   فتح الكرت
================================ */

function bindCardClicks(track){

  if(track.dataset.clickBound)
    return;

  track.dataset.clickBound = "1";

  let touchStarted = false;
  let touchMoved = false;
  let startX = 0;
  let startY = 0;
  let suppressClickUntil = 0;

  track.addEventListener("touchstart", event => {
    const t = event.touches[0];
    touchStarted = true;
    touchMoved = false;
    startX = t.clientX;
    startY = t.clientY;
  }, {passive:true});

  track.addEventListener("touchmove", event => {

    if(!touchStarted) return;

    const t = event.touches[0];

    if(
      Math.abs(t.clientX - startX) > 8 ||
      Math.abs(t.clientY - startY) > 8
    ){
      touchMoved = true;
    }

  }, {passive:true});

  track.addEventListener("touchend", event => {

    if(!touchStarted) return;

    const t = event.changedTouches[0];

    if(
      Math.abs(t.clientX - startX) > 8 ||
      Math.abs(t.clientY - startY) > 8
    ){
      touchMoved = true;
    }

    if(touchMoved){
      suppressClickUntil = Date.now() + 700;
    }

    touchStarted = false;

  }, {passive:true});

  track.addEventListener("touchcancel", () => {
    touchStarted = false;
    touchMoved = false;
  }, {passive:true});

  track.addEventListener("click", event => {

    if(event.target.closest(".favorite-btn"))
      return;

    const card = event.target.closest(".dc");

    if(!card)
      return;

    if(touchMoved || Date.now() < suppressClickUntil){
      event.preventDefault();
      event.stopPropagation();
      return;
    }

    const id = card.dataset.id;

    if(!id)
      return;

    /*
      مزاد -> auction-details.html?auction=<uuid>
      بيع مباشر -> device.html?id=<id>
    */
    const isAuc = card.dataset.saleType === "auction";

    const destination = isAuc ? "auction-details.html" : "device.html";

    const param = isAuc ? "auction" : "id";

    go(`${destination}?${param}=${encodeURIComponent(id)}`);

  }, true);
}

/* مركز إشعارات المستخدم — يعتمد على جدول mzad_notifications */
const notificationButton = $("notificationBtn");
let notificationPanel = null;
let notificationUnreadCount = 0;

function ensureNotificationPanel(){
  if(notificationPanel) return notificationPanel;
  const style = document.createElement("style");
  style.textContent = `
    .mzad-notify-panel{position:fixed;z-index:999;top:64px;right:12px;left:12px;width:auto;max-width:480px;margin-inline:auto;max-height:min(72dvh,620px);overflow:auto;background:#fff;border:1px solid #e8e4f7;border-radius:20px;box-shadow:0 18px 55px rgba(24,20,55,.2);padding:14px;direction:rtl}
    .mzad-notify-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:11px;border-bottom:1px solid #f0edf8}
    .mzad-notify-title{font-size:15px;font-weight:950;color:#17202a}
    .mzad-notify-close{width:32px;height:32px;border-radius:10px;background:#f5f3fc;font-size:20px}
    .mzad-notify-list{display:grid;gap:8px;padding-top:10px}
    .mzad-notify-item{display:block;width:100%;padding:12px;text-align:right;border:1px solid #eeeaf8;border-radius:14px;background:#fff}
    .mzad-notify-item.unread{background:#f7f5ff;border-color:#ded7ff}
    .mzad-notify-item strong{display:block;font-size:12px;font-weight:900}
    .mzad-notify-item span{display:block;margin-top:5px;font-size:11px;line-height:1.6;color:#626b78;white-space:pre-wrap}
    .mzad-notify-item time{display:block;margin-top:7px;font-size:9px;color:#8a91a0}
    .mzad-notify-empty{padding:24px 10px;text-align:center;color:#737b89;font-size:12px;line-height:1.7}
    .mzad-notify-badge{position:absolute;top:-5px;left:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:20px;background:#e91d4f;color:#fff;font-size:9px;font-weight:900;display:grid;place-items:center}
    #notificationBtn{position:relative}
  `;
  document.head.appendChild(style);
  notificationPanel = document.createElement("section");
  notificationPanel.className = "mzad-notify-panel";
  notificationPanel.hidden = true;
  notificationPanel.setAttribute("aria-label","مركز الإشعارات");
  notificationPanel.innerHTML = '<div class="mzad-notify-head"><strong class="mzad-notify-title">الإشعارات</strong><button type="button" class="mzad-notify-close" aria-label="إغلاق">×</button></div><div class="mzad-notify-list"><div class="mzad-notify-empty">جاري تحميل الإشعارات…</div></div>';
  document.body.appendChild(notificationPanel);
  notificationPanel.querySelector(".mzad-notify-close").addEventListener("click",()=>{notificationPanel.hidden=true;});
  document.addEventListener("click",event=>{
    if(!notificationPanel.hidden && !notificationPanel.contains(event.target) && !notificationButton.contains(event.target)) notificationPanel.hidden=true;
  });
  return notificationPanel;
}

function updateNotificationBadge(count){
  notificationUnreadCount = Math.max(0, Number(count)||0);
  let badge = notificationButton.querySelector(".mzad-notify-badge");
  if(notificationUnreadCount && !badge){
    badge=document.createElement("span");
    badge.className="mzad-notify-badge";
    badge.setAttribute("aria-label","إشعارات غير مقروءة");
    notificationButton.appendChild(badge);
  }
  if(badge){
    badge.textContent=notificationUnreadCount>99?"99+":String(notificationUnreadCount);
    badge.hidden=!notificationUnreadCount;
  }
}

function notificationDate(value){
  if(!value) return "";
  const date=new Date(value);
  return Number.isNaN(date.getTime())?"":date.toLocaleString("ar-IQ",{dateStyle:"medium",timeStyle:"short"});
}

async function loadUserNotifications(){
  const panel=ensureNotificationPanel();
  const list=panel.querySelector(".mzad-notify-list");
  list.innerHTML='<div class="mzad-notify-empty">جاري تحميل الإشعارات…</div>';
  const auth=await supabase.auth.getUser();
  const user=auth?.data?.user;
  if(auth?.error || !user){
    list.innerHTML='<div class="mzad-notify-empty">سجّل الدخول حتى تشوف إشعارات حسابك.</div>';
    updateNotificationBadge(0);
    return;
  }
  const result=await supabase.from("mzad_notifications")
    .select("id,user_id,type,title_ar,body_ar,data_json,is_read,created_at")
    .eq("user_id",user.id)
    .order("created_at",{ascending:false})
    .limit(30);
  if(result.error){
    console.error("MZAD notifications:",result.error);
    list.innerHTML='<div class="mzad-notify-empty">نظام الإشعارات يحتاج تفعيل قاعدة البيانات من إعدادات المنصة. جرّب مرة ثانية بعد التفعيل.</div>';
    return;
  }
  const rows=result.data||[];
  const unreadRows=rows.filter(item=>!item.is_read);
  if(unreadRows.length){
    const markAllRead=await supabase.from("mzad_notifications")
      .update({is_read:true})
      .eq("user_id",user.id)
      .eq("is_read",false);
    if(markAllRead.error){
      console.error("MZAD mark notifications read on open:",markAllRead.error);
      updateNotificationBadge(unreadRows.length);
    }else{
      rows.forEach(item=>{item.is_read=true;});
      updateNotificationBadge(0);
    }
  }else{
    updateNotificationBadge(0);
  }
  if(!rows.length){
    list.innerHTML='<div class="mzad-notify-empty">ما عندك إشعارات حالياً. راح تظهر هنا تحديثات المزاد والطلبات لما تتفعّل أحداث الإشعارات.</div>';
    return;
  }
  list.replaceChildren();
  rows.forEach(item=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="mzad-notify-item"+(item.is_read?"":" unread");
    const title=document.createElement("strong");
    title.textContent=item.title_ar||"تنبيه من مزاد فون";
    const body=document.createElement("span");
    body.textContent=item.body_ar||"لديك تحديث جديد في حسابك.";
    const time=document.createElement("time");
    time.textContent=notificationDate(item.created_at);
    button.append(title,body,time);
    button.addEventListener("click",async()=>{
      if(!item.is_read){
        const update=await supabase.from("mzad_notifications").update({is_read:true}).eq("id",item.id).eq("user_id",user.id);
        if(!update.error){item.is_read=true;button.classList.remove("unread");updateNotificationBadge(Math.max(0,notificationUnreadCount-1));}
      }
      const link = item.data_json && typeof item.data_json === "object" ? item.data_json.link : null;
      if(link){
        try{const target=new URL(link,location.origin);if(target.origin===location.origin)location.href=target.href;}catch{}
      }
    });
    list.appendChild(button);
  });
}

notificationButton.addEventListener("click",async()=>{
  const panel=ensureNotificationPanel();
  panel.hidden=!panel.hidden;
  if(!panel.hidden) await loadUserNotifications();
});

/* تحديث عدّاد الإشعارات عند الدخول ودورياً، من دون إعادة تحميل الصفحة */
async function refreshNotificationBadge(){
  try{
    const {data:{user},error:authError}=await supabase.auth.getUser();
    if(authError || !user) { updateNotificationBadge(0); return; }
    const {count,error}=await supabase.from("mzad_notifications")
      .select("id",{count:"exact",head:true})
      .eq("user_id",user.id)
      .eq("is_read",false);
    if(error) console.error("MZAD notification badge:",error);
    else updateNotificationBadge(count||0);
  }catch(error){
    console.debug("Notification badge unavailable until the notifications migration is applied.");
  }
}
refreshNotificationBadge();
