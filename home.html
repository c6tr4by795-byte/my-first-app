<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>العراق الأخضر</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #d63651;
      color: white;
      font-family: Arial, Tahoma, sans-serif;
    }

    .page {
      min-height: 100vh;
      padding: 22px 18px 40px;
      position: relative;
      overflow: hidden;
    }

    /* زخارف خفيفة بالخلفية */
    .shape {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.035);
      pointer-events: none;
    }

    .shape.one {
      top: -70px;
      left: -60px;
    }

    .shape.two {
      bottom: 80px;
      right: -80px;
      width: 220px;
      height: 220px;
    }

    /* زر تسجيل الخروج */
    .logout {
      position: absolute;
      top: 18px;
      left: 18px;

      width: 48px;
      height: 48px;

      border: 0;
      border-radius: 14px;

      background: #54b4c2;
      color: #111;

      font-size: 21px;
      font-weight: bold;

      cursor: pointer;
      z-index: 5;

      box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    }

    .logout:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }

    .content {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 520px;

      margin: 0 auto;
      padding-top: 55px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 34px;
    }

    .tree {
      font-size: 68px;
      line-height: 1;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;

      font-size: clamp(36px, 9vw, 58px);
      line-height: 1.15;

      font-weight: 900;
      color: white;
    }

    .subtitle {
      margin: 16px 0 0;

      font-size: 23px;
      font-weight: bold;

      color: white;
    }

    /* بطاقة الحساب */
    .account {
      background: rgba(255,255,255,0.97);
      color: #111;

      border-radius: 28px;

      padding: 25px 24px;

      box-shadow: 0 10px 25px rgba(0,0,0,0.12);

      text-align: right;
    }

    .account-title {
      margin: 0 0 18px;

      color: #16833b;

      font-size: 28px;
      font-weight: 900;
    }

    /* الإيميل نص فقط */
    .email {
      margin: 0;

      font-size: 19px;
      font-weight: bold;

      color: #555;

      direction: ltr;
      text-align: center;

      user-select: text;
      -webkit-user-select: text;

      word-break: break-word;
    }

    .email::selection {
      background: #54b4c2;
      color: white;
    }

    /* مساحة مستقبلية */
    .welcome-box {
      margin-top: 24px;

      background: rgba(255,255,255,0.97);
      color: #111;

      border-radius: 28px;

      padding: 28px 22px;

      text-align: center;

      box-shadow: 0 10px 25px rgba(0,0,0,0.10);
    }

    .welcome-box h2 {
      margin: 0;

      color: #16833b;

      font-size: 25px;
      font-weight: 900;
    }

    .welcome-box p {
      margin: 12px 0 0;

      color: #777;

      font-size: 16px;
    }

    #message {
      margin-top: 12px;

      text-align: center;

      color: white;

      font-size: 14px;
      font-weight: bold;
    }

    @media (max-width: 420px) {

      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .content {
        padding-top: 50px;
      }

      .tree {
        font-size: 58px;
      }

      .subtitle {
        font-size: 20px;
      }

      .account {
        padding: 22px 18px;
      }

      .email {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="shape one"></div>
    <div class="shape two"></div>

    <!-- تسجيل الخروج -->
    <button
      class="logout"
      id="logoutBtn"
      aria-label="تسجيل الخروج"
      title="تسجيل الخروج">
      ↪
    </button>

    <main class="content">

      <section class="welcome">

        <div class="tree">🌳</div>

        <h1 class="title">
          العراق الأخضر
        </h1>

        <p class="subtitle">
          أهلاً وسهلاً بك
        </p>

      </section>

      <section class="account">

        <h2 class="account-title">
          حسابك
        </h2>

        <p
          class="email"
          id="userEmail">
          جاري تحميل الحساب...
        </p>

      </section>

      <section class="welcome-box">

        <h2>
          مرحباً بك في العراق الأخضر
        </h2>

        <p>
          حسابك مسجل بنجاح
        </p>

      </section>

      <div id="message"></div>

    </main>

  </div>

  <script type="module">

    import { auth } from "./js/firebase.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    const userEmail = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");
    const message = document.getElementById("message");

    onAuthStateChanged(auth, (user) => {

      if (user) {

        userEmail.textContent =
          user.email || "حساب Google";

      } else {

        window.location.href = "index.html";

      }

    });

    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

        window.location.href = "index.html";

      } catch (error) {

        message.textContent =
          "حدث خطأ أثناء تسجيل الخروج.";

        console.error(error);

      }

    });

  </script>

</body>

</html>
