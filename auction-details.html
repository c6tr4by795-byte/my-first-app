<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MZAD PHONE">
<title>MZAD PHONE — إدارة مزادك</title>

<style>
:root{
  --bg:#f9f8fd; --ink:#17202a; --muted:#6b7280; --line:#ece8fb;
  --primary:#176b87; --primary-soft:#e8f3f6; --purple:#6246d9; --purple-dark:#4a34b8; --purple-soft:#f3f0ff; --edge:#e0daf8;
  --ok:#1e8a5a; --hot:#e8590c; --gold:#b9791a; --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility
}

button{
  font:inherit;
  border:0;
  background:none;
  color:inherit;
  cursor:pointer
}

:focus-visible{
  outline:3px solid var(--purple);
  outline-offset:2px
}

.page{
  width:min(100%,520px);
  margin:0 auto;
  padding:0 14px calc(40px + var(--safe-bottom))
}

/* header */

header{
  margin-inline:-14px;
  padding:0 14px 14px;
  background:linear-gradient(145deg,#fff 0%,#f7f5ff 55%,#ece8ff 100%);
  border-radius:0 0 24px 24px;
  border-bottom:1px solid var(--line);
  box-shadow:0 10px 26px rgba(23,32,42,.05)
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 2px 0
}

.brand-mini{
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:.9
}

.brand-mini strong{
  font-size:16px;
  letter-spacing:-.03em
}

.brand-mini span{
  font-size:7px;
  font-weight:800;
  letter-spacing:.15em;
  color:#8a96a3;
  margin-top:3px
}

.icon-btn{
  width:39px;
  height:34px;
  display:grid;
  place-items:center;
  border:1px solid var(--edge);
  border-radius:12px;
  background:#fff;
  color:var(--purple);
  box-shadow:0 7px 18px rgba(23,32,42,.045)
}

.icon-btn svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round
}

#fav[aria-pressed="true"] svg{
  fill:var(--purple)
}

/* gallery */

.gallery{
  margin-top:12px;
  border-radius:22px;
  overflow:hidden;
  border:1px solid var(--edge);
  box-shadow:0 12px 28px rgba(98,70,217,.10)
}

.slides{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  overscroll-behavior-x:contain
}

.slides::-webkit-scrollbar{
  display:none
}

.slide{
  flex:0 0 100%;
  scroll-snap-align:center;
  scroll-snap-stop:always;
  aspect-ratio:1/.82;
  display:grid;
  place-items:center;
  overflow:hidden
}

.slide svg{
  height:80%;
  width:auto;
  filter:drop-shadow(0 14px 18px rgba(74,52,184,.22))
}

.slide img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block
}

.dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:9px
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#d6d2ea;
  transition:.2s ease
}

.dot.active{
  width:19px;
  border-radius:999px;
  background:var(--purple)
}

/* title */

.title{
  margin:14px 2px 0
}

.title h1{
  margin:0;
  font-size:21px;
  line-height:1.25;
  letter-spacing:-.035em;
  font-weight:950
}

.sub{
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
  font-weight:700
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:10px 2px 0
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:26px;
  padding:0 10px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  color:var(--purple-dark);
  background:var(--purple-soft)
}

.chip.ver{
  background:#fff;
  border:1px solid #9edfe3;
  color:var(--primary)
}

.chip svg{
  width:13px;
  height:13px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

/* auction */

.auction{
  margin-top:14px;
  padding:14px;
  border-radius:24px;
  border:1px solid var(--edge);
  background:
    radial-gradient(circle at 100% 0,rgba(98,70,217,.10),transparent 55%),
    linear-gradient(145deg,#fff 0%,#f7f5ff 60%,#efebff 100%);
  box-shadow:0 14px 32px rgba(98,70,217,.10)
}

.a-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:26px;
  padding:0 10px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--edge);
  font-size:10px;
  font-weight:900;
  color:var(--purple-dark)
}

.live:before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--ok)
}

.auction.hot .live:before{
  background:var(--hot)
}

.auction.ended .live:before{
  background:#9ca3af
}

.a-count{
  font-size:10px;
  font-weight:800;
  color:var(--muted)
}

.a-grid{
  display:grid;
  grid-template-columns:1fr auto;
  gap:14px;
  align-items:end;
  margin-top:14px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line)
}

.label{
  display:block;
  font-size:10px;
  font-weight:800;
  color:var(--muted);
  margin-bottom:3px
}

.price{
  font-size:28px;
  font-weight:950;
  color:var(--purple-dark);
  line-height:1.15;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap
}

.price small{
  font-size:11px;
  font-weight:800;
  color:var(--muted);
  margin-inline-start:4px;
  letter-spacing:0
}

.price.bump{
  animation:bump .4s ease
}

@keyframes bump{
  40%{transform:scale(1.05)}
}

.tdig{
  direction:ltr;
  display:flex;
  align-items:center;
  gap:4px;
  font-variant-numeric:tabular-nums
}

.tdig span{
  width:38px;
  padding:6px 0;
  text-align:center;
  border-radius:11px;
  background:#fff;
  border:1px solid var(--edge);
  font-size:20px;
  font-weight:950;
  line-height:1.1;
  color:var(--ink)
}

.tdig i{
  font-style:normal;
  font-weight:900;
  color:#b9b1e6
}

.auction.hot .tdig span{
  background:#fff4ec;
  border-color:#ffd2b8;
  color:var(--hot)
}

.auction.hot .tdig i{
  color:var(--hot);
  animation:blink 1s steps(1) infinite
}

@keyframes blink{
  50%{opacity:.15}
}

.auction.ended .tdig span{
  opacity:.6
}

.a-bid{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:16px 4px 12px
}

.nextbox b{
  display:block;
  font-size:21px;
  font-weight:950;
  letter-spacing:-.02em;
  line-height:1.3;
  font-variant-numeric:tabular-nums;
  white-space:nowrap
}

.nextbox b small{
  font-size:10px;
  font-weight:800;
  color:var(--muted);
  margin-inline-start:3px
}

.nextbox em{
  display:inline-block;
  margin-top:3px;
  padding:2px 10px;
  border-radius:9px;
  background:var(--purple-soft);
  color:var(--purple-dark);
  font-style:normal;
  font-size:10px;
  font-weight:900
}

.bid-btn{
  position:relative;
  flex:0 0 auto;
  width:88px;
  height:88px;
  border-radius:50%;
  border:4px solid #fff;
  color:#fff;
  font-size:18px;
  font-weight:950;
  background:linear-gradient(145deg,#6246d9,#8b6cf0);
  box-shadow:0 12px 26px rgba(98,70,217,.38);
  -webkit-tap-highlight-color:transparent
}

.bid-btn:after{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:50%;
  border:3px solid #8b6cf0;
  opacity:0;
  pointer-events:none
}

.bid-btn.pulse{
  animation:press .45s ease
}

.bid-btn.pulse:after{
  animation:ring .7s ease-out
}

@keyframes press{
  0%{transform:scale(1)}
  35%{transform:scale(.86)}
  70%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

@keyframes ring{
  0%{opacity:.85;transform:scale(1)}
  100%{opacity:0;transform:scale(1.6)}
}

.bid-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  background:#9ca3af;
  box-shadow:none
}

.live-row{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:9px 12px;
  border-radius:15px;
  background:#fff;
  border:1px solid var(--line);
  text-align:start
}

.stack{
  display:flex;
  flex:0 0 auto;
  min-width:26px
}

.av{
  width:26px;
  height:26px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:950;
  color:#fff;
  border:2px solid #fff;
  margin-inline-start:-9px
}

.av:first-child{
  margin-inline-start:0
}

.ticker{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:11px;
  font-weight:800;
  color:#374151
}

.ticker b{
  font-weight:950;
  color:var(--ink)
}

.ticker.swap>span{
  display:block;
  animation:slide .45s ease
}

@keyframes slide{
  from{opacity:0;transform:translateY(9px)}
  to{opacity:1;transform:none}
}

.chev{
  width:16px;
  height:16px;
  flex:0 0 auto;
  color:var(--purple);
  fill:none;
  stroke:currentColor;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:transform .25s
}

.live-row[aria-expanded="true"] .chev{
  transform:rotate(180deg)
}

.panel{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease
}

.panel.open{
  max-height:250px;
  overflow-y:auto
}

.panel h3{
  margin:0;
  padding:12px 4px 2px;
  font-size:11px;
  font-weight:900;
  color:var(--muted)
}

.panel ul{
  list-style:none;
  margin:0;
  padding:0
}

.panel li{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 4px;
  border-bottom:1px solid var(--line)
}

.panel li:last-child{
  border-bottom:0
}

.panel .av{
  margin:0;
  width:30px;
  height:30px;
  font-size:12px
}

.panel .who{
  flex:1;
  min-width:0;
  font-size:12px;
  font-weight:900;
  line-height:1.35
}

.panel .who span{
  display:block;
  font-size:9px;
  font-weight:700;
  color:#9ca3af
}

.panel li b{
  font-size:12px;
  font-weight:950;
  font-variant-numeric:tabular-nums;
  color:var(--purple-dark)
}

.panel li.lead b{
  color:var(--gold)
}

.panel li.lead .who:after{
  content:"الأعلى";
  display:inline-block;
  margin-top:2px;
  padding:1px 7px;
  border-radius:8px;
  background:#fdf3e1;
  color:var(--gold);
  font-size:8.5px
}

.note{
  margin:10px 2px 0;
  font-size:10px;
  font-weight:700;
  color:var(--muted);
  line-height:1.7;
  text-align:center
}

/* cards */

.card{
  margin-top:12px;
  padding:14px;
  border-radius:18px;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:0 8px 20px rgba(23,32,42,.05)
}

.card h2{
  margin:0 0 8px;
  font-size:15px;
  font-weight:900;
  letter-spacing:-.02em
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  text-align:start;
  padding:9px 0;
  border-bottom:1px solid #f1eefb;
  font-size:12px;
  font-weight:800
}

th{
  width:42%;
  color:var(--muted);
  font-weight:700
}

tr:last-child th,
tr:last-child td{
  border-bottom:0
}

td.good{
  color:var(--ok)
}

/* seller */

.seller{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

.seller-info{
  min-width:0;
  flex:1
}

.seller p{
  margin:0;
  line-height:1.45
}

.seller b{
  font-size:13px;
  font-weight:900
}

.seller span{
  display:block;
  font-size:10px;
  font-weight:700;
  color:var(--muted)
}

.seller-status{
  flex:0 0 auto;
  padding:7px 10px;
  border-radius:999px;
  background:var(--purple-soft);
  color:var(--purple-dark);
  font-size:9px;
  font-weight:900;
  white-space:nowrap
}

/* notes */

.notes-card{
  margin-top:12px
}

.notes-text{
  margin:0;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:12px;
  line-height:1.8;
  font-weight:700;
  color:#374151
}

@media (prefers-reduced-motion:reduce){
  .bid-btn.pulse,
  .bid-btn.pulse:after,
  .price.bump,
  .ticker.swap>span,
  .auction.hot .tdig i{
    animation:none
  }

  .dot,
  .toast,
  .panel,
  .chev{
    transition:none
  }
}

@media (max-width:360px){

  .price{
    font-size:24px
  }

  .tdig span{
    width:34px;
    font-size:18px
  }

  .bid-btn{
    width:80px;
    height:80px
  }

}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(24px + var(--safe-bottom));
  transform:translateX(-50%) translateY(16px);
  max-width:calc(100% - 40px);
  padding:10px 14px;
  border-radius:13px;
  background:#1e2c30;
  color:#fff;
  font-size:11px;
  font-weight:800;
  box-shadow:0 14px 34px rgba(24,44,49,.12);
  opacity:0;
  pointer-events:none;
  transition:.25s ease;
  z-index:120;
  text-align:center
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}

/* أزرار الإدارة (خاصة بهذه الصفحة) */

.acts{
  display:flex;
  flex-direction:column;
  gap:10px
}

.act{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  height:44px;
  border-radius:14px;
  border:1px solid var(--edge);
  background:var(--purple-soft);
  color:var(--purple-dark);
  font-family:inherit;
  font-size:12px;
  font-weight:800;
  text-decoration:none
}

.act svg{
  width:17px;
  height:17px;
  flex:0 0 auto;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round
}

.act.danger{
  background:#fff;
  color:#c92a2a;
  border-color:#f3c7c7
}

.act:disabled{
  opacity:.5;
  cursor:not-allowed
}
</style>
</head>

<body>

<main class="page">

<header>

  <div class="topbar">

    <button class="icon-btn" id="back" type="button" aria-label="رجوع">
      <svg viewBox="0 0 24 24">
        <path d="M9 5l7 7-7 7"/>
      </svg>
    </button>

    <div class="brand-mini">
      <strong>MZAD</strong>
      <span>PHONE</span>
    </div>

    <span style="width:39px"></span>

  </div>

</header>

<div class="title">

  <h1 id="name"></h1>

  <p class="sub" id="sub"></p>

</div>

<div class="chips">

  <span class="chip ver">
    إدارة مزادك
  </span>

</div>

<section class="auction" id="auction">

  <div class="a-top">

    <span class="live" id="liveBadge">
      مزاد مستمر
    </span>

    <span class="a-count" id="count"></span>

  </div>

  <div class="a-grid">

    <div>

      <span class="label">
        السعر الحالي
      </span>

      <div class="price" id="priceBox">

        <span id="price"></span>

        <small>د.ع</small>

      </div>

    </div>

    <div role="timer">

      <span class="label" id="endLabel">
        الوقت المتبقي
      </span>

      <div class="tdig">

        <span id="hh">00</span>

        <i>:</i>

        <span id="mm">00</span>

        <i>:</i>

        <span id="ss">00</span>

      </div>

    </div>

  </div>

  <button
    class="live-row"
    id="liveRow"
    type="button"
    aria-expanded="false"
    aria-controls="panel"
    style="margin-top:14px"
  >

    <span class="stack" id="stack"></span>

    <span class="ticker" id="ticker">
      <span id="tickText"></span>
    </span>

    <svg class="chev" viewBox="0 0 24 24">
      <path d="M6 9l6 6 6-6"/>
    </svg>

  </button>

  <div
    class="panel"
    id="panel"
    role="region"
    aria-label="المزايدون"
  >

    <h3 id="panelHead"></h3>

    <ul id="bidders"></ul>

  </div>

</section>

<section class="card">

  <h2>
    تفاصيل المزاد
  </h2>

  <table id="specs"></table>

</section>

<section class="card">

  <h2>
    إدارة المزاد
  </h2>

  <div class="acts">

    <a class="act" id="viewPublic" href="#">
      <svg viewBox="0 0 24 24">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      عرض المزاد كما يراه المشتري
    </a>

    <button class="act danger" id="del" type="button">
      <svg viewBox="0 0 24 24">
        <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>
      </svg>
      حذف المزاد
    </button>

  </div>

  <p class="note" id="delNote"></p>

</section>

</main>

<div
  class="toast"
  id="toast"
  role="status"
></div>


<script type="module">

import {
  supabase
} from "./js/supabase.js?v=auction-details-final-6";


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

const fmt = n => Number(n || 0).toLocaleString("en-US");

const escapeHtml = value =>
  String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");


const params = new URLSearchParams(window.location.search);

const auctionId = params.get("id")?.trim() || "";

let auction = null;
let bids = [];
let me = null;
let ended = false;
let busy = false;
let toastT = null;
let timerInterval = null;
let refreshInterval = null;


function toast(message){

  const el = $("toast");

  el.textContent = String(message || "");

  el.classList.add("show");

  clearTimeout(toastT);

  toastT = setTimeout(() => {
    el.classList.remove("show");
  }, 2800);

}


function ago(value){

  if(!value){
    return "";
  }

  const time = new Date(value).getTime();

  if(!Number.isFinite(time)){
    return "";
  }

  const diff = Math.max(0, Date.now() - time);

  const minutes = Math.floor(diff / 60000);

  if(minutes < 1){
    return "الآن";
  }

  if(minutes < 60){
    return `منذ ${minutes} دقيقة`;
  }

  const hours = Math.floor(minutes / 60);

  if(hours < 24){
    return `منذ ${hours} ساعة`;
  }

  return `منذ ${Math.floor(hours / 24)} يوم`;

}


function colorOf(name){

  const colors = [
    "#6246d9",
    "#176b87",
    "#e8590c",
    "#1e8a5a",
    "#b9791a",
    "#c2255c"
  ];

  const text = String(name || "مستخدم");

  const total = [...text].reduce(
    (sum,char) => sum + char.charCodeAt(0),
    0
  );

  return colors[total % colors.length];

}


function av(name){

  const text = String(name || "مستخدم");

  return `
    <span
      class="av"
      style="background:${colorOf(text)}"
    >
      ${escapeHtml(text.trim()[0] || "م")}
    </span>
  `;

}


function valueText(value){

  if(value === null || value === undefined){
    return "";
  }

  if(typeof value === "string"){
    return value.trim();
  }

  if(Array.isArray(value)){
    return value.join("، ");
  }

  if(typeof value === "object"){
    return Object.values(value).filter(Boolean).join("، ");
  }

  return String(value);

}


function parseImages(value){

  if(!value){
    return [];
  }

  let data = value;

  if(typeof data === "string"){

    try{

      data = JSON.parse(data);

    }catch{

      data = data
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);

    }

  }

  if(!Array.isArray(data)){

    data =
      typeof data === "object"
        ? Object.values(data)
        : [data];

  }

  return data
    .map(item => {

      if(!item){
        return "";
      }

      if(typeof item === "string"){
        return item.trim();
      }

      if(typeof item === "object"){

        return (
          item.path ||
          item.url ||
          ""
        );

      }

      return "";

    })
    .filter(Boolean);

}


/* =========================================================
   AUCTION META (نسخة احتياطية داخل notes)
========================================================= */

function parseAuctionMeta(raw){

  const text = valueText(raw);

  const at = text.indexOf("MZAD_AUCTION_META");

  if(at < 0){
    return {};
  }

  const rest = text.slice(at + "MZAD_AUCTION_META".length);

  const s = rest.indexOf("{");
  const e = rest.lastIndexOf("}");

  if(s < 0 || e < s){
    return {};
  }

  try{

    const obj = JSON.parse(rest.slice(s, e + 1));

    return obj && typeof obj === "object" ? obj : {};

  }catch{

    return {};

  }

}


const toTime = value =>
  value
    ? new Date(value).getTime()
    : NaN;


function getEndTime(){

  if(!auction){
    return null;
  }

  const meta = parseAuctionMeta(auction.notes);

  let base = toTime(auction.auction_ends_at);

  if(!Number.isFinite(base)){
    base = toTime(meta.ends_at);
  }

  if(!Number.isFinite(base)){

    const created = toTime(auction.created_at);

    const duration =
      Number(auction.duration_hours) ||
      Number(meta.duration_hours) ||
      0;

    if(Number.isFinite(created) && duration > 0){
      base = created + duration * 60 * 60 * 1000;
    }

  }

  return Number.isFinite(base) ? base : null;

}


function startPrice(){

  const meta = parseAuctionMeta(auction.notes);

  return Number(
    auction.auction_start_price ??
    meta.start_price ??
    auction.price ??
    0
  );

}


function currentPrice(){

  if(bids.length){

    return Number(
      bids[0].amount ||
      auction.auction_current_price ||
      startPrice() ||
      0
    );

  }

  return Number(
    auction.auction_current_price ??
    startPrice() ??
    0
  );

}


/* =========================================================
   LOAD
========================================================= */

async function init(){

  if(!auctionId){

    $("name").textContent = "المزاد غير موجود";

    $("del").disabled = true;

    return;

  }


  try{

    const {
      data: sessionData
    } = await supabase.auth.getSession();

    me = sessionData?.session?.user || null;


    if(!me){

      const back = `seller-auction.html?id=${encodeURIComponent(auctionId)}`;

      sessionStorage.setItem("mzad_pending_action", back);

      location.replace(
        `index.html?login=1&returnTo=${encodeURIComponent(back)}`
      );

      return;

    }


    const { data, error } = await supabase
      .from("devices")
      .select("*")
      .eq("id", auctionId)
      .maybeSingle();


    if(error){
      throw error;
    }


    if(!data){

      $("name").textContent = "المزاد غير موجود أو تم حذفه";

      $("del").disabled = true;

      return;

    }


    /* ليس بائع هذا المزاد: نرجعه للصفحة العامة */

    if(String(data.seller_id || "") !== String(me.id)){

      location.replace(
        `auction-details.html?id=${encodeURIComponent(auctionId)}`
      );

      return;

    }


    auction = data;

    $("viewPublic").href =
      `auction-details.html?id=${encodeURIComponent(auction.id)}&view=public`;

    await loadBids();

    render();

    tick();

    refreshInterval = setInterval(refresh, 5000);

    timerInterval = setInterval(tick, 1000);


  }catch(error){

    console.error("SELLER PAGE LOAD ERROR:", error);

    $("name").textContent = "تعذر تحميل المزاد";

    $("del").disabled = true;

    toast("تعذر تحميل بيانات المزاد");

  }

}


async function loadBids(){

  const { data, error } = await supabase
    .from("auction_bids")
    .select(`
      id,
      auction_id,
      user_id,
      bidder_name,
      amount,
      created_at
    `)
    .eq("auction_id", auction.id)
    .order("amount", { ascending:false })
    .order("created_at", { ascending:false })
    .limit(100);


  if(error){

    console.error("SELLER BIDS LOAD ERROR:", error);

    return;

  }


  bids = data || [];

}


async function refresh(){

  if(!auction?.id || busy){
    return;
  }


  try{

    const { data, error } = await supabase
      .from("devices")
      .select("*")
      .eq("id", auction.id)
      .maybeSingle();


    if(error){
      return;
    }


    if(!data){

      /* حُذف من مكان آخر */

      location.href = "auctions.html";

      return;

    }


    auction = {
      ...auction,
      ...data
    };


    await loadBids();

    render();

    tick();


  }catch(error){

    console.error("SELLER REFRESH ERROR:", error);

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const title = [
    auction.brand,
    auction.model
  ]
    .filter(Boolean)
    .join(" ");


  $("name").textContent = title || "جهاز";


  $("sub").textContent = [
    auction.storage,
    auction.color,
    auction.location
  ]
    .filter(Boolean)
    .join(" • ");


  $("count").textContent = `${bids.length} مزايدة`;


  $("price").textContent = fmt(currentPrice());


  /* المزايدون */

  const seen = new Set();

  const unique = [];

  for(const b of bids){

    const key = b.user_id || b.bidder_name || b.id;

    if(seen.has(key)){
      continue;
    }

    seen.add(key);

    unique.push(b);

  }


  $("stack").innerHTML = unique
    .slice(0,3)
    .map(b => av(b.bidder_name || "مستخدم"))
    .join("");


  const top = bids[0];


  if(top){

    $("tickText").innerHTML =
      `<b>${escapeHtml(top.bidder_name || "مستخدم")}</b> زايد ${fmt(top.amount)} د.ع • ${ago(top.created_at)}`;

  }else{

    $("tickText").textContent = "لا توجد مزايدات بعد";

  }


  $("panelHead").textContent = `المزايدون (${bids.length})`;


  $("bidders").innerHTML = bids
    .slice(0,20)
    .map(
      (b,index) => `

        <li class="${index === 0 ? "lead" : ""}">

          ${av(b.bidder_name || "مستخدم")}

          <span class="who">

            ${escapeHtml(b.bidder_name || "مستخدم")}

            <span>
              ${escapeHtml(ago(b.created_at))}
            </span>

          </span>

          <b>
            ${fmt(b.amount)} د.ع
          </b>

        </li>

      `
    )
    .join("");


  /* جدول التفاصيل */

  const end = getEndTime();

  const rows = [
    ["سعر البداية", `${fmt(startPrice())} د.ع`],
    ["الزيادة", `${fmt(Number(auction.auction_bid_step) || 10000)} د.ع`],
    ["عدد المزايدات", String(bids.length)]
  ];


  if(end){

    rows.push([
      "وقت الانتهاء",
      new Date(end).toLocaleString("ar-IQ")
    ]);

  }


  $("specs").innerHTML = rows
    .map(
      ([key,value]) => `

        <tr>

          <th>${escapeHtml(key)}</th>

          <td>${escapeHtml(value)}</td>

        </tr>

      `
    )
    .join("");


  /* الحذف */

  if(bids.length){

    $("del").disabled = true;

    $("delNote").textContent =
      "لا يمكن حذف المزاد بعد وجود مزايدات عليه، حفاظاً على حق المزايدين.";

  }else{

    $("del").disabled = busy;

    $("delNote").textContent =
      "يمكنك حذف المزاد طالما لا توجد عليه مزايدات.";

  }

}


/* =========================================================
   TIMER
========================================================= */

function tick(){

  if(!auction){
    return;
  }


  const end = getEndTime();


  if(!end){

    $("hh").textContent = "00";

    $("mm").textContent = "00";

    $("ss").textContent = "00";

    $("endLabel").textContent = "وقت الانتهاء غير محدد";

    return;

  }


  const left = Math.max(
    0,
    Math.ceil((end - Date.now()) / 1000)
  );


  const p = n => String(n).padStart(2,"0");


  $("hh").textContent = p(Math.floor(left / 3600));

  $("mm").textContent = p(Math.floor((left % 3600) / 60));

  $("ss").textContent = p(left % 60);


  $("auction").classList.toggle(
    "hot",
    left > 0 && left <= 5 * 60
  );


  if(left <= 0){

    ended = true;

    $("auction").classList.remove("hot");

    $("auction").classList.add("ended");

    $("liveBadge").textContent = "انتهى المزاد";

    $("endLabel").textContent = "انتهى المزاد";

    return;

  }


  ended = false;

  $("auction").classList.remove("ended");

  $("liveBadge").textContent = "مزاد مستمر";

  $("endLabel").textContent = "الوقت المتبقي";

}


/* =========================================================
   PANEL
========================================================= */

$("liveRow").onclick = event => {

  const open = $("panel").classList.toggle("open");

  event.currentTarget.setAttribute("aria-expanded", open);

};


/* =========================================================
   DELETE
   الحذف يتم عبر دالة delete_auction في Supabase
   (تتحقق أنك البائع وأنه لا توجد مزايدات).
========================================================= */

$("del").onclick = async () => {

  if(!auction?.id || busy){
    return;
  }


  /* تحديث أخير قبل الحذف */

  await loadBids();

  render();


  if(bids.length){

    toast("لا يمكن حذف مزاد عليه مزايدات");

    return;

  }


  if(!confirm("هل تريد حذف المزاد نهائياً؟ لا يمكن التراجع عن ذلك.")){
    return;
  }


  busy = true;

  $("del").disabled = true;


  try{

    const { data, error } = await supabase.rpc(
      "delete_auction",
      {
        p_auction_id: String(auction.id)
      }
    );


    if(error){

      console.error("DELETE AUCTION ERROR:", error);

      let message = error.message || "تعذر حذف المزاد";

      if(
        message.includes("delete_auction") &&
        (
          message.includes("function") ||
          message.includes("schema cache")
        )
      ){

        message = "ميزة الحذف غير مفعلة في قاعدة البيانات بعد";

      }

      toast(message);

      return;

    }


    /* حذف الصور من التخزين (محاولة، لا تؤثر على النتيجة) */

    try{

      const paths = parseImages(data?.images)
        .filter(p => !/^(https?:|data:)/.test(p))
        .map(p =>
          p
            .replace(/^\/+/,"")
            .replace(/^device-images\//,"")
        );


      if(paths.length){

        await supabase
          .storage
          .from("device-images")
          .remove(paths);

      }

    }catch{}


    clearInterval(refreshInterval);

    toast("تم حذف المزاد");

    setTimeout(() => {
      location.href = "auctions.html";
    }, 1200);


  }catch(error){

    console.error("DELETE ERROR:", error);

    toast(error?.message || "حدث خطأ أثناء الحذف");

  }finally{

    busy = false;

    if(auction){
      render();
    }

  }

};


/* =========================================================
   BACK
========================================================= */

$("back").onclick = () => {

  if(document.referrer && history.length > 1){

    history.back();

  }else{

    location.href = "auctions.html";

  }

};


window.addEventListener(
  "pagehide",
  () => {

    clearInterval(timerInterval);

    clearInterval(refreshInterval);

  }
);


init();

</script>
