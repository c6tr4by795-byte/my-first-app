<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#176b87">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MZAD PHONE">
<title>MZAD PHONE — تفاصيل المزاد</title>
<style>
:root{
  --bg:#f7f8fa; --surface:#fff; --surface-2:#eef3f7; --ink:#17202a; --muted:#667085; --line:#e6e9ed;
  --primary:#176b87; --primary-dark:#125a73; --primary-soft:#e8f3f6; --purple:#6246d9; --edge:#ddd8f8;
  --ok:#1e8a5a; --hot:#e8590c; --gold:#b9791a; --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.page{width:min(100%,520px);margin:0 auto;padding:0 14px calc(104px + var(--safe-bottom))}

/* header */
header{margin-inline:-14px;padding:0 14px 14px;background:linear-gradient(145deg,#fff 0%,#f5f2ff 45%,#e6e1ff 100%);
  border-radius:0 0 24px 24px;border-bottom:1px solid var(--line);box-shadow:0 10px 26px rgba(23,32,42,.06)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px 0}
.brand-mini{display:flex;flex-direction:column;align-items:center;line-height:.9}
.brand-mini strong{font-size:16px;letter-spacing:-.03em}
.brand-mini span{font-size:7px;font-weight:800;letter-spacing:.15em;color:#8a96a3;margin-top:3px}
.icon-btn{width:39px;height:34px;display:grid;place-items:center;border:1px solid #d8d0f5;border-radius:12px;background:#fff;
  color:var(--primary);box-shadow:0 7px 18px rgba(23,32,42,.045)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#fav[aria-pressed="true"]{color:var(--purple)}
#fav[aria-pressed="true"] svg{fill:var(--purple)}

/* gallery */
.gallery{margin-top:12px;border-radius:22px;overflow:hidden;border:1px solid var(--edge);box-shadow:0 12px 28px rgba(98,70,217,.12)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;aspect-ratio:1/.82;display:grid;place-items:center}
.slide svg{height:80%;width:auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.22))}
.dots{display:flex;justify-content:center;gap:6px;margin-top:9px}
.dot{width:6px;height:6px;border-radius:50%;background:#ccd8d8;transition:.2s ease}
.dot.active{width:19px;border-radius:999px;background:var(--purple)}

/* title */
.title{margin:14px 2px 0}
.title h1{margin:0;font-size:21px;line-height:1.25;letter-spacing:-.035em;font-weight:950}
.sub{margin:3px 0 0;color:var(--muted);font-size:12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 2px 0}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:0 10px;border-radius:999px;font-size:10px;font-weight:900;
  color:var(--primary);background:var(--primary-soft)}
.chip.ver{background:#fff;border:1px solid #9edfe3}
.chip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* auction clock card */
.clock{position:relative;isolation:isolate;overflow:hidden;margin-top:14px;padding:12px 13px 14px;border-radius:22px;color:#fff;
  background:linear-gradient(145deg,#243b80 0%,#4d43a8 55%,#7c3aed 100%);box-shadow:0 16px 34px rgba(76,67,168,.18)}
.clock:before,.clock:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.06);z-index:-1}
.clock:before{width:240px;height:240px;inset-inline-start:-88px;top:-120px}
.clock:after{width:220px;height:220px;inset-inline-end:-92px;bottom:-128px}
.clock-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{display:inline-flex;align-items:center;gap:7px;min-height:26px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.16);font-size:10px;font-weight:900}
.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:#5eead4}
.clock.ended .badge:before{background:#cbd5e1}
.state{font-size:10px;font-weight:800;color:rgba(255,255,255,.73)}
.digits{direction:ltr;display:flex;justify-content:center;align-items:center;gap:7px;margin-top:14px;font-variant-numeric:tabular-nums}
.unit{min-width:80px;text-align:center;padding:9px 0 7px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.unit b{display:block;font-size:40px;line-height:1.05;font-weight:950;letter-spacing:-.02em}
.unit span{font-size:9px;font-weight:800;color:rgba(255,255,255,.7)}
.sep{font-size:26px;font-weight:900;opacity:.45}
.clock.hot .unit b{color:#ffd2b8}
.clock.hot .unit:last-child{animation:pulse 1s steps(1) infinite}
@keyframes pulse{50%{background:rgba(232,89,12,.28)}}
@media (prefers-reduced-motion:reduce){.clock.hot .unit:last-child{animation:none}.dot{transition:none}.toast{transition:none}}
.clock-note{margin:12px 0 0;font-size:10px;line-height:1.7;color:rgba(255,255,255,.79);text-align:center}

/* cards */
.card{position:relative;overflow:hidden;margin-top:12px;padding:14px;border-radius:18px;border:1px solid var(--edge);
  background:linear-gradient(145deg,#fff 0%,#f4f1ff 48%,#e7e1ff 100%);box-shadow:0 12px 28px rgba(98,70,217,.09)}
.card.plain{background:#fff;border-color:var(--line);box-shadow:0 8px 20px rgba(23,32,42,.06)}
.card h2{margin:0 0 8px;font-size:15px;font-weight:900;letter-spacing:-.02em}
.price-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.label{font-size:10px;font-weight:800;color:var(--muted)}
.price{font-size:27px;font-weight:950;color:var(--primary);line-height:1.2;letter-spacing:-.03em}
.price small{font-size:12px;font-weight:800;color:var(--muted);margin-inline-start:4px}
.count{font-size:20px;font-weight:950;text-align:end}
.note{margin:9px 0 0;font-size:10px;font-weight:700;color:var(--muted);line-height:1.7}

table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:9px 0;border-bottom:1px solid #edf0f2;font-size:12px;font-weight:800}
th{width:42%;color:var(--muted);font-weight:700}
tr:last-child th,tr:last-child td{border-bottom:0}
td.good{color:var(--ok)}

.bids{list-style:none;margin:0;padding:0}
.bids li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #edf0f2}
.bids li:last-child{border-bottom:0}
.who{display:flex;flex-direction:column;font-size:13px;font-weight:900;line-height:1.35}
.who span{font-size:9px;font-weight:700;color:#9aa3aa}
.bids b{font-size:12.5px;font-weight:950;font-variant-numeric:tabular-nums;color:var(--primary)}
.bids li.lead b{color:var(--gold)}
.bids li.lead .who:after{content:"الأعلى";align-self:flex-start;margin-top:2px;font-size:8.5px;padding:2px 7px;border-radius:8px;background:#fdf3e1;color:var(--gold)}

.seller{display:flex;align-items:center;gap:11px}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:18px;font-weight:950;color:#fff;
  background:linear-gradient(145deg,#176b87,#32b8c4)}
.seller p{margin:0;line-height:1.45}
.seller b{font-size:13px;font-weight:900}
.seller span{display:block;font-size:10px;font-weight:700;color:var(--muted)}

/* bid bar (same floating style as bottom nav) */
.bar-wrap{position:fixed;inset-inline:0;bottom:-7px;z-index:100;padding:7px 10px calc(7px + var(--safe-bottom));pointer-events:none}
.bar{width:min(100%,520px);margin:0 auto;padding:7px;border-radius:20px;background:rgba(255,255,255,.97);border:1px solid #e7ecef;
  box-shadow:0 10px 28px rgba(23,32,42,.10);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);pointer-events:auto}
.bar-row{display:flex;gap:8px}
.stepper{flex:1;display:flex;align-items:center;min-width:0;border:1px solid var(--edge);border-radius:14px;background:#faf9ff;overflow:hidden}
.stepper:focus-within{border-color:var(--purple)}
.stepper button{width:40px;align-self:stretch;font-size:20px;font-weight:900;color:var(--primary)}
.stepper input{flex:1;min-width:0;border:0;background:transparent;text-align:center;direction:ltr;font-size:15px;font-weight:950;color:var(--ink);
  font-variant-numeric:tabular-nums}
.stepper input:focus-visible{outline:none}
.go{flex:0 0 auto;height:46px;padding:0 20px;border-radius:14px;color:#fff;font-size:13px;font-weight:950;
  background:linear-gradient(145deg,#176b87,#32b8c4);box-shadow:0 6px 14px rgba(23,107,135,.18)}
.go:active{transform:scale(.97)}
.go:disabled,.stepper.off{opacity:.5;cursor:not-allowed}
.err{margin:0;padding:0 6px;font-size:10px;font-weight:800;color:var(--hot);min-height:0}
.err:not(:empty){margin-top:5px}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bottom));transform:translateX(-50%) translateY(16px);max-width:calc(100% - 40px);
  padding:10px 14px;border-radius:13px;background:#1e2c30;color:#fff;font-size:11px;font-weight:800;box-shadow:0 14px 34px rgba(24,44,49,.12);
  opacity:0;pointer-events:none;transition:.25s ease;z-index:120;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main class="page">

<header>
  <div class="topbar">
    <button class="icon-btn" id="back" type="button" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="brand-mini"><strong>MZAD</strong><span>PHONE</span></div>
    <button class="icon-btn" id="fav" type="button" aria-pressed="false" aria-label="إضافة إلى المفضلة"><svg viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/></svg></button>
  </div>
  <section class="gallery" aria-label="صور الجهاز"><div class="slides" id="slides"></div></section>
  <div class="dots" id="dots"></div>
</header>

<div class="title">
  <h1 id="name"></h1>
  <p class="sub" id="sub"></p>
</div>
<div class="chips">
  <span class="chip ver"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 7.8 7 10 4-2.2 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>MZAD VERIFIED</span>
  <span class="chip" id="cond"></span>
</div>

<section class="clock" id="clock">
  <div class="clock-top"><span class="badge" id="badge">مزاد مستمر</span><span class="state" id="endLabel">الوقت المتبقي</span></div>
  <div class="digits" role="timer">
    <div class="unit"><b id="hh">00</b><span>ساعة</span></div><span class="sep">:</span>
    <div class="unit"><b id="mm">00</b><span>دقيقة</span></div><span class="sep">:</span>
    <div class="unit"><b id="ss">00</b><span>ثانية</span></div>
  </div>
  <p class="clock-note">أي مزايدة بآخر 30 ثانية تمدد المزاد دقيقة إضافية</p>
</section>

<section class="card">
  <div class="price-row">
    <div><span class="label">السعر الحالي</span><div class="price"><span id="price"></span><small>د.ع</small></div></div>
    <div><span class="label">المزايدات</span><div class="count" id="count"></div></div>
  </div>
  <p class="note" id="note"></p>
</section>

<section class="card plain"><h2>مواصفات الجهاز</h2><table id="specs"></table></section>
<section class="card plain"><h2>آخر المزايدات</h2><ul class="bids" id="bids"></ul></section>
<section class="card plain"><h2>البائع</h2>
  <div class="seller"><div class="avatar" id="sAv"></div><p><b id="sName"></b><span id="sInfo"></span></p></div>
</section>

</main>

<div class="bar-wrap">
  <div class="bar">
    <div class="bar-row">
      <div class="stepper" id="stepper">
        <button type="button" id="plus" aria-label="زيادة المبلغ">+</button>
        <input id="amount" inputmode="numeric" autocomplete="off" aria-label="مبلغ مزايدتك بالدينار العراقي">
        <button type="button" id="minus" aria-label="تقليل المبلغ">−</button>
      </div>
      <button class="go" id="go" type="button">زايد الآن</button>
    </div>
    <p class="err" id="err" role="alert"></p>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* بيانات تجريبية: استبدلها ببيانات Supabase */
const auction={
  title:'iPhone 15 Pro Max', sub:'256GB • Natural Titanium • النجف', condition:'نظيف جداً',
  price:1150000, step:10000, endsAt:Date.now()+(42*60+18)*1000, bidCount:17,
  specs:[['الجهاز','iPhone 15 Pro Max'],['السعة','256GB'],['البطارية','91%'],['اللون','Natural Titanium'],['الشاشة','أصلية'],
    ['Face ID','يعمل',1],['الكاميرات','تعمل',1],['الهيكل','نظيف'],['فك أو تبديل قطع','لا يوجد']],
  bids:[{n:'علي',a:1150000,t:Date.now()-60e3},{n:'زهراء',a:1140000,t:Date.now()-4*60e3},
    {n:'مصطفى',a:1120000,t:Date.now()-11*60e3},{n:'حسين',a:1100000,t:Date.now()-26*60e3}],
  seller:{name:'أبو حيدر للموبايلات',rating:4.9,sales:23}
};
const EXT_WINDOW=30, EXT_BY=60;
const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString('en-US');
let ended=false, toastT;

/* gallery */
const pal=[['#243b80','#7c3aed'],['#176b87','#32b8c4'],['#4d43a8','#9b8cf0']];
const phone=c=>`<svg viewBox="0 0 120 240" aria-hidden="true"><rect x="4" y="4" width="112" height="232" rx="22" fill="#1d2430"/><rect x="10" y="10" width="100" height="220" rx="17" fill="${c}"/><rect x="44" y="16" width="32" height="9" rx="4.5" fill="#0c0f11"/></svg>`;
$('slides').innerHTML=pal.map((p,i)=>`<div class="slide" style="background:linear-gradient(145deg,#fff,#efeaff)" role="img" aria-label="صورة ${i+1} من ${pal.length}">${phone(p[0])}</div>`).join('');
$('dots').innerHTML=pal.map((_,i)=>`<span class="dot${i?'':' active'}"></span>`).join('');
$('slides').addEventListener('scroll',e=>{
  const el=e.target,i=Math.round(Math.abs(el.scrollLeft)/el.clientWidth);
  [...$('dots').children].forEach((d,k)=>d.classList.toggle('active',k===i));
},{passive:true});

/* render */
const ago=t=>{const m=Math.max(1,Math.round((Date.now()-t)/6e4));return m<60?`منذ ${m} دقيقة`:`منذ ${Math.round(m/60)} ساعة`};
function render(){
  $('name').textContent=auction.title; $('sub').textContent=auction.sub; $('cond').textContent=auction.condition;
  $('price').textContent=fmt(auction.price); $('count').textContent=auction.bidCount;
  $('note').textContent=`الحد الأدنى للمزايدة ${fmt(auction.step)} د.ع، وأقل مبلغ مقبول الآن ${fmt(auction.price+auction.step)} د.ع`;
  $('specs').innerHTML=auction.specs.map(([k,v,g])=>`<tr><th>${k}</th><td class="${g?'good':''}">${v}</td></tr>`).join('');
  $('bids').innerHTML=auction.bids.slice(0,5).map((b,i)=>`<li class="${i?'':'lead'}"><span class="who">${b.n}<span>${ago(b.t)}</span></span><b>${fmt(b.a)} د.ع</b></li>`).join('');
  const s=auction.seller; $('sAv').textContent=s.name.trim()[0]; $('sName').textContent=s.name;
  $('sInfo').textContent=`تقييم ${s.rating} من 5 • ${s.sales} عملية بيع`;
}

/* timer */
function tick(){
  const left=Math.max(0,Math.ceil((auction.endsAt-Date.now())/1000)), p=n=>String(n).padStart(2,'0');
  $('hh').textContent=p(Math.floor(left/3600)); $('mm').textContent=p(Math.floor(left%3600/60)); $('ss').textContent=p(left%60);
  $('clock').classList.toggle('hot',left>0&&left<=300);
  if(left===0&&!ended)finish();
}
function finish(){
  ended=true; $('clock').classList.add('ended');
  $('badge').textContent='انتهى المزاد'; $('endLabel').textContent='الفائز: '+auction.bids[0].n;
  $('go').disabled=true; $('go').textContent='انتهى'; $('stepper').classList.add('off'); $('amount').disabled=true;
}

/* bidding */
const min=()=>auction.price+auction.step;
const val=()=>parseInt($('amount').value.replace(/[^\d]/g,''),10)||0;
const setAmt=n=>{$('amount').value=fmt(n);$('err').textContent=''};
$('plus').onclick=()=>setAmt(Math.max(val(),min())+auction.step);
$('minus').onclick=()=>setAmt(Math.max(min(),val()-auction.step));
$('amount').addEventListener('input',e=>{const n=val();e.target.value=n?fmt(n):''});
$('go').onclick=()=>{
  if(ended)return;
  const n=val();
  if(n<min()){$('err').textContent=`المبلغ أقل من الحد الأدنى، أدخل ${fmt(min())} د.ع أو أكثر`;return}
  /* عند الربط مع Supabase: نفّذ المزايدة بدالة على السيرفر (RPC) تتحقق من الوقت والسعر */
  auction.price=n; auction.bidCount++; auction.bids.unshift({n:'أنت',a:n,t:Date.now()});
  let msg='تمت المزايدة بنجاح';
  if((auction.endsAt-Date.now())/1000<=EXT_WINDOW){auction.endsAt+=EXT_BY*1000;msg+=' وتمدد المزاد دقيقة'}
  render(); setAmt(min()); tick(); toast(msg);
};

$('fav').onclick=e=>{
  const b=e.currentTarget,on=b.getAttribute('aria-pressed')!=='true';
  b.setAttribute('aria-pressed',on); b.setAttribute('aria-label',on?'إزالة من المفضلة':'إضافة إلى المفضلة');
  toast(on?'تمت إضافة الجهاز إلى المفضلة':'تمت إزالة الجهاز من المفضلة');
};
$('back').onclick=()=>history.length>1?history.back():location.href='auctions.html';
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200)}

render(); setAmt(min()); tick(); setInterval(tick,1000);
</script>
</body>
</html>
