<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MZAD PHONE">
<title>MZAD PHONE — تفاصيل المزاد</title>

<style>
:root{
  --bg:#f9f8fd; --ink:#17202a; --muted:#6b7280; --line:#ece8fb;
  --primary:#176b87; --primary-soft:#e8f3f6; --purple:#6246d9; --purple-dark:#4a34b8; --purple-soft:#f3f0ff; --edge:#e0daf8;
  --ok:#1e8a5a; --hot:#e8590c; --gold:#b9791a; --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility
}

button{
  font:inherit;
  border:0;
  background:none;
  color:inherit;
  cursor:pointer
}

:focus-visible{
  outline:3px solid var(--purple);
  outline-offset:2px
}

.page{
  width:min(100%,520px);
  margin:0 auto;
  padding:0 14px calc(40px + var(--safe-bottom))
}

/* header */

header{
  margin-inline:-14px;
  padding:0 14px 14px;
  background:linear-gradient(145deg,#fff 0%,#f7f5ff 55%,#ece8ff 100%);
  border-radius:0 0 24px 24px;
  border-bottom:1px solid var(--line);
  box-shadow:0 10px 26px rgba(23,32,42,.05)
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 2px 0
}

.brand-mini{
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:.9
}

.brand-mini strong{
  font-size:16px;
  letter-spacing:-.03em
}

.brand-mini span{
  font-size:7px;
  font-weight:800;
  letter-spacing:.15em;
  color:#8a96a3;
  margin-top:3px
}

.icon-btn{
  width:39px;
  height:34px;
  display:grid;
  place-items:center;
  border:1px solid var(--edge);
  border-radius:12px;
  background:#fff;
  color:var(--purple);
  box-shadow:0 7px 18px rgba(23,32,42,.045)
}

.icon-btn svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round
}

#fav[aria-pressed="true"] svg{
  fill:var(--purple)
}

/* gallery */

.gallery{
  margin-top:12px;
  border-radius:22px;
  overflow:hidden;
  border:1px solid var(--edge);
  box-shadow:0 12px 28px rgba(98,70,217,.10)
}

.slides{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  overscroll-behavior-x:contain
}

.slides::-webkit-scrollbar{
  display:none
}

.slide{
  flex:0 0 100%;
  scroll-snap-align:center;
  scroll-snap-stop:always;
  aspect-ratio:1/.82;
  display:grid;
  place-items:center;
  overflow:hidden
}

.slide svg{
  height:80%;
  width:auto;
  filter:drop-shadow(0 14px 18px rgba(74,52,184,.22))
}

.slide img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block
}

.dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:9px
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#d6d2ea;
  transition:.2s ease
}

.dot.active{
  width:19px;
  border-radius:999px;
  background:var(--purple)
}

/* title */

.title{
  margin:14px 2px 0
}

.title h1{
  margin:0;
  font-size:21px;
  line-height:1.25;
  letter-spacing:-.035em;
  font-weight:950
}

.sub{
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
  font-weight:700
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:10px 2px 0
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:26px;
  padding:0 10px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  color:var(--purple-dark);
  background:var(--purple-soft)
}

.chip.ver{
  background:#fff;
  border:1px solid #9edfe3;
  color:var(--primary)
}

.chip svg{
  width:13px;
  height:13px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

/* auction */

.auction{
  margin-top:14px;
  padding:14px;
  border-radius:24px;
  border:1px solid var(--edge);
  background:
    radial-gradient(circle at 100% 0,rgba(98,70,217,.10),transparent 55%),
    linear-gradient(145deg,#fff 0%,#f7f5ff 60%,#efebff 100%);
  box-shadow:0 14px 32px rgba(98,70,217,.10)
}

.a-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:26px;
  padding:0 10px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--edge);
  font-size:10px;
  font-weight:900;
  color:var(--purple-dark)
}

.live:before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--ok)
}

.auction.hot .live:before{
  background:var(--hot)
}

.auction.ended .live:before{
  background:#9ca3af
}

.a-count{
  font-size:10px;
  font-weight:800;
  color:var(--muted)
}

.a-grid{
  display:grid;
  grid-template-columns:1fr auto;
  gap:14px;
  align-items:end;
  margin-top:14px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line)
}

.label{
  display:block;
  font-size:10px;
  font-weight:800;
  color:var(--muted);
  margin-bottom:3px
}

.price{
  font-size:28px;
  font-weight:950;
  color:var(--purple-dark);
  line-height:1.15;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap
}

.price small{
  font-size:11px;
  font-weight:800;
  color:var(--muted);
  margin-inline-start:4px;
  letter-spacing:0
}

.price.bump{
  animation:bump .4s ease
}

@keyframes bump{
  40%{transform:scale(1.05)}
}

.tdig{
  direction:ltr;
  display:flex;
  align-items:center;
  gap:4px;
  font-variant-numeric:tabular-nums
}

.tdig span{
  width:38px;
  padding:6px 0;
  text-align:center;
  border-radius:11px;
  background:#fff;
  border:1px solid var(--edge);
  font-size:20px;
  font-weight:950;
  line-height:1.1;
  color:var(--ink)
}

.tdig i{
  font-style:normal;
  font-weight:900;
  color:#b9b1e6
}

.auction.hot .tdig span{
  background:#fff4ec;
  border-color:#ffd2b8;
  color:var(--hot)
}

.auction.hot .tdig i{
  color:var(--hot);
  animation:blink 1s steps(1) infinite
}

@keyframes blink{
  50%{opacity:.15}
}

.auction.ended .tdig span{
  opacity:.6
}

.a-bid{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:16px 4px 12px
}

.nextbox b{
  display:block;
  font-size:21px;
  font-weight:950;
  letter-spacing:-.02em;
  line-height:1.3;
  font-variant-numeric:tabular-nums;
  white-space:nowrap
}

.nextbox b small{
  font-size:10px;
  font-weight:800;
  color:var(--muted);
  margin-inline-start:3px
}

.nextbox em{
  display:inline-block;
  margin-top:3px;
  padding:2px 10px;
  border-radius:9px;
  background:var(--purple-soft);
  color:var(--purple-dark);
  font-style:normal;
  font-size:10px;
  font-weight:900
}

.bid-btn{
  position:relative;
  flex:0 0 auto;
  width:88px;
  height:88px;
  border-radius:50%;
  border:4px solid #fff;
  color:#fff;
  font-size:18px;
  font-weight:950;
  background:linear-gradient(145deg,#6246d9,#8b6cf0);
  box-shadow:0 12px 26px rgba(98,70,217,.38);
  -webkit-tap-highlight-color:transparent
}

.bid-btn:after{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:50%;
  border:3px solid #8b6cf0;
  opacity:0;
  pointer-events:none
}

.bid-btn.pulse{
  animation:press .45s ease
}

.bid-btn.pulse:after{
  animation:ring .7s ease-out
}

@keyframes press{
  0%{transform:scale(1)}
  35%{transform:scale(.86)}
  70%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

@keyframes ring{
  0%{opacity:.85;transform:scale(1)}
  100%{opacity:0;transform:scale(1.6)}
}

.bid-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  background:#9ca3af;
  box-shadow:none
}

.live-row{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:9px 12px;
  border-radius:15px;
  background:#fff;
  border:1px solid var(--line);
  text-align:start
}

.stack{
  display:flex;
  flex:0 0 auto;
  min-width:26px
}

.av{
  width:26px;
  height:26px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:950;
  color:#fff;
  border:2px solid #fff;
  margin-inline-start:-9px
}

.av:first-child{
  margin-inline-start:0
}

.ticker{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:11px;
  font-weight:800;
  color:#374151
}

.ticker b{
  font-weight:950;
  color:var(--ink)
}

.ticker.swap>span{
  display:block;
  animation:slide .45s ease
}

@keyframes slide{
  from{opacity:0;transform:translateY(9px)}
  to{opacity:1;transform:none}
}

.chev{
  width:16px;
  height:16px;
  flex:0 0 auto;
  color:var(--purple);
  fill:none;
  stroke:currentColor;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:transform .25s
}

.live-row[aria-expanded="true"] .chev{
  transform:rotate(180deg)
}

.panel{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease
}

.panel.open{
  max-height:250px;
  overflow-y:auto
}

.panel h3{
  margin:0;
  padding:12px 4px 2px;
  font-size:11px;
  font-weight:900;
  color:var(--muted)
}

.panel ul{
  list-style:none;
  margin:0;
  padding:0
}

.panel li{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 4px;
  border-bottom:1px solid var(--line)
}

.panel li:last-child{
  border-bottom:0
}

.panel .av{
  margin:0;
  width:30px;
  height:30px;
  font-size:12px
}

.panel .who{
  flex:1;
  min-width:0;
  font-size:12px;
  font-weight:900;
  line-height:1.35
}

.panel .who span{
  display:block;
  font-size:9px;
  font-weight:700;
  color:#9ca3af
}

.panel li b{
  font-size:12px;
  font-weight:950;
  font-variant-numeric:tabular-nums;
  color:var(--purple-dark)
}

.panel li.lead b{
  color:var(--gold)
}

.panel li.lead .who:after{
  content:"الأعلى";
  display:inline-block;
  margin-top:2px;
  padding:1px 7px;
  border-radius:8px;
  background:#fdf3e1;
  color:var(--gold);
  font-size:8.5px
}

.note{
  margin:10px 2px 0;
  font-size:10px;
  font-weight:700;
  color:var(--muted);
  line-height:1.7;
  text-align:center
}

/* cards */

.card{
  margin-top:12px;
  padding:14px;
  border-radius:18px;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:0 8px 20px rgba(23,32,42,.05)
}

.card h2{
  margin:0 0 8px;
  font-size:15px;
  font-weight:900;
  letter-spacing:-.02em
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  text-align:start;
  padding:9px 0;
  border-bottom:1px solid #f1eefb;
  font-size:12px;
  font-weight:800
}

th{
  width:42%;
  color:var(--muted);
  font-weight:700
}

tr:last-child th,
tr:last-child td{
  border-bottom:0
}

td.good{
  color:var(--ok)
}

/* seller */

.seller{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

.seller-info{
  min-width:0;
  flex:1
}

.seller p{
  margin:0;
  line-height:1.45
}

.seller b{
  font-size:13px;
  font-weight:900
}

.seller span{
  display:block;
  font-size:10px;
  font-weight:700;
  color:var(--muted)
}

.seller-status{
  flex:0 0 auto;
  padding:7px 10px;
  border-radius:999px;
  background:var(--purple-soft);
  color:var(--purple-dark);
  font-size:9px;
  font-weight:900;
  white-space:nowrap
}

/* notes */

.notes-card{
  margin-top:12px
}

.notes-text{
  margin:0;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:12px;
  line-height:1.8;
  font-weight:700;
  color:#374151
}

@media (prefers-reduced-motion:reduce){
  .bid-btn.pulse,
  .bid-btn.pulse:after,
  .price.bump,
  .ticker.swap>span,
  .auction.hot .tdig i{
    animation:none
  }

  .dot,
  .toast,
  .panel,
  .chev{
    transition:none
  }
}

@media (max-width:360px){

  .price{
    font-size:24px
  }

  .tdig span{
    width:34px;
    font-size:18px
  }

  .bid-btn{
    width:80px;
    height:80px
  }

}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(24px + var(--safe-bottom));
  transform:translateX(-50%) translateY(16px);
  max-width:calc(100% - 40px);
  padding:10px 14px;
  border-radius:13px;
  background:#1e2c30;
  color:#fff;
  font-size:11px;
  font-weight:800;
  box-shadow:0 14px 34px rgba(24,44,49,.12);
  opacity:0;
  pointer-events:none;
  transition:.25s ease;
  z-index:120;
  text-align:center
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}
</style>
</head>

<body>

<main class="page">

<header>

  <div class="topbar">

    <button class="icon-btn" id="back" type="button" aria-label="رجوع">
      <svg viewBox="0 0 24 24">
        <path d="M9 5l7 7-7 7"/>
      </svg>
    </button>

    <div class="brand-mini">
      <strong>MZAD</strong>
      <span>PHONE</span>
    </div>

    <button
      class="icon-btn"
      id="fav"
      type="button"
      aria-pressed="false"
      aria-label="إضافة إلى المفضلة"
    >
      <svg viewBox="0 0 24 24">
        <path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/>
      </svg>
    </button>

  </div>

  <section class="gallery" aria-label="صور الجهاز">
    <div class="slides" id="slides"></div>
  </section>

  <div class="dots" id="dots"></div>

</header>

<div class="title">

  <h1 id="name"></h1>

  <p class="sub" id="sub"></p>

</div>

<div class="chips">

  <span class="chip ver">

    <svg viewBox="0 0 24 24">
      <path d="M12 3 5 6v5c0 4.5 3 7.8 7 10 4-2.2 7-5.5 7-10V6l-7-3Z"/>
      <path d="m9 12 2 2 4-4"/>
    </svg>

    MZAD VERIFIED

  </span>

  <span class="chip" id="cond"></span>

</div>

<section class="auction" id="auction">

  <div class="a-top">

    <span class="live" id="liveBadge">
      مزاد مستمر
    </span>

    <span class="a-count" id="count"></span>

  </div>

  <div class="a-grid">

    <div>

      <span class="label">
        السعر الحالي
      </span>

      <div class="price" id="priceBox">

        <span id="price"></span>

        <small>د.ع</small>

      </div>

    </div>

    <div role="timer">

      <span class="label" id="endLabel">
        الوقت المتبقي
      </span>

      <div class="tdig">

        <span id="hh">00</span>

        <i>:</i>

        <span id="mm">00</span>

        <i>:</i>

        <span id="ss">00</span>

      </div>

    </div>

  </div>

  <div class="a-bid">

    <div class="nextbox">

      <span class="label">
        مزايدتك القادمة
      </span>

      <b>

        <span id="next"></span>

        <small>د.ع</small>

      </b>

      <em id="stepTag"></em>

    </div>

    <button
      class="bid-btn"
      id="bid"
      type="button"
      aria-label="زايد الآن"
    >
      زايد
    </button>

  </div>

  <button
    class="live-row"
    id="liveRow"
    type="button"
    aria-expanded="false"
    aria-controls="panel"
  >

    <span class="stack" id="stack"></span>

    <span class="ticker" id="ticker">
      <span id="tickText"></span>
    </span>

    <svg class="chev" viewBox="0 0 24 24">
      <path d="M6 9l6 6 6-6"/>
    </svg>

  </button>

  <div
    class="panel"
    id="panel"
    role="region"
    aria-label="المزايدون"
  >

    <h3 id="panelHead"></h3>

    <ul id="bidders"></ul>

  </div>

  <p class="note" id="note"></p>

</section>

<section class="card">

  <h2>
    مواصفات الجهاز
  </h2>

  <table id="specs"></table>

</section>

<section class="card notes-card" id="notesCard" style="display:none">

  <h2>
    ملاحظات
  </h2>

  <p
    class="notes-text"
    id="notesText"
  ></p>

</section>

<section class="card">

  <h2>
    البائع
  </h2>

  <div class="seller">

    <div class="seller-info">

      <p>
        <b id="sName"></b>
        <span id="sInfo"></span>
      </p>

    </div>

    <span
      class="seller-status"
      id="sStatus"
    >
      مستخدم جديد
    </span>

  </div>

</section>

</main>

<div
  class="toast"
  id="toast"
  role="status"
></div>


<script type="module">

import {
  supabase
} from "./js/supabase.js?v=auction-details-final-6";


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

const fmt = n => Number(n || 0).toLocaleString("en-US");

const escapeHtml = value =>
  String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");


/* =========================================================
   AUCTION ID
========================================================= */

const params = new URLSearchParams(window.location.search);

const auctionId = params.get("id")?.trim() || "";


let auction = null;
let bids = [];
let ended = false;
let locked = false;
let toastT = null;
let timerInterval = null;
let refreshInterval = null;

/* وقت نهاية يرجع من الـ RPC بعد التمديد */
let endOverride = 0;

/* بيانات البائع من جدول المستخدمين (إن وُجدت وسمحت الصلاحيات) */
let sellerProfile = null;


/* =========================================================
   TOAST
========================================================= */

function toast(message){

  const el = $("toast");

  el.textContent = String(message || "");

  el.classList.add("show");

  clearTimeout(toastT);

  toastT = setTimeout(() => {
    el.classList.remove("show");
  }, 2600);

}


/* =========================================================
   RELATIVE TIME
========================================================= */

function ago(value){

  if(!value){
    return "";
  }

  const time = new Date(value).getTime();

  if(!Number.isFinite(time)){
    return "";
  }

  const diff = Math.max(0, Date.now() - time);

  const minutes = Math.floor(diff / 60000);

  if(minutes < 1){
    return "الآن";
  }

  if(minutes < 60){
    return `منذ ${minutes} دقيقة`;
  }

  const hours = Math.floor(minutes / 60);

  if(hours < 24){
    return `منذ ${hours} ساعة`;
  }

  const days = Math.floor(hours / 24);

  return `منذ ${days} يوم`;

}

function colorOf(name){

  const colors = [
    "#6246d9",
    "#176b87",
    "#e8590c",
    "#1e8a5a",
    "#b9791a",
    "#c2255c"
  ];

  const text = String(name || "مستخدم");

  const total = [...text].reduce(
    (sum,char) => sum + char.charCodeAt(0),
    0
  );

  return colors[total % colors.length];

}


function av(name){

  const text = String(name || "مستخدم");

  return `

      style="background:${colorOf(text)}"

  `;

}


/* =========================================================
   IMAGES
========================================================= */

function parseImages(value){

  if(!value){
    return [];
  }

  let data = value;

  if(typeof data === "string"){

    try{

      data = JSON.parse(data);

    }catch{

      data = data
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);

    }

  }

  if(!Array.isArray(data)){

    if(typeof data === "object"){

      data = Object.values(data);

    }else{

      data = [data];

    }

  }

  return data
    .map(item => {

      if(!item){
        return "";
      }

      if(typeof item === "string"){
        return item.trim();
      }

      if(typeof item === "object"){

        return (
          item.url ||
          item.path ||
          item.src ||
          item.publicUrl ||
          item.public_url ||
          ""
        );

      }

      return "";

    })
    .filter(Boolean);

}


function imageUrl(path){

  if(!path){
    return "";
  }

  if(
    path.startsWith("http://") ||
    path.startsWith("https://") ||
    path.startsWith("data:")
  ){

    return path;

  }

  const clean = path
    .replace(/^\/+/,"")
    .replace(/^device-images\//,"");

  const { data } = supabase
    .storage
    .from("device-images")
    .getPublicUrl(clean);

  return data?.publicUrl || "";

}


function valueText(value){

  if(value === null || value === undefined){
    return "";
  }

  if(typeof value === "string"){
    return value.trim();
  }

  if(Array.isArray(value)){
    return value.join("، ");
  }

  if(typeof value === "object"){

    return Object.values(value)
      .filter(Boolean)
      .join("، ");

  }

  return String(value);

}


/* =========================================================
   PARSE NOTES
========================================================= */

function parseStoredNotes(raw){

  const text = valueText(raw);

  if(!text){

    return {
      userNotes:"",
      meta:{}
    };

  }

  const markers = [
    "— معلومات الحالة —",
    "-- معلومات الحالة --",
    "معلومات الحالة"
  ];

  let markerIndex = -1;
  let markerLength = 0;

  for(const marker of markers){

    const index = text.indexOf(marker);

    if(index >= 0){

      markerIndex = index;
      markerLength = marker.length;

      break;

    }

  }


  const userNotes =
    markerIndex >= 0
      ? text.slice(0,markerIndex).trim()
      : text.trim();


  const internal =
    markerIndex >= 0
      ? text.slice(markerIndex + markerLength).trim()
      : "";


  const meta = {};


  internal
    .split("\n")
    .map(line => line.trim())
    .filter(Boolean)
    .forEach(line => {

      const match = line.match(/^([^:：]+)\s*[:：]\s*(.*)$/);

      if(!match){
        return;
      }

      meta[match[1].trim()] = match[2].trim();

    });


  return {
    userNotes,
    meta
  };

}


/* =========================================================
   AUCTION META
   صفحة البيع (sell-auction.html) تحفظ بيانات المزاد
   كسطر JSON داخل notes بعد العلامة MZAD_AUCTION_META
   وليس في أعمدة auction_* (غير موجودة في الجدول).
========================================================= */

function parseAuctionMeta(raw){

  const text = valueText(raw);

  const marker = "MZAD_AUCTION_META";

  const at = text.indexOf(marker);

  if(at < 0){
    return {};
  }

  const rest = text.slice(at + marker.length);

  const s = rest.indexOf("{");
  const e = rest.lastIndexOf("}");

  if(s < 0 || e < s){
    return {};
  }

  try{

    const obj = JSON.parse(rest.slice(s, e + 1));

    return obj && typeof obj === "object" ? obj : {};

  }catch{

    return {};

  }

}


function auctionMeta(){
  return parseAuctionMeta(auction?.notes);
}


function toTime(value){

  if(!value){
    return NaN;
  }

  return new Date(value).getTime();

}


/* =========================================================
   END TIME
========================================================= */

function getEndTime(){

  if(!auction){
    return null;
  }

  const meta = auctionMeta();

  /*
    1) auction_ends_at (عمود، إن وُجد)
    2) meta.ends_at (المحفوظ في notes عند النشر)
    3) created_at + duration_hours (عمود أو من meta)
  */

  let base = toTime(auction.auction_ends_at);

  if(!Number.isFinite(base)){
    base = toTime(meta.ends_at);
  }

  if(!Number.isFinite(base)){

    const created = toTime(auction.created_at);

    const duration =
      Number(auction.duration_hours) ||
      Number(meta.duration_hours) ||
      0;

    if(Number.isFinite(created) && duration > 0){
      base = created + duration * 60 * 60 * 1000;
    }

  }

  /*
    وقت النهاية الممدد القادم من الـ RPC
    يغلب إذا كان أبعد.
  */

  if(Number.isFinite(base)){
    return Math.max(base, endOverride || 0);
  }

  if(endOverride){
    return endOverride;
  }

  return null;

}

/*
  شرائح الزيادة (نفس المعلن في صفحة البيع):
  أقل من 300 ألف: 5,000
  300 إلى أقل من 750 ألف: 10,000
  750 ألف إلى أقل من 1.5 مليون: 15,000
  1.5 إلى أقل من 3 ملايين: 25,000
  3 ملايين فأكثر: 50,000
*/
function stepForPrice(p){

  p = Number(p) || 0;

  if(p < 300000){
    return 5000;
  }

  if(p < 750000){
    return 10000;
  }

  if(p < 1500000){
    return 15000;
  }

  if(p < 3000000){
    return 25000;
  }

  return 50000;

}


function bidStep(){

  const column = Number(auction.auction_bid_step || 0);

  if(column > 0){
    return column;
  }

  return stepForPrice(currentPrice());

}


function nextBid(){

  return currentPrice() + bidStep();

}

    ]);

  if(auction.cameras){

    rows.push([

    ]);

  if(!auction.face_id && meta["يعمل"]){

      works.includes("البصمة")
    ){

        "يعمل",

      ]);

function uniqueBidders(){

  const seen = new Set();

  const result = [];


  for(const bid of bids){

      bid.user_id ||
      bid.bidder_name ||
      bid.id;


    if(seen.has(key)){
      continue;
    }


    seen.add(key);

    result.push(bid);

  }


  return result;

}

/* =========================================================
   TIMER
========================================================= */

function tick(){

  if(!auction){
    return;
  }


  const end = getEndTime();


  if(!end){

    $("hh").textContent = "00";

    $("mm").textContent = "00";

    $("ss").textContent = "00";

    $("endLabel").textContent = "وقت الانتهاء غير محدد";

    $("bid").disabled = true;

    return;

  }


  const left = Math.max(
    0,
    Math.ceil((end - Date.now()) / 1000)
  );


  const p = n => String(n).padStart(2,"0");


  $("hh").textContent = p(Math.floor(left / 3600));


  $("mm").textContent = p(Math.floor((left % 3600) / 60));


  $("ss").textContent = p(left % 60);


  $("auction").classList.toggle(
    "hot",
    left > 0 && left <= 5 * 60
  );


  if(left <= 0){

    finish();

    return;

  }


  ended = false;


  $("auction").classList.remove("ended");


  $("liveBadge").textContent = "مزاد مستمر";


  $("endLabel").textContent = "الوقت المتبقي";


  if(!locked){

    $("bid").disabled = false;

    $("bid").textContent = "زايد";

  }

}


/* =========================================================
   FINISH
========================================================= */

function finish(){

  if(ended){
    return;
  }


  ended = true;


  $("auction").classList.remove("hot");


  $("auction").classList.add("ended");


  $("liveBadge").textContent = "انتهى المزاد";


  $("endLabel").textContent = "انتهى المزاد";


  $("bid").disabled = true;


  $("bid").textContent = "انتهى";

}

      .maybeSingle();


    if(error){

      console.error("AUCTION REFRESH ERROR:", error);

      return;

    }


    if(data){

      auction = {
        ...auction,
        ...data
      };

    }


    await loadBids();


    renderBody();

    renderBids(true);

    tick();


  }catch(error){

    console.error("LIVE REFRESH ERROR:", error);

  }

}


function startLiveRefresh(){

  clearInterval(refreshInterval);


  refreshInterval = setInterval(
    refreshAuctionData,
    5000
  );

}


/* =========================================================
   PLACE BID
========================================================= */

$("bid").onclick = async () => {

  if(!auction?.id){

    toast("المزاد غير موجود");

    return;

  }


  if(ended){

    toast("انتهى المزاد");

    return;

  }


  if(locked){
    return;
  }


  locked = true;


  const button = $("bid");


  button.classList.remove("pulse");


  void button.offsetWidth;


  button.classList.add("pulse");


  try{

    button.disabled = true;


    const {
      data: sessionData,
      error: sessionError
    } = await supabase.auth.getSession();


    if(sessionError){
      throw sessionError;
    }


    const user = sessionData?.session?.user || null;


    if(!user){

      toast("يجب تسجيل الدخول أولاً حتى تستطيع المزايدة");

      return;

    }


    const end = getEndTime();


    if(end && Date.now() >= end){

      finish();

      toast("انتهى المزاد");

      return;

    }


    const amount = Number(nextBid());


    if(!Number.isFinite(amount) || amount <= 0){

      toast("قيمة المزايدة غير صحيحة");

      return;

    }


    const { data, error } = await supabase.rpc(
      "place_auction_bid",
      {
        p_auction_id: String(auction.id),
        p_amount: amount
      }
    );


    if(error){

      console.error("PLACE AUCTION BID ERROR:", error);


      let message = error?.message || "تعذر تسجيل المزايدة";


      if(message.includes("المبلغ المطلوب")){
        message = "قيمة المزايدة غير صحيحة";
      }


      if(message.includes("المزاد غير نشط")){
        message = "هذا المزاد غير نشط";
      }


      if(message.includes("انتهى المزاد")){
        message = "انتهى المزاد";
      }


      if(message.includes("تسجيل الدخول")){
        message = "يجب تسجيل الدخول أولاً";
      }


      toast(message);

      /* قد تكون المزايدة تغيرت من شخص آخر: حدّث الأرقام */
      refreshAuctionData();

      return;

    }


    let result = data;


    if(Array.isArray(result)){
      result = result[0] || null;
    }


    if(result && typeof result === "object"){

      const hasSuccessField = Object.prototype.hasOwnProperty.call(
        result,
        "success"
      );


      if(hasSuccessField && result.success !== true){

        toast(result.message || "لم يتم تسجيل المزايدة");

        refreshAuctionData();

        return;

      }

    }


    if(result && result.amount){

      auction.auction_current_price = Number(result.amount);

    }else{

      auction.auction_current_price = amount;

    }


    /*
      إذا الـ RPC رجع وقت نهاية جديد بعد التمديد
      نعتمده مباشرة. (الاسم المستخدم فعلياً
      في الكود الأصلي: ends_at)
    */

    const returnedEnd = toTime(
      result?.ends_at ||
      result?.auction_ends_at
    );


    if(Number.isFinite(returnedEnd)){

      endOverride = Math.max(endOverride, returnedEnd);

    }


    await loadBids();


    renderBody();

    renderBids(true);

    tick();


    const priceBox = $("priceBox");


    priceBox.classList.remove("bump");


    void priceBox.offsetWidth;


    priceBox.classList.add("bump");


    if(result && result.extended === true){

      toast("تمت المزايدة بنجاح وتم تمديد المزاد دقيقة كاملة");

    }else{

      toast("تمت المزايدة بنجاح");

    }


    /* مزامنة فورية مع قاعدة البيانات */
    refreshAuctionData();


  }catch(error){

    console.error("BID ERROR:", error);


    toast(
      error?.message ||
      "حدث خطأ أثناء المزايدة"
    );


  }finally{

    locked = false;


    if(!ended){

      $("bid").disabled = false;

      $("bid").textContent = "زايد";

    }

  }

};


/* =========================================================
   FAVORITE
========================================================= */

function favoriteKey(){

  return `mzad_favorite_auction_${auction?.id}`;

}


function checkFavorite(){

  if(!auction?.id){
    return;
  }


  const saved = localStorage.getItem(favoriteKey()) === "1";


  $("fav").setAttribute(
    "aria-pressed",
    saved ? "true" : "false"
  );


  $("fav").setAttribute(
    "aria-label",
    saved
      ? "إزالة من المفضلة"
      : "إضافة إلى المفضلة"
  );

}


$("fav").onclick = event => {

  if(!auction?.id){
    return;
  }


  const button = event.currentTarget;


  const on = button.getAttribute("aria-pressed") !== "true";


  if(on){

    localStorage.setItem(favoriteKey(), "1");

  }else{

    localStorage.removeItem(favoriteKey());

  }


  button.setAttribute(
    "aria-pressed",
    on ? "true" : "false"
  );


  button.setAttribute(
    "aria-label",
    on
      ? "إزالة من المفضلة"
      : "إضافة إلى المفضلة"
  );


  toast(
    on
      ? "تمت إضافة المزاد إلى المفضلة"
      : "تمت إزالة المزاد من المفضلة"
  );

};
