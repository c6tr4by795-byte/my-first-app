<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MZAD PHONE — حسابي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;700;800&family=Noto+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2024;--muted:#8c8f96;--band:#f5f5f6;--line:#efeff1;--p:#6246d9;--p-dark:#3f2a9c;--bad:#d32f4f;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font-family:"Noto Sans Arabic","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;font-weight:700;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.page{width:min(100%,520px);margin:0 auto;padding:0 0 calc(86px + var(--sb))}

/* header */
.head{display:flex;align-items:center;gap:14px;padding:calc(22px + var(--st)) 16px 18px}
.av{width:64px;height:64px;flex:0 0 64px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:800;background:#fde8dc;color:#2b2b2b}
.nm{min-width:0;flex:1}
.nm h1{margin:0;font-size:24px;line-height:1.3;font-weight:800;overflow-wrap:anywhere}
.nm p{margin:3px 0 0;font-size:14px;font-weight:700;color:var(--muted);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px}
.gear svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* banner */
.promo{position:relative;display:block;overflow:hidden;margin:0 16px;height:140px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#5a3dd4,#6f4ff0)}
.promo .img{position:absolute;left:0;top:0;bottom:0;width:36%;display:grid;place-items:center;background:linear-gradient(145deg,#ffe08a,#ffa62b);border-radius:0 80px 80px 0/0 50% 50% 0;border-right:5px solid #ffe14d}
.promo .img svg{width:62px;height:62px;fill:none;stroke:#2d1a00;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.promo .tx{position:absolute;right:0;top:0;bottom:0;width:62%;padding:18px 20px 16px 6px;display:flex;flex-direction:column}
.promo b{font-size:19px;font-weight:800;line-height:1.35}
.promo small{margin-top:6px;font-size:14px;font-weight:700;line-height:1.5;opacity:.95}
.promo u{margin-top:auto;font-size:17px;font-weight:800}

.band{height:10px;background:var(--band);margin-top:22px}

/* rows */
.r{width:100%;display:flex;align-items:center;gap:14px;padding:13px 16px;text-align:right;transition:background .15s}
.r:active{background:#f7f7f8}
.r svg{width:25px;height:25px;flex:0 0 25px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.r .t{flex:1;min-width:0;font-size:17px;font-weight:700;line-height:1.5}
.r .v{margin-inline-start:auto;font-size:16px;font-weight:700;white-space:nowrap;direction:ltr}
.r .v.pu{color:var(--p-dark)}
.r.out{color:var(--bad)}
.r.out svg{stroke:var(--bad)}
.grp{padding:8px 0}

/* nav */
.bw{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line)}
.bn{width:100%;max-width:520px;margin:0 auto;padding:6px 6px calc(6px + var(--sb));display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.ni{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8c8f96}
.ni.on{color:var(--p)}
.ni svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ni span{font-size:11.5px;line-height:1;font-weight:800;white-space:nowrap}
.ni.on span{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(78px + var(--sb));transform:translate(-50%,14px);max-width:calc(100% - 40px);padding:10px 15px;border-radius:13px;background:#1f2024;color:#fff;font-size:12px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:.28s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;transition:.28s}
.loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--p);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid var(--p);outline-offset:-2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script type="module" src="./js/auth-guard.js"></script>
</head>
<body>
<div class="loading" id="loading"><div class="loader"></div></div>

<main class="page">
  <header class="head">
    <div class="av" id="avatar">M</div>
    <div class="nm">
      <h1 id="profileName">جاري التحميل...</h1>
      <p id="infoEmail">—</p>
    </div>
    <button class="gear" type="button" data-toast="الإعدادات راح تتفعل قريباً." aria-label="الإعدادات"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <a class="promo" href="contests.html">
    <div class="tx">
      <b>مسابقات MZAD PHONE</b>
      <small>شارك واربح جوائز قيمة</small>
      <u>شارك الآن</u>
    </div>
    <div class="img"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8.5 20h7"/></svg></div>
  </a>

  <div class="band"></div>

  <div class="grp">
    <button class="r" id="idRow" type="button">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h3M6 16c.6-1.6 4.4-1.6 5 0"/></svg>
      <span class="t">المعرّف الخاص بك (ID)</span><span class="v pu" id="personalCode">...</span>
    </button>
    <button class="r" data-toast="تعديل المعلومات راح يتفعل قريباً." type="button">
      <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      <span class="t">رقم الهاتف</span><span class="v" id="infoPhone">—</span>
    </button>
    <button class="r" data-go="contests.html" type="button">
      <svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8.5 20h7"/></svg>
      <span class="t">المسابقات</span>
    </button>
    <button class="r" data-go="my-listings.html" type="button">
      <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
      <span class="t">أجهزتي المعروضة</span><span class="v" id="listingsBadge">0</span>
    </button>
    <button class="r" data-go="my-auctions.html" type="button">
      <svg viewBox="0 0 24 24"><path d="m7 11 7.5-7.5 3 3L10 14M5 13l6 6M4 21h16"/></svg>
      <span class="t">مزاداتي</span>
    </button>
    <button class="r" data-go="my-wins.html" type="button">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5.5"/><path d="m8.5 13.5-2 7 5.5-3 5.5 3-2-7"/></svg>
      <span class="t">المزادات اللي فزت بيها</span>
    </button>
    <button class="r" data-go="my-deposits.html" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
      <span class="t">تأميناتي وحجوزاتي</span>
    </button>
    <button class="r" data-toast="سجل المشتريات راح يتفعل مع نظام الشراء" type="button">
      <svg viewBox="0 0 24 24"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      <span class="t">مشترياتي</span>
    </button>
    <button class="r" data-go="favorites.html" type="button">
      <svg viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7z"/></svg>
      <span class="t">المفضلة</span>
    </button>
  </div>

  <div class="band" style="margin-top:0"></div>

  <div class="grp">
    <button class="r" data-toast="هذا القسم راح يتفعل قريباً." type="button">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5M12 17h.01"/></svg>
      <span class="t">احصل على المساعدة</span>
    </button>
    <button class="r" data-toast="هذا القسم راح يتفعل قريباً." type="button">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></svg>
      <span class="t">تواصل معنا</span>
    </button>
    <button class="r" data-toast="هذا القسم راح يتفعل قريباً." type="button">
      <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6V3z"/><path d="M9 12h7M9 16h5"/></svg>
      <span class="t">الشروط والأحكام</span>
    </button>
    <button class="r" data-toast="هذا القسم راح يتفعل قريباً." type="button">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg>
      <span class="t">من نحن</span>
    </button>
    <button class="r out" id="logoutBtn" type="button">
      <svg viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l4 4-4 4M19 12H9"/></svg>
      <span class="t">تسجيل الخروج</span>
    </button>
  </div>
</main>

<div class="bw"><nav class="bn">
  <a class="ni" href="home.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg><span>الرئيسية</span></a>
  <a class="ni" href="market.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>الأجهزة</span></a>
  <a class="ni" href="sell.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>إضافة</span></a>
  <a class="ni" href="favorites.html"><svg viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7z"/></svg><span>المفضلة</span></a>
  <a class="ni on" href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20.5c.8-3.6 3.2-5.5 7-5.5s6.2 1.9 7 5.5"/></svg><span>حسابي</span></a>
</nav></div>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from "./js/supabase.js";
const $ = id => document.getElementById(id);

let tt;
function toast(m){ const e = $("toast"); e.textContent = m; e.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => e.classList.remove("show"), 2300); }

async function loadProfile(){
  try{
    const { data, error } = await supabase.auth.getUser();
    if (error || !data?.user){ location.replace("index.html?login=1&returnTo=profile.html"); return; }
    const user = data.user, m = user.user_metadata || {};
    const name = m.full_name || m.name || "مستخدم MZAD PHONE";
    $("profileName").textContent = name;
    $("avatar").textContent = (name.trim().charAt(0) || "M").toUpperCase();
    $("infoEmail").textContent = user.email || "غير مضاف";
    $("infoPhone").textContent = m.phone || "غير مضاف";
    $("loading").classList.add("hidden");

    const code = await supabase.rpc("mzad_get_my_buyer_code");
    if (code.error || typeof code.data !== "string" || !code.data){
      console.error("Personal code error:", code.error);
      $("personalCode").textContent = "تعذر التحميل";
      toast("تعذر تحميل المعرّف الخاص بك");
    }else{
      $("personalCode").textContent = code.data;
      $("idRow").dataset.ready = "1";
    }

    const cnt = await supabase.from("devices").select("id", { count:"exact", head:true }).eq("seller_id", user.id);
    if (cnt.error) console.error("Listings count error:", cnt.error);
    else $("listingsBadge").textContent = cnt.count || 0;
  }catch(e){
    console.error("Profile error:", e);
    toast("تعذر تحميل الحساب");
    setTimeout(() => $("loading").classList.add("hidden"), 500);
  }
}

async function copyCode(){
  const code = $("personalCode").textContent.trim();
  if (!$("idRow").dataset.ready || !code) return;
  try{
    await navigator.clipboard.writeText(code);
    toast("تم نسخ المعرّف");
  }catch{
    const f = document.createElement("textarea");
    f.value = code; f.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(f); f.select();
    const ok = document.execCommand("copy"); f.remove();
    toast(ok ? "تم نسخ المعرّف" : "المعرّف: " + code);
  }
}

document.addEventListener("click", e => {
  if (e.target.closest("#idRow")){ copyCode(); return; }
  const b = e.target.closest(".r, .gear");
  if (!b) return;
  if (b.dataset.go) location.href = b.dataset.go;
  else if (b.dataset.toast) toast(b.dataset.toast);
});

$("logoutBtn").onclick = async () => {
  const btn = $("logoutBtn"), t = btn.querySelector(".t");
  btn.disabled = true; t.textContent = "جاري تسجيل الخروج...";
  try{
    const { error } = await supabase.auth.signOut();
    if (error){ btn.disabled = false; t.textContent = "تسجيل الخروج"; toast("تعذر تسجيل الخروج"); return; }
    sessionStorage.removeItem("mzad_pending_action");
    location.replace("home.html");
  }catch(e){
    console.error(e);
    btn.disabled = false; t.textContent = "تسجيل الخروج";
    toast("حدث خطأ أثناء تسجيل الخروج");
  }
};

loadProfile();
</script>
</body>
</html>
