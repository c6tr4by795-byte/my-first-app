<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<meta name="theme-color" content="#F7F8FA">

<title>MZAD PHONE — حسابي</title>

<style>

:root{
  --bg:#F7F8FC;
  --surface:#FFFFFF;
  --surface-2:#F1F2FA;

  --ink:#17202A;
  --muted:#667085;
  --muted-2:#8A929A;

  --line:#E6E9ED;

  --primary:#176B87;
  --primary-dark:#125A73;
  --primary-soft:#E8F3F6;

  --purple:#5C48C9;
  --purple-dark:#51458A;

  --danger:#C63C55;
  --danger-soft:#FFF3F5;

  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  color:inherit;
}

button:disabled{
  cursor:default;
}

a,
a:link,
a:visited,
a:hover,
a:active{
  color:inherit;
  text-decoration:none !important;
}


/* =====================================================
   PAGE
===================================================== */

.page{
  width:min(100%,520px);
  margin:auto;

  padding:
    0
    14px
    calc(112px + var(--safe-bottom));
}


/* =====================================================
   HEADER
===================================================== */

.header{
  margin-inline:-14px;

  padding:
    0
    14px
    10px;

  background:
    radial-gradient(circle at 100% 100%,rgba(98,70,217,.10),transparent 28%),
    radial-gradient(circle at 0% 0%,rgba(50,184,196,.07),transparent 25%),
    linear-gradient(145deg,#FFFFFF 0%,#FAF8FF 45%,#EDE9FF 100%);

  border-bottom:1px solid var(--line);

  border-radius:
    0
    0
    25px
    25px;

  box-shadow:
    0 10px 26px rgba(23,32,42,.055);

  position:relative;
  overflow:hidden;
}

.header::before{
  content:"";

  position:absolute;

  width:190px;
  height:190px;

  left:-105px;
  top:-125px;

  border-radius:50%;

  background:
    rgba(23,107,135,.045);

  pointer-events:none;
}

.header::after{
  content:"";

  position:absolute;

  width:150px;
  height:150px;

  right:-78px;
  bottom:-108px;

  border-radius:50%;

  background:
    rgba(98,70,217,.075);

  pointer-events:none;
}


/* =====================================================
   TOPBAR
===================================================== */

.topbar{
  position:relative;
  z-index:2;

  height:44px;

  display:flex;
  align-items:center;
  gap:8px;
}

.back-btn{
  width:40px;
  height:40px;

  flex:0 0 40px;

  border-radius:13px;

  background:#FFFFFF;

  border:1px solid #DDD8F8;

  color:var(--primary);

  display:grid;
  place-items:center;

  box-shadow:
    0 7px 18px rgba(23,32,42,.045);
}

.brand{
  flex:1;
  text-align:center;
  line-height:.9;
}

.brand strong{
  display:block;

  font-size:20px;
  font-weight:950;

  letter-spacing:-.055em;
}

.brand span{
  display:block;

  margin-top:5px;

  color:#89929A;

  font-size:8px;
  font-weight:950;

  letter-spacing:.22em;
}

.header-spacer{
  width:40px;
  flex:0 0 40px;
}


/* =====================================================
   PAGE INTRO
===================================================== */

.page-intro{
  position:relative;
  z-index:2;

  margin-top:7px;
  padding:0 5px 1px;
}

.page-intro h1{
  margin:0;

  font-size:25px;
  line-height:1.15;

  font-weight:950;
  letter-spacing:-.045em;
}

.page-intro p{
  margin:3px 0 0;

  color:var(--muted);

  font-size:12px;
  line-height:1.5;

  font-weight:650;
}


/* =====================================================
   USER CARD
   بدون صورة / بدون مربع
===================================================== */

.profile-card{
  margin-top:14px;

  padding:17px;

  border-radius:26px;

  background:#FFFFFF;

  border:1px solid var(--line);

  box-shadow:
    0 10px 26px rgba(23,32,42,.055);
}


/* =====================================================
   USER HEADER
===================================================== */

.user-head{
  display:flex;
  align-items:center;
  gap:12px;

  min-width:0;
}


.user-main{
  min-width:0;
  width:100%;
}

.profile-name{
  margin:0;

  color:var(--ink);

  font-size:19px;
  line-height:1.3;

  font-weight:950;

  letter-spacing:-.03em;

  white-space:nowrap;

  overflow:hidden;
  text-overflow:ellipsis;
}


/* =====================================================
   EMAIL — بدون أي خط نهائياً
===================================================== */

.profile-email{
  display:block;

  width:100%;

  margin:
    4px
    0
    0;

  padding:0;

  color:var(--muted) !important;

  font-size:11px;

  line-height:1.4;

  font-weight:650;

  direction:ltr;

  text-align:right;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  text-decoration:none !important;

  border:0 !important;

  border-bottom:0 !important;

  box-shadow:none !important;

  outline:none !important;
}

.profile-email:hover,
.profile-email:focus,
.profile-email:active,
.profile-email:visited{
  color:var(--muted) !important;

  text-decoration:none !important;

  border:0 !important;

  border-bottom:0 !important;

  box-shadow:none !important;

  outline:none !important;
}


/* =====================================================
   STATUS
===================================================== */

.profile-status{
  display:inline-flex;

  align-items:center;

  gap:6px;

  margin-top:8px;

  padding:
    5px
    9px;

  border-radius:999px;

  background:var(--primary-soft);

  border:1px solid #D8EBF0;

  color:var(--primary-dark);

  font-size:10px;

  font-weight:900;
}

.status-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#43B98A;
}


/* =====================================================
   USER INFORMATION
===================================================== */

.profile-details{
  margin-top:13px;

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:8px;
}

.account-detail{
  min-width:0;

  padding:11px 12px;

  border-radius:16px;

  background:linear-gradient(145deg,#FAFBFC,#F4F6F8);

  border:1px solid #E9EDF0;
}

.detail-label{
  color:#7C858D;

  font-size:9px;

  font-weight:800;

  margin-bottom:5px;
}

.detail-value{
  color:var(--ink);

  font-size:11px;

  line-height:1.3;

  font-weight:900;

  direction:ltr;

  text-align:right;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  text-decoration:none !important;

  border:0 !important;

  border-bottom:0 !important;

  box-shadow:none !important;
}


/* =====================================================
   RATING
===================================================== */

.rating-box{
  margin-top:8px;

  padding:
    10px
    12px;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      #F7F4FF 0%,
      #ECE8FF 100%
    );

  border:1px solid #DDD6FF;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;
}

.rating-number{
  color:var(--purple-dark);

  font-size:17px;

  line-height:1;

  font-weight:950;
}

.rating-label{
  margin-top:4px;

  color:#71698E;

  font-size:9px;

  font-weight:800;
}

.rating-count{
  color:#71698E;

  font-size:10px;

  font-weight:800;

  text-align:left;
}


/* =====================================================
   STATS
===================================================== */

.stats{
  margin-top:9px;

  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.stat{
  min-width:0;
  min-height:82px;
  padding:11px 8px;
  text-align:center;
  border-radius:17px;
  background:#FFFFFF;
  border:1px solid #E8EBEF;
  box-shadow:0 5px 14px rgba(23,32,42,.03);
}

.stat-icon{
  width:25px;
  height:25px;
  margin:0 auto 6px;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:#F0EDFF;
  color:#5C48C9;
  font-size:14px;
  font-weight:950;
}

.stat-number{
  color:var(--ink);

  font-size:17px;

  line-height:1;

  font-weight:950;
}

.stat-label{
  margin-top:5px;

  color:var(--muted);

  font-size:9px;

  font-weight:800;
}


/* =====================================================
   SECTION
===================================================== */

.section{
  margin-top:25px;
}

.section-title-row{
  display:flex;
  align-items:center;

  gap:9px;

  margin:
    0
    2px
    11px;
}

.section-accent{
  width:5px;
  height:22px;

  flex:0 0 4px;

  border-radius:999px;

  background:
    linear-gradient(
      180deg,
      #32B8C4,
      #5C48C9
    );
}

.section-title{
  margin:0;

  color:#17202A;

  font-size:19px;

  line-height:1.2;

  font-weight:950;

  letter-spacing:-.035em;
}


/* =====================================================
   MENU
===================================================== */

.menu-card{
  background:#FFFFFF;
  border:1px solid #E6E9EE;
  border-radius:22px;

  overflow:hidden;

  box-shadow:
    0 9px 22px rgba(23,32,42,.045);
}

.menu-item{
  width:100%;
  min-height:78px;

  padding:
    11px
    13px;

  display:flex;
  align-items:center;

  gap:12px;

  background:#FFFFFF;

  text-align:right;

  border-bottom:1px solid #F0F1F3;

  transition:
    background .18s ease,
    transform .18s ease;
}

.menu-item:last-child{
  border-bottom:0;
}

.menu-item:active{
  background:#F8FAFB;

  transform:scale(.992);
}

.menu-icon{
  width:43px;
  height:43px;

  flex:0 0 43px;

  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      #EAF7F8,
      #F0EDFF
    );

  color:#176B87;

  display:grid;
  place-items:center;

  border:1px solid #DCECEF;
}

.menu-copy{
  min-width:0;
  flex:1;
}

.menu-title{
  display:block;

  color:var(--ink);

  font-size:14px;

  line-height:1.35;

  font-weight:950;
}

.menu-sub{
  display:block;

  margin-top:4px;

  color:var(--muted);

  font-size:10px;

  line-height:1.45;

  font-weight:650;

  overflow-wrap:anywhere;
}

.menu-arrow{
  width:18px;
  height:18px;

  flex:0 0 18px;

  color:#A5ADB4;
}


/* =====================================================
   LOGOUT
===================================================== */

.logout-btn{
  width:100%;

  height:52px;

  margin-top:16px;

  border-radius:15px;

  background:var(--danger-soft);

  border:1px solid #F1D5DB;

  color:var(--danger);

  font-size:13px;

  font-weight:950;

  box-shadow:
    0 7px 18px rgba(198,60,85,.045);
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-wrap{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  padding:
    8px
    12px
    calc(8px + var(--safe-bottom));

  z-index:50;

  pointer-events:none;
}

.bottom-nav{
  width:min(100%,520px);

  margin:0 auto;

  min-height:67px;

  padding:6px;

  border-radius:22px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.97),
      rgba(232,243,246,.97)
    );

  border:1px solid rgba(23,107,135,.12);

  box-shadow:
    0 16px 36px rgba(23,107,135,.16);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:4px;

  pointer-events:auto;
}

.nav-item{
  min-width:0;

  min-height:55px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  border-radius:16px;

  color:#7B8794;

  background:transparent;

  transition:
    transform .2s ease,
    background .2s ease,
    color .2s ease;
}

.nav-item:active{
  transform:scale(.94);
}

.nav-item.active{
  color:var(--primary-dark);

  background:
    linear-gradient(
      145deg,
      #E8F3F6,
      #DCEEF2
    );
}

.nav-label{
  font-size:9px;
  line-height:1;

  font-weight:900;
}

.nav-icon{
  width:22px;
  height:22px;
}

.action-icon{
  width:42px;
  height:42px;

  border-radius:13px;

  display:grid;
  place-items:center;

  color:#fff;

  background:
    linear-gradient(
      145deg,
      #176B87,
      #257F98
    );

  box-shadow:
    0 8px 18px rgba(23,107,135,.20);
}

/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  left:50%;

  bottom:
    calc(
      88px +
      var(--safe-bottom)
    );

  transform:
    translateX(-50%)
    translateY(12px);

  max-width:
    calc(100% - 40px);

  padding:
    11px
    15px;

  border-radius:13px;

  background:#1E2C30;

  color:#FFFFFF;

  font-size:12px;

  font-weight:800;

  text-align:center;

  box-shadow:
    0 12px 30px rgba(23,32,42,.16);

  opacity:0;

  pointer-events:none;

  transition:
    opacity .22s ease,
    transform .22s ease;

  z-index:80;
}

.toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =====================================================
   LOADING
===================================================== */

.loading{
  position:fixed;

  inset:0;

  z-index:100;

  background:var(--bg);

  display:flex;

  align-items:center;
  justify-content:center;

  transition:
    opacity .28s ease,
    visibility .28s ease;
}

.loading.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader{
  width:32px;
  height:32px;

  border-radius:50%;

  border:3px solid #DCE7EA;

  border-top-color:var(--primary);

  animation:
    spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =====================================================
   SMALL SCREENS
===================================================== */

@media(max-width:360px){

  .page{
    padding-inline:12px;
  }

  .header{
    margin-inline:-12px;
  }

  .profile-card{
    padding:13px;
  }

  .profile-name{
    font-size:17px;
  }

  .profile-email{
    font-size:10px;
  }

  .menu-title{
    font-size:13px;
  }

  .menu-sub{
    font-size:9px;
  }
}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none !important;
    transition:none !important;
  }

}

</style>

</head>

<body>


<div class="loading" id="loading">
  <div class="loader"></div>
</div>


<main class="page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="topbar">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
      aria-label="رجوع">

      <svg
        width="21"
        height="21"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M15 18l-6-6 6-6"/>

      </svg>

    </button>


    <div class="brand">

      <strong>MZAD</strong>

      <span>PHONE</span>

    </div>


    <div class="header-spacer"></div>

  </div>


  <div class="page-intro">

    <h1>حسابي</h1>

    <p>
      إدارة حسابك ومتابعة نشاطك على MZAD PHONE
    </p>

  </div>

</header>


<!-- =====================================================
     USER PROFILE CARD
===================================================== -->

<section class="profile-card">


  <div class="user-head">

    <div class="user-main">

      <h2
        class="profile-name"
        id="profileName">

        جاري التحميل...

      </h2>


      <p
        class="profile-email"
        id="profileEmail">

        —

      </p>


      <div class="profile-status">

        <span class="status-dot"></span>

        حساب نشط

      </div>

    </div>


  </div>


  <!-- ACCOUNT DETAILS -->

  <div class="profile-details">


    <div class="account-detail">

      <div class="detail-label">
        رقم الهاتف
      </div>

      <div
        class="detail-value"
        id="infoPhone">

        —

      </div>

    </div>


    <div class="account-detail">

      <div class="detail-label">
        البريد الإلكتروني
      </div>

      <div
        class="detail-value"
        id="infoEmail">

        —

      </div>

    </div>


  </div>


  <!-- RATING -->

  <div class="rating-box">

    <div>

      <div
        class="rating-number"
        id="ratingNumber">

        0.0

      </div>

      <div class="rating-label">
        تقييم الحساب
      </div>

    </div>


    <div
      class="rating-count"
      id="ratingCount">

      لا توجد تقييمات بعد

    </div>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-icon">+</div>
      <div class="stat-number" id="listingsCount">0</div>
      <div class="stat-label">إعلاناتي</div>
    </div>

    <div class="stat">
      <div class="stat-icon">✓</div>
      <div class="stat-number" id="purchasesCount">0</div>
      <div class="stat-label">مشترياتي</div>
    </div>

  </div>


</section>


<!-- =====================================================
     ACCOUNT MANAGEMENT
===================================================== -->

<section class="section">


  <div class="section-title-row">

    <span class="section-accent"></span>

    <h2 class="section-title">
      إدارة الحساب
    </h2>

  </div>


  <div class="menu-card">


    <!-- MY LISTINGS -->

    <button
      class="menu-item"
      id="myListingsBtn"
      type="button">

      <span class="menu-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8">

          <rect
            x="4"
            y="4"
            width="16"
            height="16"
            rx="2"/>

          <path d="M8 9h8"/>
          <path d="M8 13h8"/>
          <path d="M8 17h5"/>

        </svg>

      </span>


      <span class="menu-copy">

        <span class="menu-title">
          أجهزتي المعروضة
        </span>

        <span class="menu-sub">
          عرض وإدارة الأجهزة التي أضفتها للبيع
        </span>

      </span>


      <svg
        class="menu-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M9 18l6-6-6-6"/>

      </svg>

    </button>


    <!-- AUCTIONS -->

    <button
      class="menu-item"
      id="myAuctionsBtn"
      type="button">

      <span class="menu-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8">

          <path d="m7 11 7.5-7.5 3 3L10 14"/>
          <path d="m5 13 6 6"/>
          <path d="M4 20h16"/>

        </svg>

      </span>


      <span class="menu-copy">

        <span class="menu-title">
          مزاداتي
        </span>

        <span class="menu-sub">
          إدارة الأجهزة التي تعرضها بالمزاد
        </span>

      </span>


      <svg
        class="menu-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M9 18l6-6-6-6"/>

      </svg>

    </button>


    <!-- PURCHASES -->

    <button
      class="menu-item"
      id="purchasesBtn"
      type="button">

      <span class="menu-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8">

          <path d="M6 7h12l1 13H5L6 7Z"/>
          <path d="M9 7a3 3 0 0 1 6 0"/>

        </svg>

      </span>


      <span class="menu-copy">

        <span class="menu-title">
          مشترياتي
        </span>

        <span class="menu-sub">
          الأجهزة التي اشتريتها من المنصة
        </span>

      </span>


      <svg
        class="menu-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M9 18l6-6-6-6"/>

      </svg>

    </button>


  </div>

</section>


<!-- =====================================================

<script type="module">

import { supabase }
  from "./js/supabase.js";


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById("loading");

const profileName =
  document.getElementById("profileName");

const profileEmail =
  document.getElementById("profileEmail");

const infoPhone =
  document.getElementById("infoPhone");

const infoEmail =
  document.getElementById("infoEmail");

const ratingNumber =
  document.getElementById("ratingNumber");

const ratingCount =
  document.getElementById("ratingCount");

const purchasesCount =
  document.getElementById("purchasesCount");

const listingsCount =
  document.getElementById("listingsCount");

const toast =
  document.getElementById("toast");

const backBtn =
  document.getElementById("backBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const myListingsBtn =
  document.getElementById("myListingsBtn");

const myAuctionsBtn =
  document.getElementById("myAuctionsBtn");

const purchasesBtn =
  document.getElementById("purchasesBtn");


let toastTimer;


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

  try{

    const {
      data,
      error
    } =
      await supabase.auth.getUser();


    if(
      error ||
      !data?.user
    ){

      window.location.replace(
        "index.html?login=1&returnTo=profile.html"
      );

      return;

    }


    const user =
      data.user;

    const metadata =
      user.user_metadata || {};


    const fullName =
      metadata.full_name ||
      metadata.name ||
      "مستخدم MZAD PHONE";


    const phone =
      metadata.phone ||
      "غير مضاف";


    const email =
      user.email ||
      "غير مضاف";


    /* USER */

    profileName.textContent =
      fullName;

    profileEmail.textContent =
      email;

    infoPhone.textContent =
      phone;

    infoEmail.textContent =
      email;


    /* LISTINGS COUNT */

    const {
      count: listingsTotal,
      error: listingsError
    } =
      await supabase
        .from("devices")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .eq(
          "seller_id",
          user.id
        );


    if(
      listingsError
    ){

      console.error(
        "Listings count error:",
        listingsError
      );

    }


    /* CURRENT STATS */

    ratingNumber.textContent =
      "0.0";

    ratingCount.textContent =
      "لا توجد تقييمات بعد";

    purchasesCount.textContent =
      "0";

    listingsCount.textContent =
      String(
        listingsTotal ?? 0
      );


    loading.classList.add(
      "hidden"
    );


  }catch(error){

    console.error(
      "Profile error:",
      error
    );

    showToast(
      "تعذر تحميل الحساب"
    );

    setTimeout(
      () => {

        loading.classList.add(
          "hidden"
        );

      },
      500
    );

  }

}


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if(
      document.referrer &&
      document.referrer.includes(
        window.location.host
      )
    ){

      window.history.back();

    }else{

      window.location.href =
        "home.html";

    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
  "click",
  async () => {

    logoutBtn.disabled =
      true;

    logoutBtn.textContent =
      "جاري تسجيل الخروج...";


    try{

      const {
        error
      } =
        await supabase.auth.signOut();


      if(error){

        logoutBtn.disabled =
          false;

        logoutBtn.textContent =
          "تسجيل الخروج";

        showToast(
          "تعذر تسجيل الخروج"
        );

        return;

      }


      sessionStorage.removeItem(
        "mzad_pending_action"
      );


      window.location.replace(
        "home.html"
      );


    }catch(error){

      console.error(
        error
      );

      logoutBtn.disabled =
        false;

      logoutBtn.textContent =
        "تسجيل الخروج";

      showToast(
        "حدث خطأ أثناء تسجيل الخروج"
      );

    }

  }
);


/* =====================================================
   MY LISTINGS
===================================================== */

myListingsBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      "my-listings.html";

  }
);


/* =====================================================
   MY AUCTIONS
===================================================== */

myAuctionsBtn.addEventListener(
  "click",
  () => {

    showToast(
      "قسم مزاداتك راح يتفعل مع نظام المزادات"
    );

  }
);


/* =====================================================
   PURCHASES
===================================================== */

purchasesBtn.addEventListener(
  "click",
  () => {

    showToast(
      "سجل المشتريات راح يتفعل مع نظام الشراء"
    );

  }
);


/* =====================================================
   BOTTOM NAV
===================================================== */

document
  .querySelectorAll("[data-go]")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const url =
            button.dataset.go;

          if(!url){
            return;
          }

          window.location.href =
            url;

        }
      );

    }
  );


/* =====================================================
   START
===================================================== */

loadProfile();

</script>
