<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="theme-color" content="#F7F8FA">

<title>MZAD PHONE — حسابي</title>

<style>

/* =====================================================
   ROOT
===================================================== */

:root{
  --bg:#F7F8FA;
  --surface:#FFFFFF;
  --surface-2:#F1F5F7;

  --ink:#17202A;
  --muted:#667085;
  --muted-2:#8A929A;

  --line:#E6E9ED;

  --primary:#176B87;
  --primary-dark:#125A73;
  --primary-soft:#E8F3F6;

  --purple:#6246D9;
  --purple-dark:#51477D;
  --purple-soft:#F0EEFF;

  --danger:#C63C55;
  --danger-soft:#FFF3F5;

  --safe-bottom:env(safe-area-inset-bottom,0px);

  --shadow:
    0 10px 28px rgba(23,32,42,.06);
}


/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  min-height:100vh;

  background:var(--bg);

  color:var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;

  text-rendering:optimizeLegibility;
}

button{
  font:inherit;

  border:0;

  cursor:pointer;

  color:inherit;
}

button:disabled{
  cursor:default;
}

.page{
  width:min(100%,520px);

  margin:auto;

  padding:
    0
    14px
    calc(112px + var(--safe-bottom));
}


/* =====================================================
   HEADER
===================================================== */

.header{
  margin-inline:-14px;

  padding:
    8px
    14px
    17px;

  background:
    linear-gradient(
      145deg,
      #FFFFFF 0%,
      #F7F5FF 45%,
      #EAE6FF 100%
    );

  border-bottom:
    1px solid var(--line);

  border-radius:
    0
    0
    25px
    25px;

  box-shadow:
    0 10px
    26px
    rgba(23,32,42,.055);

  position:relative;

  overflow:hidden;

  animation:
    headerIn .42s cubic-bezier(.2,.7,.2,1) both;
}

.header::before{
  content:"";

  position:absolute;

  width:190px;
  height:190px;

  left:-105px;
  top:-125px;

  border-radius:50%;

  background:
    rgba(23,107,135,.045);

  pointer-events:none;
}

.header::after{
  content:"";

  position:absolute;

  width:150px;
  height:150px;

  right:-78px;
  bottom:-108px;

  border-radius:50%;

  background:
    rgba(98,70,217,.075);

  pointer-events:none;
}


/* =====================================================
   TOPBAR
===================================================== */

.topbar{
  position:relative;

  z-index:2;

  display:flex;

  align-items:center;

  gap:8px;
}

.back-btn{
  width:38px;
  height:38px;

  flex:0 0 38px;

  border-radius:12px;

  background:#FFFFFF;

  border:
    1px solid #DDD8F8;

  color:var(--primary);

  display:grid;

  place-items:center;

  box-shadow:
    0 7px
    18px
    rgba(23,32,42,.045);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.back-btn:active{
  transform:scale(.92);

  box-shadow:
    0 4px
    11px
    rgba(23,32,42,.05);
}

.brand{
  flex:1;

  text-align:center;

  line-height:.9;
}

.brand strong{
  display:block;

  font-size:19px;

  font-weight:950;

  letter-spacing:-.055em;
}

.brand span{
  display:block;

  margin-top:4px;

  color:#89929A;

  font-size:7px;

  font-weight:950;

  letter-spacing:.22em;
}

.header-spacer{
  width:38px;

  flex:0 0 38px;
}


/* =====================================================
   PAGE INTRO
===================================================== */

.page-intro{
  position:relative;

  z-index:2;

  margin-top:12px;
}

.page-intro h1{
  margin:0;

  font-size:21px;

  line-height:1.2;

  font-weight:950;

  letter-spacing:-.045em;
}

.page-intro p{
  margin:
    5px
    0
    0;

  color:var(--muted);

  font-size:10px;

  line-height:1.5;
}


/* =====================================================
   PROFILE CARD
===================================================== */

.profile-card{
  margin-top:12px;

  padding:17px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      #FFFFFF 0%,
      #FAFBFC 58%,
      #F3F7F8 100%
    );

  border:
    1px solid var(--line);

  box-shadow:
    0 12px
    28px
    rgba(23,32,42,.065);

  position:relative;

  overflow:hidden;

  animation:
    contentIn .42s .06s cubic-bezier(.2,.7,.2,1) both;
}

.profile-card::before{
  content:"";

  position:absolute;

  width:175px;
  height:175px;

  right:-105px;
  top:-105px;

  border-radius:50%;

  background:
    rgba(98,70,217,.065);

  pointer-events:none;
}

.profile-card::after{
  content:"";

  position:absolute;

  width:115px;
  height:115px;

  left:-72px;
  bottom:-78px;

  border-radius:50%;

  background:
    rgba(23,107,135,.045);

  pointer-events:none;
}


/* =====================================================
   PROFILE TOP
===================================================== */

.profile-top{
  position:relative;

  z-index:2;

  display:flex;

  align-items:center;

  gap:12px;
}

.profile-avatar{
  width:56px;
  height:56px;

  flex:0 0 56px;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      #176B87 0%,
      #257F98 48%,
      #6246D9 100%
    );

  color:#FFFFFF;

  display:grid;

  place-items:center;

  font-size:20px;

  font-weight:950;

  box-shadow:
    0 10px
    22px
    rgba(23,107,135,.16);
}

.profile-main{
  min-width:0;

  flex:1;
}

.profile-name{
  margin:0;

  color:var(--ink);

  font-size:18px;

  line-height:1.25;

  font-weight:950;

  letter-spacing:-.035em;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.profile-email{
  margin:
    4px
    0
    0;

  color:var(--muted);

  font-size:9px;

  line-height:1.35;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.profile-status{
  display:inline-flex;

  align-items:center;

  gap:5px;

  margin-top:7px;

  padding:
    5px
    8px;

  border-radius:999px;

  background:var(--primary-soft);

  border:
    1px solid #D8EBF0;

  color:var(--primary-dark);

  font-size:8px;

  font-weight:950;
}

.status-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#43B98A;

  box-shadow:
    0 0 0 3px rgba(67,185,138,.10);
}


/* =====================================================
   ACCOUNT DETAILS
===================================================== */

.profile-details{
  position:relative;

  z-index:2;

  margin-top:15px;

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:8px;
}

.account-detail{
  min-width:0;

  padding:
    10px
    11px;

  border-radius:13px;

  background:
    #F7F9FA;

  border:
    1px solid #EDF0F2;
}

.detail-label{
  color:#89929A;

  font-size:8px;

  font-weight:800;

  margin-bottom:4px;
}

.detail-value{
  color:var(--ink);

  font-size:10px;

  line-height:1.3;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =====================================================
   RATING
===================================================== */

.rating-box{
  position:relative;

  z-index:2;

  margin-top:9px;

  padding:
    11px
    12px;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      #F6F3FF,
      #F0EDFF
    );

  border:
    1px solid #E5E0FA;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;
}

.rating-number{
  color:var(--purple-dark);

  font-size:17px;

  line-height:1;

  font-weight:950;
}

.rating-label{
  margin-top:4px;

  color:#7B7399;

  font-size:8px;

  font-weight:800;
}

.rating-count{
  color:#7B7399;

  font-size:8px;

  font-weight:800;

  white-space:nowrap;
}


/* =====================================================
   STATS
===================================================== */

.stats{
  position:relative;

  z-index:2;

  margin-top:9px;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:7px;
}

.stat{
  min-width:0;

  padding:
    10px
    5px;

  text-align:center;

  border-radius:13px;

  background:#FFFFFF;

  border:
    1px solid #E9ECEF;

  box-shadow:
    0 4px
    12px
    rgba(23,32,42,.025);
}

.stat-number{
  color:var(--ink);

  font-size:15px;

  line-height:1;

  font-weight:950;
}

.stat-label{
  margin-top:4px;

  color:var(--muted);

  font-size:8px;

  font-weight:800;
}


/* =====================================================
   SECTION
===================================================== */

.section{
  margin-top:19px;

  animation:
    contentIn .42s .11s cubic-bezier(.2,.7,.2,1) both;
}

.section-title-row{
  display:flex;

  align-items:center;

  gap:8px;

  margin:
    0
    2px
    9px;
}

.section-accent{
  width:4px;
  height:19px;

  flex:0 0 4px;

  border-radius:999px;

  background:
    linear-gradient(
      180deg,
      #B7A58F,
      #8D7C68
    );
}

.section-title{
  margin:0;

  color:#4F463D;

  font-size:17px;

  line-height:1.2;

  font-weight:950;

  letter-spacing:-.035em;
}


/* =====================================================
   MENU
===================================================== */

.menu-card{
  background:#FFFFFF;

  border:
    1px solid var(--line);

  border-radius:19px;

  overflow:hidden;

  box-shadow:
    0 9px
    22px
    rgba(23,32,42,.045);
}

.menu-item{
  width:100%;

  min-height:65px;

  padding:
    9px
    12px;

  display:flex;

  align-items:center;

  gap:11px;

  background:#FFFFFF;

  text-align:right;

  border-bottom:
    1px solid #F0F1F3;

  transition:
    background .18s ease,
    transform .18s ease;
}

.menu-item:last-child{
  border-bottom:0;
}

.menu-item:active{
  background:#F8FAFB;

  transform:scale(.992);
}

.menu-icon{
  width:39px;
  height:39px;

  flex:0 0 39px;

  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      #E8F3F6,
      #E0EFF3
    );

  color:var(--primary);

  display:grid;

  place-items:center;

  border:
    1px solid #DCECEF;
}

.menu-copy{
  min-width:0;

  flex:1;
}

.menu-title{
  display:block;

  color:var(--ink);

  font-size:11px;

  line-height:1.25;

  font-weight:950;
}

.menu-sub{
  display:block;

  margin-top:2px;

  color:var(--muted);

  font-size:8px;

  line-height:1.35;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.menu-arrow{
  width:17px;
  height:17px;

  flex:0 0 17px;

  color:#A5ADB4;
}


/* =====================================================
   LOGOUT
===================================================== */

.logout-btn{
  width:100%;

  height:48px;

  margin-top:15px;

  border-radius:14px;

  background:
    var(--danger-soft);

  border:
    1px solid #F1D5DB;

  color:var(--danger);

  font-size:11px;

  font-weight:950;

  box-shadow:
    0 7px
    18px
    rgba(198,60,85,.045);

  transition:
    transform .18s ease,
    background .18s ease;
}

.logout-btn:active{
  transform:scale(.985);

  background:#FFECEF;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-wrap{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  padding:
    7px
    10px
    calc(7px + var(--safe-bottom));

  z-index:50;

  pointer-events:none;
}

.bottom-nav{
  width:min(100%,520px);

  margin:auto;

  min-height:65px;

  padding:6px;

  border-radius:21px;

  background:
    rgba(255,255,255,.97);

  border:
    1px solid rgba(23,107,135,.10);

  box-shadow:
    0 -8px
    27px
    rgba(23,107,135,.08);

  backdrop-filter:blur(16px);

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:3px;

  pointer-events:auto;
}

.nav-item{
  min-width:0;

  min-height:52px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:3px;

  border-radius:15px;

  color:#858D94;

  background:transparent;

  transition:
    color .18s ease,
    background .18s ease,
    transform .18s ease;
}

.nav-item:active{
  transform:scale(.94);
}

.nav-item.active{
  color:var(--primary-dark);

  background:
    linear-gradient(
      145deg,
      #E8F3F6,
      #DCEEF2
    );
}

.nav-label{
  font-size:8px;

  line-height:1;

  font-weight:900;
}

.nav-icon{
  width:21px;
  height:21px;
}


/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  left:50%;

  bottom:
    calc(88px + var(--safe-bottom));

  transform:
    translateX(-50%)
    translateY(12px);

  max-width:
    calc(100% - 40px);

  padding:
    10px
    14px;

  border-radius:13px;

  background:#1E2C30;

  color:#FFFFFF;

  font-size:11px;

  font-weight:800;

  text-align:center;

  box-shadow:
    0 12px
    30px
    rgba(23,32,42,.16);

  opacity:0;

  pointer-events:none;

  transition:
    opacity .22s ease,
    transform .22s ease;

  z-index:80;
}

.toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =====================================================
   LOADING
===================================================== */

.loading{
  position:fixed;

  inset:0;

  z-index:100;

  background:var(--bg);

  display:flex;

  align-items:center;

  justify-content:center;

  transition:
    opacity .28s ease,
    visibility .28s ease;
}

.loading.hidden{
  opacity:0;

  visibility:hidden;

  pointer-events:none;
}

.loader{
  width:32px;
  height:32px;

  border-radius:50%;

  border:
    3px solid #DCE7EA;

  border-top-color:
    var(--primary);

  animation:
    spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes headerIn{

  from{
    opacity:0;

    transform:
      translateY(-10px);
  }

  to{
    opacity:1;

    transform:
      translateY(0);
  }

}

@keyframes contentIn{

  from{
    opacity:0;

    transform:
      translateY(8px);
  }

  to{
    opacity:1;

    transform:
      translateY(0);
  }

}


/* =====================================================
   SMALL SCREENS
===================================================== */

@media(max-width:360px){

  .page{
    padding-inline:12px;
  }

  .header{
    margin-inline:-12px;
  }

  .profile-card{
    padding:15px;
  }

  .profile-avatar{
    width:52px;
    height:52px;

    flex-basis:52px;

    border-radius:16px;

    font-size:18px;
  }

  .profile-name{
    font-size:17px;
  }

  .menu-title{
    font-size:10px;
  }

  .menu-sub{
    font-size:7px;
  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none !important;

    transition:none !important;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     LOADING
===================================================== -->

<div
  class="loading"
  id="loading">

  <div class="loader"></div>

</div>


<main class="page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="topbar">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
      aria-label="رجوع">

      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M15 18l-6-6 6-6"/>

      </svg>

    </button>


    <div class="brand">

      <strong>MZAD</strong>

      <span>PHONE</span>

    </div>


    <div class="header-spacer"></div>

  </div>


  <div class="page-intro">

    <h1>
      حسابي
    </h1>

    <p>
      إدارة حسابك ومتابعة نشاطك على MZAD PHONE
    </p>

  </div>

</header>


<!-- =====================================================
     PROFILE CARD
===================================================== -->

<section class="profile-card">


  <div class="profile-top">


    <div
      class="profile-avatar"
      id="profileAvatar">

      م

    </div>


    <div class="profile-main">

      <h2
        class="profile-name"
        id="profileName">

        جاري التحميل...

      </h2>


      <p
        class="profile-email"
        id="profileEmail">

        —

      </p>


      <div class="profile-status">

        <span class="status-dot"></span>

        حساب نشط

      </div>

    </div>

  </div>


  <!-- ACCOUNT DETAILS -->

  <div class="profile-details">


    <div class="account-detail">

      <div class="detail-label">
        رقم الهاتف
      </div>

      <div
        class="detail-value"
        id="infoPhone">

        —

      </div>

    </div>


    <div class="account-detail">

      <div class="detail-label">
        البريد الإلكتروني
      </div>

      <div
        class="detail-value"
        id="infoEmail">

        —

      </div>

    </div>


  </div>


  <!-- RATING -->

  <div class="rating-box">

    <div>

      <div
        class="rating-number"
        id="ratingNumber">

        0.0

      </div>

      <div class="rating-label">
        تقييم الحساب
      </div>

    </div>


    <div
      class="rating-count"
      id="ratingCount">

      لا توجد تقييمات بعد

    </div>

  </div>


  <!-- STATS -->

  <div class="stats">


    <div class="stat">

      <div
        class="stat-number"
        id="salesCount">

        0

      </div>

      <div class="stat-label">
        مبيعات
      </div>

    </div>


    <div class="stat">

      <div
        class="stat-number"
        id="purchasesCount">

        0

      </div>

      <div class="stat-label">
        مشتريات
      </div>

    </div>


    <div class="stat">

      <div
        class="stat-number"
        id="listingsCount">

        0

      </div>

      <div class="stat-label">
        إعلانات
      </div>

    </div>


  </div>


</section>


<!-- =====================================================
     ACCOUNT
===================================================== -->

<section class="section">


  <div class="section-title-row">

    <span class="section-accent"></span>

    <h2 class="section-title">
      حسابي
    </h2>

  </div>


  <div class="menu-card">


    <!-- MY LISTINGS -->

    <button
      class="menu-item"
      id="myListingsBtn"
      type="button">


      <span class="menu-icon">

        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8">

          <rect
            x="4"
            y="4"
            width="16"
            height="16"
            rx="2"/>

          <path d="M8 9h8"/>
          <path d="M8 13h8"/>
          <path d="M8 17h5"/>

        </svg>

      </span>


      <span class="menu-copy">

        <span class="menu-title">
          أجهزتي المعروضة
        </span>

        <span class="menu-sub">
          إدارة الأجهزة التي تعرضها للبيع
        </span>

      </span>


      <svg
        class="menu-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M9 18l6-6-6-6"/>

      </svg>


    </button>


    <!-- AUCTIONS -->

    <button
      class="menu-item"
      id="myAuctionsBtn"
      type="button">


      <span class="menu-icon">

        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8">

          <path d="m7 11 7.5-7.5 3 3L10 14"/>

          <path d="m5 13 6 6"/>

          <path d="M4 20h16"/>

        </svg>

      </span>


      <span class="menu-copy">

        <span class="menu-title">

<div
  class="toast"
  id="toast">
</div>


<script type="module">

import { supabase } from "./js/supabase.js";


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById("loading");

const profileName =
  document.getElementById("profileName");

const profileEmail =
  document.getElementById("profileEmail");

const profileAvatar =
  document.getElementById("profileAvatar");

const infoPhone =
  document.getElementById("infoPhone");

const infoEmail =
  document.getElementById("infoEmail");

const ratingNumber =
  document.getElementById("ratingNumber");

const ratingCount =
  document.getElementById("ratingCount");

const salesCount =
  document.getElementById("salesCount");

const purchasesCount =
  document.getElementById("purchasesCount");

const listingsCount =
  document.getElementById("listingsCount");

const toast =
  document.getElementById("toast");

const backBtn =
  document.getElementById("backBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const myListingsBtn =
  document.getElementById("myListingsBtn");

const myAuctionsBtn =
  document.getElementById("myAuctionsBtn");

const purchasesBtn =
  document.getElementById("purchasesBtn");

const salesBtn =
  document.getElementById("salesBtn");

const favoritesBtn =
  document.getElementById("favoritesBtn");

const settingsBtn =
  document.getElementById("settingsBtn");


let toastTimer;


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =====================================================
   AVATAR LETTER
===================================================== */

function getInitial(name){

  const text =
    String(name || "").trim();

  if(!text){
    return "م";
  }

  return text.charAt(0);

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadProfile(){

  try{

    const {
      data,
      error
    } =
      await supabase.auth.getUser();


    if(
      error ||
      !data?.user
    ){

      window.location.replace(
        "index.html?login=1&returnTo=profile.html"
      );

      return;

    }


    const user =
      data.user;

    const metadata =
      user.user_metadata || {};


    const fullName =
      metadata.full_name ||
      metadata.name ||
      "مستخدم MZAD PHONE";


    const phone =
      metadata.phone ||
      "غير مضاف";


    const email =
      user.email ||
      "غير مضاف";


    profileName.textContent =
      fullName;

    profileEmail.textContent =
      email;

    infoPhone.textContent =
      phone;

    infoEmail.textContent =
      email;


    profileAvatar.textContent =
      getInitial(fullName);


    /*
      حالياً تبقى هذه الأرقام صفر
      إلى أن نربط جداول المعاملات
      الحقيقية.
    */

    ratingNumber.textContent =
      "0.0";

    ratingCount.textContent =
      "لا توجد تقييمات بعد";

    salesCount.textContent =
      "0";

    purchasesCount.textContent =
      "0";

    listingsCount.textContent =
      "0";


    loading.classList.add(
      "hidden"
    );


  }catch(error){

    console.error(
      "Profile error:",
      error
    );


    showToast(
      "تعذر تحميل الحساب"
    );


    setTimeout(
      () => {

        loading.classList.add(
          "hidden"
        );

      },
      500
    );

  }

}


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if(
      document.referrer &&
      document.referrer.includes(
        window.location.host
      )
    ){

      window.history.back();

    }else{

      window.location.href =
        "home.html";

    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
  "click",
  async () => {

    logoutBtn.disabled =
      true;

    logoutBtn.textContent =
      "جاري تسجيل الخروج...";


    try{

      const {
        error
      } =
        await supabase.auth.signOut();


      if(error){

        logoutBtn.disabled =
          false;

        logoutBtn.textContent =
          "تسجيل الخروج";

        showToast(
          "تعذر تسجيل الخروج"
        );

        return;

      }


      sessionStorage.removeItem(
        "mzad_pending_action"
      );


      window.location.replace(
        "home.html"
      );


    }catch(error){

      console.error(
        error
      );


      logoutBtn.disabled =
        false;

      logoutBtn.textContent =
        "تسجيل الخروج";


      showToast(
        "حدث خطأ أثناء تسجيل الخروج"
      );

    }

  }
);


/* =====================================================
   MY LISTINGS
===================================================== */

myListingsBtn.addEventListener(
  "click",

    showToast(
      "قسم أجهزتك راح يتفعل مع نظام البيع"
    );

===================================================== */

   PURCHASES
===================================================== */

===================================================== */

salesBtn.addEventListener(

favoritesBtn.addEventListener(

    window.location.href =
      "favorites.html";

   BOTTOM NAV
===================================================== */

document

    button => {

      button.addEventListener(
        "click",
        () => {

          const url =
            button.dataset.go;

          if(!url){
            return;
          }

          window.location.href =
            url;

        }
      );

    }
  );


/* =====================================================
   START
===================================================== */

loadProfile();

</script>
