<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f7f6fb">
<title>MZAD PHONE — حسابي</title>
<style>
:root{--bg:#f7f6fb;--card:#fff;--ink:#16181d;--muted:#737a86;--muted2:#a0a6b1;--line:#eeecf6;--p:#6246d9;--p2:#8b6cf0;--p-dark:#3f2a9c;--p-soft:#f1eeff;--ok:#1e8a5a;--bad:#c62f4d;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.page{width:min(100%,520px);margin:0 auto;padding:0 16px calc(96px + var(--sb))}

/* top bar */
.top{position:sticky;top:0;z-index:30;margin-inline:-16px;padding:calc(10px + var(--st)) 16px 10px;display:flex;align-items:center;justify-content:space-between;background:rgba(247,246,251,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--ink);transition:transform .15s}
.ib:active{transform:scale(.93)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top h2{margin:0;font-size:16px;font-weight:900}
.sp{width:40px}

/* identity */
.who{padding:6px 2px 14px}
.wm{min-width:0;flex:1}
.wm h1{margin:0;font-size:22px;line-height:1.25;font-weight:900;letter-spacing:-.02em;overflow-wrap:anywhere}
.live{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font-size:11.5px;font-weight:800;color:var(--ok)}
.live i{width:7px;height:7px;border-radius:50%;background:#2fb67e}

/* ID card - the one bold element */
.idcard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#4a34b8,#6246d9 60%,#7c5ee8)}
.idcard small{display:block;font-size:11.5px;font-weight:800;opacity:.8}
.code{margin:4px 0 0;font-size:22px;font-weight:900;letter-spacing:2px;direction:ltr;text-align:right;overflow-wrap:anywhere}
.code.sm{font-size:14px;letter-spacing:0;font-weight:800}
.copy{flex:0 0 auto;padding:8px 16px;border-radius:99px;background:#fff;color:var(--p-dark);font-size:12px;font-weight:900;transition:transform .15s}
.copy:active{transform:scale(.95)}
.copy:disabled{opacity:.55;cursor:wait}

/* quick tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 11px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:transform .15s}
.tile:active{transform:scale(.95)}
.tile .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--p-soft);color:var(--p)}
.tile svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile span.l{font-size:11px;font-weight:800;line-height:1.3;text-align:center}
.badge{position:absolute;top:7px;inset-inline-start:7px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--p);color:#fff;font-size:10.5px;font-weight:900;display:grid;place-items:center}

/* sections */
.sec{margin-top:28px}
.sec>h3{margin:0 2px 6px;font-size:18px;font-weight:900;letter-spacing:-.01em}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:2px 14px}
.row{width:100%;display:flex;align-items:center;gap:13px;padding:14px 0;text-align:right;border-bottom:1px solid var(--line);transition:opacity .15s}
.row:last-child{border-bottom:0}
.row:active{opacity:.6}
.row .ic{width:24px;height:24px;flex:0 0 24px;color:#7b8394}
.row .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rt{min-width:0;flex:1}
.rt b{display:block;font-size:14px;font-weight:800}
.rt small{display:block;margin-top:2px;font-size:11.5px;font-weight:600;color:var(--muted);direction:rtl}
.rt small.ltr{direction:ltr;text-align:right}
.ar{width:17px;height:17px;flex:0 0 17px;fill:none;stroke:#bfc4ce;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* wins */
.empty{margin:0;padding:14px 0;font-size:12.5px;line-height:1.9;font-weight:700;color:var(--muted)}
.win{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.win:last-child{border-bottom:0}
.wi{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;background:#fff6dc;color:#b7860b}
.wi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wn{min-width:0;flex:1}
.wn b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn small{display:block;margin-top:3px;font-size:11px;font-weight:600;color:var(--muted)}
.an{direction:ltr;text-align:right;font-size:10px!important;color:var(--muted2)!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wp{text-align:left;white-space:nowrap}
.wp b{display:block;font-size:13px;font-weight:900;color:var(--p-dark)}
.wp small{display:inline-block;margin-top:3px;padding:2px 8px;border-radius:99px;background:#e8f6ef;color:var(--ok);font-size:10px;font-weight:800}

.out{width:100%;height:52px;margin-top:24px;border-radius:18px;background:#fff;border:1px solid #f1c4cd;color:var(--bad);font-size:14px;font-weight:900;transition:transform .15s}
.out:active{transform:scale(.98)}
.out:disabled{opacity:.6}
.ver{margin:14px 0 0;text-align:center;font-size:11px;font-weight:700;color:var(--muted2)}

/* bottom nav */
.bw{position:fixed;left:0;right:0;bottom:0;z-index:50}
.bn{width:100%;max-width:520px;margin:0 auto;padding:8px 10px calc(8px + var(--sb));background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.ni{min-width:0;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;color:#7e8992;transition:color .16s,background .16s}
.ni:active{background:var(--p-soft)}
.ni.on{color:var(--p)}
.ni svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ni span{font-size:10px;line-height:1;font-weight:800;white-space:nowrap}
.add{width:44px;height:26px;border-radius:13px;display:grid;place-items:center;background:var(--p);color:#fff}
.add svg{width:18px;height:18px;stroke-width:2.4}

.toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translate(-50%,14px);max-width:calc(100% - 40px);padding:10px 15px;border-radius:13px;background:#16181d;color:#fff;font-size:12px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:.28s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:.28s}
.loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--p);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:360px){.tiles{grid-template-columns:repeat(2,1fr)}.code{font-size:25px}.ct{grid-template-columns:1fr}}
</style>
<script type="module" src="./js/auth-guard.js"></script>
</head>
<body>
<div class="loading" id="loading"><div class="loader"></div></div>

<main class="page">
  <div class="top">
    <button class="ib" id="backBtn" type="button" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <h2>حسابي</h2>
    <span class="sp"></span>
  </div>

  <section class="who">
    <div class="wm">
      <h1 id="profileName">جاري التحميل...</h1>
      <span class="live"><i></i>حساب نشط</span>
    </div>
  </section>

  <section class="idcard">
    <div>
      <small>المعرّف الخاص بك (ID)</small>
      <p class="code" id="personalCode" aria-live="polite">...</p>
    </div>
    <button class="copy" id="copyPersonalCode" type="button" disabled>نسخ</button>
  </section>

  <nav class="tiles" aria-label="اختصارات">
    <button class="tile" data-go="my-listings.html" type="button">
      <span class="badge" id="listingsBadge" style="display:none">0</span>
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg></span>
      <span class="l">أجهزتي</span>
    </button>
    <button class="tile" data-go="my-auctions.html" type="button">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="m7 11 7.5-7.5 3 3L10 14M5 13l6 6M4 21h16"/></svg></span>
      <span class="l">مزاداتي</span>
    </button>
    <button class="tile" data-go="my-deposits.html" type="button">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
      <span class="l">تأميناتي</span>
    </button>
    <button class="tile" data-toast="سجل المشتريات راح يتفعل مع نظام الشراء" type="button">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></span>
      <span class="l">مشترياتي</span>
    </button>
  </nav>

  <section class="sec" id="winsSec">
    <h3>المزادات اللي فزت بيها</h3>
    <div class="box" id="winsList"><p class="empty">جاري تحميل نتائج مزاداتك...</p></div>
  </section>

  <section class="sec">
    <h3>حسابك</h3>
    <div class="box">
      <button class="row" data-toast="تعديل المعلومات راح يتفعل قريباً." type="button">
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>
        <span class="rt"><b>المعلومات الشخصية</b><small class="ltr" id="rowPhone">—</small></span>
        <svg class="ar" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="row" data-toast="تعديل المعلومات راح يتفعل قريباً." type="button">
        <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></span>
        <span class="rt"><b>البريد الإلكتروني</b><small class="ltr" id="rowEmail">—</small></span>
        <svg class="ar" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="row" data-go="favorites.html" type="button">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7z"/></svg></span>
        <span class="rt"><b>المفضلة</b><small>الأجهزة اللي حفظتها</small></span>
        <svg class="ar" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
  </section>

  <section class="sec">
    <h3>الدعم</h3>
    <div class="box">
      <button class="row" data-toast="هذا القسم راح يتفعل قريباً." type="button">
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5M12 17h.01"/></svg></span>
        <span class="rt"><b>مركز المساعدة</b></span>
        <svg class="ar" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="row" data-toast="هذا القسم راح يتفعل قريباً." type="button">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></svg></span>
        <span class="rt"><b>تواصل معنا</b></span>
        <svg class="ar" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="row" data-toast="هذا القسم راح يتفعل قريباً." type="button">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6V3z"/><path d="M9 12h7M9 16h5"/></svg></span>
        <span class="rt"><b>الشروط والأحكام</b></span>
        <svg class="ar" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="row" data-toast="هذا القسم راح يتفعل قريباً." type="button">
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg></span>
        <span class="rt"><b>من نحن</b></span>
        <svg class="ar" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
  </section>

  <button class="out" id="logoutBtn" type="button">تسجيل الخروج</button>
  <p class="ver">MZAD PHONE</p>
</main>

<div class="bw"><nav class="bn">
  <a class="ni" href="home.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg><span>الرئيسية</span></a>
  <a class="ni" href="market.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>الأجهزة</span></a>
  <a class="ni" href="sell.html"><span class="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span>إضافة</span></a>
  <a class="ni" href="favorites.html"><svg viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7z"/></svg><span>المفضلة</span></a>
  <a class="ni on" href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.4 3.1-5 7-5s6.2 1.6 7 5"/></svg><span>حسابي</span></a>
</nav></div>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from "./js/supabase.js";
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let tt;
function toast(m){ const e = $("toast"); e.textContent = m; e.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => e.classList.remove("show"), 2300); }

/* ===== المزادات اللي فزت بيها ===== */
async function loadWins(){
  const list = $("winsList");
  try{
    const { data, error } = await supabase.rpc("mzad_get_my_auction_wins");
    if (error) throw error;
    const rows = data || [];
    if (!rows.length){ list.innerHTML = '<p class="empty">بعدك ما فزت بأي مزاد. إذا فزت، راح تظهر نتائج مزاداتك هنا.</p>'; return; }
    list.innerHTML = rows.map(w => {
      const dev = esc([w.brand, w.model].filter(Boolean).join(" ") || "جهاز");
      const num = w.auction_number ? '<small class="an">' + esc(w.auction_number) + '</small>' : "";
      const date = w.ended_at ? esc(new Date(w.ended_at).toLocaleDateString("ar-IQ")) : "";
      const price = Number(w.final_price_iqd || 0).toLocaleString("en-US");
      return `<a class="win" href="auction-details.html?auction=${encodeURIComponent(w.auction_id)}">
        <span class="wi"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8.5 20h7"/></svg></span>
        <span class="wn"><b>${dev}</b><small>${date}</small>${num}</span>
        <span class="wp"><b>${price} د.ع</b><small>فزت بيه ✓</small></span></a>`;
    }).join("");
  }catch(e){
    console.warn("MY AUCTION WINS:", e);
    list.innerHTML = '<p class="empty">تعذر تحميل نتائج مزاداتك حالياً.</p>';
  }
}

/* ===== الحساب ===== */
async function loadProfile(){
  try{
    const { data, error } = await supabase.auth.getUser();
    if (error || !data?.user){ location.replace("index.html?login=1&returnTo=profile.html"); return; }
    const user = data.user, m = user.user_metadata || {};
    const name = m.full_name || m.name || "مستخدم MZAD PHONE";
    const phone = m.phone || "غير مضاف";
    $("profileName").textContent = name;
    $("rowPhone").textContent = phone;
    $("rowEmail").textContent = user.email || "غير مضاف";
    $("loading").classList.add("hidden");

    loadWins();

    const code = await supabase.rpc("mzad_get_my_buyer_code");
    if (code.error || typeof code.data !== "string" || !code.data){
      console.error("Personal code error:", code.error);
      $("personalCode").textContent = "تعذر تحميل المعرّف";
      $("personalCode").classList.add("sm");
      toast("تعذر تحميل المعرّف الخاص بك");
    }else{
      $("personalCode").textContent = code.data;
      $("copyPersonalCode").disabled = false;
    }

    const cnt = await supabase.from("devices").select("id", { count:"exact", head:true }).eq("seller_id", user.id);
    if (cnt.error) console.error("Listings count error:", cnt.error);
    else if (cnt.count){ $("listingsBadge").textContent = cnt.count; $("listingsBadge").style.display = ""; }
  }catch(e){
    console.error("Profile error:", e);
    toast("تعذر تحميل الحساب");
    setTimeout(() => $("loading").classList.add("hidden"), 500);
  }
}

/* ===== الأزرار ===== */
$("backBtn").onclick = () => {
  if (document.referrer && document.referrer.includes(location.host)) history.back();
  else location.href = "home.html";
};

$("copyPersonalCode").onclick = async () => {
  const code = $("personalCode").textContent.trim();
  if (!code || /^(تعذر|\.\.\.)/.test(code)) return;
  try{
    await navigator.clipboard.writeText(code);
    toast("تم نسخ المعرّف");
  }catch{
    const f = document.createElement("textarea");
    f.value = code; f.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(f); f.select();
    const ok = document.execCommand("copy"); f.remove();
    toast(ok ? "تم نسخ المعرّف" : "المعرّف: " + code);
  }
};

document.addEventListener("click", e => {
  const b = e.target.closest(".row, .tile");
  if (!b) return;
  if (b.dataset.go) location.href = b.dataset.go;
  else if (b.dataset.toast) toast(b.dataset.toast);
});

$("logoutBtn").onclick = async () => {
  const btn = $("logoutBtn");
  btn.disabled = true; btn.textContent = "جاري تسجيل الخروج...";
  try{
    const { error } = await supabase.auth.signOut();
    if (error){ btn.disabled = false; btn.textContent = "تسجيل الخروج"; toast("تعذر تسجيل الخروج"); return; }
    sessionStorage.removeItem("mzad_pending_action");
    location.replace("home.html");
  }catch(e){
    console.error(e);
    btn.disabled = false; btn.textContent = "تسجيل الخروج";
    toast("حدث خطأ أثناء تسجيل الخروج");
  }
};

loadProfile();
</script>
</body>
</html>
