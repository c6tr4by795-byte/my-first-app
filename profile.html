<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#6246d9">
<title>MZAD PHONE — حسابي</title>
<style>
:root{--bg:#f9f8fd;--ink:#17202a;--muted:#6b7280;--muted2:#9aa3ab;--line:#ece8fb;--edge:#ddd8f8;--p:#6246d9;--p2:#8b6cf0;--p-dark:#4a34b8;--p-soft:#f3f0ff;--ok:#1e8a5a;--bad:#c62f4d;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.page{width:min(100%,520px);margin:0 auto;padding:0 14px calc(104px + var(--sb))}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes floaty{50%{transform:translateY(8px)}}

header{position:sticky;top:0;z-index:30;margin-inline:-14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(145deg,#fff,#f7f5ff 55%,#ece8ff);border-radius:0 0 22px 22px;border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(23,32,42,.055)}
.ib{width:40px;height:38px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--p);transition:transform .18s}
.ib:active{transform:scale(.94)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;flex-direction:column;align-items:center;line-height:.9}
.brand strong{font-size:16px;letter-spacing:-.03em}
.brand span{font-size:7px;font-weight:800;letter-spacing:.15em;color:#8a96a3;margin-top:3px}
.sp40{width:40px}

.hero{position:relative;overflow:hidden;margin-top:14px;padding:18px 16px 16px;border-radius:24px;background:linear-gradient(135deg,#e6e3f6,#ebe9f7 52%,#e2dff2);border:1px solid #d8d3ee;box-shadow:0 13px 28px rgba(98,70,217,.10);animation:up .45s backwards}
.hero>*{position:relative;z-index:1}
.orb{position:absolute!important;z-index:0!important;width:170px;height:170px;border-radius:50%;right:-80px;top:-95px;background:rgba(255,255,255,.45);animation:floaty 6s ease-in-out infinite}
.kick{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kick small{font-size:11.5px;font-weight:900;color:#6b6290}
.live{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:#fff;border:1px solid #d8d3ee;color:var(--ok);font-size:10.5px;font-weight:900}
.live i{width:7px;height:7px;border-radius:50%;background:#43b98a}
.hero h1{margin:8px 0 0;font-size:25px;line-height:1.25;font-weight:900;letter-spacing:-.04em;color:#3f3566;overflow-wrap:anywhere}
.hero p{margin:4px 0 0;font-size:11.5px;font-weight:700;color:#6b6290}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.cell{padding:10px 12px;border-radius:15px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);min-width:0}
.cell small{display:block;font-size:10.5px;font-weight:800;color:var(--muted)}
.cell b{display:block;margin-top:3px;font-size:12.5px;font-weight:900;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idc{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-color:#d9d1fb}
.idc>div{min-width:0}
.idc b{font-size:20px;letter-spacing:1px;color:var(--p-dark);text-align:right;overflow:visible}
.copy{flex:0 0 auto;padding:9px 14px;border-radius:99px;background:linear-gradient(135deg,#6246d9,#8b6cf0);color:#fff;font-size:11.5px;font-weight:900;box-shadow:0 8px 16px rgba(98,70,217,.25);transition:transform .18s}
.copy:active{transform:scale(.95)}
.copy:disabled{opacity:.5;cursor:wait}

.card{margin-top:14px;padding:15px 14px;border-radius:23px;background:#fff;border:1px solid var(--edge);box-shadow:0 7px 24px -14px rgba(98,70,217,.22);animation:up .45s backwards}
.sh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.si{width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#6246d9,#8b6cf0);box-shadow:0 5px 12px rgba(98,70,217,.25)}
.si svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sh h2{margin:0;font-size:15.5px;font-weight:900}
.empty{margin:0;padding:6px 2px;font-size:12px;line-height:1.9;font-weight:700;color:var(--muted)}

.mi{width:100%;display:flex;align-items:center;gap:12px;padding:12px 4px;text-align:right;border-bottom:1px solid #f1eefb;transition:background .18s,transform .18s}
.mi:last-child{border-bottom:0;padding-bottom:2px}
.mi:first-of-type{padding-top:4px}
.mi:active{transform:scale(.99);background:#faf9ff}
.mic{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;background:var(--p-soft);border:1px solid var(--edge);color:var(--p)}
.mic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mc{min-width:0;flex:1}
.mc b{display:block;font-size:13.5px;font-weight:900}
.mc small{display:block;margin-top:2px;font-size:11px;font-weight:700;color:var(--muted2);line-height:1.5}
.ar{width:17px;height:17px;flex:0 0 17px;fill:none;stroke:#b3a9e0;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.badge{padding:3px 9px;border-radius:99px;background:var(--p-soft);border:1px solid var(--edge);color:var(--p-dark);font-size:11px;font-weight:900}

.win{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid #f1eefb}
.win:last-child{border-bottom:0}
.wi{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;background:var(--p-soft);color:var(--p)}
.wi svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wm{min-width:0;flex:1}
.wm b{display:block;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm small{display:block;margin-top:3px;font-size:10.5px;font-weight:700;color:var(--muted)}
.wp{text-align:left;white-space:nowrap}
.wp b{display:block;font-size:12.5px;font-weight:900;color:var(--p-dark)}
.wp small{display:inline-block;margin-top:3px;padding:2px 8px;border-radius:99px;background:#e8f6ef;color:var(--ok);font-size:10px;font-weight:900}

.out{width:100%;height:50px;margin-top:14px;border-radius:16px;background:#fff;border:1px solid #f3c0cb;color:var(--bad);font-size:13px;font-weight:900;transition:transform .18s}
.out:active{transform:scale(.98)}
.out:disabled{opacity:.6}

.bw{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + var(--sb));z-index:50;pointer-events:none}
.bn{width:min(100%,500px);margin:0 auto;padding:6px;border-radius:22px;background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 8px 24px rgba(23,32,42,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);pointer-events:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.ni{min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:16px;color:#7e8992;transition:transform .16s,background .16s,color .16s}
.ni:active{transform:scale(.96)}
.ni.on{color:var(--p);background:var(--p-soft)}
.ni svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ni span{font-size:9px;line-height:1;font-weight:900;white-space:nowrap}
.add{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6246d9,#8b6cf0);color:#fff;box-shadow:0 8px 16px rgba(98,70,217,.28)}
.add svg{width:20px;height:20px;stroke-width:2.2}

.toast{position:fixed;left:50%;bottom:calc(92px + var(--sb));transform:translate(-50%,14px);max-width:calc(100% - 40px);padding:10px 14px;border-radius:13px;background:#17202a;color:#fff;font-size:12px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:.28s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:.28s}
.loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--p);animation:rot .8s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:360px){.hero h1{font-size:22px}.info{grid-template-columns:1fr}}
</style>
<script type="module" src="./js/auth-guard.js"></script>
</head>
<body>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from "./js/supabase.js";
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let tt;
function toast(m){ const e = $("toast"); e.textContent = m; e.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => e.classList.remove("show"), 2300); }

/* ===== المزادات اللي فزت بيها ===== */
async function loadWins(){
  const list = $("winsList");
  try{
    const { data, error } = await supabase.rpc("mzad_get_my_auction_wins");
    if (error) throw error;
    const rows = data || [];
    if (!rows.length){ list.innerHTML = '<p class="empty">بعدك ما فزت بأي مزاد. إذا فزت، راح تظهر نتائج مزاداتك هنا.</p>'; return; }
    list.innerHTML = rows.map(w => {
      const dev = esc([w.brand, w.model].filter(Boolean).join(" ") || "جهاز");
      const num = w.auction_number ? "المزاد " + esc(w.auction_number) + " · " : "";
      const date = w.ended_at ? esc(new Date(w.ended_at).toLocaleDateString("ar-IQ")) : "";
      const price = Number(w.final_price_iqd || 0).toLocaleString("en-US");
      return `<a class="win" href="auction-details.html?auction=${encodeURIComponent(w.auction_id)}">
        <span class="wi"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8.5 20h7"/></svg></span>
        <span class="wm"><b>${dev}</b><small>${num}${date}</small></span>
        <span class="wp"><b>${price} د.ع</b><small>فزت بيه ✓</small></span></a>`;
    }).join("");
  }catch(e){
    console.warn("MY AUCTION WINS:", e);
    list.innerHTML = '<p class="empty">تعذر تحميل نتائج مزاداتك حالياً.</p>';
  }
}

/* ===== الحساب ===== */
async function loadProfile(){
  try{
    const { data, error } = await supabase.auth.getUser();
    if (error || !data?.user){ location.replace("index.html?login=1&returnTo=profile.html"); return; }
    const user = data.user, m = user.user_metadata || {};
    $("profileName").textContent = m.full_name || m.name || "مستخدم MZAD PHONE";
    $("infoPhone").textContent = m.phone || "غير مضاف";
    $("infoEmail").textContent = user.email || "غير مضاف";
    $("loading").classList.add("hidden");

    // باقي البيانات تتحمل بدون ما تأخر ظهور الصفحة
    loadWins();

    const code = await supabase.rpc("mzad_get_my_buyer_code");
    if (code.error || typeof code.data !== "string" || !code.data){
      console.error("Personal code error:", code.error);
      $("personalCode").textContent = "تعذر تحميل المعرّف";
      toast("تعذر تحميل المعرّف الخاص بك");
    }else{
      $("personalCode").textContent = code.data;
      $("copyPersonalCode").disabled = false;
    }

    const cnt = await supabase.from("devices").select("id", { count:"exact", head:true }).eq("seller_id", user.id);
    if (cnt.error) console.error("Listings count error:", cnt.error);
    else if (cnt.count){ $("listingsBadge").textContent = cnt.count; $("listingsBadge").style.display = ""; }
  }catch(e){
    console.error("Profile error:", e);
    toast("تعذر تحميل الحساب");
    setTimeout(() => $("loading").classList.add("hidden"), 500);
  }
}

/* ===== الأزرار ===== */
$("backBtn").onclick = () => {
  if (document.referrer && document.referrer.includes(location.host)) history.back();
  else location.href = "home.html";
};

$("copyPersonalCode").onclick = async () => {
  const code = $("personalCode").textContent.trim();
  if (!code || /^(تعذر|جاري)/.test(code)) return;
  try{
    await navigator.clipboard.writeText(code);
    toast("تم نسخ المعرّف");
  }catch{
    const f = document.createElement("textarea");
    f.value = code; f.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(f); f.select();
    const ok = document.execCommand("copy"); f.remove();
    toast(ok ? "تم نسخ المعرّف" : "المعرّف: " + code);
  }
};

document.addEventListener("click", e => {
  const b = e.target.closest(".mi");
  if (!b) return;
  if (b.dataset.go) location.href = b.dataset.go;
  else if (b.dataset.toast) toast(b.dataset.toast);
});

$("logoutBtn").onclick = async () => {
  const btn = $("logoutBtn");
  btn.disabled = true; btn.textContent = "جاري تسجيل الخروج...";
  try{
    const { error } = await supabase.auth.signOut();
    if (error){ btn.disabled = false; btn.textContent = "تسجيل الخروج"; toast("تعذر تسجيل الخروج"); return; }
    sessionStorage.removeItem("mzad_pending_action");
    location.replace("home.html");
  }catch(e){
    console.error(e);
    btn.disabled = false; btn.textContent = "تسجيل الخروج";
    toast("حدث خطأ أثناء تسجيل الخروج");
  }
};

loadProfile();
</script>
</body>
