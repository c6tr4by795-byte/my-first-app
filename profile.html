<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<meta name="theme-color" content="#F7F8FA">

<title>MZAD PHONE — حسابي</title>

<style>
:root{--bg:#FBFCFD;--surface:#FFF;--ink:#18212B;--muted:#737E88;--muted2:#9AA3AB;--line:#E8ECEF;--primary:#176B87;--primarySoft:#EAF6F8;--pink:#E91D4F;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;border:0;cursor:pointer;color:inherit}
.page{width:min(100%,520px);margin:auto;padding:0 14px calc(104px + var(--safe))}
.header{margin-inline:-14px;padding:15px 20px 17px;background:#fff;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.header::after{content:"";position:absolute;width:170px;height:170px;right:-105px;top:-95px;border-radius:50%;background:rgba(50,184,196,.07)}
.topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;min-height:46px}
.brand{display:flex;align-items:center;gap:8px;direction:ltr}
.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#176B87,#32B8C4);color:#fff;font-size:14px;font-weight:950}
.brand-copy{line-height:.95}.brand-copy strong{display:block;font-size:20px;font-weight:950;letter-spacing:-.055em}.brand-copy span{display:block;margin-top:5px;color:#89929A;font-size:8px;font-weight:950;letter-spacing:.25em}
.header-actions{display:flex;align-items:center;gap:8px}
.support-btn,.back-btn{height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.support-btn{padding:0 13px;gap:7px;background:#F0F3F4;font-size:11px;font-weight:900}.support-btn svg{width:18px;height:18px}
.back-btn{width:40px;background:#fff;border:1px solid var(--line);color:var(--primary)}.back-btn svg{width:19px;height:19px}
.account-hero{padding:20px 3px 4px}.hero-kicker{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--primarySoft);color:var(--primary);font-size:9px;font-weight:900}.hero-kicker i{width:6px;height:6px;border-radius:50%;background:#43B98A}.account-hero h1{margin:9px 0 0;font-size:28px;line-height:1.08;font-weight:950;letter-spacing:-.055em}.account-hero p{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.5;font-weight:650}
.profile-card{margin-top:14px;padding:15px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(23,32,42,.035)}
.user-head{display:flex;align-items:center;gap:11px}.avatar{width:45px;height:45px;flex:0 0 45px;border-radius:14px;display:grid;place-items:center;background:var(--primarySoft);color:var(--primary);font-size:17px;font-weight:950}.user-main{min-width:0;flex:1}.profile-name{margin:0;font-size:17px;line-height:1.25;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-email{display:block;margin:3px 0 0;color:var(--muted)!important;font-size:10px;line-height:1.4;font-weight:650;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none!important;border:0!important}.profile-status{display:inline-flex;align-items:center;gap:5px;margin-top:6px;color:var(--primary);font-size:9px;font-weight:850}.status-dot{width:6px;height:6px;border-radius:50%;background:#43B98A}
.profile-details{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.account-detail{padding:9px 10px;border-radius:13px;background:#F8FAFB;border:1px solid #EDF0F2}.detail-label{color:var(--muted2);font-size:8px;font-weight:800;margin-bottom:3px}.detail-value{color:var(--ink);font-size:10px;font-weight:900;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.stat{padding:9px 4px;text-align:center;border-radius:13px;background:#fff;border:1px solid var(--line)}.stat-number{font-size:15px;line-height:1;font-weight:950}.stat-label{margin-top:4px;color:var(--muted);font-size:8px;font-weight:800}
.section{margin-top:22px}.section-heading{margin:0 4px 9px;color:var(--muted);font-size:11px;font-weight:800}.menu-card{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 6px 18px rgba(23,32,42,.035)}
.menu-item{width:100%;min-height:67px;padding:10px 13px;display:flex;align-items:center;gap:11px;background:#fff;text-align:right;border-bottom:1px solid #F0F2F4;transition:.16s}.menu-item:last-child{border-bottom:0}.menu-item:active{background:#F8FAFB;transform:scale(.994)}
.menu-icon{width:37px;height:37px;flex:0 0 37px;border-radius:12px;display:grid;place-items:center;background:#F3F7F8;color:var(--primary);border:1px solid #E5EFF1}.menu-copy{min-width:0;flex:1}.menu-title{display:block;color:var(--ink);font-size:13px;line-height:1.3;font-weight:900}.menu-sub{display:block;margin-top:3px;color:var(--muted2);font-size:9px;line-height:1.35;font-weight:650}.menu-arrow{width:17px;height:17px;flex:0 0 17px;color:#A2AAB1}
.logout-btn{width:100%;height:49px;margin-top:13px;border-radius:15px;background:#fff;border:1px solid #F0DDE2;color:#C63C55;font-size:11px;font-weight:900}
.bottom-wrap{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + var(--safe));z-index:50;pointer-events:none}.bottom-nav{width:min(100%,520px);margin:0 auto;min-height:67px;padding:6px;border-radius:21px;background:rgba(255,255,255,.97);border:1px solid #E5EAED;box-shadow:0 12px 30px rgba(23,32,42,.10);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;pointer-events:auto}.nav-item{min-width:0;min-height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:15px;color:#7E8992;background:transparent;transition:.18s}.nav-item.active{color:var(--primary);background:var(--primarySoft)}.nav-label{font-size:9px;line-height:1;font-weight:900}.nav-icon{width:22px;height:22px}.action-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#176B87,#2A829A);box-shadow:0 7px 15px rgba(23,107,135,.18)}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe));transform:translate(-50%,12px);max-width:calc(100% - 40px);padding:10px 14px;border-radius:13px;background:#1E2C30;color:#fff;font-size:11px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:.22s;z-index:80}.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:.28s}.loading.hidden{opacity:0;visibility:hidden;pointer-events:none}.loader{width:30px;height:30px;border-radius:50%;border:3px solid #DCE7EA;border-top-color:var(--primary);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:360px){.page{padding-inline:12px}.header{margin-inline:-12px}.account-hero h1{font-size:25px}.menu-title{font-size:12px}}
</style>

</head>

<body>


<div class="loading" id="loading">
  <div class="loader"></div>
</div>


<main class="page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="topbar">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
      aria-label="رجوع">

      <svg
        width="21"
        height="21"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M15 18l-6-6 6-6"/>

      </svg>

    </button>


    <div class="brand">

      <strong>MZAD</strong>

      <span>PHONE</span>

    </div>


    <div class="header-spacer"></div>

  </div>


  <div class="page-intro">

    <h1>حسابي</h1>

    <p>
      إدارة حسابك ومتابعة نشاطك على MZAD PHONE
    </p>

  </div>

</header>


<!-- =====================================================
     USER PROFILE CARD
===================================================== -->

<section class="profile-card">


  <div class="user-head">

    <div class="user-main">

      <h2
        class="profile-name"
        id="profileName">

        جاري التحميل...

      </h2>


      <p
        class="profile-email"
        id="profileEmail">

        —

      </p>


      <div class="profile-status">

        <span class="status-dot"></span>

        حساب نشط

      </div>

    </div>


  </div>


  <!-- ACCOUNT DETAILS -->

  <div class="profile-details">


    <div class="account-detail">

      <div class="detail-label">
        رقم الهاتف
      </div>

      <div
        class="detail-value"
        id="infoPhone">

        —

      </div>

    </div>


    <div class="account-detail">

      <div class="detail-label">
        البريد الإلكتروني
      </div>

      <div
        class="detail-value"
        id="infoEmail">

        —

      </div>

    </div>


  </div>


  <!-- RATING -->

  <div class="rating-box">

    <div>

      <div
        class="rating-number"
        id="ratingNumber">

        0.0

      </div>

      <div class="rating-label">
        تقييم الحساب
      </div>

    </div>


    <div
      class="rating-count"
      id="ratingCount">

      لا توجد تقييمات بعد

    </div>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-icon">+</div>
      <div class="stat-number" id="listingsCount">0</div>
      <div class="stat-label">إعلاناتي</div>
    </div>

    <div class="stat">
      <div class="stat-icon">✓</div>
      <div class="stat-number" id="purchasesCount">0</div>
      <div class="stat-label">مشترياتي</div>
    </div>

  </div>


</section>


<!-- =====================================================
     ACCOUNT MANAGEMENT
===================================================== -->

<section class="section">


  <div class="section-title-row">

    <span class="section-accent"></span>

    <h2 class="section-title">
      إدارة الحساب
    </h2>

  </div>


  <div class="menu-card">


    <!-- MY LISTINGS -->

    <button
      class="menu-item"
      id="myListingsBtn"
      type="button">

      <span class="menu-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8">

          <rect
            x="4"
            y="4"
            width="16"
            height="16"
            rx="2"/>

          <path d="M8 9h8"/>
          <path d="M8 13h8"/>
          <path d="M8 17h5"/>

        </svg>

      </span>


      <span class="menu-copy">

        <span class="menu-title">
          أجهزتي المعروضة
        </span>

        <span class="menu-sub">
          عرض وإدارة الأجهزة التي أضفتها للبيع
        </span>

      </span>


      <svg
        class="menu-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M9 18l6-6-6-6"/>

      </svg>

    </button>


    <!-- AUCTIONS -->

    <button
      class="menu-item"
      id="myAuctionsBtn"
      type="button">

      <span class="menu-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8">

          <path d="m7 11 7.5-7.5 3 3L10 14"/>
          <path d="m5 13 6 6"/>
          <path d="M4 20h16"/>

        </svg>

      </span>


      <span class="menu-copy">

        <span class="menu-title">
          مزاداتي
        </span>

        <span class="menu-sub">
          إدارة الأجهزة التي تعرضها بالمزاد
        </span>

      </span>


      <svg
        class="menu-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M9 18l6-6-6-6"/>

      </svg>

    </button>


    <!-- PURCHASES -->

    <button
      class="menu-item"
      id="purchasesBtn"
      type="button">

      <span class="menu-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8">

          <path d="M6 7h12l1 13H5L6 7Z"/>
          <path d="M9 7a3 3 0 0 1 6 0"/>

        </svg>

      </span>


      <span class="menu-copy">

        <span class="menu-title">
          مشترياتي
        </span>

        <span class="menu-sub">
          الأجهزة التي اشتريتها من المنصة
        </span>

      </span>


      <svg
        class="menu-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M9 18l6-6-6-6"/>

      </svg>

    </button>


  </div>

</section>


<!-- =====================================================
     LOGOUT
===================================================== -->

<button
  class="logout-btn"
  id="logoutBtn"
  type="button">

  تسجيل الخروج

</button>


</main>


<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<div class="bottom-wrap">

<nav class="bottom-nav">

<button
class="nav-item"
data-go="home.html"
type="button">

<svg
class="nav-icon"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8">

<path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-9Z"/>

</svg>

<span class="nav-label">
الرئيسية
</span>

</button>


<button
class="nav-item"
data-go="market.html"
type="button">

<svg
class="nav-icon"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8">

<path d="M4 9h16"/>
<path d="M6 9v10h12V9"/>
<path d="M5 9 7 5h10l2 4"/>
<path d="M9 13h6"/>

</svg>

<span class="nav-label">
السوق
</span>

</button>


<button
class="nav-item"
data-go="sell.html"
type="button">

<span class="action-icon">

<svg
width="22"
height="22"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M12 5v14"/>
<path d="M5 12h14"/>

</svg>

</span>

<span class="nav-label">
إضافة
</span>

</button>


<button
class="nav-item"
data-go="favorites.html"
type="button">

<svg
class="nav-icon"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8">

<path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/>

</svg>

<span class="nav-label">
المفضلة
</span>

</button>


<button
class="nav-item active"
type="button">

<svg
class="nav-icon"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8">

<circle
cx="12"
cy="8"
r="3.5"/>

<path d="M5 21a7 7 0 0 1 14 0"/>

</svg>

<span class="nav-label">
حسابي
</span>

</button>

</nav>

</div>

<div
  class="toast"
  id="toast">
</div>


<script type="module">

import { supabase }
  from "./js/supabase.js";


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById("loading");

const profileName =
  document.getElementById("profileName");

const profileEmail =
  document.getElementById("profileEmail");

const infoPhone =
  document.getElementById("infoPhone");

const infoEmail =
  document.getElementById("infoEmail");

const ratingNumber =
  document.getElementById("ratingNumber");

const ratingCount =
  document.getElementById("ratingCount");

const purchasesCount =
  document.getElementById("purchasesCount");

const listingsCount =
  document.getElementById("listingsCount");

const toast =
  document.getElementById("toast");

const backBtn =
  document.getElementById("backBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const myListingsBtn =
  document.getElementById("myListingsBtn");

const myAuctionsBtn =
  document.getElementById("myAuctionsBtn");

const purchasesBtn =
  document.getElementById("purchasesBtn");


let toastTimer;


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

  try{

    const {
      data,
      error
    } =
      await supabase.auth.getUser();


    if(
      error ||
      !data?.user
    ){

      window.location.replace(
        "index.html?login=1&returnTo=profile.html"
      );

      return;

    }


    const user =
      data.user;

    const metadata =
      user.user_metadata || {};


    const fullName =
      metadata.full_name ||
      metadata.name ||
      "مستخدم MZAD PHONE";


    const phone =
      metadata.phone ||
      "غير مضاف";


    const email =
      user.email ||
      "غير مضاف";


    /* USER */

    profileName.textContent =
      fullName;

    profileEmail.textContent =
      email;

    infoPhone.textContent =
      phone;

    infoEmail.textContent =
      email;


    /* LISTINGS COUNT */

    const {
      count: listingsTotal,
      error: listingsError
    } =
      await supabase
        .from("devices")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .eq(
          "seller_id",
          user.id
        );


    if(
      listingsError
    ){

      console.error(
        "Listings count error:",
        listingsError
      );

    }


    /* CURRENT STATS */

    ratingNumber.textContent =
      "0.0";

    ratingCount.textContent =
      "لا توجد تقييمات بعد";

    purchasesCount.textContent =
      "0";

    listingsCount.textContent =
      String(
        listingsTotal ?? 0
      );


    loading.classList.add(
      "hidden"
    );


  }catch(error){

    console.error(
      "Profile error:",
      error
    );

    showToast(
      "تعذر تحميل الحساب"
    );

    setTimeout(
      () => {

        loading.classList.add(
          "hidden"
        );

      },
      500
    );

  }

}


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if(
      document.referrer &&
      document.referrer.includes(
        window.location.host
      )
    ){

      window.history.back();

    }else{

      window.location.href =
        "home.html";

    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
  "click",
  async () => {

    logoutBtn.disabled =
      true;

    logoutBtn.textContent =
      "جاري تسجيل الخروج...";


    try{

      const {
        error
      } =
        await supabase.auth.signOut();


      if(error){

        logoutBtn.disabled =
          false;

        logoutBtn.textContent =
          "تسجيل الخروج";

        showToast(
          "تعذر تسجيل الخروج"
        );

        return;

      }


      sessionStorage.removeItem(
        "mzad_pending_action"
      );


      window.location.replace(
        "home.html"
      );


    }catch(error){

      console.error(
        error
      );

      logoutBtn.disabled =
        false;

      logoutBtn.textContent =
        "تسجيل الخروج";

      showToast(
        "حدث خطأ أثناء تسجيل الخروج"
      );

    }

  }
);


/* =====================================================
   MY LISTINGS
===================================================== */

myListingsBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      "my-listings.html";

  }
);


/* =====================================================
   MY AUCTIONS
===================================================== */

myAuctionsBtn.addEventListener(
  "click",
  () => {

    showToast(
      "قسم مزاداتك راح يتفعل مع نظام المزادات"
    );

  }
);


/* =====================================================
   PURCHASES
===================================================== */

purchasesBtn.addEventListener(
  "click",
  () => {

    showToast(
      "سجل المشتريات راح يتفعل مع نظام الشراء"
    );

  }
);


/* =====================================================
   BOTTOM NAV
===================================================== */

document
  .querySelectorAll("[data-go]")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const url =
            button.dataset.go;

          if(!url){
            return;
          }

          window.location.href =
            url;

        }
      );

    }
  );


/* =====================================================
   START
===================================================== */

loadProfile();

</script>

</body>
</html>
