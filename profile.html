<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>MZAD PHONE — حسابي</title>

<style>
:root{
--bg:#f7f8fa;
--surface:#fff;
--surface-2:#eef3f7;
--ink:#17202a;
--muted:#667085;
--line:#e6e9ed;
--primary:#176b87;
--primary-dark:#125a73;
--primary-soft:#e8f3f6;
--purple:#6246d9;
--purple-soft:#e5e0ff;
--success:#159a72;
--danger:#c63c55;
--safe-bottom:env(safe-area-inset-bottom,0px);
--shadow:0 14px 34px rgba(24,44,49,.08)
}

*{
box-sizing:border-box
}

html{
scroll-behavior:smooth
}

body{
margin:0;
min-height:100vh;
background:var(--bg);
color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
-webkit-font-smoothing:antialiased
}

button{
font:inherit;
border:0;
cursor:pointer
}

.page{
width:min(100%,520px);
margin:0 auto;
padding:0 14px calc(102px + var(--safe-bottom))
}


/* =========================
   HEADER
========================= */

.header{
margin-inline:-14px;
padding:14px 14px 18px;
background:
linear-gradient(
145deg,
#fff 0%,
#f5f2ff 45%,
#e6e1ff 100%
);
border-radius:0 0 26px 26px;
border-bottom:1px solid var(--line);
box-shadow:0 10px 26px rgba(23,32,42,.06)
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px
}

.back-btn{
width:42px;
height:38px;
border-radius:13px;
background:#fff;
border:1px solid #ddd8f8;
color:var(--primary);
display:grid;
place-items:center;
box-shadow:0 7px 18px rgba(23,32,42,.05)
}

.brand{
display:flex;
flex-direction:column;
align-items:center;
line-height:.9;
flex:1
}

.brand strong{
font-size:20px;
letter-spacing:-.04em
}

.brand span{
font-size:8px;
font-weight:900;
letter-spacing:.18em;
color:#89939e;
margin-top:4px
}

.header-spacer{
width:42px
}


/* =========================
   PROFILE HERO
========================= */

.profile-hero{
margin-top:18px;
padding:20px 17px;
border-radius:22px;
background:
linear-gradient(
145deg,
#243b80 0%,
#4d43a8 56%,
#6246d9 100%
);
color:#fff;
position:relative;
overflow:hidden;
box-shadow:0 17px 34px rgba(76,67,168,.18)
}

.profile-hero:before{
content:"";
position:absolute;
width:190px;
height:190px;
border-radius:50%;
background:rgba(255,255,255,.06);
top:-105px;
left:-65px
}

.profile-hero:after{
content:"";
position:absolute;
width:150px;
height:150px;
border-radius:50%;
background:rgba(255,255,255,.055);
bottom:-100px;
right:-55px
}

.profile-content{
position:relative;
z-index:2;
display:flex;
align-items:center;
gap:14px
}

.avatar{
width:68px;
height:68px;
flex:0 0 68px;
border-radius:22px;
background:rgba(255,255,255,.14);
border:1px solid rgba(255,255,255,.20);
display:grid;
place-items:center;
font-size:25px;
font-weight:950;
box-shadow:0 10px 24px rgba(0,0,0,.10)
}

.profile-info{
min-width:0
}

.profile-name{
margin:0;
font-size:20px;
font-weight:950;
letter-spacing:-.03em;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.profile-email{
margin:5px 0 0;
font-size:11px;
color:rgba(255,255,255,.76);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.profile-status{
display:inline-flex;
align-items:center;
gap:6px;
margin-top:9px;
padding:5px 8px;
border-radius:999px;
background:rgba(255,255,255,.11);
border:1px solid rgba(255,255,255,.12);
font-size:9px;
font-weight:850
}

.status-dot{
width:6px;
height:6px;
border-radius:50%;
background:#65dfb6;
box-shadow:0 0 0 4px rgba(101,223,182,.10)
}


/* =========================
   SECTION
========================= */

.section{
margin-top:20px
}

.section-title{
font-size:18px;
font-weight:950;
letter-spacing:-.03em;
margin:0 2px 11px
}


/* =========================
   ACCOUNT INFO
========================= */

.info-card{
background:#fff;
border:1px solid var(--line);
border-radius:19px;
overflow:hidden;
box-shadow:0 9px 22px rgba(23,32,42,.045)
}

.info-row{
min-height:64px;
display:flex;
align-items:center;
gap:12px;
padding:10px 13px;
border-bottom:1px solid #f0f1f3
}

.info-row:last-child{
border-bottom:0
}

.info-icon{
width:38px;
height:38px;
flex:0 0 38px;
border-radius:12px;
display:grid;
place-items:center;
background:var(--primary-soft);
color:var(--primary)
}

.info-copy{
min-width:0;
flex:1
}

.info-label{
font-size:9px;
font-weight:750;
color:var(--muted);
margin-bottom:3px
}

.info-value{
font-size:12px;
font-weight:900;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}


/* =========================
   QUICK ACTIONS
========================= */

.actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.action{
min-height:102px;
padding:13px;
border-radius:18px;
border:1px solid #ddd8f8;
background:
linear-gradient(
145deg,
#fff 0%,
#f4f1ff 50%,
#e8e3ff 100%
);
display:flex;
flex-direction:column;
justify-content:space-between;
text-align:right;
box-shadow:0 10px 24px rgba(98,70,217,.08);
transition:.18s ease
}

.action:active{
transform:scale(.975)
}

.action-icon{
width:37px;
height:37px;
border-radius:12px;
display:grid;
place-items:center;
background:#e8f3f6;
color:var(--primary)
}

.action-title{
font-size:13px;
font-weight:950
}

.action-copy{
font-size:9px;
color:var(--muted);
margin-top:2px
}


/* =========================
   EMPTY LIST
========================= */

.empty-card{
padding:23px 16px;
border-radius:19px;
background:#fff;
border:1px solid var(--line);
text-align:center;
box-shadow:0 9px 22px rgba(23,32,42,.045)
}

.empty-icon{
width:52px;
height:52px;
margin:0 auto 10px;
border-radius:16px;
display:grid;
place-items:center;
background:var(--purple-soft);
color:var(--purple)
}

.empty-title{
margin:0;
font-size:14px;
font-weight:950
}

.empty-copy{
margin:6px auto 0;
max-width:270px;
font-size:10px;
line-height:1.7;
color:var(--muted)
}


/* =========================
   LOGOUT
========================= */

.logout-btn{
width:100%;
height:49px;
margin-top:20px;
border-radius:15px;
background:#fff;
border:1px solid #f0cdd4;
color:var(--danger);
font-size:12px;
font-weight:950;
box-shadow:0 8px 20px rgba(198,60,85,.05)
}

.logout-btn:active{
transform:scale(.985)
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-wrap{
position:fixed;
left:0;
right:0;
bottom:0;
padding:8px 12px calc(8px + var(--safe-bottom));
z-index:50;
pointer-events:none
}

.bottom-nav{
width:min(100%,520px);
margin:0 auto;
min-height:67px;
padding:6px;
border-radius:22px;
background:
linear-gradient(
180deg,
rgba(255,255,255,.97),
rgba(232,243,246,.97)
);
border:1px solid rgba(23,107,135,.12);
box-shadow:0 16px 36px rgba(23,107,135,.16);
backdrop-filter:blur(16px);
display:grid;
grid-template-columns:repeat(5,1fr);
gap:4px;
pointer-events:auto
}

.nav-item{
min-height:55px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
border-radius:16px;
color:#7b8794;
transition:.2s ease;
background:none
}

.nav-item.active{
color:var(--primary-dark);
background:linear-gradient(
145deg,
#e8f3f6,
#dceef2
)
}

.nav-label{
font-size:9px;
font-weight:900
}

.nav-icon{
width:22px;
height:22px
}


/* =========================
   TOAST
========================= */

.toast{
position:fixed;
left:50%;
bottom:94px;
transform:translateX(-50%) translateY(16px);
max-width:calc(100% - 40px);
padding:10px 14px;
border-radius:13px;
background:#1e2c30;
color:#fff;
font-size:11px;
font-weight:800;
box-shadow:var(--shadow);
opacity:0;
pointer-events:none;
transition:.25s ease;
z-index:80;
text-align:center
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0)
}


/* =========================
   LOADING
========================= */

.loading{
position:fixed;
inset:0;
background:var(--bg);
z-index:100;
display:flex;
align-items:center;
justify-content:center;
transition:.3s ease
}

.loading.hidden{
opacity:0;
visibility:hidden;
pointer-events:none
}

.loader{
width:34px;
height:34px;
border:3px solid #dbe8eb;
border-top-color:var(--primary);
border-radius:50%;
animation:spin .8s linear infinite
}

@keyframes spin{
to{
transform:rotate(360deg)
}
}
</style>
</head>

<script type="module">

import { supabase } from "./js/supabase.js";


/* =========================
   ELEMENTS
========================= */

const loading =
document.getElementById("loading");

const profileName =
document.getElementById("profileName");

const profileEmail =
document.getElementById("profileEmail");

const avatar =
document.getElementById("avatar");

const infoName =
document.getElementById("infoName");

const infoEmail =
document.getElementById("infoEmail");

const infoPhone =
document.getElementById("infoPhone");

const toast =
document.getElementById("toast");

const backBtn =
document.getElementById("backBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const myListingsBtn =
document.getElementById("myListingsBtn");

const myAuctionsBtn =
document.getElementById("myAuctionsBtn");


let toastTimer;


/* =========================
   TOAST
========================= */

function showToast(message){

toast.textContent = message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer =
setTimeout(()=>{

toast.classList.remove("show");

},2200);

}


/* =========================
   GET INITIALS
========================= */

function getInitials(name){

if(!name){

return "م";

}

const words =
name.trim().split(/\s+/);

if(words.length === 1){

return words[0]
.substring(0,2)
.toUpperCase();

}

return (
words[0].charAt(0) +
words[1].charAt(0)
).toUpperCase();

}


/* =========================
   LOAD USER
========================= */

async function loadProfile(){

try{

const {
data,
error
} = await supabase.auth.getUser();


if(error){

console.error(
"Supabase user error:",
error
);

window.location.replace(
"index.html?login=1&returnTo=profile.html"
);

return;

}


const user =
data?.user;


if(!user){

window.location.replace(
"index.html?login=1&returnTo=profile.html"
);

return;

}


/*
  بيانات التسجيل الحالية عندنا:
  full_name
  phone
  email
*/

const metadata =
user.user_metadata || {};


const fullName =
metadata.full_name ||
metadata.name ||
"مستخدم MZAD PHONE";


const phone =
metadata.phone ||
"غير مضاف";


const email =
user.email ||
"غير مضاف";


profileName.textContent =
fullName;

profileEmail.textContent =
email;

infoName.textContent =
fullName;

infoEmail.textContent =
email;

infoPhone.textContent =
phone;

avatar.textContent =
getInitials(fullName);


loading.classList.add("hidden");


}catch(error){

console.error(
"Profile loading error:",
error
);

showToast(
"تعذر تحميل بيانات الحساب"
);

setTimeout(()=>{

loading.classList.add("hidden");

},500);

}

}


/* =========================
   BACK
========================= */

backBtn.addEventListener(
"click",
()=>{

if(
document.referrer &&
document.referrer.includes(
window.location.host
)
){

window.history.back();

}else{

window.location.href =
"home.html";

}

});


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
"click",
async ()=>{

logoutBtn.disabled = true;

logoutBtn.textContent =
"جاري تسجيل الخروج...";


try{

const {
error
} =
await supabase.auth.signOut();


if(error){

console.error(
"Logout error:",
error
);

logoutBtn.disabled = false;

logoutBtn.textContent =
"تسجيل الخروج";

showToast(
"تعذر تسجيل الخروج"
);

return;

}


/*
  تنظيف أي عملية معلقة
*/

sessionStorage.removeItem(
"mzad_pending_action"
);


window.location.replace(
"home.html"
);


}catch(error){

console.error(error);

logoutBtn.disabled = false;

logoutBtn.textContent =
"تسجيل الخروج";

showToast(
"حدث خطأ أثناء تسجيل الخروج"
);

}

});


/* =========================
   MY LISTINGS
========================= */

myListingsBtn.addEventListener(
"click",
()=>{

/*
  الصفحة راح نسويها لاحقاً
  لما نبدأ نظام البيع والإعلانات.
*/

showToast(
"قسم أجهزتك راح يتفعل بعد ربط الإعلانات"
);

});


/* =========================
   MY AUCTIONS
========================= */

myAuctionsBtn.addEventListener(
"click",
()=>{

/*
  الصفحة راح نسويها لاحقاً
  مع نظام المزادات الحقيقي.
*/

showToast(
"قسم مزاداتك راح يتفعل مع نظام المزادات"
);

});


/* =========================
   BOTTOM NAV
========================= */

document
.querySelectorAll("[data-go]")
.forEach(button=>{
