/* UNIFIED MZAD PHONE BOTTOM NAV */
.bottom-wrap,.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
}
.bottom-wrap{
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.bottom-nav{
  width:min(100%,520px);
  margin:0 auto;
  min-height:64px;
  padding:5px;
  border-radius:20px;
  background:rgba(255,255,255,.97);
  border:1px solid #E7ECEF;
  box-shadow:0 10px 28px rgba(23,32,42,.10);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  pointer-events:auto;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:3px;
}
.bottom-nav .nav-inner,.bottom-nav .bottom-inner{
  width:100%;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:3px;
  align-items:center;
  grid-column:1/-1;
}
.bottom-nav .nav-item{
  min-width:0;
  min-height:52px;
  padding:4px 2px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  border:0;
  border-radius:15px;
  background:transparent;
  color:#7E8992;
  text-decoration:none;
  transition:transform .16s ease,background .16s ease,color .16s ease;
}
.bottom-nav .nav-item:active{transform:scale(.96)}
.bottom-nav .nav-item.active{
  color:#176B87;background:#EAF6F8;
}
.bottom-nav .nav-item svg,
.bottom-nav .nav-icon{
  width:20px;
  height:20px;
  flex:0 0 20px;
  color:currentColor;
}
.bottom-nav .nav-label,
.bottom-nav .nav-item>span:not(.action-icon):not(.add-button){
  margin:0;
  font-size:8.5px;
  line-height:1;
  font-weight:900;
  white-space:nowrap;
}
.bottom-nav .action-icon,
.bottom-nav .add-button{
  width:38px!important;
  height:38px!important;
  flex:0 0 38px;
  border-radius:13px!important;
  display:grid!important;
  place-items:center;
  background:linear-gradient(145deg,#176B87,#32B8C4)!important;color:#fff!important;box-shadow:0 6px 14px rgba(23,107,135,.18);
}
.bottom-nav .action-icon svg,.bottom-nav .add-button svg{
  width:20px!important;
  height:20px!important;
}
@media(max-width:360px){
  .bottom-wrap{padding-inline:8px}
  .bottom-nav{border-radius:18px}
  .bottom-nav .nav-item{min-height:50px;border-radius:14px}
  .bottom-nav .nav-item svg,.bottom-nav .nav-icon{width:19px;height:19px;flex-basis:19px}
  .bottom-nav .nav-label,.bottom-nav .nav-item>span:not(.action-icon):not(.add-button){font-size:8px}
}

  text-align:right!important;
}
.profile-card .profile-name{
  margin:0!important;
  font-size:24px!important;
  line-height:1.2!important;
  font-weight:950!important;
  letter-spacing:-.04em!important;
}
.profile-card .profile-email{
  margin:6px 0 0!important;
  font-size:11px!important;
  color:#737E88!important;
  text-decoration:none!important;
  border:0!important;
  direction:ltr!important;
  text-align:right!important;
}
.profile-card .profile-status{
  margin-top:7px!important;
  font-size:9px!important;
}
.profile-card .profile-details{
  margin-top:14px!important;
  grid-template-columns:minmax(0,1fr)!important;
}
.profile-card .account-detail{
  min-height:62px!important;
}

  .profile-card .user-head{min-height:68px!important}
  .profile-card .profile-name{font-size:21px!important}

</style>

</head>

<body>


<div class="loading" id="loading">
  <div class="loader"></div>
</div>


<main class="page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="topbar">

    <button
      class="back-btn"

      type="button"
      aria-label="رجوع">

      <svg
        width="21"
        height="21"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M15 18l-6-6 6-6"/>

      </svg>

    </button>


    <div class="brand">

      <strong>MZAD</strong>

      <span>PHONE</span>

    </div>


    <div class="header-spacer"></div>

  </div>


</header>

<div class="profile-page-intro">

  <h1>حسابي</h1>

  <p>إدارة حسابك ومتابعة نشاطك على MZAD PHONE</p>

</div>


<!-- =====================================================
     USER PROFILE CARD
===================================================== -->

<section class="profile-card">


  <div class="user-head">

    <div class="user-main">

      <h2
        class="profile-name"
        id="profileName">

        جاري التحميل...

      </h2>


      <p
        class="profile-email"
        id="profileEmail">

        —

      </p>


      <div class="profile-status">

        <span class="status-dot"></span>

        حساب نشط

      </div>

    </div>


  </div>


  <!-- ACCOUNT DETAILS -->

  <div class="profile-details">


    <div class="account-detail">

      <div class="detail-label">
        رقم الهاتف
      </div>

      <div
        class="detail-value"
        id="infoPhone">

        —

      </div>

    </div>
</div>


  <!-- RATING -->

  <div class="rating-box">

    <div>

      <div
        class="rating-number"
        id="ratingNumber">

        0.0

      </div>

      <div class="rating-label">
        تقييم الحساب
      </div>

    </div>


    <div
      class="rating-count"
      id="ratingCount">

      لا توجد تقييمات بعد

    </div>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-icon">+</div>
      <div class="stat-number" id="listingsCount">0</div>
      <div class="stat-label">إعلاناتي</div>
    </div>

    <div class="stat">
      <div class="stat-icon">✓</div>
      <div class="stat-number" id="purchasesCount">0</div>
      <div class="stat-label">مشترياتي</div>
    </div>

  </div>


</section>


<!-- =====================================================
     ACCOUNT MANAGEMENT
===================================================== -->

<section class="section">


  <div class="section-title-row">

    <span class="section-accent"></span>

    <h2 class="section-title">
      إدارة الحساب
    </h2>

  </div>


  <div class="menu-card">


    <!-- MY LISTINGS -->

    <button
      class="menu-item"
      id="myListingsBtn"
      type="button">

      <span class="menu-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8">

          <rect
            x="4"
            y="4"
            width="16"
            height="16"
            rx="2"/>

          <path d="M8 9h8"/>
          <path d="M8 13h8"/>
          <path d="M8 17h5"/>

        </svg>

      </span>


      <span class="menu-copy">

        <span class="menu-title">
          أجهزتي المعروضة
        </span>

        <span class="menu-sub">
          عرض وإدارة الأجهزة التي أضفتها للبيع
        </span>

      </span>


      <svg
        class="menu-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M9 18l6-6-6-6"/>

      </svg>

    </button>


    <!-- AUCTIONS -->

    <button
      class="menu-item"
      id="myAuctionsBtn"
      type="button">

      <span class="menu-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8">

          <path d="m7 11 7.5-7.5 3 3L10 14"/>
          <path d="m5 13 6 6"/>
          <path d="M4 20h16"/>

        </svg>

      </span>


      <span class="menu-copy">

        <span class="menu-title">
          مزاداتي
        </span>

        <span class="menu-sub">
          إدارة الأجهزة التي تعرضها بالمزاد
        </span>

      </span>


      <svg
        class="menu-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M9 18l6-6-6-6"/>

      </svg>

    </button>


    <!-- PURCHASES -->

    <button
      class="menu-item"
      id="purchasesBtn"
      type="button">

      <span class="menu-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8">

          <path d="M6 7h12l1 13H5L6 7Z"/>
          <path d="M9 7a3 3 0 0 1 6 0"/>

        </svg>

      </span>


      <span class="menu-copy">

        <span class="menu-title">
          مشترياتي
        </span>

        <span class="menu-sub">
          الأجهزة التي اشتريتها من المنصة
        </span>

      </span>


      <svg
        class="menu-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M9 18l6-6-6-6"/>

      </svg>

    </button>


  </div>

</section>


<!-- =====================================================
     LOGOUT
===================================================== -->

<button
  class="logout-btn"
  id="logoutBtn"
  type="button">

  تسجيل الخروج

</button>


</main>


<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<div class="bottom-wrap">

<nav class="bottom-nav">

<div class="bottom-inner">

<a class="nav-item" href="home.html">
<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
<path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/>
</svg>
<span>الرئيسية</span>
</a>

<a class="nav-item" href="market.html">
<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">

</svg>
<span>الأجهزة</span>
</a>

<a class="nav-item" href="sell.html">
<span class="add-button">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M12 5v14"/><path d="M5 12h14"/>
</svg>
</span>
<span>إضافة</span>
</a>

<a class="nav-item" href="favorites.html">
<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
<path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/>
</svg>
<span>المفضلة</span>
</a>

<a class="nav-item active" href="profile.html">
<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
<circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.4 3.1-5 7-5s6.2 1.6 7 5"/>
</svg>
<span>حسابي</span>
</a>

</div>
</nav>

</div>

<div
  class="toast"
  id="toast">
</div>


<script type="module">

import { supabase }
  from "./js/supabase.js";


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById("loading");

const profileName =
  document.getElementById("profileName");

const profileEmail =
  document.getElementById("profileEmail");

const infoPhone =
  document.getElementById("infoPhone");

const infoEmail =
  document.getElementById("infoEmail");

const ratingNumber =
  document.getElementById("ratingNumber");

const ratingCount =
  document.getElementById("ratingCount");

const purchasesCount =
  document.getElementById("purchasesCount");

const listingsCount =
  document.getElementById("listingsCount");

const toast =
  document.getElementById("toast");

const backBtn =
  document.getElementById("backBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const myListingsBtn =
  document.getElementById("myListingsBtn");

const myAuctionsBtn =
  document.getElementById("myAuctionsBtn");

const purchasesBtn =
  document.getElementById("purchasesBtn");


let toastTimer;


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

  try{

    const {
      data,
      error
    } =
      await supabase.auth.getUser();


    if(
      error ||
      !data?.user
    ){

      window.location.replace(
        "index.html?login=1&returnTo=profile.html"
      );

      return;

    }


    const user =
      data.user;

    const metadata =
      user.user_metadata || {};


    const fullName =
      metadata.full_name ||
      metadata.name ||
      "مستخدم MZAD PHONE";


    const phone =
      metadata.phone ||
      "غير مضاف";


    const email =
      user.email ||
      "غير مضاف";


    /* USER */

    profileName.textContent =
      fullName;

    profileEmail.textContent =
      email;

    infoPhone.textContent =
      phone;

    infoEmail.textContent =
      email;


    /* LISTINGS COUNT */

    const {
      count: listingsTotal,
      error: listingsError
    } =
      await supabase
        .from("devices")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .eq(
          "seller_id",
          user.id
        );


    if(
      listingsError
    ){

      console.error(
        "Listings count error:",
        listingsError
      );

    }


    /* CURRENT STATS */

    ratingNumber.textContent =
      "0.0";

    ratingCount.textContent =
      "لا توجد تقييمات بعد";

    purchasesCount.textContent =
      "0";

    listingsCount.textContent =
      String(
        listingsTotal ?? 0
      );


    loading.classList.add(
      "hidden"
    );


  }catch(error){

    console.error(
      "Profile error:",
      error
    );

    showToast(
      "تعذر تحميل الحساب"
    );

    setTimeout(
      () => {

        loading.classList.add(
          "hidden"
        );

      },
      500
    );

  }

}


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if(
      document.referrer &&
      document.referrer.includes(
        window.location.host
      )
    ){

      window.history.back();

    }else{

      window.location.href =
        "home.html";

    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
  "click",
  async () => {

    logoutBtn.disabled =
      true;

    logoutBtn.textContent =
      "جاري تسجيل الخروج...";


    try{

      const {
        error
      } =
        await supabase.auth.signOut();


      if(error){

        logoutBtn.disabled =
          false;

        logoutBtn.textContent =
          "تسجيل الخروج";

        showToast(
          "تعذر تسجيل الخروج"
        );

        return;

      }


      sessionStorage.removeItem(
        "mzad_pending_action"
      );


      window.location.replace(
        "home.html"
      );


    }catch(error){

      console.error(
        error
      );

      logoutBtn.disabled =
        false;

      logoutBtn.textContent =
        "تسجيل الخروج";

      showToast(
        "حدث خطأ أثناء تسجيل الخروج"
      );

    }

  }
);


/* =====================================================
   MY LISTINGS
===================================================== */

myListingsBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      "my-listings.html";

  }
);


/* =====================================================
   MY AUCTIONS
===================================================== */

myAuctionsBtn.addEventListener(
  "click",
  () => {

    showToast(
      "قسم مزاداتك راح يتفعل مع نظام المزادات"
    );

  }
);


/* =====================================================
   PURCHASES
===================================================== */

purchasesBtn.addEventListener(
  "click",
  () => {

    showToast(
      "سجل المشتريات راح يتفعل مع نظام الشراء"
    );

  }
);


/* =====================================================
   BOTTOM NAV
===================================================== */

document
  .querySelectorAll("[data-go]")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const url =
            button.dataset.go;

          if(!url){
            return;
          }

          window.location.href =
            url;

        }
      );

    }
  );


/* =====================================================
   CALM ACCOUNT LAYOUT
===================================================== */

const accountMain = document.querySelector(".page");
const oldSection = document.querySelector(".section");

if(accountMain && oldSection){

  const profileCard = document.querySelector(".profile-card");
  const ratingBox = document.querySelector(".rating-box");
  const oldStats = document.querySelector(".stats");

  if(ratingBox){
    ratingBox.style.display = "none";
  }

  if(oldStats){
    oldStats.style.display = "none";
  }

  const firstHeading = oldSection.querySelector(".section-title-row");
  if(firstHeading){
    firstHeading.innerHTML =
      '<h2 class="section-heading">إدارة حسابك</h2>';
  }

  const supportSection = document.createElement("section");
  supportSection.className = "section";
  supportSection.innerHTML = `
    <h2 class="section-heading">المساعدة والدعم</h2>
    <div class="menu-card">
      <button class="menu-item calm-support" type="button">
        <span class="menu-icon">?</span>
        <span class="menu-copy">
          <span class="menu-title">مركز المساعدة</span>
          <span class="menu-sub">إجابات سريعة على الأسئلة الشائعة</span>
        </span>
        <span class="menu-arrow">‹</span>
      </button>
      <button class="menu-item calm-contact" type="button">
        <span class="menu-icon">i</span>
        <span class="menu-copy">
          <span class="menu-title">تواصل معنا</span>
          <span class="menu-sub">نحن موجودين لمساعدتك</span>
        </span>
        <span class="menu-arrow">‹</span>
      </button>
      <button class="menu-item calm-terms" type="button">
        <span class="menu-icon">✓</span>
        <span class="menu-copy">
          <span class="menu-title">الشروط والأحكام</span>
          <span class="menu-sub">قواعد استخدام منصة مزاد فون</span>
        </span>
        <span class="menu-arrow">‹</span>
      </button>
      <button class="menu-item calm-about" type="button">
        <span class="menu-icon">i</span>
        <span class="menu-copy">
          <span class="menu-title">من نحن</span>
          <span class="menu-sub">تعرف أكثر على MZAD PHONE</span>
        </span>
        <span class="menu-arrow">‹</span>
      </button>
    </div>
  `;

  oldSection.insertAdjacentElement("afterend", supportSection);

  const logout = document.getElementById("logoutBtn");
  if(logout){
    supportSection.insertAdjacentElement("afterend", logout);
  }

  document.querySelectorAll(".calm-support,.calm-contact,.calm-terms,.calm-about")
    .forEach(button => {
      button.addEventListener("click", () => {
        showToast("هذا القسم راح يتفعل قريباً.");
      });
    });
}

/* =====================================================
   START
===================================================== */

loadProfile();

</script>

</body>
</html>
