<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>MZAD PHONE — حسابي</title>

<style>
:root{
--bg:#f7f8fa;
--surface:#fff;
--ink:#17202a;
--muted:#667085;
--line:#e6e9ed;

--primary:#176b87;
--primary-dark:#125a73;
--primary-soft:#e8f3f6;

--purple:#6f63c9;
--purple-light:#8d83dc;
--purple-soft:#eeeaff;

--danger:#c63c55;
--safe-bottom:env(safe-area-inset-bottom,0px);
--shadow:0 14px 34px rgba(24,44,49,.08)
}

*{
box-sizing:border-box
}

html{
scroll-behavior:smooth
}

body{
margin:0;
min-height:100vh;
background:var(--bg);
color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
-webkit-font-smoothing:antialiased
}

button{
font:inherit;
border:0;
cursor:pointer
}

.page{
width:min(100%,520px);
margin:0 auto;
padding:0 14px calc(102px + var(--safe-bottom))
}


/* =========================
   HEADER
========================= */

.header{
margin-inline:-14px;
padding:14px 14px 18px;

background:
linear-gradient(
145deg,
#ffffff 0%,
#f7f5ff 50%,
#efecff 100%
);

border-radius:0 0 26px 26px;
border-bottom:1px solid var(--line);
box-shadow:0 10px 26px rgba(23,32,42,.05)
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px
}

.back-btn{
width:42px;
height:38px;
border-radius:13px;

background:#fff;
border:1px solid #ddd9f4;

color:var(--primary);

display:grid;
place-items:center;

box-shadow:0 7px 18px rgba(23,32,42,.05)
}

.brand{
display:flex;
flex-direction:column;
align-items:center;
line-height:.9;
flex:1
}

.brand strong{
font-size:20px;
letter-spacing:-.04em
}

.brand span{
font-size:8px;
font-weight:900;
letter-spacing:.18em;
color:#89939e;
margin-top:4px
}

.header-spacer{
width:42px
}


/* =========================
   PROFILE CARD
========================= */

.profile-card{
margin-top:18px;
padding:19px;

border-radius:23px;

background:
linear-gradient(
145deg,
#5968b9 0%,
#7067c8 52%,
#887bd5 100%
);

color:#fff;

position:relative;
overflow:hidden;

box-shadow:
0 16px 32px rgba(91,91,180,.16)
}

.profile-card:before{
content:"";
position:absolute;

width:190px;
height:190px;

border-radius:50%;

background:rgba(255,255,255,.07);

top:-105px;
left:-60px
}

.profile-card:after{
content:"";
position:absolute;

width:150px;
height:150px;

border-radius:50%;

background:rgba(255,255,255,.055);

bottom:-105px;
right:-55px
}


/* =========================
   USER INFO
========================= */

.profile-main{
position:relative;
z-index:2
}

.profile-name{
margin:0;

font-size:21px;
font-weight:950;
letter-spacing:-.035em;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.profile-email{
margin:6px 0 0;

font-size:10px;

color:rgba(255,255,255,.75);

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.profile-status{
display:inline-flex;
align-items:center;
gap:6px;

margin-top:10px;

padding:5px 9px;

border-radius:999px;

background:rgba(255,255,255,.11);
border:1px solid rgba(255,255,255,.10);

font-size:8px;
font-weight:900
}

.status-dot{
width:6px;
height:6px;
border-radius:50%;

background:#6ee0b9
}


/* =========================
   DETAILS
========================= */

.profile-details{
position:relative;
z-index:2;

margin-top:16px;
padding-top:14px;

border-top:1px solid rgba(255,255,255,.16);

display:grid;
grid-template-columns:repeat(2,1fr);

gap:12px
}

.detail-label{
font-size:8px;
color:rgba(255,255,255,.60);

margin-bottom:4px
}

.detail-value{
font-size:11px;
font-weight:900;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}


/* =========================
   RATING
========================= */

.rating-box{
position:relative;
z-index:2;

margin-top:13px;

padding:11px 12px;

border-radius:14px;

background:rgba(255,255,255,.10);

border:1px solid rgba(255,255,255,.10);

display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.rating-number{
font-size:18px;
font-weight:950
}

.rating-label{
margin-top:2px;

font-size:8px;

color:rgba(255,255,255,.66)
}

.rating-count{
font-size:8px;
color:rgba(255,255,255,.63);

white-space:nowrap
}


/* =========================
   STATS
========================= */

.stats{
position:relative;
z-index:2;

margin-top:9px;

display:grid;
grid-template-columns:repeat(3,1fr);

gap:7px
}

.stat{
padding:10px 6px;

text-align:center;

border-radius:13px;

background:rgba(255,255,255,.09);

border:1px solid rgba(255,255,255,.08)
}

.stat-number{
font-size:15px;
font-weight:950
}

.stat-label{
margin-top:3px;

font-size:8px;

color:rgba(255,255,255,.64)
}


/* =========================
   SECTION
========================= */

.section{
margin-top:20px
}

.section-title{
margin:0 2px 10px;

font-size:18px;
font-weight:950;

letter-spacing:-.03em
}


/* =========================
   MENU
========================= */

.menu-card{
background:#fff;

border:1px solid var(--line);

border-radius:19px;

overflow:hidden;

box-shadow:
0 9px 22px rgba(23,32,42,.045)
}

.menu-item{
width:100%;

min-height:67px;

padding:9px 13px;

display:flex;
align-items:center;

gap:12px;

background:#fff;

text-align:right;

border-bottom:1px solid #f0f1f3;

transition:.15s ease
}

.menu-item:last-child{
border-bottom:0
}

.menu-item:active{
background:#f8fafb
}

.menu-icon{
width:39px;
height:39px;

flex:0 0 39px;

display:grid;
place-items:center;

border-radius:12px;

background:var(--primary-soft);

color:var(--primary)
}

.menu-copy{
min-width:0;
flex:1
}

.menu-title{
font-size:12px;
font-weight:900
}

.menu-sub{
font-size:9px;
color:var(--muted);

margin-top:3px
}

.menu-arrow{
width:18px;
height:18px;

color:#a3adb5;

flex:0 0 auto
}


/* =========================
   LOGOUT
========================= */

.logout-btn{
width:100%;
height:49px;

margin-top:17px;

border-radius:15px;

background:#fff;

border:1px solid #f0cdd4;

color:var(--danger);

font-size:12px;
font-weight:950;

box-shadow:
0 8px 20px rgba(198,60,85,.05)

.logout-btn:active{

/* =========================
   BOTTOM NAV
========================= */

.bottom-wrap{
position:fixed;

left:0;
right:0;
bottom:0;

padding:
8px
12px
calc(8px + var(--safe-bottom));

z-index:50;

pointer-events:none
}

.bottom-nav{
width:min(100%,520px);

margin:0 auto;

min-height:67px;

padding:6px;

border-radius:22px;

background:
linear-gradient(
180deg,
rgba(255,255,255,.97),
rgba(232,243,246,.97)

box-shadow:
0 16px 36px rgba(23,107,135,.16);

backdrop-filter:blur(16px);

display:grid;

grid-template-columns:repeat(5,1fr);

gap:4px;

pointer-events:auto

.nav-item{

justify-content:center;

gap:3px;

border-radius:16px;

}

.nav-item.active{

linear-gradient(

#e8f3f6,
#dceef2

.nav-label{

font-weight:900

.nav-icon{
width:22px;
height:22px

/* =========================
   TOAST
========================= */

.toast{
position:fixed;

left:50%;
bottom:94px;

transform:
translateX(-50%)
translateY(16px);

max-width:calc(100% - 40px);

padding:10px 14px;

border-radius:13px;

background:#1e2c30;
color:#fff;

font-size:11px;
font-weight:800;

box-shadow:var(--shadow);

opacity:0;

pointer-events:none;

transition:.25s ease;

z-index:80;

text-align:center
}

.toast.show{
opacity:1;

transform:
translateX(-50%)
translateY(0)
}


/* =========================
   LOADING
========================= */

.loading{
position:fixed;
inset:0;

background:var(--bg);

z-index:100;

display:flex;
align-items:center;
justify-content:center;

transition:.3s ease
}

.loading.hidden{
opacity:0;
visibility:hidden;
pointer-events:none
}

.loader{
width:34px;
height:34px;

border:3px solid #dbe8eb;

border-top-color:var(--primary);

border-radius:50%;

animation:spin .8s linear infinite
}

@keyframes spin{
to{
transform:rotate(360deg)
}
}
</style>

<script type="module">

import { supabase } from "./js/supabase.js";


const loading =
document.getElementById("loading");

const profileName =
document.getElementById("profileName");

const profileEmail =
document.getElementById("profileEmail");

const infoPhone =
document.getElementById("infoPhone");

const infoEmail =
document.getElementById("infoEmail");

const ratingNumber =
document.getElementById("ratingNumber");

const ratingCount =
document.getElementById("ratingCount");

const salesCount =
document.getElementById("salesCount");

const purchasesCount =
document.getElementById("purchasesCount");

const listingsCount =
document.getElementById("listingsCount");

const toast =
document.getElementById("toast");

const backBtn =
document.getElementById("backBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const myListingsBtn =
document.getElementById("myListingsBtn");

const myAuctionsBtn =
document.getElementById("myAuctionsBtn");

const purchasesBtn =
document.getElementById("purchasesBtn");

const salesBtn =
document.getElementById("salesBtn");

const settingsBtn =
document.getElementById("settingsBtn");


let toastTimer;


function showToast(message){

toast.textContent = message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer =
setTimeout(()=>{

toast.classList.remove("show");

},2200);

}


/* =========================
   LOAD USER
========================= */

async function loadProfile(){

try{

const {
data,
error
} =
await supabase.auth.getUser();


if(error || !data?.user){

window.location.replace(
"index.html?login=1&returnTo=profile.html"
);

return;

}


const user =
data.user;

const metadata =
user.user_metadata || {};


const fullName =
metadata.full_name ||
metadata.name ||
"مستخدم MZAD PHONE";


const phone =
metadata.phone ||
"غير مضاف";


const email =
user.email ||
"غير مضاف";


profileName.textContent =
fullName;

profileEmail.textContent =
email;

infoPhone.textContent =
phone;

infoEmail.textContent =
email;


/*
  هذه الأرقام مؤقتاً صفر
  إلى أن نربط جداول المنصة
  الحقيقية.
*/

ratingNumber.textContent =
"0.0";

ratingCount.textContent =
"لا توجد تقييمات بعد";

salesCount.textContent =
"0";

purchasesCount.textContent =
"0";

listingsCount.textContent =
"0";


loading.classList.add("hidden");


}catch(error){

console.error(
"Profile error:",
error
);

showToast(
"تعذر تحميل الحساب"
);

setTimeout(()=>{

loading.classList.add("hidden");

},500);

}

}


/* =========================
   BACK
========================= */

backBtn.addEventListener(
"click",
()=>{

if(
document.referrer &&

/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
"click",
async ()=>{

logoutBtn.disabled = true;

logoutBtn.textContent =
"جاري تسجيل الخروج...";


try{

const {
error
} =
await supabase.auth.signOut();


if(error){

logoutBtn.disabled = false;

logoutBtn.textContent =
"تسجيل الخروج";

showToast(
"تعذر تسجيل الخروج"
);

return;

}


sessionStorage.removeItem(
"mzad_pending_action"
);


window.location.replace(
"home.html"
);


}catch(error){

console.error(error);

logoutBtn.disabled = false;

logoutBtn.textContent =
"تسجيل الخروج";

showToast(
"حدث خطأ أثناء تسجيل الخروج"
);

}

});
