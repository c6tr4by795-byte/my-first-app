<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iraq Green</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7f3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 70px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      color: #1d6b35;
    }

    .subtitle {
      font-size: 19px;
      color: #666;
      margin-bottom: 30px;
    }

    .input {
      width: 100%;
      height: 55px;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 0 18px;
      font-size: 17px;
      margin-bottom: 15px;
      outline: none;
      direction: rtl;
    }

    .input:focus {
      border-color: #2f8f46;
    }

    .login-btn {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 16px;
      background: #2f8f46;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .google-btn {
      width: 100%;
      height: 55px;
      border: 1px solid #ddd;
      border-radius: 16px;
      background: white;
      color: #333;
      font-size: 17px;
      cursor: pointer;
      margin-top: 12px;
    }

    .links {
      margin-top: 25px;
      font-size: 15px;
    }

    .links a {
      color: #2f8f46;
      text-decoration: none;
      margin: 0 5px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🌳</div>

    <h1>IRAQ GREEN</h1>

    <div class="subtitle">
      منصة العراق الأخضر
    </div>

    <input
      class="input"
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      class="input"
      type="password"
      placeholder="كلمة المرور"
    >

    <button class="login-btn">
      تسجيل الدخول
    </button>

    <button class="google-btn">
      تسجيل بواسطة Google
    </button>

    <div class="links">
      <a href="#">نسيت كلمة المرور؟</a>
      <span>·</span>
      <a href="#">إنشاء حساب جديد</a>
    </div>

  </div>

</body>
</html>
