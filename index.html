<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IRAQ GREEN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f4f6fa;
      font-family: Arial, Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .app {
      width: 100%;
      max-width: 750px;
      background: white;
      border-radius: 45px;
      padding: 70px 55px 65px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.06);
    }

    .logo {
      width: 180px;
      height: 180px;
      background: #3d8446;
      border-radius: 50%;
      margin: 0 auto 45px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 85px;
    }

    .title {
      text-align: center;
      direction: ltr;
      color: #3d8446;
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 29px;
      margin-bottom: 55px;
    }

    .input {
      width: 100%;
      height: 110px;

      border: 2px solid #dedede;
      border-radius: 35px;

      padding: 0 35px;

      font-size: 27px;
      text-align: right;

      outline: none;
      margin-bottom: 28px;
      background: white;
    }

    .input:focus {
      border-color: #3d8446;
    }

    .input::placeholder {
      color: #aaa;
    }

    .login-btn {
      width: 100%;
      height: 110px;

      border: none;
      border-radius: 35px;

      background: #3d8446;
      color: white;

      font-size: 31px;
      font-weight: bold;

      cursor: pointer;
      margin-top: 5px;
      margin-bottom: 22px;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .google-btn {
      width: 100%;
      height: 110px;

      background: white;
      border: 2px solid #dedede;
      border-radius: 35px;

      font-size: 27px;
      font-weight: bold;

      cursor: pointer;
      margin-bottom: 40px;
    }

    .google {
      direction: ltr;
      font-weight: bold;
    }

    .links {
      text-align: center;
    }

    .link {
      display: block;
      color: #3d8446;
      font-size: 25px;
      text-decoration: none;
      margin: 25px 0;
      cursor: pointer;
    }

    .link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .app {
        border-radius: 38px;
        padding: 55px 25px 45px;
      }

      .logo {
        width: 150px;
        height: 150px;
        font-size: 70px;
        margin-bottom: 35px;
      }

      .title {
        font-size: 45px;
      }

      .subtitle {
        font-size: 23px;
        margin-bottom: 40px;
      }

      .input,
      .login-btn,
      .google-btn {
        height: 90px;
        border-radius: 30px;
      }

      .input {
        font-size: 22px;
      }

      .login-btn {
        font-size: 27px;
      }

      .google-btn {
        font-size: 22px;
      }

      .link {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">
      🌳
    </div>

    <h1 class="title">
      IRAQ GREEN
    </h1>

    <p class="subtitle">
      منصة العراق الأخضر
    </p>

    <input
      class="input"
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      class="input"
      type="password"
      placeholder="كلمة المرور"
    >

    <button class="login-btn">
      تسجيل الدخول
    </button>

    <button class="google-btn">
      <span class="google">Google</span>
      &nbsp;
      تسجيل بواسطة
    </button>

    <div class="links">

      <a class="link">
        هل نسيت كلمة المرور؟
      </a>

      <a class="link">
        إنشاء حساب جديد
      </a>

    </div>

  </main>

</body>
</html>
