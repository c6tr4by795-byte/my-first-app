<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iraq Green</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7f3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 70px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      color: #1d6b35;
    }

    .subtitle {
      font-size: 19px;
      color: #666;
      margin-bottom: 30px;
    }

    .input {
      width: 100%;
      height: 55px;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 0 18px;
      font-size: 17px;
      margin-bottom: 15px;
      outline: none;
      direction: rtl;
    }

    .input:focus {
      border-color: #2f8f46;
    }

    .login-btn {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 16px;
      background: #2f8f46;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:disabled {
      opacity: 0.6;
    }

    .google-btn {
      width: 100%;
      height: 55px;
      border: 1px solid #ddd;
      border-radius: 16px;
      background: white;
      color: #333;
      font-size: 17px;
      cursor: pointer;
      margin-top: 12px;
    }

    .google-btn:disabled {
      opacity: 0.6;
    }

    .links {
      margin-top: 25px;
      font-size: 15px;
      line-height: 2;
    }

    .links a {
      color: #2f8f46;
      text-decoration: none;
      margin: 0 5px;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.6;
    }

    .success {
      display: block;
      background: #e8f7ec;
      color: #176b2e;
    }

    .error {
      display: block;
      background: #fdeaea;
      color: #a51d1d;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🌳</div>

    <h1>IRAQ GREEN</h1>

    <div class="subtitle">
      منصة العراق الأخضر
    </div>

    <input
      id="email"
      class="input"
      type="email"
      placeholder="البريد الإلكتروني"
      autocomplete="email"
    >

    <input
      id="password"
      class="input"
      type="password"
      placeholder="كلمة المرور"
      autocomplete="current-password"
    >

    <button id="loginBtn" class="login-btn">
      تسجيل الدخول
    </button>

    <button id="googleBtn" class="google-btn">
      تسجيل بواسطة Google
    </button>

    <div id="message" class="message"></div>

    <div class="links">

      <a href="forgot.html">
        نسيت كلمة المرور؟
      </a>

      <span>·</span>

      <a href="signup.html">
        إنشاء حساب جديد
      </a>

    </div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://ldvxctpngkidvatkisae.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_iKh2hmOMdDYt9MmGmCX3jA_Hs-MovbK";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const googleBtn =
      document.getElementById("googleBtn");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    // تسجيل الدخول بالبريد وكلمة المرور

    loginBtn.addEventListener("click", async () => {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      message.className = "message";

      message.textContent = "";


      if (!email || !password) {

        showMessage(
          "رجاءً أدخل البريد الإلكتروني وكلمة المرور.",
          "error"
        );

        return;
      }


      loginBtn.disabled = true;

      loginBtn.textContent =
        "جاري تسجيل الدخول...";


      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          showMessage(
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
            "error"
          );

          return;
        }


        if (data.user) {

          showMessage(
            "تم تسجيل الدخول بنجاح.",
            "success"
          );


          setTimeout(() => {

            window.location.href =
              "home.html";

          }, 700);

        }


      } catch (error) {

        showMessage(
          "حدث خطأ غير متوقع. حاول مرة أخرى.",
          "error"
        );

      } finally {

        loginBtn.disabled = false;

        loginBtn.textContent =
          "تسجيل الدخول";

      }

    });


    // تسجيل الدخول بواسطة Google

    googleBtn.addEventListener("click", async () => {

      googleBtn.disabled = true;

      googleBtn.textContent =
        "جاري الاتصال بـ Google...";


      try {

        const { error } =
          await supabaseClient.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo:
                window.location.origin + "/home.html"
            }
          });


        if (error) {

          showMessage(
            "تعذر تسجيل الدخول بواسطة Google حالياً.",
            "error"
          );

          googleBtn.disabled = false;

          googleBtn.textContent =
            "تسجيل بواسطة Google";

        }


      } catch (error) {

        showMessage(
          "حدث خطأ أثناء الاتصال بـ Google.",
          "error"
        );

        googleBtn.disabled = false;

        googleBtn.textContent =
          "تسجيل بواسطة Google";

      }

    });

  </script>

</body>
</html>
