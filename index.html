<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العراق الأخضر</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eef8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 22px;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      color: #16833b;
      font-size: 28px;
    }

    p {
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    .login {
      background: #16833b;
      color: white;
    }

    .google {
      background: white;
      color: #333;
      border: 1px solid #ddd;
    }

    .links {
      margin-top: 20px;
      font-size: 14px;
    }

    a {
      color: #16833b;
      text-decoration: none;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      color: #d33;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">🌳</div>

    <h1>العراق الأخضر</h1>

    <p>منصة العراق الأخضر</p>

    <input
      type="email"
      id="email"
      placeholder="البريد الإلكتروني"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="كلمة المرور"
      autocomplete="current-password"
    >

    <button class="login" id="loginBtn">
      تسجيل الدخول
    </button>

    <button class="google" id="googleBtn">
      تسجيل بواسطة Google
    </button>

    <div class="links">
      <a href="forgot.html">نسيت كلمة المرور؟</a>
      <span> · </span>
      <a href="signup.html">إنشاء حساب جديد</a>
    </div>

    <div id="message"></div>

  </div>

  <script type="module">

    import {
      auth,
      googleProvider
    } from "./js/firebase.js";

    import {
      signInWithEmailAndPassword,
      signInWithRedirect
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const googleBtn = document.getElementById("googleBtn");
    const message = document.getElementById("message");

    loginBtn.addEventListener("click", async () => {

      message.textContent = "";

      if (!email.value || !password.value) {
        message.textContent = "أدخل البريد الإلكتروني وكلمة المرور.";
        return;
      }

      try {

        await signInWithEmailAndPassword(
          auth,
          email.value.trim(),
          password.value
        );

        window.location.href = "home.html";

      } catch (error) {

        message.textContent = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        console.error(error);

      }

    });

    googleBtn.addEventListener("click", async () => {

      try {

        await signInWithRedirect(auth, googleProvider);

      } catch (error) {

        message.textContent = "حدث خطأ أثناء تسجيل الدخول بواسطة Google.";

        console.error(error);

      }

    });

  </script>

</body>
</html>
