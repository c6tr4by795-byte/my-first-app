<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>العراق الأخضر</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cairo", sans-serif;
      background: linear-gradient(145deg, #f7f2e8, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-box {
      width: min(90%, 420px);
      background: #ffffff;
      border-radius: 28px;
      padding: 35px 25px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
      text-align: center;
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 18px;
      border-radius: 24px;
      background: #32b8c4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 34px;
      font-weight: 800;
      animation: floatLogo 3s ease-in-out infinite;
    }

    h1 {
      margin: 0 0 8px;
      color: #222;
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      color: #777;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      border: 1px solid #e5e5e5;
      border-radius: 15px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #32b8c4;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 15px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #e91d4f;
      color: white;
      transition: transform 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .links {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .links a {
      color: #32b8c4;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      color: #e91d4f;
    }

    /* شاشة الترحيب */

    .welcome-screen {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 99999;
    }

    .welcome-screen.show {
      display: flex;
      animation: screenAppear 0.5s ease forwards;
    }

    .welcome-logo {
      width: 115px;
      height: 115px;
      border-radius: 32px;
      background: #32b8c4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 48px;
      font-weight: 800;
      box-shadow: 0 15px 40px rgba(50, 184, 196, 0.25);

      animation: logoAppear 1s cubic-bezier(.17,.67,.3,1.3) forwards;
    }

    .welcome-title {
      margin-top: 28px;
      font-size: 32px;
      font-weight: 800;
      color: #222222;

      opacity: 0;
      animation: textAppear 0.8s ease 0.5s forwards;
    }

    .welcome-text {
      margin-top: 5px;
      color: #777777;
      font-size: 16px;

      opacity: 0;
      animation: textAppear 0.8s ease 0.8s forwards;
    }

    .loader {
      width: 70px;
      height: 5px;
      margin-top: 30px;
      border-radius: 20px;
      background: #e91d4f;

      opacity: 0;
      animation:
        loaderAppear 0.5s ease 1s forwards,
        loaderMove 1.2s ease-in-out 1s infinite;
    }

    @keyframes screenAppear {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes logoAppear {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-20deg);
      }

      60% {
        opacity: 1;
        transform: scale(1.12) rotate(5deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes textAppear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes loaderAppear {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes loaderMove {
      0% {
        transform: scaleX(0.4);
      }

      50% {
        transform: scaleX(1);
      }

      100% {
        transform: scaleX(0.4);
      }
    }

    @keyframes floatLogo {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }
  </style>
</head>

<body>

  <!-- صفحة تسجيل الدخول -->

  <div class="login-box" id="loginBox">

    <div class="logo">
      ع
    </div>

    <h1>
      العراق الأخضر
    </h1>

    <div class="subtitle">
      تسجيل الدخول إلى حسابك
    </div>

    <form id="loginForm">

      <input
        id="email"
        type="email"
        placeholder="البريد الإلكتروني"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        تسجيل الدخول
      </button>

    </form>

    <div id="message"></div>

    <div class="links">

      <a href="signup.html">
        إنشاء حساب
      </a>

      <a href="forgot.html">
        نسيت كلمة المرور؟
      </a>

    </div>

  </div>


  <!-- شاشة الترحيب بعد تسجيل الدخول -->

  <div
    class="welcome-screen"
    id="welcomeScreen"
  >

    <div class="welcome-logo">
      ع
    </div>

    <div class="welcome-title">
      مرحباً بك
    </div>

    <div class="welcome-text">
      العراق الأخضر
    </div>

    <div class="loader"></div>

  </div>


  <script type="module">

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      auth
    } from "./js/firebase.js";


    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const loginBox =
      document.getElementById("loginBox");

    const welcomeScreen =
      document.getElementById("welcomeScreen");


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        message.textContent = "";

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
          "جاري تسجيل الدخول...";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          /*
            تسجيل الدخول نجح.
            نخفي شاشة تسجيل الدخول.
          */

          loginBox.style.display = "none";


          /*
            نظهر شاشة الترحيب.
          */

          welcomeScreen.classList.add("show");


          /*
            نبقى على شاشة الترحيب 4 ثواني
            ثم ننتقل إلى الصفحة الرئيسية.
          */

          setTimeout(
            function() {

              window.location.replace(
                "home.html"
              );

            },
            4000
          );


        } catch (error) {

          console.error(
            "Login error:",
            error
          );

          loginButton.disabled = false;

          loginButton.textContent =
            "تسجيل الدخول";

          message.textContent =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        }

      }
    );

  </script>

</body>
</html>
