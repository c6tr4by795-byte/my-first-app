<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no,email=no,address=no">

  <title>MZAD PHONE - تسجيل الدخول</title>

  <!--
    إذا تم فتح index.html مباشرة بدون:
    login=1
    أو returnTo
    نعتبره دخول للموقع الرئيسي ونذهب إلى home.html
  -->
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);

      const hasReturnTo = !!params.get("returnTo");
      const explicitLogin = params.get("login") === "1";

      if (!hasReturnTo && !explicitLogin) {
        window.location.replace("home.html");
      }
    })();
  </script>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary: #2495a0;
      --primary-dark: #197984;
      --dark: #172124;
      --muted: #7d898c;
      --border: #e1e7e8;
      --surface: #f7f9f9;
      --error: #c9684e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 22px 17px 28px;

      font-family: "Cairo", sans-serif;
      color: var(--dark);

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(36, 149, 160, 0.08),
          transparent 28%
        ),
        linear-gradient(
          145deg,
          #f8fbfb,
          #ffffff 55%,
          #f6f9f9
        );

      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      margin: 8px 0 25px;

      opacity: 0;
      transform: translateY(-10px);
      animation: enter 0.6s ease forwards;
    }

    .brand-main {
      font-family: Arial, sans-serif;
      font-size: 40px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .brand-main span {
      color: var(--primary);
    }

    .brand-sub {
      margin-top: 5px;

      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 5px;

      color: var(--muted);
      direction: ltr;
    }

    .heading {
      margin-bottom: 19px;

      opacity: 0;
      transform: translateY(10px);
      animation: enter 0.6s ease 0.08s forwards;
    }

    .heading h1 {
      margin: 0;

      font-size: 27px;
      line-height: 1.35;
      font-weight: 800;
    }

    .heading p {
      margin: 5px 0 0;

      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .card {
      padding: 22px 20px 21px;

      background: rgba(255, 255, 255, 0.97);

      border: 1px solid #e5eaeb;
      border-radius: 27px;

      box-shadow:
        0 16px 42px rgba(23, 33, 36, 0.065),
        0 2px 8px rgba(23, 33, 36, 0.025);

      opacity: 0;
      transform: translateY(12px);
      animation: enter 0.65s ease 0.16s forwards;
    }

    .field-group {
      margin-bottom: 15px;
    }

    .field-label {
      display: block;

      margin: 0 0 6px;
      padding-right: 2px;

      font-size: 12.5px;
      font-weight: 700;

      color: #465356;
    }

    .input-wrap {
      position: relative;
    }

    .input {
      width: 100%;
      height: 54px;

      border: 1.5px solid var(--border);
      border-radius: 16px;

      background: var(--surface);
      color: var(--dark);

      padding: 0 15px;

      font-family: "Cairo", sans-serif;
      font-size: 15px;

      outline: none;

      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .input:focus {
      background: #fff;

      border-color: var(--primary);

      box-shadow:
        0 0 0 3px rgba(36, 149, 160, 0.08);
    }

    .input.invalid {
      border-color: var(--error);

      box-shadow:
        0 0 0 3px rgba(201, 104, 78, 0.06);
    }

    .email-input {
      direction: ltr;
      text-align: left;
    }

    .password-input {
      direction: ltr;
      text-align: left;
      padding-left: 58px;
    }

    .toggle-password {
      position: absolute;

      left: 11px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;
      background: transparent;

      padding: 6px;

      color: #8b9699;

      font-family: "Cairo", sans-serif;
      font-size: 11px;
      font-weight: 700;

      cursor: pointer;
    }

    .field-error {
      display: none;

      margin-top: 6px;
      padding-right: 3px;

      color: var(--error);

      font-size: 11px;
      font-weight: 600;

      line-height: 1.5;
    }

    .field-error.show {
      display: block;
    }

    .forgot {
      display: block;

      margin-top: -4px;
      margin-bottom: 16px;

      color: var(--primary-dark);

      text-decoration: none;

      font-size: 12px;
      font-weight: 700;
    }

    .login-btn {
      width: 100%;
      height: 57px;

      border: 0;
      border-radius: 17px;

      background: var(--primary);
      color: #fff;

      font-family: "Cairo", sans-serif;
      font-size: 15.5px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 9px 20px rgba(36, 149, 160, 0.18);

      transition:
        transform 0.18s ease,
        background 0.18s ease;
    }

    .login-btn:active {
      transform: scale(0.985);
    }

    .login-btn:hover {
      background: var(--primary-dark);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      margin-top: 10px;

      text-align: center;

      font-size: 11.5px;
      font-weight: 600;

      color: var(--error);

      line-height: 1.7;

      word-break: break-word;
    }

    .message.success {
      color: var(--primary-dark);
    }

    .signup-link {
      display: block;

      margin-top: 17px;

      text-align: center;

      color: var(--primary-dark);

      text-decoration: none;

      font-size: 13.5px;
      font-weight: 700;

      opacity: 0;
      animation: enter 0.6s ease 0.28s forwards;
    }

    .note {
      margin-top: 12px;

      text-align: center;

      color: #a0a9ab;

      font-size: 10.5px;
      line-height: 1.7;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 360px) {

      body {
        padding-left: 13px;
        padding-right: 13px;
      }

      .card {
        padding: 20px 17px;
      }

      .input {
        height: 52px;
      }

      .login-btn {
        height: 55px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="brand">

      <div class="brand-main">
        MZ<span>AD</span>
      </div>

      <div class="brand-sub">
        PHONE
      </div>

    </header>


    <section class="heading">

      <h1>
        تسجيل الدخول
      </h1>

      <p>
        سجّل دخولك للوصول إلى حسابك
      </p>

    </section>


    <section class="card">

      <div class="field-group">

        <label
          class="field-label"
          for="email"
        >
          البريد الإلكتروني
        </label>

        <input
          id="email"
          class="input email-input"
          type="email"
          autocomplete="email"
          maxlength="120"
          inputmode="email"
          spellcheck="false"
        >

        <div
          id="emailError"
          class="field-error"
        ></div>

      </div>


      <div class="field-group">

        <label
          class="field-label"
          for="password"
        >
          كلمة المرور
        </label>

        <div class="input-wrap">

          <input
            id="password"
            class="input password-input"
            type="password"
            autocomplete="current-password"
            maxlength="72"
          >

          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
          >
            إظهار
          </button>

        </div>

        <div
          id="passwordError"
          class="field-error"
        ></div>

      </div>


      <a
        href="forgot.html"
        class="forgot"
      >
        نسيت كلمة المرور؟
      </a>


      <button
        id="loginBtn"
        class="login-btn"
        type="button"
      >
        تسجيل الدخول
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </section>


    <a
      href="signup.html"
      class="signup-link"
    >
      ليس لديك حساب؟ إنشاء حساب
    </a>


    <div class="note">
      تسجيل الدخول يتم بشكل آمن عبر حسابك.
    </div>

  </main>


  <script type="module">

    import { supabase } from "./js/supabase.js";


    /* =========================
       العناصر
    ========================== */

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");

    const emailError =
      document.getElementById("emailError");

    const passwordError =
      document.getElementById("passwordError");

    const togglePassword =
      document.getElementById("togglePassword");


    /* =========================
       معرفة المكان المطلوب بعد الدخول
    ========================== */

    function getSafeReturnTo() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const returnTo =
        params.get("returnTo");


      if (!returnTo) {

        return "home.html";

      }


      try {

        const decoded =
          decodeURIComponent(returnTo);


        if (
          decoded.startsWith("http://") ||
          decoded.startsWith("https://") ||
          decoded.startsWith("//")
        ) {

          return "home.html";

        }


        if (
          decoded.startsWith("/") &&
          !decoded.startsWith("./")
        ) {

          return "home.html";

        }


        return decoded;

      } catch {

        return "home.html";

      }

    }


    const returnTo =
      getSafeReturnTo();


    /* =========================
       أدوات الأخطاء
    ========================== */

    function clearErrors() {

      email.classList.remove("invalid");
      password.classList.remove("invalid");

      emailError.textContent = "";
      passwordError.textContent = "";

      emailError.classList.remove("show");
      passwordError.classList.remove("show");

    }


    function showEmailError(text) {

      email.classList.add("invalid");

      emailError.textContent = text;

      emailError.classList.add("show");

    }


    function showPasswordError(text) {

      password.classList.add("invalid");

      passwordError.textContent = text;

      passwordError.classList.add("show");

    }


    /* =========================
       إظهار / إخفاء كلمة المرور
    ========================== */

    togglePassword.addEventListener(
      "click",
      () => {

        if (password.type === "password") {

          password.type = "text";

          togglePassword.textContent =
            "إخفاء";

        } else {

          password.type = "password";

          togglePassword.textContent =
            "إظهار";

        }

      }
    );


    /* =========================
       التحقق المحلي
    ========================== */

    function validateForm() {

      clearErrors();

      let valid = true;

      const emailValue =
        email.value.trim();

      const passwordValue =
        password.value;


      if (!emailValue) {

        showEmailError(
          "يرجى إدخال البريد الإلكتروني"
        );

        valid = false;

      } else if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
          emailValue
        )
      ) {

        showEmailError(
          "يرجى إدخال بريد إلكتروني صحيح"
        );

        valid = false;

      }


      if (!passwordValue) {

        showPasswordError(
          "يرجى إدخال كلمة المرور"
        );

        valid = false;

      }


      return valid;

    }


    /* =========================
       رسالة عامة
    ========================== */

    function showMessage(
      text,
      success = false
    ) {

      message.textContent = text;

      message.classList.toggle(
        "success",
        success
      );

    }


    /* =========================
       ترجمة أخطاء Supabase
    ========================== */

    function getArabicLoginError(error) {

      console.error(
        "SUPABASE LOGIN ERROR:",
        {
          message: error?.message,
          code: error?.code,
          status: error?.status,
          name: error?.name
        }
      );


      const realMessage =
        String(
          error?.message || ""
        ).toLowerCase();


      const errorCode =
        String(
          error?.code || ""
        ).toLowerCase();


      const status =
        Number(
          error?.status || 0
        );


      if (
        realMessage.includes(
          "invalid login credentials"
        ) ||
        realMessage.includes(
          "invalid credentials"
        ) ||
        errorCode.includes(
          "invalid_credentials"
        ) ||
        status === 400
      ) {

        return {
          message:
            "البريد الإلكتروني أو كلمة المرور غير صحيحة"
        };

      }


      if (
        realMessage.includes(
          "email not confirmed"
        ) ||
        errorCode.includes(
          "email_not_confirmed"
        )
      ) {

        return {
          message:
            "هذا البريد الإلكتروني غير مؤكد"
        };

      }


      if (
        realMessage.includes(
          "too many requests"
        ) ||
        realMessage.includes(
          "rate limit"
        ) ||
        status === 429
      ) {

        return {
          message:
            "محاولات تسجيل الدخول كثيرة. انتظر قليلاً وحاول مرة أخرى."
        };

      }


      if (
        realMessage.includes(
          "network"
        ) ||
        realMessage.includes(
          "fetch"
        ) ||
        realMessage.includes(
          "failed to fetch"
        )
      ) {

        return {
          message:
            "تعذر الاتصال بالخادم. تأكد من الإنترنت وحاول مرة أخرى."
        };

      }


      return {
        message:
          "تعذر تسجيل الدخول. حاول مرة أخرى."
      };

    }


    /* =========================
       تسجيل الدخول
    ========================== */

    async function login() {

      showMessage("");

      clearErrors();


      if (!validateForm()) {

        return;

      }


      loginBtn.disabled = true;

      loginBtn.textContent =
        "جاري تسجيل الدخول...";


      try {

        const emailValue =
          email.value
            .trim()
            .toLowerCase();


        const passwordValue =
          password.value;


        console.log(
          "LOGIN START"
        );


        const {
          data,
          error
        } =
          await supabase.auth.signInWithPassword({

            email:
              emailValue,

            password:
              passwordValue

          });


        if (error) {

          const result =
            getArabicLoginError(error);


          showMessage(
            result.message
          );


          return;

        }


        if (!data?.user) {

          showMessage(
            "لم يتم العثور على بيانات المستخدم."
          );

          return;

        }


        if (!data?.session) {

          showMessage(
            "تم التحقق من الحساب ولكن لم يتم إنشاء جلسة دخول."
          );

          return;

        }


        console.log(
          "LOGIN SUCCESS"
        );


        showMessage(
          "تم تسجيل الدخول بنجاح.",
          true
        );


        setTimeout(
          () => {

            window.location.replace(
              returnTo
            );

          },
          500
        );


      } catch (err) {

        console.error(
          "UNEXPECTED LOGIN ERROR:",
          err
        );


        showMessage(
          "حدث خطأ غير متوقع. حاول مرة أخرى."
        );

      } finally {

        loginBtn.disabled =
          false;

        loginBtn.textContent =
          "تسجيل الدخول";

      }

    }


    /* =========================
       زر تسجيل الدخول
    ========================== */

    loginBtn.addEventListener(
      "click",
      login
    );


    /* =========================
       Enter
    ========================== */

    [email, password].forEach(
      input => {

        input.addEventListener(
          "keydown",
          event => {

            if (
              event.key === "Enter"
            ) {

              login();

            }

          }
        );

      }
    );


    /* =========================
       تنظيف خطأ البريد
    ========================== */

    email.addEventListener(
      "input",
      () => {

        email.classList.remove(
          "invalid"
        );

        emailError.textContent = "";

        emailError.classList.remove(
          "show"
        );

      }
    );


    /* =========================
       تنظيف خطأ كلمة المرور
    ========================== */

    password.addEventListener(
      "input",
      () => {

        password.classList.remove(
          "invalid"
        );

        passwordError.textContent = "";

        passwordError.classList.remove(
          "show"
        );

      }
    );

  </script>

</body>

</html>
