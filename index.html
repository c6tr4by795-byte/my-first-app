<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MZAD PHONE - تسجيل الدخول</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f9f9;
      font-family: "Cairo", sans-serif;
      color: #172124;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 30px;
      padding: 42px 26px 34px;
      box-shadow: 0 18px 50px rgba(23, 33, 36, 0.08);
      animation: cardIn .55s ease;
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 25px;
      border-radius: 24px;
      background: #2495a0;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      animation: logoIn .65s ease;
    }

    .brand {
      text-align: center;
      margin-bottom: 8px;
      font-size: 36px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand span {
      display: block;
      margin-top: 8px;
      font-size: 17px;
      letter-spacing: 3px;
      font-weight: 700;
      color: #2495a0;
    }

    .subtitle {
      text-align: center;
      color: #7d898c;
      font-size: 17px;
      margin: 22px 0 34px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin: 0 4px 8px;
      font-size: 14px;
      font-weight: 600;
      color: #172124;
    }

    input {
      width: 100%;
      height: 58px;
      border: 1px solid #e1e7e8;
      border-radius: 17px;
      background: #fff;
      padding: 0 18px;
      font-family: inherit;
      font-size: 16px;
      outline: none;
      transition: .2s;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #2495a0;
      box-shadow: 0 0 0 4px rgba(36, 149, 160, .09);
    }

    .error {
      display: none;
      color: #c9684e;
      font-size: 13px;
      margin: 7px 5px 0;
    }

    .login-btn {
      width: 100%;
      height: 60px;
      margin-top: 8px;
      border: 0;
      border-radius: 18px;
      background: #2495a0;
      color: #fff;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, opacity .15s;
    }

    .login-btn:active {
      transform: scale(.98);
    }

    .login-btn:disabled {
      opacity: .65;
      cursor: default;
    }

    .forgot {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2495a0;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
    }

    .signup {
      text-align: center;
      margin-top: 25px;
      color: #7d898c;
      font-size: 14px;
    }

    .signup a {
      color: #2495a0;
      text-decoration: none;
      font-weight: 700;
    }

    .success {
      display: none;
      text-align: center;
      color: #2495a0;
      font-size: 14px;
      margin-top: 14px;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes logoIn {
      from {
        opacity: 0;
        transform: scale(.75);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">م</div>

    <div class="brand">
      MZAD
      <span>PHONE</span>
    </div>

    <div class="subtitle">تسجيل الدخول إلى حسابك</div>

    <form id="loginForm">

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          dir="ltr"
        >
        <div id="emailError" class="error"></div>
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          dir="ltr"
        >
        <div id="passwordError" class="error"></div>
      </div>

      <button id="loginBtn" class="login-btn" type="submit">
        تسجيل الدخول
      </button>

      <div id="success" class="success"></div>

    </form>

    <a class="forgot" href="forgot.html">
      نسيت كلمة المرور؟
    </a>

    <div class="signup">
      ما عندك حساب؟
      <a href="signup.html">إنشاء حساب</a>
    </div>

  </main>

  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://ldvxctpngkidvatkisae.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_iKh2hmOMdYJt9MmGmCX3jA_Hs-MovkB";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");

    const loginBtn = document.getElementById("loginBtn");
    const success = document.getElementById("success");

    function showError(element, message) {
      element.textContent = message;
      element.style.display = "block";
    }

    function hideError(element) {
      element.textContent = "";
      element.style.display = "none";
    }

    function clearErrors() {
      hideError(emailError);
      hideError(passwordError);
      success.style.display = "none";
      success.textContent = "";
    }

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      clearErrors();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      let valid = true;

      if (!email) {
        showError(
          emailError,
          "يرجى إدخال البريد الإلكتروني"
        );
        valid = false;
      }

      if (!password) {
        showError(
          passwordError,
          "يرجى إدخال كلمة المرور"
        );
        valid = false;
      }

      if (!valid) return;

      loginBtn.disabled = true;
      loginBtn.textContent = "جاري تسجيل الدخول...";

      try {

        const { data, error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          throw error;
        }

        if (!data.session) {
          throw new Error("NO_SESSION");
        }

        success.textContent = "تم تسجيل الدخول بنجاح";
        success.style.display = "block";

        setTimeout(() => {
          window.location.href = "home.html";
        }, 500);

      } catch (error) {

        console.error("LOGIN ERROR:", error);

        const message =
          String(error?.message || "").toLowerCase();

        if (
          message.includes("invalid login credentials") ||
          message.includes("invalid credentials")
        ) {

          showError(
            emailError,
            "البريد الإلكتروني أو كلمة المرور غير صحيحة"
          );

        } else if (
          message.includes("email not confirmed")
        ) {

          showError(
            emailError,
            "تعذر تسجيل الدخول بهذا البريد الإلكتروني"
          );

        } else {

          showError(
            emailError,
            "تعذر تسجيل الدخول. حاول مرة أخرى."
          );
        }

      } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "تسجيل الدخول";

      }

    });

  </script>

</body>
</html>
