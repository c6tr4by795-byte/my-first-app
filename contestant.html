<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>بطاقة المتسابق | MZAD</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--p:#247b83;--bg:#f4f5f8;--ink:#202735;--muted:#747d8c;--line:#e4e7ed;--green:#16865b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;padding:env(safe-area-inset-top) 16px 30px}main{max-width:520px;margin:auto}header{height:62px;display:flex;align-items:center;gap:12px}header a{font-size:25px;color:var(--p);text-decoration:none}h1{font-size:18px;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:19px;margin-top:12px}.eyebrow{color:var(--p);font-size:11px;font-weight:700;letter-spacing:1px}.name{font-size:25px;margin:8px 0 3px}.city{color:var(--muted);margin:0}.bio{color:#525d6c;line-height:1.9;margin:16px 0 0}.counter{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding:15px;border-radius:14px;background:#eef5f5}.counter span{color:#47646a}.counter b{font-size:25px;color:#216e75}.support{width:100%;border:0;border-radius:14px;padding:17px;margin-top:17px;background:#263344;color:#fff;font:inherit;font-size:16px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none}.support.holding{background:var(--green);transform:scale(.99)}.help{color:var(--muted);font-size:12px;line-height:1.8;text-align:center}.section{margin-top:22px}.section h2{font-size:16px}.supporter{padding:11px 0;border-bottom:1px solid var(--line)}.supporter:last-child{border:0}.msg{min-height:22px;color:#b44855;font-size:13px;line-height:1.8}
</style></head><body><main><header><a href="contests.html">‹</a><h1>بطاقة المتسابق</h1></header><section class="card"><div class="eyebrow">ملف المشاركة</div><h2 class="name" id="name">جاري التحميل…</h2><p class="city" id="city"></p><p class="bio" id="note"></p><div class="counter"><span>الداعمون الموجودون الآن</span><b id="score">0</b></div><button class="support" id="support" type="button">اضغط باستمرار للدعم</button><p class="help">يبقى دعمك محسوباً طول ما إصبعك ضاغط. من ترفع إصبعك ينتهي الدعم.</p><p class="msg" id="msg" role="status"></p></section><section class="section card"><h2>الداعمون الآن</h2><div id="supporters">ماكو داعمين حالياً.</div></section></main>
<script type="module">
import{supabase}from"./js/supabase.js";const $=id=>document.getElementById(id),entry=new URLSearchParams(location.search).get("id");let detail=null,holding=false,starting=false,pointer=null,heartbeat=0,refresh=0;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),fmt=n=>Number(n||0).toLocaleString("en-US");
async function load(){if(!entry)throw Error("رابط المتسابق غير مكتمل");const r=await supabase.rpc("mzad_get_contestant_detail",{p_entry_id:entry});if(r.error)throw r.error;detail=r.data;if(!detail)throw Error("المتسابق غير موجود");$("name").textContent=detail.name||"متسابق";$("city").textContent=detail.city||"غير محددة";$("note").textContent=detail.note||"ما أضاف نبذة تعريفية.";$("score").textContent=fmt(detail.support);const list=detail.supporters||[];$("supporters").innerHTML=list.length?list.map(x=>'<div class="supporter">'+esc(x.name||"داعم")+'</div>').join(""):"ماكو داعمين حالياً."}
const b=$("support");
async function stop(){const active=holding;holding=false;starting=false;clearInterval(heartbeat);heartbeat=0;if(active&&detail)await supabase.rpc("mzad_contest_support_stop",{p_contest_id:detail.contest_id});b.classList.remove("holding");b.textContent="اضغط باستمرار للدعم";if(!document.hidden)load().catch(e=>$("msg").textContent=e.message)}
b.addEventListener("pointerdown",async e=>{if(!e.isPrimary||e.button!==0||holding||starting||!detail)return;e.preventDefault();pointer=e.pointerId;starting=true;try{b.setPointerCapture(e.pointerId)}catch(_){}b.textContent="جارٍ بدء الدعم…";try{const s=await supabase.auth.getSession();if(!starting)return;if(!s.data.session){starting=false;location.href="index.html?login=1&returnTo="+encodeURIComponent(location.pathname+location.search);return}const r=await supabase.rpc("mzad_contest_support_start",{p_contest_id:detail.contest_id,p_entry_id:entry});if(r.error)throw r.error;if(!starting){await supabase.rpc("mzad_contest_support_stop",{p_contest_id:detail.contest_id});return}starting=false;holding=true;b.classList.add("holding");b.textContent="استمر بالضغط…";heartbeat=setInterval(async()=>{const h=await supabase.rpc("mzad_contest_support_heartbeat",{p_contest_id:detail.contest_id});if(h.error||h.data!==true){await stop();$("msg").textContent=h.error?.message||"انتهى وقت الدعم."}},2500)}catch(err){starting=false;b.textContent="اضغط باستمرار للدعم";$("msg").textContent=err.message||"تعذر بدء الدعم"}});
async function release(e){if(e?.pointerId!==undefined&&pointer!==null&&e.pointerId!==pointer)return;pointer=null;if(holding||starting)await stop()}
b.addEventListener("pointerup",release);b.addEventListener("pointercancel",release);b.addEventListener("lostpointercapture",release);addEventListener("blur",release);document.addEventListener("visibilitychange",()=>{if(document.hidden)release();else load()});addEventListener("pagehide",()=>{if(holding&&detail)supabase.rpc("mzad_contest_support_stop",{p_contest_id:detail.contest_id});clearInterval(refresh)});
load().catch(e=>$("msg").textContent=e.message||String(e));refresh=setInterval(()=>{if(!document.hidden&&!holding&&!starting)load()},2500);
</script></body></html>
