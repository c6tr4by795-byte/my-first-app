<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no,email=no,address=no">

  <title>إنشاء حساب - MZAD PHONE</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary: #1f8f9b;
      --primary-dark: #16727c;
      --dark: #172124;
      --muted: #788488;
      --border: #e5eaeb;
      --surface: #f7f9f9;
      --white: #ffffff;
      --error: #c75f42;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Cairo", sans-serif;
      background:
        radial-gradient(
          circle at 90% 0%,
          rgba(31, 143, 155, 0.09),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #f8fbfb 0%,
          #ffffff 52%,
          #f5f8f8 100%
        );
      color: var(--dark);
      display: flex;
      justify-content: center;
      padding: 28px 18px 40px;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 414px;
      position: relative;
    }

    .brand {
      text-align: center;
      padding-top: 18px;
      margin-bottom: 30px;
      opacity: 0;
      transform: translateY(-14px);
      animation: brandIn 0.7s ease forwards;
    }

    .brand-main {
      font-family: Arial, sans-serif;
      font-size: 42px;
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -2px;
      color: var(--dark);
    }

    .brand-main span {
      color: var(--primary);
    }

    .brand-sub {
      margin-top: 7px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 5px;
      font-weight: 800;
      color: var(--muted);
      direction: ltr;
    }

    .heading {
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(15px);
      animation: contentIn 0.7s ease 0.12s forwards;
    }

    .heading h1 {
      margin: 0;
      font-size: 29px;
      line-height: 1.35;
      font-weight: 800;
      color: var(--dark);
    }

    .heading p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(229, 234, 235, 0.9);
      border-radius: 30px;
      padding: 25px 21px 23px;
      box-shadow:
        0 18px 50px rgba(23, 33, 36, 0.07),
        0 3px 10px rgba(23, 33, 36, 0.03);
      opacity: 0;
      transform: translateY(18px);
      animation: contentIn 0.75s ease 0.25s forwards;
    }

    .field-group {
      margin-bottom: 15px;
    }

    .field-label {
      display: block;
      margin: 0 0 7px;
      padding-right: 3px;
      font-size: 13px;
      font-weight: 700;
      color: #445154;
    }

    .input-wrap {
      position: relative;
    }

    .input {
      width: 100%;
      height: 57px;
      border: 1.5px solid var(--border);
      border-radius: 17px;
      background: var(--surface);
      color: var(--dark);
      padding: 0 16px;
      font-family: "Cairo", sans-serif;
      font-size: 15px;
      outline: none;
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .input:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(31, 143, 155, 0.09);
    }

    .input.invalid {
      border-color: var(--error);
      box-shadow: 0 0 0 4px rgba(199, 95, 66, 0.07);
    }

    .input.valid {
      border-color: var(--primary);
    }

    .phone-input,
    .email-input {
      direction: ltr;
      text-align: right;
    }

    .password-input {
      padding-left: 52px;
    }

    .toggle-password {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #8a9699;
      font-family: "Cairo", sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 7px;
    }

    .toggle-password:active {
      transform: translateY(-50%) scale(0.94);
    }

    .field-error {
      min-height: 0;
      margin-top: 6px;
      padding: 0 3px;
      color: var(--error);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(-3px);
      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
    }

    .field-error.show {
      opacity: 1;
      transform: translateY(0);
    }

    .password-rules {
      margin-top: 7px;
      padding: 0 3px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .password-rule {
      font-size: 11px;
      color: #9aa4a6;
      transition: color 0.18s ease;
    }

    .password-rule.ok {
      color: var(--primary-dark);
    }

    .signup-btn {
      width: 100%;
      height: 59px;
      margin-top: 8px;
      border: 0;
      border-radius: 18px;
      background: var(--primary);
      color: #ffffff;
      font-family: "Cairo", sans-serif;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow:
        0 10px 22px rgba(31, 143, 155, 0.20);
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .signup-btn:hover {
      background: var(--primary-dark);
    }

    .signup-btn:active {
      transform: scale(0.985);
    }

    .signup-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      min-height: 0;
      margin-top: 12px;
      text-align: center;
      color: var(--error);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.7;
    }

    .message.success {
      color: var(--primary-dark);
    }

    .login-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: var(--primary-dark);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      animation: contentIn 0.7s ease 0.4s forwards;
    }

    .note {
      margin-top: 16px;
      text-align: center;
      color: #9aa4a6;
      font-size: 11px;
      line-height: 1.8;
    }

    .orb {
      position: fixed;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: rgba(31, 143, 155, 0.035);
      top: -85px;
      left: -85px;
      pointer-events: none;
      animation: orbFloat 7s ease-in-out infinite;
    }

    .orb-two {
      position: fixed;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(31, 143, 155, 0.025);
      bottom: -55px;
      right: -45px;
      pointer-events: none;
      animation: orbFloatTwo 8s ease-in-out infinite;
    }

    @keyframes brandIn {
      from {
        opacity: 0;
        transform: translateY(-14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes contentIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes orbFloat {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(12px, 15px);
      }
    }

    @keyframes orbFloatTwo {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-10px, -12px);
      }
    }

    @media (max-width: 360px) {
      body {
        padding-left: 14px;
        padding-right: 14px;
      }

      .card {
        padding: 22px 17px 20px;
        border-radius: 26px;
      }

      .brand-main {
        font-size: 38px;
      }

      .heading h1 {
        font-size: 26px;
      }

      .input {
        height: 54px;
      }

      .signup-btn {
        height: 56px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="orb"></div>
  <div class="orb-two"></div>

  <main class="page">

    <header class="brand">
      <div class="brand-main">
        MZ<span>AD</span>
      </div>

      <div class="brand-sub">
        PHONE
      </div>
    </header>


    <section class="heading">

      <h1>إنشاء حساب</h1>

      <p>
        أنشئ حسابك وابدأ بيع وشراء الأجهزة
      </p>

    </section>


    <section class="card">

      <!-- الاسم -->

      <div class="field-group">

        <label
          class="field-label"
          for="fullName">
          الاسم الكامل
        </label>

        <input
          id="fullName"
          class="input"
          type="text"
          autocomplete="name"
          maxlength="60"
        >

        <div
          id="fullNameError"
          class="field-error">
        </div>

      </div>


      <!-- الهاتف -->

      <div class="field-group">

        <label
          class="field-label"
          for="phone">
          رقم الهاتف
        </label>

        <input
          id="phone"
          class="input phone-input"
          type="tel"
          autocomplete="tel"
          inputmode="numeric"
          maxlength="11"
        >

        <div
          id="phoneError"
          class="field-error">
        </div>

      </div>


      <!-- البريد -->

      <div class="field-group">

        <label
          class="field-label"
          for="email">
          البريد الإلكتروني
        </label>

        <input
          id="email"
          class="input email-input"
          type="email"
          autocomplete="email"
          maxlength="120"
        >

        <div
          id="emailError"
          class="field-error">
        </div>

      </div>


      <!-- كلمة المرور -->

      <div class="field-group">

        <label
          class="field-label"
          for="password">
          كلمة المرور
        </label>

        <div class="input-wrap">

          <input
            id="password"
            class="input password-input"
            type="password"
            autocomplete="new-password"
            maxlength="72"
          >

          <button
            type="button"
            class="toggle-password"
            data-target="password">
            إظهار
          </button>

        </div>

        <div class="password-rules">

          <div
            id="ruleLength"
            class="password-rule">
            6 أحرف أو أكثر
          </div>

          <div
            id="ruleUpper"
            class="password-rule">
            حرف إنجليزي كبير
          </div>

          <div
            id="ruleLower"
            class="password-rule">
            حرف إنجليزي صغير
          </div>

          <div
            id="ruleNumber"
            class="password-rule">
            رقم
          </div>

        </div>

        <div
          id="passwordError"
          class="field-error">
        </div>

      </div>


      <!-- تأكيد كلمة المرور -->

      <div class="field-group">

        <label
          class="field-label"
          for="confirmPassword">
          تأكيد كلمة المرور
        </label>

        <div class="input-wrap">

          <input
            id="confirmPassword"
            class="input password-input"
            type="password"
            autocomplete="new-password"
            maxlength="72"
          >

          <button
            type="button"
            class="toggle-password"
            data-target="confirmPassword">
            إظهار
          </button>

        </div>

        <div
          id="confirmPasswordError"
          class="field-error">
        </div>

      </div>


      <button
        id="signupBtn"
        class="signup-btn"
        type="button">
        إنشاء الحساب
      </button>


      <div
        id="message"
        class="message">
      </div>

    </section>


    <a
      href="index.html"
      class="login-link">
      لدي حساب بالفعل — تسجيل الدخول
    </a>


    <div class="note">
      بيانات الحساب تُحفظ ضمن حسابك وتستخدم لإدارة إعلاناتك ومزاداتك.
    </div>

  </main>


  <script type="module">

    import { supabase } from "./js/supabase.js";


    const fullName =
      document.getElementById("fullName");

    const phone =
      document.getElementById("phone");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const signupBtn =
      document.getElementById("signupBtn");

    const message =
      document.getElementById("message");


    const errors = {

      fullName:
        document.getElementById("fullNameError"),

      phone:
        document.getElementById("phoneError"),

      email:
        document.getElementById("emailError"),

      password:
        document.getElementById("passwordError"),

      confirmPassword:
        document.getElementById("confirmPasswordError")

    };


    const rules = {

      length:
        document.getElementById("ruleLength"),

      upper:
        document.getElementById("ruleUpper"),

      lower:
        document.getElementById("ruleLower"),

      number:
        document.getElementById("ruleNumber")

    };


    function setError(input, element, text) {

      input.classList.add("invalid");
      input.classList.remove("valid");

      element.textContent = text;
      element.classList.add("show");

    }


    function clearError(input, element) {

      input.classList.remove("invalid");

      element.textContent = "";
      element.classList.remove("show");

    }


    function setValid(input, element) {

      input.classList.remove("invalid");
      input.classList.add("valid");

      element.textContent = "";
      element.classList.remove("show");

    }


    function checkFullName() {

      const value =
        fullName.value.trim();

      if (!value) {

        return false;

      }

      if (value.length < 2) {

        setError(
          fullName,
          errors.fullName,
          "يرجى إدخال اسم صحيح"
        );

        return false;

      }

      setValid(
        fullName,
        errors.fullName
      );

      return true;

    }


    function checkPhone() {

      const value =
        phone.value.trim();

      if (!value) {

        return false;

      }

      if (!/^07\d{9}$/.test(value)) {

        setError(
          phone,
          errors.phone,
          "يرجى إدخال رقم هاتف صحيح"
        );

        return false;

      }

      setValid(
        phone,
        errors.phone
      );

      return true;

    }


    function checkEmail() {

      const value =
        email.value.trim();

      if (!value) {

        return false;

      }

      const valid =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/
          .test(value);

      if (!valid) {

        setError(
          email,
          errors.email,
          "يرجى إدخال بريد إلكتروني صحيح"
        );

        return false;

      }

      setValid(
        email,
        errors.email
      );

      return true;

    }


    function getPasswordRules(value) {

      return {

        length:
          value.length >= 6,

        upper:
          /[A-Z]/.test(value),

        lower:
          /[a-z]/.test(value),

        number:
          /\d/.test(value)

      };

    }


    function updatePasswordRules() {

      const value =
        password.value;

      const result =
        getPasswordRules(value);


      rules.length.classList.toggle(
        "ok",
        result.length
      );

      rules.upper.classList.toggle(
        "ok",
        result.upper
      );

      rules.lower.classList.toggle(
        "ok",
        result.lower
      );

      rules.number.classList.toggle(
        "ok",
        result.number
      );


      if (!value) {

        clearError(
          password,
          errors.password
        );

        return false;

      }


      const valid =
        result.length &&
        result.upper &&
        result.lower &&
        result.number;


      if (!valid) {

        setError(
          password,
          errors.password,
          "كلمة المرور لا تستوفي الشروط"
        );

        return false;

      }


      setValid(
        password,
        errors.password
      );

      return true;

    }


    function checkConfirmPassword() {

      const value =
        confirmPassword.value;

      if (!value) {

        return false;

      }

      if (
        value !== password.value
      ) {

        setError(
          confirmPassword,
          errors.confirmPassword,
          "كلمتا المرور غير متطابقتين"
        );

        return false;

      }

      setValid(
        confirmPassword,
        errors.confirmPassword
      );

      return true;

    }


    document
      .querySelectorAll(".toggle-password")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const target =
              document.getElementById(
                button.dataset.target
              );

            if (
              target.type === "password"
            ) {

              target.type = "text";
              button.textContent = "إخفاء";

            } else {

              target.type = "password";
              button.textContent = "إظهار";

            }

          }
        );

      });


    phone.addEventListener(
      "input",
      () => {

        phone.value =
          phone.value
            .replace(/\D/g, "")
            .slice(0, 11);

        if (phone.value) {
          checkPhone();
        }

      }
    );


    fullName.addEventListener(
      "input",
      () => {

        if (fullName.value) {
          checkFullName();
        }

      }
    );


    email.addEventListener(
      "input",
      () => {

        if (email.value) {
          checkEmail();
        }

      }
    );


    password.addEventListener(
      "input",
      () => {

        updatePasswordRules();

        if (confirmPassword.value) {
          checkConfirmPassword();
        }

      }
    );


    confirmPassword.addEventListener(
      "input",
      () => {

        if (confirmPassword.value) {
          checkConfirmPassword();
        }

      }
    );


    signupBtn.addEventListener(
      "click",
      async () => {

        const nameOK =
          checkFullName();

        const phoneOK =
          checkPhone();

        const emailOK =
          checkEmail();

        const passwordOK =
          updatePasswordRules();

        const confirmOK =
          checkConfirmPassword();


        if (
          !nameOK ||
          !phoneOK ||
          !emailOK ||
          !passwordOK ||
          !confirmOK
        ) {

          return;

        }


        signupBtn.disabled = true;

        signupBtn.textContent =
          "جاري إنشاء الحساب...";

        message.textContent = "";
        message.classList.remove("success");


        try {

          const {
            data,
            error
          } = await supabase.auth.signUp({

            email:
              email.value
                .trim()
                .toLowerCase(),

            password:
              password.value,

            options: {

              data: {

                full_name:
                  fullName.value.trim(),

                phone:
                  phone.value.trim()

              }

            }

          });


          if (error) {

            console.error(
              "Signup error:",
              error
            );

            message.textContent =
              "تعذر إنشاء الحساب: " +
              error.message;

            return;

          }


          if (!data.user) {

            message.textContent =
              "تعذر إنشاء الحساب. حاول مرة أخرى.";

            return;

          }


          if (data.session) {

            message.textContent =
              "تم إنشاء حسابك بنجاح.";

            message.classList.add(
              "success"
            );


            setTimeout(() => {

              window.location.replace(
                "index.html"
              );

            }, 1000);


          } else {

            message.textContent =
              "تم إنشاء الحساب. تحقق من بريدك الإلكتروني.";

            message.classList.add(
              "success"
            );


            setTimeout(() => {

              window.location.replace(
                "index.html"
              );

            }, 1800);

          }


        } catch (error) {

          console.error(
            "Unexpected signup error:",
            error
          );

          message.textContent =
            "حدث خطأ غير متوقع. حاول مرة أخرى.";


        } finally {

          signupBtn.disabled = false;

          signupBtn.textContent =
            "إنشاء الحساب";

        }

      }
    );

  </script>

</body>

</html>
