<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="format-detection"
    content="telephone=no,email=no,address=no">

  <title>إنشاء حساب - العراق الأخضر</title>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: "Cairo", Arial, sans-serif;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255,255,255,0.10) 0 90px,
          transparent 91px
        ),
        radial-gradient(
          circle at 100% 90%,
          rgba(255,255,255,0.08) 0 150px,
          transparent 151px
        ),
        #e91d4f;

      color: white;
    }

    .page {
      min-height: 100vh;
      padding: 25px 16px 45px;

      position: relative;
      overflow: hidden;
    }

    .circle {
      position: absolute;

      width: 230px;
      height: 230px;

      border-radius: 50%;

      background: rgba(255,255,255,0.04);

      bottom: -100px;
      left: -90px;
    }

    .content {
      width: 100%;
      max-width: 500px;

      margin: 0 auto;

      position: relative;
      z-index: 2;
    }

    .back {
      display: inline-block;

      background: #32b8c4;
      color: #111;

      text-decoration: none;

      padding: 8px 15px;

      border-radius: 13px;

      font-size: 13px;
      font-weight: 800;

      box-shadow: 0 4px 0 rgba(0,0,0,0.16);
    }

    .hero {
      text-align: center;

      margin-top: 45px;
      margin-bottom: 28px;
    }

    .tree {
      font-size: 58px;

      margin-bottom: 12px;
    }

    h1 {
      margin: 0;

      font-size: 38px;

      font-weight: 900;

      line-height: 1.3;
    }

    .subtitle {
      margin: 8px 0 0;

      font-size: 18px;

      font-weight: 600;
    }

    .card {
      background: #fffaf7;

      border-radius: 30px;

      padding: 28px 22px;

      box-shadow:
        0 12px 30px rgba(80,0,20,0.14);
    }

    .label {
      display: block;

      color: #17853e;

      font-size: 17px;

      font-weight: 800;

      margin-bottom: 8px;
    }

    input {
      width: 100%;

      border: 2px solid #eee;

      background: #f7f7f5;

      border-radius: 16px;

      padding: 15px 16px;

      margin-bottom: 17px;

      font-family: Arial, sans-serif;

      font-size: 17px;

      outline: none;
    }

    input:focus {
      border-color: #32b8c4;
    }

    .create {
      width: 100%;

      border: none;

      background: #32b8c4;
      color: #111;

      border-radius: 17px;

      padding: 15px;

      font-family: "Cairo", Arial, sans-serif;

      font-size: 18px;

      font-weight: 900;

      cursor: pointer;

      box-shadow: 0 5px 0 rgba(0,0,0,0.16);
    }

    .create:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.16);
    }

    .login {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #17853e;

      font-size: 15px;

      font-weight: 800;

      text-decoration: none;
    }

    #message {
      margin-top: 17px;

      text-align: center;

      color: #d71945;

      font-size: 14px;

      font-weight: 800;
    }

  </style>
</head>

<body>

  <div class="page">

    <div class="circle"></div>

    <main class="content">

      <a
        href="index.html"
        class="back">
        رجوع
      </a>

      <section class="hero">

        <div class="tree">🌳</div>

        <h1>
          إنشاء حساب
        </h1>

        <p class="subtitle">
          انضم إلى العراق الأخضر
        </p>

      </section>


      <section class="card">

        <label class="label">
          البريد الإلكتروني
        </label>

        <input
          id="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="example@gmail.com">


        <label class="label">
          كلمة المرور
        </label>

        <input
          id="password"
          type="password"
          autocomplete="new-password"
          placeholder="كلمة المرور">


        <label class="label">
          تأكيد كلمة المرور
        </label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="أعد كتابة كلمة المرور">


        <button
          class="create"
          id="createBtn">
          إنشاء الحساب
        </button>

        <div id="message"></div>

        <a
          href="index.html"
          class="login">
          عندك حساب؟ تسجيل الدخول
        </a>

      </section>

    </main>

  </div>


  <script type="module">

    import { auth } from "./js/firebase.js";

    import {
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const createBtn =
      document.getElementById("createBtn");

    const message =
      document.getElementById("message");


    createBtn.addEventListener("click", async () => {

      const emailValue =
        email.value.trim();

      const passwordValue =
        password.value;

      const confirmValue =
        confirmPassword.value;


      message.textContent = "";


      if (!emailValue || !passwordValue || !confirmValue) {

        message.textContent =
          "املأ جميع الحقول.";

        return;
      }


      if (passwordValue.length < 6) {

        message.textContent =
          "كلمة المرور يجب أن تكون 6 أحرف أو أكثر.";

        return;
      }


      if (passwordValue !== confirmValue) {

        message.textContent =
          "كلمتا المرور غير متطابقتين.";

        return;
      }


      createBtn.disabled = true;

      createBtn.textContent =
        "جاري إنشاء الحساب...";


      try {

        await createUserWithEmailAndPassword(
          auth,
          emailValue,
          passwordValue
        );


        window.location.href =
          "home.html";


      } catch (error) {

        console.error(error);


        if (error.code === "auth/email-already-in-use") {

          message.textContent =
            "هذا البريد مسجل مسبقاً.";

        } else if (error.code === "auth/invalid-email") {

          message.textContent =
            "البريد الإلكتروني غير صحيح.";

        } else if (error.code === "auth/weak-password") {

          message.textContent =
            "كلمة المرور ضعيفة.";

        } else {

          message.textContent =
            "حدث خطأ أثناء إنشاء الحساب.";

        }


        createBtn.disabled = false;

        createBtn.textContent =
          "إنشاء الحساب";

      }

    });

  </script>

</body>

</html>
