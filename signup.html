<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no,email=no,address=no">

  <title>إنشاء حساب - MZAD PHONE</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary: #2495a0;
      --primary-dark: #197984;
      --dark: #172124;
      --muted: #7d898c;
      --border: #e1e7e8;
      --surface: #f7f9f9;
      --error: #c9684e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 22px 17px 28px;
      font-family: "Cairo", sans-serif;
      color: var(--dark);

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(36, 149, 160, 0.08),
          transparent 28%
        ),
        linear-gradient(
          145deg,
          #f8fbfb,
          #ffffff 55%,
          #f6f9f9
        );

      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      margin: 8px 0 25px;

      opacity: 0;
      transform: translateY(-10px);
      animation: enter 0.6s ease forwards;
    }

    .brand-main {
      font-family: Arial, sans-serif;
      font-size: 40px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .brand-main span {
      color: var(--primary);
    }

    .brand-sub {
      margin-top: 5px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 5px;
      color: var(--muted);
      direction: ltr;
    }

    .heading {
      margin-bottom: 19px;

      opacity: 0;
      transform: translateY(10px);
      animation: enter 0.6s ease 0.08s forwards;
    }

    .heading h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.35;
      font-weight: 800;
    }

    .heading p {
      margin: 5px 0 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .card {
      padding: 22px 20px 21px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #e5eaeb;
      border-radius: 27px;

      box-shadow:
        0 16px 42px rgba(23, 33, 36, 0.065),
        0 2px 8px rgba(23, 33, 36, 0.025);

      opacity: 0;
      transform: translateY(12px);
      animation: enter 0.65s ease 0.16s forwards;
    }

    .field-group {
      margin-bottom: 13px;
    }

    .field-group:last-of-type {
      margin-bottom: 15px;
    }

    .field-label {
      display: block;
      margin: 0 0 6px;
      padding-right: 2px;

      font-size: 12.5px;
      font-weight: 700;
      color: #465356;
    }

    .input-wrap {
      position: relative;
    }

    .input {
      width: 100%;
      height: 54px;

      border: 1.5px solid var(--border);
      border-radius: 16px;

      background: var(--surface);
      color: var(--dark);

      padding: 0 15px;

      font-family: "Cairo", sans-serif;
      font-size: 15px;

      outline: none;

      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .input:focus {
      background: #fff;
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px rgba(36, 149, 160, 0.08);
    }

    .input.invalid {
      border-color: var(--error);

      box-shadow:
        0 0 0 3px rgba(201, 104, 78, 0.06);
    }

    .input.valid {
      border-color: var(--primary);
    }

    .phone-input,
    .email-input {
      direction: ltr;
      text-align: right;
    }

    .password-input {
      padding-left: 58px;
    }

    .toggle-password {
      position: absolute;
      left: 11px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;
      background: transparent;

      padding: 6px;

      color: #8b9699;
      font-family: "Cairo", sans-serif;
      font-size: 11px;
      font-weight: 700;

      cursor: pointer;
    }

    .field-error {
      display: none;

      margin-top: 5px;
      padding-right: 3px;

      color: var(--error);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
    }

    .field-error.show {
      display: block;
    }

    .password-rules {
      display: none;

      margin-top: 5px;
      padding: 0 3px;

      gap: 4px;
      flex-wrap: wrap;
    }

    .password-rules.show {
      display: flex;
    }

    .password-rule {
      display: none;

      font-size: 10.5px;
      color: #9aa4a6;
      white-space: nowrap;
    }

    .password-rule.show {
      display: inline;
    }

    .password-rule::before {
      content: "• ";
    }

    .signup-btn {
      width: 100%;
      height: 57px;

      margin-top: 2px;

      border: 0;
      border-radius: 17px;

      background: var(--primary);
      color: #fff;

      font-family: "Cairo", sans-serif;
      font-size: 15.5px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 9px 20px rgba(36, 149, 160, 0.18);

      transition:
        transform 0.18s ease,
        background 0.18s ease;
    }

    .signup-btn:active {
      transform: scale(0.985);
    }

    .signup-btn:hover {
      background: var(--primary-dark);
    }

    .signup-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      margin-top: 9px;

      text-align: center;

      font-size: 11.5px;
      font-weight: 600;

      color: var(--error);

      line-height: 1.6;
    }

    .message.success {
      color: var(--primary-dark);
    }

    .login-link {
      display: block;

      margin-top: 17px;

      text-align: center;

      color: var(--primary-dark);
      text-decoration: none;

      font-size: 13.5px;
      font-weight: 700;

      opacity: 0;
      animation: enter 0.6s ease 0.28s forwards;
    }

    .note {
      margin-top: 12px;

      text-align: center;

      color: #a0a9ab;
      font-size: 10.5px;
      line-height: 1.7;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 360px) {
      body {
        padding-left: 13px;
        padding-right: 13px;
      }

      .card {
        padding: 20px 17px;
      }

      .input {
        height: 52px;
      }

      .signup-btn {
        height: 55px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="brand">
      <div class="brand-main">
        MZ<span>AD</span>
      </div>

      <div class="brand-sub">
        PHONE
      </div>
    </header>

    <section class="heading">

      <h1>إنشاء حساب</h1>

      <p>
        أنشئ حسابك وابدأ بيع وشراء الأجهزة
      </p>

    </section>

    <section class="card">

      <div class="field-group">

        <label
          class="field-label"
          for="fullName">
          الاسم الكامل
        </label>

        <input
          id="fullName"
          class="input"
          type="text"
          autocomplete="name"
          maxlength="60"
        >

        <div
          id="fullNameError"
          class="field-error">
        </div>

      </div>


      <div class="field-group">

        <label
          class="field-label"
          for="phone">
          رقم الهاتف
        </label>

        <input
          id="phone"
          class="input phone-input"
          type="tel"
          autocomplete="tel"
          inputmode="numeric"
          maxlength="11"
        >

        <div
          id="phoneError"
          class="field-error">
        </div>

      </div>


      <div class="field-group">

        <label
          class="field-label"
          for="email">
          البريد الإلكتروني
        </label>

        <input
          id="email"
          class="input email-input"
          type="email"
          autocomplete="email"
          maxlength="120"
        >

        <div
          id="emailError"
          class="field-error">
        </div>

      </div>


      <div class="field-group">

        <label
          class="field-label"
          for="password">
          كلمة المرور
        </label>

        <div class="input-wrap">

          <input
            id="password"
            class="input password-input"
            type="password"
            autocomplete="new-password"
            maxlength="72"
          >

          <button
            type="button"
            class="toggle-password"
            data-target="password">
            إظهار
          </button>

        </div>

        <div
          id="passwordRules"
          class="password-rules">

          <span
            id="ruleLength"
            class="password-rule">
            6 أحرف أو أكثر
          </span>

          <span
            id="ruleUpper"
            class="password-rule">
            حرف كبير
          </span>

          <span
            id="ruleLower"
            class="password-rule">
            حرف صغير
          </span>

          <span
            id="ruleNumber"
            class="password-rule">
            رقم
          </span>

        </div>

        <div
          id="passwordError"
          class="field-error">
        </div>

      </div>


      <div class="field-group">

        <label
          class="field-label"
          for="confirmPassword">
          تأكيد كلمة المرور
        </label>

        <div class="input-wrap">

          <input
            id="confirmPassword"
            class="input password-input"
            type="password"
            autocomplete="new-password"
            maxlength="72"
          >

          <button
            type="button"
            class="toggle-password"
            data-target="confirmPassword">
            إظهار
          </button>

        </div>

        <div
          id="confirmPasswordError"
          class="field-error">
        </div>

      </div>


      <button
        id="signupBtn"
        class="signup-btn"
        type="button">
        إنشاء الحساب
      </button>


      <div
        id="message"
        class="message">
      </div>

    </section>


    <a
      href="index.html"
      class="login-link">
      لدي حساب بالفعل — تسجيل الدخول
    </a>


    <div class="note">
      بيانات الحساب تُحفظ ضمن حسابك وتستخدم لإدارة إعلاناتك ومزاداتك.
    </div>

  </main>


  <script type="module">

    import { supabase } from "./js/supabase.js";


    const fullName =
      document.getElementById("fullName");

    const phone =
      document.getElementById("phone");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const signupBtn =
      document.getElementById("signupBtn");

    const message =
      document.getElementById("message");


    const errors = {

      fullName:
        document.getElementById("fullNameError"),

      phone:
        document.getElementById("phoneError"),

      email:
        document.getElementById("emailError"),

      password:
        document.getElementById("passwordError"),

      confirm:
        document.getElementById(
          "confirmPasswordError"
        )

    };


    const passwordRules =
      document.getElementById(
        "passwordRules"
      );


    const ruleLength =
      document.getElementById(
        "ruleLength"
      );

    const ruleUpper =
      document.getElementById(
        "ruleUpper"
      );

    const ruleLower =
      document.getElementById(
        "ruleLower"
      );

    const ruleNumber =
      document.getElementById(
        "ruleNumber"
      );


    /* =========================
       أدوات الأخطاء
    ========================= */

    function showError(
      input,
      box,
      text
    ) {

      input.classList.add("invalid");
      input.classList.remove("valid");

      box.textContent = text;
      box.classList.add("show");

    }


    function clearError(
      input,
      box
    ) {

      input.classList.remove("invalid");
      input.classList.remove("valid");

      box.textContent = "";
      box.classList.remove("show");

    }


    function markValid(
      input,
      box
    ) {

      input.classList.remove("invalid");
      input.classList.add("valid");

      box.textContent = "";
      box.classList.remove("show");

    }


    /* =========================
       الاسم
    ========================= */

    function checkName() {

      const value =
        fullName.value.trim();


      if (!value) {

        showError(
          fullName,
          errors.fullName,
          "يرجى إدخال الاسم الكامل"
        );

        return false;

      }


      if (value.length < 2) {

        showError(
          fullName,
          errors.fullName,
          "يرجى إدخال اسم صحيح"
        );

        return false;

      }


      markValid(
        fullName,
        errors.fullName
      );

      return true;

    }


    /* =========================
       الهاتف
    ========================= */

    function checkPhone() {

      const value =
        phone.value.trim();


      if (!value) {

        showError(
          phone,
          errors.phone,
          "يرجى إدخال رقم الهاتف"
        );

        return false;

      }


      if (!/^07\d{9}$/.test(value)) {

        showError(
          phone,
          errors.phone,
          "يرجى إدخال رقم هاتف صحيح"
        );

        return false;

      }


      markValid(
        phone,
        errors.phone
      );

      return true;

    }


    /* =========================
       البريد
    ========================= */

    function checkEmail() {

      const value =
        email.value.trim();


      if (!value) {

        showError(
          email,
          errors.email,
          "يرجى إدخال البريد الإلكتروني"
        );

        return false;

      }


      if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)
      ) {

        showError(
          email,
          errors.email,
          "يرجى إدخال بريد إلكتروني صحيح"
        );

        return false;

      }


      markValid(
        email,
        errors.email
      );

      return true;

    }


    /* =========================
       كلمة المرور
    ========================= */

    function passwordStatus(value) {

      return {

        length:
          value.length >= 6,

        upper:
          /[A-Z]/.test(value),

        lower:
          /[a-z]/.test(value),

        number:
          /\d/.test(value)

      };

    }


    function updatePassword() {

      const value =
        password.value;


      if (!value) {

        passwordRules.classList.remove(
          "show"
        );

        ruleLength.classList.remove("show");
        ruleUpper.classList.remove("show");
        ruleLower.classList.remove("show");
        ruleNumber.classList.remove("show");

        showError(
          password,
          errors.password,
          "يرجى إدخال كلمة المرور"
        );

        return false;

      }


      const result =
        passwordStatus(value);


      passwordRules.classList.add(
        "show"
      );


      ruleLength.classList.toggle(
        "show",
        !result.length
      );

      ruleUpper.classList.toggle(
        "show",
        !result.upper
      );

      ruleLower.classList.toggle(
        "show",
        !result.lower
      );

      ruleNumber.classList.toggle(
        "show",
        !result.number
      );


      const complete =
        result.length &&
        result.upper &&
        result.lower &&
        result.number;


      if (!complete) {

        password.classList.add(
          "invalid"
        );

        password.classList.remove(
          "valid"
        );

        errors.password.textContent = "";
        errors.password.classList.remove("show");

        return false;

      }


      password.classList.remove(
        "invalid"
      );

      password.classList.add(
        "valid"
      );

      passwordRules.classList.remove(
        "show"
      );

      clearError(
        password,
        errors.password
      );


      return true;

    }


    /* =========================
       تأكيد كلمة المرور
    ========================= */

    function checkConfirm(
      showEmptyError = true
    ) {

      const value =
        confirmPassword.value;


      if (!value) {

        if (showEmptyError) {

          showError(
            confirmPassword,
            errors.confirm,
            "يرجى تأكيد كلمة المرور"
          );

        }

        return false;

      }


      if (
        value !== password.value
      ) {

        showError(
          confirmPassword,
          errors.confirm,
          "كلمتا المرور غير متطابقتين"
        );

        return false;

      }


      markValid(
        confirmPassword,
        errors.confirm
      );

      return true;

    }


    /* =========================
       إظهار / إخفاء كلمة المرور
    ========================= */

    document
      .querySelectorAll(".toggle-password")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const input =
              document.getElementById(
                button.dataset.target
              );


            if (
              input.type === "password"
            ) {

              input.type = "text";

              button.textContent =
                "إخفاء";

            } else {

              input.type = "password";

              button.textContent =
                "إظهار";

            }

          }
        );

      });


    /* =========================
       الهاتف أثناء الكتابة
    ========================= */

    phone.addEventListener(
      "input",
      () => {

        phone.value =
          phone.value
            .replace(/\D/g, "")
            .slice(0, 11);


        if (phone.value) {

          checkPhone();

        } else {

          clearError(
            phone,
            errors.phone
          );

        }

      }
    );


    /* =========================
       الاسم أثناء الكتابة
    ========================= */

    fullName.addEventListener(
      "input",
      () => {

        if (fullName.value) {

          checkName();

        } else {

          clearError(
            fullName,
            errors.fullName
          );

        }

      }
    );


    /* =========================
       البريد أثناء الكتابة
    ========================= */

    email.addEventListener(
      "input",
      () => {

        if (email.value) {

          checkEmail();

        } else {

          clearError(
            email,
            errors.email
          );

        }

      }
    );


    /* =========================
       كلمة المرور أثناء الكتابة
    ========================= */

    password.addEventListener(
      "input",
      () => {

        updatePassword();

        if (confirmPassword.value) {

          checkConfirm(false);

        }

      }
    );


    /* =========================
       التأكيد أثناء الكتابة
    ========================= */

    confirmPassword.addEventListener(
      "input",
      () => {

        checkConfirm(true);

      }
    );


    /* =========================
       إنشاء الحساب
    ========================= */

    signupBtn.addEventListener(
      "click",
      async () => {

        message.textContent = "";

        message.classList.remove(
          "success"
        );


        /* =========================
           فحص الحقول المحلية
        ========================= */

        const nameOK =
          checkName();

        const phoneOK =
          checkPhone();

        const emailOK =
          checkEmail();

        const passwordOK =
          updatePassword();

        const confirmOK =
          checkConfirm(true);


        if (
          !nameOK ||
          !phoneOK ||
          !emailOK ||
          !passwordOK ||
          !confirmOK
        ) {

          message.textContent =
            "يرجى إكمال الحقول المطلوبة وتصحيح الأخطاء أعلاه.";

          return;

        }


        signupBtn.disabled = true;

        signupBtn.textContent =
          "جاري التحقق...";


        try {

          /* =========================
             فحص الهاتف والبريد
             بنفس الوقت
          ========================= */

          const [
            phoneResult,
            emailResult
          ] =
            await Promise.all([

              supabase.rpc(
                "phone_exists",
                {
                  p_phone:
                    phone.value.trim()
                }
              ),

              supabase.rpc(
                "email_exists",
                {
                  p_email:
                    email.value
                      .trim()
                      .toLowerCase()
                }
              )

            ]);


          const phoneTaken =
            phoneResult.data === true;

          const emailTaken =
            emailResult.data === true;


          /* =========================
             خطأ أثناء فحص الهاتف
          ========================= */

          if (phoneResult.error) {

            console.error(
              "PHONE CHECK ERROR:",
              phoneResult.error
            );

          }


          /* =========================
             خطأ أثناء فحص البريد
          ========================= */

          if (emailResult.error) {

            console.error(
              "EMAIL CHECK ERROR:",
              emailResult.error
            );

          }


          /*
           * إذا صار خطأ تقني بالفحص
           * نوقف العملية ولا ننشئ حساب
           */

          if (
            phoneResult.error ||
            emailResult.error
          ) {

            message.textContent =
              "تعذر التحقق من بيانات الحساب. حاول مرة أخرى.";

            return;

          }


          /* =========================
             عرض أخطاء الاثنين معاً
          ========================= */

          let duplicateFound = false;


          if (phoneTaken) {

            showError(
              phone,
              errors.phone,
              "هذا الرقم مستخدم مسبقاً، جرّب رقم هاتف آخر."
            );

            duplicateFound = true;

          }


          if (emailTaken) {

            showError(
              email,
              errors.email,
              "هذا البريد الإلكتروني مستخدم مسبقاً، جرّب بريد إلكتروني آخر أو سجّل الدخول."
            );

            duplicateFound = true;

          }


          /*
           * إذا واحد أو الاثنين مستخدمين
           * لا ننشئ الحساب
           */

          if (duplicateFound) {

            if (
              phoneTaken &&
              emailTaken
            ) {

              message.textContent =
                "رقم الهاتف والبريد الإلكتروني مستخدمان مسبقاً.";

            } else if (phoneTaken) {

              message.textContent =
                "رقم الهاتف مستخدم مسبقاً.";

            } else {

              message.textContent =
                "البريد الإلكتروني مستخدم مسبقاً.";

            }

            return;

          }


          /* =========================
             إنشاء الحساب
          ========================= */

          signupBtn.textContent =
            "جاري إنشاء الحساب...";


          const {
            data,
            error: signupError
          } =
            await supabase.auth.signUp({

              email:
                email.value
                  .trim()
                  .toLowerCase(),

              password:
                password.value,

              options: {

                data: {

                  full_name:
                    fullName.value.trim(),

                  phone:
                    phone.value.trim()

                }

              }

            });


          /* =========================
             خطأ Supabase
          ========================= */

          if (signupError) {

            console.error(
              "SIGNUP ERROR:",
              signupError
            );


            const code =
              String(
                signupError.code || ""
              ).toLowerCase();


            const msg =
              String(
                signupError.message || ""
              );


            const lowerMsg =
              msg.toLowerCase();


            /* البريد مستخدم */

            if (

              code === "email_exists" ||

              code === "user_already_exists" ||

              lowerMsg.includes(
                "user already registered"
              ) ||

              lowerMsg.includes(
                "email already registered"
              ) ||

              lowerMsg.includes(
                "email_exists"
              )

            ) {

              showError(
                email,
                errors.email,
                "هذا البريد الإلكتروني مستخدم مسبقاً، جرّب بريد إلكتروني آخر أو سجّل الدخول."
              );

              message.textContent =
                "البريد الإلكتروني مستخدم مسبقاً.";

              return;

            }


            /* الهاتف مستخدم */

            if (

              lowerMsg.includes("phone") ||

              lowerMsg.includes(
                "profiles_phone_key"
              ) ||

              lowerMsg.includes(
                "duplicate key"
              ) ||

              lowerMsg.includes(
                "unique constraint"
              )

            ) {

              showError(
                phone,
                errors.phone,
                "هذا الرقم مستخدم مسبقاً، جرّب رقم هاتف آخر."
              );

              message.textContent =
                "رقم الهاتف مستخدم مسبقاً.";

              return;

            }


            message.textContent =
              "حدث خطأ أثناء إنشاء الحساب. حاول مرة أخرى.";

            return;

          }


          /* =========================
             حماية إضافية للبريد
          ========================= */

          if (
            data?.user &&
            Array.isArray(
              data.user.identities
            ) &&
            data.user.identities.length === 0
          ) {

            showError(
              email,
              errors.email,
              "هذا البريد الإلكتروني مستخدم مسبقاً، جرّب بريد إلكتروني آخر أو سجّل الدخول."
            );

            message.textContent =
              "البريد الإلكتروني مستخدم مسبقاً.";

            return;

          }


          /* =========================
             لا يوجد مستخدم
          ========================= */

          if (!data?.user) {

            message.textContent =
              "لم يتم إنشاء الحساب. حاول مرة أخرى.";

            return;

          }


          /* =========================
             نجاح
          ========================= */

          if (data.session) {

            message.textContent =
              "تم إنشاء حسابك بنجاح.";

            message.classList.add(
              "success"
            );


            setTimeout(() => {

              window.location.replace(
                "index.html"
              );

            }, 1000);

          } else {

            message.textContent =
              "تم إنشاء الحساب. تحقق من بريدك الإلكتروني.";

            message.classList.add(
              "success"
            );


            setTimeout(() => {

              window.location.replace(
                "index.html"
              );

            }, 1800);

          }


        } catch (err) {

          console.error(
            "UNEXPECTED SIGNUP ERROR:",
            err
          );


          message.textContent =
            "حدث خطأ غير متوقع أثناء إنشاء الحساب. حاول مرة أخرى.";

        } finally {

          signupBtn.disabled =
            false;

          signupBtn.textContent =
            "إنشاء الحساب";

        }

      }
    );

  </script>

</body>

</html>
