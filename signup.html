<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إنشاء حساب | MZAD PHONE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fafcfc;
      color: #172124;
      font-family: "Cairo", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 34px 22px 28px;
    }

    .brand {
      text-align: center;
      margin-bottom: 27px;
    }

    .brand-main {
      font-size: 38px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .brand-main span {
      color: #2495a0;
    }

    .brand-sub {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #7d898c;
    }

    .title {
      font-size: 25px;
      font-weight: 800;
      text-align: center;
      margin: 0;
    }

    .subtitle {
      text-align: center;
      color: #7d898c;
      font-size: 13px;
      margin: 6px 0 24px;
    }

    .field {
      margin-bottom: 13px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      height: 49px;
      border: 1px solid #e1e7e8;
      border-radius: 13px;
      background: #fff;
      padding: 0 14px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      color: #172124;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2495a0;
      box-shadow: 0 0 0 3px rgba(36, 149, 160, 0.09);
    }

    input.error {
      border-color: #c9684e;
    }

    .error-text {
      color: #c9684e;
      font-size: 11px;
      font-weight: 600;
      margin-top: 5px;
      line-height: 1.5;
    }

    .password-rules {
      display: none;
      margin-top: 7px;
      padding: 8px 11px;
      border-radius: 10px;
      background: #f5f8f8;
    }

    .password-rule {
      font-size: 10px;
      color: #c9684e;
      margin: 2px 0;
    }

    button {
      width: 100%;
      height: 51px;
      border: 0;
      border-radius: 14px;
      background: #2495a0;
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.985);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .form-error {
      color: #c9684e;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      margin-top: 9px;
      line-height: 1.6;
      min-height: 0;
    }

    .success {
      display: none;
      text-align: center;
      color: #2495a0;
      font-size: 12px;
      margin-top: 12px;
    }

    .login-link {
      text-align: center;
      margin-top: 17px;
      font-size: 12px;
      color: #7d898c;
    }

    .login-link a {
      color: #2495a0;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brand">
      <div class="brand-main">MZ<span>AD</span></div>
      <div class="brand-sub">PHONE</div>
    </div>

    <h1 class="title">إنشاء حساب</h1>

    <p class="subtitle">
      أنشئ حسابك وابدأ باستخدام مزاد فون
    </p>

    <form id="signupForm" novalidate>

      <!-- الاسم -->
      <div class="field">
        <label for="fullName">الاسم الكامل</label>

        <input
          id="fullName"
          type="text"
          autocomplete="name"
        >

        <div id="nameError" class="error-text"></div>
      </div>

      <!-- الهاتف -->
      <div class="field">
        <label for="phone">رقم الهاتف</label>

        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          maxlength="11"
          autocomplete="tel"
        >

        <div id="phoneError" class="error-text"></div>
      </div>

      <!-- البريد -->
      <div class="field">
        <label for="email">البريد الإلكتروني</label>

        <input
          id="email"
          type="email"
          autocomplete="email"
        >

        <div id="emailError" class="error-text"></div>
      </div>

      <!-- كلمة المرور -->
      <div class="field">
        <label for="password">كلمة المرور</label>

        <input
          id="password"
          type="password"
          autocomplete="new-password"
        >

        <div id="passwordRules" class="password-rules">

          <div id="ruleLength" class="password-rule">
            يجب أن تحتوي على 6 أحرف أو أكثر
          </div>

          <div id="ruleUpper" class="password-rule">
            يجب أن تحتوي على حرف كبير
          </div>

          <div id="ruleLower" class="password-rule">
            يجب أن تحتوي على حرف صغير
          </div>

          <div id="ruleNumber" class="password-rule">
            يجب أن تحتوي على رقم
          </div>

        </div>

        <div id="passwordError" class="error-text"></div>
      </div>

      <!-- تأكيد كلمة المرور -->
      <div class="field">
        <label for="confirmPassword">تأكيد كلمة المرور</label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
        >

        <div id="confirmError" class="error-text"></div>
      </div>

      <!-- إنشاء الحساب -->
      <button id="signupButton" type="submit">
        إنشاء الحساب
      </button>

      <!-- الخطأ العام تحت الزر -->
      <div id="formError" class="form-error"></div>

      <!-- نجاح -->
      <div id="successMessage" class="success">
        تم إنشاء الحساب بنجاح
      </div>

    </form>

    <div class="login-link">
      لديك حساب بالفعل؟
      <a href="index.html">تسجيل الدخول</a>
    </div>

  </main>


  <script type="module">

    import { supabase } from "./js/supabase.js";


    /* =========================
       العناصر
    ========================= */

    const form =
      document.getElementById("signupForm");

    const button =
      document.getElementById("signupButton");

    const formError =
      document.getElementById("formError");


    const fullName =
      document.getElementById("fullName");

    const phone =
      document.getElementById("phone");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirmPassword");


    const nameError =
      document.getElementById("nameError");

    const phoneError =
      document.getElementById("phoneError");

    const emailError =
      document.getElementById("emailError");

    const passwordError =
      document.getElementById("passwordError");

    const confirmError =
      document.getElementById("confirmError");


    const passwordRules =
      document.getElementById("passwordRules");

    const ruleLength =
      document.getElementById("ruleLength");

    const ruleUpper =
      document.getElementById("ruleUpper");

    const ruleLower =
      document.getElementById("ruleLower");

    const ruleNumber =
      document.getElementById("ruleNumber");


    /* =========================
       الأخطاء
    ========================= */

    function clearError(input, errorElement) {

      input.classList.remove("error");

      errorElement.textContent = "";

    }


    function setError(
      input,
      errorElement,
      message
    ) {

      input.classList.add("error");

      errorElement.textContent = message;

    }


    /* =========================
       الاسم
    ========================= */

    function checkName() {

      const value =
        fullName.value.trim();


      if (!value) {

        setError(
          fullName,
          nameError,
          "يرجى إدخال الاسم الكامل"
        );

        return false;
      }


      clearError(
        fullName,
        nameError
      );

      return true;

    }


    /* =========================
       الهاتف
    ========================= */

    function checkPhone() {

      const value =
        phone.value.trim();


      if (!value) {

        setError(
          phone,
          phoneError,
          "يرجى إدخال رقم الهاتف"
        );

        return false;
      }


      if (!/^07\d{9}$/.test(value)) {

        setError(
          phone,
          phoneError,
          "يرجى إدخال رقم هاتف صحيح"
        );

        return false;
      }


      clearError(
        phone,
        phoneError
      );

      return true;

    }


    /* =========================
       البريد
    ========================= */

    function checkEmail() {

      const value =
        email.value.trim();


      if (!value) {

        setError(
          email,
          emailError,
          "يرجى إدخال البريد الإلكتروني"
        );

        return false;
      }


      const validEmail =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);


      if (!validEmail) {

        setError(
          email,
          emailError,
          "يرجى إدخال بريد إلكتروني صحيح"
        );

        return false;
      }


      clearError(
        email,
        emailError
      );

      return true;

    }


    /* =========================
       كلمة المرور
    ========================= */

    function updatePassword() {

      const value =
        password.value;


      if (!value) {

        passwordRules.style.display =
          "none";

        password.classList.remove(
          "error"
        );

        passwordError.textContent =
          "";

        return false;
      }


      passwordRules.style.display =
        "block";


      const lengthOK =
        value.length >= 6;

      const upperOK =
        /[A-Z]/.test(value);

      const lowerOK =
        /[a-z]/.test(value);

      const numberOK =
        /\d/.test(value);


      ruleLength.style.display =
        lengthOK ? "none" : "block";

      ruleUpper.style.display =
        upperOK ? "none" : "block";

      ruleLower.style.display =
        lowerOK ? "none" : "block";

      ruleNumber.style.display =
        numberOK ? "none" : "block";


      const valid =
        lengthOK &&
        upperOK &&
        lowerOK &&
        numberOK;


      if (valid) {

        passwordRules.style.display =
          "none";

        clearError(
          password,
          passwordError
        );

      } else {

        password.classList.add(
          "error"
        );

      }


      /*
        إذا كلمة المرور مكتوبة،
        نخلي التأكيد يتحدث أيضًا.
      */

      if (
        confirmPassword.value
      ) {

        checkConfirm();

      }


      return valid;

    }


    /* =========================
       تأكيد كلمة المرور
    ========================= */

    function checkConfirm() {

      const value =
        confirmPassword.value;

      const original =
        password.value;


      /*
        فارغ
      */

      if (!value) {

        setError(
          confirmPassword,
          confirmError,
          "يرجى تأكيد كلمة المرور"
        );

        return false;

      }


      /*
        غير متطابق
      */

      if (value !== original) {

        setError(
          confirmPassword,
          confirmError,
          "كلمتا المرور غير متطابقتين"
        );

        return false;

      }


      /*
        صحيح
      */

      clearError(
        confirmPassword,
        confirmError
      );

      return true;

    }


    /* =========================
       أخطاء الحساب
    ========================= */

    function showEmailUsedError() {

      setError(
        email,
        emailError,
        "هذا البريد الإلكتروني مستخدم مسبقاً، جرّب بريد إلكتروني آخر أو سجّل الدخول."
      );

    }


    function showPhoneUsedError() {

      setError(
        phone,
        phoneError,
        "رقم الهاتف مستخدم مسبقاً"
      );

    }


    /* =========================
       الهاتف
    ========================= */

    phone.addEventListener(
      "input",
      () => {

        phone.value =
          phone.value
            .replace(/\D/g, "")
            .slice(0, 11);

        clearError(
          phone,
          phoneError
        );

      }
    );


    /* =========================
       الاسم
    ========================= */

    fullName.addEventListener(
      "input",
      () => {

        if (
          fullName.value.trim()
        ) {

          clearError(
            fullName,
            nameError
          );

        }

      }
    );


    /* =========================
       البريد
    ========================= */

    email.addEventListener(
      "input",
      () => {

        clearError(
          email,
          emailError
        );

      }
    );


    /* =========================
       كلمة المرور
    ========================= */

    password.addEventListener(
      "input",
      () => {

        updatePassword();

        /*
          إذا التأكيد فارغ،
          ما نظهر الخطأ أثناء الكتابة.
          يظهر عند الضغط على إنشاء الحساب.
        */

        if (
          !confirmPassword.value
        ) {

          confirmPassword.classList.remove(
            "error"
          );

          confirmError.textContent =
            "";

        }

      }
    );


    /* =========================
       تأكيد كلمة المرور
    ========================= */

    confirmPassword.addEventListener(
      "input",
      () => {

        checkConfirm();

      }
    );


    /* =========================
       إنشاء الحساب
    ========================= */

    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        /*
          نمسح الخطأ العام
        */

        formError.textContent =
          "";


        /*
          نفحص كل الحقول
        */

        const validName =
          checkName();

        const validPhone =
          checkPhone();

        const validEmail =
          checkEmail();

        const validPassword =
          updatePassword();

        const validConfirm =
          checkConfirm();


        /*
          إذا أكو أي خطأ
        */

        if (
          !validName ||
          !validPhone ||
          !validEmail ||
          !validPassword ||
          !validConfirm
        ) {

          formError.textContent =
            "يرجى إكمال الحقول المطلوبة وتصحيح الأخطاء أعلاه.";

          /*
            نروح لأول حقل بيه خطأ
          */

          if (!validName) {

            fullName.focus();

          } else if (!validPhone) {

            phone.focus();

          } else if (!validEmail) {

            email.focus();

          } else if (!validPassword) {

            password.focus();

          } else if (!validConfirm) {

            confirmPassword.focus();

          }

          return;

        }


        /* =========================
           إرسال إلى Supabase
        ========================= */

        button.disabled = true;

        button.textContent =
          "جاري إنشاء الحساب...";


        try {

          const {
            data,
            error: signupError
          } =
            await supabase.auth.signUp({

              email:
                email.value.trim(),

              password:
                password.value,

              options: {

                data: {

                  full_name:
                    fullName.value.trim(),

                  phone:
                    phone.value.trim()

                }

              }

            });


          /* =========================
             خطأ التسجيل
          ========================= */

          if (signupError) {

            const message =
              String(
                signupError.message || ""
              ).toLowerCase();


            const code =
              String(
                signupError.code || ""
              ).toLowerCase();


            const emailAlreadyExists =
              code.includes(
                "email_exists"
              ) ||

              code.includes(
                "user_already_exists"
              ) ||

              message.includes(
                "user already registered"
              ) ||

              message.includes(
                "email already registered"
              ) ||

              message.includes(
                "email_exists"
              ) ||

              message.includes(
                "already exists"
              );


            const phoneAlreadyExists =
              message.includes(
                "profiles_phone_key"
              ) ||

              message.includes(
                "phone already exists"
              ) ||

              (
                message.includes(
                  "duplicate key"
                ) &&
                message.includes(
                  "phone"
                )
              ) ||

              (
                message.includes(
                  "unique"
                ) &&
                message.includes(
                  "phone"
                )
              );


            if (
              phoneAlreadyExists
            ) {

              showPhoneUsedError();

              formError.textContent =
                "لا يمكن إنشاء الحساب لأن رقم الهاتف مستخدم مسبقاً.";

            }

            else if (
              emailAlreadyExists
            ) {

              showEmailUsedError();

              formError.textContent =
                "لا يمكن إنشاء الحساب لأن البريد الإلكتروني مستخدم مسبقاً.";

            }

            else {

              formError.textContent =
                "حدث خطأ أثناء إنشاء الحساب. حاول مرة أخرى.";

            }


            button.disabled =
              false;

            button.textContent =
              "إنشاء الحساب";

            return;

          }


          /* =========================
             بريد مستخدم مسبقاً
          ========================= */

          if (
            data?.user &&
            Array.isArray(
              data.user.identities
            ) &&
            data.user.identities.length === 0
          ) {

            showEmailUsedError();

            formError.textContent =
              "لا يمكن إنشاء الحساب لأن البريد الإلكتروني مستخدم مسبقاً.";

            button.disabled =
              false;

            button.textContent =
              "إنشاء الحساب";

            return;

          }


          /* =========================
             نجاح
          ========================= */

          document
            .getElementById(
              "successMessage"
            )
            .style.display =
            "block";


          formError.textContent =
            "";


          setTimeout(
            () => {

              window.location.href =
                "index.html";

            },
            900
          );


        }

        catch (error) {

          const message =
            String(
              error?.message || ""
            ).toLowerCase();


          if (
            message.includes("phone") &&
            (
              message.includes(
                "duplicate"
              ) ||
              message.includes(
                "unique"
              ) ||
              message.includes(
                "exists"
              )
            )
          ) {

            showPhoneUsedError();

            formError.textContent =
              "لا يمكن إنشاء الحساب لأن رقم الهاتف مستخدم مسبقاً.";

          }

          else {

            formError.textContent =
              "حدث خطأ أثناء إنشاء الحساب. حاول مرة أخرى.";

          }


          button.disabled =
            false;

          button.textContent =
            "إنشاء الحساب";

        }

      }
    );

  </script>

</body>
</html>
