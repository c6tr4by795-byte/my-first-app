<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#f7f8fb">

<title>MZAD PHONE — تفاصيل الجهاز</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
  rel="stylesheet">


<style>

/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;
}

:root{

  --bg:#f7f8fb;
  --white:#ffffff;

  --text:#172230;
  --muted:#68758a;
  --soft:#98a2b3;

  --purple:#6547df;
  --purple-dark:#5435ca;
  --purple-light:#f0ecff;

  --teal:#237f96;
  --teal-light:#eaf8fa;

  --green:#13a478;
  --green-light:#eaf9f4;

  --line:rgba(25,35,50,.085);

  --shadow:
    0 12px 35px rgba(25,35,50,.055);

  --shadow-small:
    0 7px 22px rgba(25,35,50,.045);
}


html{
  background:var(--bg);
  scroll-behavior:smooth;
}


body{

  min-width:320px;

  background:

    radial-gradient(
      circle at 5% 0%,
      rgba(101,71,223,.045),
      transparent 26%
    ),

    radial-gradient(
      circle at 100% 24%,
      rgba(35,127,150,.04),
      transparent 25%
    ),

    var(--bg);

  color:var(--text);

  font-family:"Cairo",sans-serif;

  -webkit-font-smoothing:antialiased;

  text-rendering:optimizeLegibility;
}


button{

  border:none;
  outline:none;

  font-family:inherit;

  cursor:pointer;
}


img{

  display:block;
  max-width:100%;
}


/* =========================================================
   PAGE
========================================================= */

.page{

  width:100%;

  overflow:hidden;

  padding-bottom:30px;
}


.container{

  width:min(100% - 30px,760px);

  margin-inline:auto;
}


/* =========================================================
   HEADER
========================================================= */

.header{

  position:relative;

  min-height:96px;

  padding:
    max(15px,env(safe-area-inset-top))
    15px
    14px;

  display:grid;

  grid-template-columns:44px 1fr 44px;

  align-items:center;

  gap:10px;

  background:

    linear-gradient(
      180deg,
      rgba(255,255,255,.96),
      rgba(250,249,255,.92)
    );

  border-bottom:
    1px solid rgba(25,35,50,.065);

  backdrop-filter:blur(18px);

  -webkit-backdrop-filter:blur(18px);

  z-index:20;
}


.header-btn{

  width:42px;
  height:42px;

  border-radius:14px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.92);

  border:
    1px solid rgba(25,35,50,.075);

  box-shadow:var(--shadow-small);

  transition:
    transform .18s ease,
    background .18s ease;
}


.header-btn:active{
  transform:scale(.93);
}


/* BACK */

.back-icon{

  width:9px;
  height:9px;

  border-left:
    2px solid var(--teal);

  border-bottom:
    2px solid var(--teal);

  transform:rotate(45deg);

  margin-right:3px;
}


/* SHARE */

.share-icon{

  position:relative;

  width:21px;
  height:21px;
}


.share-icon span{

  position:absolute;

  width:6px;
  height:6px;

  border:
    1.8px solid var(--teal);

  border-radius:50%;

  background:#fff;
}


.share-icon span:nth-child(1){
  right:0;
  top:1px;
}


.share-icon span:nth-child(2){
  left:0;
  top:8px;
}


.share-icon span:nth-child(3){
  right:0;
  bottom:0;
}


.share-line-1,
.share-line-2{

  position:absolute;

  height:1.5px;

  background:var(--teal);

  transform-origin:right center;
}


.share-line-1{

  width:13px;

  top:7px;
  right:4px;

  transform:rotate(-25deg);
}


.share-line-2{

  width:13px;

  top:14px;
  right:4px;

  transform:rotate(25deg);
}


.header-center{

  min-width:0;

  text-align:center;
}


.header-overline{

  display:block;

  margin-bottom:1px;

  color:var(--purple);

  font-family:
    "Plus Jakarta Sans",
    sans-serif;

  font-size:8px;

  font-weight:800;

  letter-spacing:1.7px;
}


.header-title{

  font-size:22px;

  line-height:1.35;

  font-weight:800;

  letter-spacing:-.55px;
}


.header-description{

  margin-top:2px;

  color:var(--muted);

  font-size:9px;

  font-weight:600;
}


/* =========================================================
   IMAGE GALLERY
========================================================= */

.image-area{

  width:100%;

  padding:
    10px
    10px
    0;
}


.image-card{

  position:relative;

  width:100%;

  height:
    clamp(
      285px,
      70vw,
      360px
    );

  border-radius:24px;

  overflow:hidden;

  background:#fff;

  isolation:isolate;

  box-shadow:
    0 12px 32px rgba(24,34,49,.075);
}


.gallery-track{

  width:100%;
  height:100%;

  display:flex;

  direction:ltr;

  overflow-x:auto;
  overflow-y:hidden;

  scroll-snap-type:x mandatory;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}


.gallery-track::-webkit-scrollbar{
  display:none;
}


.gallery-slide{

  width:100%;
  min-width:100%;

  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:8px;

  scroll-snap-align:center;

  background:#fff;
}


.image{

  width:100%;
  height:100%;

  object-fit:contain;

  object-position:center;

  padding:0;

  user-select:none;

  -webkit-user-drag:none;

  transition:
    opacity .25s ease,
    transform .35s ease;
}


.gallery-slide:active .image{
  transform:scale(.992);
}


/* IMAGE STATUS */

.image-status{

  position:absolute;

  top:12px;
  right:12px;

  height:29px;

  padding:
    0
    10px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:999px;

  background:
    rgba(255,255,255,.94);

  color:var(--purple);

  font-size:8px;

  font-weight:800;

  box-shadow:
    0 6px 17px rgba(20,30,40,.055);

  z-index:5;
}


/* IMAGE COUNTER */

.image-counter{

  position:absolute;

  left:12px;
  bottom:12px;

  min-width:48px;

  height:29px;

  padding:
    0
    8px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:
    rgba(24,34,49,.75);

  color:#fff;

  font-family:
    "Plus Jakarta Sans",
    sans-serif;

  font-size:9px;

  font-weight:800;

  z-index:5;
}


/* DOTS */

.image-dots{

  position:absolute;

  left:50%;
  bottom:14px;

  transform:translateX(-50%);

  display:flex;

  align-items:center;

  gap:5px;

  direction:ltr;

  z-index:5;
}


.image-dot{

  width:5px;
  height:5px;

  border-radius:999px;

  background:#c9ced6;

  transition:
    width .2s ease,
    background .2s ease;
}


.image-dot.active{

  width:15px;

  background:var(--purple);
}


/* IMAGE EMPTY */

.image-empty{

  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:30px;

  background:
    linear-gradient(
      135deg,
      #f0ecff,
      #eaf8fa
    );

  color:var(--muted);

  font-size:11px;

  font-weight:800;
}


/* =========================================================
   PRODUCT
========================================================= */

.product-intro{
  padding-top:19px;
}


.brand{

  color:var(--teal);

  font-family:
    "Plus Jakarta Sans",
    sans-serif;

  font-size:11px;

  font-weight:800;

  margin-bottom:3px;
}


.product-name{

  font-family:
    "Plus Jakarta Sans",
    sans-serif;

  font-size:
    clamp(
      27px,
      7vw,
      38px
    );

  line-height:1.15;

  font-weight:800;

  letter-spacing:-1px;

  color:var(--text);
}


/* =========================================================
   CHIPS
========================================================= */

.product-chips{

  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:12px;
}


.chip{

  min-height:34px;

  padding:
    0
    13px;

  display:inline-flex;

  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:
    rgba(255,255,255,.9);

  border:
    1px solid rgba(25,35,50,.07);

  color:var(--muted);

  font-size:9px;

  font-weight:800;

  box-shadow:
    0 5px 15px rgba(30,40,55,.025);
}


.chip-primary{

  color:var(--teal);

  background:
    var(--teal-light);

  border-color:
    rgba(35,127,150,.14);
}


/* =========================================================
   PRICE
========================================================= */

.price-area{
  padding-top:16px;
}


.price-card{

  position:relative;

  min-height:110px;

  padding:
    18px
    20px;

  overflow:hidden;

  border-radius:22px;

  background:

    linear-gradient(
      135deg,
      rgba(101,71,223,.14),
      rgba(101,71,223,.055)
    );

  border:
    1px solid rgba(101,71,223,.15);

  box-shadow:
    0 13px 32px rgba(101,71,223,.065);

  display:flex;

  align-items:center;

  justify-content:space-between;
}


.price-glow-1{

  position:absolute;

  width:150px;
  height:150px;

  border-radius:50%;

  left:-80px;
  bottom:-105px;

  background:
    rgba(101,71,223,.10);
}


.price-glow-2{

  position:absolute;

  width:80px;
  height:80px;

  border-radius:50%;

  right:-30px;
  top:-35px;

  background:
    rgba(255,255,255,.4);
}


.price-content{

  position:relative;

  z-index:2;
}


.price-label{

  display:block;

  color:var(--purple);

  font-family:
    "Plus Jakarta Sans",
    sans-serif;

  font-size:9px;

  font-weight:800;

  letter-spacing:1px;

  margin-bottom:6px;
}


.price-row{

  display:flex;

  align-items:baseline;

  gap:7px;

  direction:ltr;
}


.price-number{

  color:var(--text);

  font-family:
    "Plus Jakarta Sans",
    sans-serif;

  font-size:
    clamp(
      31px,
      8.5vw,
      44px
    );

  line-height:1;

  font-weight:800;

  letter-spacing:-1.6px;
}


.price-currency{

  color:var(--purple);

  font-family:
    "Plus Jakarta Sans",
    sans-serif;

  font-size:10px;

  font-weight:800;
}


.price-badge{

  position:relative;

  z-index:2;

  width:42px;
  height:42px;

  border-radius:13px;

  background:
    rgba(255,255,255,.72);

  border:
    1px solid rgba(101,71,223,.10);

  display:flex;

  align-items:center;
  justify-content:center;

  color:var(--purple);

  font-family:
    "Plus Jakarta Sans",
    sans-serif;

  font-size:13px;

  font-weight:800;
}


/* =========================================================
   SECTION
========================================================= */

.section{
  padding-top:27px;
}


.section-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:12px;
}


.section-title-box{

  position:relative;

  padding-right:12px;
}


.section-title-box::before{

  content:"";

  position:absolute;

  right:0;
  top:4px;

  width:4px;
  height:27px;

  border-radius:999px;

  background:var(--purple);
}


.section-title-box.teal::before{
  background:var(--teal);
}


.section-kicker{

  display:block;

  margin-bottom:1px;

  font-family:
    "Plus Jakarta Sans",
    sans-serif;

  font-size:7px;

  font-weight:800;

  letter-spacing:1.5px;

  color:var(--purple);
}


.section-kicker.teal{
  color:var(--teal);
}


.section-title{

  font-size:22px;

  font-weight:800;

  line-height:1.35;

  letter-spacing:-.35px;
}


.section-icon{

  width:39px;
  height:39px;

  border-radius:13px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:var(--purple);

  background:var(--purple-light);

  font-size:16px;

  font-weight:800;
}


.section-icon.teal{

  color:var(--teal);

  background:var(--teal-light);
}


/* =========================================================
   DETAILS
========================================================= */

.details-list{

  overflow:hidden;

  border-radius:20px;

  background:
    rgba(255,255,255,.84);

  border:
    1px solid var(--line);

  box-shadow:var(--shadow);
}


.detail{

  min-height:65px;

  padding:
    9px
    14px;

  display:flex;

  align-items:center;

  gap:11px;

  border-bottom:
    1px solid rgba(25,35,50,.055);
}


.detail:last-child{
  border-bottom:none;
}


.detail-icon{

  width:36px;
  height:36px;

  flex:0 0 auto;

  border-radius:11px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:11px;

  font-weight:800;
}


.detail-icon.purple{

  background:
    var(--purple-light);

  color:var(--purple);
}


.detail-icon.teal{

  background:
    var(--teal-light);

  color:var(--teal);
}


.detail-middle{

  flex:1;

  min-width:0;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;
}


.detail-label{

  color:var(--muted);

  font-size:10px;

  font-weight:700;
}


.detail-value{

  color:var(--text);

  font-family:
    "Plus Jakarta Sans",
    "Cairo",
    sans-serif;

  font-size:12px;

  font-weight:800;

  direction:ltr;

  text-align:left;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


.detail-value.arabic{

  font-family:"Cairo",sans-serif;

  direction:rtl;
}


.detail-chevron{

  color:#b4bcc8;

  font-family:Arial,sans-serif;

  font-size:18px;

  transform:rotate(180deg);
}


/* =========================================================
   CONDITION
========================================================= */

.overall-condition{

  position:relative;

  min-height:91px;

  padding:
    15px;

  border-radius:20px;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  background:

    linear-gradient(
      135deg,
      rgba(234,248,250,.98),
      rgba(255,255,255,.9)
    );

  border:
    1px solid rgba(35,127,150,.14);

  box-shadow:
    0 12px 31px rgba(35,127,150,.055);
}


.condition-glow{

  position:absolute;

  width:120px;
  height:120px;

  border-radius:50%;

  top:-65px;
  right:-48px;

  background:
    rgba(35,127,150,.065);
}


.condition-left{

  position:relative;

  z-index:2;

  display:flex;

  align-items:center;

  gap:11px;
}


.condition-check{

  width:44px;
  height:44px;

  border-radius:14px;

  background:
    rgba(255,255,255,.88);

  color:var(--green);

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:18px;

  font-weight:800;

  box-shadow:
    0 6px 18px rgba(20,40,40,.045);
}


.condition-label{

  display:block;

  color:var(--muted);

  font-size:10px;

  font-weight:700;

  margin-bottom:3px;
}


.condition-main{

  color:var(--green);

  font-size:23px;

  font-weight:800;

  line-height:1.1;
}


.tested{

  position:relative;

  z-index:2;

  padding:
    7px
    10px;

  border-radius:999px;

  background:
    rgba(255,255,255,.75);

  border:
    1px solid rgba(19,164,120,.10);

  color:var(--green);

  font-size:8px;

  font-weight:800;
}


/* =========================================================
   CONDITION CHECKLIST
========================================================= */

.check-list{

  margin-top:10px;

  overflow:hidden;

  border-radius:20px;

  background:
    rgba(255,255,255,.86);

  border:
    1px solid var(--line);

  box-shadow:
    0 11px 29px rgba(25,35,50,.045);
}


.check-row{

  min-height:58px;

  padding:
    9px
    13px;

  display:flex;

  align-items:center;

  gap:10px;

  border-bottom:
    1px solid rgba(25,35,50,.055);
}


.check-row:last-child{
  border-bottom:none;
}


.check-icon{

  width:34px;
  height:34px;

  flex:0 0 auto;

  border-radius:11px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:10px;

  font-weight:800;
}


.check-icon.purple{

  color:var(--purple);

  background:var(--purple-light);
}


.check-icon.teal{

  color:var(--teal);

  background:var(--teal-light);
}


.check-icon.gray{

  color:#778191;

  background:#f0f2f5;
}


.check-label{

  flex:1;

  color:var(--muted);

  font-size:10px;

  font-weight:700;
}


.check-result{

  display:inline-flex;

  align-items:center;

  gap:6px;

  color:var(--green);

  font-size:11px;

  font-weight:800;
}


.check-result::before{

  content:"";

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--green);
}


.check-result.none{

  color:var(--text);
}


.check-result.none::before{
  background:#b4bbc5;
}


/* =========================================================
   NOTES
========================================================= */

.notes-box{

  padding:
    14px;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      rgba(240,236,255,.72),
      rgba(255,255,255,.9)
    );

  border:
    1px solid rgba(101,71,223,.11);

  color:var(--muted);

  font-size:10px;

  line-height:1.9;
}


/* =========================================================
   SELLER
========================================================= */

.seller{

  min-height:78px;

  padding:
    12px
    13px;

  display:flex;

  align-items:center;

  gap:11px;

  border-radius:20px;

  background:

    linear-gradient(
      135deg,
      rgba(234,248,250,.76),
      rgba(255,255,255,.88)
    );

  border:
    1px solid rgba(35,127,150,.12);

  box-shadow:
    0 12px 30px rgba(35,127,150,.045);
}


.seller-avatar{

  width:48px;
  height:48px;

  border-radius:15px;

  flex:0 0 auto;

  display:flex;

  align-items:center;
  justify-content:center;

  background:

    linear-gradient(
      135deg,
      #25859b,
      #176f84
    );

  color:#fff;

  font-size:17px;

  font-weight:800;

  box-shadow:
    0 8px 21px rgba(35,127,150,.15);
}


.seller-details{

  flex:1;

  min-width:0;
}


.seller-name{

  display:block;

  color:var(--text);

  font-size:13px;

  font-weight:800;

  margin-bottom:1px;
}


.seller-location{

  display:block;

  color:var(--muted);

  font-size:9px;

  font-weight:700;
}


.verified{

  min-height:29px;

  padding:
    0
    9px;

  border-radius:9px;

  display:flex;

  align-items:center;

  background:
    rgba(255,255,255,.72);

  color:var(--teal);

  font-size:8px;

  font-weight:800;
}


/* =========================================================
   ACTIONS
========================================================= */

.actions{

  padding-top:25px;

  display:grid;

  grid-template-columns:
    1fr
    55px;

  gap:9px;
}


.buy{

  min-height:58px;

  border-radius:19px;

  padding:
    0
    18px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  color:#fff;

  background:

    linear-gradient(
      135deg,
      var(--purple),
      var(--purple-dark)
    );

  box-shadow:
    0 14px 31px rgba(101,71,223,.18);

  transition:
    transform .17s ease,
    box-shadow .17s ease;
}


.buy:active{

  transform:scale(.985);

  box-shadow:
    0 7px 19px rgba(101,71,223,.13);
}


.buy-text{

  font-size:15px;

  font-weight:800;
}


.buy-price{

  font-family:
    "Plus Jakarta Sans",
    sans-serif;

  font-size:9px;

  font-weight:700;

  opacity:.72;

  direction:ltr;
}


.favorite{

  min-height:58px;

  border-radius:19px;

  background:
    rgba(255,255,255,.9);

  border:

/* =========================================================
   ELEMENTS
========================================================= */

const app =

  new URLSearchParams(
    window.location.search

const deviceId =

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function displayValue(value){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ){

    return "—";

  }

  return escapeHTML(value);

}


function formatPrice(value){

  const number =
    Number(value || 0);

  if(!number){
    return "0";
  }

  return new Intl.NumberFormat(
    "ar-IQ"
  ).format(number);

}


function isApple(brand){

  return String(brand || "")
    .trim()
    .toLowerCase() === "apple";

}


/* =========================================================
   IMAGES
========================================================= */

function parseImages(value){

  if(!value){
    return [];
  }


  if(Array.isArray(value)){

    return value
      .map(normalizeImageItem)
      .filter(Boolean);

  }


  if(typeof value === "object"){

    const one =
      normalizeImageItem(value);

    return one ? [one] : [];

  }


  if(typeof value === "string"){

    const trimmed =
      value.trim();


    if(!trimmed){
      return [];
    }


    /*
      أولاً نحاول JSON
    */

    try{

      const parsed =
        JSON.parse(trimmed);


      if(Array.isArray(parsed)){

        return parsed
          .map(normalizeImageItem)
          .filter(Boolean);

      }


      if(
        parsed &&
        typeof parsed === "object"
      ){

        const one =
          normalizeImageItem(parsed);

        return one ? [one] : [];

      }


      if(typeof parsed === "string"){

        return parsed
          ? [parsed]
          : [];

      }

    }catch(error){}


    /*
      إذا مو JSON،
      نفترض أنها روابط مفصولة بفواصل
    */

    return trimmed
      .split(",")
      .map(item => item.trim())
      .filter(Boolean);

  }


  return [];

}


function normalizeImageItem(item){

  if(!item){
    return null;
  }


  if(typeof item === "string"){

    return item.trim() || null;

  }


  if(typeof item === "object"){

    return (
      item.url ||
      item.path ||
      item.name ||
      item.src ||
      null
    );

  }


  return null;

}


/*
  تحويل مسار Storage إلى رابط عام.
  إذا كان أصلاً رابط كامل نستخدمه كما هو.
*/

function resolveImageUrl(value){

  if(!value){
    return "";
  }


  const raw =
    String(value).trim();


  if(!raw){
    return "";
  }


  /*
    روابط كاملة
  */

  if(
    raw.startsWith("http://") ||
    raw.startsWith("https://") ||
    raw.startsWith("data:") ||
    raw.startsWith("blob:")
  ){

    return raw;

  }


  /*
    إذا كان المسار يحتوي رابط Supabase
  */

  if(
    raw.includes("/storage/v1/object/")
  ){

    return raw.startsWith("/")
      ? window.location.origin + raw
      : raw;

  }


  /*
    تنظيف المسار
  */

  const cleanPath =
    raw
      .replace(/^\/+/,"")
      .replace(/^device-images\//,"");


  /*
    توليد رابط Public من Supabase
  */

  const {
    data
  } =
    supabase
      .storage
      .from("device-images")
      .getPublicUrl(cleanPath);


  return data?.publicUrl || "";

}


/* =========================================================
   IMAGE GALLERY
========================================================= */

function renderGallery(images){

  currentImages =
    images.map(resolveImageUrl)
      .filter(Boolean);


  /*
    لا توجد صور
  */

  if(!currentImages.length){

    return `

      <section class="image-area">

        <div class="image-card">

          <div class="image-empty">

            لا توجد صورة مرفوعة لهذا الجهاز

          </div>

        </div>

      </section>

    `;

  }


  const slides =
    currentImages
      .map(
        (src,index) => `

          <div class="gallery-slide">

            <img
              class="image"
              src="${escapeHTML(src)}"
              alt="${escapeHTML(
                `${device.brand || ""} ${device.model || "الجهاز"}`
              )}"
              loading="${index === 0 ? "eager" : "lazy"}"
              decoding="async"
              draggable="false"
              data-index="${index}"
            >

          </div>

        `
      )
      .join("");


  const dots =
    currentImages.length > 1
      ?
      currentImages
        .map(
          (_,index) => `

            <span
              class="image-dot ${index === 0 ? "active" : ""}">
            </span>

          `
        )
        .join("")
      :
      "";


  return `

    <section class="image-area">

      <div class="image-card">

        <div
          class="gallery-track"
          id="galleryTrack">

          ${slides}

        </div>


        <div class="image-status">
          صورة حقيقية
        </div>


        <div
          class="image-counter"
          id="imageCounter">

          1 / ${currentImages.length}

        </div>


        ${
          currentImages.length > 1
            ?
            `
              <div
                class="image-dots"
                id="imageDots">

                ${dots}

              </div>
            `
            :
            ""
        }

      </div>

    </section>

  `;

}


/* =========================================================
   SPEC DETAIL
========================================================= */

function detailRow(
  icon,
  iconColor,
  label,
  value,
  arabic = false
){

  return `

    <div class="detail">

      <div class="detail-icon ${iconColor}">

      <span class="detail-chevron">
        ‹
      </span>

    </div>

  `;

}


/* =========================================================
   CONDITION
========================================================= */

function conditionResult(value){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ){

    return {
      text:"غير مذكور",
      good:false
    };

  }


  const text =
    String(value);


  const lower =
    text.toLowerCase();


  const good =
    lower.includes("يعمل") ||
    lower.includes("ممتاز") ||
    lower.includes("جيد") ||
    lower.includes("سليم") ||
    lower.includes("لا توجد") ||
    lower.includes("لا يوجد");


  return {
    text,
    good
  };

}


function conditionRow(
  icon,
  iconColor,
  label,
  value
){

  const result =
    conditionResult(value);


  return `

    <div class="check-row">

      <div class="check-icon ${iconColor}">
        ${icon}
      </div>

      <span class="check-label">
        ${escapeHTML(label)}
      </span>

      <strong
        class="check-result ${result.good ? "" : "none"}">

        ${escapeHTML(result.text)}

      </strong>

    </div>

  `;

}


/* =========================================================
   SALE TYPE
========================================================= */

function getSaleLabel(value){

  const sale =

  if(
    sale === "auction" ||
    sale === "مزاد"

  }


  return "بيع مباشر";

}


/* =========================================================
   RENDER DEVICE
========================================================= */

/* =========================================================
   GALLERY SETUP
========================================================= */

function setupGallery(){

  const track =
    document.getElementById(
      "galleryTrack"
    );


  if(!track){
    return;
  }


  const counter =
    document.getElementById(
      "imageCounter"
    );


  const dots =
    [
      ...document.querySelectorAll(
        ".image-dot"
      )
    ];


  const images =
    [
      ...track.querySelectorAll(
        ".image"
      )
    ];


  /*
    إذا الصورة فشلت
  */

  images.forEach(
    image => {

      image.addEventListener(
        "error",
        () => {

          const slide =
            image.closest(
              ".gallery-slide"
            );


          if(slide){

            slide.innerHTML = `

              <div class="image-empty">

                تعذر تحميل صورة الجهاز

              </div>

            `;

          }

        }
      );

    }
  );


  track.addEventListener(
    "scroll",
    () => {

      const width =
        track.clientWidth;


      if(!width){
        return;
      }


      const index =
        Math.max(
          0,
          Math.min(
            currentImages.length - 1,
            Math.round(
              track.scrollLeft / width
            )
          )
        );


      if(counter){

        counter.textContent =
          `${index + 1} / ${currentImages.length}`;

      }


      dots.forEach(
        (dot,i) => {

          dot.classList.toggle(
            "active",
            i === index
          );

        }
      );

    },
    {
      passive:true
    }
  );

}


/* =========================================================
   BACK
========================================================= */

window.goBack =
function(){

  if(window.history.length > 1){

    window.history.back();

  }else{

    window.location.href =
      "market.html";

  }

};


/* =========================================================
   SHARE
========================================================= */

window.shareProduct =
async function(){

  const productName =
    `${device?.brand || ""} ${device?.model || ""}`
      .trim();


  const price =
    formatPrice(
      device?.price
    );


  const data = {

    title:
      productName ||
      "جهاز على MZAD PHONE",

    text:
      `${productName} — ${price} IQD`,

    url:
      window.location.href

  };


  try{

    if(
      navigator.share &&
      typeof navigator.share === "function"
    ){

      await navigator.share(data);

    }else{

      if(
        navigator.clipboard &&
        navigator.clipboard.writeText
      ){

        await navigator.clipboard.writeText(
          window.location.href
        );

        showToast(
          "تم نسخ رابط الجهاز"
        );

      }else{

        showToast(
          "المشاركة غير متاحة"
        );

      }

    }

  }catch(error){

    if(
      error &&
      error.name !== "AbortError"
    ){

      showToast(
        "تعذر فتح المشاركة"
      );

    }

  }

};


/* =========================================================
   FAVORITE
========================================================= */

function setupFavorite(){

  const button =
    document.getElementById(
      "favoriteButton"
    );


  if(!button){
    return;
  }


  button.addEventListener(
    "click",
    async () => {

      const {
        data
      } =
      await supabase.auth.getSession();


      if(!data?.session){

        const returnTo =
          window.location.pathname +
          window.location.search;


        sessionStorage.setItem(
          "mzad_pending_action",
          returnTo
        );


        window.location.href =
          `index.html?login=1&returnTo=${encodeURIComponent(returnTo)}`;


        return;

      }


      button.classList.toggle(
        "active"
      );


      const active =
        button.classList.contains(
          "active"
        );


      button.innerHTML =
        active
          ? "♥"
          : "♡";


      showToast(
        active
          ? "تمت الإضافة للمفضلة"
          : "تمت الإزالة من المفضلة"
      );

    }
  );

}


/* =========================================================
   BUY
========================================================= */

function setupBuy(){

  const button =
    document.getElementById(
      "buyButton"
    );


  if(!button){
    return;
  }


  button.addEventListener(
    "click",
    async () => {

      const {
        data
      } =
      await supabase.auth.getSession();


      if(!data?.session){

        const returnTo =
          window.location.pathname +
          window.location.search;


        sessionStorage.setItem(
          "mzad_pending_action",
          returnTo
        );


        window.location.href =
          `index.html?login=1&returnTo=${encodeURIComponent(returnTo)}`;


        return;

      }


      if(
        getSaleLabel(
          device?.sale_type
        ) === "مزاد"
      ){

        showToast(
          "سيتم فتح المزاد هنا"
        );

      }else{

        showToast(
          "جاري تجهيز طلب شراء الجهاز"
        );

      }

    }
  );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  if(!toast){
    return;
  }


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  if(toastTimer){

    clearTimeout(
      toastTimer
    );

  }


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =========================================================
   LOAD DEVICE
========================================================= */

async function loadDevice(){

  if(!deviceId){

    app.innerHTML = `

      <div class="error">

        <div class="error-box">

          لم يتم تحديد الجهاز.

        </div>

      </div>

    `;

    return;

  }


  const {
    data,
    error
  } =
  await supabase

    .from("devices")

    .select("*")

    .eq("id",deviceId)

    .single();


  if(error || !data){

    console.error(
      "DEVICE LOAD ERROR:",
      error
    );


    app.innerHTML = `

      <div class="error">

        <div class="error-box">

          تعذر تحميل بيانات الجهاز.

        </div>

      </div>

    `;

    return;

  }


  device =
    data;


  console.log(
    "DEVICE:",
    device
  );


  console.log(
    "RAW IMAGES:",
    device.images
  );


  renderDevice();

}


/* =========================================================
   START

loadDevice();
