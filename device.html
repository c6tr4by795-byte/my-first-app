<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>MZAD PHONE — تفاصيل الجهاز</title>

<style>
:root{
--bg:#f7f8fa;
--surface:#fff;
--ink:#17202a;
--muted:#667085;
--line:#e6e9ed;

--primary:#176b87;

--primary-soft:#e8f3f6;

--purple:#6246d9;

}

-webkit-tap-highlight-color:transparent
}

html{
scroll-behavior:smooth
}

body{
margin:0;
min-height:100vh;
background:var(--bg);
color:var(--ink);

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"SF Pro Text",
"Segoe UI",
Tahoma,
Arial,
sans-serif;

padding-bottom:88px
}

button{
font:inherit;
border:0;
background:none;
color:inherit;
cursor:pointer
}

.page{
width:min(100%,520px);
margin:0 auto
}


/* =====================================================
   HEADER
===================================================== */

.header{
height:68px;

padding:
8px
14px;

display:flex;
align-items:center;
justify-content:space-between;

background:var(--bg);

position:sticky;
top:0;
z-index:40
}

.header-btn{
width:40px;
height:40px;

display:grid;
place-items:center;

border:1px solid var(--line);
border-radius:13px;

background:#fff;

color:var(--primary);

box-shadow:
0 6px 15px rgba(23,32,42,.045)
}

.header-btn svg{
width:20px;
height:20px
}

.header-title{
margin:0;

font-size:19px;
font-weight:900;

letter-spacing:-.035em
}


/* =====================================================
   IMAGE GALLERY
===================================================== */

/*
  مساحة الصورة موحدة.
  الصورة نفسها لا يتم قصها.
*/

.gallery{
position:relative;

width:100%;

height:318px;

background:#fff;

overflow:hidden;

border-bottom:
1px solid var(--line)
}

.gallery-track{
height:100%;
width:100%;

display:flex;

direction:ltr;

overflow-x:auto;
overflow-y:hidden;

scroll-snap-type:x mandatory;

scrollbar-width:none;

-webkit-overflow-scrolling:touch
}

.gallery-track::-webkit-scrollbar{
display:none
}

.slide{
min-width:100%;
width:100%;
height:100%;

display:flex;

align-items:center;
justify-content:center;

padding:
10px
18px;

scroll-snap-align:center;

background:#fff
}

/*
  الصورة كاملة دائماً.
  لا cover.
  لا crop.
*/

.slide img{
display:block;

width:100%;
height:100%;

max-width:100%;
max-height:100%;

object-fit:contain !important;

object-position:center center;

border:0;

outline:0;

box-shadow:none;

user-select:none;

-webkit-user-drag:none;

image-rendering:auto
}


/* =====================================================
   IMAGE BUTTONS
===================================================== */

.image-btn{
position:absolute;

top:13px;

width:40px;
height:40px;

border-radius:13px;

background:rgba(255,255,255,.96);

display:grid;
place-items:center;

color:var(--primary);

box-shadow:
0 7px 17px rgba(23,32,42,.10);

z-index:10
}

.image-btn svg{
width:19px;
height:19px
}

.image-share{
right:14px
}

.image-favorite{
right:61px
}

.image-counter{
position:absolute;

left:14px;
bottom:13px;

height:31px;

min-width:47px;

padding:
0
9px;

display:flex;
align-items:center;
justify-content:center;

border-radius:11px;

background:rgba(23,32,42,.78);

color:#fff;

font-size:10px;
font-weight:900;

direction:ltr;

z-index:10
}

.image-dots{
position:absolute;

left:50%;
bottom:16px;

transform:translateX(-50%);

display:flex;

align-items:center;

gap:5px;

direction:ltr;

z-index:10
}

.image-dot{
width:5px;
height:5px;

border-radius:20px;

background:rgba(23,32,42,.23);

transition:
width .2s ease,
background .2s ease
}

.image-dot.active{
width:16px;

background:var(--purple)
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product{
padding:
13px
20px
0
}

.brand{
font-size:12px;

font-weight:900;

color:var(--purple);

margin-bottom:2px
}

.model{
margin:0;

font-size:26px;

line-height:1.25;

font-weight:950;

letter-spacing:-.045em
}


/* =====================================================
   CHIPS
===================================================== */

.chips{
display:flex;

flex-wrap:wrap;

gap:7px;

margin-top:12px
}

.chip{
height:36px;

padding:
0
12px;

display:flex;

align-items:center;
justify-content:center;

border:
1px solid var(--line);

border-radius:12px;

background:#fff;

color:#596273;

font-size:11px;

font-weight:850
}


/* =====================================================
   PRICE
===================================================== */

.price-card{
margin-top:15px;

padding:
17px
18px;

border-radius:21px;

background:
linear-gradient(
145deg,
#6246d9 0%,
#6e4be0 55%,
#7950df 100%
);

color:#fff;

box-shadow:
0 11px 25px rgba(98,70,217,.14);

position:relative;

overflow:hidden
}

.price-card:before{
content:"";

position:absolute;

width:105px;
height:105px;

border-radius:50%;

left:-55px;
bottom:-60px;

background:
rgba(255,255,255,.07)
}

.price-label{
font-size:11px;

font-weight:700;

opacity:.82
}

.price-line{
display:flex;

align-items:baseline;

gap:7px;

margin-top:1px
}

.price{
font-size:29px;

font-weight:950;

letter-spacing:-.04em
}

.currency{
font-size:12px;

font-weight:800;

opacity:.9
}


/* =====================================================
   DETAILS DIVIDER
===================================================== */

.details-intro{
margin-top:20px;

padding:
15px
16px;

border-radius:18px;

background:
linear-gradient(
135deg,
#f1eeff,
#e8f3f6
);

border:
1px solid #e1ddf5;

position:relative;

overflow:hidden
}

.details-intro:after{
content:"";

position:absolute;

width:55px;
height:55px;

border-radius:50%;

left:-25px;
bottom:-28px;

background:
rgba(98,70,217,.08)
}

.details-intro-title{
font-size:16px;

font-weight:950;

margin:0;

color:#29245a
}

.details-intro-copy{
margin:3px 0 0;

font-size:10px;

line-height:1.7;

color:#667085
}


/* =====================================================
   SECTIONS
===================================================== */

.section{
margin-top:21px
}

.section-head{
display:flex;

align-items:center;

gap:8px;

margin-bottom:10px
}

.section-mark{
width:5px;
height:21px;

border-radius:8px;

background:var(--purple);

flex:0 0 auto
}

.section-title{
margin:0;

font-size:17px;

font-weight:950;

letter-spacing:-.03em
}


/* =====================================================
   SPECIFICATIONS
===================================================== */

.spec-grid{
display:grid;

grid-template-columns:
1fr
1fr;

gap:8px
}

.spec{
min-height:67px;

padding:
11px
12px;

background:#fff;

border:
1px solid var(--line);

border-radius:16px;

position:relative;

overflow:hidden
}

.spec:nth-child(2n){
background:
linear-gradient(
145deg,
#fff,
#f7f5ff
)
}

.spec:nth-child(3n){
background:
linear-gradient(
145deg,
#fff,
#f2f9fa
)
}

.spec-label{
font-size:9px;

color:var(--muted);

margin-bottom:4px
}

.spec-value{
font-size:12px;

font-weight:900;

color:var(--ink)
}


/* =====================================================
   CONDITION
===================================================== */

.condition{
padding:7px;

background:#fff;

border:
1px solid var(--line);

border-radius:18px
}

.condition-row{
min-height:47px;

padding:
0
11px;

display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

border-radius:12px
}

.condition-row:nth-child(even){
background:
linear-gradient(
90deg,
#f7f5ff,
#fafbfc
)
}

.condition-label{
font-size:10px;

color:var(--muted);

font-weight:700
}

.condition-value{
font-size:11px;

font-weight:900;

text-align:left
}

.condition-value.good{
color:var(--success)
}


/* =====================================================
   NOTES
===================================================== */

.notes{
padding:
14px;

background:
linear-gradient(
145deg,
#fffdf7,
#fff
);

border:
1px solid #eee8d9;

border-radius:17px;

font-size:11px;

line-height:1.9;

color:#4d5965
}


/* =====================================================
   SELLER
===================================================== */

.seller{
display:flex;

align-items:center;

gap:11px;

padding:
13px
14px;

background:
linear-gradient(
145deg,
#fff,
#f5f2ff
);

border:
1px solid #e2ddf6;

border-radius:18px
}

.seller-avatar{
width:42px;
height:42px;

border-radius:13px;

display:grid;

place-items:center;

background:var(--purple-soft);

color:var(--purple);

font-size:16px;

font-weight:900;

}

.seller-name{
font-size:12px;

font-weight:900
}

.seller-location{
font-size:10px;

color:var(--muted);

}


/* =====================================================
   BOTTOM BUY
===================================================== */

.bottom{
position:fixed;

left:0;
right:0;
bottom:0;

z-index:50;

padding:
8px
16px
calc(8px + var(--safe-bottom));

background:
rgba(255,255,255,.96);

border-top:
1px solid var(--line);

backdrop-filter:
blur(12px)
}

.bottom-inner{
width:min(100%,488px);

margin:auto;

display:flex;

gap:8px;

direction:rtl
}

.buy{
flex:1;

height:54px;

border-radius:17px;

background:
linear-gradient(
145deg,
#6246d9,
#7950df
);

color:#fff;

font-size:15px;

box-shadow:
0 8px 20px rgba(98,70,217,.16)

.bottom-favorite{
width:54px;
height:54px;

border-radius:17px;

background:#fff;

1px solid var(--line);

color:var(--purple)
}

.bottom-favorite svg{
width:21px;
height:21px
}


/* =====================================================
   LOADING
===================================================== */

.loading,
.error{
padding:
75px
20px;

font-size:12px;

}


/* =====================================================
   SMALL PHONES

}

</style>
</head>


<body>

<div class="page">


<header class="header">

<button
class="header-btn"
id="backBtn"
aria-label="رجوع">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M15 18 9 12l6-6"/>

</svg>

</button>


<h1 class="header-title">
تفاصيل الجهاز
</h1>


<div style="width:40px"></div>

</header>


<main id="app">

<div class="loading">
جاري تحميل الجهاز...
</div>

</main>

</div>


<div
class="bottom"
id="bottom"
style="display:none">

<div class="bottom-inner">


<button
class="bottom-favorite"
id="bottomFavorite"
aria-label="المفضلة">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8"
stroke-linecap="round"
stroke-linejoin="round">

<path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/>

</svg>

</button>


<button
class="buy"
id="buyBtn">

شراء الجهاز

</button>

</div>

</div>


<script type="module">

import { supabase }
from "./js/supabase.js";


const app =
document.getElementById("app");

const bottom =
document.getElementById("bottom");

const backBtn =
document.getElementById("backBtn");

const buyBtn =
document.getElementById("buyBtn");

const bottomFavorite =
document.getElementById("bottomFavorite");


const params =
new URLSearchParams(
window.location.search
);

const deviceId =
params.get("id");


let device=null;


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function value(value){

return value
? escapeHTML(value)
: "—";

}


function formatPrice(value){

return new Intl.NumberFormat(
"ar-IQ"
).format(
Number(value || 0)
);

}


function getImages(value){

if(!value)
return [];


if(Array.isArray(value))
return value.filter(Boolean);


try{

const parsed =
JSON.parse(value);

if(Array.isArray(parsed))
return parsed.filter(Boolean);

if(
typeof parsed === "string" &&
parsed.trim()
){

return [parsed];

}

}catch(error){}


if(typeof value === "string"){

return value
.split(",")
.map(x=>x.trim())
.filter(Boolean);

}


return [];

}


function isApple(brand){

return String(brand || "")
.trim()
.toLowerCase()
==="apple";

}


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
"click",
()=>{

if(history.length>1){

history.back();

}else{

window.location.href=
"market.html";

}

}
);


/* =====================================================
   SPEC
===================================================== */

function spec(label,value){

return `

<div class="spec">

<div class="spec-label">
${escapeHTML(label)}
</div>

<div class="spec-value">
${value || "—"}
</div>

</div>

`;

}


/* =====================================================
   CONDITION
===================================================== */

function condition(label,value){

const clean =
String(value || "").toLowerCase();

const good =
clean.includes("يعمل") ||
clean.includes("ممتاز") ||
clean.includes("جيد جداً");

return `

<div class="condition-row">

<span class="condition-label">
${escapeHTML(label)}
</span>

<span
class="condition-value ${good?"good":""}">

${value || "—"}

</span>

</div>

`;

}


/* =====================================================
   GALLERY
===================================================== */

function renderGallery(list){

if(!list.length){

return `

<div class="gallery">

<div
class="slide"
style="
font-size:12px;
color:#667085;
font-weight:800
">

لا توجد صورة للجهاز

</div>

</div>

`;

}


const slides =
list.map(
(src,index)=>`

<div class="slide">

<img
src="${escapeHTML(src)}"
alt="صورة الجهاز"
loading="${index===0?"eager":"lazy"}"
decoding="async"
draggable="false">

</div>

`
).join("");


const dots =
list.length>1
?
list.map(
(_,index)=>`

<span
class="image-dot ${
index===0
?"active"
:""
}">
</span>

`
).join("")
:
"";


return `

<div class="gallery">


<button
class="image-btn image-share"
id="shareBtn"
aria-label="مشاركة">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<circle cx="18" cy="5" r="2.3"/>
<circle cx="6" cy="12" r="2.3"/>
<circle cx="18" cy="19" r="2.3"/>

<path d="m8 10.8 7.7-4.4"/>
<path d="m8 13.2 7.7 4.4"/>

</svg>

</button>


<button
class="image-btn image-favorite"
id="imageFavorite"
aria-label="المفضلة">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8">

<path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/>

</svg>

</button>


<div
class="gallery-track"
id="galleryTrack">

${slides}

</div>


<div
class="image-counter"
id="imageCounter">

1 / ${list.length}

</div>


${
list.length>1
?
`<div class="image-dots">${dots}</div>`
:
""
}

</div>

`;

}


/* =====================================================
   RENDER DEVICE
===================================================== */

function renderDevice(){

const list =
getImages(device.images);

const apple =
isApple(device.brand);


app.innerHTML = `

${renderGallery(list)}


<section class="product">


<div class="brand">
${value(device.brand)}
</div>


<h2 class="model">
${value(device.model)}
</h2>


<div class="chips">

${
device.storage
?
`<span class="chip">${value(device.storage)}</span>`
:
""
}


${
device.color
?
`<span class="chip">${value(device.color)}</span>`
:
""
}


<span class="chip">

${
device.sale_type==="auction" ||
device.sale_type==="مزاد"

? "مزاد"

: "بيع مباشر"

}

</span>

</div>


<div class="price-card">

<div class="price-label">
Sale Price
</div>

<div class="price-line">

<span class="price">
${formatPrice(device.price)}
</span>

<span class="currency">
د.ع
</span>

</div>

</div>


<div class="details-intro">

<h3 class="details-intro-title">
تفاصيل الجهاز
</h3>

<p class="details-intro-copy">
المواصفات والحالة ومعلومات البائع
</p>

</div>


<section class="section">

<div class="section-head">

<span class="section-mark"></span>

<h3 class="section-title">
مواصفات الجهاز
</h3>

</div>


<div class="spec-grid">

${spec(
"الشركة",
value(device.brand)
)}

${spec(
"الموديل",
value(device.model)
)}

${spec(
"السعة",
value(device.storage)
)}

${spec(
"اللون",
value(device.color)
)}


${
apple
?
spec(
"صحة البطارية",
device.battery_health
?
escapeHTML(
device.battery_health
)+"%"
:
"غير مذكورة"
)
:
""
}


${spec(
"الموقع",
value(
device.location ||
"النجف"
)
)}

</div>

</section>


<section class="section">

<div class="section-head">

<span
class="section-mark"
style="background:var(--primary)">
</span>

<h3 class="section-title">
حالة الجهاز
</h3>

</div>


<div class="condition">

${condition(
"حالة الجهاز",
value(device.condition)
)}

${condition(
"حالة الشاشة",
value(device.screen_condition)
)}

${condition(
"حالة الهيكل",
value(device.body_condition)
)}

${condition(
apple
? "Face ID"
: "البصمة",
value(device.face_id)
)}

${condition(
"الكاميرات",
value(device.cameras)
)}

${condition(
"الشحن",
value(device.charging)
)}

${condition(
"القطع المبدلة",
value(device.replaced_parts)
)}

</div>

</section>


${
device.notes
?
`

<section class="section">

<div class="section-head">

<span
class="section-mark"
style="background:#b59d42">
</span>

<h3 class="section-title">
ملاحظات البائع
</h3>

</div>

<div class="notes">
${escapeHTML(device.notes)}
</div>

</section>

`
:
""
}


<section class="section">

<div class="section-head">

<span
class="section-mark"
style="background:var(--purple)">
</span>

<h3 class="section-title">
البائع
</h3>

</div>


<div class="seller">

<div class="seller-avatar">

${escapeHTML(
String(
device.seller_name ||
"ب"
)
.charAt(0)
)}

</div>


<div>

<div class="seller-name">

${value(
device.seller_name ||
"بائع الجهاز"
)}

</div>


<div class="seller-location">

${value(
device.location ||
"النجف"
)}

</div>

</div>

</div>

</section>


</section>

`;


bottom.style.display=
"block";


setupGallery(list);

setupShare();

setupFavorite();

}


/* =====================================================
   GALLERY CONTROL
===================================================== */

function setupGallery(list){

const track =
document.getElementById(
"galleryTrack"
);

const counter =
document.getElementById(
"imageCounter"
);

if(!track)
return;


const dots =
[
...document.querySelectorAll(
".image-dot"
)
];


track.addEventListener(
"scroll",
()=>{

const index =
Math.round(
track.scrollLeft /
track.clientWidth
);


if(counter){

counter.textContent =
`${index+1} / ${list.length}`;

}


dots.forEach(
(dot,index)=>{

dot.classList.toggle(
"active",
index===index
);

});

},
{
passive:true
}
);

}


/* =====================================================
   SHARE
===================================================== */

function setupShare(){

const share =
document.getElementById(
"shareBtn"
);

if(!share)
return;


share.addEventListener(
"click",
async()=>{

try{

if(navigator.share){

await navigator.share({

title:
`${device.brand} ${device.model}`,

text:
"شاهد هذا الجهاز على MZAD PHONE",

url:
window.location.href

});

}else{

await navigator.clipboard.writeText(
window.location.href
);

alert(
"تم نسخ رابط الجهاز"
);

}

}catch(error){}

}
);

}


/* =====================================================
   FAVORITE
===================================================== */

function setupFavorite(){

const top =
document.getElementById(
"imageFavorite"
);


function toggle(){

top.classList.toggle(
"active"
);

bottomFavorite.classList.toggle(
"active"
);

}


if(top){

top.addEventListener(
"click",
toggle
);

}


bottomFavorite.addEventListener(
"click",
toggle
);

}


/* =====================================================
   LOAD DEVICE
===================================================== */

async function loadDevice(){

if(!deviceId){

app.innerHTML=`

<div class="error">
لم يتم تحديد الجهاز.
</div>

`;

return;

}


const {
data,
error
} =
await supabase

.from("devices")

.select("*")

.eq("id",deviceId)

.single();


if(error || !data){

console.error(error);

app.innerHTML=`

<div class="error">
تعذر تحميل بيانات الجهاز.
</div>

`;

return;

}


device=data;

renderDevice();

}


loadDevice();


/* =====================================================
   BUY
===================================================== */

buyBtn.addEventListener(
"click",
async()=>{

const {
data
} =
await supabase.auth.getSession();


if(!data?.session){

const returnTo =
window.location.pathname +
window.location.search;


sessionStorage.setItem(
"mzad_pending_action",
returnTo
);


window.location.href =
`index.html?login=1&returnTo=${encodeURIComponent(returnTo)}`;

return;

}


alert(
"سيتم ربط عملية الشراء هنا."
);

});

</script>
