<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">

<title>MZAD PHONE — تفاصيل الجهاز</title>

<style>
:root{
--bg:#f7f8fa;
--surface:#fff;
--ink:#17202a;
--muted:#667085;
--line:#e6e9ed;
--primary:#176b87;
--primary-dark:#125a73;
--purple:#6246d9;
--purple-soft:#e5e0ff;
--success:#159a72;
--shadow:0 12px 28px rgba(23,32,42,.07);
--safe-bottom:env(safe-area-inset-bottom,0px)
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html{
scroll-behavior:smooth
}

body{
margin:0;
min-height:100vh;
background:var(--bg);
color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
-webkit-font-smoothing:antialiased;
text-rendering:optimizeLegibility;
padding-bottom:96px
}

button{
font:inherit;
border:0;
background:none;
color:inherit;
cursor:pointer
}

.page{
width:min(100%,520px);
margin:0 auto
}


/* =========================
   HEADER
========================= */

.header{
height:76px;
padding:10px 14px;

display:flex;
align-items:center;
justify-content:space-between;

background:var(--bg);
position:sticky;
top:0;
z-index:30
}

.header-title{
margin:0;
font-size:23px;
font-weight:900;
letter-spacing:-.04em
}

.header-btn{
width:42px;
height:42px;

display:grid;
place-items:center;

border:1px solid var(--line);
border-radius:14px;

background:#fff;
color:var(--primary);

box-shadow:0 6px 16px rgba(23,32,42,.045)
}

.header-btn svg{
width:21px;
height:21px
}


/* =========================
   PHOTO GALLERY
========================= */

.gallery{
position:relative;
width:100%;

/*
  مساحة موحدة لكل الأجهزة.
  مو الصورة نفسها.
*/
height:430px;

background:var(--bg);

overflow:hidden
}

.gallery-track{
height:100%;
width:100%;

display:flex;
direction:ltr;

overflow-x:auto;
overflow-y:hidden;

scroll-snap-type:x mandatory;
scrollbar-width:none;

-webkit-overflow-scrolling:touch
}

.gallery-track::-webkit-scrollbar{
display:none
}

.slide{
min-width:100%;
width:100%;
height:100%;

display:flex;
align-items:center;
justify-content:center;

padding:4px 12px;

scroll-snap-align:center
}

/*
  أهم سطرين بالصفحة كلها:
  الصورة كاملة.
  ماكو crop.
*/
.slide img{
display:block;

width:100%;
height:100%;

object-fit:contain !important;
object-position:center;

border:0;
box-shadow:none;

user-select:none;
-webkit-user-drag:none
}


/* =========================
   IMAGE CONTROLS
========================= */

.image-btn{
position:absolute;

top:14px;

width:42px;
height:42px;

border-radius:14px;

background:rgba(255,255,255,.96);

display:grid;
place-items:center;

color:var(--primary);

box-shadow:0 7px 18px rgba(23,32,42,.10);

z-index:5
}

.image-btn svg{
width:20px;
height:20px
}

.image-share{
right:14px
}

.image-favorite{
right:64px
}

.image-counter{
position:absolute;

left:14px;
bottom:14px;

height:34px;
min-width:48px;

padding:0 10px;

display:flex;
align-items:center;
justify-content:center;

border-radius:12px;

background:rgba(23,32,42,.78);
color:#fff;

font-size:11px;
font-weight:900;

direction:ltr;

z-index:5
}

.image-dots{
position:absolute;

bottom:17px;
left:50%;

transform:translateX(-50%);

display:flex;
gap:5px;

direction:ltr;

z-index:5
}

.image-dot{
width:5px;
height:5px;

border-radius:20px;

background:rgba(23,32,42,.22);

transition:.2s ease
}

.image-dot.active{
width:17px;
background:var(--purple)
}


/* =========================
   PRODUCT
========================= */

.product{
padding:4px 20px 0
}

.brand{
font-size:13px;
font-weight:900;
color:var(--purple);

margin-top:4px
}

.model{
margin:2px 0 0;

font-size:27px;
font-weight:900;

letter-spacing:-.045em;
line-height:1.25
}


/* =========================
   CHIPS
========================= */

.chips{
display:flex;
flex-wrap:wrap;
gap:8px;

margin-top:13px
}

.chip{
height:39px;

padding:0 14px;

display:flex;
align-items:center;
justify-content:center;

border:1px solid var(--line);
border-radius:13px;

background:#fff;

color:#596273;

font-size:12px;
font-weight:850
}


/* =========================
   PRICE
========================= */

.price-card{
margin-top:16px;

padding:18px 19px;

border-radius:22px;

background:
linear-gradient(
145deg,
#6246d9 0%,
#6d4be0 55%,
#7950df 100%
);

color:#fff;

box-shadow:
0 12px 28px rgba(98,70,217,.14);

position:relative;
overflow:hidden
}

.price-card:before{
content:"";

position:absolute;

width:110px;
height:110px;

border-radius:50%;

left:-55px;
bottom:-60px;

background:rgba(255,255,255,.07)
}

.price-label{
font-size:12px;
font-weight:600;
opacity:.82
}

.price-line{
display:flex;
align-items:baseline;
gap:7px;

margin-top:2px
}

.price{
font-size:30px;
font-weight:950;
letter-spacing:-.04em
}

.currency{
font-size:12px;
font-weight:800;
opacity:.9
}


/* =========================
   SECTIONS
========================= */

.section{
margin-top:23px
}

.section-title{
margin:0 0 11px;

font-size:18px;
font-weight:900;

letter-spacing:-.03em
}


/* =========================
   SPECS
========================= */

.spec-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.spec{
min-height:68px;

padding:12px;

background:#fff;

border:1px solid var(--line);
border-radius:16px
}

.spec-label{
font-size:10px;
color:var(--muted);

margin-bottom:4px
}

.spec-value{
font-size:13px;
font-weight:900
}


/* =========================
   CONDITION
========================= */

.condition{
background:#fff;

border:1px solid var(--line);
border-radius:19px;

padding:8px
}

.condition-row{
min-height:48px;

padding:0 11px;

display:flex;
align-items:center;
justify-content:space-between;

border-radius:13px
}

.condition-row:nth-child(even){
background:#fafbfc
}

.condition-label{
font-size:11px;
color:var(--muted);
font-weight:700
}

.condition-value{
font-size:12px;
font-weight:900
}


/* =========================
   NOTES
========================= */

.notes{
padding:14px;

background:#fff;

border:1px solid var(--line);
border-radius:17px;

font-size:12px;
line-height:1.8;
color:#4d5965
}


/* =========================
   SELLER
========================= */

.seller{
display:flex;
align-items:center;
gap:11px;

padding:14px;

background:#fff;

border:1px solid var(--line);
border-radius:18px
}

.seller-avatar{
width:42px;
height:42px;

border-radius:13px;

display:grid;
place-items:center;

background:var(--purple-soft);
color:var(--purple);

font-size:16px;
font-weight:900;

flex:0 0 auto
}

.seller-name{
font-size:13px;
font-weight:900
}

.seller-location{
font-size:10px;
color:var(--muted);

margin-top:2px
}


/* =========================
   BOTTOM ACTION
========================= */

.bottom{
position:fixed;

left:0;
right:0;
bottom:0;

z-index:50;

padding:
9px
18px
calc(9px + var(--safe-bottom));

background:rgba(255,255,255,.96);

border-top:1px solid var(--line);

backdrop-filter:blur(12px)
}

.bottom-inner{
width:min(100%,484px);
margin:auto;

display:flex;
gap:8px;

direction:rtl
}

.buy{
flex:1;
height:56px;

border-radius:18px;

background:
linear-gradient(
145deg,
#6246d9,
#7950df
);

color:#fff;

font-size:16px;
font-weight:900;

box-shadow:
0 8px 20px rgba(98,70,217,.16)
}

.bottom-favorite{
width:56px;
height:56px;

border-radius:18px;

background:#fff;

border:1px solid var(--line);

display:grid;
place-items:center;

color:var(--purple)
}

.bottom-favorite svg{
width:22px;
height:22px
}


/* =========================
   LOADING / ERROR
========================= */

.loading,
.error{
padding:80px 20px;

text-align:center;

font-size:13px;
font-weight:700;

color:var(--muted)
}


/* =========================
   SMALL SCREEN
========================= */

@media(max-width:380px){

.gallery{
height:400px
}

.product{
padding-inline:17px
}

.model{
font-size:25px
}

.price{
font-size:27px
}

}
</style>
</head>


<body>

<div class="page">

<header class="header">

<button
class="header-btn"
id="backBtn"
aria-label="رجوع">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M15 18 9 12l6-6"/>

</svg>

</button>


<h1 class="header-title">
تفاصيل الجهاز
</h1>


<div style="width:42px"></div>

</header>


<main id="app">

<div class="loading">
جاري تحميل الجهاز...
</div>

</main>

</div>


<div
class="bottom"
id="bottom"
style="display:none">

<div class="bottom-inner">

<button
class="bottom-favorite"
id="bottomFavorite"
aria-label="المفضلة">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8"
stroke-linecap="round"
stroke-linejoin="round">

<path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/>

</svg>

</button>


<button
class="buy"
id="buyBtn">

شراء الجهاز

</button>

</div>

</div>


<script type="module">

import { supabase }
from "./js/supabase.js";


const app =
document.getElementById("app");

const bottom =
document.getElementById("bottom");

const backBtn =
document.getElementById("backBtn");

const buyBtn =
document.getElementById("buyBtn");

const bottomFavorite =
document.getElementById("bottomFavorite");


const params =
new URLSearchParams(
location.search
);

const deviceId =
params.get("id");


let device = null;


/* =========================
   HELPERS
========================= */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function value(value){

return value
? escapeHTML(value)
: "—";

}


function price(value){

return new Intl.NumberFormat(
"ar-IQ"
).format(
Number(value || 0)
);

}


function images(value){

if(!value)
return [];

if(Array.isArray(value))
return value.filter(Boolean);

try{

const parsed =
JSON.parse(value);

if(Array.isArray(parsed))
return parsed.filter(Boolean);

if(typeof parsed === "string")
return [parsed];

}catch(e){}

return String(value)
.split(",")
.map(x=>x.trim())
.filter(Boolean);

}


function isApple(brand){

return String(brand || "")
.trim()
.toLowerCase()
=== "apple";

}


/* =========================
   BACK
========================= */

backBtn.onclick = () => {

if(history.length > 1)
history.back();
else
location.href="market.html";

};


/* =========================
   SPEC
========================= */

function spec(label,value){

return `

<div class="spec">

<div class="spec-label">
${escapeHTML(label)}
</div>

<div class="spec-value">
${value || "—"}
</div>

</div>

`;

}


function condition(label,value){

return `

<div class="condition-row">

<span class="condition-label">
${escapeHTML(label)}
</span>

<span class="condition-value">
${value || "—"}
</span>

</div>

`;

}


/* =========================
   GALLERY
========================= */

function gallery(list){

if(!list.length){

return `

<div class="gallery">

<div
class="slide"
style="
font-size:12px;
color:#667085;
font-weight:800
">

لا توجد صورة للجهاز

</div>

</div>

`;

}


const slides =
list.map(
(src,i)=>`

<div class="slide">

<img
src="${escapeHTML(src)}"
alt="صورة الجهاز"
loading="${i===0?"eager":"lazy"}"
decoding="async"
draggable="false">

</div>

`
).join("");


const dots =
list.length > 1
?
list.map(
(_,i)=>`

<span
class="image-dot ${i===0?"active":""}">
</span>

`
).join("")
:
"";


return `

<div class="gallery">


<button
class="image-btn image-share"
id="shareBtn"
aria-label="مشاركة">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<circle cx="18" cy="5" r="2.3"/>
<circle cx="6" cy="12" r="2.3"/>
<circle cx="18" cy="19" r="2.3"/>

<path d="m8 10.8 7.7-4.4"/>
<path d="m8 13.2 7.7 4.4"/>

</svg>

</button>


<button
class="image-btn image-favorite"
id="imageFavorite"
aria-label="المفضلة">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8">

<path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/>

</svg>

</button>


<div
class="gallery-track"
id="galleryTrack">

${slides}

</div>


<div
class="image-counter"
id="imageCounter">

1 / ${list.length}

</div>


${
list.length > 1
?
`<div class="image-dots">${dots}</div>`
:
""
}

</div>

`;

}


/* =========================
   RENDER
========================= */

function render(){

const list =
images(device.images);

const apple =
isApple(device.brand);


app.innerHTML = `

${gallery(list)}


<section class="product">

<div class="brand">
${value(device.brand)}
</div>


<h2 class="model">
${value(device.model)}
</h2>


<div class="chips">

${
device.storage
?
`<span class="chip">${value(device.storage)}</span>`
:
""
}

${
device.color
?
`<span class="chip">${value(device.color)}</span>`
:
""
}

<span class="chip">

${
device.sale_type === "auction" ||
device.sale_type === "مزاد"
? "مزاد"
: "بيع مباشر"
}

</span>

</div>


<div class="price-card">

<div class="price-label">
Sale Price
</div>

<div class="price-line">

<span class="price">
${price(device.price)}
</span>

<span class="currency">
د.ع
</span>

</div>

</div>


<section class="section">

<h3 class="section-title">
مواصفات الجهاز
</h3>

<div class="spec-grid">

${spec("الشركة",value(device.brand))}

${spec("الموديل",value(device.model))}

${spec("السعة",value(device.storage))}

${spec("اللون",value(device.color))}

${
apple
?
spec(
"صحة البطارية",
device.battery_health
?
escapeHTML(
device.battery_health
)+"%"
:
"غير مذكورة"
)
:
""
}

${spec(
"الموقع",
value(device.location || "النجف")
)}

</div>

</section>


<section class="section">

<h3 class="section-title">
حالة الجهاز
</h3>

<div class="condition">

${condition(
"حالة الجهاز",
value(device.condition)
)}

${condition(
"حالة الشاشة",
value(device.screen_condition)
)}

${condition(
"حالة الهيكل",
value(device.body_condition)
)}

${condition(
apple ? "Face ID" : "البصمة",
value(device.face_id)
)}

${condition(
"الكاميرات",
value(device.cameras)
)}

${condition(
"الشحن",
value(device.charging)
)}

${condition(
"القطع المبدلة",
value(device.replaced_parts)
)}

</div>

</section>


${
device.notes
?
`

<section class="section">

<h3 class="section-title">
ملاحظات البائع
</h3>

<div class="notes">
${escapeHTML(device.notes)}
</div>

</section>

`
:
""
}


<section class="section">

<h3 class="section-title">
البائع
</h3>

<div class="seller">

<div class="seller-avatar">

${escapeHTML(
String(
device.seller_name ||
"ب"
)
.charAt(0)
)}

</div>

<div>

<div class="seller-name">
${value(
device.seller_name ||
"بائع الجهاز"
)}
</div>

<div class="seller-location">
${value(
device.location ||
"النجف"
)}
</div>

</div>

</div>

</section>

</section>

`;


bottom.style.display="block";

setupGallery(list);

setupShare();

setupFavorite();

}


/* =========================
   GALLERY
========================= */

function setupGallery(list){

const track =
document.getElementById(
"galleryTrack"
);

const counter =
document.getElementById(
"imageCounter"
);

if(!track)
return;


const dots =
[...document.querySelectorAll(
".image-dot"
)];


track.addEventListener(
"scroll",
()=>{

const index =
Math.round(
track.scrollLeft /
track.clientWidth
);


counter.textContent =
`${index+1} / ${list.length}`;


dots.forEach(
(dot,i)=>{

dot.classList.toggle(
"active",
i===index
);

});

},
{
passive:true
}
);

}


/* =========================
   SHARE
========================= */

function setupShare(){

const btn =
document.getElementById(
"shareBtn"
);

if(!btn)return;

btn.onclick =
async ()=>{

try{

if(navigator.share){

await navigator.share({

title:
`${device.brand} ${device.model}`,

text:
"شاهد هذا الجهاز على MZAD PHONE",

url:
location.href

});

}else{

await navigator.clipboard.writeText(
location.href
);

alert("تم نسخ رابط الجهاز");

}

}catch(e){}

};

}


/* =========================
   FAVORITE
========================= */

function setupFavorite(){

const top =
document.getElementById(
"imageFavorite"
);

function toggle(){

top.classList.toggle("active");

bottomFavorite.classList.toggle(
"active"
);

}

top.onclick = toggle;

bottomFavorite.onclick = toggle;

}


/* =========================
   LOAD
========================= */

async function load(){

if(!deviceId){

app.innerHTML=`
<div class="error">
لم يتم تحديد الجهاز.
</div>
`;

return;

}


const {
data,
error
} =
await supabase

.from("devices")

.select("*")

.eq("id",deviceId)

.single();


if(error || !data){

console.error(error);

app.innerHTML=`
<div class="error">
تعذر تحميل بيانات الجهاز.
</div>
`;

return;

}


device=data;

render();

}

load();


/* =========================
   BUY
========================= */

buyBtn.onclick =
async ()=>{

const {
data
} =
await supabase.auth.getSession();


if(!data?.session){

const returnTo =
location.pathname +
location.search;


sessionStorage.setItem(
"mzad_pending_action",
returnTo
);


location.href =
`index.html?login=1&returnTo=${encodeURIComponent(returnTo)}`;

return;

}

alert(
"سيتم ربط عملية الشراء هنا."
);

};

</script>

</body>
</html>
