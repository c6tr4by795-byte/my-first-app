<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">

<title>MZAD PHONE — تفاصيل الجهاز</title>

<style>
:root{
  --bg:#f7f8fa;
  --surface:#fff;
  --ink:#17202a;
  --muted:#667085;
  --line:#e6e9ed;

  --primary:#176b87;
  --primary-dark:#125a73;
  --primary-soft:#e8f3f6;

  --purple:#6246d9;
  --purple-soft:#e5e0ff;

  --success:#159a72;

  --shadow:0 10px 25px rgba(24,44,49,.07);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "SF Pro Display",
  "SF Pro Text",
  "Segoe UI",
  Tahoma,
  Arial,
  sans-serif;

  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.page{
  width:100%;
  max-width:520px;
  margin:auto;
}


/* =========================
   HEADER
========================= */

.header{
  height:64px;

  padding:8px 14px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #f8f7ff 100%
    );

  border-bottom:1px solid #ececf0;
}

.header-side{
  width:40px;
  height:40px;
}

.back-btn{
  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  background:#fff;

  border:1px solid var(--line);
  border-radius:14px;

  color:var(--primary);

  box-shadow:
    0 5px 14px rgba(24,44,49,.05);
}

.back-btn svg{
  width:19px;
  height:19px;
}

.header-title{
  margin:0;

  font-size:18px;
  font-weight:950;

  letter-spacing:-.04em;
}


/* =========================
   GALLERY
========================= */

.gallery{
  position:relative;

  width:100%;
  height:315px;

  background:#fff;

  overflow:hidden;

  border-bottom:1px solid var(--line);
}

.gallery-track{
  width:100%;
  height:100%;

  display:flex;
  direction:ltr;

  overflow-x:auto;
  overflow-y:hidden;

  scroll-snap-type:x mandatory;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.gallery-track::-webkit-scrollbar{
  display:none;
}

.slide{
  width:100%;
  min-width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:8px 16px;

  scroll-snap-align:center;

  background:#fff;
}

.slide img{
  display:block;

  width:100%;
  height:100%;

  max-width:100%;
  max-height:100%;

  object-fit:contain;
  object-position:center;

  border:0;
  box-shadow:none;

  user-select:none;
  -webkit-user-drag:none;
}


/* مشاركة فقط فوق الصورة */

.image-share{
  position:absolute;

  top:12px;
  right:14px;

  width:39px;
  height:39px;

  display:grid;
  place-items:center;

  background:rgba(255,255,255,.96);

  border:1px solid #edf0f2;

  border-radius:13px;

  color:var(--primary);

  box-shadow:
    0 7px 18px rgba(23,32,42,.09);

  z-index:5;
}

.image-share svg{
  width:19px;
  height:19px;
}


/* عداد الصور */

.image-counter{
  position:absolute;

  left:14px;
  bottom:12px;

  min-width:43px;
  height:29px;

  padding:0 9px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:rgba(23,32,42,.76);

  color:#fff;

  font-size:10px;
  font-weight:900;

  direction:ltr;
}


/* النقاط */

.image-dots{
  position:absolute;

  left:50%;
  bottom:15px;

  transform:translateX(-50%);

  display:flex;
  gap:5px;

  direction:ltr;
}

.image-dot{
  width:5px;
  height:5px;

  border-radius:10px;

  background:#cfd5d9;

  transition:.2s ease;
}

.image-dot.active{
  width:15px;
  background:var(--purple);
}


/* =========================
   PRODUCT
========================= */

.product{
  padding:15px 18px 0;
}

.brand{
  color:var(--purple);

  font-size:12px;
  font-weight:950;

  margin-bottom:3px;
}

.model{
  margin:0;

  font-size:25px;
  line-height:1.25;

  font-weight:950;

  letter-spacing:-.05em;
}


/* =========================
   CHIPS
========================= */

.chips{
  display:flex;
  flex-wrap:wrap;

  gap:7px;

  margin-top:11px;
}

.chip{
  min-height:34px;

  padding:0 11px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;

  border:1px solid var(--line);
  border-radius:12px;

  color:#596273;

  font-size:10px;
  font-weight:850;
}


/* =========================
   PRICE
========================= */

.price-card{
  margin-top:14px;

  padding:14px 17px;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      #6246d9,
      #7050df
    );

  color:#fff;

  box-shadow:
    0 9px 20px rgba(98,70,217,.12);
}

.price-label{
  font-size:9px;
  font-weight:800;

  opacity:.78;
}

.price-row{
  display:flex;

  align-items:baseline;

  gap:6px;

  margin-top:1px;
}

.price{
  font-size:27px;
  font-weight:950;

  letter-spacing:-.04em;
}

.currency{
  font-size:11px;
  font-weight:850;
}


/* =========================
   DETAILS INTRO
========================= */

.details-intro{
  margin-top:17px;

  padding:13px 15px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      #eeeaff,
      #eaf5f7
    );

  border:1px solid #e2dff0;
}

.details-title{
  margin:0;

  font-size:16px;
  font-weight:950;

  color:#29245a;
}

.details-subtitle{
  margin:3px 0 0;

  color:var(--muted);

  font-size:9px;
  line-height:1.7;
}


/* =========================
   SECTIONS
========================= */

.section{
  margin-top:19px;
}

.section-head{
  display:flex;
  align-items:center;

  gap:7px;

  margin-bottom:9px;
}

.section-mark{
  width:4px;
  height:19px;

  border-radius:8px;

  background:var(--purple);
}

.section-title{
  margin:0;

  font-size:16px;
  font-weight:950;

  letter-spacing:-.03em;
}


/* =========================
   SPECS
========================= */

.spec-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;
}

.spec{
  min-height:62px;

  padding:10px 11px;

  background:#fff;

  border:1px solid var(--line);

  border-radius:15px;
}

.spec:nth-child(2n){
  background:
    linear-gradient(
      145deg,
      #fff,
      #f7f5ff
    );
}

.spec-label{
  color:var(--muted);

  font-size:9px;

  margin-bottom:4px;
}

.spec-value{
  color:var(--ink);

  font-size:11px;

  font-weight:900;
}


/* =========================
   CONDITION
========================= */

.condition-box{
  padding:6px;

  background:#fff;

  border:1px solid var(--line);

  border-radius:16px;
}

.condition-row{
  min-height:43px;

  padding:0 10px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  border-radius:11px;
}

.condition-row:nth-child(even){
  background:#f8f6ff;
}

.condition-label{
  color:var(--muted);

  font-size:9px;
  font-weight:750;
}

.condition-value{
  color:var(--ink);

  font-size:10px;
  font-weight:900;

  text-align:left;
}

.condition-value.good{
  color:var(--success);
}


/* =========================
   NOTES
========================= */

.notes{
  padding:12px 13px;

  background:#fff;

  border:1px solid var(--line);

  border-radius:15px;

  color:#4f5b66;

  font-size:10px;

  line-height:1.9;
}


/* =========================
   SELLER
========================= */

.seller{
  display:flex;
  align-items:center;

  gap:10px;

  padding:12px 13px;

  background:
    linear-gradient(
      145deg,
      #fff,
      #f4f2ff
    );

  border:1px solid #e3def6;

  border-radius:16px;
}

.seller-avatar{
  width:40px;
  height:40px;

  flex:0 0 40px;

  display:grid;
  place-items:center;

  background:var(--primary-soft);

  color:var(--primary);

  border-radius:12px;

  font-size:15px;
  font-weight:950;
}

.seller-name{
  font-size:11px;
  font-weight:900;
}

.seller-location{
  margin-top:2px;

  color:var(--muted);

  font-size:9px;
}


/* =========================
   PURCHASE
========================= */

.purchase-area{
  padding:
    20px
    18px
    30px;
}

.purchase-inner{
  display:flex;

  align-items:center;

  gap:8px;

  direction:rtl;
}

.buy{
  flex:1;

  height:47px;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #6246d9,
      #7050df
    );

  color:#fff;

  font-size:13px;
  font-weight:950;

  box-shadow:
    0 7px 17px rgba(98,70,217,.13);
}

.purchase-favorite{
  width:47px;
  height:47px;

  flex:0 0 47px;

  display:grid;
  place-items:center;

  background:#fff;

  border:1px solid var(--line);

  border-radius:15px;

  color:var(--purple);
}

.purchase-favorite svg{
  width:19px;
  height:19px;
}

.purchase-favorite.active{
  background:var(--purple-soft);

  border-color:#d8d0ff;
}


/* =========================
   EMPTY / ERROR
========================= */

.loading,
.error{
  padding:80px 20px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
  font-weight:800;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:380px){

  .gallery{
    height:300px;
  }

  .product{
    padding-inline:16px;
  }

  .model{
    font-size:23px;
  }

}

@media(min-height:850px) and (max-width:430px){

  .gallery{
    height:320px;
  }

}
</style>
</head>


<body>

<div class="page">

  <!-- HEADER -->

  <header class="header">

    <button
      class="back-btn"
      id="backBtn"
      aria-label="رجوع">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M15 18 9 12l6-6"/>

      </svg>

    </button>


    <h1 class="header-title">
      تفاصيل الجهاز
    </h1>


    <div class="header-side"></div>

  </header>


  <!-- CONTENT -->

  <main id="app">

    <div class="loading">
      جاري تحميل الجهاز...
    </div>

  </main>

</div>


<script type="module">

import { supabase }
from "./js/supabase.js";


const app =
document.getElementById("app");

const backBtn =
document.getElementById("backBtn");


const params =
new URLSearchParams(
window.location.search
);

const deviceId =
params.get("id");


let device = null;


/* =========================
   HELPERS
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function displayValue(value){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ){

    return "—";

  }

  return escapeHTML(value);

}


function formatPrice(value){

  return new Intl.NumberFormat(
    "ar-IQ"
  ).format(
    Number(value || 0)
  );

}


function getImages(value){

  if(!value){
    return [];
  }


  if(Array.isArray(value)){
    return value.filter(Boolean);
  }


  try{

    const parsed =
      JSON.parse(value);

    if(Array.isArray(parsed)){
      return parsed.filter(Boolean);
    }

    if(
      typeof parsed === "string" &&
      parsed.trim()
    ){
      return [parsed];
    }

  }catch(error){}


  if(typeof value === "string"){

    return value
      .split(",")
      .map(item => item.trim())
      .filter(Boolean);

  }


  return [];
}


function isApple(brand){

  return String(brand || "")
    .trim()
    .toLowerCase() === "apple";

}


/* =========================
   BACK
========================= */

backBtn.addEventListener(
  "click",
  () => {

    if(history.length > 1){

      history.back();

    }else{

      window.location.href =
        "market.html";

    }

  }
);


/* =========================
   SPEC CARD
========================= */

function spec(label,value){

  return `

    <div class="spec">

      <div class="spec-label">
        ${escapeHTML(label)}
      </div>

      <div class="spec-value">
        ${value || "—"}
      </div>

    </div>

  `;

}


/* =========================
   CONDITION
========================= */

function condition(label,value){

  const clean =
    String(value || "")
      .toLowerCase();


  const good =
    clean.includes("يعمل") ||
    clean.includes("ممتاز") ||
    clean.includes("جيد جداً") ||
    clean.includes("سليم");


  return `

    <div class="condition-row">

      <span class="condition-label">
        ${escapeHTML(label)}
      </span>

      <span class="condition-value ${good ? "good" : ""}">
        ${value || "—"}
      </span>

    </div>

  `;

}


/* =========================
   GALLERY
========================= */

function renderGallery(images){

  if(!images.length){

    return `

      <div class="gallery">

        <div
          class="slide"
          style="
            color:#667085;
            font-size:12px;
            font-weight:800;
          ">

          لا توجد صورة للجهاز

        </div>

      </div>

    `;

  }


  const slides =
    images.map(
      (src,index) => `

        <div class="slide">

          <img
            src="${escapeHTML(src)}"
            alt="صورة الجهاز"
            loading="${index === 0 ? "eager" : "lazy"}"
            decoding="async"
            draggable="false">

        </div>

      `
    ).join("");


  const dots =
    images.length > 1
      ?
      images.map(
        (_,index) => `

          <span
            class="image-dot ${index === 0 ? "active" : ""}">
          </span>

        `
      ).join("")
      :
      "";


  return `

    <div class="gallery">

      <button
        class="image-share"
        id="shareBtn"
        aria-label="مشاركة">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">

          <circle cx="18" cy="5" r="2.3"/>
          <circle cx="6" cy="12" r="2.3"/>
          <circle cx="18" cy="19" r="2.3"/>

          <path d="m8 10.8 7.7-4.4"/>
          <path d="m8 13.2 7.7 4.4"/>

        </svg>

      </button>


      <div
        class="gallery-track"
        id="galleryTrack">

        ${slides}

      </div>


      <div
        class="image-counter"
        id="imageCounter">

        1 / ${images.length}

      </div>


      ${
        images.length > 1
          ?
          `
            <div class="image-dots">
              ${dots}
            </div>
          `
          :
          ""
      }

    </div>

  `;

}


/* =========================
   RENDER
========================= */

function renderDevice(){

  const images =
    getImages(device.images);

  const apple =
    isApple(device.brand);


  const saleType =
    String(
      device.sale_type || ""
    ).toLowerCase();


  const saleLabel =
    saleType === "auction" ||
    saleType === "مزاد"
      ?
      "مزاد"
      :
      "بيع مباشر";


  app.innerHTML = `

    ${renderGallery(images)}


    <section class="product">

      <div class="brand">
        ${displayValue(device.brand)}
      </div>


      <h2 class="model">
        ${displayValue(device.model)}
      </h2>


      <div class="chips">

        ${
          device.storage
            ?
            `
              <span class="chip">
                ${displayValue(device.storage)}
              </span>
            `
            :
            ""
        }


        ${
          device.color
            ?
            `
              <span class="chip">
                ${displayValue(device.color)}
              </span>
            `
            :
            ""
        }


        <span class="chip">
          ${saleLabel}
        </span>

      </div>


      <!-- السعر -->

      <div class="price-card">

        <div class="price-label">
          السعر
        </div>

        <div class="price-row">

          <span class="price">
            ${formatPrice(device.price)}
          </span>

          <span class="currency">
            د.ع
          </span>

        </div>

      </div>


      <!-- عنوان واضح للتفاصيل -->

      <div class="details-intro">

        <h3 class="details-title">
          تفاصيل الجهاز
        </h3>

        <p class="details-subtitle">
          المواصفات والحالة ومعلومات البائع
        </p>

      </div>


      <!-- المواصفات -->

      <section class="section">

        <div class="section-head">

          <span class="section-mark"></span>

          <h3 class="section-title">
            مواصفات الجهاز
          </h3>

        </div>


        <div class="spec-grid">

          ${spec(
            "الشركة",
            displayValue(device.brand)
          )}

          ${spec(
            "الموديل",
            displayValue(device.model)
          )}

          ${spec(
            "السعة",
            displayValue(device.storage)
          )}

          ${spec(
            "اللون",
            displayValue(device.color)
          )}


          ${
            apple
              ?
              spec(
                "صحة البطارية",
                device.battery_health
                  ?
                  escapeHTML(
                    device.battery_health
                  ) + "%"
                  :
                  "غير مذكورة"
              )
              :
              ""
          }


          ${spec(
            "الموقع",
            displayValue(
              device.location || "النجف"
            )
          )}

        </div>

      </section>


      <!-- الحالة -->

      <section class="section">

        <div class="section-head">

          <span
            class="section-mark"
            style="background:var(--primary)">
          </span>

          <h3 class="section-title">
            حالة الجهاز
          </h3>

        </div>


        <div class="condition-box">

          ${condition(
            "حالة الجهاز",
            displayValue(device.condition)
          )}

          ${condition(
            "حالة الشاشة",
            displayValue(device.screen_condition)
          )}

          ${condition(
            "حالة الهيكل",
            displayValue(device.body_condition)
          )}

          ${condition(
            apple
              ? "Face ID"
              : "البصمة",
            displayValue(device.face_id)
          )}

          ${condition(
            "الكاميرات",
            displayValue(device.cameras)
          )}

          ${condition(
            "الشحن",
            displayValue(device.charging)
          )}

          ${condition(
            "القطع المبدلة",
            displayValue(device.replaced_parts)
          )}

        </div>

      </section>


      ${
        device.notes
          ?
          `

            <section class="section">

              <div class="section-head">

                <span
                  class="section-mark"
                  style="background:#b59d42">
                </span>

                <h3 class="section-title">
                  ملاحظات البائع
                </h3>

              </div>


              <div class="notes">
                ${escapeHTML(device.notes)}
              </div>

            </section>

          `
          :
          ""
      }


      <!-- البائع -->

      <section class="section">

        <div class="section-head">

          <span
            class="section-mark"
            style="background:var(--purple)">
          </span>

          <h3 class="section-title">
            البائع
          </h3>

        </div>


        <div class="seller">

          <div class="seller-avatar">

            ${escapeHTML(
              String(
                device.seller_name ||
                "ب"
              ).charAt(0)
            )}

          </div>


          <div>

            <div class="seller-name">

              ${displayValue(
                device.seller_name ||
                "بائع الجهاز"
              )}

            </div>


            <div class="seller-location">

              ${displayValue(
                device.location ||
                "النجف"
              )}

            </div>

          </div>

        </div>

      </section>


      <!-- الشراء بالنهاية -->

      <div
        class="purchase-area">

        <div class="purchase-inner">


          <button
            class="purchase-favorite"
            id="bottomFavorite"
            aria-label="المفضلة">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round">

              <path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/>

            </svg>

          </button>


          <button
            class="buy"
            id="buyBtn">

            شراء الجهاز

          </button>


        </div>

      </div>


    </section>

  `;


  setupGallery(images);

  setupShare();

  setupFavorite();

  setupBuy();

}


/* =========================
   GALLERY SCROLL
========================= */

function setupGallery(images){

  const track =
    document.getElementById(
      "galleryTrack"
    );

  const counter =
    document.getElementById(
      "imageCounter"
    );

  const dots =
    [
      ...document.querySelectorAll(
        ".image-dot"
      )
    ];


  if(!track){
    return;
  }


  track.addEventListener(
    "scroll",
    () => {

      const index =
        Math.round(
          track.scrollLeft /
          track.clientWidth
        );


      if(counter){

        counter.textContent =
          `${index + 1} / ${images.length}`;

      }


      dots.forEach(
        (dot,i) => {

          dot.classList.toggle(
            "active",
            i === index
          );

        }
      );

    },
    {
      passive:true
    }
  );

}


/* =========================
   SHARE
========================= */

function setupShare(){

  const shareBtn =
    document.getElementById(
      "shareBtn"
    );


  if(!shareBtn){
    return;
  }


  shareBtn.addEventListener(
    "click",
    async () => {

      try{

        if(navigator.share){

          await navigator.share({

            title:
              `${device.brand} ${device.model}`,

            text:
              "شاهد هذا الجهاز على MZAD PHONE",

            url:
              window.location.href

          });

        }else{

          await navigator.clipboard.writeText(
            window.location.href
          );

          alert(
            "تم نسخ رابط الجهاز"
          );

        }

      }catch(error){}

    }
  );

}

/* =========================
   BUY
========================= */

function setupBuy(){

  const buyBtn =
    document.getElementById(
      "buyBtn"
    );


  if(!buyBtn){
    return;
  }


  buyBtn.addEventListener(
    "click",
    async () => {

      const {
        data
      } =
      await supabase.auth.getSession();


      if(!data?.session){

        const returnTo =
          window.location.pathname +
          window.location.search;


        sessionStorage.setItem(
          "mzad_pending_action",
          returnTo
        );


        window.location.href =
          `index.html?login=1&returnTo=${encodeURIComponent(returnTo)}`;


        return;

      }


      alert(
        "سيتم ربط عملية الشراء هنا."
      );

    }
  );

}


/* =========================
   LOAD DEVICE
========================= */

async function loadDevice(){

  if(!deviceId){

    app.innerHTML = `

      <div class="error">
        لم يتم تحديد الجهاز.
      </div>

    `;

    return;

  }


  const {
    data,
    error
  } =
  await supabase

    .from("devices")

    .select("*")

    .eq("id",deviceId)

    .single();


  if(error || !data){

    console.error(error);


    app.innerHTML = `

      <div class="error">
        تعذر تحميل بيانات الجهاز.
      </div>

    `;

    return;

  }


  device = data;

  renderDevice();

}


loadDevice();

</script>
