<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#6246d9">
<title>تفاصيل الجهاز — MZAD PHONE</title>
<style>
:root{--bg:#f9f8fd;--ink:#17202a;--muted:#6b7280;--line:#ece8fb;--edge:#ddd8f8;--p:#6246d9;--p2:#8b6cf0;--p-dark:#4a34b8;--p-soft:#f3f0ff;--bad:#c62f4d;--bad-soft:#fff0f3;--bad-edge:#f3c0cb;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.page{width:min(100%,520px);margin:0 auto;padding:0 14px calc(110px + var(--sb))}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rot{to{transform:rotate(360deg)}}
header{position:sticky;top:0;z-index:30;margin-inline:-14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(145deg,#fff,#f7f5ff 55%,#ece8ff);border-radius:0 0 22px 22px;border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(23,32,42,.055)}
.ib{width:40px;height:38px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--p);transition:transform .18s}
.ib:active{transform:scale(.94)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-mini{display:flex;flex-direction:column;align-items:center;line-height:.9}
.brand-mini strong{font-size:16px;letter-spacing:-.03em}
.brand-mini span{font-size:7px;font-weight:800;letter-spacing:.15em;color:#8a96a3;margin-top:3px}

.gal{position:relative;margin-top:14px;border-radius:23px;overflow:hidden;background:#f3f0ff;border:1px solid var(--edge);height:clamp(280px,92vw,390px)}
.gt{display:flex;direction:ltr;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gt::-webkit-scrollbar{display:none}
.gs{flex:0 0 100%;height:100%;scroll-snap-align:center;cursor:pointer}
.gs img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.cnt{position:absolute;top:12px;right:12px;padding:6px 11px;border-radius:99px;background:rgba(23,32,42,.62);color:#fff;font-size:11px;font-weight:800;direction:ltr;backdrop-filter:blur(8px);pointer-events:none}
.dots{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;padding:7px 10px;border-radius:99px;background:rgba(23,32,42,.5);pointer-events:none}
.dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.55);transition:.25s}
.dots i.on{width:18px;background:#fff}
.empty{height:100%;display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);font-size:12px;font-weight:800}
.empty svg{width:40px;height:40px;fill:none;stroke:var(--p2);stroke-width:1.6}
.tap{margin:8px 2px 0;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}

.card{margin-top:14px;padding:15px 14px;border-radius:23px;background:#fff;border:1px solid var(--edge);box-shadow:0 7px 24px -14px rgba(98,70,217,.22);animation:up .45s backwards}
.hd{margin:0;font-size:15.5px;font-weight:900}
.sh{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.si{width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#6246d9,#8b6cf0);box-shadow:0 5px 12px rgba(98,70,217,.25)}
.si svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.title{padding:18px 2px 0}
.title small{display:block;font-size:12.5px;font-weight:900;color:var(--p)}
.title h1{margin:3px 0 0;font-size:24px;line-height:1.35;font-weight:900;letter-spacing:-.4px}
.qc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qp{padding:5px 11px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:11.5px;font-weight:800;color:#4b5563}
.price{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,#e6e3f6,#ebe9f7 52%,#e2dff2);border-color:#d8d3ee;box-shadow:0 13px 28px rgba(98,70,217,.10)}
.price>*{position:relative;z-index:1}
.orb{position:absolute!important;z-index:0!important;width:150px;height:150px;border-radius:50%;right:-70px;top:-85px;background:rgba(255,255,255,.42);animation:floaty 6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(8px)}}
.price small{display:block;font-size:11.5px;font-weight:800;color:#6b6290}
.price b{display:block;margin-top:2px;font-size:27px;font-weight:900;color:#4c426f;direction:ltr;text-align:right;white-space:nowrap}
.tag{padding:7px 12px;border-radius:99px;background:linear-gradient(135deg,#6246d9,#8b6cf0);color:#fff;font-size:11px;font-weight:900;white-space:nowrap}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{padding:10px 12px;border-radius:14px;background:#faf9ff;border:1px solid var(--line);min-width:0;animation:up .45s backwards}
.t:nth-child(2){animation-delay:.04s}.t:nth-child(3){animation-delay:.08s}.t:nth-child(4){animation-delay:.12s}.t:nth-child(5){animation-delay:.16s}.t:nth-child(6){animation-delay:.2s}
.t small{display:block;font-size:11px;font-weight:800;color:var(--muted)}
.t b{display:block;margin-top:3px;font-size:13px;font-weight:900;line-height:1.5;color:var(--p-dark)}
.t.w{grid-column:1/-1}
.t.bad{background:var(--bad-soft);border-color:var(--bad-edge)}
.t.bad b{color:var(--bad)}
.ps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pl{display:inline-flex;align-items:center;padding:5px 11px;border-radius:99px;background:var(--p-soft);border:1.5px solid var(--p2);color:var(--p-dark);font-size:11.5px;font-weight:900}
.pl.bad{background:var(--bad-soft);border-color:var(--bad-edge);color:var(--bad)}
.note{margin:0;font-size:14.5px;line-height:2;font-weight:700;color:#4b5563;white-space:pre-wrap}
.seller{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;background:var(--p-soft);color:var(--p)}
.av svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seller b{display:block;font-size:14.5px;font-weight:900}
.seller span{display:block;margin-top:2px;font-size:11.5px;font-weight:700;color:var(--muted)}

.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + var(--sb));z-index:100;pointer-events:none}
.bar div{width:min(100%,500px);margin:0 auto;display:flex;gap:9px;padding:8px;border-radius:22px;background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 8px 24px rgba(23,32,42,.12);backdrop-filter:blur(18px);pointer-events:auto}
.fav{width:54px;height:50px;flex:0 0 54px;border-radius:15px;display:grid;place-items:center;background:var(--p-soft);color:var(--p-dark);border:1px solid var(--edge)}
.fav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fav.on svg{fill:currentColor}
.buy{flex:1;height:50px;border-radius:15px;color:#fff;font-size:15px;font-weight:900;background:linear-gradient(135deg,#6246d9,#8b6cf0);box-shadow:0 10px 22px rgba(98,70,217,.28)}
.buy:active{transform:scale(.97)}

.load{min-height:60vh;display:grid;place-items:center;align-content:center;gap:12px;color:var(--muted);font-size:12px;font-weight:800}
.sp{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--p);animation:rot .8s linear infinite}
.err{margin-top:35px;text-align:center}
.err strong{display:block;font-size:16px;font-weight:900}
.err p{margin:5px 0 14px;font-size:12px;color:var(--muted)}
.err button{height:42px;padding:0 20px;border-radius:99px;background:var(--p);color:#fff;font-weight:900;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--sb));transform:translateX(-50%) translateY(16px);max-width:calc(100% - 40px);padding:10px 14px;border-radius:13px;background:#17202a;color:#fff;font-size:12.5px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:500;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

.pv{position:fixed;inset:0;z-index:200;display:none;background:rgba(10,8,22,.97);touch-action:none}
.pv.open{display:block}
.pv-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 15px 12px}
.pv-c{padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;font-size:11px;font-weight:800;direction:ltr}
.pv .ib{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.pv-st{position:absolute;inset:0;display:grid;place-items:center;padding:75px 14px 30px}
.pv-st img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .18s}
.pv-ar{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;z-index:6}
.pv-ar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <header>
    <button class="ib" id="back" type="button" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="brand-mini"><strong>MZAD</strong><span>PHONE</span></div>
    <button class="ib" id="share" type="button" aria-label="مشاركة"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.5-4.3M8.2 13.2l7.5 4.3"/></svg></button>
  </header>
  <main id="app"><div class="load"><div class="sp"></div><span>جاري تحميل الجهاز...</span></div></main>
</div>

<div class="pv" id="pv" aria-hidden="true">
  <div class="pv-top"><div class="pv-c" id="pvC">01 / 01</div><button class="ib" id="pvX" type="button" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="pv-st" id="pvSt"><img id="pvI" alt="" draggable="false"></div>
  <button class="pv-ar" id="pvP" style="right:12px" type="button" aria-label="السابقة"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="pv-ar" id="pvN" style="left:12px" type="button" aria-label="التالية"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from "./js/supabase.js";
const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get("id");
const app = $("app");
let D = null, imgs = [], vi = 0;

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cl = v => v == null ? "" : String(v).trim();
const money = n => Number.isFinite(Number(n)) && n !== null && n !== "" ? Number(n).toLocaleString("en-US") + " د.ع" : "—";
const BAD = /لا يعمل|لا تعمل|مكسور|خدوش واضحة|ضربات|انبعاج|مبدل|مقفل|متوسط|بديلة/;
const pill = (t, bad) => `<span class="pl${bad === undefined ? (BAD.test(t) ? " bad" : "") : (bad ? " bad" : "")}">${esc(t)}</span>`;
const vals = v => cl(v).split(/[،,]/).map(s => s.trim()).filter(Boolean);
const row = (k, html) => html ? `<div class="rw"><span class="k">${esc(k)}</span><div class="ps">${html}</div></div>` : "";
const pills = v => vals(v).map(x => pill(x)).join("");
// "مفتاح: قيمة | مفتاح: قيمة"
function pairs(s){
  const o = {};
  cl(s).split("|").forEach(p => {
    const i = p.indexOf(":");
    if (i > -1) o[p.slice(0, i).trim()] = p.slice(i + 1).trim();
  });
  return o;
}
let tt;
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => e.classList.remove("show"), 2400); }

function imgURL(p){
  const v = cl(p);
  if (!v) return "";
  if (/^(https?:|data:|blob:)/.test(v)) return v;
  return supabase.storage.from("device-images").getPublicUrl(v).data?.publicUrl || "";
}

/* ===== تحميل ===== */
async function load(){
  if (!id) return fail("رابط الجهاز غير صحيح");
  try{
    let n = null;
    if (/^\d+$/.test(id)){
      const r = await supabase.from("devices").select("*").eq("id", id).maybeSingle();
      if (r.error) throw r.error;
      const d = r.data;
      if (d) n = { brand:d.brand, model:d.model, storage:d.storage, color:d.color, battery:d.battery_health, cond:d.condition,
        screen:d.screen_condition, body:d.body_condition, cams:d.cameras, bio:d.face_id, replaced:d.replaced_parts,
        notes:d.notes, price:d.price, seller:d.seller_name, images:Array.isArray(d.images) ? d.images : [] };
    }
    if (!n){
      const r = await supabase.from("mzad_direct_sales")
        .select("id, asking_price_iqd, status, seller_user_id, device:mzad_devices!mzad_direct_sales_device_id_fkey(*)")
        .eq("device_id", id).in("status", ["active","reserved","pending_handover"]).maybeSingle();
      if (r.error) throw r.error;
      const d = r.data?.device;
      if (d){
        const im = await supabase.from("mzad_device_images").select("storage_path,sort_order").eq("device_id", d.id).order("sort_order", { ascending:true });
        if (im.error) throw im.error;
        n = { brand:d.brand, model:d.model, storage:d.storage, color:d.color, battery:d.battery_health, cond:d.condition_grade,
          screen:d.screen_condition, body:d.scratches_dents, cams:d.camera_condition, bio:d.biometric_condition,
          replaced:d.replaced_parts, faults:d.faults, acc:d.accessories, sim:d.sim_network, notes:d.seller_notes,
          price:r.data.asking_price_iqd, images:(im.data || []).map(x => x.storage_path) };
      }
    }
    if (!n) return fail("الجهاز غير موجود أو لم يعد معروضاً للبيع");
    D = n; render();
  }catch(e){ console.error("DEVICE LOAD ERROR:", e); fail("تعذر تحميل بيانات الجهاز"); }
}

function fail(m){
  app.innerHTML = `<div class="card err"><strong>${esc(m)}</strong><p>تأكد من الرابط وحاول مرة ثانية</p><button id="eb" type="button">العودة للرئيسية</button></div>`;
  $("eb").onclick = () => location.href = "home.html";
}

/* ===== العرض ===== */
function render(){
  const d = D;
  imgs = (d.images || []).map(imgURL).filter(Boolean).slice(0, 10);
  const apple = /apple/i.test(d.brand);

  // الملاحظات: نفصل الضمان والتفاوض عن نص البائع
  let warranty = "", neg = false;
  const notes = cl(d.notes).split("\n").filter(l => {
    if (l.startsWith("الضمان:")){ warranty = l.slice(7).trim(); return false; }
    if (l.includes("السعر قابل للتفاوض")){ neg = true; return false; }
    return true;
  }).join("\n").trim();

  const sim = pairs(d.sim), body = pairs(d.body), cams = pairs(d.cams);
  let bat = cl(d.battery);
  if (bat && /^\d+$/.test(bat)) bat += "%";
  const batBad = bat === "مبدلة" || (parseInt(bat) < 80);
  const tile = (k, v, bad) => v ? `<div class="t${(bad === undefined ? BAD.test(v) : bad) ? " bad" : ""}"><small>${esc(k)}</small><b>${esc(v)}</b></div>` : "";
  const wide = (k, html, bad) => html ? `<div class="t w${bad ? " bad" : ""}"><small>${esc(k)}</small><div class="ps">${html}</div></div>` : "";
  const dot = v => cl(v).replace(/[،,]\s*/g, " • ");
  const sec = (ic, t, inner) => inner ? `<section class="card"><div class="sh"><span class="si"><svg viewBox="0 0 24 24">${ic}</svg></span><h2 class="hd">${t}</h2></div><div class="g">${inner}</div></section>` : "";

  const specs =
    tile("السعة", d.storage, false) + tile("اللون", d.color, false) +
    (apple && bat ? tile("صحة البطارية", bat === "مبدلة" ? "مبدّلة" : bat, batBad) : "") +
    tile("الشريحة", sim["الشريحة"], false) + tile("الإصدار", sim["الإصدار"], false) + tile("قفل الشبكة", sim["الشبكة"]);

  const looks =
    tile("الحالة العامة", d.cond) + tile("الشاشة", d.screen) +
    tile("الهيكل", body["الهيكل"]) + tile("الظهر", body["الظهر"]) +
    tile("الكاميرا الأمامية", dot(cams["الأمامية"])) + tile("الكاميرا الخلفية", dot(cams["الخلفية"]));

  const fx = cl(d.faults).replace(/^لا يعمل:\s*/, "");
  const parts = cl(d.replaced).split("|");
  const orig = !parts[0] || parts[0].trim() === "لا توجد";
  const q = (parts[1] || "").replace("نوع القطع:", "").trim();
  const checks =
    (fx ? wide("لا يعمل", vals(fx).map(x => pill(x, true)).join(""), true) : tile("الوظائف", "كل الوظائف تعمل", false)) +
    (orig ? tile("القطع", "الجهاز أصلي", false) : wide("قطع مبدّلة", vals(parts[0]).map(x => pill(x, true)).join(""), true)) +
    (!orig && q ? tile("نوع القطع", q) : "");

  const extras = wide("الملحقات", pills(d.acc)) + tile("الضمان", warranty, false);
  const qc = [d.storage, d.color, sim["الشريحة"]].filter(Boolean).map(x => `<span class="qp">${esc(x)}</span>`).join("");

  const gallery = imgs.length
    ? `<div class="gt" id="gt">${imgs.map((s, i) => `<div class="gs" data-i="${i}"><img src="${esc(s)}" alt="" ${i ? 'loading="lazy"' : ""} draggable="false"></div>`).join("")}</div>
       <div class="cnt" id="cnt">01 / ${String(imgs.length).padStart(2, "0")}</div>
       ${imgs.length > 1 ? `<div class="dots" id="dots">${imgs.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : ""}`
    : `<div class="empty"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="M21 15l-4.5-4.5L8 19"/></svg>لا توجد صور للجهاز</div>`;

  app.innerHTML = `
    <section class="gal">${gallery}</section>
    ${imgs.length ? '<p class="tap">اضغط على الصورة لعرضها كاملة</p>' : ""}

    <section class="title"><small>${esc(cl(d.brand) || "هاتف")}</small><h1>${esc(cl(d.model) || "جهاز")}</h1>${qc ? `<div class="qc">${qc}</div>` : ""}</section>

    <section class="card price"><i class="orb"></i>
      <div><small>السعر المطلوب</small><b>${money(d.price)}</b>${neg ? '<small style="margin-top:4px;color:var(--p-dark)">قابل للتفاوض</small>' : ""}</div>
      <span class="tag">بيع مباشر</span>
    </section>

    ${sec('<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>', "مواصفات الجهاز", specs)}
    ${sec('<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>', "حالة الجهاز", looks) || sec('<circle cx="12" cy="12" r="9"/>', "حالة الجهاز", tile("الحالة", "غير محددة", false))}
    ${sec('<path d="M5 12.5l4.5 4.5L19 7.5"/>', "الفحص والقطع", checks)}
    ${sec('<path d="M4 8l8-4 8 4v8l-8 4-8-4V8z"/><path d="M4 8l8 4 8-4M12 12v8"/>', "الملحقات والضمان", extras)}
    ${notes ? `<section class="card"><div class="sh"><span class="si"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M9 9h6M9 13h4"/></svg></span><h2 class="hd">ملاحظات البائع</h2></div><p class="note">${esc(notes)}</p></section>` : ""}

    <section class="card seller">
      <div class="av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></div>
      <div><b>${esc(cl(d.seller) || "بائع MZAD PHONE")}</b><span>النجف • عضو في MZAD PHONE</span></div>
    </section>

    <div class="bar"><div>
      <button class="fav" id="fav" type="button" aria-label="المفضلة"><svg viewBox="0 0 24 24"><path d="M20.8 8.9c0 5.1-8.8 10.1-8.8 10.1S3.2 14 3.2 8.9A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.5z"/></svg></button>
      <button class="buy" id="buy" type="button">شراء الجهاز</button>
    </div></div>`;
  setupGallery(); setupActions();
}

/* ===== المعرض ===== */
function setupGallery(){
  const gt = $("gt");
  if (!gt) return;
  const dots = [...document.querySelectorAll("#dots i")];
  gt.addEventListener("scroll", () => requestAnimationFrame(() => {
    const w = gt.clientWidth; if (!w) return;
    const i = Math.max(0, Math.min(Math.round(gt.scrollLeft / w), imgs.length - 1));
    $("cnt").textContent = String(i + 1).padStart(2, "0") + " / " + String(imgs.length).padStart(2, "0");
    dots.forEach((x, k) => x.classList.toggle("on", k === i));
  }), { passive:true });
  gt.addEventListener("click", e => {
    const s = e.target.closest(".gs");
    if (s) openViewer(+s.dataset.i);
  });
}

/* ===== العارض ===== */
function showV(){
  const im = $("pvI");
  im.style.opacity = .35;
  setTimeout(() => { im.src = imgs[vi]; im.style.opacity = 1; }, 80);
  $("pvC").textContent = String(vi + 1).padStart(2, "0") + " / " + String(imgs.length).padStart(2, "0");
  $("pvP").style.display = $("pvN").style.display = imgs.length > 1 ? "grid" : "none";
}
function openViewer(i){ vi = i; showV(); $("pv").classList.add("open"); $("pv").setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; }
function closeViewer(){
  $("pv").classList.remove("open"); $("pv").setAttribute("aria-hidden", "true"); document.body.style.overflow = "";
  const gt = $("gt"); if (gt) gt.scrollTo({ left: vi * gt.clientWidth, behavior:"auto" });
}
const step = n => { vi = (vi + n + imgs.length) % imgs.length; showV(); };
$("pvX").onclick = closeViewer;
$("pvN").onclick = () => step(1);
$("pvP").onclick = () => step(-1);
$("pvSt").addEventListener("click", e => { if (e.target === $("pvSt")) closeViewer(); });
let sx = 0, sy = 0;
$("pvSt").addEventListener("touchstart", e => { sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY; }, { passive:true });
$("pvSt").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
  step(dx < 0 ? 1 : -1);
}, { passive:true });
document.addEventListener("keydown", e => {
  if (!$("pv").classList.contains("open")) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowLeft") step(1);
  if (e.key === "ArrowRight") step(-1);
});

/* ===== الأزرار ===== */
async function needLogin(){
  const { data } = await supabase.auth.getSession();
  if (data?.session) return false;
  const back = location.href;
  sessionStorage.setItem("mzad_pending_action", back);
  toast("سجّل دخولك أو أنشئ حساباً أولاً");
  setTimeout(() => location.href = "index.html?login=1&returnTo=" + encodeURIComponent(back), 450);
  return true;
}
function setupActions(){
  $("fav").onclick = async () => {
    if (await needLogin()) return;
    const on = $("fav").classList.toggle("on");
    toast(on ? "تمت إضافة الجهاز للمفضلة" : "تمت إزالة الجهاز من المفضلة");
  };
  $("buy").onclick = async () => {
    if (await needLogin()) return;
    toast("شراء الجهاز راح نربطه بخطوة الشراء");
  };
}
$("share").onclick = async () => {
  const title = (cl(D?.brand) + " " + cl(D?.model)).trim() || "جهاز على MZAD PHONE";
  try{
    if (navigator.share){ await navigator.share({ title, text:"شوف هذا الجهاز على MZAD PHONE", url:location.href }); return; }
    await navigator.clipboard.writeText(location.href);
    toast("تم نسخ رابط الجهاز");
  }catch(e){ if (e?.name !== "AbortError") toast("تعذر مشاركة الرابط"); }
};
$("back").onclick = () => document.referrer ? history.back() : location.href = "home.html";

load();
</script>
