<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>MZAD PHONE</title>

  <style>
    :root{
      --primary:#176b87;
      --purple:#6246d9;

      --bg:#f7f8fa;
      --card:#ffffff;

      --text:#17212b;
      --muted:#7c8792;
      --line:#edf0f3;

      --pale:#e6e3f6;
      --pale-dark:#d8d3ee;
      --pale-text:#51477d;

      --green:#22a06b;
      --red:#dc4b4b;

      --shadow:0 8px 25px rgba(23,35,45,.06);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    }

    body{
      overflow-x:hidden;
    }

    button{
      font-family:inherit;
    }

    .page{
      width:100%;
      max-width:720px;
      margin:0 auto;
      min-height:100vh;
      background:var(--bg);
    }

    /* =========================
       HEADER
    ========================= */

    .top-header{
      position:relative;
      overflow:hidden;

      padding:
        calc(13px + env(safe-area-inset-top))
        16px
        15px;

      background:
        linear-gradient(
          135deg,
          rgba(23,107,135,.98),
          rgba(35,111,137,.96) 42%,
          rgba(98,70,217,.92)
        );

      color:#fff;

      border-bottom-left-radius:24px;
      border-bottom-right-radius:24px;

      box-shadow:
        0 8px 24px rgba(23,107,135,.12);
    }

    .top-header::after{
      content:"";
      position:absolute;
      left:-10%;
      right:-10%;
      bottom:-34px;
      height:70px;

      background:rgba(255,255,255,.10);

      border-radius:50% 50% 0 0;
      transform:rotate(-1deg);
      pointer-events:none;
    }

    .header-row{
      position:relative;
      z-index:2;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .header-side{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .icon-button{
      width:40px;
      height:40px;

      border:0;
      border-radius:13px;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#fff;
      background:rgba(255,255,255,.13);

      cursor:pointer;

      transition:
        transform .18s ease,
        background .18s ease;
    }

    .icon-button:active{
      transform:scale(.94);
      background:rgba(255,255,255,.20);
    }

    .icon-button svg{
      width:20px;
      height:20px;
      stroke:currentColor;
      fill:none;
      stroke-width:1.9;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .header-title{
      text-align:center;
      flex:1;
      min-width:0;
    }

    .header-title .brand{
      font-size:13px;
      font-weight:800;
      letter-spacing:.5px;
      margin-bottom:2px;
    }

    .header-title .sub{
      font-size:10px;
      color:rgba(255,255,255,.76);
      font-weight:600;
    }

    /* =========================
       MAIN
    ========================= */

    main{
      padding:0 16px 110px;
    }

    .content{
      width:100%;
    }

    /* =========================
       GALLERY
    ========================= */

    .gallery-card{
      width:calc(100% + 32px);
      margin-right:-16px;
      margin-left:-16px;

      margin-bottom:20px;

      border:0;
      border-radius:0;

      box-shadow:none;
      overflow:hidden;

      background:#f1f2f4;
    }

    .gallery{
      position:relative;
      width:100%;
      height:300px;

      background:#f1f2f4;

      overflow:hidden;
      touch-action:pan-y;
    }

    .gallery-track{
      width:100%;
      height:100%;

      display:flex;

      overflow-x:auto;
      overflow-y:hidden;

      scroll-snap-type:x mandatory;
      scroll-behavior:smooth;

      -webkit-overflow-scrolling:touch;

      scrollbar-width:none;
    }

    .gallery-track::-webkit-scrollbar{
      display:none;
    }

    .gallery-slide{
      position:relative;

      flex:0 0 100%;
      width:100%;
      height:100%;

      scroll-snap-align:start;

      cursor:pointer;

      user-select:none;
      -webkit-user-select:none;
    }

    .gallery-slide img{
      display:block;

      width:100%;
      height:100%;

      object-fit:cover;

      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    .gallery-counter{
      position:absolute;
      top:14px;
      right:14px;
      z-index:5;

      min-width:58px;
      height:30px;

      padding:0 10px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:999px;

      background:rgba(15,20,25,.62);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      color:#fff;

      font-size:11px;
      font-weight:800;
      letter-spacing:.4px;

      pointer-events:none;
    }

    .gallery-dots{
      position:absolute;
      left:50%;
      bottom:13px;
      z-index:5;

      transform:translateX(-50%);

      display:flex;
      align-items:center;
      gap:5px;

      padding:6px 9px;

      border-radius:999px;

      background:rgba(15,20,25,.48);

      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      pointer-events:none;
    }

    .gallery-dot{
      width:5px;
      height:5px;

      border-radius:50%;

      background:rgba(255,255,255,.45);

      transition:
        width .2s ease,
        background .2s ease;
    }

    .gallery-dot.active{
      width:16px;
      border-radius:999px;
      background:#fff;
    }

    /* الملاحظة الصغيرة الجديدة */

    .photo-hint{
      margin-top:-8px;
      margin-bottom:8px;

      text-align:center;

      color:#8a96a1;

      font-size:10px;
      font-weight:600;

      line-height:1.6;
    }

    /* =========================
       PRODUCT HEADER
    ========================= */

    .product-head{
      padding-top:2px;
      margin-bottom:18px;
    }

    .product-brand{
      font-size:13px;
      font-weight:800;
      color:var(--primary);
      margin-bottom:4px;
    }

    .product-name{
      margin:0;

      font-size:25px;
      line-height:1.2;

      font-weight:900;
      letter-spacing:-.4px;

      color:var(--text);
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:7px;

      margin-top:12px;
    }

    .chip{
      min-height:34px;

      padding:0 11px;

      display:inline-flex;
      align-items:center;
      justify-content:center;

      border-radius:10px;

      background:#fff;
      border:1px solid var(--line);

      color:#596572;

      font-size:12px;
      font-weight:700;
    }

    .chip.sale{
      background:#fff;
      color:#596572;
    }

    /* =========================
       PRICE
    ========================= */

    .price-card{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;

      padding:15px;

      background:var(--pale);

      border-radius:17px;

      margin-bottom:22px;
    }

    .price-info{
      min-width:0;
    }

    .price-label{
      font-size:11px;
      font-weight:700;
      color:var(--pale-text);

      margin-bottom:4px;
    }

    .price{
      font-size:29px;
      line-height:1;

      font-weight:900;
      letter-spacing:-.6px;

      color:#40375f;
    }

    .price-currency{
      font-size:12px;
      font-weight:800;
      color:var(--pale-text);

      margin-right:4px;
    }

    .price-icon{
      width:48px;
      height:48px;

      flex:0 0 48px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:14px;

      background:var(--pale-dark);

      color:var(--pale-text);
    }

    .price-icon svg{
      width:23px;
      height:23px;

      stroke:currentColor;
      fill:none;

      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* =========================
       SECTION INTRO
    ========================= */

    .details-intro{
      margin-bottom:12px;
    }

    .details-intro strong{
      display:block;

      font-size:15px;
      font-weight:900;

      margin-bottom:3px;
    }

    .details-intro span{
      display:block;

      font-size:12px;
      color:var(--muted);
      font-weight:600;
    }

    .section-title{
      margin:23px 0 11px;

      font-size:17px;
      font-weight:900;

      color:var(--text);
    }

    /* =========================
       SPEC GRID
    ========================= */

    .spec-grid{
      display:grid;

      grid-template-columns:repeat(2, minmax(0,1fr));

      gap:10px;
    }

    .spec-card{
      min-height:88px;

      padding:12px;

      background:var(--card);

      border:1px solid var(--line);

      border-radius:16px;

      box-shadow:var(--shadow);

      display:flex;
      align-items:center;

      gap:10px;
    }

    .spec-icon{
      width:44px;
      height:44px;

      flex:0 0 44px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:13px;

      background:#f0f5f7;
      color:var(--primary);
    }

    .spec-icon svg{
      width:22px;
      height:22px;

      stroke:currentColor;
      fill:none;

      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .spec-text{
      min-width:0;
    }

    .spec-label{
      display:block;

      font-size:11px;
      color:var(--muted);

      font-weight:700;

      margin-bottom:4px;
    }

    .spec-value{
      display:block;

      font-size:13px;
      color:var(--text);

      font-weight:800;

      line-height:1.4;

      word-break:break-word;
    }

    /* =========================
       CONDITION
    ========================= */

    .condition-card{
      padding:16px;

      background:#fff;

      border:1px solid var(--line);

      border-radius:18px;

      box-shadow:var(--shadow);
    }

    .condition-summary{
      display:flex;
      align-items:flex-start;
      gap:12px;

      padding-bottom:14px;

      border-bottom:1px solid var(--line);

      margin-bottom:13px;
    }

    .condition-shield{
      width:46px;
      height:46px;

      flex:0 0 46px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:14px;

      background:#eef7f2;
      color:var(--green);
    }

    .condition-shield svg{
      width:24px;
      height:24px;

      stroke:currentColor;
      fill:none;

      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .condition-summary-text strong{
      display:block;

      font-size:16px;
      font-weight:900;

      margin-bottom:5px;
    }

    .condition-summary-text span{
      display:block;

      font-size:13px;

      color:var(--muted);

      font-weight:600;

      line-height:1.7;
    }

    .condition-list{
      display:grid;
      gap:10px;
    }

    .condition-row{
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;
    }

    .condition-label{
      font-size:12px;
      color:var(--muted);
      font-weight:700;
    }

    .condition-value{
      font-size:14px;
      color:var(--text);
      font-weight:800;

      text-align:left;
    }

    /* status dots removed */
    .status-dot{
      display:none;
    }

    /* =========================
       NOTES
    ========================= */

    .notes-card{
      padding:15px;

      background:#fff;

      border:1px solid var(--line);

      border-radius:17px;

      box-shadow:var(--shadow);

      font-size:15px;
      line-height:1.9;

      color:#45515c;

      white-space:pre-wrap;
      word-break:break-word;
    }

    /* =========================
       SELLER
    ========================= */

    .seller-card{
      padding:15px;

      background:#fff;

      border:1px solid var(--line);

      border-radius:18px;

      box-shadow:var(--shadow);

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;
    }

    .seller-main{
      min-width:0;
    }

    .seller-name{
      font-size:14px;
      font-weight:900;

      margin-bottom:5px;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .seller-meta{
      display:flex;
      flex-wrap:wrap;

      gap:5px 9px;

      font-size:11px;
      color:var(--muted);

      font-weight:600;
    }

    .seller-rating{
      flex:0 0 auto;

      min-width:78px;

      padding:9px 10px;

      border-radius:13px;

      background:#f5f6f8;

      text-align:center;
    }

    .seller-rating strong{
      display:block;

      font-size:14px;
      font-weight:900;

      color:var(--text);
    }

    .seller-rating span{
      display:block;

      margin-top:2px;

      font-size:10px;
      color:var(--muted);

      font-weight:700;
    }

    /* =========================
       BOTTOM ACTION
    ========================= */

    .bottom-action{
      position:fixed;

      left:0;
      right:0;
      bottom:0;

      z-index:50;

      padding:
        10px
        16px
        calc(10px + env(safe-area-inset-bottom));

      background:
        linear-gradient(
          to top,
          rgba(247,248,250,1),
          rgba(247,248,250,.96),
          rgba(247,248,250,0)
        );
    }

    .bottom-action-inner{
      width:100%;
      max-width:720px;

      margin:0 auto;
    }

    .buy-button{
      width:100%;
      min-height:54px;

      border:0;

      border-radius:17px;

      background:var(--pale);

      color:#40375f;

      font-size:15px;
      font-weight:900;

      cursor:pointer;

      box-shadow:
        0 10px 24px rgba(80,70,130,.10);

      transition:
        transform .18s ease,
        background .18s ease;
    }

    .buy-button:active{
      transform:scale(.985);
      background:var(--pale-dark);
    }

    /* =========================
       FULL PHOTO VIEWER
    ========================= */

    .photo-viewer{
      position:fixed;

      inset:0;

      z-index:9999;

      display:none;

      background:#090b0d;
    }

    .photo-viewer.open{
      display:block;
    }

    .viewer-backdrop{
      position:absolute;
      inset:0;

      background:
        radial-gradient(
          circle at center,
          rgba(30,35,40,.35),
          rgba(5,7,9,.98)
        );
    }

    .viewer-top{
      position:absolute;

      top:0;
      left:0;
      right:0;

      z-index:10;

      padding:
        calc(14px + env(safe-area-inset-top))
        16px
        14px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .viewer-count{
      min-width:64px;
      height:32px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:999px;

      background:rgba(255,255,255,.12);

      color:#fff;

      font-size:11px;
      font-weight:800;

      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .viewer-close{
      width:40px;
      height:40px;

      border:0;
      border-radius:13px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:rgba(255,255,255,.12);

      color:#fff;

      cursor:pointer;

      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .viewer-close svg{
      width:21px;
      height:21px;

      stroke:currentColor;
      fill:none;

      stroke-width:2;
      stroke-linecap:round;
    }

    .viewer-track{
      position:absolute;

      inset:0;

      display:flex;

      overflow-x:auto;
      overflow-y:hidden;

      scroll-snap-type:x mandatory;

      scrollbar-width:none;

      touch-action:pan-x;
    }

    .viewer-track::-webkit-scrollbar{
      display:none;
    }

    .viewer-slide{
      flex:0 0 100%;
      width:100%;
      height:100%;

      display:flex;
      align-items:center;
      justify-content:center;

      scroll-snap-align:center;

      padding:
        calc(65px + env(safe-area-inset-top))
        12px
        calc(30px + env(safe-area-inset-bottom));
    }

    .viewer-slide img{
      display:block;

      max-width:100%;
      max-height:100%;

      width:auto;
      height:auto;

      object-fit:contain;

      user-select:none;
      -webkit-user-drag:none;

      border-radius:4px;
    }

    .viewer-hint{
      position:absolute;

      left:50%;
      bottom:calc(17px + env(safe-area-inset-bottom));

      transform:translateX(-50%);

      color:rgba(255,255,255,.65);

      font-size:10px;
      font-weight:600;

      pointer-events:none;
      white-space:nowrap;
    }

    /* =========================
       LOADING / ERROR
    ========================= */

    .loading{
      min-height:60vh;

      display:flex;
      align-items:center;
      justify-content:center;

      color:var(--muted);

      font-size:12px;
      font-weight:700;
    }

    .error-box{
      margin-top:30px;

      padding:22px;

      background:#fff;

      border:1px solid var(--line);

      border-radius:18px;

      text-align:center;

      box-shadow:var(--shadow);
    }

    .error-box strong{
      display:block;

      font-size:16px;
      font-weight:900;

      margin-bottom:6px;
    }

    .error-box span{
      display:block;

      font-size:12px;
      color:var(--muted);

      line-height:1.7;
    }

    .back-home{
      margin-top:16px;

      min-height:44px;

      padding:0 18px;

      border:0;
      border-radius:13px;

      background:var(--primary);

      color:#fff;

      font-size:13px;
      font-weight:800;

      cursor:pointer;
    }

    /* =========================
       TOAST
    ========================= */

    .toast{
      position:fixed;

      left:50%;

      bottom:90px;

      z-index:10000;

      transform:
        translateX(-50%)
        translateY(20px);

      opacity:0;

      pointer-events:none;

      padding:10px 14px;

      max-width:calc(100vw - 32px);

      border-radius:13px;

      background:#182027;
      color:#fff;

      font-size:12px;
      font-weight:700;

      box-shadow:0 12px 30px rgba(0,0,0,.18);

      transition:
        opacity .2s ease,
        transform .2s ease;

      text-align:center;
    }

    .toast.show{
      opacity:1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:360px){

      .product-name{
        font-size:23px;
      }

      .price{
        font-size:27px;
      }

      .spec-label{
        font-size:10px;
      }

      .spec-value{
        font-size:12px;
      }

      .condition-label{
        font-size:10px;
      }

      .condition-value{
        font-size:11px;
      }

      .notes-card{
        font-size:14px;
      }

      .gallery{
        height:270px;
      }
    }

    @media(min-width:600px){

      .gallery{
        height:380px;
      }

      .spec-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- =========================
         HEADER
    ========================= -->

    <header class="top-header">

      <div class="header-row">

        <div class="header-side">

          <button
            class="icon-button"
            id="backButton"
            type="button"
            aria-label="رجوع"
          >
            <svg viewBox="0 0 24 24">
              <path d="M15 18l-6-6 6-6"></path>
            </svg>
          </button>

        </div>

        <div class="header-title">
          <div class="brand">MZAD PHONE</div>
          <div class="sub">تفاصيل الجهاز</div>
        </div>

        <div class="header-side">

          <button
            class="icon-button"
            id="shareButton"
            type="button"
            aria-label="مشاركة"
          >
            <svg viewBox="0 0 24 24">
              <circle cx="18" cy="5" r="2.5"></circle>
              <circle cx="6" cy="12" r="2.5"></circle>
              <circle cx="18" cy="19" r="2.5"></circle>
              <path d="M8.3 10.8l7.4-4.5"></path>
              <path d="M8.3 13.2l7.4 4.5"></path>
            </svg>
          </button>

        </div>

      </div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main id="app">

      <div class="loading">
        جاري تحميل بيانات الجهاز...
      </div>

    </main>


    <!-- =========================
         BOTTOM ACTION
    ========================= -->

    <div
      class="bottom-action"
      id="bottomAction"
      style="display:none;"
    >

      <div class="bottom-action-inner">

        <button
          class="buy-button"
          id="buyButton"
          type="button"
        >
          شراء الجهاز
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       FULL PHOTO VIEWER
  ========================= -->

  <div
    class="photo-viewer"
    id="photoViewer"
    aria-hidden="true"
  >

    <div class="viewer-backdrop"></div>

    function escapeHTML(value){

      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

    }


    function clean(value){

      return String(value ?? "")
        .trim();

    }


    function formatPrice(value){

      const number = Number(value);

      if(!Number.isFinite(number)){
        return "—";
      }

      return number.toLocaleString("ar-IQ");

    }


    function firstLetter(value){

      const text = clean(value);

      return text ? text.charAt(0).toUpperCase() : "M";

    }


    function isApple(brand){

      return clean(brand).toLowerCase() === "apple";

    }


    function parseImages(value){

      if(!value){
        return [];
      }

      if(Array.isArray(value)){
        return value;
      }

      if(typeof value === "string"){

        const text = value.trim();

        if(!text){
          return [];
        }

        try{

          const parsed = JSON.parse(text);

          if(Array.isArray(parsed)){
            return parsed;
          }

        }catch(error){}

        return text
          .split(",")
          .map(item => item.trim())
          .filter(Boolean);
      }

      return [];
    }


    function imageURL(path){

      const value = clean(path);

      if(!value){
        return "";
      }

      if(
        value.startsWith("http://") ||
        value.startsWith("https://") ||
        value.startsWith("data:")
      ){
        return value;
      }

      const cleanPath = value
        .replace(/^\/+/,"")
        .replace(/^device-images\//,"");

      const {
        data
      } = supabase
        .storage
        .from("device-images")
        .getPublicUrl(cleanPath);

      return data?.publicUrl || "";
    }

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {

        toast.classList.remove("show");

      return "بيع مباشر";

        clean(value).toLowerCase();

      if(

        text.includes("ممتاز") ||
        text.includes("جيد جداً") ||
        text.includes("جيد جدا")

        return "ممتاز";

        text.includes("جيد")

      if(
        text.includes("fair") ||
        text.includes("متوسط")

      }

      return clean(value) || "غير محدد";
    }

          .from("devices")
          .select("*")
          .eq("id",deviceId)
          .single();

      if(error){

        renderError(

        return;

      renderDevice(data);

    /* =====================================================
       GALLERY
    ===================================================== */

    function setupGallery(){

      const galleryTrack =
        document.getElementById("galleryTrack");

      if(!galleryTrack || galleryImages.length === 0){
        return;
      }


      const counter =
        document.getElementById("galleryCounter");

      const dots =
        [...document.querySelectorAll(".gallery-dot")];


      function updateGalleryUI(index){

        currentGalleryIndex = index;

        const total =
          galleryImages.length;

        if(counter){

          counter.textContent =
            `${String(index + 1).padStart(2,"0")} / ${String(total).padStart(2,"0")}`;

        }


        dots.forEach((dot,dotIndex) => {

          dot.classList.toggle(
            "active",
            dotIndex === index
          );

        });

      }


      function getCurrentIndex(){

        const width =
          galleryTrack.clientWidth;

        if(!width){
          return 0;
        }

        return Math.round(
          galleryTrack.scrollLeft / width
        );

      }


      galleryTrack.addEventListener(
        "scroll",
        () => {

          const index =
            Math.max(
              0,
              Math.min(
                galleryImages.length - 1,
                getCurrentIndex()
              )
            );

          updateGalleryUI(index);

        },
        {
          passive:true
        }
      );


      /* =========================
         TOUCH / SWIPE
      ========================= */

      galleryTrack.addEventListener(
        "touchstart",
        event => {

          galleryTouchMoved = false;

          galleryTouchStartX =
            event.touches[0]?.clientX || 0;

          stopGalleryAutoplay();

        },
        {
          passive:true
        }
      );


      galleryTrack.addEventListener(
        "touchmove",
        event => {

          const currentX =
            event.touches[0]?.clientX || 0;

          if(
            Math.abs(
              currentX - galleryTouchStartX
            ) > 8
          ){

            galleryTouchMoved = true;

          }

        },
        {
          passive:true
        }
      );


      galleryTrack.addEventListener(
        "touchend",
        () => {

          setTimeout(() => {

            restartGalleryAutoplay();

          },100);

        },
        {
          passive:true
        }
      );


      /* =========================
         CLICK IMAGE = FULL VIEW
      ========================= */

      galleryTrack.addEventListener(
        "click",
        event => {

          /*
            إذا المستخدم سحب الصورة
            لا نعتبرها ضغطة.
          */

          if(galleryTouchMoved){

            galleryTouchMoved = false;

            return;

          }


          const slide =
            event.target.closest(
              ".gallery-slide"
            );

          if(!slide){
            return;
          }


          const slides =
            [...galleryTrack.querySelectorAll(".gallery-slide")];

          const index =
            slides.indexOf(slide);

          if(index >= 0){

            openPhotoViewer(index);

          }

        }
      );


      /* =========================
         DOT CLICK
      ========================= */

      dots.forEach(dot => {

        dot.addEventListener(
          "click",
          event => {

            event.stopPropagation();

            const index =
              Number(
                dot.dataset.index
              );

            if(
              !Number.isInteger(index) ||
              index < 0 ||
              index >= galleryImages.length
            ){
              return;
            }

            goToGallery(index);

          }
        );

      });


      /* =========================
         START AUTOPLAY
      ========================= */

      restartGalleryAutoplay();

    }


    function goToGallery(index){

      const galleryTrack =
        document.getElementById("galleryTrack");

      if(!galleryTrack){
        return;
      }

      const width =
        galleryTrack.clientWidth;

      galleryTrack.scrollTo({

        left:index * width,

        behavior:"smooth"

      });

      currentGalleryIndex = index;

      updateGalleryCounter(index);

      restartGalleryAutoplay();

    }


    function updateGalleryCounter(index){

      const counter =
        document.getElementById("galleryCounter");

      if(!counter){
        return;
      }

      counter.textContent =
        `${String(index + 1).padStart(2,"0")} / ${String(galleryImages.length).padStart(2,"0")}`;


      document
        .querySelectorAll(".gallery-dot")
        .forEach((dot,dotIndex) => {

          dot.classList.toggle(
            "active",
            dotIndex === index
          );

        });

    }


    function stopGalleryAutoplay(){

      if(galleryAutoPlayTimer){

        clearInterval(
          galleryAutoPlayTimer
        );

        galleryAutoPlayTimer = null;

      }

    }


    function restartGalleryAutoplay(){

      stopGalleryAutoplay();

      if(galleryImages.length <= 1){
        return;
      }


      galleryAutoPlayTimer =
        setInterval(() => {

          const nextIndex =
            currentGalleryIndex >= galleryImages.length - 1
            ? 0
            : currentGalleryIndex + 1;

          goToGalleryWithoutRestart(
            nextIndex
          );

        },5000);

    }


    function goToGalleryWithoutRestart(index){

      const galleryTrack =
        document.getElementById("galleryTrack");

      if(!galleryTrack){
        return;
      }

      const width =
        galleryTrack.clientWidth;

      galleryTrack.scrollTo({

        left:index * width,

        behavior:"smooth"

      });

      currentGalleryIndex =
        index;

      updateGalleryCounter(
        index
      );

    }


    /* =====================================================
       PHOTO VIEWER
    ===================================================== */

    function buildPhotoViewer(){

      const viewerTrack =
        document.getElementById("viewerTrack");

      if(!viewerTrack){
        return;
      }


      viewerTrack.innerHTML =
        viewerImages
          .map((src,index) => `

            <div
              class="viewer-slide"
              data-index="${index}"
            >

              <img
                src="${escapeHTML(src)}"
                alt="صورة الجهاز ${index + 1}"
                draggable="false"
              />

            </div>

          `)
          .join("");

    }


    function openPhotoViewer(index = 0){

      if(!viewerImages.length){
        return;
      }

      stopGalleryAutoplay();

      buildPhotoViewer();


      const viewer =
        document.getElementById("photoViewer");

      const viewerTrack =
        document.getElementById("viewerTrack");

      const viewerCount =
        document.getElementById("viewerCount");


      currentViewerIndex =
        Math.max(
          0,
          Math.min(
            viewerImages.length - 1,
            index
          )
        );


      viewer.classList.add("open");

      viewer.setAttribute(
        "aria-hidden",
        "false"
      );


      document.body.style.overflow =
        "hidden";


      updateViewerCount();


      requestAnimationFrame(() => {

        const width =
          viewerTrack.clientWidth;

        viewerTrack.scrollLeft =
          currentViewerIndex * width;

      });

    }


    function closePhotoViewer(){

      const viewer =
        document.getElementById("photoViewer");

      if(!viewer){
        return;
      }

      viewer.classList.remove("open");

      viewer.setAttribute(
        "aria-hidden",
        "true"
      );


      document.body.style.overflow =
        "";


      restartGalleryAutoplay();

    }


    function updateViewerCount(){

      const viewerCount =
        document.getElementById("viewerCount");

      if(!viewerCount){
        return;
      }

      viewerCount.textContent =
        `${String(currentViewerIndex + 1).padStart(2,"0")} / ${String(viewerImages.length).padStart(2,"0")}`;

    }


    function setupViewer(){

      const viewer =
        document.getElementById("photoViewer");

      const viewerTrack =
        document.getElementById("viewerTrack");

      const closeButton =
        document.getElementById("viewerClose");


      closeButton?.addEventListener(
        "click",
        closePhotoViewer
      );


      /*
        الضغط على الخلفية يغلق المشاهد
      */

      viewer
        ?.querySelector(".viewer-backdrop")
        ?.addEventListener(
          "click",
          closePhotoViewer
        );


      /* =========================
         VIEWER SCROLL
      ========================= */

      viewerTrack?.addEventListener(
        "scroll",
        () => {

          const width =
            viewerTrack.clientWidth;

          if(!width){
            return;
          }

          const index =
            Math.round(
              viewerTrack.scrollLeft / width
            );

          currentViewerIndex =
            Math.max(
              0,
              Math.min(
                viewerImages.length - 1,
                index
              )
            );

          updateViewerCount();

        },
        {
          passive:true
        }
      );


      /* =========================
         VIEWER TOUCH
      ========================= */

      viewerTrack?.addEventListener(
        "touchstart",
        event => {

          viewerTouchMoved = false;

          viewerTouchStartX =
            event.touches[0]?.clientX || 0;

        },
        {
          passive:true
        }
      );


      viewerTrack?.addEventListener(
        "touchmove",
        event => {

          const currentX =
            event.touches[0]?.clientX || 0;

          if(
            Math.abs(
              currentX - viewerTouchStartX
            ) > 8
          ){

            viewerTouchMoved = true;

          }

        },
        {
          passive:true
        }
      );


      /*
        النقر على الصورة داخل المشاهد
        لا يغلق المشاهد.
      */

      viewerTrack?.addEventListener(
        "click",
        event => {

          if(viewerTouchMoved){

            viewerTouchMoved = false;

            return;

          }

        }
      );


      /* =========================
         ESC
      ========================= */

      document.addEventListener(
        "keydown",
        event => {

          if(event.key === "Escape"){

            const isOpen =
              document
                .getElementById("photoViewer")
                ?.classList
                .contains("open");

            if(isOpen){

              closePhotoViewer();

            }

          }

        }
      );

    }


    /* =====================================================
       ACTIONS
    ===================================================== */

    function setupActions(){

      const backButton =
        document.getElementById("backButton");

      const shareButton =
        document.getElementById("shareButton");

      const buyButton =
        document.getElementById("buyButton");


      backButton?.addEventListener(
        "click",
        () => {

          if(
            window.history.length > 1
          ){

            window.history.back();

          }else{

            window.location.href =
              "home.html";

          }

        }
      );


      shareButton?.addEventListener(
        "click",
        shareDevice
      );


      buyButton?.addEventListener(
        "click",
        handleBuy
      );

    }


    /* =====================================================
       SHARE
    ===================================================== */

    async function shareDevice(){

      if(!deviceData){
        return;
      }

      const title =
        `${clean(deviceData.brand)} ${clean(deviceData.model)}`;

      const text =
        `شوف هذا الجهاز على MZAD PHONE`;

      const url =
        window.location.href;


      if(
        navigator.share
      ){

        try{

          await navigator.share({

            title,
            text,
            url

          });

          return;

        }catch(error){

          if(
            error?.name === "AbortError"
          ){

            return;

          }

        }

      }


      try{

        await navigator.clipboard.writeText(
          url
        );

        showToast(
          "تم نسخ رابط الجهاز"
        );

      }catch(error){

        showToast(
          "تعذر نسخ الرابط"
        );

      }

    }


    /* =====================================================
       BUY
    ===================================================== */

    async function handleBuy(){

      if(!deviceData){
        return;
      }


      const {
        data
      } =
        await supabase.auth.getSession();


      const session =
        data?.session;


      /*
        إذا المستخدم مو مسجل:
        نوجهه لتسجيل الدخول
        مع حفظ العملية.
      */

      if(!session){

        try{

          sessionStorage.setItem(
            "pendingDeviceAction",
            JSON.stringify({

              action:"buy",
              deviceId:deviceData.id

            })
          );

        }catch(error){}


        window.location.href =
          `index.html?redirect=${encodeURIComponent(
            window.location.href
          )}`;

        return;

      }


      /*
        هنا نخلي المنطق الحالي
        الخاص بالشراء كما هو.
      */

      showToast(
        "سيتم متابعة عملية الشراء عبر المنصة"
      );

    }


    /* =====================================================
       INIT
    ===================================================== */

    setupViewer();

    loadDevice();

  </script>

</body>
