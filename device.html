<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>تفاصيل الجهاز | MZAD PHONE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:#F7F8FA;
      color:#17202A;
      font-family:"Cairo",sans-serif;
    }

    button{
      font:inherit;
      cursor:pointer;
    }

    .page{
      width:100%;
      max-width:520px;
      min-height:100vh;
      margin:auto;
      padding-bottom:105px;
    }


    /* TOPBAR */

    .topbar{
      position:sticky;
      top:0;
      z-index:30;

      height:72px;

      padding:12px 16px;

      background:rgba(255,255,255,.96);
      backdrop-filter:blur(14px);

      border-bottom:1px solid #E6E9ED;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .icon-btn{
      width:42px;
      height:42px;

      border:1px solid #E6E9ED;
      background:#fff;

      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#17202A;

      transition:.18s;
    }

    .icon-btn:active{
      transform:scale(.94);
    }

    .icon-btn svg{
      width:20px;
      height:20px;
    }

    .brand{
      text-align:center;
      line-height:1;
    }

    .brand-main{
      font-size:19px;
      font-weight:800;
      letter-spacing:1.5px;
    }

    .brand-sub{
      margin-top:4px;
      font-size:8px;
      letter-spacing:3px;
      color:#667085;
      font-weight:700;
    }


    /* CONTENT */

    .content{
      padding:14px 16px 0;
    }


    /* GALLERY */

    .gallery{
      position:relative;

      height:310px;

      background:#fff;

      border:1px solid #E6E9ED;
      border-radius:24px;

      overflow:hidden;

      box-shadow:0 8px 26px rgba(23,32,42,.05);

      display:flex;
      align-items:center;
      justify-content:center;
    }

    .gallery-track{
      width:100%;
      height:100%;

      display:flex;

      transition:transform .35s ease;
    }

    .gallery-slide{
      min-width:100%;
      height:100%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#fff;
    }

    .gallery-slide img{
      width:100%;
      height:100%;

      object-fit:contain;

      display:block;

      background:#fff;
    }

    .gallery-empty{
      width:100%;
      height:100%;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      color:#667085;

      text-align:center;
      padding:30px;
    }

    .gallery-empty-icon{
      width:64px;
      height:64px;

      border-radius:20px;

      background:#E5E0FF;
      color:#6246D9;

      display:flex;
      align-items:center;
      justify-content:center;

      margin-bottom:12px;
    }

    .gallery-empty strong{
      font-size:14px;
    }

    .gallery-empty span{
      font-size:11px;
      line-height:1.8;
      margin-top:5px;
    }

    .gallery-arrow{
      position:absolute;

      top:50%;

      width:38px;
      height:38px;

      margin-top:-19px;

      border:1px solid rgba(230,233,237,.9);

      background:rgba(255,255,255,.92);

      border-radius:13px;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#17202A;

      z-index:4;

      box-shadow:0 6px 18px rgba(23,32,42,.08);
    }

    .gallery-arrow.prev{
      right:10px;
    }

    .gallery-arrow.next{
      left:10px;
    }

    .gallery-arrow svg{
      width:18px;
      height:18px;
    }

    .gallery-dots{
      position:absolute;

      bottom:12px;
      left:50%;

      transform:translateX(-50%);

      display:flex;
      align-items:center;
      gap:5px;

      z-index:5;
    }

    .gallery-dot{
      width:6px;
      height:6px;

      border-radius:50%;

      background:#D0D5DD;

      transition:.2s;
    }

    .gallery-dot.active{
      width:18px;
      border-radius:6px;
      background:#6246D9;
    }


    /* BASIC INFO */

    .main-card{
      background:#fff;

      border:1px solid #E6E9ED;
      border-radius:22px;

      padding:18px;

      margin-top:14px;

      box-shadow:0 8px 24px rgba(23,32,42,.04);
    }

    .device-brand{
      color:#6246D9;

      font-size:11px;
      font-weight:800;

      margin-bottom:5px;
    }

    .device-title{
      margin:0;

      font-size:24px;
      line-height:1.35;

      font-weight:800;
    }

    .device-subtitle{
      margin:6px 0 0;

      color:#667085;

      font-size:12px;
    }

    .price-row{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:12px;

      margin-top:18px;

      padding-top:15px;

      border-top:1px solid #EEF0F2;
    }

    .price-label{
      color:#667085;
      font-size:10px;
    }

    .price{
      margin-top:2px;

      font-size:24px;
      font-weight:800;

      color:#243B80;
    }

    .price-unit{
      font-size:12px;
      color:#667085;
      font-weight:700;
    }

    .sale-badge{
      padding:7px 10px;

      border-radius:10px;

      background:#E8F3F6;

      color:#176B87;

      font-size:10px;
      font-weight:800;

      white-space:nowrap;
    }


    /* SECTION */

    .section{
      margin-top:14px;

      background:#fff;

      border:1px solid #E6E9ED;
      border-radius:22px;

      padding:18px;

      box-shadow:0 8px 24px rgba(23,32,42,.04);
    }

    .section-title{
      font-size:14px;
      font-weight:800;

      margin-bottom:14px;
    }


    /* SPECS */

    .spec-grid{
      display:grid;

      grid-template-columns:1fr 1fr;

      gap:9px;
    }

    .spec{
      background:#F8F9FB;

      border:1px solid #EEF0F2;

      border-radius:15px;

      padding:12px;
    }

    .spec-label{
      font-size:10px;
      color:#667085;
    }

    .spec-value{
      margin-top:4px;

      font-size:12px;
      font-weight:800;

      color:#17202A;

      word-break:break-word;
    }


    /* CONDITION */

    .condition-list{
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .condition-row{
      display:flex;
      align-items:center;
      justify-content:space-between;

      min-height:45px;

      padding:10px 12px;

      background:#F8F9FB;

      border:1px solid #EEF0F2;

      border-radius:14px;
    }

    .condition-name{
      font-size:11px;
      color:#667085;
    }

    .condition-value{
      font-size:11px;
      font-weight:800;
      color:#17202A;

      text-align:left;
    }


    /* SELLER */

    .seller{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .seller-avatar{
      width:48px;
      height:48px;

      border-radius:16px;

      background:#E5E0FF;

      color:#6246D9;

      display:flex;
      align-items:center;
      justify-content:center;

      flex-shrink:0;
    }

    .seller-avatar svg{
      width:22px;
      height:22px;
    }

    .seller-name{
      font-size:13px;
      font-weight:800;
    }

    .seller-location{
      margin-top:3px;

      font-size:10px;
      color:#667085;
    }


    /* LOADING */

    .loading{
      padding:50px 20px;

      text-align:center;
      color:#667085;
    }

    .loader{
      width:35px;
      height:35px;

      border:3px solid #E5E0FF;
      border-top-color:#6246D9;

      border-radius:50%;

      margin:0 auto 12px;

      animation:spin .8s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }


    /* ERROR */

    .error-box{
      margin-top:14px;

      background:#fff;

      border:1px solid #E6E9ED;
      border-radius:22px;

      padding:30px 20px;

      text-align:center;
    }

    .error-box strong{
      display:block;

      font-size:15px;
    }

    .error-box span{
      display:block;

      margin-top:6px;

      color:#667085;

      font-size:11px;

      line-height:1.8;
    }

    .error-btn{
      margin-top:16px;

      height:45px;

      padding:0 18px;

      border:0;

      border-radius:13px;

      background:#6246D9;

      color:#fff;

      font-size:12px;

      font-weight:800;
    }


    /* BOTTOM ACTION */

    .bottom-action{
      position:fixed;

      left:50%;
      bottom:12px;

      transform:translateX(-50%);

      width:calc(100% - 24px);
      max-width:496px;

      min-height:70px;

      padding:8px;

      background:rgba(255,255,255,.96);

      backdrop-filter:blur(14px);

      border:1px solid #E6E9ED;

      border-radius:22px;

      box-shadow:0 12px 35px rgba(23,32,42,.14);

      display:grid;

      grid-template-columns:58px 1fr;

      gap:8px;

      z-index:40;
    }

    .favorite-btn{
      border:1px solid #E6E9ED;

      background:#fff;

      border-radius:16px;

      color:#667085;

      display:flex;
      align-items:center;
      justify-content:center;

      transition:.18s;
    }

    .favorite-btn.active{
      color:#6246D9;
      background:#E5E0FF;
      border-color:#D8D0FF;
    }

    .favorite-btn:active{
      transform:scale(.95);
    }

    .favorite-btn svg{
      width:21px;
      height:21px;
    }

    .buy-btn{
      border:0;

      border-radius:16px;

      background:#6246D9;

      color:#fff;

      font-size:14px;
      font-weight:800;

      box-shadow:0 8px 20px rgba(98,70,217,.18);

      transition:.18s;
    }

    .buy-btn:active{
      transform:scale(.985);
    }


    /* TOAST */

    .toast{
      position:fixed;

      left:50%;
      bottom:96px;

      transform:translate(-50%,20px);

      width:calc(100% - 32px);
      max-width:430px;

      background:#17202A;
      color:#fff;

      border-radius:14px;

      padding:13px 15px;

      text-align:center;

      font-size:12px;

      opacity:0;

      pointer-events:none;

      transition:.25s;

      z-index:100;
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }


    @media(max-width:360px){

      .gallery{
        height:285px;
      }

      .device-title{
        font-size:21px;
      }

      .price{
        font-size:21px;
      }

    }

  </style>
</head>


<body>

<div class="page">


  <!-- TOPBAR -->

  <header class="topbar">

    <div class="top-actions">

      <button
        class="icon-btn"
        id="backBtn"
        type="button"
        aria-label="رجوع"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 18 9 12l6-6"/>
        </svg>

      </button>

    </div>


    <div class="brand">

      <div class="brand-main">MZAD</div>

      <div class="brand-sub">PHONE</div>

    </div>


    <button
      class="icon-btn"
      id="shareBtn"
      type="button"
      aria-label="مشاركة"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="18" cy="5" r="3"/>
        <circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/>
        <path d="m8.6 13.5 6.8 4"/>
        <path d="m15.4 6.5-6.8 4"/>
      </svg>

    </button>

  </header>



  <main class="content" id="content">


    <!-- LOADING -->

    <div class="loading" id="loading">

      <div class="loader"></div>

      جاري تحميل الجهاز...

    </div>


  </main>


</div>



<!-- BOTTOM ACTION -->

<div
  class="bottom-action"
  id="bottomAction"
  style="display:none;"
>

  <button
    class="favorite-btn"
    id="favoriteBtn"
    type="button"
    aria-label="إضافة للمفضلة"
  >

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/>
    </svg>

  </button>


  <button
    class="buy-btn"
    id="buyBtn"
    type="button"
  >
    شراء الجهاز
  </button>

</div>



<div class="toast" id="toast"></div>



<script type="module">

  import { supabase } from "./js/supabase.js";


  const content =
    document.getElementById("content");

  const loading =
    document.getElementById("loading");

  const bottomAction =
    document.getElementById("bottomAction");

  const favoriteBtn =
    document.getElementById("favoriteBtn");

  const buyBtn =
    document.getElementById("buyBtn");

  const toast =
    document.getElementById("toast");


  let currentDevice = null;

  let galleryIndex = 0;

  let galleryImages = [];



  /* -------------------------
     TOAST
  ------------------------- */

  function showToast(message){

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(window.__toastTimer);

    window.__toastTimer =
      setTimeout(() => {

        toast.classList.remove("show");

      },2600);

  }



  /* -------------------------
     GET DEVICE ID
  ------------------------- */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const deviceId =
    params.get("id");



  /* -------------------------
     BACK
  ------------------------- */

  document
    .getElementById("backBtn")
    .addEventListener(
      "click",
      () => history.back()
    );



  /* -------------------------
     IMAGE PARSER
  ------------------------- */

  function parseImages(value){

    if(!value){

      return [];

    }


    if(Array.isArray(value)){

      return value.filter(Boolean);

    }


    if(typeof value === "string"){

      try{

        const parsed =
          JSON.parse(value);

        if(Array.isArray(parsed)){

          return parsed.filter(Boolean);

        }

      }catch(error){

        /*
          إذا كانت قيمة واحدة فقط
          وليست JSON
        */

        if(
          value.startsWith("http://") ||
          value.startsWith("https://")
        ){

          return [value];

        }

      }

    }


    return [];

  }



  /* -------------------------
     FORMAT PRICE
  ------------------------- */

  function formatPrice(price){

    const number =
      Number(price);

    if(!Number.isFinite(number)){

      return "—";

    }

    return number.toLocaleString("ar-IQ");

  }



  /* -------------------------
     SAFE TEXT
  ------------------------- */

  function safe(value){

    if(
      value === null ||
      value === undefined ||
      value === ""
    ){

      return "غير محدد";

    }

    return String(value);

  }



  /* -------------------------
     GALLERY
  ------------------------- */

  function renderGallery(images){

    galleryImages = images;

    galleryIndex = 0;


    const hasImages =
      images.length > 0;


    let slides = "";


    if(hasImages){

      slides =
        images
          .map((url,index) => `

            <div class="gallery-slide">

              <img
                src="${url}"
                alt="صورة الجهاز ${index + 1}"
                loading="${index === 0 ? "eager" : "lazy"}"
                onerror="this.style.display='none';"
              >

            </div>

          `)
          .join("");

    }else{

      slides = `

        <div class="gallery-slide">

          <div class="gallery-empty">

            <div class="gallery-empty-icon">

              <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="4" width="18" height="16" rx="3"/>
                <circle cx="8.5" cy="9" r="1.5"/>
                <path d="m21 15-4.5-4.5L7 20"/>
              </svg>

            </div>

            <strong>لا توجد صور للجهاز</strong>

            <span>
              لم يتم رفع صور لهذا الإعلان حتى الآن.
            </span>

          </div>

        </div>

      `;

    }


    const dots =
      hasImages && images.length > 1
        ? `

          <div class="gallery-dots">

            ${images.map((_,i) => `

              <span
                class="gallery-dot ${i === 0 ? "active" : ""}"
                data-index="${i}"
              ></span>

            `).join("")}

          </div>

        `
        : "";


    const arrows =
      hasImages && images.length > 1
        ? `

          <button
            class="gallery-arrow prev"
            id="galleryPrev"
            type="button"
            aria-label="الصورة السابقة"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m14 18-6-6 6-6"/>
            </svg>

          </button>


          <button
            class="gallery-arrow next"
            id="galleryNext"
            type="button"
            aria-label="الصورة التالية"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m10 18 6-6-6-6"/>
            </svg>

          </button>

        `
        : "";


    return `

      <div class="gallery">

        <div
          class="gallery-track"
          id="galleryTrack"
        >

          ${slides}

        </div>

        ${arrows}

        ${dots}

      </div>

    `;

  }



  function updateGallery(){

    const track =
      document.getElementById("galleryTrack");

    if(!track){

      return;

    }


    track.style.transform =
      `translateX(${galleryIndex * 100}%)`;


    document
      .querySelectorAll(".gallery-dot")
      .forEach((dot,index) => {

        dot.classList.toggle(
          "active",
          index === galleryIndex
        );

      });

  }



  function bindGallery(){

    const prev =
      document.getElementById("galleryPrev");

    const next =
      document.getElementById("galleryNext");


    if(prev){

      prev.addEventListener(
        "click",
        () => {

          if(galleryImages.length < 2){

            return;

          }

          galleryIndex =
            galleryIndex <= 0
              ? galleryImages.length - 1
              : galleryIndex - 1;

          updateGallery();

        }
      );

    }


    if(next){

      next.addEventListener(
        "click",
        () => {

          if(galleryImages.length < 2){

            return;

          }

          galleryIndex =
            galleryIndex >= galleryImages.length - 1
              ? 0
              : galleryIndex + 1;

          updateGallery();

        }
      );

    }


    document
      .querySelectorAll(".gallery-dot")
      .forEach(dot => {

        dot.addEventListener(
          "click",
          () => {

            galleryIndex =
              Number(
                dot.dataset.index
              );

            updateGallery();

          }
        );

      });


    /*
      سحب الصور على الهاتف
    */

    const gallery =
      document.querySelector(".gallery");

    if(gallery && galleryImages.length > 1){

      let startX = 0;
      let currentX = 0;
      let dragging = false;


      gallery.addEventListener(
        "touchstart",
        event => {

          startX =
            event.touches[0].clientX;

          dragging = true;

        },
        {passive:true}
      );


      gallery.addEventListener(
        "touchmove",
        event => {

          if(!dragging){

            return;

          }

          currentX =
            event.touches[0].clientX;

        },
        {passive:true}
      );


      gallery.addEventListener(
        "touchend",
        () => {

          if(!dragging){

            return;

          }

          const difference =
            currentX - startX;

          dragging = false;


          if(Math.abs(difference) < 45){

            return;

          }


          if(difference < 0){

            galleryIndex =
              galleryIndex >= galleryImages.length - 1
                ? 0
                : galleryIndex + 1;

          }else{

            galleryIndex =
              galleryIndex <= 0
                ? galleryImages.length - 1
                : galleryIndex - 1;

          }


          updateGallery();

        }
      );

    }

  }



  /* -------------------------
     RENDER DEVICE
  ------------------------- */

  function renderDevice(device){

    const images =
      parseImages(device.images);


    const brand =
      safe(device.brand);


    const model =
      safe(device.model);


    const storage =
      safe(device.storage);


    const color =
      safe(device.color);


    const battery =
      device.battery_health !== null &&
      device.battery_health !== undefined &&
      device.battery_health !== ""
        ? `${device.battery_health}%`
        : "غير محددة";


    const condition =
      safe(device.condition);


    const screenCondition =
      safe(device.screen_condition);


    const bodyCondition =
      safe(device.body_condition);


    const faceId =
      safe(device.face_id);


    const cameras =
      safe(device.cameras);


    const charging =
      safe(device.charging);


    const replacedParts =
      safe(device.replaced_parts);


    const location =
      safe(device.location || "النجف");


    const sellerName =
      safe(
        device.seller_name ||
        "مستخدم MZAD PHONE"
      );


    content.innerHTML = `

      ${renderGallery(images)}


      <!-- BASIC INFO -->

        <div class="price-row">

          <div>

            <div class="price-label">

            </div>

            <div class="price">
              ${formatPrice(device.price)}

            </div>

          </div>


          <div class="sale-badge">
            بيع مباشر
          </div>

        </div>

      </section>



      <!-- SPECS -->

      <section class="section">

        <div class="section-title">
          مواصفات الجهاز
        </div>


        <div class="spec-grid">

          <div class="spec">

            <div class="spec-label">
              الشركة
            </div>

            <div class="spec-value">
              ${brand}
            </div>

          </div>


          <div class="spec">

            <div class="spec-label">
              الموديل
            </div>

            <div class="spec-value">
              ${model}
            </div>

          </div>


          <div class="spec">

            <div class="spec-label">
              السعة
            </div>

            <div class="spec-value">
              ${storage}
            </div>

          </div>


          <div class="spec">

            <div class="spec-label">
              اللون
            </div>

            <div class="spec-value">
              ${color}
            </div>

          </div>


          <div class="spec">

            <div class="spec-label">
              صحة البطارية
            </div>

            <div class="spec-value">
              ${battery}
            </div>

          </div>


          <div class="spec">

            <div class="spec-label">
              الحالة العامة
            </div>

            <div class="spec-value">
              ${condition}
            </div>

          </div>

        </div>

      </section>



      <!-- CONDITION -->

      <section class="section">

        <div class="section-title">
          حالة الجهاز
        </div>


        <div class="condition-list">


          <div class="condition-row">

            <span class="condition-name">
              الشاشة

            <span class="condition-value">

          </div>


          <div class="condition-row">

              الهيكل

            </span>

          </div>


          <div class="condition-row">

            <span class="condition-name">
              Face ID / البصمة

            <span class="condition-value">

          <div class="condition-row">

            <span class="condition-name">
              الكاميرات

            <span class="condition-value">
              ${cameras}
            </span>

          </div>


          <div class="condition-row">

      <!-- LOCATION -->

      <!-- SELLER -->

      <section class="section">

          <div class="seller-avatar">

        </div>

      </section>

    `;


    bindGallery();


    bottomAction.style.display =
      "grid";

  }



  /* -------------------------
     LOAD DEVICE
  ------------------------- */

  async function loadDevice(){

    if(!deviceId){

      loading.remove();

      content.innerHTML = `

        <div class="error-box">

          <strong>
            الجهاز غير محدد
          </strong>

          <span>
            رابط الجهاز غير صحيح أو لا يحتوي على رقم الجهاز.
          </span>

          <button
            class="error-btn"
            id="errorBack"
            type="button"
          >
            رجوع
          </button>

        </div>

      `;


      document
        .getElementById("errorBack")
        ?.addEventListener(
          "click",
          () => history.back()
        );


      return;

    }


    const { data, error } =
      await supabase
        .from("devices")
        .select("*")
        .eq("id", deviceId)
        .single();


    if(error){

      console.error(
        "DEVICE LOAD ERROR:",
        error
      );


      loading.remove();

      content.innerHTML = `

        <div class="error-box">

          <strong>
            ما قدرنا نجيب الجهاز
          </strong>

          <span>
            ممكن الإعلان غير موجود أو صار خطأ بالاتصال.
          </span>

          <button
            class="error-btn"
            id="errorBack"
            type="button"
          >
            رجوع
          </button>

        </div>

      `;


      document
        .getElementById("errorBack")
        ?.addEventListener(
          "click",
          () => history.back()
        );


      return;

    }


    if(!data){

      loading.remove();

      content.innerHTML = `

        <div class="error-box">

          <strong>
            الجهاز غير موجود
          </strong>

          <span>
            هذا الإعلان لم يعد متوفراً.
          </span>

          <button
            class="error-btn"
            id="errorBack"
            type="button"
          >
            رجوع
          </button>

        </div>

      `;


      document
        .getElementById("errorBack")
        ?.addEventListener(
          "click",
          () => history.back()
        );


      return;

    }


    currentDevice = data;


    loading.remove();


    renderDevice(data);

  }



  /* -------------------------
     AUTH
  ------------------------- */

  async function isLoggedIn(){

    try{

      const { data, error } =
        await supabase.auth.getSession();


      if(error){

        console.error(
          "SESSION ERROR:",
          error
        );

        return false;

      }


      return !!data?.session;

    }catch(error){

      console.error(
        "SESSION CHECK ERROR:",
        error
      );

      return false;

    }

  }



  /* -------------------------
     BUY
  ------------------------- */

  buyBtn.addEventListener(
    "click",
    async () => {

      if(!currentDevice){

        return;

      }


      const loggedIn =
        await isLoggedIn();


      if(!loggedIn){

        const returnTo =
          `device.html?id=${encodeURIComponent(currentDevice.id)}`;


        window.location.href =
          "index.html?login=1&returnTo=" +
          encodeURIComponent(returnTo);


        return;

      }


      /*
        حالياً ما سوينا نظام شراء كامل.
        لذلك بعد تسجيل الدخول نثبت أن
        الحماية تعمل، وبعدين نبني خطوة الشراء.
      */

      showToast(
        "تم التحقق من حسابك — نكمل إجراء الشراء بالخطوة القادمة"
      );

    }
  );



  /* -------------------------
     FAVORITE
  ------------------------- */

  favoriteBtn.addEventListener(
    "click",
    async () => {

      if(!currentDevice){

        return;

      }


      const loggedIn =
        await isLoggedIn();


      if(!loggedIn){

        const returnTo =
          `device.html?id=${encodeURIComponent(currentDevice.id)}`;


        window.location.href =
          "index.html?login=1&returnTo=" +
          encodeURIComponent(returnTo);


        return;

      }


      favoriteBtn.classList.toggle(
        "active"
      );


      showToast(
        favoriteBtn.classList.contains("active")
          ? "تمت إضافة الجهاز للمفضلة"
          : "تمت إزالة الجهاز من المفضلة"
      );

    }
  );



  /* -------------------------
     SHARE
  ------------------------- */

  document
    .getElementById("shareBtn")
    .addEventListener(
      "click",
      async () => {

        const shareUrl =
          window.location.href;


        try{

          if(
            navigator.share
          ){

            await navigator.share({

              title:
                currentDevice
                  ? `${currentDevice.brand || ""} ${currentDevice.model || ""}`.trim()
                  : "MZAD PHONE",

              text:
                "شوف هذا الجهاز على MZAD PHONE",

              url:
                shareUrl

            });

          }else{

            await navigator.clipboard.writeText(
              shareUrl
            );

            showToast(
              "تم نسخ رابط الجهاز"
            );

          }

        }catch(error){

          /*
            المستخدم ممكن يلغي المشاركة.
            ما نعرض خطأ بهالحالة.
          */

          console.log(
            "SHARE CANCELLED"
          );

        }

      }
  );



  /* -------------------------
     START
  ------------------------- */

  loadDevice();

</script>

</body>
</html>
