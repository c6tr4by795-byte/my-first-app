<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>MZAD PHONE</title>

  <style>
    :root{
      --petrol:#176b87;
      --petrol-dark:#125a71;

      --purple:#6246d9;

      --pale:#e6e3f6;
      --pale-dark:#d8d3ee;
      --pale-text:#51477d;

      --bg:#f7f8fa;
      --card:#ffffff;

      --text:#17191c;
      --muted:#8a9098;
      --line:#eceef2;

      --green:#25a86b;
      --red:#d94d5c;

      --shadow:0 10px 28px rgba(20,30,40,.07);

      --radius:20px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      overflow-x:hidden;
    }

    button,
    input,
    textarea{
      font:inherit;
    }

    button{
      border:0;
      outline:0;
    }

    .page{
      min-height:100vh;
      padding-bottom:110px;
    }

    /* =========================
       HEADER
    ========================= */

    .top-header{
      position:relative;
      overflow:hidden;
      padding:
        calc(env(safe-area-inset-top) + 13px)
        16px
        18px;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(255,255,255,.20),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #176b87 0%,
          #286f91 36%,
          #6246d9 72%,
          #7560dc 100%
        );

      color:#fff;
      border-radius:0 0 30px 30px;
      box-shadow:0 8px 25px rgba(23,107,135,.16);
    }

    .top-header::before{
      content:"";
      position:absolute;
      width:240px;
      height:120px;
      left:-80px;
      bottom:-80px;
      border-radius:50%;
      background:rgba(255,255,255,.10);
      filter:blur(2px);
      animation:headerFloat 7s ease-in-out infinite;
    }

    .top-header::after{
      content:"";
      position:absolute;
      width:280px;
      height:140px;
      right:-100px;
      top:-90px;
      border-radius:50%;
      background:rgba(255,255,255,.08);
      animation:headerFloat2 8s ease-in-out infinite;
    }

    @keyframes headerFloat{
      0%,100%{transform:translate3d(0,0,0)}
      50%{transform:translate3d(35px,-8px,0)}
    }

    @keyframes headerFloat2{
      0%,100%{transform:translate3d(0,0,0)}
      50%{transform:translate3d(-25px,15px,0)}
    }

    .header-row{
      position:relative;
      z-index:2;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .header-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .header-back{
      width:40px;
      height:40px;
      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#fff;
      background:rgba(255,255,255,.13);
      backdrop-filter:blur(10px);

      cursor:pointer;
    }

    .header-back svg{
      width:20px;
      height:20px;
    }

    .header-title{
      min-width:0;
    }

    .header-title strong{
      display:block;
      font-size:17px;
      font-weight:800;
      line-height:1.2;
    }

    .header-title span{
      display:block;
      margin-top:3px;
      font-size:11px;
      opacity:.82;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .header-icon{
      width:40px;
      height:40px;
      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#fff;
      background:rgba(255,255,255,.13);
      backdrop-filter:blur(10px);

      cursor:pointer;
    }

    .header-icon svg{
      width:19px;
      height:19px;
    }

    /* =========================
       MAIN
    ========================= */

    main{
      width:100%;
      max-width:720px;
      margin:0 auto;
      padding:0 16px;
    }

    /* =========================
       GALLERY
    ========================= */

    .gallery-card{
      width:calc(100% + 32px);
      margin-right:-16px;
      margin-left:-16px;
      margin-bottom:20px;

      border:0;
      border-radius:0;
      box-shadow:none;
      overflow:hidden;
      background:#f1f2f4;
    }

    .gallery{
      position:relative;
      width:100%;
      height:300px;

      display:flex;
      overflow-x:auto;
      overflow-y:hidden;

      scroll-snap-type:x mandatory;
      scrollbar-width:none;

      background:#f1f2f4;
    }

    .gallery::-webkit-scrollbar{
      display:none;
    }

    .gallery-slide{
      flex:0 0 100%;
      height:100%;
      scroll-snap-align:center;
      position:relative;
      background:#f1f2f4;
    }

    .gallery-slide img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      user-select:none;
      -webkit-user-drag:none;
    }

    .gallery-empty{
      width:100%;
      height:100%;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#a2a7ae;
      font-size:13px;
    }

    .gallery-counter{
      position:absolute;
      top:14px;
      right:14px;
      z-index:5;

      padding:7px 10px;
      border-radius:12px;

      background:rgba(20,20,25,.58);
      color:#fff;

      font-size:11px;
      font-weight:700;

      backdrop-filter:blur(10px);
    }

    .gallery-dots{
      position:absolute;
      bottom:13px;
      left:50%;
      transform:translateX(-50%);

      z-index:5;

      display:flex;
      align-items:center;
      gap:5px;

      padding:6px 8px;
      border-radius:999px;

      background:rgba(15,18,22,.48);
      backdrop-filter:blur(10px);
    }

    .gallery-dot{
      width:5px;
      height:5px;
      border-radius:50%;
      background:rgba(255,255,255,.50);

      transition:
        width .25s ease,
        background .25s ease;
    }

    .gallery-dot.active{
      width:15px;
      background:#fff;
      border-radius:999px;
    }

    /* =========================
       PHOTO MOTION ZONE
       المنطقة الجديدة فقط
    ========================= */

    .photo-motion-zone{
      position:relative;

      height:62px;

      margin:
        -20px
        0
        4px;

      display:flex;
      align-items:center;
      justify-content:center;

      cursor:pointer;

      outline:none;
      user-select:none;
    }

    .photo-motion-zone:active{
      transform:scale(.995);
    }

    .photo-motion-line{
      position:relative;

      width:82px;
      height:2px;

      border-radius:999px;

      background:
        linear-gradient(
          90deg,
          rgba(23,107,135,0),
          rgba(23,107,135,.18),
          rgba(98,70,217,.18),
          rgba(23,107,135,0)
        );

      overflow:hidden;
    }

    .photo-motion-line::before{
      content:"";

      position:absolute;
      top:0;
      left:-35px;

      width:35px;
      height:2px;

      border-radius:999px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.95),
          rgba(98,70,217,.72),
          transparent
        );

      filter:blur(.3px);

      animation:
        photoLight 2.7s ease-in-out infinite;
    }

    .photo-motion-dot{
      position:absolute;

      width:5px;
      height:5px;

      border-radius:50%;

      background:var(--purple);

      box-shadow:
        0 0 0 4px rgba(98,70,217,.07),
        0 0 12px rgba(98,70,217,.24);

      animation:
        photoDot 3.2s ease-in-out infinite;
    }

    @keyframes photoLight{
      0%{
        transform:translateX(0);
        opacity:0;
      }

      20%{
        opacity:.8;
      }

      50%{
        opacity:1;
      }

      80%{
        opacity:.8;
      }

      100%{
        transform:translateX(117px);
        opacity:0;
      }
    }

    @keyframes photoDot{
      0%,100%{
        transform:translateX(-35px);
        opacity:.45;
      }

      50%{
        transform:translateX(35px);
        opacity:.95;
      }
    }

    .photo-motion-zone:focus-visible{
      border-radius:14px;
      box-shadow:0 0 0 2px rgba(98,70,217,.18);
    }

    /* =========================
       PRODUCT HEAD
    ========================= */

    .product-head{
      margin-top:0;
      margin-bottom:18px;
    }

    .brand{
      font-size:13px;
      color:var(--petrol);
      font-weight:800;
      margin-bottom:4px;
    }

    .product-name{
      margin:0;

      font-size:25px;
      line-height:1.2;
      font-weight:850;
      letter-spacing:-.3px;
    }

    .product-meta{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:7px;

      margin-top:11px;
    }

    .meta-chip{
      height:34px;
      padding:0 12px;

      display:flex;
      align-items:center;

      border-radius:11px;

      background:#fff;
      border:1px solid var(--line);

      color:#5e646d;
      font-size:12px;
      font-weight:700;
    }

    .meta-chip.sale{
      background:#fff;
      color:#646a72;
    }

    /* =========================
       PRICE CARD
    ========================= */

    .price-card{
      position:relative;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;

      padding:16px;

      margin-bottom:20px;

      border-radius:20px;

      background:var(--pale);
      border:1px solid rgba(98,70,217,.06);
    }

    .price-info{
      min-width:0;
    }

    .price-label{
      display:block;
      margin-bottom:3px;

      color:var(--pale-text);

      font-size:11px;
      font-weight:700;
    }

    .price{
      display:flex;
      align-items:baseline;
      gap:5px;

      color:#29243f;

      font-size:29px;
      line-height:1;

      font-weight:900;
      letter-spacing:-.6px;
    }

    .price-currency{
      font-size:12px;
      font-weight:800;
      color:var(--pale-text);
    }

    .price-icon{
      flex:0 0 auto;

      width:52px;
      height:52px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:16px;

      background:rgba(255,255,255,.55);
      color:var(--pale-text);
    }

    .price-icon svg{
      width:24px;
      height:24px;
    }

    /* =========================
       DETAILS INTRO
    ========================= */

    .details-intro{
      margin-bottom:12px;
    }

    .details-intro strong{
      display:block;

      font-size:15px;
      line-height:1.35;
      font-weight:850;
    }

    .details-intro span{
      display:block;

      margin-top:3px;

      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section{
      margin-bottom:20px;
    }

    .section-title{
      margin-bottom:10px;

      font-size:17px;
      line-height:1.3;
      font-weight:850;
    }

    /* =========================
       SPECS
    ========================= */

    .spec-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:9px;
    }

    .spec-card{
      min-height:88px;

      padding:13px 12px;

      display:flex;
      flex-direction:column;
      justify-content:space-between;

      border-radius:17px;

      background:#fff;
      border:1px solid var(--line);

      box-shadow:0 5px 16px rgba(20,30,40,.035);
    }

    .spec-top{
      display:flex;
      align-items:center;
      gap:9px;
    }

    .spec-icon{
      flex:0 0 auto;

      width:38px;
      height:38px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:12px;

      background:#f3f5f7;
      color:var(--petrol);
    }

    .spec-icon svg{
      width:20px;
      height:20px;
    }

    .spec-label{
      color:#969ba2;
      font-size:11px;
      font-weight:700;
    }

    .spec-value{
      margin-top:9px;

      color:#292d32;

      font-size:13px;
      line-height:1.35;
      font-weight:800;

      word-break:break-word;
    }

    /* =========================
       PROTECTION
    ========================= */

    .protection-card{
      position:relative;

      display:flex;
      align-items:flex-start;
      gap:12px;

      padding:16px;

      border-radius:20px;

      background:#fff;
      border:1px solid var(--line);

      box-shadow:var(--shadow);
    }

    .protection-icon{
      flex:0 0 auto;

      width:46px;
      height:46px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:15px;

      background:#eef8f4;
      color:var(--green);
    }

    .protection-icon svg{
      width:25px;
      height:25px;
    }

    .protection-text strong{
      display:block;

      font-size:16px;
      line-height:1.3;
      font-weight:850;
    }

    .protection-text span{
      display:block;

      margin-top:5px;

      color:#747a82;
      font-size:13px;
      line-height:1.65;
    }

    /* =========================
       CONDITION
    ========================= */

    .condition-summary{
      padding:16px;

      border-radius:20px;

      background:#fff;
      border:1px solid var(--line);

      box-shadow:0 5px 18px rgba(20,30,40,.035);
    }

    .condition-summary strong{
      display:block;

      font-size:16px;
      line-height:1.35;
      font-weight:850;
    }

    .condition-summary > span{
      display:block;

      margin-top:5px;

      color:#777d85;

      font-size:13px;
      line-height:1.6;
    }

    .condition-grid{
      margin-top:13px;

      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
    }

    .condition-item{
      padding:12px;

      border-radius:15px;

      background:#f8f9fa;
      border:1px solid #f0f1f3;
    }

    .condition-item-label{
      display:block;

      color:#92979e;

      font-size:12px;
      font-weight:700;
    }

    .condition-item-value{
      display:block;

      margin-top:4px;

      color:#292d32;

      font-size:14px;
      line-height:1.45;
      font-weight:800;
    }

    .condition-item.good .condition-item-value{
      color:#18885b;
    }

    .condition-item.warn .condition-item-value{
      color:#aa7a17;
    }

    .condition-item.bad .condition-item-value{
      color:#bd4654;
    }

    /* =========================
       NOTES
    ========================= */

    .notes-card{
      padding:16px;

      border-radius:20px;

      background:#fff;
      border:1px solid var(--line);
    }

    .notes-card p{
      margin:0;

      color:#555b63;

      font-size:15px;
      line-height:1.75;
      white-space:pre-wrap;
    }

    /* =========================
       SELLER
    ========================= */

    .seller-card{
      display:flex;
      align-items:center;
      gap:12px;

      padding:15px;

      border-radius:20px;

      background:#fff;
      border:1px solid var(--line);
    }

    .seller-avatar{
      display:none;
    }

    .seller-main{
      min-width:0;
      flex:1;
    }

    .seller-name{
      font-size:14px;
      font-weight:850;
    }

    .seller-meta{
      margin-top:3px;

      color:#92979e;

      font-size:11px;
    }

    .seller-rating{
      flex:0 0 auto;

      text-align:left;
    }

    .seller-rating strong{
      display:block;

      color:#353941;

      font-size:14px;
      font-weight:850;
    }

    .seller-rating span{
      display:block;

      margin-top:2px;

      color:#a0a5ac;

      font-size:10px;
    }

    /* =========================
       ACTION BAR
    ========================= */

    .action-bar{
      position:fixed;
      right:0;
      bottom:0;
      left:0;

      z-index:50;

      padding:
        10px
        16px
        calc(10px + env(safe-area-inset-bottom));

      background:rgba(247,248,250,.90);
      backdrop-filter:blur(18px);

      border-top:1px solid rgba(0,0,0,.05);
    }

    .action-inner{
      width:100%;
      max-width:720px;
      margin:0 auto;

      display:flex;
      align-items:center;
      gap:9px;
    }

    .action-small{
      flex:0 0 48px;

      width:48px;
      height:50px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:16px;

      background:#fff;
      border:1px solid var(--line);

      color:#555b63;

      cursor:pointer;
    }

    .action-small svg{
      width:21px;
      height:21px;
    }

    .buy-button{
      flex:1;

      min-height:50px;

      border-radius:16px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:var(--pale);
      color:var(--pale-text);

      font-size:15px;
      font-weight:900;

      cursor:pointer;

      transition:
        transform .18s ease,
        background .18s ease;
    }

    .buy-button:active{
      transform:scale(.985);
      background:var(--pale-dark);
    }

    /* =========================
       LOADING
    ========================= */

    .loading{
      min-height:70vh;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#858b93;

      font-size:12px;
      font-weight:700;
    }

    .loading-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }

    .loading-spinner{
      width:30px;
      height:30px;

      border-radius:50%;

      border:3px solid #e5e8ec;
      border-top-color:var(--petrol);

      animation:spin .8s linear infinite;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    /* =========================
       ERROR
    ========================= */

    .error-box{
      min-height:70vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:20px;

      text-align:center;
    }

    .error-card{
      width:100%;
      max-width:360px;

      padding:25px 20px;

      border-radius:22px;

      background:#fff;
      border:1px solid var(--line);
    }

    .error-card strong{
      display:block;

      font-size:16px;
      font-weight:850;
    }

    .error-card p{
      margin:8px 0 18px;

      color:#858b93;

      font-size:12px;
      line-height:1.7;
    }

    .back-home{
      height:45px;
      padding:0 18px;

      border-radius:14px;

      background:var(--petrol);
      color:#fff;

      font-size:13px;
      font-weight:800;

      cursor:pointer;
    }

    /* =========================
       TOAST
    ========================= */

    .toast{
      position:fixed;

      left:50%;
      bottom:88px;

      z-index:100;

      transform:
        translate(-50%,20px);

      opacity:0;
      pointer-events:none;

      max-width:calc(100% - 30px);

      padding:11px 15px;

      border-radius:13px;

      background:#22262b;
      color:#fff;

      font-size:12px;
      line-height:1.4;
      font-weight:700;

      box-shadow:0 12px 30px rgba(0,0,0,.18);

      transition:
        opacity .22s ease,
        transform .22s ease;
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    /* =========================
       FULLSCREEN PHOTO VIEWER
    ========================= */

    .photo-viewer{
      position:fixed;
      inset:0;

      z-index:200;

      display:none;

      background:
        rgba(8,10,14,.97);

      opacity:0;

      transition:opacity .22s ease;
    }

    .photo-viewer.open{
      display:block;
      opacity:1;
    }

    .photo-viewer-top{
      position:absolute;
      top:0;
      right:0;
      left:0;

      z-index:5;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:
        calc(env(safe-area-inset-top) + 14px)
        15px
        14px;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.42),
          transparent
        );
    }

    .viewer-counter{
      padding:7px 10px;

      border-radius:11px;

      color:#fff;
      background:rgba(255,255,255,.11);

      font-size:11px;
      font-weight:800;

      backdrop-filter:blur(12px);
    }

    .viewer-close{
      width:40px;
      height:40px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:14px;

      background:rgba(255,255,255,.11);
      color:#fff;

      cursor:pointer;

      backdrop-filter:blur(12px);
    }

    .viewer-close svg{
      width:20px;
      height:20px;
    }

    .viewer-stage{
      position:absolute;
      inset:0;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:
        72px
        18px
        38px;

      overflow:hidden;

      touch-action:none;
    }

    .viewer-image{
      max-width:100%;
      max-height:100%;

      width:auto;
      height:auto;

      object-fit:contain;

      border-radius:4px;

      user-select:none;
      -webkit-user-drag:none;

      transform:
        scale(.96);

      opacity:0;

      transition:
        opacity .22s ease,

    /* =========================================
       HELPERS
    ========================================= */

    function escapeHTML(value){
      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }

    function clean(value, fallback = "غير محدد"){
      const text = String(value ?? "").trim();
      return text || fallback;
    }

    function formatPrice(value){

      const number = Number(value);

      if(!Number.isFinite(number)){
        return clean(value,"0");
      }

      return new Intl.NumberFormat("en-US").format(number);
    }

    function firstLetter(value){

      const text = String(value ?? "").trim();

      if(!text){
        return "M";
      }

      return text.charAt(0).toUpperCase();
    }

    function isApple(brand){
      return String(brand ?? "")
        .toLowerCase()
        .includes("apple")
      ||
      String(brand ?? "")
        .toLowerCase()
        .includes("iphone");
    }

    function parseImages(value){

      if(Array.isArray(value)){
        return value;
      }

      if(!value){
        return [];
      }

      if(typeof value === "string"){

        const trimmed = value.trim();

        if(!trimmed){
          return [];
        }

        try{

          const parsed = JSON.parse(trimmed);

          if(Array.isArray(parsed)){
            return parsed;
          }

          if(typeof parsed === "string"){
            return [parsed];
          }

        }catch{}

        return trimmed
          .split(",")
          .map(item => item.trim())
          .filter(Boolean);
      }

      return [];
    }

    function imageURL(path){

      if(!path){
        return "";
      }

      const value = String(path).trim();

      if(!value){
        return "";
      }

      if(
        value.startsWith("http://") ||
        value.startsWith("https://") ||
        value.startsWith("data:")
      ){
        return value;
      }

      const {
        data
      } = supabase
        .storage
        .from("device-images")
        .getPublicUrl(value);

      return data?.publicUrl || "";
    }

    function showToast(message){

      toast.textContent = message;

      toast.classList.add("show");

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
      },2300);
    }

    function normalizeSaleType(value){

      const text = String(value ?? "")
        .trim()
        .toLowerCase();

      if(
        text.includes("auction") ||
        text.includes("مزاد") ||
        text.includes("bid")
      ){
        return "auction";
      }

      return "direct";
    }

    function normalizeCondition(value){

      const text = String(value ?? "")
        .trim()
        .toLowerCase();

      if(
        text.includes("new") ||
        text.includes("جديد")
      ){
        return "new";
      }

      if(
        text.includes("excellent") ||
        text.includes("ممتاز")
      ){
        return "excellent";
      }

      if(
        text.includes("very good") ||
        text.includes("جيد جدا") ||
        text.includes("جيد جدًا")
      ){
        return "very-good";
      }

      if(
        text.includes("good") ||
        text.includes("جيد")
      ){
        return "good";
      }

      return "other";
    }

    function conditionStatus(value){

      const normalized = normalizeCondition(value);

      if(normalized === "new"){
        return {
          text:"جديد",
          className:"good"
        };
      }

      if(normalized === "excellent"){
        return {
          text:"ممتاز",
          className:"good"
        };
      }

      if(normalized === "very-good"){
        return {
          text:"جيد جداً",
          className:"good"
        };
      }

      if(normalized === "good"){
        return {
          text:"جيد",
          className:"warn"
        };
      }

      return {
        text:clean(value),
        className:"warn"
      };
    }

    function statusClass(value){
      return conditionStatus(value).className;
    }

    /* =========================================

    ========================================= */

      try{

        const {
          data,
          error
        } = await supabase
          .from("devices")
          .select("*")
          .eq("id",deviceId)
          .single();

        if(error){
          throw error;
        }

          throw new Error("Device not found");

        currentDevice = data;

        actionBar.hidden = false;

        showError(

    }

            </div>

          </div>

        </section>

        <section class="section">

          <div class="protection-card">

            <div class="protection-icon">

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 3l7 3v5c0 4.8-3 8.3-7 10-4-1.7-7-5.2-7-10V6l7-3Z"
                />
                <path d="M8.5 12l2.2 2.2 4.8-5"/>
              </svg>

            </div>

            <div class="protection-text">

              <strong>
                حماية MZAD PHONE
              </strong>

              <span>
                بيانات الجهاز موثقة من البائع
                <br>
                التواصل والبيع يتم عبر المنصة
              </span>

            </div>

          </div>

        </section>

        <section class="section">

          <div class="section-title">
            حالة الجهاز
          </div>

          <div class="condition-summary">

            <strong>
              ${escapeHTML(condition.text)}
            </strong>

            <span>
              الحالة العامة للجهاز حسب بيانات البائع
            </span>

            <div class="condition-grid">

              <div
                class="condition-item ${statusClass(
                  device.screen_condition
                )}"
              >
                <span class="condition-item-label">
                  حالة الشاشة
                </span>

                <span class="condition-item-value">
                  ${escapeHTML(
                    clean(
                      device.screen_condition,
                      "غير محددة"
                    )
                  )}
                </span>
              </div>

              <div
                class="condition-item ${statusClass(
                  device.body_condition
                )}"
              >
                <span class="condition-item-label">
                  حالة الهيكل
                </span>

                <span class="condition-item-value">
                  ${escapeHTML(
                    clean(
                      device.body_condition,
                      "غير محددة"
                    )
                  )}
                </span>
              </div>

              <div
                class="condition-item ${
                  device.battery_health
                    ? "good"
                    : "warn"
                }"
              >
                <span class="condition-item-label">
                  صحة البطارية
                </span>

                <span class="condition-item-value">
                  ${escapeHTML(
                    clean(
                      device.battery_health,
                      "غير محددة"
                    )
                  )}
                </span>
              </div>

              <div
                class="condition-item ${
                  faceId ? "good" : "warn"
                }"
              >
                <span class="condition-item-label">
                  Face ID
                </span>

                <span class="condition-item-value">
                  ${escapeHTML(
                    faceId || "غير محدد"
                  )}
                </span>
              </div>

            </div>

          </div>

        </section>

        ${
          device.notes
            ? `
              <section class="section">

                <div class="section-title">
                  ملاحظات البائع
                </div>

                <div class="notes-card">

                  <p>
                    ${escapeHTML(
                      clean(device.notes,"")
                    )}
                  </p>

                </div>

              </section>
            `
            : ""
        }

        <section class="section">

          <div class="section-title">
            البائع
          </div>

          <div class="seller-card">

            <div class="seller-avatar">
              ${escapeHTML(
                firstLetter(device.seller_name)
              )}
            </div>

            <div class="seller-main">

              <div class="seller-name">
                ${escapeHTML(
                  clean(
                    device.seller_name,
                    "بائع MZAD PHONE"
                  )
                )}
              </div>

              <div class="seller-meta">
                ${escapeHTML(
                  clean(
                    device.location,
                    "العراق"
                  )
                )}
                · عضو في MZAD PHONE
              </div>

            </div>

            <div class="seller-rating">

              <strong>
                0.0
              </strong>

              <span>
                التقييم
              </span>

            </div>

          </div>

        </section>

      `;
    }

    /* =========================================
       GALLERY
    ========================================= */

    function setupGallery(){

      const gallery =
        document.getElementById("gallery");

      if(!gallery){
        return;
      }

      const counter =
        document.getElementById(
          "galleryCounter"
        );

      const dots =
        Array.from(
          document.querySelectorAll(
            ".gallery-dot"
          )
        );

      function updateGallery(){

        const width =
          gallery.clientWidth || 1;

        const index =
          Math.round(
            gallery.scrollLeft / width
          );

        const safeIndex =
          Math.max(
            0,
            Math.min(
              currentImages.length - 1,
              index
            )
          );

        if(counter){
          counter.textContent =
            `${safeIndex + 1} / ${currentImages.length}`;
        }

        dots.forEach((dot,i) => {
          dot.classList.toggle(
            "active",
            i === safeIndex
          );
        });
      }

      gallery.addEventListener(
        "scroll",
        updateGallery,
        {
          passive:true
        }
      );

      dots.forEach(dot => {

        dot.addEventListener(
          "click",
          event => {

            event.stopPropagation();

            const index =
              Number(
                dot.dataset.index
              );

            gallery.scrollTo({
              left:
                gallery.clientWidth * index,
              behavior:"smooth"
            });

          }
        );

      });

      gallery.addEventListener(
        "click",
        event => {

          const slide =
            event.target.closest(
              ".gallery-slide"
            );

          if(!slide){
            return;
          }

          const slides =
            Array.from(
              gallery.querySelectorAll(
                ".gallery-slide"
              )
            );

          const index =
            slides.indexOf(slide);

          if(index >= 0){
            openPhotoViewer(index);
          }

        }
      );

      updateGallery();
    }

    /* =========================================
       PHOTO MOTION
    ========================================= */

    function setupPhotoMotion(images){

      const zone =
        document.getElementById(
          "photoMotionZone"
        );

      if(!zone || !images.length){
        return;
      }

      function open(){
        openPhotoViewer(0);
      }

      zone.addEventListener(
        "click",
        open
      );

      zone.addEventListener(
        "keydown",
        event => {

          if(
            event.key === "Enter" ||
            event.key === " "
          ){

            event.preventDefault();

            open();
          }

        }
      );
    }

    /* =========================================
       FULLSCREEN VIEWER
    ========================================= */

    function openPhotoViewer(index = 0){

      if(!currentImages.length){
        return;
      }

      currentViewerIndex =
        Math.max(
          0,
          Math.min(
            currentImages.length - 1,
            index
          )
        );

      updateViewerImage();

      photoViewer.classList.add("open");

      photoViewer.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.style.overflow = "hidden";
    }

    function closePhotoViewer(){

      photoViewer.classList.remove("open");

      photoViewer.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.style.overflow = "";
    }

    function updateViewerImage(){

      const src =
        currentImages[currentViewerIndex];

      if(!src){
        return;
      }

      viewerImage.classList.remove(
        "switching"
      );

      void viewerImage.offsetWidth;

      viewerImage.src = src;

      viewerImage.alt =
        currentDevice
          ? `${clean(
              currentDevice.brand,
              "الجهاز"
            )} ${clean(
              currentDevice.model,
              ""
            )}`
          : "صورة الجهاز";

      viewerCounter.textContent =
        `${currentViewerIndex + 1} / ${currentImages.length}`;

      viewerImage.classList.add(
        "switching"
      );

      viewerPrev.style.display =
        currentImages.length > 1
          ? ""
          : "none";

      viewerNext.style.display =
        currentImages.length > 1
          ? ""
          : "none";
    }

    function nextPhoto(){

      if(!currentImages.length){
        return;
      }

      if(
        currentViewerIndex <
        currentImages.length - 1
      ){
        currentViewerIndex++;
      }else{
        currentViewerIndex = 0;
      }

      updateViewerImage();
    }

    function previousPhoto(){

      if(!currentImages.length){
        return;
      }

      if(currentViewerIndex > 0){
        currentViewerIndex--;
      }else{
        currentViewerIndex =
          currentImages.length - 1;
      }

      updateViewerImage();
    }

    viewerClose.addEventListener(
      "click",
      closePhotoViewer
    );

    viewerPrev.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        previousPhoto();
      }
    );

    viewerNext.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        nextPhoto();
      }
    );

    viewerStage.addEventListener(
      "click",
      event => {

        if(event.target === viewerStage){
          closePhotoViewer();
        }

      }
    );

    /* =========================================
       TOUCH SWIPE
    ========================================= */

    viewerStage.addEventListener(
      "touchstart",
      event => {

        const touch =
          event.changedTouches[0];

        touchStartX =
          touch.clientX;

        touchStartY =
          touch.clientY;

      },
      {
        passive:true
      }
    );

    viewerStage.addEventListener(
      "touchend",
      event => {

        const touch =
          event.changedTouches[0];

        const dx =
          touch.clientX - touchStartX;

        const dy =
          touch.clientY - touchStartY;

        if(Math.abs(dx) < 50){
          return;
        }

        if(
          Math.abs(dx) <
          Math.abs(dy)
        ){
          return;
        }

        if(dx < 0){
          nextPhoto();
        }else{
          previousPhoto();
        }

      },
      {
        passive:true
      }
    );

    /* =========================================
       DOUBLE TAP
    ========================================= */

    viewerImage.addEventListener(
      "click",
      event => {

        const now =
          Date.now();

        if(
          now - lastTapTime <
          300
        ){

          event.preventDefault();

          if(
            viewerImage.style.transform ===
            "scale(1.8)"
          ){

            viewerImage.style.transform =
              "scale(1)";

          }else{

            viewerImage.style.transform =
              "scale(1.8)";

          }

        }

        lastTapTime = now;
      }
    );

    /* =========================================
       KEYBOARD
    ========================================= */

    document.addEventListener(
      "keydown",
      event => {

        if(
          !photoViewer.classList.contains(
            "open"
          )
        ){
          return;
        }

        if(event.key === "Escape"){
          closePhotoViewer();
        }

        if(event.key === "ArrowLeft"){
          nextPhoto();
        }

        if(event.key === "ArrowRight"){
          previousPhoto();
        }

      }
    );

    /* =========================================
       ACTIONS
    ========================================= */

    function setupActions(){

      shareBtn.onclick =
        shareDevice;

      favoriteBtn.onclick =
        toggleFavorite;

      buyBtn.onclick =
        handleBuy;

      backBtn.onclick = () => {

        if(
          window.history.length > 1
        ){
          window.history.back();
        }else{
          window.location.href =
            "home.html";
        }

      };

      updateBuyButton();
    }

    function updateBuyButton(){

      if(!currentDevice){
        return;
      }

      const saleType =
        normalizeSaleType(
          currentDevice.sale_type
        );

      buyBtn.textContent =
        saleType === "auction"
          ? "المزايدة على الجهاز"
          : "شراء الجهاز";
    }

    /* =========================================
       SHARE
    ========================================= */

    async function shareDevice(){

      if(!currentDevice){
        return;
      }

      const url =
        window.location.href;

      const title =
        `${clean(
          currentDevice.brand,
          "جهاز"
        )} ${clean(
          currentDevice.model,
          ""
        )}`;

      try{

        if(
          navigator.share
        ){

          await navigator.share({
            title,
            text:
              `شاهد هذا الجهاز على MZAD PHONE`,
            url
          });

          return;
        }

        if(
          navigator.clipboard
        ){

          await navigator.clipboard.writeText(
            url
          );

          showToast(
            "تم نسخ رابط الجهاز"
          );

          return;
        }

        showToast(
          "تعذر مشاركة الرابط"
        );

      }catch(error){

        if(
          error?.name !==
          "AbortError"
        ){
          console.error(error);
        }

      }
    }

    /* =========================================
       FAVORITE
    ========================================= */

    async function toggleFavorite(){

      if(!currentDevice){
        return;
      }

      const {
        data: {
          user
        }
      } =
        await supabase.auth.getUser();

      if(!user){

        localStorage.setItem(
          "pendingOperation",
          JSON.stringify({
            type:"favorite",
            deviceId:currentDevice.id
          })
        );

        localStorage.setItem(
          "returnAfterLogin",
          window.location.href
        );

        window.location.href =
          "index.html";

        return;
      }

      /*
        لا نغير قاعدة البيانات هنا.
        نترك منطق المفضلة الحالي كما هو
        في مشروعك إذا كان مربوطاً بصفحة/جدول مستقل.
      */

      favoriteIcon.setAttribute(
        "fill",
        "currentColor"
      );

      favoriteBtn.style.color =
        "var(--purple)";

      showToast(
        "تمت إضافة الجهاز للمفضلة"
      );
    }

    /* =========================================
       BUY / AUCTION
    ========================================= */

    async function handleBuy(){

      if(!currentDevice){
        return;
      }

      const {
        data: {
          user
        }
      } =
        await supabase.auth.getUser();

      if(!user){

        localStorage.setItem(
          "pendingOperation",
          JSON.stringify({
            type:
              normalizeSaleType(
                currentDevice.sale_type
              ) === "auction"
                ? "bid"
                : "buy",
            deviceId:currentDevice.id
          })
        );

        localStorage.setItem(
          "returnAfterLogin",
          window.location.href
        );

        window.location.href =
          "index.html";

        return;
      }

      const saleType =
        normalizeSaleType(
          currentDevice.sale_type
        );

      if(saleType === "auction"){

        showToast(
          "سيتم فتح المزاد لهذا الجهاز"
        );

        /*
          لا نغيّر نظام المزادات أو قاعدة البيانات.
          إذا كانت صفحة المزاد موجودة عندك،
          يتم توجيه المستخدم إليها من نفس النظام.
        */

        return;
      }

      showToast(
        "تم اختيار الجهاز للشراء"
      );
    }

    /* =========================================
       ERROR
    ========================================= */

    function showError(message){

      actionBar.hidden = true;

      app.innerHTML = `

        <div class="error-box">

          <div class="error-card">

            <strong>
              تعذر تحميل الجهاز
            </strong>

            <p>
              ${escapeHTML(message)}
            </p>

            <button
              class="back-home"
              type="button"
              id="errorBackHome"
            >
              العودة للرئيسية
            </button>

          </div>

        </div>

      `;

      document
        .getElementById(
          "errorBackHome"
        )
        ?.addEventListener(
          "click",
          () => {
            window.location.href =
              "home.html";
          }
        );
    }

    /* =========================================
       START
    ========================================= */

    loadDevice();

  </script>
