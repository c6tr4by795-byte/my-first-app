<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta
name="theme-color"
content="#f7f8fa">

<title>MZAD PHONE — تفاصيل الجهاز</title>


<style>

/* =====================================================
   MZAD PHONE — DEVICE IDENTITY
===================================================== */

:root{

  /* Home identity */
  --bg:#f7f8fa;
  --surface:#ffffff;
  --ink:#17202a;
  --muted:#667085;
  --line:#e6e9ed;

  --primary:#176b87;
  --primary-dark:#125a73;
  --primary-soft:#e8f3f6;

  /* New accent colors inspired by reference */
  --pink:#dc3a50;
  --pink-dark:#c92f45;
  --pink-soft:#fdecef;

  --cyan:#67c7cd;
  --cyan-dark:#329da6;
  --cyan-soft:#e8f8f8;

  --cream:#f2ebe3;
  --cream-dark:#e2d0b9;

  /* Keep Home purple only as a tiny supporting color */
  --purple:#6246d9;
  --purple-soft:#eeeaff;

  --success:#159a72;

  --shadow:
    0 12px 30px rgba(24,44,49,.07);

}


/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  background:var(--bg);

  color:var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;

}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.page{
  width:100%;
  max-width:520px;
  margin:auto;
}


/* =====================================================
   HEADER
===================================================== */

.header{

  height:66px;

  padding:8px 14px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #faf9fc 100%
    );

  border-bottom:1px solid var(--line);

}

.header-side{
  width:40px;
  height:40px;
}

.header-title{

  margin:0;

  font-size:19px;

  font-weight:950;

  letter-spacing:-.045em;

}

.back-btn{

  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  background:#fff;

  color:var(--primary);

  border:1px solid var(--line);

  border-radius:14px;

  box-shadow:
    0 5px 14px rgba(24,44,49,.05);

}

.back-btn svg{

  width:20px;
  height:20px;

}


/* =====================================================
   GALLERY
===================================================== */

.gallery{

  position:relative;

  width:100%;

  height:318px;

  background:#fff;

  overflow:hidden;

  border-bottom:1px solid var(--line);

}

.gallery-track{

  width:100%;
  height:100%;

  display:flex;

  direction:ltr;

  overflow-x:auto;
  overflow-y:hidden;

  scroll-snap-type:x mandatory;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;

}

.gallery-track::-webkit-scrollbar{
  display:none;
}

.slide{

  width:100%;
  min-width:100%;

  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:8px 16px;

  background:#fff;

  scroll-snap-align:center;

}

.slide img{

  display:block;

  width:100%;
  height:100%;

  max-width:100%;
  max-height:100%;

  object-fit:contain;

  object-position:center;

  border:0;

  box-shadow:none;

  user-select:none;

  -webkit-user-drag:none;

}


/* مشاركة فقط */

.image-share{

  position:absolute;

  top:12px;
  right:14px;

  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  background:rgba(255,255,255,.97);

  color:var(--primary);

  border:1px solid #e8edef;

  border-radius:13px;

  box-shadow:
    0 7px 18px rgba(23,32,42,.09);

  z-index:5;

}

.image-share svg{
  width:19px;
  height:19px;
}


/* عداد الصور */

.image-counter{

  position:absolute;

  left:14px;
  bottom:12px;

  min-width:44px;
  height:29px;

  padding:0 9px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:rgba(23,32,42,.78);

  color:#fff;

  border-radius:10px;

  font-size:10px;

  font-weight:900;

  direction:ltr;

}


/* نقاط الصور */

.image-dots{

  position:absolute;

  left:50%;
  bottom:15px;

  transform:translateX(-50%);

  display:flex;

  gap:5px;

  direction:ltr;

}

.image-dot{

  width:5px;
  height:5px;

  border-radius:10px;

  background:#cfd7da;

  transition:.2s ease;

}

.image-dot.active{

  width:16px;

  background:var(--primary);

}


/* =====================================================
   PRODUCT
===================================================== */

.product{

  padding:
    16px
    18px
    0;

}

.brand{

  color:var(--primary);

  font-size:12px;

  font-weight:950;

  margin-bottom:3px;

}

.model{

  margin:0;

  font-size:26px;

  line-height:1.2;

  font-weight:950;

  letter-spacing:-.055em;

}


/* =====================================================
   CHIPS
===================================================== */

.chips{

  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:11px;

}

.chip{

  min-height:34px;

  padding:
    0
    12px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#fff;

  border:1px solid var(--line);

  border-radius:12px;

  color:#596273;

  font-size:10px;

  font-weight:900;

}

.chip.sale{

  background:var(--cyan-soft);

  border-color:#ccecee;

  color:var(--cyan-dark);

}


/* =====================================================
   PRICE
===================================================== */

.price-card{

  position:relative;

  margin-top:14px;

  padding:
    15px
    17px;

  border-radius:19px;

  background:
    linear-gradient(
      135deg,
      var(--pink) 0%,
      #e64b5e 100%
    );

  color:#fff;

  box-shadow:
    0 10px 22px rgba(220,58,80,.15);

  overflow:hidden;

}

.price-card:after{

  content:"";

  position:absolute;

  width:105px;
  height:105px;

  border-radius:50%;

  left:-55px;
  bottom:-70px;

  background:
    rgba(255,255,255,.10);

}

.price-label{

  font-size:10px;

  font-weight:800;

  opacity:.82;

}

.price-row{

  display:flex;

  align-items:baseline;

  gap:6px;

  margin-top:1px;

}

.price{

  font-size:29px;

  font-weight:950;

  letter-spacing:-.045em;

}

.currency{

  font-size:11px;

  font-weight:900;

}


/* =====================================================
   DETAILS INTRO
===================================================== */

.details-intro{

  margin-top:18px;

  padding:
    14px
    15px;

  display:flex;

  align-items:center;

  gap:11px;

  background:

    linear-gradient(
      135deg,
      #ffffff 0%,
      var(--cyan-soft) 100%
    );

  border:
    1px solid #d9eeee;

  border-radius:17px;

}

.details-icon{

  width:39px;
  height:39px;

  flex:0 0 39px;

  display:grid;
  place-items:center;

  background:var(--cyan);

  color:#fff;

  border-radius:12px;

}

.details-icon svg{

  width:20px;
  height:20px;

}

.details-title{

  margin:0;

  font-size:16px;

  font-weight:950;

}

.details-subtitle{

  margin:3px 0 0;

  color:var(--muted);

  font-size:9px;

  line-height:1.6;

}


/* =====================================================
   SECTION
===================================================== */

.section{

  margin-top:21px;

}

.section-head{

  display:flex;

  align-items:center;

  gap:8px;

  margin-bottom:10px;

}

.section-mark{

  width:5px;
  height:20px;

  border-radius:8px;

  background:var(--primary);

}

.section-title{

  margin:0;

  font-size:17px;

  font-weight:950;

  letter-spacing:-.035em;

}


/* =====================================================
   SPECS — MAIN VISUAL
===================================================== */

.spec-grid{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:9px;

}


/* كل بطاقة */

.spec{

  position:relative;

  min-height:84px;

  padding:
    12px
    13px;

  border-radius:17px;

  overflow:hidden;

  border:1px solid transparent;

}


/* بطاقة 1 */

.spec:nth-child(4n+1){

  background:
    linear-gradient(
      145deg,
      #ffffff,
      var(--cyan-soft)
    );

  border-color:#d7eeee;

}


/* بطاقة 2 */

.spec:nth-child(4n+2){

  background:
    linear-gradient(
      145deg,
      #ffffff,
      var(--pink-soft)
    );

  border-color:#f5d9de;

}


/* بطاقة 3 */

.spec:nth-child(4n+3){

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #f8f1e8
    );

  border-color:#eee1d1;

}


/* بطاقة 4 */

.spec:nth-child(4n+4){

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #f0f4f6
    );

  border-color:#e0e6e9;

}


/* شريط صغير */

.spec:before{

  content:"";

  position:absolute;

  top:0;
  right:0;

  width:5px;
  height:100%;

  background:var(--primary);

  opacity:.9;

}


/* قيم مختلفة */

.spec:nth-child(4n+2):before{
  background:var(--pink);
}

.spec:nth-child(4n+3):before{
  background:#c79c67;
}

.spec:nth-child(4n+4):before{
  background:var(--cyan-dark);
}


.spec-label{

  color:var(--muted);

  font-size:10px;

  font-weight:750;

  margin-bottom:7px;

}

.spec-value{

  color:var(--ink);

  font-size:14px;

  font-weight:950;

  letter-spacing:-.025em;

}


/* =====================================================
   CONDITION
===================================================== */

.condition-box{

  padding:7px;

  background:#fff;

  border:
    1px solid var(--line);

  border-radius:18px;

  box-shadow:
    0 5px 16px rgba(24,44,49,.035);

}

.condition-row{

  min-height:48px;

  padding:
    0
    12px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  border-radius:12px;

}

.condition-row:nth-child(odd){

  background:
    linear-gradient(
      90deg,
      #f8fbfb,
      var(--cyan-soft)
    );

}

.condition-row:nth-child(even){

  background:
    linear-gradient(
      90deg,
      #fff,
      #fdf1f3
    );

}

.condition-label{

  color:var(--muted);

  font-size:10px;

  font-weight:750;

}

.condition-value{

  color:var(--ink);

  font-size:11px;

  font-weight:950;

  text-align:left;

}

.condition-value.good{

  color:var(--success);

}


/* =====================================================
   NOTES
===================================================== */

.notes{

  padding:
    14px;

  background:
    linear-gradient(
      145deg,
      #fff,
      var(--cream)
    );

  border:
    1px solid #eadfce;

  border-radius:17px;

  color:#4f5962;

  font-size:11px;

  line-height:1.9;

}


/* =====================================================
   SELLER
===================================================== */

.seller{

  display:flex;

  align-items:center;

  gap:11px;

  padding:
    13px
    14px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      var(--cyan-soft)
    );

  border:
    1px solid #d8eded;

  border-radius:17px;

}

.seller-avatar{

  width:43px;
  height:43px;

  flex:0 0 43px;

  display:grid;
  place-items:center;

  background:
    var(--primary);

  color:#fff;

  border-radius:13px;

  font-size:16px;

  font-weight:950;

}

.seller-name{

  font-size:12px;

  font-weight:950;

}

.seller-location{

  margin-top:3px;

  color:var(--muted);

  font-size:9px;

}


/* =====================================================
   PURCHASE — END OF PAGE
===================================================== */

.purchase-area{

  padding:
    22px
    0
    32px;

}

.purchase-inner{

  display:flex;

  align-items:center;

  gap:9px;

  direction:rtl;

}

.buy{

  flex:1;

  height:50px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      #e64b5e
    );

  color:#fff;

  font-size:14px;

  font-weight:950;

  box-shadow:
    0 8px 18px rgba(220,58,80,.14);

}

.purchase-favorite{

  width:50px;
  height:50px;

  flex:0 0 50px;

  display:grid;

  place-items:center;

  background:#fff;

  color:var(--pink);

  border:
    1px solid #e9dfe1;

  border-radius:16px;

}

.purchase-favorite svg{

  width:20px;
  height:20px;

}

.purchase-favorite.active{

  background:var(--pink-soft);

  border-color:#f0cbd1;

}


/* =====================================================
   LOADING
===================================================== */

.loading,
.error{

  padding:
    80px
    20px;

  text-align:center;

  color:var(--muted);

  font-size:12px;

  font-weight:800;

}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:380px){

  .gallery{
    height:300px;
  }

  .product{
    padding-inline:16px;
  }

  .model{
    font-size:24px;
  }

  .spec{
    min-height:80px;
  }

}


/* =====================================================
   TALL PHONES
===================================================== */

@media(min-height:850px) and (max-width:430px){

  .gallery{
    height:320px;
  }

}

</style>

</head>


<body>


<div class="page">


<!-- ===================================================
     HEADER
=================================================== -->

<header class="header">


<button
class="back-btn"
id="backBtn"
aria-label="رجوع">


<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M15 18 9 12l6-6"/>

</svg>


</button>


<h1 class="header-title">
تفاصيل الجهاز
</h1>


<div class="header-side"></div>


</header>


<!-- ===================================================
     CONTENT
=================================================== -->

<main id="app">


<div class="loading">
جاري تحميل الجهاز...
</div>


</main>


</div>


<script type="module">


import { supabase }
from "./js/supabase.js";


const app =
document.getElementById("app");


const backBtn =
document.getElementById("backBtn");


const params =
new URLSearchParams(
window.location.search
);


const deviceId =
params.get("id");


let device = null;


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function displayValue(value){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ){

    return "—";

  }

  return escapeHTML(value);

}


function formatPrice(value){

  return new Intl.NumberFormat(
    "ar-IQ"
  ).format(
    Number(value || 0)
  );

}


function getImages(value){

  if(!value){
    return [];
  }


  if(Array.isArray(value)){

    return value.filter(Boolean);

  }


  try{

    const parsed =
      JSON.parse(value);


    if(Array.isArray(parsed)){

      return parsed.filter(Boolean);

    }


    if(
      typeof parsed === "string" &&
      parsed.trim()
    ){

      return [parsed];

    }

  }catch(error){}


  if(typeof value === "string"){

    return value
      .split(",")
      .map(item => item.trim())
      .filter(Boolean);

  }


  return [];

}


function isApple(brand){

  return String(brand || "")
    .trim()
    .toLowerCase() === "apple";

}


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if(history.length > 1){

      history.back();

    }else{

      window.location.href =
        "market.html";

    }

  }
);


/* =====================================================
   SPEC
===================================================== */

function spec(label,value){

  return `

    <div class="spec">

      <div class="spec-label">
        ${escapeHTML(label)}
      </div>

      <div class="spec-value">
        ${value || "—"}
      </div>

    </div>

  `;

}


/* =====================================================
   CONDITION
===================================================== */

function condition(label,value){

  const clean =
    String(value || "")
      .toLowerCase();


  const good =
    clean.includes("يعمل") ||
    clean.includes("ممتاز") ||
    clean.includes("جيد جداً") ||
    clean.includes("سليم");


  return `

    <div class="condition-row">

      <span class="condition-label">
        ${escapeHTML(label)}
      </span>

      <span class="condition-value ${good ? "good" : ""}">
        ${value || "—"}
      </span>

    </div>

  `;

}


/* =====================================================
   GALLERY
===================================================== */

function renderGallery(images){

  if(!images.length){

    return `

      <div class="gallery">

        <div
        class="slide"
        style="
          color:#667085;
          font-size:12px;
          font-weight:800;
        ">

          لا توجد صورة للجهاز

        </div>

      </div>

    `;

  }


  const slides =
    images.map(
      (src,index) => `

        <div class="slide">

          <img
          src="${escapeHTML(src)}"
          alt="صورة الجهاز"
          loading="${index === 0 ? "eager" : "lazy"}"
          decoding="async"
          draggable="false">

        </div>

      `
    ).join("");


  const dots =
    images.length > 1
    ?
    images.map(
      (_,index) => `

        <span
        class="image-dot ${
          index === 0 ? "active" : ""
        }">
        </span>

      `
    ).join("")
    :
    "";


  return `

    <div class="gallery">


      <button
      class="image-share"
      id="shareBtn"
      aria-label="مشاركة">


        <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

          <circle
          cx="18"
          cy="5"
          r="2.3"/>

          <circle
          cx="6"
          cy="12"
          r="2.3"/>

          <circle
          cx="18"
          cy="19"
          r="2.3"/>

          <path
          d="m8 10.8 7.7-4.4"/>

          <path
          d="m8 13.2 7.7 4.4"/>

        </svg>


      </button>


      <div
      class="gallery-track"
      id="galleryTrack">

        ${slides}

      </div>


      <div
      class="image-counter"
      id="imageCounter">

        1 / ${images.length}

      </div>


      ${
        images.length > 1
        ?
        `
          <div class="image-dots">
            ${dots}
          </div>
        `
        :
        ""
      }


    </div>

  `;

}


/* =====================================================
   RENDER DEVICE
===================================================== */

function renderDevice(){

  const images =
    getImages(device.images);


  const apple =
    isApple(device.brand);


  const saleType =
    String(
      device.sale_type || ""
    ).toLowerCase();


  const saleLabel =
    saleType === "auction" ||
    saleType === "مزاد"
    ?
    "مزاد"
    :
    "بيع مباشر";


  app.innerHTML = `


    ${renderGallery(images)}


    <section class="product">


      <div class="brand">
        ${displayValue(device.brand)}
      </div>


      <h2 class="model">
        ${displayValue(device.model)}
      </h2>


      <div class="chips">


        ${
          device.storage
          ?
          `
            <span class="chip">
              ${displayValue(device.storage)}
            </span>
          `
          :
          ""
        }


        ${
          device.color
          ?
          `
            <span class="chip">
              ${displayValue(device.color)}
            </span>
          `
          :
          ""
        }


        <span class="chip sale">
          ${saleLabel}
        </span>


      </div>


      <!-- PRICE -->

      <div class="price-card">


        <div class="price-label">
          السعر
        </div>


        <div class="price-row">


          <span class="price">
            ${formatPrice(device.price)}
          </span>


          <span class="currency">
            د.ع
          </span>


        </div>


      </div>


      <!-- DETAILS INTRO -->

      <div class="details-intro">


        <div class="details-icon">


          <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">

            <rect
            x="5"
            y="3"
            width="14"
            height="18"
            rx="2"/>

            <path d="M9 7h6"/>
            <path d="M9 11h6"/>
            <path d="M9 15h4"/>

          </svg>


        </div>


        <div>


          <h3 class="details-title">
            تفاصيل الجهاز
          </h3>


          <p class="details-subtitle">
            المواصفات والحالة ومعلومات البائع
          </p>


        </div>


      </div>


      <!-- SPECS -->

      <section class="section">


        <div class="section-head">


          <span
          class="section-mark"
          style="background:var(--primary)">
          </span>


          <h3 class="section-title">
            مواصفات الجهاز
          </h3>


        </div>


        <div class="spec-grid">


          ${spec(
            "الشركة",

/* =====================================================
   GALLERY
===================================================== */

function setupGallery(images){

  const track =
    document.getElementById(
      "galleryTrack"
    );


  const counter =
    document.getElementById(
      "imageCounter"
    );


  const dots =
    [
      ...document.querySelectorAll(
        ".image-dot"
      )
    ];


  if(!track){
    return;
  }


  track.addEventListener(
    "scroll",
    () => {


      const index =
        Math.round(
          track.scrollLeft /
          track.clientWidth
        );


      if(counter){

        counter.textContent =
          `${index + 1} / ${images.length}`;

      }


      dots.forEach(
        (dot,i) => {

          dot.classList.toggle(
            "active",
            i === index
          );

        }
      );


    },
    {
      passive:true
    }
  );

}


/* =====================================================
   SHARE
===================================================== */

function setupShare(){

  const shareBtn =
    document.getElementById(
      "shareBtn"
    );


  if(!shareBtn){
    return;
  }


  shareBtn.addEventListener(
    "click",
    async () => {


      try{


        if(navigator.share){


          await navigator.share({

            title:
              `${device.brand} ${device.model}`,

            text:
              "شاهد هذا الجهاز على MZAD PHONE",

            url:
              window.location.href

          });


        }else{


          await navigator.clipboard.writeText(
            window.location.href
          );


          alert(
            "تم نسخ رابط الجهاز"
          );


        }


      }catch(error){}


    }
  );

}


/* =====================================================
   FAVORITE
===================================================== */

function setupFavorite(){

  const favorite =
    document.getElementById(
      "bottomFavorite"
    );


  if(!favorite){
    return;
  }


  favorite.addEventListener(
    "click",
    () => {

      favorite.classList.toggle(
        "active"
      );

    }
  );

}


/* =====================================================
   BUY
===================================================== */

function setupBuy(){

  const buyBtn =
    document.getElementById(
      "buyBtn"
    );


  if(!buyBtn){
    return;
  }


  buyBtn.addEventListener(
    "click",
    async () => {


      const {
        data
      } =
      await supabase.auth.getSession();


      if(!data?.session){


        const returnTo =
          window.location.pathname +
          window.location.search;


        sessionStorage.setItem(
          "mzad_pending_action",
          returnTo
        );


        window.location.href =
          `index.html?login=1&returnTo=${encodeURIComponent(returnTo)}`;


        return;

      }


      alert(
        "سيتم ربط عملية الشراء هنا."
      );


    }
  );

}


/* =====================================================
   LOAD DEVICE
===================================================== */

async function loadDevice(){


  if(!deviceId){


    app.innerHTML = `

      <div class="error">
        لم يتم تحديد الجهاز.
      </div>

    `;


    return;

  }


  const {
    data,
    error
  } =
  await supabase

    .from("devices")

    .select("*")

    .eq("id",deviceId)

    .single();


  if(error || !data){


    console.error(error);


    app.innerHTML = `

      <div class="error">
        تعذر تحميل بيانات الجهاز.
      </div>

    `;


    return;

  }


  device = data;


  renderDevice();

}


loadDevice();


</script>
