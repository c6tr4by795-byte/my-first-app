<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta
  name="theme-color"
  content="#f7f8fa">

<title>MZAD PHONE — تفاصيل الجهاز</title>

<style>

/* =====================================================
   MZAD PHONE
===================================================== */

:root{
  --bg:#f7f8fa;
  --surface:#ffffff;

  --ink:#17202a;
  --muted:#667085;
  --line:#e6e9ed;

  --primary:#176b87;
  --primary-dark:#125a73;
  --primary-soft:#e8f3f6;

  --purple:#6246d9;
  --purple-dark:#5238c4;
  --purple-soft:#eeeaff;

  --success:#159a72;

  --cream:#f2ebe3;

  --shadow:0 10px 28px rgba(24,44,49,.07);
}


/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  background:var(--bg);

  color:var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.page{
  width:100%;
  max-width:520px;
  margin:auto;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  height:66px;

  padding:8px 14px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #faf9ff 100%
    );

  border-bottom:1px solid var(--line);
}

.header-side{
  width:40px;
  height:40px;
}

.header-title{
  margin:0;

  font-size:19px;
  font-weight:950;

  letter-spacing:-.045em;
}

.back-btn{
  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  background:#fff;

  color:var(--primary);

  border:1px solid var(--line);

  border-radius:14px;

  box-shadow:
    0 5px 14px rgba(24,44,49,.05);
}

.back-btn svg{
  width:20px;
  height:20px;
}


/* =====================================================
   GALLERY
===================================================== */

.gallery{
  position:relative;

  width:100%;
  height:318px;

  background:#fff;

  overflow:hidden;

  border-bottom:1px solid var(--line);
}

.gallery-track{
  width:100%;
  height:100%;

  display:flex;
  direction:ltr;

  overflow-x:auto;
  overflow-y:hidden;

  scroll-snap-type:x mandatory;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.gallery-track::-webkit-scrollbar{
  display:none;
}

.slide{
  width:100%;
  min-width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:8px 16px;

  background:#fff;

  scroll-snap-align:center;
}

.slide img{
  display:block;

  width:100%;
  height:100%;

  max-width:100%;
  max-height:100%;

  object-fit:contain;
  object-position:center;

  border:0;
  box-shadow:none;

  user-select:none;
  -webkit-user-drag:none;
}


/* مشاركة */

.image-share{
  position:absolute;

  top:12px;
  right:14px;

  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  background:rgba(255,255,255,.97);

  color:var(--primary);

  border:1px solid #e8edef;

  border-radius:13px;

  box-shadow:
    0 7px 18px rgba(23,32,42,.09);

  z-index:5;
}

.image-share svg{
  width:19px;
  height:19px;
}


/* عداد الصور */

.image-counter{
  position:absolute;

  left:14px;
  bottom:12px;

  min-width:44px;
  height:29px;

  padding:0 9px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(23,32,42,.78);

  color:#fff;

  border-radius:10px;

  font-size:10px;
  font-weight:900;

  direction:ltr;
}


/* نقاط الصور */

.image-dots{
  position:absolute;

  left:50%;
  bottom:15px;

  transform:translateX(-50%);

  display:flex;
  gap:5px;

  direction:ltr;
}

.image-dot{
  width:5px;
  height:5px;

  border-radius:10px;

  background:#cfd7da;

  transition:.2s ease;
}

.image-dot.active{
  width:16px;

  background:var(--purple);
}


/* =====================================================
   PRODUCT
===================================================== */

.product{
  padding:
    16px
    18px
    0;
}

.brand{
  color:var(--primary);

  font-size:12px;
  font-weight:950;

  margin-bottom:3px;
}

.model{
  margin:0;

  font-size:26px;
  line-height:1.2;

  font-weight:950;

  letter-spacing:-.055em;
}


/* =====================================================
   CHIPS
===================================================== */

.chips{
  display:flex;
  flex-wrap:wrap;

  gap:7px;

  margin-top:11px;
}

.chip{
  min-height:35px;

  padding:0 12px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;

  border:1px solid var(--line);

  border-radius:12px;

  color:#596273;

  font-size:10px;
  font-weight:900;
}

.chip.sale{
  background:var(--primary-soft);

  border-color:#cfe7ec;

  color:var(--primary-dark);
}


/* =====================================================
   PRICE
===================================================== */

.price-card{
  position:relative;

  margin-top:15px;

  padding:
    16px
    18px;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      #6246d9 0%,
      #6c50d7 100%
    );

  color:#fff;

  box-shadow:
    0 10px 23px rgba(98,70,217,.13);

  overflow:hidden;
}

.price-card:after{
  content:"";

  position:absolute;

  width:110px;
  height:110px;

  border-radius:50%;

  left:-60px;
  bottom:-72px;

  background:
    rgba(255,255,255,.09);
}

.price-label{
  font-size:10px;

  font-weight:800;

  opacity:.82;

  letter-spacing:.02em;
}

.price-row{
  display:flex;

  align-items:baseline;

  gap:7px;

  margin-top:2px;
}

.price{
  font-size:30px;

  font-weight:950;

  letter-spacing:-.045em;
}

.currency{
  font-size:11px;

  font-weight:900;
}


/* =====================================================
   DETAILS INTRO
===================================================== */

.details-intro{
  margin-top:19px;

  padding:
    15px
    16px;

  display:flex;
  align-items:center;

  gap:11px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #f2f0ff
    );

  border:
    1px solid #e1ddf4;

  border-radius:18px;
}

.details-icon{
  width:42px;
  height:42px;

  flex:0 0 42px;

  display:grid;
  place-items:center;

  background:var(--purple-soft);

  color:var(--purple);

  border-radius:13px;
}

.details-icon svg{
  width:21px;
  height:21px;
}

.details-title{
  margin:0;

  font-size:17px;
  font-weight:950;
}

.details-subtitle{
  margin:3px 0 0;

  color:var(--muted);

  font-size:9px;
  line-height:1.7;
}


/* =====================================================
   SECTION HEAD
===================================================== */

.section{
  margin-top:22px;
}

.section-head{
  display:flex;
  align-items:center;

  gap:8px;

  margin-bottom:11px;
}

.section-mark{
  width:5px;
  height:21px;

  border-radius:8px;

  background:var(--purple);
}

.section-title{
  margin:0;

  font-size:18px;

  font-weight:950;

  letter-spacing:-.04em;
}


/* =====================================================
   SPECIFICATIONS
===================================================== */

.spec-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;
}

.spec{
  position:relative;

  min-height:88px;

  padding:
    13px
    14px;

  border-radius:18px;

  overflow:hidden;

  border:1px solid #e2e5e8;

  background:#fff;

  box-shadow:
    0 5px 15px rgba(24,44,49,.035);
}


/* شريط الهوية */

.spec:before{
  content:"";

  position:absolute;

  top:0;
  right:0;

  width:5px;
  height:100%;

  background:var(--primary);
}


/* بعض البطاقات بنفسجي هادئ */

.spec:nth-child(2n){
  background:
    linear-gradient(
      145deg,
      #ffffff,
      #f4f1ff
    );

  border-color:#e1dcf5;
}

.spec:nth-child(2n):before{
  background:var(--purple);
}


/* وبعضها تركوازي */

.spec:nth-child(3n):before{
  background:var(--primary);
}

.spec-label{
  color:var(--muted);

  font-size:10px;

  font-weight:800;

  margin-bottom:8px;
}

.spec-value{
  color:var(--ink);

  font-size:15px;

  font-weight:950;

  letter-spacing:-.025em;
}


/* =====================================================
   DEVICE CONDITION
   BIGGER + STRONGER
===================================================== */

.condition-box{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

  padding:0;

  background:transparent;

  border:0;

  box-shadow:none;
}


/* كل حالة بطاقة مستقلة */

.condition-row{

  min-height:82px;

  padding:
    12px
    13px;

  display:flex;

  flex-direction:column;

  align-items:flex-start;

  justify-content:center;

  gap:7px;

  background:#fff;

  border:
    1px solid var(--line);

  border-radius:18px;

  box-shadow:
    0 6px 17px rgba(24,44,49,.045);

  position:relative;

  overflow:hidden;
}


/* الشريط الجانبي */

.condition-row:before{

  content:"";

  position:absolute;

  right:0;
  top:0;

  width:5px;
  height:100%;

  background:var(--primary);

}


/* صفوف بنفسجية */

.condition-row:nth-child(2n):before{
  background:var(--purple);
}

.condition-row:nth-child(3n):before{
  background:#67aeb5;
}


/* اسم الحالة */

.condition-label{

  color:var(--muted);

  font-size:10px;

  font-weight:800;
}


/* القيمة */

.condition-value{

  color:var(--ink);

  font-size:15px;

  font-weight:950;

  line-height:1.2;

}


/* الحالات السليمة */

.condition-value.good{

  color:var(--success);

}


/* إذا كانت خانة مهمة أولى */

.condition-row:first-child{

  grid-column:1 / -1;

  min-height:96px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      var(--primary-soft)
    );

  border-color:#d5e9ec;

}

.condition-row:first-child .condition-label{
  font-size:11px;
}

.condition-row:first-child .condition-value{
  font-size:19px;
}


/* =====================================================
   NOTES
===================================================== */

.notes{

  padding:
    15px;

  background:
    linear-gradient(
      145deg,
      #fff,
      var(--cream)
    );

  border:
    1px solid #eadfce;

  border-radius:18px;

  color:#4f5962;

  font-size:11px;

  line-height:1.95;
}


/* =====================================================
   SELLER
===================================================== */

.seller{

  display:flex;

  align-items:center;

  gap:11px;

  padding:
    14px;

  background:
    linear-gradient(
      145deg,
      #fff,
      var(--primary-soft)
    );

  border:
    1px solid #d7ebed;

  border-radius:18px;
}

.seller-avatar{

  width:44px;
  height:44px;

  flex:0 0 44px;

  display:grid;
  place-items:center;

  background:var(--primary);

  color:#fff;

  border-radius:13px;

  font-size:16px;

  font-weight:950;
}

.seller-name{
  font-size:12px;
  font-weight:950;
}

.seller-location{

  margin-top:3px;

  color:var(--muted);

  font-size:9px;
}


/* =====================================================
   PURCHASE — LAST THING
===================================================== */

.purchase-area{

  padding:
    24px
    0
    34px;
}

.purchase-inner{

  display:flex;

  align-items:center;

  gap:9px;

  direction:rtl;
}

.buy{

  flex:1;

  height:50px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      #7054dc
    );

  color:#fff;

  font-size:14px;

  font-weight:950;

  box-shadow:
    0 8px 19px rgba(98,70,217,.14);
}

.purchase-favorite{

  width:50px;
  height:50px;

  flex:0 0 50px;

  display:grid;
  place-items:center;

  background:#fff;

  color:var(--purple);

  border:
    1px solid #ded9ef;

  border-radius:16px;
}

.purchase-favorite svg{

  width:20px;
  height:20px;
}

.purchase-favorite.active{

  background:var(--purple-soft);

  border-color:#d5cef2;
}


/* =====================================================
   LOADING
===================================================== */

.loading,
.error{

  padding:
    80px
    20px;

  text-align:center;

  color:var(--muted);

  font-size:12px;

  font-weight:800;
}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:380px){

  .gallery{
    height:300px;
  }

  .product{
    padding-inline:16px;
  }

  .model{
    font-size:24px;
  }

  .condition-row{
    min-height:78px;
  }

}


/* =====================================================
   TALL PHONES
===================================================== */

@media(min-height:850px) and (max-width:430px){

  .gallery{
    height:320px;
  }

}

</style>

</head>


<body>


<div class="page">


<!-- HEADER -->

<header class="header">


<button
  class="back-btn"
  id="backBtn"
  aria-label="رجوع">

  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2">

    <path d="M15 18 9 12l6-6"/>

  </svg>

</button>


<h1 class="header-title">
  تفاصيل الجهاز
</h1>


<div class="header-side"></div>


</header>


<!-- CONTENT -->

<main id="app">

  <div class="loading">
    جاري تحميل الجهاز...
  </div>

</main>


</div>


<script type="module">


import { supabase }
from "./js/supabase.js";


const app =
document.getElementById("app");


const backBtn =
document.getElementById("backBtn");


const params =
new URLSearchParams(
window.location.search
);


const deviceId =
params.get("id");


let device = null;


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function displayValue(value){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ){

    return "—";

  }

  return escapeHTML(value);

}


function formatPrice(value){

  return new Intl.NumberFormat(
    "ar-IQ"
  ).format(
    Number(value || 0)
  );

}


function getImages(value){

  if(!value){
    return [];
  }


  if(Array.isArray(value)){

    return value.filter(Boolean);

  }


  try{

    const parsed =
      JSON.parse(value);


    if(Array.isArray(parsed)){

      return parsed.filter(Boolean);

    }


    if(
      typeof parsed === "string" &&
      parsed.trim()
    ){

      return [parsed];

    }

  }catch(error){}


  if(typeof value === "string"){

    return value
      .split(",")
      .map(item => item.trim())
      .filter(Boolean);

  }


  return [];

}


function isApple(brand){

  return String(brand || "")
    .trim()
    .toLowerCase() === "apple";

}


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if(history.length > 1){

      history.back();

    }else{

      window.location.href =
        "market.html";

    }

  }
);


/* =====================================================
   SPEC CARD
===================================================== */

function spec(label,value){

  return `

    <div class="spec">

      <div class="spec-label">
        ${escapeHTML(label)}
      </div>

      <div class="spec-value">
        ${value || "—"}
      </div>

    </div>

  `;

}


/* =====================================================
   CONDITION CARD
===================================================== */

function condition(label,value){

  const clean =
    String(value || "")
      .toLowerCase();


  const good =
    clean.includes("يعمل") ||
    clean.includes("ممتاز") ||
    clean.includes("جيد جداً") ||
    clean.includes("سليم");


  return `

    <div class="condition-row">

      <span class="condition-label">
        ${escapeHTML(label)}
      </span>

      <span
        class="condition-value ${good ? "good" : ""}">

        ${value || "—"}

      </span>

    </div>

  `;

}


/* =====================================================
   GALLERY
===================================================== */

function renderGallery(images){

  if(!images.length){

    return `

      <div class="gallery">

        <div
          class="slide"
          style="
            color:#667085;
            font-size:12px;
            font-weight:800;
          ">

          لا توجد صورة للجهاز

        </div>

      </div>

    `;

  }


  const slides =
    images.map(
      (src,index) => `

        <div class="slide">

          <img
            src="${escapeHTML(src)}"
            alt="صورة الجهاز"
            loading="${
              index === 0
              ? "eager"
              : "lazy"
            }"
            decoding="async"
            draggable="false">

        </div>

      `
    ).join("");


  const dots =
    images.length > 1
    ?
    images.map(
      (_,index) => `

        <span
          class="image-dot ${
            index === 0
            ? "active"
            : ""
          }">
        </span>

      `
    ).join("")
    :
    "";


  return `

    <div class="gallery">


      <button
        class="image-share"
        id="shareBtn"
        aria-label="مشاركة">


        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">

          <circle
            cx="18"
            cy="5"
            r="2.3"/>

          <circle
            cx="6"
            cy="12"
            r="2.3"/>

          <circle
            cx="18"
            cy="19"
            r="2.3"/>

          <path
            d="m8 10.8 7.7-4.4"/>

          <path
            d="m8 13.2 7.7 4.4"/>

        </svg>


      </button>


      <div
        class="gallery-track"
        id="galleryTrack">

        ${slides}

      </div>


      <div
        class="image-counter"
        id="imageCounter">

        1 / ${images.length}

      </div>


      ${
        images.length > 1
        ?
        `
          <div class="image-dots">
            ${dots}
          </div>
        `
        :
        ""
      }


    </div>

  `;

}


/* =====================================================
   RENDER DEVICE
===================================================== */

function renderDevice(){

  const images =
    getImages(device.images);


  const apple =
    isApple(device.brand);


  const saleType =
    String(
      device.sale_type || ""
    ).toLowerCase();


  const saleLabel =
    saleType === "auction" ||
    saleType === "مزاد"
    ?
    "مزاد"
    :
    "بيع مباشر";


  app.innerHTML = `


    ${renderGallery(images)}


    <section class="product">


      <!-- BRAND -->

      <div class="brand">
        ${displayValue(device.brand)}
      </div>


      <!-- MODEL -->

      <h2 class="model">
        ${displayValue(device.model)}
      </h2>


      <!-- CHIPS -->

      <div class="chips">


        ${
          device.storage
          ?
          `
            <span class="chip">
              ${displayValue(
                device.storage
              )}
            </span>
          `
          :
          ""
        }


        ${
          device.color
          ?
          `
            <span class="chip">
              ${displayValue(
                device.color
              )}
            </span>
          `
          :
          ""
        }


        <span class="chip sale">
          ${saleLabel}
        </span>


      </div>


      <!-- PRICE -->

      <div class="price-card">


        <div class="price-label">
          Sale Price
        </div>


        <div class="price-row">


          <span class="price">
            ${formatPrice(
              device.price
            )}
          </span>


          <span class="currency">
            د.ع
          </span>


        </div>


      </div>


      <!-- DETAILS -->

      <div class="details-intro">


        <div class="details-icon">


          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <rect
              x="5"
              y="3"
              width="14"
              height="18"
              rx="2"/>

            <path d="M9 7h6"/>
            <path d="M9 11h6"/>
            <path d="M9 15h4"/>

          </svg>


        </div>


        <div>


          <h3 class="details-title">
            تفاصيل الجهاز
          </h3>


          <p class="details-subtitle">
            المواصفات والحالة ومعلومات البائع
          </p>


        </div>


      </div>


      <!-- SPECIFICATIONS -->

      <section class="section">


        <div class="section-head">


          <span
            class="section-mark">
          </span>


          <h3 class="section-title">
            مواصفات الجهاز
          </h3>


        </div>


        <div class="spec-grid">


          ${spec(

/* =====================================================
   GALLERY CONTROL
===================================================== */

function setupGallery(images){

  const track =
    document.getElementById(
      "galleryTrack"
    );


  const counter =
    document.getElementById(
      "imageCounter"
    );


  const dots =
    [
      ...document.querySelectorAll(
        ".image-dot"
      )
    ];


  if(!track){
    return;
  }


  track.addEventListener(
    "scroll",
    () => {


      const index =
        Math.round(
          track.scrollLeft /
          track.clientWidth
        );


      if(counter){

        counter.textContent =
          `${index + 1} / ${images.length}`;

      }


      dots.forEach(
        (dot,i) => {

          dot.classList.toggle(
            "active",
            i === index
          );

        }
      );


    },
    {
      passive:true
    }
  );

}


/* =====================================================
   SHARE
===================================================== */

function setupShare(){

  const shareBtn =
    document.getElementById(
      "shareBtn"
    );


  if(!shareBtn){
    return;
  }


  shareBtn.addEventListener(
    "click",
    async () => {


      try{


        if(navigator.share){


          await navigator.share({

            title:
              `${device.brand} ${device.model}`,

            text:
              "شاهد هذا الجهاز على MZAD PHONE",

            url:
              window.location.href

          });


        }else{


          await navigator.clipboard.writeText(
            window.location.href
          );


          alert(
            "تم نسخ رابط الجهاز"
          );


        }


      }catch(error){}


    }
  );

}


/* =====================================================
   FAVORITE
===================================================== */

function setupFavorite(){

  const favorite =
    document.getElementById(
      "bottomFavorite"
    );


  if(!favorite){
    return;
  }


  favorite.addEventListener(
    "click",
    () => {

      favorite.classList.toggle(
        "active"
      );

    }
  );

}


/* =====================================================
   BUY
===================================================== */

function setupBuy(){

  const buyBtn =
    document.getElementById(
      "buyBtn"
    );


  if(!buyBtn){
    return;
  }


  buyBtn.addEventListener(
    "click",
    async () => {


      const {
        data
      } =
      await supabase.auth.getSession();


      if(!data?.session){


        const returnTo =
          window.location.pathname +
          window.location.search;


        sessionStorage.setItem(
          "mzad_pending_action",
          returnTo
        );


        window.location.href =
          `index.html?login=1&returnTo=${encodeURIComponent(returnTo)}`;


        return;

      }


      alert(
        "سيتم ربط عملية الشراء هنا."
      );


    }
  );

}


/* =====================================================
   LOAD DEVICE
===================================================== */

async function loadDevice(){


  if(!deviceId){


    app.innerHTML = `

      <div class="error">
        لم يتم تحديد الجهاز.
      </div>

    `;


    return;

  }


  const {
    data,
    error
  } =
  await supabase

    .from("devices")

    .select("*")

    .eq("id",deviceId)

    .single();


  if(error || !data){


    console.error(error);


    app.innerHTML = `

      <div class="error">
        تعذر تحميل بيانات الجهاز.
      </div>

    `;


    return;

  }


  device = data;


  renderDevice();

}


loadDevice();


</script>
