<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />

  <title>تفاصيل الجهاز | MZAD PHONE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>

    :root{
      --bg:#f7f8fa;
      --surface:#ffffff;
      --surface-2:#eef3f7;

      --ink:#17202a;
      --muted:#667085;
      --line:#e6e9ed;

      --primary:#176b87;
      --primary-dark:#125a73;
      --primary-soft:#e8f3f6;

      --purple:#6246d9;
      --purple-dark:#5237c7;
      --purple-soft:#e5e0ff;

      --pale:#e6e3f6;
      --pale-dark:#d8d3ee;
      --pale-text:#51477d;

      --danger:#d94b61;

      --shadow:0 14px 34px rgba(24,44,49,.08);
      --shadow-soft:0 7px 20px rgba(24,44,49,.06);

      --radius:20px;
    }


    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }


    html{
      scroll-behavior:smooth;
    }


    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:"Cairo",sans-serif;
      overflow-x:hidden;
    }


    button,
    input{
      font:inherit;
    }


    button{
      border:0;
      cursor:pointer;
    }


    a{
      color:inherit;
      text-decoration:none;
    }


    .page{
      width:100%;
      max-width:520px;
      margin:0 auto;
      min-height:100vh;
      padding-bottom:105px;
    }


    /* =========================
       HEADER
    ========================= */

    .topbar{
      height:68px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 16px;

      position:sticky;
      top:0;
      z-index:30;

      overflow:hidden;

      background:
        radial-gradient(
          190px 75px at 8% 50%,
          rgba(23,107,135,.14),
          transparent 72%
        ),
        radial-gradient(
          210px 85px at 88% 0%,
          rgba(98,70,217,.18),
          transparent 72%
        ),
        linear-gradient(
          110deg,
          #ffffff 0%,
          #edf7f9 34%,
          #f2effb 69%,
          #ffffff 100%
        );

      border-bottom:1px solid rgba(230,233,237,.8);

      box-shadow:
        0 7px 22px rgba(24,44,49,.055);

      isolation:isolate;
    }


    .topbar::before{
      content:"";

      position:absolute;

      width:250px;
      height:72px;

      left:-90px;
      bottom:-46px;

      border-radius:50%;

      background:rgba(23,107,135,.12);

      filter:blur(14px);

      animation:
        headerWave
        7s ease-in-out
        infinite alternate;

      z-index:-1;
    }


    .topbar::after{
      content:"";

      position:absolute;

      width:250px;
      height:78px;

      right:-85px;
      top:-48px;

      border-radius:50%;

      background:rgba(98,70,217,.11);

      filter:blur(15px);

      animation:
        headerWaveReverse
        8s ease-in-out
        infinite alternate;

      z-index:-1;
    }


    @keyframes headerWave{

      0%{
        transform:
          translateX(-5px)
          rotate(-3deg)
          scale(1);
      }

      100%{
        transform:
          translateX(55px)
          rotate(5deg)
          scale(1.08);
      }

    }


    @keyframes headerWaveReverse{

      0%{
        transform:
          translateX(10px)
          rotate(3deg)
          scale(1);
      }

      100%{
        transform:
          translateX(-45px)
          rotate(-5deg)
          scale(1.08);
      }

    }


    .top-side{
      width:42px;
      height:42px;

      display:flex;
      align-items:center;
      justify-content:center;

      position:relative;
      z-index:2;
    }


    .icon-btn{
      width:40px;
      height:40px;

      border-radius:13px;

      background:rgba(255,255,255,.78);

      color:var(--ink);

      border:1px solid rgba(255,255,255,.85);

      box-shadow:
        0 5px 14px rgba(24,44,49,.07);

      display:flex;
      align-items:center;
      justify-content:center;

      transition:.18s ease;

      backdrop-filter:blur(10px);
    }


    .icon-btn:active{
      transform:scale(.94);
    }


    .icon-btn svg{
      width:19px;
      height:19px;
      stroke:currentColor;
    }


    .page-title{
      text-align:center;
      min-width:0;

      position:relative;
      z-index:2;
    }


    .page-title strong{
      display:block;

      font-size:17px;
      font-weight:800;

      line-height:1.2;
    }


    .page-title span{
      display:block;

      margin-top:2px;

      color:var(--muted);

      font-size:11px;
      font-weight:600;
    }


    /* =========================
       MAIN
    ========================= */

    main{
      padding:0 16px 0;
    }


    /* =========================
       GALLERY
       FULL WIDTH
    ========================= */

    .gallery-card{
      width:calc(100% + 32px);

      margin-right:-16px;
      margin-left:-16px;

      margin-bottom:20px;

      background:#fff;

      border:0;
      border-radius:0;

      box-shadow:none;

      overflow:hidden;
    }


    .gallery{
      position:relative;

      width:100%;
      height:300px;

      background:#f1f2f4;

      overflow:hidden;
    }


    .gallery-track{
      height:100%;
      width:100%;

      display:flex;
      direction:ltr;

      overflow-x:auto;

      scroll-snap-type:x mandatory;

      scrollbar-width:none;

      overscroll-behavior-x:contain;
    }


    .gallery-track::-webkit-scrollbar{
      display:none;
    }


    .gallery-slide{
      flex:0 0 100%;

      min-width:100%;
      height:100%;

      display:flex;
      align-items:center;
      justify-content:center;

      scroll-snap-align:center;

      padding:0;

      background:#f1f2f4;

      overflow:hidden;
    }


    .gallery-slide img{
      width:100%;
      height:100%;

      display:block;

      object-fit:cover;
      object-position:center;
    }


    .gallery-empty{
      width:100%;
      height:100%;

      display:flex;
      flex-direction:column;

      align-items:center;
      justify-content:center;

      gap:8px;

      color:var(--muted);

      background:var(--surface-2);
    }


    .gallery-empty-icon{
      width:50px;
      height:50px;

      border-radius:16px;

      background:var(--primary-soft);
      color:var(--primary);

      display:flex;
      align-items:center;
      justify-content:center;
    }


    .gallery-empty-icon svg{
      width:25px;
      height:25px;
    }


    .gallery-empty strong{
      font-size:13px;
    }


    .gallery-empty span{
      font-size:11px;
    }


    /* عداد الصور */

    .gallery-counter{
      position:absolute;

      top:12px;
      right:12px;

      min-width:44px;
      height:30px;

      padding:0 10px;

      border-radius:12px;

      background:rgba(23,32,42,.72);

      color:#fff;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:11px;
      font-weight:700;

      direction:ltr;

      backdrop-filter:blur(9px);
      -webkit-backdrop-filter:blur(9px);

      z-index:5;
    }


    /* نقاط الصور */

    .gallery-dots{
      position:absolute;

      left:50%;
      bottom:13px;

      transform:translateX(-50%);

      height:auto;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:6px;

      padding:8px 11px;

      background:rgba(23,32,42,.62);

      border-radius:18px;

      backdrop-filter:blur(9px);
      -webkit-backdrop-filter:blur(9px);

      z-index:5;
    }


    .gallery-dot{
      width:8px;
      height:8px;

      border-radius:50%;

      background:rgba(255,255,255,.62);

      transition:.22s ease;
    }


    .gallery-dot.active{
      width:9px;
      height:9px;

      border-radius:50%;

      background:#fff;
    }


    /* =========================
       PRODUCT
    ========================= */

    .product-head{
      padding:20px 2px 0;
    }


    .brand{
      color:var(--primary);

      font-size:13px;
      font-weight:800;

      letter-spacing:.2px;

      margin-bottom:5px;
    }


    .product-name{
      margin:0;

      font-size:25px;
      line-height:1.35;

      font-weight:800;

      letter-spacing:-.4px;
    }


    .chips{
      display:flex;
      flex-wrap:wrap;

      gap:7px;

      margin-top:11px;
    }


    .chip{
      height:34px;

      padding:0 12px;

      border-radius:10px;

      background:var(--surface);

      border:1px solid var(--line);

      color:#4c5865;

      display:inline-flex;
      align-items:center;

      gap:6px;

      font-size:12px;
      font-weight:700;
    }


    .chip svg{
      width:16px;
      height:16px;
      stroke:currentColor;
    }


    .chip.sale{
      color:#59616b;

      background:#fff;

      border-color:var(--line);
    }


    /* =========================
       PRICE
    ========================= */

    .price-card{
      margin-top:14px;

      padding:17px 18px;

      border-radius:18px;

      background:
        linear-gradient(
          135deg,
          var(--pale) 0%,
          #ebe9f7 52%,
          #e2dff2 100%
        );

      color:var(--pale-text);

      border:1px solid rgba(216,211,238,.8);

      box-shadow:
        0 13px 28px rgba(98,70,217,.10);

      position:relative;

      overflow:hidden;
    }


    .price-card::after{
      content:"";

      position:absolute;

      width:145px;
      height:145px;

      border-radius:50%;

      right:-70px;
      top:-85px;

      background:rgba(255,255,255,.38);
    }


    .price-label{
      position:relative;
      z-index:1;

      font-size:11px;
      font-weight:800;

      letter-spacing:.5px;

      opacity:.70;

      direction:rtl;
      text-align:right;
    }


    .price-row{
      position:relative;
      z-index:1;

      display:flex;

      align-items:baseline;
      justify-content:space-between;

      gap:10px;

      margin-top:3px;
    }


    .price{
      font-size:29px;

      font-weight:800;

      line-height:1.2;

      direction:ltr;

      white-space:nowrap;

      color:#4c426f;
    }


    .sale-type{
      padding:6px 10px;

      border-radius:9px;

      background:var(--pale);

      border:1px solid rgba(255,255,255,.58);

      color:#51477d;

      font-size:11px;

      font-weight:800;

      white-space:nowrap;

      box-shadow:
        0 3px 9px rgba(98,70,217,.06);
    }


    /* =========================
       DETAILS INTRO
    ========================= */

    .details-intro{
      margin-top:18px;

      padding:13px 14px;

      border-radius:15px;

      background:
        linear-gradient(
          135deg,
          var(--primary-soft),
          #f2f7f9
        );

      border:1px solid #dcecf1;

      display:flex;
      align-items:center;

      gap:11px;
    }


    .details-intro-icon{
      flex:0 0 38px;

      width:38px;
      height:38px;

      border-radius:12px;

      background:#fff;

      color:var(--primary);

      display:flex;
      align-items:center;
      justify-content:center;

      box-shadow:
        0 5px 14px rgba(23,107,135,.08);
    }


    .details-intro-icon svg{
      width:19px;
      height:19px;
    }


    .details-intro-copy{
      flex:1;
      min-width:0;
    }


    .details-intro-copy strong{
      display:block;

      font-size:15px;
      font-weight:800;
    }


    .details-intro-copy span{
      display:block;

      color:var(--muted);

      font-size:12px;

      margin-top:2px;

      line-height:1.6;
    }


    .intro-arrow{
      color:#8a96a1;

      display:flex;
    }


    .intro-arrow svg{
      width:16px;
      height:16px;
    }


    /* =========================
       SECTION
    ========================= */

    .section{
      margin-top:20px;
    }


    .section-head{
      display:flex;

      align-items:flex-end;
      justify-content:space-between;

      gap:10px;

      margin-bottom:10px;
    }


    .section-title{
      margin:0;

      font-size:17px;
      font-weight:800;
    }


    /* =========================
       SPECS
    ========================= */

    .spec-grid{
      display:grid;

      grid-template-columns:1fr 1fr;

      gap:9px;
    }


    .spec-card{
      min-height:88px;

      padding:12px;

      border-radius:16px;

      border:1px solid var(--line);

      background:var(--surface);

      display:flex;
      align-items:center;

      gap:11px;

      box-shadow:
        0 5px 16px rgba(24,44,49,.035);
    }


    .spec-card:nth-child(3n+1){
      background:
        linear-gradient(
          145deg,
          #fff,
          #f9fbfc
        );
    }


    .spec-card:nth-child(3n+2){
      background:
        linear-gradient(
          145deg,
          #fff,
          #f6f3ff
        );

      border-color:#e7e2fa;
    }


    .spec-card:nth-child(3n){
      background:
        linear-gradient(
          145deg,
          #fff,
          #f2f9fa
        );

      border-color:#dfeef1;
    }


    .spec-icon{
      flex:0 0 44px;

      width:44px;
      height:44px;

      border-radius:13px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:var(--surface-2);

      color:var(--primary);

      box-shadow:
        0 4px 10px rgba(24,44,49,.045);
    }


    .spec-card:nth-child(3n+2) .spec-icon{
      color:var(--purple);
      background:var(--purple-soft);
    }


    .spec-icon svg{
      width:23px;
      height:23px;

      stroke:currentColor;
    }


    .spec-info{
      min-width:0;
      flex:1;
    }


    .spec-label{
      color:var(--muted);

      display:block;

      font-size:11px;
      font-weight:600;

      margin-bottom:3px;
    }


    .spec-value{
      display:block;

      font-size:13px;
      font-weight:800;

      line-height:1.45;

      overflow:hidden;

      text-overflow:ellipsis;

      white-space:nowrap;
    }


    /* =========================
       CONDITION
    ========================= */

    .condition-box{
      border-radius:18px;

      background:#fff;

      border:1px solid var(--line);

      overflow:hidden;

      box-shadow:
        0 6px 18px rgba(24,44,49,.04);
    }


    .condition-summary{
      padding:16px;

      background:
        linear-gradient(
          135deg,
          #e8f3f6,
          #f5f9fa
        );

      border-bottom:1px solid #e1ecef;

      display:flex;
      align-items:center;

      gap:12px;
    }


    .condition-badge{
      flex:0 0 46px;

      width:46px;
      height:46px;

      border-radius:14px;

      background:#fff;

      color:var(--primary);

      display:flex;
      align-items:center;
      justify-content:center;

      box-shadow:
        0 5px 14px rgba(23,107,135,.08);
    }


    .condition-badge svg{
      width:24px;
      height:24px;
    }


    .condition-summary-text{
      flex:1;
      min-width:0;
    }


    .condition-summary-text strong{
      display:block;

      font-size:16px;
      font-weight:800;
    }


    .condition-summary-text span{
      display:block;

      color:var(--muted);

      font-size:13px;

      margin-top:3px;

      line-height:1.9;
    }


    .condition-grid{
      padding:11px;

      display:grid;

      grid-template-columns:1fr 1fr;

      gap:9px;
    }


    .condition-item{
      padding:13px;

      min-height:72px;

      border-radius:14px;

      background:#fafbfc;

      border:1px solid #edf0f2;
    }


    .condition-item-label{
      display:block;

      color:var(--muted);

      font-size:12px;
      font-weight:600;

      margin-bottom:5px;
    }


    .condition-item-value{
      display:flex;

      align-items:center;

      gap:5px;

      font-size:14px;
      font-weight:800;

      line-height:1.6;
    }


    .status-dot{
      display:none;
    }


    /* =========================
       NOTES
    ========================= */

    .notes-card{
      padding:15px 16px;

      border-radius:16px;

      background:var(--surface);

      border:1px solid var(--line);

      box-shadow:
        0 5px 16px rgba(24,44,49,.035);
    }


    .notes-card p{
      margin:0;

      color:#4e5a66;

      font-size:15px;

      line-height:2;

      white-space:pre-wrap;
    }


    /* =========================
       SELLER
    ========================= */

    .seller-card{
      padding:15px;

      border-radius:17px;

      background:#fff;

      border:1px solid var(--line);

      box-shadow:
        0 5px 16px rgba(24,44,49,.04);

      display:flex;
      align-items:center;

      gap:12px;
    }


    /* إزالة مربع/لون الأفاتار */

    .seller-avatar{
      display:none !important;
    }


    .seller-info{
      flex:1;
      min-width:0;
    }


    .seller-name{
      font-size:15px;
      font-weight:800;
    }


    .seller-meta{
      display:flex;
      align-items:center;

      gap:6px;

      margin-top:5px;

      color:var(--muted);

      font-size:12px;
    }


    .seller-meta svg{
      width:15px;
      height:15px;
    }


    /* التقييم بدون نجوم */

    .seller-rating{
      text-align:left;
      direction:ltr;

      padding-right:2px;
    }


    .rating-number{
      display:block;

      font-size:15px;
      font-weight:800;

      color:var(--ink);
    }


    .rating-label{
      display:block;

      color:var(--muted);

      font-size:11px;

      margin-top:1px;
    }


    /* =========================
       BOTTOM ACTIONS
    ========================= */

    .action-wrap{
      margin-top:24px;
    }


    .action-bar{
      position:sticky;

      bottom:12px;

      z-index:20;

      display:flex;

      gap:9px;

      padding:9px;

      background:rgba(255,255,255,.96);

      border:1px solid var(--line);

      border-radius:18px;

      box-shadow:
        0 12px 30px rgba(24,44,49,.12);

      backdrop-filter:blur(12px);
    }


    .favorite-btn{
      width:50px;
      height:50px;

      flex:0 0 50px;

      border-radius:14px;

      background:var(--surface-2);

      color:var(--ink);

      display:flex;
      align-items:center;
      justify-content:center;

      transition:.18s ease;
    }


    .favorite-btn:active{
      transform:scale(.95);
    }


    .favorite-btn.active{
      color:var(--purple);

      background:var(--purple-soft);
    }


    .favorite-btn svg{
      width:22px;
      height:22px;
    }


    .buy-btn{
      flex:1;

      height:50px;

      border-radius:14px;

      background:var(--pale);

      color:#51477d;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:8px;

      font-size:15px;
      font-weight:800;

      border:1px solid var(--pale-dark);

      box-shadow:
        0 9px 18px rgba(98,70,217,.10);

      transition:.18s ease;
    }


    .buy-btn:active{
      transform:
        translateY(1px)
        scale(.99);

      background:var(--pale-dark);
    }


    .buy-btn svg{
      width:20px;
      height:20px;
    }


    /* =========================
       LOADING
    ========================= */

    .loading{
      min-height:70vh;

      display:flex;
      flex-direction:column;

      align-items:center;
      justify-content:center;

      gap:12px;

      color:var(--muted);

      font-size:12px;
    }


    .spinner{
      width:32px;
      height:32px;

      border-radius:50%;

      border:3px solid #dfe8eb;

      border-top-color:var(--primary);

      animation:
        spin
        .8s linear
        infinite;
    }


    @keyframes spin{

      to{
        transform:rotate(360deg);
      }

    }


    /* =========================
       ERROR
    ========================= */

    .error-box{
      margin-top:35px;

      padding:22px 18px;

      border-radius:18px;

      background:#fff;

      border:1px solid var(--line);

      text-align:center;

      box-shadow:var(--shadow-soft);
    }


    .error-icon{
      width:48px;
      height:48px;

      margin:0 auto 10px;

      border-radius:15px;

      background:#fff0f2;

      color:var(--danger);

      display:flex;
      align-items:center;
      justify-content:center;
    }


    .error-icon svg{
      width:22px;
      height:22px;
    }


    .error-box strong{
      display:block;

      font-size:16px;
      font-weight:800;
    }


    .error-box p{
      margin:5px 0 15px;

      color:var(--muted);

      font-size:12px;
    }


    .back-home{
      height:42px;

      padding:0 18px;

      border-radius:12px;

      background:var(--primary);

      color:#fff;

      font-size:13px;
      font-weight:800;
    }


    /* =========================
       TOAST
    ========================= */

    .toast{
      position:fixed;

      left:50%;
      bottom:90px;

      transform:
        translateX(-50%)
        translateY(15px);

      width:max-content;

      max-width:
        calc(100vw - 35px);

      padding:10px 14px;

      border-radius:12px;

      background:#17202a;

  <div

  <script type="module">

    import { supabase } from "./js/supabase.js";


    const params =
      new URLSearchParams(
        window.location.search
      );


    const deviceId =
      params.get("id");


    const app =
      document.getElementById("app");


    const toast =
      document.getElementById("toast");


    let device = null;

    let galleryTrack = null;


    /* =========================
       ICONS
    ========================= */

    const icons = {

      image: `

      heartFill: `

      cart: `

          stroke-linecap="round"

      `,


      alert: `

          <path d="M12 9v5M12 17h.01"/>
        </svg>
      `
    };


    /* =========================
       HELPERS
    ========================= */

    function escapeHTML(value){

      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

    }


    function clean(value){

      if(
        value === null ||
        value === undefined
      ){
        return "";
      }

      return String(value).trim();

    }


    function formatPrice(value){

      const number =
        Number(value);

      if(!Number.isFinite(number)){
        return "—";
      }

      return `${new Intl.NumberFormat("en-US").format(number)} IQD`;

    }


    function firstLetter(value){

      const text =
        clean(value);

      return text
        ? text.charAt(0).toUpperCase()
        : "م";

    }


    function isApple(){

      return clean(device?.brand)
        .toLowerCase() === "apple";

    }


    function parseImages(value){

      if(!value){
        return [];
      }

      if(Array.isArray(value)){
        return value.filter(Boolean);
      }

      if(typeof value === "string"){

        const text =
          value.trim();

        if(!text){
          return [];
        }

        try{

          const parsed =
            JSON.parse(text);

          if(Array.isArray(parsed)){
            return parsed.filter(Boolean);
          }

        }catch(e){}

        return text
          .split(",")
          .map(item=>item.trim())
          .filter(Boolean);

      }

      return [];

    }


    function imageURL(path){

      if(!path){
        return "";
      }

      const value =
        String(path).trim();

      if(
        value.startsWith("http://") ||
        value.startsWith("https://") ||
        value.startsWith("data:") ||
        value.startsWith("blob:")
      ){

        return value;

      }

      const { data } =
        supabase
          .storage
          .from("device-images")
          .getPublicUrl(value);

      return data?.publicUrl || "";

    }


    function showToast(message){

      toast.textContent =
        message;

      toast.classList.add("show");

      clearTimeout(
        window.__toastTimer
      );

      window.__toastTimer =
        setTimeout(()=>{
          toast.classList.remove("show");
        },2200);

    }


    function normalizeSaleType(value){

      const text =
        clean(value).toLowerCase();

      if(
        text.includes("auction") ||
        text.includes("مزاد")
      ){
        return "مزاد";
      }

      if(
        text.includes("direct") ||
        text.includes("بيع")
      ){
        return "بيع مباشر";
      }

      return clean(value) || "بيع مباشر";

    }


    function normalizeCondition(value){

      const text =
        clean(value);

      if(!text){
        return "غير محددة";
      }

      const lower =
        text.toLowerCase();

      if(
        lower.includes("new") ||
        text.includes("جديد")
      ){
        return "جديد";
      }

      if(
        lower.includes("excellent") ||
        text.includes("ممتاز")
      ){
        return "ممتاز";
      }

      if(
        lower.includes("very good") ||
        text.includes("جيد جداً") ||
        text.includes("جيد جدًا")
      ){
        return "جيد جداً";
      }

      if(
        lower.includes("good") ||
        text.includes("جيد")
      ){
        return "جيد";
      }

      return text;

    }


    function conditionStatus(value){

      const text =
        clean(value).toLowerCase();

      if(
        text.includes("لا يوجد") ||
        text.includes("سليم") ||
        text.includes("يعمل") ||
        text.includes("جيد") ||
        text.includes("ممتاز") ||
        text.includes("نعم")
      ){
        return "ok";
      }

      if(
        text.includes("لا") ||
        text.includes("عطل") ||
        text.includes("مشكلة")
      ){
        return "bad";
      }

      return "neutral";

    }


    function statusClass(value){

      const status =
        conditionStatus(value);

      if(status === "ok"){
        return "";
      }

      if(status === "bad"){
        return "bad";
      }

      return "neutral";

    }


    /* =========================
       FETCH
    ========================= */

    async function loadDevice(){

      if(!deviceId){

        renderError(
          "رابط الجهاز غير صحيح"
        );

        return;

      }

      try{

        const { data,error } =
          await supabase
            .from("devices")
            .select("*")
            .eq("id",deviceId)
            .single();

        if(error){
          throw error;
        }

        if(!data){

          renderError(
            "الجهاز غير موجود"
          );

          return;

        }

        device =
          data;

        renderDevice();

      }catch(error){

        console.error(
          "DEVICE LOAD ERROR:",
          error
        );

        renderError(
          "تعذر تحميل بيانات الجهاز"
        );

      }

    }


    /* =========================
       RENDER
    ========================= */

    function renderDevice(){

      const images =
        parseImages(device.images)
          .map(imageURL)
          .filter(Boolean);


      const brand =
        clean(device.brand) ||
        "هاتف";


      const model =
        clean(device.model) ||
        "جهاز";


      const saleType =
        normalizeSaleType(
          device.sale_type
        );


      const sellerName =
        clean(device.seller_name) ||
        "البائع";


      const sellerLocation =
        clean(device.location) ||
        "النجف";


      const condition =
        normalizeCondition(
          device.condition
        );


      const notes =
        clean(device.notes);


      const specs = [];


      if(clean(device.storage)){

        specs.push({
          label:"السعة",
          value:clean(device.storage),
          icon:icons.storage
        });

      }


      if(clean(device.color)){

        specs.push({
          label:"اللون",
          value:clean(device.color),
          icon:icons.color
        });

      }


      if(
        isApple() &&
        device.battery_health !== null &&
        device.battery_health !== undefined &&
        clean(device.battery_health) !== ""
      ){

        specs.push({
          label:"صحة البطارية",
          value:`${device.battery_health}%`,
          icon:icons.battery
        });

      }


      if(clean(device.location)){

        specs.push({
          label:"الموقع",
          value:clean(device.location),
          icon:icons.location
        });

      }


      if(!specs.length){

        specs.push({
          label:"النوع",
          value:"هاتف ذكي",
          icon:icons.phone
        });

      }


      const conditionItems = [

        {
          label:"حالة الشاشة",
          value:clean(device.screen_condition)
        },

        {
          label:"حالة الهيكل",
          value:clean(device.body_condition)
        },

        {
          label:isApple()
            ? "Face ID"
            : "البصمة",
          value:clean(device.face_id)
        },

        {
          label:"الكاميرات",
          value:clean(device.cameras)
        },

        {
          label:"الشحن",
          value:clean(device.charging)
        },

        {
          label:"القطع المستبدلة",
          value:clean(device.replaced_parts)
        }

      ].filter(item=>item.value);


      const safeBrand =
        escapeHTML(brand);


      const safeModel =
        escapeHTML(model);


      app.innerHTML = `

        <section class="gallery-card">

          <div class="gallery">

            ${
              images.length
              ? `

                <div
                  class="gallery-track"
                  id="galleryTrack"
                >

                    <div class="gallery-slide">

                      <img
                        src="${escapeHTML(src)}"
                        alt="${safeBrand} ${safeModel}"
                        loading="${index === 0 ? "eager" : "lazy"}"
                        draggable="false"
                        onerror="this.closest('.gallery-slide').style.display='none'"
                      />

                    </div>

                  `).join("")}

                </div>


                <div
                  class="gallery-counter"
                  id="galleryCounter"
                >
                  1 / ${images.length}
                </div>


                ${
                  images.length > 1
                  ? `

                    <div
                      class="gallery-dots"
                      id="galleryDots"
                    >

                      ${images.map((_,index)=>`

                        <span
                          class="gallery-dot ${index === 0 ? "active" : ""}"
                        ></span>

                      `).join("")}

                    </div>

                  `
                  : `<div class="gallery-dots"></div>`
                }

              `
              : `

                <div class="gallery-empty">

                  <div class="gallery-empty-icon">
                    ${icons.image}
                  </div>

                  <strong>
                    لا توجد صور
                  </strong>

                  <span>
                    لم تتم إضافة صورة للجهاز
                  </span>

                </div>

                <div class="gallery-dots"></div>

              `
            }

          </div>

        </section>


        <section class="product-head">

          <div class="brand">
            ${safeBrand}
          </div>


          <h1 class="product-name">
            ${safeModel}
          </h1>


          <div class="chips">

            ${
              clean(device.storage)
              ? `

                <span class="chip">

                  ${icons.storage}

                  ${escapeHTML(device.storage)}

                </span>

              `
              : ""
            }


            ${
              clean(device.color)
              ? `

                <span class="chip">

                  ${icons.color}

                  ${escapeHTML(device.color)}

                </span>

              `
              : ""
            }


            <span class="chip sale">
              ${escapeHTML(saleType)}
            </span>

          </div>

        </section>


        <section class="price-card">

          <div class="price-label">
            السعر
          </div>


          <div class="price-row">

            <div class="price">
              ${formatPrice(device.price)}

            <div class="sale-type">
              ${escapeHTML(saleType)}
            </div>

          </div>

        </section>


        <section class="details-intro">

          <div class="details-intro-icon">
            ${icons.info}
          </div>


          <div class="details-intro-copy">

            <strong>
              تفاصيل الجهاز

            <span>
              المواصفات والحالة ومعلومات البائع
            </span>

          </div>


          <div class="intro-arrow">

            <svg
              viewBox="0 0 24 24"

              <path d="M9 18l6-6-6-6"/>
            </svg>

          </div>

        </section>


        <section class="section">

          <div class="section-head">

            <h2 class="section-title">
              مواصفات الجهاز

          </div>


          <div class="spec-grid">

            ${specs.map(item=>`

              <div class="spec-card">

                <div class="spec-icon">
                  ${item.icon}

                <div class="spec-info">

                  <span class="spec-label">

                  <strong class="spec-value">
                    ${escapeHTML(item.value)}

                </div>

              </div>

            `).join("")}

          </div>

        </section>


        <section class="section">

          <div class="section-head">

            <h2 class="section-title">
              حالة الجهاز
            </h2>

          </div>


          <div class="condition-box">

              <div class="condition-badge">

                <strong>
                  حماية MZAD PHONE
                </strong>


                <span>

                  التواصل والبيع يتم عبر المنصة
                </span>

              </div>

            </div>


            ${
              conditionItems.length
              ? `

                <div class="condition-grid">

                  ${conditionItems.map(item=>`

                    <div class="condition-item">

                      <span class="condition-item-label">
                        ${escapeHTML(item.label)}
                      </span>


                      <div class="condition-item-value">

                        <span class="status-dot ${statusClass(item.value)}"></span>

                        <span>
                          ${escapeHTML(item.value)}
                        </span>

                      </div>

                    </div>

                  `).join("")}

                </div>

              `
              : `

                <div
                  style="
                    padding:16px;
                    color:#667085;
                    font-size:13px;
                    text-align:center;
                  "
                >
                  لا توجد تفاصيل إضافية عن الحالة
                </div>

              `
            }

          </div>

        </section>


        ${
          notes
          ? `

            <section class="section">

              <div class="section-head">

                <h2 class="section-title">
                  ملاحظات البائع
                </h2>

              </div>


              <div class="notes-card">

                <p>
                  ${escapeHTML(notes)}
                </p>

              </div>

            </section>

          `
          : ""
        }


        <section class="section">

          <div class="section-head">

            <h2 class="section-title">
              البائع
            </h2>

          </div>


          <div class="seller-card">

            <div class="seller-avatar">
              ${escapeHTML(firstLetter(sellerName))}
            </div>


            <div class="seller-info">

              <div class="seller-name">
                ${escapeHTML(sellerName)}
              </div>


              <div class="seller-meta">

                ${icons.location}

                <span>
                  ${escapeHTML(sellerLocation)}
                </span>

              </div>

            </div>


            <div class="seller-rating">

              <span class="rating-number">
                0.0
              </span>

              <span class="rating-label">
                التقييم
              </span>

            </div>

          </div>

        </section>


        <section class="action-wrap">

          <div class="action-bar">

            <button
              class="favorite-btn"
              id="favoriteBtn"
              aria-label="إضافة للمفضلة"
            >
              ${icons.heart}
            </button>


            <button
              class="buy-btn"
              id="buyBtn"
            >

              ${icons.cart}

              <span>
                ${
                  saleType === "مزاد"
                  ? "دخول المزاد"
                  : "شراء الجهاز"
                }
              </span>

            </button>

          </div>

        </section>

      `;


      setupGallery();

      setupActions();

    }


    /* =========================
       GALLERY
    ========================= */

    function setupGallery(){

      galleryTrack =
        document.getElementById(
          "galleryTrack"
        );

      if(!galleryTrack){
        return;
      }


      const counter =
        document.getElementById(
          "galleryCounter"
        );


      const dots =
        [
          ...document.querySelectorAll(
            ".gallery-dot"
          )
        ];


      galleryTrack.addEventListener(
        "scroll",
        ()=>{

          const width =
            galleryTrack.clientWidth;

          if(!width){
            return;
          }


          const index =
            Math.round(
              galleryTrack.scrollLeft / width
            );


          if(counter){

            counter.textContent =
              `${Math.min(
                index + 1,
                dots.length || 1
              )} / ${dots.length || 1}`;

          }


          dots.forEach((dot,i)=>{

            dot.classList.toggle(
              "active",
              i === index
            );

          });

        }
      );


      let startX = 0;


      galleryTrack.addEventListener(
        "touchstart",
        (event)=>{

          startX =
            event.touches[0].clientX;

        },
        {passive:true}
      );


      galleryTrack.addEventListener(
        "touchmove",
        (event)=>{

          if(
            Math.abs(
              event.touches[0].clientX -
              startX
            ) > 8
          ){

            event.stopPropagation();

          }

        },
        {passive:true}
      );

    }


    /* =========================
       ACTIONS
    ========================= */

    function setupActions(){

      const shareButton =
        document.getElementById(
          "shareBtn"
        );


      if(shareButton){

        shareButton.addEventListener(
          "click",
          shareDevice
        );

      }


      const favoriteBtn =
        document.getElementById(
          "favoriteBtn"
        );


      if(favoriteBtn){

        favoriteBtn.addEventListener(
          "click",
          async()=>{

            const { data } =
              await supabase.auth.getSession();


            if(!data?.session){

              const returnTo =
                window.location.href;


              sessionStorage.setItem(
                "mzad_pending_action",
                returnTo
              );


              showToast(
                "سجّل دخولك أو أنشئ حساباً أولاً"
              );


              setTimeout(()=>{

                window.location.href =
                  `index.html?login=1&returnTo=${encodeURIComponent(returnTo)}`;

              },450);


              return;

            }


            favoriteBtn.classList.toggle(
              "active"
            );


            if(
              favoriteBtn.classList.contains(
                "active"
              )
            ){

              favoriteBtn.innerHTML =
                icons.heartFill;

              showToast(
                "تمت إضافة الجهاز للمفضلة"
              );

            }else{

              favoriteBtn.innerHTML =
                icons.heart;

              showToast(
                "تمت إزالة الجهاز من المفضلة"
              );

            }

          }
        );

      }


      const buyBtn =
        document.getElementById(
          "buyBtn"
        );


      if(buyBtn){

        buyBtn.addEventListener(
          "click",
          async()=>{

            const { data } =
              await supabase.auth.getSession();


            if(!data?.session){

              const returnTo =
                window.location.href;


              sessionStorage.setItem(
                "mzad_pending_action",
                returnTo
              );


              showToast(
                "سجّل دخولك أو أنشئ حساباً أولاً"
              );


              setTimeout(()=>{

                window.location.href =
                  `index.html?login=1&returnTo=${encodeURIComponent(returnTo)}`;

              },450);


              return;

            }


            if(
              normalizeSaleType(
                device.sale_type
              ) === "مزاد"
            ){

              showToast(
                "المزاد راح نربطه بالخطوة الخاصة بالمزايدة"
              );

            }else{

              showToast(
                "شراء الجهاز راح نربطه بخطوة الشراء"
              );

            }

          }
        );

      }

    }


    /* =========================
       SHARE
    ========================= */

    async function shareDevice(){

      const url =
        window.location.href;


      const title =
        `${clean(device?.brand)} ${clean(device?.model)}`
          .trim() ||
        "جهاز على MZAD PHONE";


      try{

        if(navigator.share){

          await navigator.share({

            title,

            text:
              `شوف هذا الجهاز على MZAD PHONE`,

            url

          });

          return;

        }


        await navigator.clipboard.writeText(
          url
        );


        showToast(
          "تم نسخ رابط الجهاز"
        );

      }catch(error){

        if(
          error?.name !== "AbortError"
        ){

          showToast(
            "تعذر مشاركة الرابط"
          );

        }

      }

    }


    /* =========================
       ERROR
    ========================= */

    function renderError(message){

      app.innerHTML = `

        <div class="error-box">

          <div class="error-icon">
            ${icons.alert}
          </div>


          <strong>
            ${escapeHTML(message)}
          </strong>


          <p>
            تأكد من الرابط وحاول مرة ثانية
          </p>


          <button
            class="back-home"
            id="errorBack"
          >
            العودة للرئيسية
          </button>

        </div>

      `;


      document
        .getElementById("errorBack")
        ?.addEventListener(
          "click",
          ()=>{
            window.location.href =
              "home.html";
          }
        );

    }


    /* =========================
       HEADER
    ========================= */

    document
      .getElementById("backBtn")
      .addEventListener(
        "click",
        ()=>{

          if(document.referrer){

            history.back();

          }else{

            window.location.href =
              "home.html";

          }

        }
      );


    /* =========================
       START
    ========================= */

    loadDevice();

  </script>
