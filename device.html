<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#f7f8fa" />

  <title>تفاصيل الجهاز | MZAD PHONE</title>

  <style>
    :root{
      --petrol:#176b87;
      --purple:#6246d9;

      --bg:#f7f8fa;
      --card:#ffffff;

      --text:#16181c;
      --muted:#8a8d95;
      --line:#ececf0;

      --pale:#e6e3f6;
      --pale-dark:#d8d3ee;
      --pale-text:#51477d;

      --danger:#e85c67;
      --success:#3ca56d;

      --radius:20px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      overflow-x:hidden;
    }

    body.viewer-open{
      overflow:hidden;
    }

    button,
    input{
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
    }

    .page{
      min-height:100vh;
      padding-bottom:110px;
    }

    /* =====================================================
       TOP BAR
    ===================================================== */

    .topbar{
      position:sticky;
      top:0;
      z-index:80;

      height:68px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:
        max(8px, env(safe-area-inset-top))
        16px
        8px;

      background:
        linear-gradient(
          115deg,
          rgba(23,107,135,.96),
          rgba(98,70,217,.94),
          rgba(230,227,246,.96),
          rgba(23,107,135,.94)
        );

      background-size:300% 300%;

      animation:
        headerFlow 9s ease-in-out infinite;

      box-shadow:
        0 8px 24px rgba(23,107,135,.10);

      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }

    .topbar::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-1px;
      height:12px;

      background:
        radial-gradient(
          22px 10px at 10% 0,
          transparent 70%,
          var(--bg) 72%
        ),
        radial-gradient(
          26px 10px at 30% 0,
          transparent 70%,
          var(--bg) 72%
        ),
        radial-gradient(
          22px 10px at 50% 0,
          transparent 70%,
          var(--bg) 72%
        ),
        radial-gradient(
          28px 10px at 72% 0,
          transparent 70%,
          var(--bg) 72%
        ),
        radial-gradient(
          22px 10px at 92% 0,
          transparent 70%,
          var(--bg) 72%
        );

      pointer-events:none;
    }

    @keyframes headerFlow{
      0%{
        background-position:0% 50%;
      }

      50%{
        background-position:100% 50%;
      }

      100%{
        background-position:0% 50%;
      }
    }

    .topbar-side{
      width:42px;
      height:42px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:15px;

      background:rgba(255,255,255,.16);

      border:1px solid rgba(255,255,255,.22);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.24);

      color:#fff;

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .topbar-side:active{
      transform:scale(.91);
      background:rgba(255,255,255,.25);
    }

    .topbar-side svg{
      width:21px;
      height:21px;
      stroke:currentColor;
      stroke-width:1.9;
      fill:none;
    }

    .topbar-title{
      flex:1;
      min-width:0;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      color:#fff;

      text-align:center;

      pointer-events:none;
    }

    .topbar-title strong{
      font-size:17px;
      line-height:20px;
      font-weight:800;
      letter-spacing:-.3px;
    }

    .topbar-title span{
      margin-top:2px;

      font-size:9px;
      line-height:12px;

      font-weight:800;

      letter-spacing:1.7px;

      opacity:.82;
    }

    /* =====================================================
       MAIN
    ===================================================== */

    main{
      width:100%;
      max-width:620px;
      margin:0 auto;
      padding:0 16px;
    }

    /* =====================================================
       LOADING
    ===================================================== */

    .loading{
      min-height:55vh;

      display:flex;
      align-items:center;
      justify-content:center;

      color:var(--muted);

      font-size:12px;
      font-weight:700;
    }

    .loading::before{
      content:"";
      width:20px;
      height:20px;

      margin-left:9px;

      border-radius:50%;

      border:
        2px solid #dddce6;

      border-top-color:var(--purple);

      animation:spin .8s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    /* =====================================================
       GALLERY
    ===================================================== */

    .gallery-card{
      width:calc(100% + 32px);

      margin-right:-16px;
      margin-left:-16px;

      margin-bottom:0;

      border:0;
      border-radius:0;

      overflow:hidden;

      background:#f1f2f4;

      box-shadow:none;
    }

    .gallery{
      position:relative;

      width:100%;
      height:300px;

      background:#f1f2f4;

      overflow:hidden;
    }

    .gallery-track{
      width:100%;
      height:100%;

      display:flex;

      overflow-x:auto;
      overflow-y:hidden;

      scroll-snap-type:x mandatory;

      scrollbar-width:none;

      overscroll-behavior-x:contain;

      -webkit-overflow-scrolling:touch;
    }

    .gallery-track::-webkit-scrollbar{
      display:none;
    }

    .gallery-slide{
      position:relative;

      flex:0 0 100%;
      width:100%;
      height:100%;

      scroll-snap-align:center;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#f1f2f4;

      overflow:hidden;
    }

    .gallery-slide img{
      width:100%;
      height:100%;

      display:block;

      object-fit:cover;

      user-select:none;
      -webkit-user-drag:none;
    }

    .gallery-counter{
      position:absolute;

      top:14px;
      right:14px;

      min-width:43px;
      height:28px;

      padding:0 9px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:10px;

      background:rgba(15,17,22,.46);

      color:#fff;

      font-size:10px;
      font-weight:800;

      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      z-index:8;
    }

    .gallery-dots{
      position:absolute;

      left:50%;
      bottom:13px;

      transform:translateX(-50%);

      min-height:20px;

      padding:5px 8px;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;

      border-radius:999px;

      background:rgba(15,17,22,.42);

      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      z-index:8;
    }

    .gallery-dot{
      width:5px;
      height:5px;

      border-radius:50%;

      background:rgba(255,255,255,.48);

      transition:
        width .25s ease,
        background .25s ease;
    }

    .gallery-dot.active{
      width:15px;
      border-radius:999px;
      background:#fff;
    }

    /* =====================================================
       PHOTO PULSE
       المنطقة البيضاء الجديدة
    ===================================================== */

    .photo-pulse{
      position:relative;

      height:82px;

      margin:
        0 -4px
        16px;

      display:flex;
      align-items:center;
      justify-content:center;

      overflow:hidden;

      cursor:pointer;

      user-select:none;
      -webkit-user-select:none;

      -webkit-tap-highlight-color:transparent;
    }

    .photo-pulse::before,
    .photo-pulse::after{
      content:"";

      position:absolute;

      left:50%;
      top:50%;

      width:45px;
      height:45px;

      border:
        1px solid
        rgba(98,70,217,.20);

      border-radius:50%;

      transform:
        translate(-50%,-50%)
        scale(.65);

      opacity:0;

      pointer-events:none;

      animation:
        photoPulseWave
        3s
        ease-out
        infinite;
    }

    .photo-pulse::after{
      animation-delay:1.5s;
    }

    @keyframes photoPulseWave{
      0%{
        transform:
          translate(-50%,-50%)
          scale(.65);

        opacity:0;
      }

      12%{
        opacity:.75;
      }

      70%{
        opacity:.18;
      }

      100%{
        transform:
          translate(-50%,-50%)
          scale(2.15);

        opacity:0;
      }
    }

    .photo-pulse-core{
      position:relative;

      width:50px;
      height:50px;

      border-radius:18px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        linear-gradient(
          145deg,
          #f0eefb,
          #e6e3f6
        );

      box-shadow:
        0 9px 22px rgba(98,70,217,.11),
        inset 0 1px 0 rgba(255,255,255,.95);

      z-index:4;

      animation:
        photoFloat
        2.6s
        ease-in-out
        infinite;

      transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        box-shadow .35s ease;
    }

    .photo-pulse-core svg{
      width:23px;
      height:23px;

      stroke:var(--purple);

      stroke-width:1.8;

      fill:none;

      transition:
        transform .35s ease;
    }

    .photo-pulse-shine{
      position:absolute;

      width:85px;
      height:18px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.92),
          transparent
        );

      transform:
        translateX(-110px)
        rotate(-18deg);

      animation:
        photoShine
        3.4s
        ease-in-out
        infinite;

      z-index:5;

      pointer-events:none;
    }

    @keyframes photoShine{
      0%{
        transform:
          translateX(-110px)
          rotate(-18deg);

        opacity:0;
      }

      25%{
        opacity:.8;
      }

      55%{
        transform:
          translateX(110px)
          rotate(-18deg);

        opacity:0;
      }

      100%{
        opacity:0;
      }
    }

    @keyframes photoFloat{
      0%,100%{
        transform:
          translateY(0)
          rotate(0deg);
      }

      50%{
        transform:
          translateY(-3px)
          rotate(.8deg);
      }
    }

    .photo-pulse-label{
      position:absolute;

      bottom:3px;

      display:flex;
      align-items:center;
      gap:5px;

      color:#8a8797;

      font-size:10px;
      font-weight:750;

      opacity:.86;

      z-index:5;
    }

    .photo-pulse-label span{
      width:4px;
      height:4px;

      border-radius:50%;

      background:var(--purple);

      animation:
        photoDot
        1.6s
        ease-in-out
        infinite;
    }

    @keyframes photoDot{
      0%,100%{
        transform:scale(.75);
        opacity:.35;
      }

      50%{
        transform:scale(1.25);
        opacity:1;
      }
    }

    .photo-pulse:active .photo-pulse-core{
      transform:scale(.86);
      box-shadow:
        0 4px 12px rgba(98,70,217,.08);
    }

    .photo-pulse:active .photo-pulse-core svg{
      transform:scale(.88);
    }

    .photo-pulse.is-opening .photo-pulse-core{
      animation:none;

      transform:scale(1.16);

      box-shadow:
        0 12px 35px rgba(98,70,217,.18);
    }

    .photo-pulse.is-opening::before,
    .photo-pulse.is-opening::after{
      animation:none;
      opacity:0;
    }

    .photo-pulse-ripple{
      position:absolute;

      width:22px;
      height:22px;

      border-radius:50%;

      background:
        rgba(98,70,217,.13);

      transform:
        translate(-50%,-50%)
        scale(0);

      pointer-events:none;

      z-index:20;
    }

    .photo-pulse-ripple.active{
      animation:
        rippleExpand
        .72s
        cubic-bezier(.2,.8,.2,1)
        forwards;
    }

    @keyframes rippleExpand{
      0%{
        transform:
          translate(-50%,-50%)
          scale(0);

        opacity:.8;
      }

      100%{
        transform:
          translate(-50%,-50%)
          scale(18);

        opacity:0;
      }
    }

    /* =====================================================
       PRODUCT HEAD
    ===================================================== */

    .product-head{
      padding-top:0;
    }

    .brand{
      font-size:13px;
      font-weight:800;

      color:var(--petrol);

      margin-bottom:5px;
    }

    .product-name{
      margin:0;

      font-size:25px;
      line-height:1.25;

      font-weight:850;

      letter-spacing:-.7px;

      color:var(--text);
    }

    .chips{
      display:flex;
      align-items:center;
      flex-wrap:wrap;

      gap:7px;

      margin-top:12px;
    }

    .chip{
      height:34px;

      padding:0 12px;

      display:inline-flex;
      align-items:center;
      justify-content:center;

      border-radius:12px;

      background:#fff;

      border:1px solid var(--line);

      color:#555861;

      font-size:12px;
      font-weight:750;

      box-shadow:
        0 4px 12px rgba(20,25,35,.035);
    }

    .chip.sale{
      color:#666873;
      background:#fff;
    }

    /* =====================================================
       PRICE
    ===================================================== */

    .price-card{
      position:relative;

      margin-top:18px;

      padding:18px;

      border-radius:20px;

      background:
        linear-gradient(
          145deg,
          var(--pale),
          #eeecf8
        );

      border:1px solid rgba(98,70,217,.08);

      overflow:hidden;

      box-shadow:
        0 8px 25px rgba(98,70,217,.055);
    }

    .price-card::after{
      content:"";

      position:absolute;

      width:120px;
      height:120px;

      left:-50px;
      top:-60px;

      border-radius:50%;

      background:
        rgba(255,255,255,.34);

      filter:blur(3px);
    }

    .price-label{
      position:relative;
      z-index:2;

      font-size:11px;
      font-weight:750;

      color:var(--pale-text);

      margin-bottom:4px;
    }

    .price{
      position:relative;
      z-index:2;

      display:flex;
      align-items:baseline;
      flex-wrap:wrap;

      gap:6px;

      font-size:29px;
      line-height:1.1;

      font-weight:900;

      color:#332d52;

      letter-spacing:-.6px;
    }

    .price-currency{
      font-size:12px;
      font-weight:800;

      color:var(--pale-text);

      letter-spacing:0;
    }

    /* =====================================================
       DETAILS INTRO
    ===================================================== */

    .details-intro{
      margin-top:27px;
      margin-bottom:13px;
    }

    .details-intro strong{
      display:block;

      font-size:15px;
      font-weight:850;

      color:var(--text);
    }

    .details-intro span{
      display:block;

      margin-top:3px;

      font-size:12px;

      color:var(--muted);

      line-height:1.6;
    }

    .section-title{
      margin:0 0 11px;

      font-size:17px;

      font-weight:850;

      letter-spacing:-.25px;
    }

    /* =====================================================
       SPECS
    ===================================================== */

    .spec-grid{
      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:10px;
    }

    .spec-card{
      min-height:88px;

      padding:13px;

      border-radius:17px;

      background:var(--card);

      border:1px solid var(--line);

      box-shadow:
        0 5px 16px rgba(20,25,35,.035);

      display:flex;
      align-items:center;

      gap:11px;
    }

    .spec-icon{
      flex:0 0 43px;

      width:43px;
      height:43px;

      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#f1f0f8;

      color:var(--purple);
    }

    .spec-icon svg{
      width:22px;
      height:22px;

      stroke:currentColor;
      stroke-width:1.7;

      fill:none;
    }

    .spec-text{
      min-width:0;
    }

    .spec-label{
      font-size:11px;

      color:var(--muted);

      font-weight:700;

      line-height:1.3;
    }

    .spec-value{
      margin-top:4px;

      font-size:13px;

      color:var(--text);

      font-weight:850;

      line-height:1.35;

      word-break:break-word;
    }

    /* =====================================================
       CONDITION
    ===================================================== */

    .condition-box{
      margin-top:18px;

      padding:17px;

      border-radius:20px;

      background:#fff;

      border:1px solid var(--line);

      box-shadow:
        0 5px 17px rgba(20,25,35,.035);
    }

    .condition-summary{
      display:flex;
      align-items:flex-start;
      gap:11px;

      margin-bottom:15px;
    }

    .shield{
      flex:0 0 43px;

      width:43px;
      height:43px;

      border-radius:14px;

      background:#eef7f2;

      color:var(--success);

      display:flex;
      align-items:center;
      justify-content:center;
    }

    .shield svg{
      width:23px;
      height:23px;

      stroke:currentColor;
      stroke-width:1.7;

      fill:none;
    }

    .condition-summary strong{
      display:block;

      font-size:16px;

      font-weight:850;

      color:var(--text);
    }

    .condition-summary span{
      display:block;

      margin-top:4px;

      font-size:13px;

      line-height:1.6;

      color:var(--muted);
    }

    .condition-list{
      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:8px;
    }

    .condition-item{
      padding:11px 12px;

      border-radius:14px;

      background:#f8f8fa;
    }

    .condition-item-label{
      font-size:12px;

      color:var(--muted);

      font-weight:700;
    }

    .condition-item-value{
      margin-top:4px;

      font-size:14px;

      color:var(--text);

      font-weight:800;
    }

    /* =====================================================
       NOTES
    ===================================================== */

    .notes-box{
      margin-top:18px;

      padding:17px;

      border-radius:20px;

      background:#fff;

      border:1px solid var(--line);

      box-shadow:
        0 5px 17px rgba(20,25,35,.035);
    }

    .notes-box p{
      margin:0;

      font-size:15px;

      line-height:1.8;

      color:#555860;

      white-space:pre-wrap;
    }

    /* =====================================================
       SELLER
    ===================================================== */

    .seller-box{
      margin-top:18px;

      padding:17px;

      border-radius:20px;

      background:#fff;

      border:1px solid var(--line);

      box-shadow:
        0 5px 17px rgba(20,25,35,.035);
    }

    .seller-top{
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;
    }

    .seller-info{
      min-width:0;
    }

    .seller-name{
      font-size:14px;

      font-weight:850;

      color:var(--text);

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .seller-meta{
      margin-top:4px;

      font-size:11px;

      color:var(--muted);
    }

    .seller-rating{
      flex:0 0 auto;

      min-width:58px;

      padding:8px 9px;

      border-radius:13px;

      background:#f6f5fa;

      color:#625e70;

      text-align:center;

      font-size:14px;

      font-weight:850;
    }

    .seller-member{
      margin-top:13px;

      padding-top:13px;

      border-top:1px solid #f0f0f3;

      display:flex;
      align-items:center;
      gap:7px;

      font-size:11px;

      color:var(--muted);
    }

    .seller-member-dot{
      width:6px;
      height:6px;

      border-radius:50%;

      background:var(--petrol);
    }

    /* =====================================================
       BOTTOM ACTIONS
    ===================================================== */

    .bottom-actions{
      position:fixed;

      left:0;
      right:0;
      bottom:0;

      z-index:70;

      padding:
        10px
        16px
        max(10px, env(safe-area-inset-bottom));

      background:
        rgba(247,248,250,.88);

      border-top:1px solid rgba(220,221,225,.7);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .bottom-actions-inner{
      width:100%;
      max-width:620px;
      margin:0 auto;

      display:grid;

      grid-template-columns:54px 1fr;

      gap:9px;
    }

    .favorite-btn{
      width:54px;
      height:52px;

      border-radius:17px;

      background:#fff;

      border:1px solid var(--line);

      color:#777a82;

      display:flex;
      align-items:center;
      justify-content:center;

      transition:
        transform .2s ease,
        color .2s ease,
        background .2s ease;
    }

    .favorite-btn:active{
      transform:scale(.94);
    }

    .favorite-btn.active{
      color:var(--purple);

      background:var(--pale);

      border-color:transparent;
    }

    .favorite-btn svg{
      width:22px;
      height:22px;

      stroke:currentColor;
      stroke-width:1.8;

      fill:none;
    }

    .buy-btn{
      height:52px;

      border-radius:17px;

      background:
        linear-gradient(
          135deg,
          #e6e3f6,
          #ddd9f0
        );

      color:#51477d;

      font-size:15px;

      font-weight:900;

      box-shadow:
        0 8px 20px rgba(98,70,217,.08);

      transition:
        transform .2s ease,
        filter .2s ease;
    }

    .buy-btn:active{
      transform:scale(.985);
      filter:brightness(.97);
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast{
      position:fixed;

      left:50%;
      bottom:90px;

      z-index:300;

      max-width:calc(100% - 32px);

      padding:11px 15px;

      border-radius:14px;

      background:#191b20;

      color:#fff;

      font-size:12px;
      font-weight:700;

      transform:
        translate(-50%,20px);

      opacity:0;
      visibility:hidden;

      transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s ease;

      box-shadow:
        0 12px 30px rgba(0,0,0,.18);

      text-align:center;
    }

    .toast.show{
      opacity:1;
      visibility:visible;

      transform:
        translate(-50%,0);
    }

    /* =====================================================
       FULLSCREEN PHOTO VIEWER
    ===================================================== */

    .photo-viewer{
      position:fixed;

      inset:0;

      z-index:500;

      background:
        rgba(8,10,15,.97);

      opacity:0;
      visibility:hidden;

      transition:
        opacity .28s ease,
        visibility .28s ease;
    }

    .photo-viewer.open{
      opacity:1;
      visibility:visible;
    }

    .viewer-top{
      position:absolute;

      top:0;
      left:0;
      right:0;

      z-index:30;

      padding:
        max(14px, env(safe-area-inset-top))
        16px
        12px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      pointer-events:none;
    }

    .viewer-counter{
      min-width:52px;
      height:31px;

      padding:0 10px;

      border-radius:11px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:rgba(255,255,255,.10);

      color:#fff;

      font-size:11px;
      font-weight:800;

      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .viewer-close{
      width:40px;
      height:40px;

      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:rgba(255,255,255,.10);

      color:#fff;

      pointer-events:auto;

      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .viewer-close:active{
      transform:scale(.9);
      background:rgba(255,255,255,.18);
    }

    .viewer-close svg{
      width:21px;
      height:21px;

      stroke:currentColor;
      stroke-width:1.8;

      fill:none;
    }

    .viewer-stage{
      position:absolute;

      inset:0;

      overflow:hidden;

      touch-action:none;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    .viewer-track{
      width:100%;
      height:100%;

      display:flex;

      overflow-x:auto;
      overflow-y:hidden;

      scroll-snap-type:x mandatory;

      scrollbar-width:none;

      overscroll-behavior-x:contain;

      -webkit-overflow-scrolling:touch;
    }

    .viewer-track::-webkit-scrollbar{
      display:none;
    }

    .viewer-slide{
      position:relative;

      flex:0 0 100%;
      width:100%;
      height:100%;

      scroll-snap-align:center;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:
        70px
        18px
        80px;

      overflow:hidden;
    }

    .viewer-slide img{
      max-width:100%;
      max-height:100%;

      width:auto;
      height:auto;

      object-fit:contain;

      border-radius:8px;

      user-select:none;
      -webkit-user-drag:none;

      transform:
        scale(1)
        translate3d(0,0,0);

      transform-origin:center center;

      will-change:transform;

      transition:
        transform .25s cubic-bezier(.2,.8,.2,1);
    }

    .viewer-slide.zoomed img{
      transition:none;
    }

    .viewer-hint{
      position:absolute;

      left:50%;
      bottom:
        max(28px, env(safe-area-inset-bottom));

      transform:translateX(-50%);

      padding:8px 12px;

      border-radius:999px;

      background:rgba(255,255,255,.08);

      color:rgba(255,255,255,.62);

      font-size:10px;

      pointer-events:none;

      white-space:nowrap;

      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      transition:
        opacity .4s ease;
    }

    .viewer-hint.hide{
      opacity:0;
    }

    .viewer-thumbs{
      position:absolute;

      left:50%;
      bottom:
        max(12px, env(safe-area-inset-bottom));

      transform:translateX(-50%);

      z-index:25;

      max-width:calc(100% - 32px);

      display:flex;
      align-items:center;

      gap:6px;

      padding:5px;

      border-radius:13px;

      background:rgba(255,255,255,.08);

      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .viewer-thumb{
      width:30px;
      height:30px;

      padding:0;

      border-radius:8px;

      overflow:hidden;

      opacity:.48;

      border:1px solid transparent;

      background:#222;

      transition:
        opacity .2s ease,
        transform .2s ease,
        border-color .2s ease;
    }

    .viewer-thumb.active{
      opacity:1;

      border-color:#fff;

      transform:scale(1.08);
    }

    .viewer-thumb img{
      width:100%;
      height:100%;

      object-fit:cover;

      display:block;
    }

    /* =====================================================
       ERROR
    ===================================================== */

    .error-box{
      min-height:55vh;

      display:flex;
      flex-direction:column;

      align-items:center;
      justify-content:center;

      text-align:center;

      padding:30px;
    }

    .error-box strong{
      font-size:16px;
      font-weight:850;

      color:var(--text);
    }

    .error-box span{
      margin-top:7px;

      font-size:12px;

      color:var(--muted);

      line-height:1.6;
    }

    .error-home{
      margin-top:18px;

      height:42px;

      padding:0 18px;

      border-radius:14px;

      background:var(--petrol);

      color:#fff;

      font-size:13px;
      font-weight:800;
    }

    /* =====================================================
       HIDE OLD STATUS DOTS / AVATAR
    ===================================================== */

    .status-dot{
      display:none !important;
    }

    .seller-avatar{
      display:none !important;
    }

    /* =====================================================
       MOBILE SMALL
    ===================================================== */

    @media(max-width:360px){

      .product-name{
        font-size:23px;
      }

      .price{
        font-size:27px;
      }

      .gallery{
        height:270px;
      }

      .spec-label{
        font-size:10px;
      }

      .spec-value{
        font-size:12px;
      }

      .condition-item-label{
        font-size:10px;
      }

      .condition-item-value{
        font-size:11px;
      }

      .notes-box p{
        font-size:14px;
      }

      .photo-pulse{
        height:76px;
      }
    }

    @media(min-width:600px){

      .gallery{
        height:380px;
      }

      .gallery-card{
        width:calc(100% + 32px);
      }
    }

    /* =====================================================
       REDUCE MOTION
    ===================================================== */

    @media(prefers-reduced-motion:reduce){

      *,
      *::before,
      *::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.001ms !important;
        scroll-behavior:auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- ===================================================

    <header class="topbar">

  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->

  <script type="module">

    import { supabase } from "./js/supabase.js";


    /* =====================================================
       BASIC
    ===================================================== */

    const app = document.getElementById("app");

    const toast = document.getElementById("toast");

    const shareBtn = document.getElementById("shareBtn");

    const backBtn = document.getElementById("backBtn");

    const photoViewer =
      document.getElementById("photoViewer");

    const viewerTrack =
      document.getElementById("viewerTrack");

    const viewerCounter =
      document.getElementById("viewerCounter");

    const viewerClose =
      document.getElementById("viewerClose");

    const viewerThumbs =
      document.getElementById("viewerThumbs");

    const viewerHint =
      document.getElementById("viewerHint");


    const params =
      new URLSearchParams(window.location.search);

    const deviceId =
      params.get("id");


    let device = null;

    let images = [];

    let currentViewerIndex = 0;

    let viewerOpened = false;

    let hintTimer = null;


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(message){

      toast.textContent = message;

      toast.classList.add("show");

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {

        toast.classList.remove("show");

      }, 2600);
    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(value){

      if(value === null || value === undefined){
        return "";
      }

      return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }


    /* =====================================================
       FORMAT PRICE
    ===================================================== */

    function formatPrice(value){

      if(
        value === null ||
        value === undefined ||
        value === ""
      ){
        return "—";
      }

      const number =
        Number(String(value).replace(/,/g,""));

      if(Number.isNaN(number)){
        return escapeHtml(value);
      }

      return new Intl.NumberFormat("ar-IQ")
        .format(number);
    }


    /* =====================================================
       NORMALIZE IMAGES
    ===================================================== */

    function normalizeImages(value){

      if(!value){
        return [];
      }

      let list = value;

      if(typeof value === "string"){

        try{
          list = JSON.parse(value);
        }catch{
          list = value
            .split(",")
            .map(item => item.trim())
            .filter(Boolean);
        }
      }

      if(!Array.isArray(list)){
        list = [list];
      }

      return list
        .map(item => {

          if(
            typeof item === "object" &&
            item !== null
          ){
            return (
              item.url ||
              item.path ||
              item.src ||
              ""
            );
          }

          return String(item);
        })
        .filter(Boolean)
        .map(item => {

          if(
            item.startsWith("http://") ||
            item.startsWith("https://") ||
            item.startsWith("data:")
          ){
            return item;
          }

          const {
            data
          } =
            supabase
              .storage
              .from("device-images")
              .getPublicUrl(item);

          return data?.publicUrl || item;

        });

    }


    /* =====================================================
       ICONS
    ===================================================== */

    const icons = {

      storage: `
        <svg viewBox="0 0 24 24">
          <path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"></path>
          <path d="M9 7h6"></path>
          <path d="M9 17h6"></path>
        </svg>
      `,

      battery: `
        <svg viewBox="0 0 24 24">
          <rect x="3" y="7" width="16" height="10" rx="2"></rect>
          <path d="M21 10v4"></path>
          <path d="M7 10v4"></path>
          <path d="M10 10v4"></path>
          <path d="M13 10v4"></path>
        </svg>
      `,

      color: `
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="7"></circle>
          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>
        </svg>
      `,

      camera: `
        <svg viewBox="0 0 24 24">
          <path d="M4 7h4l2-2h4l2 2h4v12H4Z"></path>
          <circle cx="12" cy="13" r="3.5"></circle>
        </svg>
      `,

      face: `
        <svg viewBox="0 0 24 24">
          <path d="M8 4H6a2 2 0 0 0-2 2v2"></path>
          <path d="M16 4h2a2 2 0 0 1 2 2v2"></path>
          <path d="M8 20H6a2 2 0 0 1-2-2v-2"></path>
          <path d="M16 20h2a2 2 0 0 0 2-2v-2"></path>
          <path d="M9 10h.01"></path>
          <path d="M15 10h.01"></path>
          <path d="M9 15c1.8 1.3 4.2 1.3 6 0"></path>
        </svg>
      `,

      charging: `
        <svg viewBox="0 0 24 24">
          <path d="M8 2v7"></path>
          <path d="M16 2v7"></path>
          <path d="M6 9h12"></path>
          <path d="M12 9v13"></path>
          <path d="M9 22h6"></path>
        </svg>
      `,

      parts: `
        <svg viewBox="0 0 24 24">
          <path d="M14 6a5 5 0 0 0-6 6l-5 5a2 2 0 0 0 3 3l5-5a5 5 0 0 0 6-6l-3 3-3-1-1-3Z"></path>
          <path d="M16 3l5 5"></path>
        </svg>
      `,

      location: `
        <svg viewBox="0 0 24 24">
          <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>
          <circle cx="12" cy="10" r="2.5"></circle>
        </svg>
      `,

      shield: `
        <svg viewBox="0 0 24 24">
          <path d="M12 3l7 3v5c0 4.7-3 8-7 10-4-2-7-5.3-7-10V6l7-3Z"></path>
          <path d="m8.5 12 2.2 2.2 4.8-5"></path>
        </svg>
      `,

      image: `
        <svg viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <circle cx="8.5" cy="9" r="1.5"></circle>
          <path d="m5 17 4.5-4 3 2.5 2.2-2 4.3 3.5"></path>
        </svg>
      `

    };


    /* =====================================================
       VALUE
    ===================================================== */

    function valueOrDash(value){

      if(
        value === null ||
        value === undefined ||
        String(value).trim() === ""
      ){
        return "غير مذكور";
      }

      return escapeHtml(value);
    }


    /* =====================================================
       RENDER DEVICE
    ===================================================== */

    function renderDevice(){

      const brand =
        valueOrDash(device.brand);

      const model =
        valueOrDash(device.model);

      const storage =
        valueOrDash(device.storage);

      const color =
        valueOrDash(device.color);

      const battery =
        valueOrDash(device.battery_health);

      const faceId =
        valueOrDash(device.face_id);

      const cameras =
        valueOrDash(device.cameras);

      const charging =
        valueOrDash(device.charging);

      const replacedParts =
        valueOrDash(device.replaced_parts);

      const location =
        valueOrDash(device.location);

      const condition =
        valueOrDash(device.condition);

      const screenCondition =
        valueOrDash(device.screen_condition);

      const bodyCondition =
        valueOrDash(device.body_condition);

      const notes =
        valueOrDash(device.notes);

      const sellerName =
        valueOrDash(device.seller_name);

      const saleType =
        device.sale_type === "auction"
          ? "مزاد"
          : "بيع مباشر";

      const price =
        formatPrice(device.price);

      const imageSlides =
        images.length
          ? images.map((url,index) => `
              <div
                class="gallery-slide"
                data-index="${index}"
              >
                <img
                  src="${escapeHtml(url)}"
                  alt="${escapeHtml(device.model || "صورة الجهاز")}"
                  draggable="false"
                />
              </div>
            `).join("")
          : `
              <div class="gallery-slide">
                <div
                  style="
                    width:100%;
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#999;
                    font-size:12px;
                    font-weight:700;
                  "
                >
                  لا توجد صورة
                </div>
              </div>
            `;


      const dots =
        images.length > 1
          ? images.map((_,index) => `
              <span
                class="gallery-dot ${index === 0 ? "active" : ""}"
                data-dot="${index}"
              ></span>
            `).join("")
          : "";


      const pulseLabel =
        images.length > 1
          ? "اضغط لاستعراض الصور"
          : "اضغط لعرض الصورة";


      app.innerHTML = `

        <!-- GALLERY -->

        <section class="gallery-card">

          <div class="gallery">

            <div
              class="gallery-track"
              id="galleryTrack"
            >
              ${imageSlides}
            </div>

            <div
              class="gallery-counter"
              id="galleryCounter"
            >
              1 / ${Math.max(images.length,1)}
            </div>

            <div
              class="gallery-dots"
              id="galleryDots"
            >
              ${dots}
            </div>

          </div>

        </section>


        <!-- PHOTO PULSE -->

        <button
          class="photo-pulse"
          id="photoPulse"
          type="button"
          aria-label="استعراض صور الجهاز"
        >

          <div
            class="photo-pulse-ripple"
            id="photoPulseRipple"
          ></div>

          <div class="photo-pulse-shine"></div>

          <div class="photo-pulse-core">

            ${icons.image}

          </div>

          <div class="photo-pulse-label">

            <span></span>

            ${pulseLabel}

          </div>

        </button>


        <!-- PRODUCT -->

        <section class="product-head">

          <div class="brand">
            ${brand}
          </div>

          <h1 class="product-name">
            ${model}
          </h1>

          <div class="chips">

            ${
              storage !== "غير مذكور"
                ? `
                  <div class="chip">
                    ${storage}
                  </div>
                `
                : ""
            }

            ${
              color !== "غير مذكور"
                ? `
                  <div class="chip">
                    ${color}
                  </div>
                `
                : ""
            }

            <div class="chip sale">
              ${saleType}
            </div>

          </div>

        </section>


        <!-- PRICE -->

        <section class="price-card">

          <div class="price-label">
            السعر
          </div>

          <div class="price">

            ${price}

            <span class="price-currency">
              د.ع
            </span>

          </div>

        </section>


        <!-- DETAILS -->

        <section class="details-intro">

          <strong>
            تفاصيل الجهاز
          </strong>

          <span>
            معلومات الجهاز كما أدخلها البائع
          </span>

        </section>


        <section>

          <h2 class="section-title">
            المواصفات
          </h2>

          <div class="spec-grid">

            <div class="spec-card">

              <div class="spec-icon">
                ${icons.storage}
              </div>

              <div class="spec-text">

                <div class="spec-label">
                  السعة
                </div>

                <div class="spec-value">
                  ${storage}
                </div>

              </div>

            </div>


            <div class="spec-card">

              <div class="spec-icon">
                ${icons.battery}
              </div>

              <div class="spec-text">

                <div class="spec-label">
                  صحة البطارية
                </div>

                <div class="spec-value">
                  ${battery}
                </div>

              </div>

            </div>


            <div class="spec-card">

              <div class="spec-icon">
                ${icons.color}
              </div>

              <div class="spec-text">

                <div class="spec-label">
                  اللون
                </div>

                <div class="spec-value">
                  ${color}
                </div>

              </div>

            </div>


            <div class="spec-card">

              <div class="spec-icon">
                ${icons.camera}
              </div>

              <div class="spec-text">

                <div class="spec-label">
                  الكاميرات
                </div>

                <div class="spec-value">
                  ${cameras}
                </div>

              </div>

            </div>


            <div class="spec-card">

              <div class="spec-icon">
                ${icons.face}
              </div>

              <div class="spec-text">

                <div class="spec-label">
                  Face ID
                </div>

                <div class="spec-value">
                  ${faceId}
                </div>

              </div>

            </div>


            <div class="spec-card">

              <div class="spec-icon">
                ${icons.charging}
              </div>

              <div class="spec-text">

                <div class="spec-label">
                  الشحن
                </div>

                <div class="spec-value">
                  ${charging}
                </div>

              </div>

            </div>

    /* =====================================================
       GALLERY
    ===================================================== */

    function setupGallery(){

      const track =
        document.getElementById("galleryTrack");

      const counter =
        document.getElementById("galleryCounter");

      const dotEls =
        [...document.querySelectorAll(".gallery-dot")];

      if(!track){
        return;
      }


      function updateGallery(){

        const width =
          track.clientWidth || 1;

        const index =
          Math.round(track.scrollLeft / width);

        const safeIndex =
          Math.max(
            0,
            Math.min(
              index,
              Math.max(images.length - 1,0)
            )
          );

        counter.textContent =
          `${safeIndex + 1} / ${Math.max(images.length,1)}`;


        dotEls.forEach((dot,i) => {

          dot.classList.toggle(
            "active",
            i === safeIndex
          );

        });

      }


      let scrollTimer = null;

      track.addEventListener(
        "scroll",
        () => {

          clearTimeout(scrollTimer);

          scrollTimer = setTimeout(
            updateGallery,
            20
          );

        },
        {
          passive:true
        }
      );


      dotEls.forEach((dot,index) => {

        dot.addEventListener(
          "click",
          () => {

            track.scrollTo({
              left:
                index * track.clientWidth,
              behavior:"smooth"
            });

          }
        );

      });


      updateGallery();

    }


    /* =====================================================
       PHOTO PULSE
    ===================================================== */

    function setupPhotoPulse(){

      const pulse =
        document.getElementById("photoPulse");

      const ripple =
        document.getElementById("photoPulseRipple");

      if(!pulse){
        return;
      }


      pulse.addEventListener(
        "pointerdown",
        event => {

          const rect =
            pulse.getBoundingClientRect();

          ripple.style.left =
            `${event.clientX - rect.left}px`;

          ripple.style.top =
            `${event.clientY - rect.top}px`;

          ripple.classList.remove("active");

          void ripple.offsetWidth;

          ripple.classList.add("active");

        }
      );


      pulse.addEventListener(
        "click",
        () => {

          pulse.classList.add("is-opening");

          setTimeout(
            () => {

              openViewer(0);

              pulse.classList.remove(
                "is-opening"
              );

            },
            230
          );

        }
      );

    }


    /* =====================================================
       VIEWER SETUP
    ===================================================== */

    function setupViewer(){

      viewerClose.addEventListener(
        "click",
        closeViewer
      );


      photoViewer.addEventListener(
        "click",
        event => {

          if(
            event.target === photoViewer ||
            event.target ===
              document.getElementById("viewerStage")
          ){
            closeViewer();
          }

        }
      );


      document.addEventListener(
        "keydown",
        event => {

          if(!viewerOpened){
            return;
          }

          if(event.key === "Escape"){
            closeViewer();
          }

          if(event.key === "ArrowLeft"){
            goViewerNext();
          }

          if(event.key === "ArrowRight"){
            goViewerPrevious();
          }

        }
      );


      viewerTrack.addEventListener(
        "scroll",
        updateViewerFromScroll,
        {
          passive:true
        }
      );

    }


    /* =====================================================
       BUILD VIEWER
    ===================================================== */

    function buildViewer(){

      viewerTrack.innerHTML = "";

      viewerThumbs.innerHTML = "";


      if(!images.length){

        viewerTrack.innerHTML = `

          <div
            class="viewer-slide"
            style="color:#fff;font-size:13px;"
          >
            لا توجد صور لهذا الجهاز
          </div>

        `;

        return;
      }


      images.forEach(
        (url,index) => {

          const slide =
            document.createElement("div");

          slide.className =
            "viewer-slide";

          slide.dataset.index =
            String(index);


          const img =
            document.createElement("img");

          img.src = url;

          img.alt =
            device?.model
              ? `${device.model} - ${index + 1}`
              : `صورة الجهاز ${index + 1}`;

          img.draggable = false;

          img.addEventListener(
            "dblclick",
            () => toggleZoom(slide)
          );


          setupPinchAndPan(
            slide,
            img
          );


          slide.appendChild(img);

          viewerTrack.appendChild(slide);


          const thumb =
            document.createElement("button");

          thumb.type = "button";

          thumb.className =
            "viewer-thumb";

          thumb.dataset.index =
            String(index);

          thumb.setAttribute(
            "aria-label",
            `الصورة ${index + 1}`
          );


          thumb.innerHTML = `
            <img
              src="${escapeHtml(url)}"
              alt=""
            />
          `;


          thumb.addEventListener(
            "click",
            event => {

              event.stopPropagation();

              goViewerTo(index);

            }
          );


          viewerThumbs.appendChild(thumb);

        }
      );

    }


    /* =====================================================
       OPEN VIEWER
    ===================================================== */

    function openViewer(index = 0){

      if(!images.length){
        showToast("لا توجد صور لهذا الجهاز");
        return;
      }


      buildViewer();


      viewerOpened = true;

      currentViewerIndex =
        Math.max(
          0,
          Math.min(
            index,
            images.length - 1
          )
        );


      document.body.classList.add(
        "viewer-open"
      );


      photoViewer.classList.add("open");

      photoViewer.setAttribute(
        "aria-hidden",
        "false"
      );


      requestAnimationFrame(() => {

        goViewerTo(
          currentViewerIndex,
          false
        );

      });


      viewerHint.classList.remove(
        "hide"
      );


      clearTimeout(hintTimer);

      hintTimer = setTimeout(
        () => {

          viewerHint.classList.add(
            "hide"
          );

        },
        2600
      );

    }


    /* =====================================================
       CLOSE VIEWER
    ===================================================== */

    function closeViewer(){

      if(!viewerOpened){
        return;
      }


      photoViewer.classList.remove(
        "open"
      );

      photoViewer.setAttribute(
        "aria-hidden",
        "true"
      );


      document.body.classList.remove(
        "viewer-open"
      );


      viewerOpened = false;

      resetViewerTransforms();

    }


    /* =====================================================
       GO TO VIEWER IMAGE
    ===================================================== */

    function goViewerTo(
      index,
      smooth = true
    ){

      if(!images.length){
        return;
      }


      currentViewerIndex =
        Math.max(
          0,
          Math.min(
            index,
            images.length - 1
          )
        );


      const width =
        viewerTrack.clientWidth || window.innerWidth;


      viewerTrack.scrollTo({

        left:
          currentViewerIndex * width,

        behavior:
          smooth
            ? "smooth"
            : "auto"

      });


      updateViewerUI();

      resetViewerTransforms();

    }


    function goViewerNext(){

      if(
        currentViewerIndex <
        images.length - 1
      ){

        goViewerTo(
          currentViewerIndex + 1
        );

      }

    }


    function goViewerPrevious(){

      if(
        currentViewerIndex > 0
      ){

        goViewerTo(
          currentViewerIndex - 1
        );

      }

    }


    /* =====================================================
       VIEWER UI
    ===================================================== */

    function updateViewerUI(){

      viewerCounter.textContent =
        `${currentViewerIndex + 1} / ${Math.max(images.length,1)}`;


      [...viewerThumbs.children]
        .forEach(
          (thumb,index) => {

            thumb.classList.toggle(
              "active",
              index === currentViewerIndex
            );

          }
        );

    }


    function updateViewerFromScroll(){

      if(!viewerOpened){
        return;
      }


      const width =
        viewerTrack.clientWidth || 1;


      const index =
        Math.round(
          viewerTrack.scrollLeft / width
        );


      const safeIndex =
        Math.max(
          0,
          Math.min(
            index,
            images.length - 1
          )
        );


      if(
        safeIndex !== currentViewerIndex
      ){

        currentViewerIndex =
          safeIndex;

        updateViewerUI();

        resetViewerTransforms();

      }

    }


    /* =====================================================
       DOUBLE TAP ZOOM
    ===================================================== */

    function toggleZoom(slide){

      const img =
        slide.querySelector("img");

      if(!img){
        return;
      }


      const zoomed =
        slide.classList.contains(
          "zoomed"
        );


      if(zoomed){

        slide.classList.remove(
          "zoomed"
        );

        img.style.transform =
          "scale(1) translate3d(0,0,0)";

      }else{

        slide.classList.add(
          "zoomed"
        );

        img.style.transform =
          "scale(2) translate3d(0,0,0)";

      }

    }


    /* =====================================================
       PINCH ZOOM + PAN
    ===================================================== */

    function setupPinchAndPan(
      slide,
      img
    ){

      let pointers = new Map();

      let startDistance = 0;

      let startScale = 1;

      let scale = 1;

      let x = 0;

      let y = 0;

      let startX = 0;

      let startY = 0;

      let dragging = false;


      function distance(){

        const values =
          [...pointers.values()];

        if(values.length < 2){
          return 0;
        }

        const a = values[0];

        const b = values[1];

        return Math.hypot(
          b.x - a.x,
          b.y - a.y
        );

      }


      function apply(){

        scale =
          Math.max(
            1,
            Math.min(
              scale,
              4
            )
          );


        img.style.transform =
          `translate3d(${x}px,${y}px,0) scale(${scale})`;

      }


      function reset(){

        scale = 1;

        x = 0;

        y = 0;

        slide.classList.remove(
          "zoomed"
        );

        img.style.transform =
          "translate3d(0,0,0) scale(1)";

      }


      slide.addEventListener(
        "pointerdown",
        event => {

          pointers.set(
            event.pointerId,
            {
              x:event.clientX,
              y:event.clientY
            }
          );


          try{
            slide.setPointerCapture(
              event.pointerId
            );
          }catch{}


          if(pointers.size === 1){

            startX =
              event.clientX;

            startY =
              event.clientY;

            dragging = true;

          }


          if(pointers.size === 2){

            startDistance =
              distance();

            startScale =
              scale;

            dragging = false;

          }

        }
      );


      slide.addEventListener(
        "pointermove",
        event => {

          if(
            !pointers.has(
              event.pointerId
            )
          ){
            return;
          }


          pointers.set(
            event.pointerId,
            {
              x:event.clientX,
              y:event.clientY
            }
          );


          if(pointers.size >= 2){

            const currentDistance =
              distance();


            if(
              startDistance > 0 &&
              currentDistance > 0
            ){

              scale =
                startScale *
                (
                  currentDistance /
                  startDistance
                );

              scale =
                Math.max(
                  1,
                  Math.min(
                    scale,
                    4
                  )
                );

              slide.classList.toggle(
                "zoomed",
                scale > 1.01
              );

              apply();

            }

            return;

          }


          if(
            dragging &&
            scale > 1
          ){

            x +=
              event.clientX -
              startX;

            y +=
              event.clientY -
              startY;

            startX =
              event.clientX;

            startY =
              event.clientY;

            apply();

          }

        }
      );


      slide.addEventListener(
        "pointerup",
        event => {

          pointers.delete(
            event.pointerId
          );


          if(
            pointers.size === 0
          ){

            dragging = false;


            if(scale < 1.05){

              reset();

            }

          }

        }
      );


      slide.addEventListener(
        "pointercancel",
        event => {

          pointers.delete(
            event.pointerId
          );

          if(
            pointers.size === 0
          ){

            dragging = false;

          }

        }
      );

    }


    /* =====================================================
       RESET ZOOM
    ===================================================== */

    function resetViewerTransforms(){

      [...viewerTrack.children]
        .forEach(
          slide => {

            slide.classList.remove(
              "zoomed"
            );


            const img =
              slide.querySelector("img");


            if(img){

              img.style.transform =
                "translate3d(0,0,0) scale(1)";

            }

          }
        );

    }


    /* =====================================================
       ACTIONS
    ===================================================== */

    function setupActions(){

      const favoriteBtn =
        document.getElementById(
          "favoriteBtn"
        );

      const buyBtn =
        document.getElementById(
          "buyBtn"
        );


      if(favoriteBtn){

        favoriteBtn.addEventListener(
          "click",
          async () => {

            try{

              const {
                data:{
                  user
                }
              } =
                await supabase.auth.getUser();


              if(!user){

                sessionStorage.setItem(
                  "pendingAction",
                  "favorite"
                );

                sessionStorage.setItem(
                  "pendingDeviceId",
                  deviceId
                );

                sessionStorage.setItem(
                  "pendingReturn",
                  window.location.href
                );


                window.location.href =
                  "index.html";

                return;

              }


              favoriteBtn.classList.toggle(
                "active"
              );


              const active =
                favoriteBtn.classList.contains(
                  "active"
                );


              showToast(
                active
                  ? "تمت إضافة الجهاز للمفضلة"
                  : "تمت إزالة الجهاز من المفضلة"
              );

            }catch(error){

              console.error(error);

              showToast(
                "حدث خطأ، حاول مرة أخرى"
              );

            }

          }
        );

      }


      if(buyBtn){

        buyBtn.addEventListener(
          "click",
          async () => {

            try{

              const {
                data:{
                  user
                }
              } =
                await supabase.auth.getUser();


              if(!user){

                sessionStorage.setItem(
                  "pendingAction",
                  "buy"
                );

                sessionStorage.setItem(
                  "pendingDeviceId",
                  deviceId
                );

                sessionStorage.setItem(
                  "pendingReturn",
                  window.location.href
                );


                window.location.href =
                  "index.html";

                return;

              }


              showToast(
                "تم تسجيل طلبك، سيتم إكمال العملية عبر المنصة"
              );

            }catch(error){

              console.error(error);

              showToast(
                "حدث خطأ، حاول مرة أخرى"
              );

            }

          }
        );

      }

    }


    /* =====================================================
       SHARE
    ===================================================== */

    async function shareDevice(){

      const shareData = {

        title:
          `${device?.brand || ""} ${device?.model || ""}`.trim(),

        text:
          `شاهد هذا الجهاز على MZAD PHONE`,

        url:
          window.location.href

      };


      try{

        if(
          navigator.share
        ){

          await navigator.share(
            shareData
          );

          return;

        }


        if(
          navigator.clipboard
        ){

          await navigator.clipboard.writeText(
            window.location.href
          );

          showToast(
            "تم نسخ رابط الجهاز"
          );

          return;

        }


        showToast(
          "تعذر مشاركة الرابط"
        );

      }catch(error){

        if(
          error?.name !==
          "AbortError"
        ){

          showToast(
            "تعذر مشاركة الجهاز"
          );

        }

      }

    }


    shareBtn.addEventListener(
      "click",
      shareDevice
    );


    /* =====================================================
       BACK
    ===================================================== */

    backBtn.addEventListener(
      "click",
      () => {

        if(
          window.history.length > 1
        ){

          window.history.back();

        }else{

          window.location.href =
            "home.html";

        }

      }
    );


    /* =====================================================
       LOAD DEVICE
    ===================================================== */

    async function loadDevice(){

      if(!deviceId){

        app.innerHTML = `

          <div class="error-box">

            <strong>
              لم يتم العثور على الجهاز
            </strong>

            <span>
              رابط الجهاز غير صحيح أو ناقص
            </span>

            <button
              class="error-home"
              type="button"
              onclick="location.href='home.html'"
            >
              العودة للرئيسية
            </button>

          </div>

        `;

        return;
      }


      try{

        const {
          data,
          error
        } =
          await supabase
            .from("devices")
            .select("*")
            .eq("id",deviceId)
            .single();


        if(error){
          throw error;
        }


        if(!data){

          throw new Error(
            "Device not found"
          );

        }


        device = data;

        images =
          normalizeImages(
            device.images
          );


        renderDevice();


      }catch(error){

        console.error(
          "DEVICE LOAD ERROR:",
          error
        );


        app.innerHTML = `

          <div class="error-box">

            <strong>
              تعذر تحميل الجهاز
            </strong>

            <span>
              حاول تحديث الصفحة أو الرجوع والمحاولة مرة أخرى
            </span>

            <button
              class="error-home"
              type="button"
              onclick="location.reload()"
            >
              إعادة المحاولة
            </button>

          </div>

        `;

      }

    }


    /* =====================================================
       START
    ===================================================== */

    loadDevice();

  </script>
