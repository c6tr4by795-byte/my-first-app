<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>MZAD PHONE — السوق</title>

  <style>
    :root{
      --bg:#f7f8fa;
      --surface:#fff;
      --ink:#17202a;
      --muted:#667085;
      --line:#e6e9ed;
      --primary:#176b87;
      --primary-dark:#125a73;
      --primary-soft:#e8f3f6;
      --purple:#6246d9;
      --purple-soft:#e5e0ff;
      --safe:env(safe-area-inset-bottom,0px);
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    button,
    input,
    select{
      font:inherit;
    }

    button{
      border:0;
      background:none;
      color:inherit;
      cursor:pointer;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .page{
      width:min(100%,520px);
      margin:auto;
      padding:0 14px calc(98px + var(--safe));
    }

    /* =========================
       HEADER
    ========================= */

    header{
      margin-inline:-14px;
      padding:0 14px 14px;
      background:
        linear-gradient(
          145deg,
          #fff 0%,
          #f5f2ff 48%,
          #e6e1ff 100%
        );
      border-bottom:1px solid var(--line);
      border-radius:0 0 25px 25px;
      box-shadow:0 10px 26px rgba(23,32,42,.06);
    }

    .topbar{
      height:62px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .back{
      width:40px;
      height:40px;
      border-radius:13px;
      background:#fff;
      border:1px solid #dfe4e8;
      display:grid;
      place-items:center;
      color:var(--primary);
      box-shadow:0 6px 15px rgba(23,32,42,.05);
    }

    .titlebox{
      text-align:center;
    }

    .titlebox h1{
      margin:0;
      font-size:20px;
      font-weight:950;
    }

    .titlebox p{
      margin:3px 0 0;
      color:#8b96a3;
      font-size:9px;
      font-weight:800;
    }

    .top-spacer{
      width:40px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-wrap{
      position:relative;
    }

    .search{
      width:100%;
      height:48px;
      border:1.5px solid #9edfe4;
      border-radius:17px;
      background:#fff;
      padding:0 46px 0 44px;
      outline:0;
      color:var(--ink);
      box-shadow:0 8px 22px rgba(23,107,135,.07);
    }

    .search:focus{
      border-color:#63cbd2;
      box-shadow:0 10px 25px rgba(23,107,135,.11);
    }

    .search-icon{
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      width:22px;
      height:22px;
      pointer-events:none;
    }

    .search-clear{
      position:absolute;
      left:9px;
      top:50%;
      transform:translateY(-50%);
      width:32px;
      height:32px;
      border-radius:10px;
      background:#f0f3f5;
      display:none;
      place-items:center;
    }

    .search-wrap.has-value .search-clear{
      display:grid;
    }

    /* =========================
       TOOLBAR
    ========================= */

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-top:14px;
    }

    .count{
      font-size:11px;
      font-weight:900;
      color:#6e7b86;
    }

    .sort{
      height:37px;
      padding:0 11px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      color:#394750;
      font-size:10px;
      font-weight:900;
      outline:0;
    }

    /* =========================
       FILTER CHIPS
    ========================= */

    .chips{
      display:flex;
      gap:8px;
      overflow:auto;
      scrollbar-width:none;
      padding:2px 1px 3px;
      margin-top:13px;
    }

    .chips::-webkit-scrollbar{
      display:none;
    }

    .chip{
      flex:0 0 auto;
      height:34px;
      padding:0 13px;
      border:1px solid #ddd8f8;
      border-radius:12px;
      background:#fff;
      color:#5d6670;
      font-size:10px;
      font-weight:900;
    }

    .chip.active{
      background:var(--purple-soft);
      border-color:#b9adf2;
      color:#5141b1;
    }

    /* =========================
       SECTION
    ========================= */

    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin:19px 2px 10px;
    }

    .section-head h2{
      margin:0;
      font-size:18px;
      font-weight:950;
    }

    .empty{
      padding:35px 18px;
      text-align:center;
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
    }

    /* =========================
       DEVICE GRID
    ========================= */

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:11px;
    }

    .card{
      position:relative;
      overflow:hidden;
      background:#fff;
      border:1px solid #ddd8f8;
      border-radius:19px;
      box-shadow:0 9px 22px rgba(98,70,217,.08);
      cursor:pointer;
    }

    .photo{
      height:145px;
      background:#f1f2f4;
      position:relative;
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    /*
      الصورة تظهر كاملة بدون قص أو تمديد
    */

    .photo img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .no-photo{
      font-size:10px;
      color:#9aa3ad;
      font-weight:900;
    }

    .fav{
      position:absolute;
      top:9px;
      left:9px;
      width:33px;
      height:33px;
      border-radius:11px;
      background:rgba(255,255,255,.93);
      display:grid;
      place-items:center;
      color:#65717c;
      box-shadow:0 5px 14px rgba(0,0,0,.08);
      z-index:2;
    }

    .fav.active{
      color:#6246d9;
      background:#f0edff;
    }

    .sale-badge{
      position:absolute;
      top:9px;
      right:9px;
      padding:6px 8px;
      border-radius:9px;
      background:rgba(255,255,255,.93);
      color:#5141b1;
      font-size:8px;
      font-weight:950;
      box-shadow:0 5px 14px rgba(0,0,0,.06);
    }

    .body{
      padding:10px 10px 11px;
      background:
        linear-gradient(
          180deg,
          #f7f4ff 0%,
          #ece7ff 100%
        );
      min-height:132px;
    }

    .name{
      margin:0;
      color:#29215f;
      font-size:13px;
      font-weight:950;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .specs{
      display:flex;
      flex-wrap:wrap;
      gap:4px;
      margin-top:6px;
    }

    .spec{
      padding:4px 6px;
      border-radius:7px;
      background:#fff8;
      border:1px solid #ddd8f0;
      color:#59616b;
      font-size:8px;
      font-weight:900;
    }

    .location{
      margin-top:7px;
      color:#69717b;
      font-size:8px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .published-time{
      display:flex;
      align-items:center;
      margin-top:3px;
      color:#9aa1aa;
      font-size:8px;
      line-height:1.3;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .bottom-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:7px;
      margin-top:8px;
    }

    .price{
      font-size:12px;
      font-weight:950;
      color:var(--ink);
    }

    .type{
      font-size:8px;
      font-weight:950;
      color:#5141b1;
      background:#e6e1ff;
      padding:5px 7px;
      border-radius:8px;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-wrap{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      padding:
        7px
        10px
        calc(7px + var(--safe));
      z-index:100;
      pointer-events:none;
      transition:transform .18s ease;
    }

    .bottom-nav{
      position:relative;
      width:min(100%,520px);
      margin:auto;
      min-height:64px;
      padding:5px;
      border-radius:20px;
      background:rgba(255,255,255,.97);
      border:1px solid #e7ecef;
      box-shadow:0 10px 28px rgba(23,32,42,.10);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      display:block;
      pointer-events:auto;
    }

    .bottom-inner{
      width:100%;
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:3px;
      align-items:center;
    }

    .nav-item{
      min-height:52px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;
      border-radius:15px;
      color:#7f8c94;
    }

    .nav-item.active{
      color:var(--primary-dark);
      background:var(--primary-soft);
    }

    .nav-label{
      font-size:9px;
      font-weight:900;
    }

    .nav-icon{
      width:21px;
      height:21px;
    }

    body.keyboard-open .bottom-wrap{
      transform:translateY(120%);
      pointer-events:none;
    }

    /* =========================
       TOAST
    ========================= */

    .toast{
      position:fixed;
      left:50%;
      bottom:92px;
      transform:translateX(-50%) translateY(14px);
      opacity:0;
      pointer-events:none;
      z-index:200;
      max-width:calc(100% - 40px);
      padding:10px 14px;
      border-radius:13px;
      background:#1e2c30;
      color:#fff;
      font-size:11px;
      font-weight:800;
      text-align:center;
      transition:.22s ease;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media(min-width:700px){

      .page{
        padding-inline:18px;
      }

      .bottom-wrap{
        padding-inline:18px;
      }

    }
  </style>
</head>

<script type="module">

  import {
    supabase
  } from "./js/supabase.js?v=market-final-2";


  /* =========================
     ELEMENTS
  ========================== */

  const searchInput =
    document.getElementById("searchInput");

  const searchWrap =
    document.getElementById("searchWrap");

  const searchClear =
    document.getElementById("searchClear");

  const deviceGrid =
    document.getElementById("deviceGrid");

  const emptyState =
    document.getElementById("emptyState");

  const resultCount =
    document.getElementById("resultCount");

  const sortSelect =
    document.getElementById("sortSelect");

  const toast =
    document.getElementById("toast");


  let devices = [];

  let selectedBrand = "all";

  let toastTimer;


  /* =========================
     ARABIC SEARCH ALIASES
  ========================== */

  const SEARCH_ALIASES = [

    ["ايفون","iphone"],
    ["آيفون","iphone"],
    ["اىفون","iphone"],
    ["اي فون","iphone"],

    ["ابل","apple"],

    ["سامسونج","samsung"],
    ["سامسنغ","samsung"],

    ["شاومي","xiaomi"],
    ["شياومي","xiaomi"],

    ["هواوي","huawei"],

    ["اوبو","oppo"],
    ["أوبو","oppo"],

    ["هونر","honor"],

    ["ون بلس","oneplus"],
    ["ونبلس","oneplus"],

    ["ريلمي","realme"],

    ["موتورولا","motorola"],

    ["سوني","sony"],

    ["نوكيا","nokia"],

    ["تكنو","tecno"],

    ["انفنكس","infinix"],
    ["إنفنكس","infinix"],

    ["جوجل","google"],

    ["بيكسل","pixel"],

    ["ريدمي","redmi"],

    ["بوكو","poco"],

    ["برو","pro"],
    ["ماكس","max"],

    ["بلس","plus"],
    ["بلاس","plus"],

    ["الترا","ultra"],
    ["ألترا","ultra"],

    ["ميني","mini"],

    ["فولد","fold"],

    ["فليب","flip"],

    ["نوت","note"],

    ["اس","s"],
    ["إس","s"]

  ];


  /* =========================
     NORMALIZE ARABIC
  ========================== */

  function normalizeSearchText(value){

    return String(value ?? "")
      .toLowerCase()
      .trim()
      .replace(/[أإآ]/g,"ا")
      .replace(/ى/g,"ي")
      .replace(/ة/g,"ه")
      .replace(/ؤ/g,"و")
      .replace(/ئ/g,"ي")
      .replace(/ـ/g,"")
      .replace(/[\u064B-\u065F]/g,"")
      .replace(/\s+/g," ");

  }


  /* =========================
     EXPAND SEARCH
  ========================== */

  function expandSearchQuery(value){

    let text =
      normalizeSearchText(value);

    for(
      const [arabic,english]
      of SEARCH_ALIASES
    ){

      text =
        text.replaceAll(
          normalizeSearchText(arabic),
          english
        );

    }

    return text;

  }


  /* =========================
     SEARCH TOKENS
  ========================== */

  function getSearchTokens(value){

    return expandSearchQuery(value)
      .split(/\s+/)
      .map(token => token.trim())
      .filter(Boolean);

  }


  /* =========================
     HTML ESCAPE
  ========================== */

  function escapeHtml(value){

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        m => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m])
      );

  }


  function escapeAttribute(value){

    return escapeHtml(value);

  }


  /* =========================
     PRICE
  ========================== */

  function formatPrice(value){

    const n = Number(value);

    return Number.isFinite(n)
      ? n.toLocaleString("en-US") + " د.ع"
      : "—";

  }


  /* =========================
     PUBLISHED TIME
  ========================== */

  function formatPublishedTime(dateValue){

    const time =
      new Date(dateValue).getTime();

    if(!Number.isFinite(time)){
      return "";
    }

    const diff =
      Math.max(
        0,
        Date.now() - time
      );

    const min =
      Math.floor(diff / 60000);


    if(min < 1){
      return "نُشر الآن";
    }


    if(min < 60){

      return `نُشر منذ ${min} ${
        min === 1
          ? "دقيقة"
          : "دقائق"
      }`;

    }


    const h =
      Math.floor(min / 60);


    if(h < 24){

      return `نُشر منذ ${h} ${
        h === 1
          ? "ساعة"
          : "ساعات"
      }`;

    }


    const d =
      Math.floor(h / 24);


    if(d < 7){

      return `نُشر منذ ${d} ${
        d === 1
          ? "يوم"
          : "أيام"
      }`;

    }


    return new Date(
      dateValue
    ).toLocaleDateString(
      "ar-IQ",
      {
        day:"numeric",
        month:"short"
      }
    );

  }


  /* =========================
     TOAST
  ========================== */

  function showToast(message){

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
      setTimeout(
        () =>
          toast.classList.remove("show"),
        2200
      );

  }


  /* =========================
     BRAND
  ========================== */

  function brandKey(value){

    const b =
      normalizeSearchText(value);

    const map = {

      apple:"apple",
      iphone:"apple",

      samsung:"samsung",

      xiaomi:"xiaomi",

      huawei:"huawei",

      oppo:"oppo",

      honor:"honor",

      tecno:"tecno",

      google:"google",

      oneplus:"oneplus",

      realme:"realme",

      motorola:"motorola",

      sony:"sony",

      nokia:"nokia",

      infinix:"infinix"

    };

    return map[b] || b;

  }


  /* =========================
     NORMALIZE DEVICE
  ========================== */

  function normalizeDevice(device){

    const normalizedBrand =
      brandKey(device.brand);


    const searchText = [

      device.brand,

      normalizedBrand,

      device.model,

      device.storage,

      device.color,

      device.battery_health,

      device.condition,

      device.body_condition,

      device.screen_condition,

      device.location,

      device.sale_type,

      device.notes

    ]
    .filter(
      v => String(v ?? "").trim()
    )
    .join(" ");


    return {

      ...device,

      _brandKey:
        normalizedBrand,

      _searchText:
        normalizeSearchText(searchText)
        + " "
        + expandSearchQuery(searchText)

    };

  }


  /* =========================
     IMAGE
  ========================== */

  function getFirstImageValue(value){

    if(Array.isArray(value)){

      return value.length
        ? value[0]
        : "";

    }


    if(typeof value === "string"){

      const text =
        value.trim();


      if(!text){
        return "";
      }


      if(
        (text.startsWith("[") && text.endsWith("]"))
        ||
        (text.startsWith("{") && text.endsWith("}"))
      ){

        try{

          const parsed =
            JSON.parse(text);


          if(Array.isArray(parsed)){

            return parsed.length
              ? parsed[0]
              : "";

          }


          if(
            parsed
            &&
            typeof parsed === "object"
          ){

            return (
              parsed.url
              ||
              parsed.path
              ||
              parsed.publicUrl
              ||
              ""
            );

          }

        }catch{}

      }


      return text;

    }


    if(
      value
      &&
      typeof value === "object"
    ){

      return (
        value.url
        ||
        value.path
        ||
        value.publicUrl
        ||
        ""
      );

    }


    return "";

  }


  function imageUrl(device){

    const first =
      getFirstImageValue(
        device.images
      );


    if(
      typeof first !== "string"
      ||
      !first.trim()
    ){

      return "";

    }


    let path =
      first.trim();


    /*
      إذا الصورة رابط كامل
    */

    if(
      /^https?:\/\//i.test(path)
    ){

      return path;

    }


    /*
      تنظيف بداية المسار
    */

    path =
      path.replace(/^\/+/, "");


    /*
      منع تكرار اسم الـBucket
    */

    path =
      path.replace(
        /^device-images\//i,
        ""
      );


    /*
      تحويل مسار Storage إلى Public URL
    */

    try{

      const {
        data
      } =
        supabase
          .storage
          .from("device-images")
          .getPublicUrl(path);


      return (
        data?.publicUrl
        ||
        ""
      );

    }catch(error){

      console.error(
        "IMAGE URL ERROR:",
        error
      );

      return "";

    }

  }


  /* =========================
     FAVORITES
  ========================== */

  function isFavorite(id){

    try{

      return JSON.parse(
        localStorage.getItem(
          "mzad_favorites"
        ) || "[]"
      )
      .map(String)
      .includes(String(id));

    }catch{

      return false;

    }

  }


  function toggleFavorite(id,event){

    event.stopPropagation();

    let list = [];


    try{

      list =
        JSON.parse(
          localStorage.getItem(
            "mzad_favorites"
          ) || "[]"
        );

    }catch{}


    const key =
      String(id);


    const i =
      list
        .map(String)
        .indexOf(key);


    if(i >= 0){

      list.splice(i,1);

      showToast(
        "تمت الإزالة من المفضلة"
      );

    }else{

      list.push(id);

      showToast(
        "تمت الإضافة إلى المفضلة"
      );

    }


    localStorage.setItem(
      "mzad_favorites",
      JSON.stringify(list)
    );


    render();

  }


  /* =========================
     DEVICE CARD
  ========================== */

  function card(device){

    const img =
      imageUrl(device);

    const fav =
      isFavorite(device.id);


    const specs = [

      device.storage &&
        String(device.storage),

      device.color &&
        String(device.color)

    ].filter(Boolean);


    return `

      <article
        class="card"
        data-id="${escapeAttribute(device.id)}"
      >

        <div class="photo">

          ${
            img

              ? `

                <img
                  src="${escapeAttribute(img)}"
                  alt="${escapeAttribute(device.brand || "جهاز")} ${escapeAttribute(device.model || "")}"
                  loading="lazy"
                  onerror="this.style.display='none';this.parentElement.querySelector('.image-fallback').style.display='block';"
                >

                <span
                  class="no-photo image-fallback"
                  style="display:none"
                >
                  لا توجد صورة
                </span>

              `

              : `

                <span class="no-photo">
                  لا توجد صورة
                </span>

              `
          }


          <button
            class="fav ${fav ? "active" : ""}"
            type="button"
            data-fav="${escapeAttribute(device.id)}"
            aria-label="المفضلة"
          >

            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="${fav ? "currentColor" : "none"}"
              stroke="currentColor"
              stroke-width="1.8"
            >

              <path
                d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"
              />

            </svg>

          </button>


          <span class="sale-badge">

            ${
              device.sale_type === "auction"
              ||
              device.sale_type === "مزاد"

                ? "مزاد"

                : "بيع مباشر"

            }

          </span>

        </div>


        <div class="body">

          <h3 class="name">

            ${
              escapeHtml(
                [
                  device.brand,
                  device.model
                ]
                .filter(Boolean)
                .join(" ")
                ||
                "جهاز"
              )
            }

          </h3>


          ${
            specs.length

              ? `

                <div class="specs">

                  ${
                    specs
                      .map(
                        s =>
                          `<span class="spec">
                            ${escapeHtml(s)}
                          </span>`
                      )
                      .join("")
                  }

                </div>

              `

              : ""
          }


          ${
            device.location

              ? `

                <div class="location">

                  ${escapeHtml(
                    device.location
                  )}

                </div>

              `

              : ""
          }


          ${
            device.created_at

              ? `

                <div
                  class="published-time"
                  data-created-at="${escapeAttribute(device.created_at)}"
                >

                  ${escapeHtml(
                    formatPublishedTime(
                      device.created_at
                    )
                  )}

                </div>

              `

              : ""
          }


          <div class="bottom-row">

            <span class="price">

              ${formatPrice(device.price)}

            </span>


            <span class="type">

              ${
                device.sale_type === "auction"
                ||
                device.sale_type === "مزاد"

                  ? "مزاد"

                  : "مباشر"
              }

            </span>

          </div>

        </div>

      </article>

    `;

  }


  /* =========================
     FILTER
  ========================== */

  function getFilteredDevices(){

    const tokens =
      getSearchTokens(
        searchInput.value
      );


    return devices

      .filter(device => {

        const brandMatch =
          selectedBrand === "all"
          ||
          device._brandKey === selectedBrand;


        const searchMatch =
          !tokens.length
          ||
          tokens.every(
            token =>
              device._searchText
                .includes(token)
          );


        return (
          brandMatch
          &&
          searchMatch
        );

      })


      .sort((a,b) => {

        if(
          sortSelect.value ===
          "price-low"
        ){

          return (
            Number(a.price || 0)
            -
            Number(b.price || 0)
          );

        }


        if(
          sortSelect.value ===
          "price-high"
        ){

          return (
            Number(b.price || 0)
            -
            Number(a.price || 0)
          );

        }


        return (
          new Date(
            b.created_at || 0
          )
          -
          new Date(
            a.created_at || 0
          )
        );

      });

  }


  /* =========================
     RENDER
  ========================== */

  function render(){

    const list =
      getFilteredDevices();


    resultCount.textContent =
      `${list.length} ${
        list.length === 1
          ? "جهاز"
          : "أجهزة"
      }`;


    emptyState.style.display =
      list.length
        ? "none"
        : "block";


    deviceGrid.innerHTML =
      list
        .map(card)
        .join("");


    deviceGrid
      .querySelectorAll(
        "[data-fav]"
      )
      .forEach(btn => {

        btn.addEventListener(
          "click",
          e =>
            toggleFavorite(
              btn.dataset.fav,
              e
            )
        );

      });


    deviceGrid
      .querySelectorAll(".card")
      .forEach(c => {

        c.addEventListener(
          "click",
          () => {

            location.href =
              `device.html?id=${encodeURIComponent(
                c.dataset.id
              )}`;

          }
        );

      });

  }


  /* =========================
     LOAD DEVICES
  ========================== */

  async function loadDevices(){

    resultCount.textContent =
      "جاري تحميل الأجهزة...";


    const {
      data,
      error
    } = await supabase

      .from("devices")

      .select("*")

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      console.error(error);

      resultCount.textContent =
        "تعذر تحميل الأجهزة";

      emptyState.style.display =
        "block";

      return;

    }


    devices =
      (data || [])
        .map(normalizeDevice);


    render();

  }


  /* =========================
     INCOMING SEARCH
  ========================== */

  function readIncomingSearch(){

    const params =
      new URLSearchParams(
        location.search
      );


    const q =
      params.get("search")
      ||
      sessionStorage.getItem(
        "mzad_search_query"
      )
      ||
      "";


    if(q){

      searchInput.value =
        q;

      sessionStorage.removeItem(
        "mzad_search_query"
      );

      searchWrap.classList.add(
        "has-value"
      );

    }


    const brand =
      params.get("brand");


    if(
      brand &&
      brand !== "all"
    ){

      selectedBrand =
        brandKey(brand);


      document
        .querySelectorAll(".chip")
        .forEach(c => {

          c.classList.toggle(
            "active",
            c.dataset.brand ===
            brand
          );

        });

    }

  }


  /* =========================
     BACK BUTTON
  ========================== */

  document
    .getElementById("backBtn")
    .addEventListener(
      "click",
      () => {

        if(
          history.length > 1
        ){

          history.back();

        }else{

          location.href =
            "home.html";

        }

      }
    );


  /* =========================
     NAVIGATION
  ========================== */

  document
    .querySelectorAll(".nav-item")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          location.href =
            button.dataset.go;

        }
      );

    });


  /* =========================
     BRAND FILTER
  ========================== */

  document
    .querySelectorAll(".chip")
    .forEach(chip => {

      chip.addEventListener(
        "click",
        () => {

          selectedBrand =
            chip.dataset.brand;


          document
            .querySelectorAll(".chip")
            .forEach(c => {

              c.classList.toggle(
                "active",
                c === chip
              );

            });


          render();

        }
      );

    });


  /* =========================
     SEARCH INPUT
  ========================== */

  searchInput.addEventListener(
    "input",
    () => {

      searchWrap.classList.toggle(
        "has-value",
        !!searchInput.value.trim()
      );


      render();

    }
  );


  searchInput.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        render();

      }

    }
  );


  /* =========================
     CLEAR SEARCH
  ========================== */

  searchClear.addEventListener(
    "click",
    () => {

      searchInput.value =
        "";

      searchWrap.classList.remove(
        "has-value"
      );

      render();

      searchInput.focus();

    }
  );


  /* =========================
     SORT
  ========================== */

  sortSelect.addEventListener(
    "change",
    render
  );


  /* =========================
     KEYBOARD MODE
  ========================== */

  searchInput.addEventListener(
    "focus",
    () => {

      document.body.classList.add(
        "keyboard-open"
      );

    }
  );


  searchInput.addEventListener(
    "blur",
    () => {

      setTimeout(
        () => {

          document.body.classList.remove(
            "keyboard-open"
          );

        },
        150
      );

    }
  );


  /* =========================
     LIVE PUBLICATION TIME
  ========================== */

  setInterval(
    () => {

      document
        .querySelectorAll(
          ".published-time[data-created-at]"
        )
        .forEach(el => {

          el.textContent =
            formatPublishedTime(
              el.dataset.createdAt
            );

        });

    },
    60000
  );


  /* =========================
     START
  ========================== */

  readIncomingSearch();

  loadDevices();

</script>

</body>
</html>
