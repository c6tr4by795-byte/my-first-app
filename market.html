<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>MZAD PHONE - السوق</title>

  <style>
    :root{
      --bg:#f7f8fa;
      --surface:#ffffff;
      --surface-2:#eef3f7;

      --ink:#17202a;
      --muted:#667085;
      --line:#e6e9ed;

      --primary:#176b87;
      --primary-dark:#125a73;
      --primary-soft:#e8f3f6;

      --purple:#6246d9;
      --purple-dark:#5147b8;
      --purple-soft:#e5e0ff;

      --pale:#e6e3f6;
      --pale-dark:#d8d3ee;
      --pale-text:#51477d;

      --shadow:0 10px 28px rgba(24,32,42,.07);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    }

    body{
      overflow-x:hidden;
      padding-bottom:95px;
    }

    button,
    input{
      font:inherit;
    }

    button{
      border:0;
      outline:0;
    }

    .page{
      width:100%;
      max-width:760px;
      margin:0 auto;
    }

    /* =========================
       HEADER
    ========================== */

    .top-header{
      position:relative;
      overflow:hidden;
      padding:
        calc(10px + env(safe-area-inset-top))
        18px
        11px;

      background:
        linear-gradient(
          145deg,
          #fff 0%,
          #f5f2ff 45%,
          #e6e1ff 100%
        );

      border-radius:0 0 22px 22px;
      border-bottom:1px solid var(--line);

      box-shadow:
        0 10px 26px rgba(23,32,42,.06);
    }

    .top-header::before{
      content:"";
      position:absolute;
      width:210px;
      height:210px;
      top:-120px;
      left:-80px;

      background:
        radial-gradient(
          circle,
          rgba(23,107,135,.12) 0%,
          rgba(23,107,135,0) 70%
        );

      pointer-events:none;
      animation:headerFloat 7s ease-in-out infinite alternate;
    }

    .top-header::after{
      content:"";
      position:absolute;
      width:240px;
      height:240px;
      right:-100px;
      bottom:-170px;

      background:
        radial-gradient(
          circle,
          rgba(98,70,217,.13) 0%,
          rgba(98,70,217,0) 70%
        );

      pointer-events:none;
      animation:headerFloat2 8s ease-in-out infinite alternate;
    }

    @keyframes headerFloat{
      from{
        transform:translate3d(0,0,0);
      }
      to{
        transform:translate3d(25px,10px,0);
      }
    }

    @keyframes headerFloat2{
      from{
        transform:translate3d(0,0,0);
      }
      to{
        transform:translate3d(-20px,-8px,0);
      }
    }

    .header-inner{
      position:relative;
      z-index:2;
    }

    .header-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .back-btn{
      width:43px;
      height:43px;
      flex:0 0 43px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:14px;

      background:rgba(255,255,255,.72);
      border:1px solid rgba(255,255,255,.8);

      box-shadow:
        0 7px 18px rgba(24,32,42,.07);

      color:var(--ink);
      cursor:pointer;
    }

    .back-btn svg{
      width:21px;
      height:21px;
    }

    .header-title-wrap{
      flex:1;
      text-align:right;
    }

    .header-title{
      margin:0;
      font-size:21px;
      line-height:1.2;
      font-weight:950;
      letter-spacing:-.5px;
    }

    .header-subtitle{
      margin:3px 0 0;
      color:var(--muted);
      font-size:11px;
      font-weight:700;
      line-height:1.5;
    }

    /* =========================
       SEARCH
    ========================== */

    .search-wrap{
      margin-top:10px;
    }

    .search-box{
      width:100%;
      height:48px;

      display:flex;
      align-items:center;
      gap:10px;

      padding:0 15px;

      background:#fff;
      border:1px solid rgba(230,233,237,.9);
      border-radius:17px;

      box-shadow:
        0 9px 25px rgba(24,32,42,.06);
    }

    .search-box svg{
      width:20px;
      height:20px;
      flex:0 0 20px;
      color:#7a8490;
    }

    .search-box input{
      width:100%;
      height:100%;

      border:0;
      outline:0;
      background:transparent;

      color:var(--ink);
      font-size:14px;
      font-weight:700;
      text-align:right;
    }

    .search-box input::placeholder{
      color:#98a0aa;
    }

    /* =========================
       CONTENT
    ========================== */

    .content{
      padding:10px 14px 18px;
    }

    .section-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;

      margin:0 3px 9px;
    }

    .section-title-wrap{
      min-width:0;
    }

    .section-title{
      margin:0;
      font-size:19px;
      line-height:1.3;
      font-weight:950;
      letter-spacing:-.25px;
    }

    .section-subtitle{
      margin:4px 0 0;
      color:var(--muted);
      font-size:11px;
      font-weight:700;
      line-height:1.45;
    }

    .count-label{
      flex:0 0 auto;

      padding:7px 10px;

      background:var(--purple-soft);
      color:var(--pale-text);

      border-radius:10px;

      font-size:10px;
      font-weight:900;
    }

    /* =========================
       FILTERS
    ========================== */

    .filters{
      display:flex;
      gap:8px;

      overflow-x:auto;
      scrollbar-width:none;

      padding:1px 2px 5px;
      margin-bottom:9px;
    }

    .filters::-webkit-scrollbar{
      display:none;
    }

    .filter{
      height:36px;
      flex:0 0 auto;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:0 13px;

      border-radius:11px;

      background:#fff;
      color:#59636e;

      border:1px solid #e4e7eb;

      box-shadow:
        0 4px 12px rgba(24,32,42,.035);

      font-size:12px;
      font-weight:850;

      cursor:pointer;

      transition:
        .2s ease;
    }

    .filter.active{
      background:
        linear-gradient(
          145deg,
          #6246d9 0%,
          #5147b8 100%
        );

      color:#fff;

      border-color:#6246d9;

      box-shadow:
        0 7px 17px rgba(98,70,217,.25);
    }

    /* =========================
       SORT
    ========================== */

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;

      margin:0 2px 9px;
    }

    .results-label{
      color:#77808a;
      font-size:11px;
      font-weight:750;
    }

    .sort-btn{
      height:35px;

      display:flex;
      align-items:center;
      gap:7px;

      padding:0 11px;

      border-radius:11px;

      background:#fff;
      color:#5e6873;

      border:1px solid #e4e7eb;

      font-size:11px;
      font-weight:850;

      box-shadow:
        0 4px 12px rgba(24,32,42,.035);

      cursor:pointer;
    }

    .sort-btn svg{
      width:15px;
      height:15px;
    }

    /* =========================
       GRID
    ========================== */

    /* slightly larger, balanced product cards */
    .devices-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
    }

    /* =========================
       DEVICE CARD
    ========================== */

    .device-card{
      position:relative;
      content-visibility:auto;
      contain-intrinsic-size:350px;
      overflow:hidden;
      min-width:0;

      background:#fff;

      border:1px solid #E3E8EC;
      border-radius:19px;

      box-shadow:
        0 8px 22px rgba(23,32,42,.055);

      cursor:pointer;

      animation:
        cardIn .38s ease both;

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .device-card::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:160px;
      height:3px;
      background:#32B8C4;
      opacity:.9;
      z-index:2;
    }

    .device-card.brand-apple::after,
    .device-card.brand-samsung::after,
    .device-card.brand-xiaomi::after,
    .device-card.brand-huawei::after,
    .device-card.brand-google::after{
      background:#32B8C4;
    }

    .device-card:active{
      transform:scale(.985);
    }

    @keyframes cardIn{
      from{
        opacity:0;
        transform:translateY(8px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .device-photo-wrap{
      position:relative;
      width:100%;
      height:160px;
      overflow:hidden;
      background:#f0f1f3;
    }

    .device-photo{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      background:#f0f1f3;
      transition:transform .35s ease,filter .25s ease;
      filter:saturate(.82);
    }

    .device-photo-wrap::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(
        180deg,
        rgba(255,255,255,.04),
        rgba(255,255,255,0)
      );
      z-index:1;
    }

    .device-photo-wrap .sale-type,
    .device-photo-wrap .favorite{
      z-index:4;
    }

    .device-card:active .device-photo{
      transform:scale(1.02);
    }

    .photo-placeholder{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;

      background:
        linear-gradient(
          145deg,
          #F1F3F4,
          #E7EBEE
        );

      color:#8A939D;
    }

    .photo-placeholder svg{
      width:35px;
      height:35px;
      opacity:.55;
    }

    .favorite{
      position:absolute;
      top:9px;
      left:9px;

      width:34px;
      height:34px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:11px;

      background:rgba(255,255,255,.92);
      color:#6E7781;

      border:1px solid rgba(255,255,255,.95);

      box-shadow:
        0 6px 15px rgba(0,0,0,.09);

      cursor:pointer;
      z-index:4;
    }

    .favorite svg{
      width:18px;
      height:18px;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
    }

    .favorite.active{
      color:#fff;

      background:
        linear-gradient(
          145deg,
          #176B87,
          #32B8C4
        );

      box-shadow:
        0 7px 17px rgba(23,107,135,.25);

      border:1px solid rgba(23,107,135,.35);
    }

    .favorite.active svg{
      fill:#fff;
      stroke:#fff;
    }

    .sale-type{
      position:absolute;
      top:9px;
      right:9px;

      max-width:95px;
      padding:6px 8px;
      border-radius:9px;

      background:rgba(255,255,255,.94);
      color:#176B87;

      border:1px solid rgba(23,107,135,.10);

      box-shadow:
        0 5px 12px rgba(23,107,135,.08);

      font-size:8px;
      line-height:1;
      font-weight:950;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;

      z-index:3;
    }

    /* =========================
       DEVICE INFO
    ========================== */

    .device-info{
      padding:10px 10px 9px;

      background:
        linear-gradient(
          180deg,
          #FFFFFF 0%,
          #FBFCFD 100%
        );
    }

    .device-name{
      min-width:0;

      margin:0;

      color:#17202A;

      font-size:14px;
      line-height:1.35;
      font-weight:950;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .device-location{
      display:flex;
      align-items:center;
      gap:4px;

      margin-top:2px;

      color:#7b8490;

      font-size:9px;
      font-weight:750;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .device-location svg{
      width:11px;
      height:11px;
      flex:0 0 11px;
    }

    /* =========================
       REAL PUBLICATION TIME
    ========================== */

    .published-time{
      display:flex;
      align-items:center;

      margin-top:1px;

      color:#9aa1aa;

      font-size:8px;
      line-height:1.3;
      font-weight:700;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .details-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:6px;

      margin-top:8px;
    }

    .details-grid.no-battery{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .details-grid.has-battery{
      grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .details-grid.has-battery .detail-item:first-child strong{
      font-size:10.5px;
    }

    .detail-item{
      min-width:0;
      padding:8px 6px 7px;

      background:#F8FAFB;

      border-radius:11px;

      border:1px solid #E4EAED;

      box-shadow:
        0 3px 9px rgba(23,32,42,.025);

      position:relative;
      overflow:hidden;
    }

    .detail-item::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:3px;
      background:#32B8C4;
      opacity:.9;
    }

    .brand-apple .detail-item::before,
    .brand-samsung .detail-item::before,
    .brand-xiaomi .detail-item::before,
    .brand-huawei .detail-item::before,
    .brand-google .detail-item::before{
      background:#32B8C4;
    }

    .detail-item span{
      display:block;

      color:#7C858D;

      font-size:8px;
      line-height:1.2;
      font-weight:800;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .detail-item strong{
      display:block;

      min-width:0;

      margin-top:3px;

      color:#17202A;

      font-size:11px;
      line-height:1.25;
      font-weight:950;

      white-space:nowrap;
      overflow:visible;
      text-overflow:clip;
    }

    .price-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;

      margin-top:7px;
      padding-top:6px;

      border-top:1px solid #E6EBEE;
    }

    .price-label{
      color:#858d96;
      font-size:8px;
      font-weight:800;
    }

    .price{
      min-width:0;

      color:#176B87;

      font-size:14px;
      line-height:1.2;
      font-weight:950;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* =========================
       STATES
    ========================== */

    .state{
      width:100%;

      padding:40px 20px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      text-align:center;

      background:#fff;

      border:1px solid var(--line);
      border-radius:20px;

      box-shadow:
        0 8px 22px rgba(24,32,42,.045);
    }

    .state-icon{
      width:56px;
      height:56px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:17px;

      background:var(--purple-soft);
      color:var(--pale-text);

      margin-bottom:13px;
    }

    .state-icon svg{
      width:27px;
      height:27px;
    }

    .state-title{
      margin:0;

      font-size:15px;
      font-weight:950;
    }

    .state-text{
      margin:6px 0 0;

      color:var(--muted);

      font-size:11px;
      line-height:1.6;
      font-weight:700;
    }

    .retry-btn{
      margin-top:14px;

      height:40px;

      padding:0 17px;

      border-radius:12px;

      background:
        linear-gradient(
          145deg,
          #176b87,
          #125a73
        );

      color:#fff;

      font-size:11px;
      font-weight:900;

      cursor:pointer;
    }

    .loading{
      width:100%;

      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }

    .skeleton{
      height:300px;

      border-radius:19px;

      background:
        linear-gradient(
          90deg,
          #eef0f2 25%,
          #f7f8f9 37%,
          #eef0f2 63%
        );

      background-size:400% 100%;

      animation:loading 1.25s ease infinite;
    }

    @keyframes loading{
      0%{
        background-position:100% 0;
      }
      100%{
        background-position:-100% 0;
      }
    }

    /* =========================
       BOTTOM NAV
    ========================== */

    .bottom-wrap{
      position:fixed;
      left:0;
      right:0;
      bottom:0;

      padding:
        8px 12px
        calc(8px + env(safe-area-inset-bottom));

      z-index:50;
      pointer-events:none;
    }

    .bottom-nav{
      width:min(100%,520px);
      margin:0 auto;

      padding:6px;

      border-radius:22px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.97),
          rgba(232,243,246,.97)
        );

      border:1px solid rgba(23,107,135,.12);

      box-shadow:
        0 16px 36px rgba(23,107,135,.16);

      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);

      display:block;

      pointer-events:auto;
    }

    .nav-inner{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:4px;
      width:100%;
      align-items:center;
    }

    .nav-item{
      min-width:0;
      min-height:55px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;

      border-radius:16px;

      color:#7b8794;
      background:transparent;

      text-decoration:none;

      transition:.2s ease;
    }

    .nav-item:active{
      transform:scale(.95);
    }

    .nav-item svg{
      width:22px;
      height:22px;
    }

    .nav-item span{
      font-size:9px;
      font-weight:900;
    }

    .nav-item.active{
      color:var(--primary-dark);

      background:
        linear-gradient(
          145deg,
          #e8f3f6,
          #dceef2
        );
    }

    /* =========================
       SMALL PHONES
    ========================== */

    @media(max-width:360px){

      .content{
        padding-left:10px;
        padding-right:10px;
      }

      .devices-grid{
        gap:9px;
      }

      .device-photo-wrap{
        height:138px;
      }

      .device-card::after{
        top:138px;
      }

      .device-info{
        padding:8px 8px 9px;
      }

      .device-name{
        font-size:13px;
      }

      .details-grid{
        gap:5px;
      }

      .detail-item{
        padding:6px 5px;
      }

      .detail-item span{
        font-size:7px;
      }

      .detail-item strong{
        font-size:10px;
      }

      .detail-item{
        padding:6px 4px;
      }

      .price{
        font-size:13px;
      }
    }

    @media(min-width:600px){

      .devices-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
      }

      .loading{
        grid-template-columns:repeat(3,minmax(0,1fr));
      }
    }
  
/* UNIFIED MZAD PHONE BOTTOM NAV */
.bottom-wrap,.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
}
.bottom-wrap{
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.bottom-nav{
  width:min(100%,520px);
  margin:0 auto;
  min-height:64px;
  padding:5px;
  border-radius:20px;
  background:rgba(255,255,255,.97);
  border:1px solid #E7ECEF;
  box-shadow:0 10px 28px rgba(23,32,42,.10);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  pointer-events:auto;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:3px;
}
.bottom-nav .nav-inner,.bottom-nav .bottom-inner{
  width:100%;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:3px;
  align-items:center;
  grid-column:1/-1;
}
.bottom-nav .nav-item{
  min-width:0;
  min-height:52px;
  padding:4px 2px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  border:0;
  border-radius:15px;
  background:transparent;
  color:#7E8992;
  text-decoration:none;
  transition:transform .16s ease,background .16s ease,color .16s ease;
}
.bottom-nav .nav-item:active{transform:scale(.96)}
.bottom-nav .nav-item.active{
  color:#176B87;background:#EAF6F8;
}
.bottom-nav .nav-item svg,
.bottom-nav .nav-icon{
  width:20px;
  height:20px;
  flex:0 0 20px;
  color:currentColor;
}
.bottom-nav .nav-label,
.bottom-nav .nav-item>span:not(.action-icon):not(.add-button){
  margin:0;
  font-size:8.5px;
  line-height:1;
  font-weight:900;
  white-space:nowrap;
}
.bottom-nav .action-icon,

  <script type="module">

    /*
      مهم:
      لا نغيّر js/supabase.js
      ولا نغيّر قاعدة البيانات
      ولا نغيّر أسماء الحقول.
    */

    import { supabase } from "./js/supabase.js?v=market-final-2";


    /* =========================================
       ELEMENTS
    ========================================== */

    const searchInput =
      document.getElementById("searchInput");

    const brandFilters =
      document.getElementById("brandFilters");

    const devicesGrid =
      document.getElementById("devicesGrid");

    const loadingState =
      document.getElementById("loadingState");

    const stateContainer =
      document.getElementById("stateContainer");

    const sectionTitle =
      document.getElementById("sectionTitle");

    const sectionSubtitle =
      document.getElementById("sectionSubtitle");

    const countLabel =
      document.getElementById("countLabel");

    const resultsLabel =
      document.getElementById("resultsLabel");

    const sortBtn =
      document.getElementById("sortBtn");

    const sortText =
      document.getElementById("sortText");


    /* =========================================
       STATE
    ========================================== */

    let devices = [];

    let selectedBrand = "all";

    let searchTerm = "";
    let searchDebounceTimer = null;

    let sortMode = "newest";


    /* =========================================
       URL BRAND
    ========================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const rawBrand =
      (
        params.get("brand") || "all"
      )
      .trim()
      .toLowerCase();


    const brandAliases = {

      all:"all",

      apple:"Apple",
      iphone:"Apple",
      "i-phone":"Apple",

      samsung:"Samsung",

      xiaomi:"Xiaomi",
      redmi:"Xiaomi",
      poco:"Xiaomi",

      google:"Google",
      pixel:"Google",

      huawei:"Huawei",

      oppo:"OPPO",

      honor:"HONOR",

      oneplus:"OnePlus",

      realme:"realme",

      motorola:"Motorola",

      sony:"Sony",

      nokia:"Nokia",

      tecno:"Tecno",

      infinix:"Infinix"

    };


    selectedBrand =
      brandAliases[rawBrand] || "all";


    /* =========================================
       BRAND NORMALIZATION
    ========================================== */

    function normalizeBrand(value){

      const original =
        String(value ?? "")
          .trim();

      if(!original){
        return "";
      }

      const lower =
        original.toLowerCase();

      const map = {

        apple:"Apple",
        iphone:"Apple",
        "i-phone":"Apple",

        samsung:"Samsung",

        xiaomi:"Xiaomi",
        redmi:"Xiaomi",
        poco:"Xiaomi",

        google:"Google",
        pixel:"Google",

        huawei:"Huawei",

        oppo:"OPPO",

        honor:"HONOR",

        oneplus:"OnePlus",

        realme:"realme",

        motorola:"Motorola",

        sony:"Sony",

        nokia:"Nokia",

        tecno:"Tecno",

        infinix:"Infinix"

      };

      return map[lower] || original;

    }


    /* =========================================
       IMAGE PARSER
    ========================================== */

    function getDeviceImages(images){

      if(!images){
        return [];
      }

      if(Array.isArray(images)){
        return images.filter(Boolean);
      }

      if(typeof images === "string"){

        const value =
          images.trim();

        if(!value){
          return [];
        }

        try{

          const parsed =
            JSON.parse(value);

          if(Array.isArray(parsed)){
            return parsed.filter(Boolean);
          }

        }catch(error){
          // normal string path
        }

        return [value];
      }

      return [];

    }


    /* =========================================
       STORAGE IMAGE URL
    ========================================== */

    function getImageUrl(path){

      if(!path){
        return "";
      }

      const value =
        String(path).trim();

      if(
        value.startsWith("http://") ||
        value.startsWith("https://") ||
        value.startsWith("data:")
      ){
        return value;
      }

      const {
        data
      } =
        supabase
          .storage
          .from("device-images")
          .getPublicUrl(value);

      return data?.publicUrl || "";

    }


    /* =========================================
       FORMAT PRICE
    ========================================== */

    function formatPrice(price){

      const number =
        Number(price);

      if(
        !Number.isFinite(number)
      ){
        return "السعر غير محدد";
      }

      return (
        new Intl.NumberFormat("en-US")
          .format(number)
        + " د.ع"
      );

    }


    /* =========================================
       REAL PUBLICATION TIME
    ========================================== */

    function formatPublishedTime(value){

      const date =
        new Date(value);

      if(
        Number.isNaN(
          date.getTime()
        )
      ){
        return "";
      }


      const now =
        Date.now();

      const diff =
        Math.max(
          0,
          now - date.getTime()
        );


      const minute =
        60 * 1000;

      const hour =
        60 * minute;

      const day =
        24 * hour;

      const week =
        7 * day;

      const month =
        30 * day;

      const year =
        365 * day;


      /* أقل من دقيقة */

      if(diff < minute){

        return "نُشر الآن";

      }


      /* الدقائق */

      if(diff < hour){

        const n =
          Math.floor(
            diff / minute
          );


        if(n === 1){

          return "نُشر منذ دقيقة";

        }

        if(n === 2){

          return "نُشر منذ دقيقتين";

        }

        if(n < 11){

          return `نُشر منذ ${n} دقائق`;

        }

        return `نُشر منذ ${n} دقيقة`;

      }


      /* الساعات */

      if(diff < day){

        const n =
          Math.floor(
            diff / hour
          );


        if(n === 1){

          return "نُشر منذ ساعة";

        }

        if(n === 2){

          return "نُشر منذ ساعتين";

        }

        if(n < 11){

          return `نُشر منذ ${n} ساعات`;

        }

        return `نُشر منذ ${n} ساعة`;

      }


      /* الأيام */

      if(diff < week){

        const n =
          Math.floor(
            diff / day
          );


        if(n === 1){

          return "نُشر منذ يوم";

        }

        if(n === 2){

          return "نُشر منذ يومين";

        }

        if(n < 11){

          return `نُشر منذ ${n} أيام`;

        }

        return `نُشر منذ ${n} يوم`;

      }


      /* الأسابيع */

      if(diff < month){

        const n =
          Math.floor(
            diff / week
          );


        if(n === 1){

          return "نُشر منذ أسبوع";

        }

        if(n === 2){

          return "نُشر منذ أسبوعين";

        }

        if(n < 11){

          return `نُشر منذ ${n} أسابيع`;

        }

        return `نُشر منذ ${n} أسبوع`;

      }


      /* الأشهر */

      if(diff < year){

        const n =
          Math.floor(
            diff / month
          );


        if(n === 1){

          return "نُشر منذ شهر";

        }

        if(n === 2){

          return "نُشر منذ شهرين";

        }

        if(n < 11){

          return `نُشر منذ ${n} أشهر`;

        }

        return `نُشر منذ ${n} شهر`;

      }


      /* السنوات */

      const n =
        Math.floor(
          diff / year
        );


      if(n === 1){

        return "نُشر منذ سنة";

      }

      if(n === 2){

        return "نُشر منذ سنتين";

      }

      if(n < 11){

        return `نُشر منذ ${n} سنوات`;

      }

      return `نُشر منذ ${n} سنة`;

    }


    /* =========================================
       NORMALIZE DEVICE
    ========================================== */

    function normalizeDevice(device){

      const images =
        getDeviceImages(
          device.images
        );

      const normalizedBrand =
        normalizeBrand(
          device.brand
        );

      const searchText = [

        device.brand,
        normalizedBrand,

        device.model,
        device.storage,
        device.color,

        device.battery_health,

        device.condition,
        device.body_condition,
        device.screen_condition,

        device.location,

        device.sale_type,

        device.notes

      ]
        .filter(
          value =>
            value !== null &&
            value !== undefined
        )
        .join(" ")
        .toLowerCase();


      return {

        ...device,

        _brand:
          normalizedBrand,

        _images:
          images,

        _saleType:
          String(
            device.sale_type || ""
          ).trim().toLowerCase(),

        _searchText:
          searchText

      };

    }


    /* =========================================
       LOAD DEVICES
    ========================================== */

    async function loadDevices(){

      showLoading();

      try{

        const {
          data,
          error
        } =
          await supabase
            .from("devices")
            .select(`
              id,
              created_at,
              brand,
              model,
              storage,
              color,
              battery_health,
              condition,
              body_condition,
              screen_condition,
              price,
              location,
              sale_type,
              images,
              notes
            `)
            .order(
              "created_at",
              {
                ascending:false
              }
            );


        if(error){

          console.error(
            "SUPABASE DEVICES ERROR:",
            error
          );

          showError(
            "تعذر تحميل الأجهزة",
            "صار خطأ أثناء الاتصال بقاعدة البيانات."
          );

          return;
        }


        devices =
          (data || [])
            .map(normalizeDevice);


        hideLoading();

        render();

      }catch(error){

        console.error(
          "LOAD DEVICES ERROR:",
          error
        );

        showError(
          "تعذر تحميل الأجهزة",
          "تأكد من الاتصال بالإنترنت وحاول مرة ثانية."
        );

      }

    }


    /* =========================================
       FILTER DEVICES
    ========================================== */

    function getFilteredDevices(){

      const normalizedSearch =
        searchTerm
          .trim()
          .toLowerCase();


      let result =
        devices.filter(
          device => {

            const brandMatch =
              selectedBrand === "all" ||
              device._brand ===
              normalizeBrand(
                selectedBrand
              );


            const searchMatch =
              !normalizedSearch ||
              device._searchText.includes(
                normalizedSearch
              );


            return (
              brandMatch &&
              searchMatch
            );

          }
        );


      /* =====================================
         SORT
      ====================================== */

      if(sortMode === "low"){

        result.sort(
          (a,b) =>
            Number(a.price || 0) -
            Number(b.price || 0)
        );

      }

      else if(sortMode === "high"){

        result.sort(
          (a,b) =>
            Number(b.price || 0) -
            Number(a.price || 0)
        );

      }

      else{

        result.sort(
          (a,b) =>
            new Date(
              b.created_at || 0
            ) -
            new Date(
              a.created_at || 0
            )
        );

      }


      return result;

    }


    /* =========================================
       RENDER
    ========================================== */

    function render(){

      const filtered =
        getFilteredDevices();


      updateHeader(
        filtered.length
      );


      updateFilters();


      devicesGrid.innerHTML = "";

      stateContainer.innerHTML = "";


      if(!filtered.length){

        devicesGrid.style.display =
          "none";

        stateContainer.style.display =
          "block";


        let title =
          "ماكو أجهزة حالياً";

        let text =
          "ما لقينا أجهزة تطابق البحث أو الفلتر المحدد.";


        if(selectedBrand !== "all"){

          const brandName =
            getBrandDisplayName(
              selectedBrand
            );

          title =
            `ماكو أجهزة ${brandName} حالياً`;

          text =
            "جرّب تختار شركة ثانية أو شيل الفلتر.";

        }

        else if(searchTerm){

          title =
            "ماكو نتائج";

          text =
            "جرّب كلمة بحث ثانية أو شيل البحث.";

        }


        stateContainer.innerHTML =
          createEmptyState(
            title,
            text
          );


        resultsLabel.textContent =
          "لا توجد نتائج";

        return;

      }


      stateContainer.style.display =
        "none";

      devicesGrid.style.display =
        "grid";


      resultsLabel.textContent =
        `${filtered.length} جهاز`;


      filtered.forEach(
        (device,index) => {

          devicesGrid.appendChild(
            createDeviceCard(
              device,
              index
            )
          );

        }
      );

    }


    /* =========================================
       HEADER
    ========================================== */

    function updateHeader(count){

      countLabel.textContent =
        `${count} جهاز`;


      if(selectedBrand === "all"){

        sectionTitle.textContent =
          "كل الأجهزة";

        sectionSubtitle.textContent =
          "جميع الأجهزة المعروضة حالياً";

      }

      else{

        const brandName =
          getBrandDisplayName(
            selectedBrand
          );

        sectionTitle.textContent =
          `أجهزة ${brandName}`;

        sectionSubtitle.textContent =
          `تصفح أجهزة ${brandName} المعروضة للبيع والمزادات`;

      }

    }


    /* =========================================
       BRAND DISPLAY NAME
    ========================================== */

    function getBrandDisplayName(brand){

      const map = {

        Apple:"iPhone",
        Samsung:"Samsung",
        Xiaomi:"Xiaomi",
        Google:"Google",
        Huawei:"Huawei",
        OPPO:"OPPO",
        HONOR:"HONOR",
        OnePlus:"OnePlus",
        realme:"realme",
        Motorola:"Motorola",
        Sony:"Sony",
        Nokia:"Nokia",
        Tecno:"Tecno",
        Infinix:"Infinix"

      };

      return map[brand] || brand;

    }


    /* =========================================
       UPDATE FILTERS
    ========================================== */

    function updateFilters(){

      const buttons =
        brandFilters.querySelectorAll(
          ".filter"
        );


      buttons.forEach(
        button => {

          const buttonBrand =
            button.dataset.brand;

          const active =
            normalizeBrand(
              buttonBrand
            ) ===
            normalizeBrand(
              selectedBrand
            );


          button.classList.toggle(
            "active",
            active
          );

        }
      );

    }


    /* =========================================
       DEVICE CARD
    ========================================== */

    function createDeviceCard(
      device,
      index
    ){

      const card =
        document.createElement("article");

      const brandClass =
        {
          Apple:"brand-apple",
          Samsung:"brand-samsung",
          Xiaomi:"brand-xiaomi",
          Huawei:"brand-huawei",
          Google:"brand-google"
        }[normalizeBrand(device.brand)] || "brand-default";

      card.className =
        "device-card " + brandClass;

      if(index < 12){
        card.style.animationDelay =
          `${index * 35}ms`;
      }else{
        card.style.animation = "none";
      }


      const images =
        device._images || [];


      const imageUrl =
        images.length
          ? getImageUrl(images[0])
          : "";


      const saleType =
        device._saleType === "auction"
          ? "مزاد"
          : "بيع مباشر";


      const favorite =
        isFavorite(device.id);


      card.innerHTML = `

        <div class="device-photo-wrap">

          ${
            imageUrl

              ? `

                <img
                  class="device-photo"
                  src="${escapeAttribute(imageUrl)}"
                  alt="${escapeAttribute(
                    `${device.brand || ""} ${device.model || ""}`
                  )}"
                  loading="lazy"
                  onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >

                <div
                  class="photo-placeholder"
                  style="display:none;"
                >
                  ${imageIcon()}
                </div>

              `

              : `

                <div class="photo-placeholder">
                  ${imageIcon()}
                </div>

              `
          }


          <div class="sale-type">
            ${escapeHtml(saleType)}
          </div>


          <button
            class="favorite ${favorite ? "active" : ""}"
            type="button"
            aria-label="المفضلة"
            data-favorite-id="${escapeAttribute(
              device.id
            )}"
          >
            ${heartIcon()}
          </button>

        </div>


        <div class="device-info">

          <h3 class="device-name">
            ${escapeHtml(
              [device.brand,device.model]
                .filter(Boolean)
                .join(" ")
                || "جهاز"
            )}
          >


          ${
            device.location

              ? `

                <div class="device-location">

                  ${locationIcon()}

                  <span>
                    ${escapeHtml(
                      device.location
                    )}
                  </span>

                </div>

              `

              : ""
          }


          ${
            device.created_at

              ? `

                <div
                  class="published-time"
                  data-created-at="${escapeAttribute(
                    device.created_at
                  )}"
                >
                  ${escapeHtml(
                    formatPublishedTime(
                      device.created_at
                    )
                  )}
                </div>

              `

              : ""
          }


          <div class="details-grid ${device._brand === "Apple" && device.battery_health !== null && device.battery_health !== undefined && String(device.battery_health).trim() !== "" ? "has-battery" : "no-battery"}">

            <div class="detail-item">

              <span>
                السعة
              </span>

              <strong>
                ${escapeHtml(
                  device.storage || "-"
                )}
              </strong>

            </div>


            <div class="detail-item">

              <span>
                اللون
              </span>

              <strong>
                ${escapeHtml(
                  device.color || "-"
                )}
              </strong>

            </div>


            ${device._brand === "Apple" && device.battery_health !== null && device.battery_health !== undefined && String(device.battery_health).trim() !== "" ? `
            <div class="detail-item">

              <span>
                البطارية
              </span>

              <strong>
                ${escapeHtml(
                  String(device.battery_health) + "%"
                )}
              </strong>

            </div>
            ` : ""}

          </div>


          <div class="price-row">

            <span class="price-label">
              السعر
            </span>

            <strong class="price">
              ${escapeHtml(
                formatPrice(device.price)
              )}
            </strong>

          </div>

        </div>

      `;


      /* CARD CLICK */

      card.addEventListener(
        "click",
        event => {

          if(
            event.target.closest(
              ".favorite"
            )
          ){
            return;
          }


          window.location.href =
            `device.html?id=${encodeURIComponent(
              device.id
            )}`;

        }
      );


      /* FAVORITE CLICK */

      const favoriteButton =
        card.querySelector(
          ".favorite"
        );


      favoriteButton.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          toggleFavorite(
            device.id,
            favoriteButton
          );

        }
      );


      return card;

    }


    /* =========================================
       FAVORITES
    ========================================== */

    const FAVORITES_KEY =
      "mzad_phone_favorites";

    let favoritesCache = new Set();

    function loadFavoritesCache(){

      try{

        const saved =
          localStorage.getItem(FAVORITES_KEY);

        if(!saved){
          favoritesCache = new Set();
          return;
        }

        const parsed = JSON.parse(saved);

        favoritesCache = new Set(
          Array.isArray(parsed)
            ? parsed.map(String)
            : []
        );

      }catch(error){

        favoritesCache = new Set();

      }

    }

    function saveFavorites(){

      localStorage.setItem(
        FAVORITES_KEY,
        JSON.stringify(
          Array.from(favoritesCache)
        )
      );

    }

    function isFavorite(id){

      return favoritesCache.has(String(id));

    }

    function toggleFavorite(id,button){

      const stringId = String(id);

      if(favoritesCache.has(stringId)){

        favoritesCache.delete(stringId);

        button.classList.remove("active");

      }else{

        favoritesCache.add(stringId);

        button.classList.add("active");

      }

      saveFavorites();

    }


    /* =========================================
       BRAND BUTTONS
    ========================================== */

    brandFilters.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            ".filter"
          );


        if(!button){
          return;
        }


        selectedBrand =
          normalizeBrand(
            button.dataset.brand
          );


        const newUrl =
          new URL(
            window.location.href
          );


        if(
          selectedBrand === "all"
        ){

          newUrl.searchParams.delete(
            "brand"
          );

        }

        else{

          const urlBrand =
            selectedBrand === "Apple"
              ? "iphone"
              : selectedBrand.toLowerCase();


          newUrl.searchParams.set(
            "brand",
            urlBrand
          );

        }


        window.history.replaceState(
          {},
          "",
          newUrl
        );


        render();

      }
    );


    /* =========================================
       SEARCH
    ========================================== */

    searchInput.addEventListener(
      "input",
      event => {

        searchTerm =
          event.target.value || "";

        clearTimeout(searchDebounceTimer);

        searchDebounceTimer = setTimeout(
          render,
          180
        );

      }
    );


    /* =========================================
       SORT
    ========================================== */

    sortBtn.addEventListener(
      "click",
      () => {

        if(sortMode === "newest"){

          sortMode = "low";

          sortText.textContent =
            "الأرخص";

        }

        else if(sortMode === "low"){

          sortMode = "high";

          sortText.textContent =
            "الأعلى سعراً";

        }

        else{

          sortMode = "newest";

          sortText.textContent =
            "الأحدث";

        }


        render();

      }
    );


    /* =========================================
       LOADING
    ========================================== */

    function showLoading(){

      loadingState.style.display =
        "grid";

      devicesGrid.style.display =
        "none";

      stateContainer.style.display =
        "none";

      resultsLabel.textContent =
        "جاري تحميل الأجهزة...";

    }


    function hideLoading(){

      loadingState.style.display =
        "none";

    }


    /* =========================================
       ERROR
    ========================================== */

    function showError(
      title,
      text
    ){

      loadingState.style.display =
        "none";

      devicesGrid.style.display =
        "none";

      stateContainer.style.display =
        "block";


      stateContainer.innerHTML = `

        <div class="state">

          <div class="state-icon">

            ${alertIcon()}

          </div>

          <h3 class="state-title">
            ${escapeHtml(title)}
          </h3>

          <p class="state-text">
            ${escapeHtml(text)}
          </p>

          <button
            class="retry-btn"
            type="button"
            onclick="location.reload()"
          >
            إعادة المحاولة
          </button>

        </div>

      `;


      resultsLabel.textContent =
        "تعذر تحميل الأجهزة";

    }


    /* =========================================
       EMPTY STATE
    ========================================== */

    function createEmptyState(
      title,
      text
    ){

      return `

        <div class="state">

          <div class="state-icon">

            ${searchEmptyIcon()}

          </div>

          <h3 class="state-title">
            ${escapeHtml(title)}
          </h3>

          <p class="state-text">
            ${escapeHtml(text)}
          </p>

        </div>

      `;

    }


    /* =========================================
       HTML ESCAPE
    ========================================== */

    function escapeHtml(value){

      return String(
        value ?? ""
      )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

    }


    function escapeAttribute(value){

      return escapeHtml(value);

    }


    /* =========================================
       ICONS
    ========================================== */

    function heartIcon(){

      return `

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20.8 8.7c0 5.4-8.8 10.3-8.8 10.3S3.2 14.1 3.2 8.7A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.5Z"/>
        </svg>

      `;

    }


    function imageIcon(){

      return `

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect
            x="3"
            y="4"
            width="18"
            height="16"
            rx="2"
          />
          <circle
            cx="8.5"
            cy="9"
            r="1.5"
          />
          <path
            d="M21 15l-5-5L5 20"
          />
        </svg>

      `;

    }


    function locationIcon(){

      return `

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/>
          <circle cx="12" cy="10" r="2.5"/>
        </svg>

      `;

    }


    function searchEmptyIcon(){

      return `

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle
            cx="11"
            cy="11"
            r="6.5"
          />
          <path
            d="M16 16l4 4"
          />
          <path
            d="M8.5 11h5"
          />
        </svg>

      `;

    }


    function alertIcon(){

      return `

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle
            cx="12"
            cy="12"
            r="9"
          />
          <path
            d="M12 8v5"
          />
          <path
            d="M12 16.5h.01"
          />
        </svg>

      `;

    }


    /* =========================================
       LIVE PUBLICATION TIME REFRESH
    ========================================== */

    function refreshPublishedTimes(){

      const elements =
        document.querySelectorAll(
          ".published-time[data-created-at]"
        );


      elements.forEach(
        element => {

          const createdAt =
            element.dataset.createdAt;

          element.textContent =
            formatPublishedTime(
              createdAt
            );

        }
      );

    }


    /*
      تحديث وقت النشر الحقيقي
      كل دقيقة بدون إعادة تحميل الصفحة.
    */

    setInterval(
      refreshPublishedTimes,
      60 * 1000
    );


    /* =========================================
       START
    ========================================== */

    loadFavoritesCache();
    updateFilters();

    loadDevices();

  </script>

</body>
</html>
