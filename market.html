<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#6f5ce0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MZAD PHONE">
<title>MZAD PHONE — السوق</title>
<style>
:root{
  --bg:#f9f8fd;--ink:#17202a;--muted:#6b7280;--line:#ece8fb;--edge:#ddd8f8;
  --p:#6246d9;--p2:#8b6cf0;--pd:#4a34b8;--soft:#f3f0ff;--danger:#e5365f;--ok:#1e8a5a;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{
  min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;padding-bottom:calc(112px + var(--sb))
}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{text-decoration:none;color:inherit}
.wrap{width:min(100%,720px);margin:0 auto}

/* ============ الهيدر: نفس هوية الرئيسية (بنفسجي + شبكة هندسية ثابتة) ============ */
.top{
  position:sticky;top:0;z-index:50;overflow:hidden;isolation:isolate;
  padding:calc(8px + var(--st)) 16px 16px;
  background:
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 46%),
    linear-gradient(145deg,#5a45d4 0%,#7a67e8 50%,#a496f3 100%);
  border-radius:0 0 24px 24px;border-bottom:1px solid #5f4cd0;
  box-shadow:0 10px 26px rgba(74,52,184,.28)
}
.web{position:absolute;top:0;z-index:0;pointer-events:none;opacity:.26}
.web svg{display:block;width:100%;height:100%}
.web-a{left:0;width:190px;height:190px}
.web-b{right:0;width:150px;height:150px;opacity:.2;transform:scaleX(-1)}

.top-row,.ttl,.searchbox{position:relative;z-index:2}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 0}

.logo{display:flex;flex-direction:column;align-items:flex-start;gap:4px;color:#fff;line-height:1;user-select:none}
.logo b{font-size:25px;font-weight:950;letter-spacing:.02em;line-height:1}
.logo small{font-size:9.5px;font-weight:800;letter-spacing:.5em;margin-inline-end:-.5em;color:rgba(255,255,255,.85);line-height:1}

.back{
  width:40px;height:36px;display:grid;place-items:center;border-radius:12px;
  border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.9);color:var(--p);
  box-shadow:0 7px 18px rgba(23,32,42,.08);transition:transform .18s ease
}
.back:active{transform:scale(.93)}
.back svg{width:20px;height:20px}

.ttl{margin-top:12px;max-height:76px;overflow:hidden;transition:max-height .3s var(--ease),opacity .3s ease,margin .3s ease}
.ttl h1{margin:0;font-size:24px;font-weight:950;letter-spacing:-.04em;line-height:1.15;color:#fff}
.ttl p{margin:4px 0 0;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.82)}
.top.scrolled .ttl{max-height:0;opacity:0;margin-top:0}

.searchbox{position:relative;margin-top:12px}
.searchbox input{
  width:100%;height:46px;border:1.5px solid var(--edge);border-radius:15px;background:#fff;
  padding:0 44px;font-size:14px;font-weight:700;outline:none;color:var(--ink);
  box-shadow:0 8px 22px rgba(40,24,120,.16);transition:border-color .25s,box-shadow .25s
}
.searchbox input::placeholder{color:#a8b0bb;font-weight:600}
.searchbox input:focus{border-color:#a99cf0;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.ico-s{position:absolute;top:50%;inset-inline-end:14px;transform:translateY(-50%);width:20px;height:20px;color:var(--p);pointer-events:none}
.clear{
  position:absolute;top:50%;inset-inline-start:8px;transform:translateY(-50%);width:32px;height:32px;
  display:none;place-items:center;border-radius:11px;background:var(--soft);color:var(--pd)
}
.searchbox.has-value .clear{display:grid}
.clear svg{width:14px;height:14px}

/* ============ الشركات ============ */
.brands{display:flex;gap:8px;overflow-x:auto;padding:16px 14px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.brands::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;scroll-snap-align:start;padding:9px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--edge);
  font-size:12.5px;font-weight:900;color:#4b5563;white-space:nowrap;
  transition:background .2s,border-color .2s,color .2s,transform .18s
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--soft);border-color:#8977e9;color:var(--pd)}

/* ============ العدد والترتيب ============ */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.count{font-size:12px;font-weight:700;color:var(--muted)}
.count b{color:var(--ink);font-weight:950;font-size:15px}
.seg{display:flex;gap:4px;padding:3px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.seg button{height:28px;padding:0 13px;border-radius:999px;font-size:11px;font-weight:900;color:#7e8992;transition:background .2s,color .2s}
.seg button.on{background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;box-shadow:0 5px 12px -5px rgba(98,70,217,.6)}

/* ============ الشبكة ============ */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 12px 0}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}

/* بطاقة الجهاز — رجوع للتصميم السابق، مع إبقاء الهيدر كما هو */
.card{position:relative;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;cursor:pointer;aspect-ratio:1/2;border-radius:25px;background:#120c2c;border:1px solid rgba(98,70,217,.12);box-shadow:0 18px 34px -25px rgba(40,25,110,.5);opacity:0;animation:rise .7s var(--ease) forwards;animation-delay:calc(var(--i,0)*70ms);transition:transform .4s var(--ease),box-shadow .4s ease}
.card::before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(120%);transition:transform .9s var(--ease)}
.card:active{transform:scale(.97)}.card:active::before{transform:translateX(-120%)}
@media(hover:hover){.card:hover{transform:translateY(-6px);box-shadow:0 34px 50px -26px rgba(40,25,110,.7)}.card:hover::before{transform:translateX(-120%)}.card:hover .pic img{transform:scale(1.04)}}
.card.removing{animation:out .28s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes out{to{opacity:0;transform:scale(.9)}}
.pic{position:absolute;inset:0;overflow:hidden;background:linear-gradient(160deg,#7b61e8,#3b2a92)}.pic::before{content:none}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.35);transition:opacity .2s ease}.ph svg{width:46px;height:46px}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;padding:0;opacity:0;transition:opacity .35s ease,transform .55s var(--ease)}.pic img.ready{opacity:1}.pic img.photo-portrait,.pic img.photo-landscape,.pic img.photo-square{object-fit:cover;object-position:center}.pic:has(img.ready) .ph{opacity:0}
.fav,.del{position:absolute;top:10px;z-index:5;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.94);color:#6b6585;transition:transform .15s ease,color .2s ease}.fav{inset-inline-end:10px}.del{inset-inline-start:10px;color:var(--danger)}.fav:active,.del:active{transform:scale(.85)}.fav svg,.del svg{width:16px;height:16px}.fav.on{color:var(--danger)}.fav.on svg{fill:var(--danger)}.fav.pop{animation:pop .4s var(--ease)}@keyframes pop{40%{transform:scale(1.3)}}
.info{position:absolute;z-index:2;inset-inline:0;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:10px 11px 11px;color:#fff;background:linear-gradient(to top,rgba(18,12,44,.99) 0%,rgba(18,12,44,.94) 35%,rgba(18,12,44,.62) 68%,rgba(18,12,44,0) 100%)}
.name{margin:0;font-size:15px;font-weight:900;line-height:1.25;letter-spacing:-.01em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btag{position:absolute;top:12px;inset-inline-start:12px;z-index:3;padding:6px 12px;border-radius:999px;background:linear-gradient(145deg,#6246d9,#8b6cf0);color:#fff;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 8px 16px -8px rgba(60,40,150,.7)}.card.owned .btag{top:56px}
.specs{display:flex;gap:5px;overflow:hidden}.specs span{flex:0 0 auto;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:10.5px;font-weight:800;white-space:nowrap}
.sep{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent)}.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:6px}.pricecol{display:flex;flex-direction:column;gap:1px;min-width:0}.pricecol small{font-size:10px;font-weight:700;color:rgba(255,255,255,.6)}
.price{font-size:17px;font-weight:900;letter-spacing:-.02em;color:#fff;white-space:nowrap;direction:rtl}.price i{font-style:normal;font-size:10px;font-weight:700;margin-inline-start:3px;opacity:.75}.time{font-size:10px;font-weight:700;color:rgba(255,255,255,.55);white-space:nowrap}.specs .bat{display:inline-flex;align-items:center;gap:4px}.specs .bat svg{width:13px;height:13px}
.badge{flex:0 0 auto;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:900;background:#fff;color:#1e8a5a;margin-bottom:2px}.badge.auc{background:linear-gradient(145deg,#6246d9,#8b6cf0);color:#fff}.badge.end{background:rgba(110,104,135,.95);color:#fff}
/* ============ الحالات ============ */
.sk{
  aspect-ratio:1/2;border-radius:25px;border:1px solid var(--line);
  background:linear-gradient(90deg,#f1eefb 25%,#faf8ff 50%,#f1eefb 75%);
  background-size:200% 100%;animation:shim 1.3s linear infinite
}
@keyframes shim{to{background-position:-200% 0}}

.empty,.error{
  grid-column:1/-1;padding:38px 20px;border-radius:22px;text-align:center;
  background:linear-gradient(145deg,#fff 0%,#faf8ff 100%);border:1px solid var(--edge);
  box-shadow:0 10px 24px -14px rgba(98,70,217,.22)
}
.empty .ico,.error .ico{width:58px;height:58px;margin:0 auto 12px;border-radius:18px;background:var(--soft);color:var(--pd);display:grid;place-items:center;border:1px solid #e3defa}
.empty .ico svg,.error .ico svg{width:26px;height:26px}
.empty h3,.error h3{margin:0;font-size:16px;font-weight:950}
.empty p,.error p{margin:6px 0 0;font-size:12px;line-height:1.7;font-weight:700;color:var(--muted)}
.empty button,.error button{
  margin-top:14px;height:44px;padding:0 22px;border-radius:14px;color:#fff;font-size:12.5px;font-weight:900;
  background:linear-gradient(145deg,var(--p),var(--p2));box-shadow:0 10px 22px rgba(98,70,217,.3)
}

/* ============ نافذة الحذف ============ */
.sheet-wrap{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;justify-content:center;padding:12px;pointer-events:none}
.sheet-wrap.open{pointer-events:auto}
.sheet-backdrop{position:absolute;inset:0;background:rgba(14,9,40,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .25s ease}
.sheet-wrap.open .sheet-backdrop{opacity:1}
.sheet{
  position:relative;width:min(100%,420px);margin-bottom:calc(10px + var(--sb));padding:24px 20px 18px;border-radius:28px;
  background:#fff;text-align:center;transform:translateY(34px);opacity:0;transition:transform .3s var(--ease),opacity .25s ease
}
.sheet-wrap.open .sheet{transform:none;opacity:1}
.sheet-icon{width:58px;height:58px;margin:0 auto 12px;border-radius:50%;background:#ffe8ee;color:var(--danger);display:grid;place-items:center}
.sheet-icon svg{width:26px;height:26px}
.sheet h3{margin:0;font-size:17px;font-weight:950}
.sheet p{margin:7px 0 0;font-size:12px;line-height:1.8;font-weight:700;color:var(--muted)}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.sheet-actions button{height:46px;border-radius:14px;font-size:13px;font-weight:900}
.sheet-actions .cancel{background:#f3f1fa}
.sheet-actions .confirm{background:linear-gradient(145deg,#e5365f,#ff6b6b);color:#fff}
.sheet-actions button:disabled{opacity:.6}

/* ============ الشريط السفلي: نفس الرئيسية ============ */
.dock{
  position:fixed;left:0;right:0;bottom:-6px;z-index:100;width:100%;
  padding:6px 12px calc(6px + var(--sb));pointer-events:none;transition:transform .25s ease
}
body.kb .dock{transform:translateY(140%)}
.dock-in{
  pointer-events:auto;width:min(100%,500px);margin:0 auto;min-height:66px;padding:6px;border-radius:22px;
  background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 10px 28px rgba(23,32,42,.13);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;align-items:center
}
.dock a{
  min-width:0;min-height:54px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border-radius:16px;color:#7e8992;font-size:10px;line-height:1;font-weight:900;white-space:nowrap;transition:transform .18s ease
}
.dock a:active{transform:scale(.93)}
.dock a.on{color:var(--pd);background:var(--soft)}
.dock svg{width:23px;height:23px;flex:0 0 23px}
.dock .plus{
  width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 14px rgba(98,70,217,.32)
}
.dock .plus svg{width:22px;height:22px}

/* ============ التوست ============ */
.toast{
  position:fixed;left:50%;bottom:calc(98px + var(--sb));transform:translateX(-50%) translateY(14px);max-width:calc(100% - 40px);
  padding:10px 14px;border-radius:13px;background:#1e2c30;color:#fff;font-size:11px;font-weight:800;text-align:center;
  box-shadow:0 14px 34px rgba(24,44,49,.14);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:200
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:360px){.name{font-size:14px}.price{font-size:15px}.dock a{font-size:9px}.dock svg{width:21px;height:21px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.card{opacity:1}}

/* ============ هيدر مصغّر ============ */
.top{padding:calc(6px + var(--st)) 14px 12px;border-radius:0 0 20px 20px;box-shadow:0 8px 20px rgba(74,52,184,.24)}
.web-a{width:150px;height:150px}
.web-b{width:120px;height:120px}
.top-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:2px 0 0}
.logo{gap:3px}
.logo b{font-size:20px}
.logo small{font-size:8px;letter-spacing:.46em;margin-inline-end:-.46em}
.ttl-mini{margin:0;font-size:16px;font-weight:950;color:#fff;letter-spacing:-.02em;text-align:center}
.back{width:36px;height:32px;border-radius:11px;justify-self:end}
.back svg{width:18px;height:18px}
.searchbox{margin-top:10px}
.searchbox input{height:42px;border-radius:14px;font-size:13.5px}
.ico-s{width:18px;height:18px}
.clear{width:30px;height:30px}
</style>
<link rel="stylesheet" href="/css/responsive-compat.css">
</head>
<body>

<header class="top" id="top">

  <div class="web web-a" aria-hidden="true"><svg viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0L184.0 0.0M0 0L170.0 70.4M0 0L130.1 130.1M0 0L70.4 170.0M0 0L0.0 184.0M46.0 0.0L42.5 17.6L32.5 32.5L17.6 42.5L0.0 46.0M92.0 0.0L85.0 35.2L65.1 65.1L35.2 85.0L0.0 92.0M138.0 0.0L127.5 52.8L97.6 97.6L52.8 127.5L0.0 138.0"/></svg></div>
  <div class="web web-b" aria-hidden="true"><svg viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0L184.0 0.0M0 0L170.0 70.4M0 0L130.1 130.1M0 0L70.4 170.0M0 0L0.0 184.0M46.0 0.0L42.5 17.6L32.5 32.5L17.6 42.5L0.0 46.0M92.0 0.0L85.0 35.2L65.1 65.1L35.2 85.0L0.0 92.0M138.0 0.0L127.5 52.8L97.6 97.6L52.8 127.5L0.0 138.0"/></svg></div>

  <div class="top-row">
    <div class="logo" aria-label="MZAD PHONE"><b>MZAD</b><small>PHONE</small></div>
    <h1 class="ttl-mini">السوق</h1>
    <button class="back" id="back" type="button" aria-label="رجوع">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>


  <div class="searchbox" id="searchBox">
    <svg class="ico-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" autocomplete="off" inputmode="search" placeholder="ابحث عن جهاز أو شركة" aria-label="بحث عن جهاز">
    <button class="clear" id="qClear" type="button" aria-label="مسح البحث">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>
    </button>
  </div>

</header>

<main class="wrap">
  <nav class="brands" id="brands" aria-label="الشركات"></nav>
  <div class="bar">
    <span class="count" id="count">جاري التحميل…</span>
    <div class="seg" role="group" aria-label="ترتيب النتائج">
      <button type="button" data-sort="newest" class="on">الأحدث</button>
      <button type="button" data-sort="low">الأرخص</button>
      <button type="button" data-sort="high">الأغلى</button>
    </div>
  </div>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg></div>
    <h3 id="sheetTitle">حذف المنشور؟</h3>
    <p>راح ينحذف منشورك نهائياً من السوق، وما يرجع. هذا الإجراء ما يمكن التراجع عنه.</p>
    <div class="sheet-actions">
      <button class="cancel" id="sheetCancel" type="button">إلغاء</button>
      <button class="confirm" id="sheetConfirm" type="button">حذف المنشور</button>
    </div>
  </div>
</div>

<nav class="dock" aria-label="التنقل">
  <div class="dock-in">
    <a href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg><span>الرئيسية</span></a>
    <a href="market.html" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8"/><path d="M8 13h8"/><path d="M8 17h5"/></svg><span>الأجهزة</span></a>
    <a href="sell.html"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span><span>إضافة</span></a>
    <a href="favorites.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/></svg><span>المفضلة</span></a>

  </div>

<div class="toast" id="toast" role="status"></div>

<script type="module">
import { supabase } from "./js/supabase.js";

const BUCKET = "device-images";
const LEGACY_BASE = "id,created_at,brand,model,storage,color,battery_health,condition,body_condition,screen_condition,price,location,sale_type,images,notes";

const BRAND_KEYS = {
  all:"all", apple:"Apple", iphone:"Apple", "i-phone":"Apple", samsung:"Samsung",
  xiaomi:"Xiaomi", redmi:"Xiaomi", poco:"Xiaomi", google:"Google", pixel:"Google",
  huawei:"Huawei", oppo:"OPPO", honor:"HONOR", oneplus:"OnePlus", realme:"realme",
  motorola:"Motorola", sony:"Sony", nokia:"Nokia", tecno:"Tecno", infinix:"Infinix"
};
const BRANDS = [["all","الكل"],["Apple","iPhone"],["Samsung","Samsung"],["Xiaomi","Xiaomi"],["Google","Google"],["Huawei","Huawei"],["OPPO","OPPO"],["HONOR","HONOR"],["OnePlus","OnePlus"],["realme","realme"],["Motorola","Motorola"],["Sony","Sony"],["Nokia","Nokia"],["Tecno","Tecno"],["Infinix","Infinix"]];
const SEARCH_PHRASES = [["برو ماكس","pro max"],["بروماكس","pro max"],["ون بلس","oneplus"],["ونبلس","oneplus"],["زد فولد","z fold"],["زد فليب","z flip"]];
const SEARCH_WORDS = {
  "ايفون":"iphone","ايفن":"iphone","ابل":"apple","سامسونج":"samsung","سامسنغ":"samsung",
  "جوجل":"google","غوغل":"google","قوقل":"google","بيكسل":"pixel","هواوي":"huawei",
  "شاومي":"xiaomi","شياومي":"xiaomi","ريدمي":"redmi","بوكو":"poco","اوبو":"oppo","هونر":"honor",
  "ريلمي":"realme","موتورولا":"motorola","سوني":"sony","نوكيا":"nokia","تكنو":"tecno",
  "انفنكس":"infinix","انفينيكس":"infinix","برو":"pro","ماكس":"max","بلس":"plus","بلاس":"plus",
  "الترا":"ultra","ميني":"mini","فولد":"fold","فليب":"flip","نوت":"note","ميت":"mate","زد":"z","اس":"s"
};
const SVG = {
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.7c0 5.4-8.8 10.3-8.8 10.3S3.2 14.1 3.2 8.7A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.5Z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M9.5 5.5h5"/><path d="M11 18.5h2"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/><path d="M8.5 11h5"/></svg>',
  bat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="16" height="10" rx="2.5"/><path d="M21.5 10.5v3"/><path d="M6 10.5v3"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5h.01"/></svg>'
};

const state = { devices:[], byId:new Map(), brand:"all", query:"", sort:"newest", userId:null,
  favKey:"mzad_phone_favorites:guest", favs:new Set(), pendingDelete:null };

const $ = id => document.getElementById(id);
const grid=$("grid"), chips=$("brands"), countEl=$("count"), input=$("q"),
      searchBox=$("searchBox"), sheet=$("sheet"), toastEl=$("toast"), topEl=$("top");

/* ---------- helpers ---------- */
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(m){
  toastEl.textContent = m;
  toastEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
}
function canonicalBrand(raw){
  const v = String(raw ?? "").trim();
  return v ? (BRAND_KEYS[v.toLowerCase()] || v) : "";
}
const brandLabel = key => BRANDS.find(([k]) => k === key)?.[1] || key;

function formatPrice(v){
  const n = Number(v);
  if(!Number.isFinite(n) || n <= 0) return "غير محدد";
  return new Intl.NumberFormat("en-US").format(n) + " د.ع";
}
function unit(n, one, two, few, many){
  if(n === 1) return one;
  if(n === 2) return two;
  return n <= 10 ? `${n} ${few}` : `${n} ${many}`;
}
function publishedText(ms){
  if(!ms) return "";
  const diff = Date.now() - ms;
  if(diff < 60000) return "نُشر للتو";
  const min = Math.floor(diff / 60000);
  if(min < 60) return "منذ " + unit(min,"دقيقة","دقيقتين","دقائق","دقيقة");
  const h = Math.floor(min / 60);
  if(h < 24) return "منذ " + unit(h,"ساعة","ساعتين","ساعات","ساعة");
  const d = Math.floor(h / 24);
  if(d < 7) return "منذ " + unit(d,"يوم","يومين","أيام","يوم");
  if(d < 30) return "منذ " + unit(Math.floor(d/7),"أسبوع","أسبوعين","أسابيع","أسبوع");
  if(d < 365) return "منذ " + unit(Math.floor(d/30),"شهر","شهرين","أشهر","شهر");
  return "منذ " + unit(Math.floor(d/365),"سنة","سنتين","سنوات","سنة");
}
function parseImages(v){
  if(!v) return [];
  if(Array.isArray(v)) return v.filter(Boolean).map(String);
  if(typeof v === "string"){
    const t = v.trim();
    if(!t) return [];
    try{ const p = JSON.parse(t); if(Array.isArray(p)) return p.filter(Boolean).map(String); }catch{}
    return [t];
  }
  return [];
}
function publicImage(path){
  const v = String(path ?? "").trim();
  if(!v) return "";
  if(/^(https?:|data:)/i.test(v)) return v;
  const clean = v.replace(/^\/+/, "").replace(/^device-images\//i, "");
  return supabase.storage.from(BUCKET).getPublicUrl(clean).data?.publicUrl || "";
}

/* ---------- search ---------- */
const AR_DIGITS = "٠١٢٣٤٥٦٧٨٩";
function normalizeText(v){
  return String(v ?? "").toLowerCase().normalize("NFKC")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/ـ/g,"").replace(/[\u064B-\u065F\u0670]/g,"")
    .replace(/[٠-٩]/g, d => String(AR_DIGITS.indexOf(d)))
    .replace(/[-–—_]/g," ").replace(/\s+/g," ").trim();
}
function expandQuery(v){
  let t = normalizeText(v);
  SEARCH_PHRASES.forEach(([f,to]) => { t = t.split(normalizeText(f)).join(to); });
  return t.split(" ").filter(Boolean).map(w => SEARCH_WORDS[w] || w).join(" ");
}
function makeHaystack(d, brand){
  const raw = [brand,d.brand,d.model,d.storage,d.color,d.battery_health,d.condition,d.screen_condition,d.body_condition,d.location,d.notes,
    String(d.sale_type||"").toLowerCase().includes("auction") ? "مزاد auction" : "بيع مباشر direct"]
    .filter(v => v !== null && v !== undefined).join(" ");
  return normalizeText(raw) + " " + expandQuery(raw);
}
function matchesQuery(d, q){
  const tokens = expandQuery(q).split(" ").filter(Boolean);
  return !tokens.length || tokens.every(t => d._haystack.includes(t));
}

/* ---------- load ---------- */
async function initScope(){
  try{
    const { data } = await supabase.auth.getUser();
    state.userId = data?.user?.id || null;
  }catch(e){ console.warn("USER SCOPE:", e); state.userId = null; }

  state.favKey = state.userId ? `mzad_phone_favorites:user:${state.userId}` : "mzad_phone_favorites:guest";
  try{
    const saved = JSON.parse(localStorage.getItem(state.favKey) || "[]");
    state.favs = new Set(Array.isArray(saved) ? saved.map(String) : []);
  }catch{ state.favs = new Set(); }
}
function saveFavs(){
  try{ localStorage.setItem(state.favKey, JSON.stringify([...state.favs])); }catch{}
}
async function fetchLegacy(){
  const variants = [`${LEGACY_BASE},user_id,ends_at`,`${LEGACY_BASE},user_id`,`${LEGACY_BASE},ends_at`,LEGACY_BASE];
  let lastError = null;
  for(const cols of variants){
    const { data, error } = await supabase.from("devices").select(cols).order("created_at",{ascending:false});
    if(!error) return data || [];
    lastError = error;
  }
  throw lastError;
}
async function signImage(image){
  const path = String(image.storage_path || "").replace(/^\/+/, "");
  if(!path) return "";
  if(/^(https?:|data:)/i.test(path)) return path;
  const { data, error } = await supabase.storage.from(BUCKET).createSignedUrl(path, 3600);
  if(!error && data?.signedUrl) return data.signedUrl;
  return publicImage(path);
}
async function fetchMzad(){
  const { data, error } = await supabase
    .from("mzad_direct_sales")
    .select("id,created_at,asking_price_iqd,status,device_id,device:mzad_devices!mzad_direct_sales_device_id_fkey(id,brand,model,storage,color,battery_health,condition_grade,screen_condition,camera_condition,biometric_condition,seller_notes,mzad_device_images(storage_path,sort_order,is_primary))")
    .in("status", ["active","reserved","pending_handover"])
    .order("created_at",{ascending:false});
  if(error) throw error;

  const rows = (data || []).filter(i => i.device);
  const deviceIds = [...new Set(rows.map(item => item.device.id).filter(Boolean))];
  const imageResult = deviceIds.length
    ? await supabase.from("mzad_device_images")
        .select("device_id, storage_path, sort_order, is_primary")
        .in("device_id", deviceIds)
        .order("sort_order", { ascending: true })
    : { data: [], error: null };
  if (imageResult.error) throw imageResult.error;
  const imagesByDevice = new Map();
  for (const image of (imageResult.data || [])) {
    const key = String(image.device_id);
    if (!imagesByDevice.has(key)) imagesByDevice.set(key, []);
    imagesByDevice.get(key).push(image);
  }
  return Promise.all(rows.map(async item => {
    const d = item.device;
    const imgs = imagesByDevice.get(String(d.id)) || [];
    // device-images مخزن عام؛ استخدم الرابط العام مباشرة.
    const urls = imgs.map(image => publicImage(image.storage_path));
    return {
      id:d.id, created_at:item.created_at, brand:d.brand, model:d.model, storage:d.storage, color:d.color,
      battery_health:d.battery_health, condition:d.condition_grade, body_condition:d.condition_grade,
      screen_condition:d.screen_condition, price:item.asking_price_iqd, location:"النجف",
      sale_type:"direct", images:urls.filter(Boolean), notes:d.seller_notes, _mzad:true
    };
  }));
}
function normalizeDevice(raw){
  const brand = canonicalBrand(raw.brand);
  // الصور القادمة من mzad جاهزة (روابط موقعة) وlegacy تمر عبر publicImage
  const images = parseImages(raw.images).map(publicImage).filter(Boolean);
  return {
    ...raw,
    id:String(raw.id),
    _brand:brand,
    _auction:String(raw.sale_type||"").toLowerCase().includes("auction"),
    _img:images[0] || "",
    _ends:raw.ends_at ? new Date(raw.ends_at).getTime() : 0,
    _created:raw.created_at ? new Date(raw.created_at).getTime() : 0,
    _price:Number(raw.price) || 0,
    _owned:!!state.userId && !raw._mzad && raw.user_id === state.userId,
    _haystack:makeHaystack(raw, brand)
  };
}
async function load(){
  showSkeleton();
  try{
    const [legacyRows, mzadRows] = await Promise.all([
      fetchLegacy(),
      fetchMzad().catch(e => { console.warn("MZAD LISTINGS:", e); return []; })
    ]);
    state.devices = [...legacyRows, ...mzadRows].map(normalizeDevice).sort((a,b) => b._created - a._created);
    state.byId = new Map(state.devices.map(d => [d.id, d]));
    render();
  }catch(e){
    console.error("LOAD DEVICES ERROR:", e);
    showError();
  }
}

/* ---------- filter ---------- */
function visibleDevices(){
  const list = state.devices.filter(d =>
    (state.brand === "all" || d._brand === state.brand) && (!state.query || matchesQuery(d, state.query)));
  const byPrice = (a,b,dir) => {
    if(!a._price && !b._price) return 0;
    if(!a._price) return 1;
    if(!b._price) return -1;
    return dir * (a._price - b._price);
  };
  if(state.sort === "low") list.sort((a,b) => byPrice(a,b,1));
  else if(state.sort === "high") list.sort((a,b) => byPrice(a,b,-1));
  else list.sort((a,b) => b._created - a._created);
  return list;
}

/* ---------- render ---------- */
function titleOf(d){
  const model = String(d.model || "").trim();
  if(d._brand === "Apple") return model || "iPhone";
  return [d._brand, model].filter(Boolean).join(" ") || "جهاز";
}
function titleHTML(d){
  const model = String(d.model || "").trim();
  if(d._brand === "Apple") return esc(model || "iPhone");
  return esc(model || d._brand || "جهاز");
}
function specsOf(d){
  // اعرض صحة البطارية كرقم صحيح فقط؛ تجاهل القيم التالفة مثل "i%" أو النصوص.
  const rawBattery = String(d.battery_health ?? "").trim();
  const matchBattery = rawBattery.match(/(?:^|[^0-9])(100|[1-9]?\d)(?:\s*%|$)/);
  const batteryNumber = matchBattery ? Number(matchBattery[1]) : NaN;
  const list = [d.storage, d.color].map(v => String(v ?? "").trim()).filter(Boolean).map(t => ({ t }));
  if(Number.isInteger(batteryNumber) && batteryNumber >= 1 && batteryNumber <= 100) {
    list.push({ t: batteryNumber + "%", bat: true });
  }
  return list.slice(0,3);
}
function cardHTML(d, i){
  const ended = d._auction && d._ends && d._ends <= Date.now();
  const fav = state.favs.has(d.id);
  const title = titleOf(d);
  const specs = specsOf(d);
  const n = Number(d.price);
  const price = n > 0 ? `${new Intl.NumberFormat("en-US").format(n)}<i>د.ع</i>` : "غير محدد";
  const badge = d._auction
    ? `<span class="badge ${ended ? "end" : "auc"}">${ended ? "انتهى المزاد" : "مزاد"}</span>`
    : `<span class="badge">بيع مباشر</span>`;
  const image = d._img
    ? `<img src="${esc(d._img)}" alt="${esc(title)}" loading="lazy" decoding="async" draggable="false" onload="this.classList.add('ready');this.classList.add(this.naturalWidth/this.naturalHeight>1.12?'photo-landscape':(this.naturalHeight/this.naturalWidth>1.12?'photo-portrait':'photo-square'))" onerror="this.remove()">`
    : "";
  return `
  <article class="card${d._owned ? " owned" : ""}" data-id="${esc(d.id)}" style="--i:${Math.min(i, 8)}">
    <div class="pic"${d._img ? ` style="--img:url('${esc(d._img)}')"` : ""}>
      <div class="ph">${SVG.phone}</div>
      ${image}
      ${d._brand ? `<span class="btag">${esc(d._brand)}</span>` : ""}
      <button class="fav${fav ? " on" : ""}" type="button" data-fav="${esc(d.id)}" aria-label="المفضلة">${SVG.heart}</button>
      ${d._owned ? `<button class="del" type="button" data-del="${esc(d.id)}" aria-label="حذف منشوري">${SVG.trash}</button>` : ""}
    </div>
    <div class="info">
      <h3 class="name" title="${esc(title)}">${titleHTML(d)}</h3>
      ${specs.length ? `<div class="specs">${specs.map(x => `<span${x.bat ? ' class="bat"' : ""}>${x.bat ? SVG.bat : ""}${esc(x.t)}</span>`).join("")}</div>` : ""}
      <div class="foot">
        <div class="pricecol">
          <span class="price">${price}</span>
          ${d._created ? `<span class="time" data-created="${d._created}"><span>${esc(publishedText(d._created))}</span></span>` : ""}
        </div>
        ${badge}
      </div>
    </div>
  </article>`;
}
function emptyHTML(){
  let title = "السوق فاضي حالياً", text = "أول ما ينضاف جهاز راح يظهر هنا.";
  if(state.query){ title = "ما لقينا نتائج"; text = "جرّب كلمة ثانية أو امسح البحث."; }
  else if(state.brand !== "all"){ title = `ماكو أجهزة ${brandLabel(state.brand)} حالياً`; text = "جرّب شركة ثانية أو اشيل الفلتر."; }
  return `<div class="empty"><div class="ico">${SVG.search}</div><h3>${esc(title)}</h3><p>${esc(text)}</p><button type="button" data-reset>عرض كل الأجهزة</button></div>`;
}
function showSkeleton(){
  grid.innerHTML = '<div class="sk"></div>'.repeat(4);
  countEl.textContent = "جاري التحميل…";
}
function showError(){
  grid.innerHTML = `<div class="error"><div class="ico">${SVG.alert}</div><h3>تعذر تحميل الأجهزة</h3><p>تأكد من الاتصال بالإنترنت وحاول مرة ثانية.</p><button type="button" data-retry>إعادة المحاولة</button></div>`;
  countEl.textContent = "تعذر التحميل";
}
function renderChips(){
  chips.innerHTML = BRANDS.map(([k,l]) =>
    `<button class="chip${state.brand === k ? " on" : ""}" type="button" data-brand="${esc(k)}">${esc(l)}</button>`).join("");
}
function render(){
  const list = visibleDevices();
  renderChips();
  document.querySelectorAll("[data-sort]").forEach(b => b.classList.toggle("on", b.dataset.sort === state.sort));
  countEl.innerHTML = state.query ? `<b>${list.length}</b> نتيجة` : `<b>${list.length}</b> جهاز`;
  grid.innerHTML = list.length ? list.map(cardHTML).join("") : emptyHTML();
}
function refreshPublishedTimes(){
  document.querySelectorAll("[data-created]").forEach(el => {
    const s = el.querySelector("span");
    if(s) s.textContent = publishedText(Number(el.dataset.created));
  });
}
setInterval(refreshPublishedTimes, 30000);

/* ---------- favorites ---------- */
function toggleFav(id){
  const on = !state.favs.has(id);
  on ? state.favs.add(id) : state.favs.delete(id);
  saveFavs();
  document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`).forEach(b => {
    b.classList.toggle("on", on);
    if(on){ b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
  });
  toast(on ? "تمت الإضافة إلى المفضلة" : "تمت الإزالة من المفضلة");
}

/* ---------- delete (owner) ---------- */
function openSheet(id){
  state.pendingDelete = id;
  sheet.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add("open")));
}
function closeSheet(){
  sheet.classList.remove("open");
  setTimeout(() => {
    if(!sheet.classList.contains("open")){ sheet.hidden = true; state.pendingDelete = null; }
  }, 260);
}
async function confirmDelete(){
  const id = state.pendingDelete;
  if(!id || !state.userId) return;
  const btn = $("sheetConfirm");
  btn.disabled = true;
  btn.textContent = "جاري الحذف…";
  try{
    const { data, error } = await supabase.from("devices").delete().eq("id", id).eq("user_id", state.userId).select("id");
    if(error) throw error;
    if(!data || !data.length) throw new Error("لم يتم حذف أي صف");

    state.devices = state.devices.filter(d => d.id !== id);
    state.byId.delete(id);
    if(state.favs.delete(id)) saveFavs();

    const card = grid.querySelector(`[data-id="${CSS.escape(id)}"]`);
    closeSheet();
    if(card){ card.classList.add("removing"); setTimeout(render, 280); } else render();
    toast("تم حذف منشورك");
  }catch(e){
    console.error("DELETE DEVICE ERROR:", e);
    toast("ما قدرنا نحذف المنشور، جرّب مرة ثانية");
  }finally{
    btn.disabled = false;
    btn.textContent = "حذف المنشور";
  }
}

/* ---------- events ---------- */
function syncUrlBrand(){
  const url = new URL(window.location.href);
  if(state.brand === "all") url.searchParams.delete("brand");
  else url.searchParams.set("brand", state.brand === "Apple" ? "iphone" : state.brand.toLowerCase());
  window.history.replaceState({}, "", url);
}

grid.addEventListener("click", e => {
  if(e.target.closest("[data-retry]")){ load(); return; }
  if(e.target.closest("[data-reset]")){
    state.brand = "all"; state.query = ""; input.value = "";
    searchBox.classList.remove("has-value");
    syncUrlBrand(); render(); return;
  }
  const del = e.target.closest("[data-del]");
  if(del){ e.stopPropagation(); openSheet(del.dataset.del); return; }
  const fav = e.target.closest("[data-fav]");
  if(fav){ e.stopPropagation(); toggleFav(fav.dataset.fav); return; }

  const card = e.target.closest(".card");
  if(!card) return;
  const d = state.byId.get(card.dataset.id);
  if(!d) return;
  const page = d._auction ? "auction-details.html" : "device.html";
  window.location.href = `${page}?id=${encodeURIComponent(d.id)}`;
});

chips.addEventListener("click", e => {
  const btn = e.target.closest("[data-brand]");
  if(!btn) return;
  state.brand = btn.dataset.brand;
  syncUrlBrand();
  render();
  chips.querySelector(".chip.on")?.scrollIntoView({ inline:"center", block:"nearest", behavior:"smooth" });
});

document.querySelector(".seg").addEventListener("click", e => {
  const btn = e.target.closest("[data-sort]");
  if(!btn) return;
  state.sort = btn.dataset.sort;
  render();
});

let searchTimer = null;
input.addEventListener("input", () => {
  state.query = input.value.trim();
  searchBox.classList.toggle("has-value", !!input.value);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 140);
});
input.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  e.preventDefault();
  state.query = input.value.trim();
  input.blur();
  render();
});
input.addEventListener("focus", () => document.body.classList.add("kb"));
input.addEventListener("blur", () => setTimeout(() => document.body.classList.remove("kb"), 150));

$("qClear").addEventListener("click", () => {
  input.value = ""; state.query = "";
  searchBox.classList.remove("has-value");
  render(); input.focus();
});
$("back").addEventListener("click", e => {
  e.preventDefault();
  if(window.history.length > 1) window.history.back();
  else window.location.href = "home.html";
});
$("sheetCancel").addEventListener("click", closeSheet);
$("sheetBackdrop").addEventListener("click", closeSheet);
$("sheetConfirm").addEventListener("click", confirmDelete);
document.addEventListener("keydown", e => { if(e.key === "Escape" && !sheet.hidden) closeSheet(); });

window.addEventListener("scroll", () => topEl.classList.toggle("scrolled", window.scrollY > 24), { passive:true });

/* ---------- start ---------- */
const params = new URLSearchParams(window.location.search);
state.brand = canonicalBrand(params.get("brand")) || "all";

const incoming = params.get("search") || sessionStorage.getItem("mzad_search_query") || "";
if(incoming){
  input.value = incoming;
  state.query = incoming.trim();
  searchBox.classList.add("has-value");
}
sessionStorage.removeItem("mzad_search_query");

renderChips();
initScope().finally(load);
</script>
</body>
</html>
