<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#ece8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MZAD PHONE">
<title>MZAD PHONE — السوق</title>

<style>
:root{
  --bg:#f7f6fc;
  --ink:#141022;
  --muted:#7a7390;
  --line:#ebe8f5;
  --edge:#ddd8f8;
  --p:#6246d9;
  --p-2:#8b6cf0;
  --p-dark:#4a34b8;
  --p-soft:#f1edff;
  --panel:#15112b;
  --accent:#c9bcff;
  --ok:#1e8a5a;
  --hot:#ff6b35;
  --danger:#e5365f;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}

html,body{margin:0}
body{
  min-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  padding-bottom:calc(96px + var(--safe-bottom));
}

button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

.wrap{width:min(100%,680px);margin:0 auto}

/* ================= HERO ================= */

.hero{
  position:relative;
  overflow:hidden;
  color:var(--ink);
  padding:calc(14px + var(--safe-top)) 16px 20px;
  border-radius:0 0 24px 24px;
  background:linear-gradient(145deg,#fff 0%,#f7f5ff 55%,#ece8ff 100%);
  border-bottom:1px solid var(--line);
  box-shadow:0 10px 26px rgba(23,32,42,.06);
}
.hero::before,.hero::after{
  content:"";
  position:absolute;
  border-radius:50%;
  filter:blur(42px);
  opacity:.35;
  pointer-events:none;
}
.hero::before{
  width:250px;height:250px;top:-120px;inset-inline-start:-80px;
  background:radial-gradient(circle,#8b6cf0 0%,transparent 70%);
  animation:blob 9s ease-in-out infinite alternate;
}
.hero::after{
  width:270px;height:270px;bottom:-160px;inset-inline-end:-100px;
  background:radial-gradient(circle,#32b8c4 0%,transparent 70%);
  animation:blob 11s ease-in-out infinite alternate-reverse;
}
@keyframes blob{to{transform:translate3d(28px,-16px,0) scale(1.08)}}

.hero-top{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:12px;
}
.back{
  width:42px;height:42px;flex:0 0 42px;
  display:grid;place-items:center;
  border-radius:14px;
  background:#fff;
  border:1px solid var(--edge);
  color:var(--p);
  box-shadow:0 7px 18px rgba(23,32,42,.06);
  transition:transform .15s ease;
}
.back:active{transform:scale(.92)}
.back svg{width:20px;height:20px}
.hero-title{min-width:0;flex:1}
.hero-title h1{
  margin:0;
  font-size:27px;
  font-weight:950;
  letter-spacing:-.03em;
  line-height:1.1;
}
.hero-title p{
  margin:4px 0 0;
  font-size:11px;
  font-weight:700;
  color:var(--muted);
}

.stats{
  position:relative;z-index:1;
  display:grid;grid-template-columns:1fr 1fr;gap:9px;
  margin-top:15px;
}
.stat{
  padding:10px 12px;
  border-radius:16px;
  background:#fff;
  border:1px solid var(--edge);
  box-shadow:0 6px 16px rgba(23,32,42,.05);
  display:flex;flex-direction:column;gap:3px;
}
.stat b{
  font-size:16px;
  font-weight:900;
  color:var(--ink);
  letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
}
.stat span{
  display:flex;align-items:center;gap:6px;
  font-size:10px;font-weight:800;color:var(--muted);
}
.live{
  width:7px;height:7px;border-radius:50%;
  background:#22c55e;
  animation:ping 1.8s infinite;
}
@keyframes ping{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}
  70%,100%{box-shadow:0 0 0 9px rgba(34,197,94,0)}
}

.searchbox{
  position:relative;z-index:1;
  margin-top:14px;
}
.searchbox input{
  width:100%;height:50px;
  border-radius:18px;
  border:1px solid var(--edge);
  background:#fff;
  padding:0 46px 0 46px;
  color:var(--ink);
  font-size:14px;font-weight:750;
  outline:none;
  box-shadow:0 8px 22px rgba(98,70,217,.08);
  transition:box-shadow .25s ease,border-color .25s ease;
}
.searchbox input::placeholder{color:#9aa0ad;font-weight:650}
.searchbox input:focus{border-color:#a99cf0;box-shadow:0 0 0 4px rgba(98,70,217,.10)}
.searchbox .ico-s{
  position:absolute;top:50%;inset-inline-end:15px;
  transform:translateY(-50%);
  width:20px;height:20px;
  color:var(--p);
  pointer-events:none;
}
.searchbox .clear{
  position:absolute;top:50%;inset-inline-start:8px;
  transform:translateY(-50%);
  width:34px;height:34px;
  display:none;place-items:center;
  border-radius:12px;
  background:var(--p-soft);
  color:var(--p-dark);
}
.searchbox.has-value .clear{display:grid}
.searchbox .clear svg{width:15px;height:15px}

/* ================= BRANDS ================= */

.brands{
  display:flex;gap:8px;
  overflow-x:auto;
  padding:16px 16px 4px;
  scrollbar-width:none;
  scroll-snap-type:x proximity;
}
.brands::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  height:36px;
  padding:0 15px;
  border-radius:12px;
  background:#fff;
  border:1px solid var(--edge);
  color:#4b4560;
  font-size:12px;font-weight:850;
  box-shadow:0 4px 12px rgba(24,20,55,.04);
  transition:background .2s,color .2s,box-shadow .2s,transform .15s;
  scroll-snap-align:start;
}
.chip:active{transform:scale(.95)}
.chip.on{
  background:linear-gradient(145deg,#6246d9,#8b6cf0);
  border-color:transparent;
  color:#fff;
  box-shadow:0 10px 20px -8px rgba(98,70,217,.55);
}

/* ================= TOOLBAR ================= */

.bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px 4px;
}
.count{font-size:12px;font-weight:800;color:var(--muted)}
.count b{color:var(--ink);font-weight:950}

.seg{
  display:flex;gap:2px;
  padding:3px;
  border-radius:14px;
  background:#ebe8f7;
}
.seg button{
  height:30px;padding:0 11px;
  border-radius:11px;
  font-size:11px;font-weight:850;
  color:#6b6585;
  transition:background .2s,color .2s,box-shadow .2s;
}
.seg button.on{
  background:#fff;
  color:var(--p-dark);
  box-shadow:0 4px 10px rgba(40,30,90,.12);
}

/* ================= GRID ================= */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  padding:12px 16px 0;
}
@media(min-width:640px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
}

/* ================= CARD ================= */

.card{
  position:relative;
  aspect-ratio:7/11;
  border-radius:20px;
  overflow:hidden;
  isolation:isolate;
  background:var(--panel);
  color:#fff;
  box-shadow:0 14px 28px -16px rgba(30,20,80,.6);
  cursor:pointer;
  animation:cardIn .6s cubic-bezier(.2,.8,.3,1) backwards;
  animation-delay:calc(var(--i,0) * 55ms);
  transition:transform .25s ease,box-shadow .25s ease;
}
.grid.settled .card{animation:none}
@media(hover:hover){
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 22px 40px -16px rgba(30,20,80,.6);
  }
  .card:hover .media img{transform:scale(1.05)}
}
.card:active{transform:scale(.98)}
.card.removing{animation:cardOut .28s ease forwards}

@keyframes cardIn{
  from{opacity:0;transform:translateY(18px) scale(.98)}
  to{opacity:1;transform:none}
}
@keyframes cardOut{
  to{opacity:0;transform:scale(.9)}
}

/* الصورة تاخذ أغلب الكارت، والتفاصيل بلوحة واضحة تحت */
.media{
  position:absolute;
  top:0;left:0;right:0;
  height:58%;
  overflow:hidden;
  background:linear-gradient(160deg,#7b61e8 0%,#3b2a92 60%,#1d1460 100%);
}
.media::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:0;
  height:40%;
  background:linear-gradient(to top,var(--panel),rgba(21,17,43,0));
  pointer-events:none;
}
.ph{
  position:absolute;inset:0;
  display:grid;place-items:center;
  color:rgba(255,255,255,.5);
}
.ph svg{width:38px;height:38px}
.media img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center;
  opacity:0;
  transition:opacity .5s ease,transform .8s cubic-bezier(.2,.8,.3,1);
}
.media img.ready{opacity:1}

.shine{
  position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);
  transform:translateX(120%);
  animation:sweep 7s ease-in-out infinite;
  animation-delay:calc(var(--i,0) * .9s + 1s);
  pointer-events:none;
  z-index:1;
}
@keyframes sweep{
  0%,50%{transform:translateX(120%)}
  100%{transform:translateX(-120%)}
}

.fav,.del{
  position:absolute;top:10px;z-index:4;
  width:32px;height:32px;
  display:grid;place-items:center;
  border-radius:11px;
  color:#fff;
  background:rgba(21,17,43,.45);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .15s ease,background .2s ease,color .2s ease;
}
.fav{inset-inline-start:10px}
.del{
  inset-inline-end:10px;
  color:#ffd6dd;
  background:rgba(229,54,95,.55);
  border-color:rgba(255,160,180,.4);
}
.fav:active,.del:active{transform:scale(.86)}
.fav svg,.del svg{width:16px;height:16px}
.fav.on{background:#fff;color:var(--danger)}
.fav.on svg{fill:var(--danger)}

.timer{
  position:absolute;
  top:50px;
  inset-inline-start:10px;
  z-index:4;
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;
  border-radius:999px;
  background:rgba(21,17,43,.6);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.18);
  font-size:10px;font-weight:900;
  font-variant-numeric:tabular-nums;
  direction:ltr;
  white-space:nowrap;
}
.timer::before{
  content:"";
  width:5px;height:5px;border-radius:50%;
  background:#22c55e;
  animation:pulse 1.6s infinite;
}
.timer.urgent{background:rgba(255,107,53,.9);border-color:transparent}
.timer.urgent::before{background:#fff}
.card.is-ended .timer{background:rgba(75,69,96,.9)}
.card.is-ended .timer::before{display:none}
@keyframes pulse{50%{opacity:.3}}

/* لوحة التفاصيل */
.info{
  position:absolute;
  left:0;right:0;bottom:0;
  z-index:2;
  padding:0 12px 13px;
  display:flex;flex-direction:column;gap:4px;
  background:var(--panel);
}
.time{
  display:flex;align-items:center;gap:4px;
  min-width:0;
  font-size:9px;font-weight:750;
  color:rgba(255,255,255,.55);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.time svg{width:10px;height:10px;flex:0 0 10px}
.name{
  margin:0;
  font-size:13px;font-weight:950;
  line-height:1.3;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.specs{
  margin:0;
  font-size:10px;font-weight:700;
  color:rgba(255,255,255,.62);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.price{
  display:flex;align-items:baseline;justify-content:space-between;gap:6px;
  margin-top:5px;
  padding-top:7px;
  border-top:1px solid rgba(255,255,255,.12);
}
.price small{
  font-size:9px;font-weight:800;
  color:var(--accent);
  white-space:nowrap;
}
.price b{
  font-size:15px;font-weight:950;
  letter-spacing:-.01em;
  white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}

/* ================= STATES ================= */

.sk{
  aspect-ratio:7/11;
  border-radius:20px;
  background:linear-gradient(90deg,#efecfa 25%,#faf9ff 50%,#efecfa 75%);
  background-size:200% 100%;
  animation:shim 1.3s linear infinite;
}
@keyframes shim{to{background-position:-200% 0}}

.empty,.error{
  grid-column:1/-1;
  padding:34px 20px;
  border-radius:24px;
  background:#fff;
  border:1px solid var(--line);
  text-align:center;
  box-shadow:0 14px 30px -18px rgba(30,20,80,.25);
}
.empty .ico,.error .ico{
  width:56px;height:56px;margin:0 auto 12px;
  border-radius:18px;
  background:var(--p-soft);color:var(--p-dark);
  display:grid;place-items:center;
}
.empty .ico svg,.error .ico svg{width:26px;height:26px}
.empty h3,.error h3{margin:0;font-size:15px;font-weight:950}
.empty p,.error p{
  margin:6px 0 0;
  font-size:11.5px;line-height:1.6;
  font-weight:700;color:var(--muted);
}
.empty button,.error button{
  margin-top:14px;height:40px;padding:0 18px;
  border-radius:13px;
  background:linear-gradient(145deg,#6246d9,#8b6cf0);
  color:#fff;font-size:12px;font-weight:900;
  box-shadow:0 10px 20px -10px rgba(98,70,217,.6);
}

/* ================= DELETE SHEET ================= */

.sheet-wrap{
  position:fixed;inset:0;z-index:300;
  display:flex;align-items:flex-end;justify-content:center;
  padding:12px;
  pointer-events:none;
}
.sheet-wrap.open{pointer-events:auto}
.sheet-backdrop{
  position:absolute;inset:0;
  background:rgba(14,9,40,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;
  transition:opacity .25s ease;
}
.sheet-wrap.open .sheet-backdrop{opacity:1}
.sheet{
  position:relative;
  width:min(100%,420px);
  margin-bottom:calc(10px + var(--safe-bottom));
  padding:24px 20px 18px;
  border-radius:26px;
  background:#fff;
  text-align:center;
  box-shadow:0 30px 60px -20px rgba(14,9,40,.5);
  transform:translateY(34px);
  opacity:0;
  transition:transform .3s cubic-bezier(.2,.8,.3,1),opacity .25s ease;
}
.sheet-wrap.open .sheet{transform:none;opacity:1}
.sheet-icon{
  width:58px;height:58px;margin:0 auto 12px;
  border-radius:20px;
  background:#ffe8ee;color:var(--danger);
  display:grid;place-items:center;
}
.sheet-icon svg{width:26px;height:26px}
.sheet h3{margin:0;font-size:17px;font-weight:950}
.sheet p{
  margin:7px 0 0;
  font-size:12px;line-height:1.7;
  font-weight:700;color:var(--muted);
}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.sheet-actions button{
  height:46px;border-radius:15px;
  font-size:13px;font-weight:900;
}
.sheet-actions .cancel{background:#f3f1fa;color:var(--ink)}
.sheet-actions .confirm{
  background:linear-gradient(145deg,#e5365f,#ff6b6b);
  color:#fff;
  box-shadow:0 10px 20px -10px rgba(229,54,95,.7);
}
.sheet-actions button:disabled{opacity:.6}

/* ================= DOCK ================= */

.dock{
  position:fixed;left:0;right:0;bottom:0;
  z-index:100;
  padding:8px 12px calc(8px + var(--safe-bottom));
  pointer-events:none;
  transition:transform .2s ease;
}
body.kb .dock{transform:translateY(140%)}
.dock-in{
  pointer-events:auto;
  width:min(100%,500px);
  margin:0 auto;
  padding:5px;
  border-radius:22px;
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);
  box-shadow:0 14px 34px -12px rgba(30,20,80,.25);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;
}
.dock a{
  height:52px;
  border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:#7e8992;
  font-size:9px;font-weight:900;
  transition:background .2s ease,color .2s ease,transform .15s ease;
}
.dock a:active{transform:scale(.94)}
.dock a.on{color:var(--p-dark);background:var(--p-soft)}
.dock svg{width:19px;height:19px}
.dock .plus{
  width:38px;height:38px;border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#6246d9,#8b6cf0);
  color:#fff;
  box-shadow:0 8px 16px -6px rgba(98,70,217,.6);
}
.dock .plus svg{width:20px;height:20px}

/* ================= TOAST ================= */

.toast{
  position:fixed;left:50%;
  bottom:calc(92px + var(--safe-bottom));
  transform:translateX(-50%) translateY(14px);
  max-width:calc(100% - 40px);
  padding:10px 16px;
  border-radius:14px;
  background:#1d1836;color:#fff;
  font-size:11.5px;font-weight:800;
  text-align:center;
  box-shadow:0 14px 34px -10px rgba(10,5,40,.5);
  opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
  z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:360px){
  .hero-title h1{font-size:24px}
  .name{font-size:12px}
  .price b{font-size:14px}
  .dock a{font-size:8px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<header class="hero">
  <div class="hero-top">
    <button class="back" id="back" type="button" aria-label="رجوع">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="hero-title">
      <h1>السوق</h1>
      <p>أهلاً بيك في سوق مزاد فون، كل الأجهزة بمكان واحد</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <b id="statTotal">0</b>
      <span>جهاز معروض</span>
    </div>
    <div class="stat">
      <b id="statAuc">0</b>
      <span><i class="live"></i>مزاد مباشر</span>
    </div>
  </div>

  <div class="searchbox" id="searchBox">
    <svg class="ico-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" autocomplete="off" inputmode="search" placeholder='ابحث: iPhone 15 Pro، سامسونج، 256GB' aria-label="بحث عن جهاز">
    <button class="clear" id="qClear" type="button" aria-label="مسح البحث">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>
    </button>
  </div>
</header>

<main class="wrap">

  <nav class="brands" id="brands" aria-label="الشركات"></nav>

  <div class="bar">
    <span class="count" id="count">جاري التحميل…</span>
    <div class="seg" role="group" aria-label="ترتيب النتائج">
      <button type="button" data-sort="newest" class="on">الأحدث</button>
      <button type="button" data-sort="low">الأرخص</button>
      <button type="button" data-sort="high">الأغلى</button>
    </div>
  </div>

  <section class="grid" id="grid" aria-live="polite"></section>

</main>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg>
    </div>
    <h3 id="sheetTitle">حذف المنشور؟</h3>
    <p>راح ينحذف منشورك نهائياً من السوق، وما يرجع. هذا الإجراء ما يمكن التراجع عنه.</p>
    <div class="sheet-actions">
      <button class="cancel" id="sheetCancel" type="button">إلغاء</button>
      <button class="confirm" id="sheetConfirm" type="button">حذف المنشور</button>
    </div>

</div>

const SEARCH_WORDS = {

  "جوجل":"google", "غوغل":"google", "قوقل":"google",

  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M9.5 5.5h5"/><path d="M11 18.5h2"/></svg>',

const state = {
  devices: [],
  byId: new Map(),
  brand: "all",
  query: "",

  favKey: "mzad_phone_favorites:guest",

};

/* =========================================
   ELEMENTS
========================================= */

const $ = id => document.getElementById(id);

const grid = $("grid");
const chips = $("brands");
const countEl = $("count");
const input = $("q");
const searchBox = $("searchBox");
const sheet = $("sheet");
const toastEl = $("toast");

/* =========================================
   HELPERS
========================================= */

function esc(value){
  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}

function toast(message){
  toastEl.textContent = message;
  toastEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function canonicalBrand(raw){
  const value = String(raw ?? "").trim();
  if(!value) return "";
  const lower = value.toLowerCase();
  return BRAND_KEYS[lower] || value;
}

function brandLabel(key){
  return BRANDS.find(([k]) => k === key)?.[1] || key;
}

function formatPrice(value){
  const n = Number(value);
  if(!Number.isFinite(n) || n <= 0) return "السعر غير محدد";
  return new Intl.NumberFormat("en-US").format(n) + " د.ع";
}

function unit(n, one, two, few, many){
  if(n === 1) return one;
  if(n === 2) return two;
  if(n >= 3 && n <= 10) return `${n} ${few}`;
  return `${n} ${many}`;
}

function publishedText(ms){
  if(!ms) return "";
  const diff = Date.now() - ms;
  if(diff < 60000) return "نُشر للتو";

  const minutes = Math.floor(diff / 60000);
  if(minutes < 60) return "نُشر قبل " + unit(minutes, "دقيقة", "دقيقتين", "دقائق", "دقيقة");

  const hours = Math.floor(minutes / 60);
  if(hours < 24) return "نُشر قبل " + unit(hours, "ساعة", "ساعتين", "ساعات", "ساعة");

  const days = Math.floor(hours / 24);
  if(days < 7) return "نُشر قبل " + unit(days, "يوم", "يومين", "أيام", "يوم");

  if(days < 30){
    const weeks = Math.floor(days / 7);
    return "نُشر قبل " + unit(weeks, "أسبوع", "أسبوعين", "أسابيع", "أسبوع");
  }

  if(days < 365){
    const months = Math.floor(days / 30);
    return "نُشر قبل " + unit(months, "شهر", "شهرين", "أشهر", "شهر");
  }

  const years = Math.floor(days / 365);
  return "نُشر قبل " + unit(years, "سنة", "سنتين", "سنوات", "سنة");
}

function fmtLeft(ms){
  if(ms <= 0) return "انتهى";
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const p = n => String(n).padStart(2, "0");
  return d > 0 ? `${d} يوم ${h} س` : `${p(h)}:${p(m)}:${p(sec)}`;
}

function parseImages(value){
  if(!value) return [];
  if(Array.isArray(value)) return value.filter(Boolean).map(String);
  if(typeof value === "string"){
    const text = value.trim();
    if(!text) return [];
    try{
      const parsed = JSON.parse(text);
      if(Array.isArray(parsed)) return parsed.filter(Boolean).map(String);
    }catch{}
    return [text];
  }
  return [];
}

function publicImage(path){
  const value = String(path ?? "").trim();
  if(!value) return "";
  if(/^(https?:|data:)/i.test(value)) return value;
  const clean = value.replace(/^\/+/, "").replace(/^device-images\//i, "");
  return supabase.storage.from(BUCKET).getPublicUrl(clean).data?.publicUrl || "";
}

/* ----- search ----- */

const AR_DIGITS = "٠١٢٣٤٥٦٧٨٩";

function normalizeText(value){
  return String(value ?? "")
    .toLowerCase()
    .normalize("NFKC")
    .replace(/[أإآٱ]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/ؤ/g, "و")
    .replace(/ئ/g, "ي")
    .replace(/ـ/g, "")
    .replace(/[ً-ٰٟ]/g, "")
    .replace(/[٠-٩]/g, d => String(AR_DIGITS.indexOf(d)))
    .replace(/[-–—_]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function expandQuery(value){
  let text = normalizeText(value);
  SEARCH_PHRASES.forEach(([from, to]) => {
    text = text.split(normalizeText(from)).join(to);
  });
  return text
    .split(" ")
    .filter(Boolean)
    .map(word => {
      const key = normalizeText(word);
      return SEARCH_WORDS[key] ? SEARCH_WORDS[key] : key;
    })
    .join(" ");
}

function makeHaystack(d, brand){
  const raw = [
    brand,
    d.brand,
    d.model,
    d.storage,
    d.color,
    d.battery_health,
    d.condition,
    d.screen_condition,
    d.body_condition,
    d.location,
    d.notes,
    String(d.sale_type || "").toLowerCase().includes("auction") ? "مزاد auction" : "بيع مباشر direct"
  ]
    .filter(v => v !== null && v !== undefined)
    .join(" ");

  return normalizeText(raw) + " " + expandQuery(raw);
}

function matchesQuery(device, query){
  const tokens = expandQuery(query).split(" ").filter(Boolean);
  if(!tokens.length) return true;
  return tokens.every(token => device._haystack.includes(token));
}

/* =========================================
   LOAD
========================================= */

async function initScope(){
  try{
    const { data } = await supabase.auth.getUser();
    state.userId = data?.user?.id || null;
  }catch(error){
    console.warn("USER SCOPE:", error);
    state.userId = null;
  }

  state.favKey = state.userId
    ? `mzad_phone_favorites:user:${state.userId}`
    : "mzad_phone_favorites:guest";

  try{
    const saved = JSON.parse(localStorage.getItem(state.favKey) || "[]");
    state.favs = new Set(Array.isArray(saved) ? saved.map(String) : []);
  }catch{
    state.favs = new Set();
  }
}

function saveFavs(){
  try{
    localStorage.setItem(state.favKey, JSON.stringify([...state.favs]));
  }catch{}
}

async function fetchLegacy(){
  // نجرب أولاً مع user_id وends_at، وإذا أحد الأعمدة مو موجود نرجع لنسخة أبسط
  const variants = [
    `${LEGACY_BASE},user_id,ends_at`,
    `${LEGACY_BASE},user_id`,
    `${LEGACY_BASE},ends_at`,
    LEGACY_BASE
  ];

  let lastError = null;

  for(const columns of variants){
    const { data, error } = await supabase
      .from("devices")
      .select(columns)
      .order("created_at", { ascending:false });

    if(!error) return data || [];
    lastError = error;
  }

  throw lastError;
}

async function signImage(image){
  const path = String(image.storage_path || "").replace(/^\/+/, "");
  if(!path) return "";
  if(/^(https?:|data:)/i.test(path)) return path;

  const { data, error } = await supabase.storage
    .from(BUCKET)
    .createSignedUrl(path, 3600);

  if(!error && data?.signedUrl) return data.signedUrl;

  return publicImage(path);
}

async function fetchMzad(){
  const { data, error } = await supabase
    .from("mzad_direct_sales")
    .select("id,created_at,asking_price_iqd,status,device_id,device:mzad_devices!mzad_direct_sales_device_id_fkey(id,brand,model,storage,color,battery_health,condition_grade,screen_condition,camera_condition,biometric_condition,seller_notes,mzad_device_images(storage_path,sort_order,is_primary))")
    .in("status", ["active","reserved","pending_handover"])
    .order("created_at", { ascending:false });

  if(error) throw error;

  const rows = (data || []).filter(item => item.device);

  return Promise.all(rows.map(async item => {
    const d = item.device;

    const images = (Array.isArray(d.mzad_device_images) ? [...d.mzad_device_images] : [])
      .sort((a,b) => Number(a.sort_order || 0) - Number(b.sort_order || 0));

    const urls = await Promise.all(images.map(signImage));

    return {
      id: d.id,
      created_at: item.created_at,
      brand: d.brand,
      model: d.model,
      storage: d.storage,
      color: d.color,
      battery_health: d.battery_health,
      condition: d.condition_grade,
      body_condition: d.condition_grade,
      screen_condition: d.screen_condition,
      price: item.asking_price_iqd,
      location: "النجف",
      sale_type: "direct",
      images: urls.filter(Boolean),
      notes: d.seller_notes,
      _mzad: true
    };
  }));
}

function normalizeDevice(raw){
  const brand = canonicalBrand(raw.brand);
  const images = parseImages(raw.images).map(publicImage).filter(Boolean);

  return {
    ...raw,
    id: String(raw.id),
    _brand: brand,
    _auction: String(raw.sale_type || "").toLowerCase().includes("auction"),
    _img: images[0] || "",
    _ends: raw.ends_at ? new Date(raw.ends_at).getTime() : 0,
    _created: raw.created_at ? new Date(raw.created_at).getTime() : 0,
    _price: Number(raw.price) || 0,
    _owned: !!state.userId && !raw._mzad && raw.user_id === state.userId,
    _haystack: makeHaystack(raw, brand)
  };
}

async function load(){
  showSkeleton();

  try{
    const [legacyRows, mzadRows] = await Promise.all([
      fetchLegacy(),
      fetchMzad().catch(error => {
        console.warn("MZAD LISTINGS:", error);
        return [];
      })
    ]);

    state.devices = [...legacyRows, ...mzadRows]
      .map(normalizeDevice)
      .sort((a,b) => b._created - a._created);

    state.byId = new Map(state.devices.map(d => [d.id, d]));

    render();

  }catch(error){
    console.error("LOAD DEVICES ERROR:", error);
    showError();
  }
}

/* =========================================
   FILTER + SORT
========================================= */

function visibleDevices(){
  const list = state.devices.filter(d => {
    const brandOk = state.brand === "all" || d._brand === state.brand;
    const queryOk = !state.query || matchesQuery(d, state.query);
    return brandOk && queryOk;
  });

  const byPrice = (a,b,dir) => {
    const x = a._price;
    const y = b._price;
    if(!x && !y) return 0;
    if(!x) return 1;
    if(!y) return -1;
    return dir * (x - y);
  };

  if(state.sort === "low") list.sort((a,b) => byPrice(a,b,1));
  else if(state.sort === "high") list.sort((a,b) => byPrice(a,b,-1));
  else list.sort((a,b) => b._created - a._created);

  return list;
}

/* =========================================
   RENDER
========================================= */

function titleOf(d){
  const model = String(d.model || "").trim();
  if(d._brand === "Apple") return model || "iPhone";
  const parts = [d._brand, model].filter(Boolean);
  return parts.join(" ") || "جهاز";
}

function specsOf(d){
  const battery = String(d.battery_health ?? "").trim().replace(/%$/, "");
  return [
    d.storage,
    d.color,
    battery ? `بطارية ${battery}%` : ""
  ]
    .map(v => String(v ?? "").trim())
    .filter(Boolean)
    .slice(0,3)
    .join(" · ");
}

function cardHTML(d, index){
  const ended = d._auction && d._ends && d._ends <= Date.now();
  const fav = state.favs.has(d.id);
  const title = titleOf(d);
  const specs = specsOf(d);

  const timer = d._auction && d._ends
    ? `<span class="timer" data-end="${d._ends}">${ended ? "انتهى" : "--:--:--"}</span>`
    : "";

  const time = d._created
    ? `<div class="time" data-created="${d._created}">${SVG.clock}<span>${esc(publishedText(d._created))}</span></div>`
    : "";

  const image = d._img
    ? `<img src="${esc(d._img)}" alt="${esc(title)}" loading="lazy" decoding="async" onload="this.classList.add('ready')" onerror="this.remove()">`
    : "";

  return `
    <article class="card${ended ? " is-ended" : ""}" data-id="${esc(d.id)}" style="--i:${Math.min(index, 9)}">

      <div class="media">
        <div class="ph">${SVG.phone}</div>
        ${image}
      </div>

      <span class="shine"></span>

      <button class="fav${fav ? " on" : ""}" type="button" data-fav="${esc(d.id)}" aria-label="إضافة إلى المفضلة">
        ${SVG.heart}
      </button>

      ${
        d._owned
          ? `<button class="del" type="button" data-del="${esc(d.id)}" aria-label="حذف منشوري">${SVG.trash}</button>`
          : ""
      }

      ${timer}

      <div class="info">
        ${time}
        <h3 class="name">${esc(title)}</h3>
        ${specs ? `<p class="specs">${esc(specs)}</p>` : ""}
        <div class="price">
          <small>${d._auction ? "السعر الحالي" : "السعر"}</small>
          <b>${esc(formatPrice(d.price))}</b>
        </div>
      </div>

    </article>
  `;
}

function emptyHTML(){
  let title = "السوق فاضي حالياً";
  let text = "أول ما ينضاف جهاز راح يظهر هنا.";

  if(state.query){
    title = "ما لقينا نتائج";
    text = "جرّب كلمة ثانية أو امسح البحث.";
  }else if(state.brand !== "all"){
    title = `ماكو أجهزة ${brandLabel(state.brand)} حالياً`;
    text = "جرّب شركة ثانية أو اشيل الفلتر.";
  }

  return `
    <div class="empty">
      <div class="ico">${SVG.search}</div>
      <h3>${esc(title)}</h3>
      <p>${esc(text)}</p>
      <button type="button" data-reset>عرض كل الأجهزة</button>
    </div>
  `;
}

function showSkeleton(){
  grid.classList.remove("settled");
  grid.innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  countEl.textContent = "جاري التحميل…";
}

function showError(){
  grid.classList.remove("settled");
  grid.innerHTML = `
    <div class="error">
      <div class="ico">${SVG.alert}</div>
      <h3>تعذر تحميل الأجهزة</h3>
      <p>تأكد من الاتصال بالإنترنت وحاول مرة ثانية.</p>
      <button type="button" data-retry>إعادة المحاولة</button>
    </div>
  `;
  countEl.textContent = "تعذر التحميل";
}

function countTo(el, to){
  const from = Number(el.dataset.v || 0);
  el.dataset.v = String(to);
  if(from === to){
    el.textContent = String(to);
    return;
  }
  const start = performance.now();
  const duration = 600;
  const step = now => {
    const k = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - k, 3);
    el.textContent = String(Math.round(from + (to - from) * eased));
    if(k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function updateStats(){
  const now = Date.now();
  const total = state.devices.length;
  const live = state.devices.filter(d => d._auction && (!d._ends || d._ends > now)).length;
  countTo($("statTotal"), total);
  countTo($("statAuc"), live);
}

function renderChips(){
  chips.innerHTML = BRANDS.map(([key, label]) => `
    <button class="chip${state.brand === key ? " on" : ""}" type="button" data-brand="${esc(key)}">
      ${esc(label)}
    </button>
  `).join("");
}

function updateSortButtons(){
  document.querySelectorAll("[data-sort]").forEach(btn => {
    btn.classList.toggle("on", btn.dataset.sort === state.sort);
  });
}

function render(){
  const list = visibleDevices();

  updateStats();
  renderChips();
  updateSortButtons();

  countEl.innerHTML = state.query
    ? `<b>${list.length}</b> نتيجة`
    : `<b>${list.length}</b> جهاز`;

  if(!list.length){
    grid.innerHTML = emptyHTML();
  }else{
    grid.innerHTML = list.map(cardHTML).join("");
  }

  grid.classList.add("settled");
  tickTimers();
  refreshPublishedTimes();
}

/* =========================================
   TIMERS
========================================= */

function tickTimers(){
  const now = Date.now();

  document.querySelectorAll("[data-end]").forEach(el => {
    const left = Number(el.dataset.end) - now;
    el.textContent = fmtLeft(left);
    el.classList.toggle("urgent", left > 0 && left < 3600000);
    el.closest(".card")?.classList.toggle("is-ended", left <= 0);
  });
}

function refreshPublishedTimes(){
  document.querySelectorAll("[data-created]").forEach(el => {
    const label = el.querySelector("span");
    if(label) label.textContent = publishedText(Number(el.dataset.created));
  });
}

setInterval(tickTimers, 1000);
setInterval(refreshPublishedTimes, 30000);

/* =========================================
   FAVORITES
========================================= */

function toggleFav(id){
  const on = !state.favs.has(id);

  if(on) state.favs.add(id);
  else state.favs.delete(id);

  saveFavs();

  document
    .querySelectorAll(`[data-fav="${CSS.escape(id)}"]`)
    .forEach(btn => btn.classList.toggle("on", on));

  toast(on ? "تمت الإضافة إلى المفضلة" : "تمت الإزالة من المفضلة");
}

/* =========================================
   DELETE (owner only)
========================================= */

function openSheet(id){
  state.pendingDelete = id;
  sheet.hidden = false;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => sheet.classList.add("open"));
  });
}

function closeSheet(){
  sheet.classList.remove("open");
  setTimeout(() => {
    if(!sheet.classList.contains("open")){
      sheet.hidden = true;
      state.pendingDelete = null;
    }
  }, 260);
}

async function confirmDelete(){
  const id = state.pendingDelete;
  if(!id || !state.userId) return;

  const confirmBtn = $("sheetConfirm");
  confirmBtn.disabled = true;
  confirmBtn.textContent = "جاري الحذف…";

  try{
    const { data, error } = await supabase
      .from("devices")
      .delete()
      .eq("id", id)
      .eq("user_id", state.userId)
      .select("id");

    if(error) throw error;
    if(!data || !data.length) throw new Error("لم يتم حذف أي صف");

    state.devices = state.devices.filter(d => d.id !== id);
    state.byId.delete(id);

    if(state.favs.delete(id)) saveFavs();

    const card = grid.querySelector(`[data-id="${CSS.escape(id)}"]`);

    closeSheet();

    if(card){
      card.classList.add("removing");
      setTimeout(render, 280);
    }else{
      render();
    }

    toast("تم حذف منشورك");

  }catch(error){
    console.error("DELETE DEVICE ERROR:", error);
    toast("ما قدرنا نحذف المنشور، جرّب مرة ثانية");
  }finally{
    confirmBtn.disabled = false;
    confirmBtn.textContent = "حذف المنشور";
  }
}

/* =========================================
   EVENTS
========================================= */

grid.addEventListener("click", event => {

  const retry = event.target.closest("[data-retry]");
  if(retry){
    load();
    return;
  }

  const reset = event.target.closest("[data-reset]");
  if(reset){
    state.brand = "all";
    state.query = "";
    input.value = "";
    searchBox.classList.remove("has-value");
    syncUrlBrand();
    render();
    return;
  }

  const del = event.target.closest("[data-del]");
  if(del){
    event.stopPropagation();
    openSheet(del.dataset.del);
    return;
  }

  const fav = event.target.closest("[data-fav]");
  if(fav){
    event.stopPropagation();
    toggleFav(fav.dataset.fav);
    return;
  }

  const card = event.target.closest(".card");
  if(!card) return;

  const device = state.byId.get(card.dataset.id);
  if(!device) return;

  const page = device._auction ? "auction-details.html" : "device.html";
  window.location.href = `${page}?id=${encodeURIComponent(device.id)}`;
});

chips.addEventListener("click", event => {
  const btn = event.target.closest("[data-brand]");
  if(!btn) return;

  state.brand = btn.dataset.brand;
  syncUrlBrand();
  render();

  btn.scrollIntoView({ inline:"center", block:"nearest", behavior:"smooth" });
});

function syncUrlBrand(){
  const url = new URL(window.location.href);

  if(state.brand === "all"){
    url.searchParams.delete("brand");
  }else{
    url.searchParams.set(
      "brand",
      state.brand === "Apple" ? "iphone" : state.brand.toLowerCase()
    );
  }

  window.history.replaceState({}, "", url);
}

document.querySelector(".seg").addEventListener("click", event => {
  const btn = event.target.closest("[data-sort]");
  if(!btn) return;
  state.sort = btn.dataset.sort;
  render();
});

let searchTimer = null;

input.addEventListener("input", () => {
  state.query = input.value.trim();
  searchBox.classList.toggle("has-value", !!input.value);

  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 120);
});

input.addEventListener("keydown", event => {
  if(event.key !== "Enter") return;
  event.preventDefault();
  state.query = input.value.trim();
  input.blur();
  render();
});

input.addEventListener("focus", () => document.body.classList.add("kb"));
input.addEventListener("blur", () => setTimeout(() => document.body.classList.remove("kb"), 150));

$("qClear").addEventListener("click", () => {
  input.value = "";
  state.query = "";
  searchBox.classList.remove("has-value");
  render();
  input.focus();
});

$("back").addEventListener("click", event => {
  event.preventDefault();
  if(window.history.length > 1) window.history.back();
  else window.location.href = "home.html";
});

$("sheetCancel").addEventListener("click", closeSheet);
$("sheetBackdrop").addEventListener("click", closeSheet);
$("sheetConfirm").addEventListener("click", confirmDelete);

document.addEventListener("keydown", event => {
  if(event.key === "Escape" && !sheet.hidden) closeSheet();
});

/* =========================================
   START
========================================= */

const params = new URLSearchParams(window.location.search);

state.brand = canonicalBrand(params.get("brand")) || "all";

const incomingSearch =
  params.get("search") ||
  sessionStorage.getItem("mzad_search_query") ||
  "";

if(incomingSearch){
  input.value = incomingSearch;
  state.query = incomingSearch.trim();
  searchBox.classList.add("has-value");
}

sessionStorage.removeItem("mzad_search_query");

renderChips();

initScope().finally(load);

</script>

</body>
