<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">

<title>MZAD PHONE — الأجهزة</title>

<style>
:root{
  --bg:#F7F8FA;
  --white:#FFFFFF;
  --ink:#17202A;
  --muted:#667085;
  --line:#E6E9ED;

  --primary:#176B87;
  --primary-dark:#125A73;
  --primary-soft:#E8F3F6;

  --purple:#6246D9;
  --purple-dark:#51477D;
  --purple-soft:#E5E0FF;

  --card-purple:#51477D;
  --card-purple-soft:#F0EDFF;

  --shadow:0 10px 28px rgba(23,32,42,.06);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  color:inherit;
}

.page{
  width:min(100%,520px);
  margin:auto;
  padding:0 14px calc(100px + var(--safe-bottom));
}


/* =====================================================
   HEADER
===================================================== */

.header{
  margin-inline:-14px;

  padding:
    7px
    14px
    11px;

  background:
    linear-gradient(
      145deg,
      #FFFFFF 0%,
      #F5F2FF 45%,
      #E6E1FF 100%
    );

  border-bottom:1px solid var(--line);

  border-radius:
    0
    0
    24px
    24px;

  box-shadow:
    0 10px
    26px
    rgba(23,32,42,.06);

  position:relative;
  overflow:hidden;
}

.header::before{
  content:"";

  position:absolute;

  width:170px;
  height:170px;

  left:-82px;
  top:-112px;

  border-radius:50%;

  background:
    rgba(98,70,217,.055);

  pointer-events:none;
}

.header::after{
  content:"";

  position:absolute;

  width:125px;
  height:125px;

  right:-65px;
  bottom:-88px;

  border-radius:50%;

  background:
    rgba(98,70,217,.07);

  pointer-events:none;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
  position:relative;
  z-index:2;

  display:flex;
  align-items:center;

  gap:8px;
}

.back-btn,
.action-btn{
  width:37px;
  height:37px;

  flex:0 0 37px;

  border-radius:12px;

  background:#fff;

  border:
    1px solid #DDD8F8;

  color:var(--primary);

  display:grid;
  place-items:center;

  box-shadow:
    0 7px
    18px
    rgba(23,32,42,.045);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.back-btn:active,
.action-btn:active{
  transform:scale(.93);

  box-shadow:
    0 4px
    11px
    rgba(23,32,42,.05);
}

.brand{
  flex:1;

  text-align:center;

  line-height:.9;
}

.brand strong{
  display:block;

  font-size:18px;
  font-weight:950;

  letter-spacing:-.05em;
}

.brand span{
  display:block;

  margin-top:3px;

  color:#8A929A;

  font-size:7px;
  font-weight:950;

  letter-spacing:.2em;
}


/* =====================================================
   TITLE
===================================================== */

.header-content{
  position:relative;
  z-index:2;

  margin-top:8px;
}

.header-title-row{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:9px;
}

.header-title{
  min-width:0;
}

.header-title h1{
  margin:0;

  font-size:19px;
  line-height:1.15;

  font-weight:950;

  letter-spacing:-.045em;
}

.header-title p{
  margin:
    3px
    0
    0;

  color:#667085;

  font-size:9px;

  line-height:1.4;
}

.header-count{
  flex:0 0 auto;

  padding:
    6px
    9px;

  border-radius:10px;

  background:
    rgba(255,255,255,.86);

  border:
    1px solid rgba(98,70,217,.12);

  color:#51477D;

  font-size:8px;
  font-weight:950;

  white-space:nowrap;

  box-shadow:
    0 5px
    13px
    rgba(98,70,217,.055);
}


/* =====================================================
   SEARCH
===================================================== */

.search-box{
  position:relative;
  z-index:2;

  margin-top:8px;

  height:43px;

  display:flex;
  align-items:center;

  gap:8px;

  padding:
    0
    12px;

  background:
    rgba(255,255,255,.98);

  border:
    1px solid #E2E5E8;

  border-radius:15px;

  box-shadow:
    0 8px
    22px
    rgba(18,57,62,.07),
    0 5px
    18px
    rgba(109,92,231,.08);

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.search-box:focus-within{
  border-color:
    rgba(98,70,217,.22);

  box-shadow:
    0 10px
    24px
    rgba(98,70,217,.10);
}

.search-icon{
  color:#7C858D;
  flex:0 0 auto;
}

.search-box input{
  width:100%;
  min-width:0;

  border:0;
  outline:0;

  background:transparent;

  color:var(--ink);

  font-size:10px;
}

.search-box input::placeholder{
  color:#9AA1A8;
}

.clear-search{
  width:26px;
  height:26px;

  flex:0 0 26px;

  border-radius:8px;

  background:#F1F3F5;

  color:#737B82;

  display:none;
  place-items:center;
}

.clear-search.show{
  display:grid;
}


/* =====================================================
   COMPANY FILTERS
===================================================== */

.filters-wrap{
  margin-top:8px;
  position:relative;
}

.filters{
  display:flex;

  gap:7px;

  overflow-x:auto;

  padding:
    1px
    1px
    3px;

  scrollbar-width:none;

  scroll-snap-type:x proximity;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;

  height:36px;

  padding:
    0
    13px;

  border-radius:11px;

  background:#fff;

  border:
    1px solid var(--line);

  color:#68717A;

  font-size:12px;

  font-weight:900;

  white-space:nowrap;

  scroll-snap-align:start;

  transition:
    background .18s ease,
    color .18s ease,
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.filter:active{
  transform:scale(.96);
}


/* =====================================================
   ACTIVE COMPANY
   بنفس روح Home — بدون البترولي
===================================================== */

.filter.active{
  background:
    linear-gradient(
      145deg,
      #F7F5FF 0%,
      #E8E3FF 100%
    );

  border-color:#A99BEF;

  color:#51477D;

  box-shadow:
    0 7px
    17px
    rgba(98,70,217,.16);

  position:relative;
}

.filter.active::after{
  content:"";

  position:absolute;

  width:5px;
  height:5px;

  border-radius:50%;

  top:5px;
  right:7px;

  background:
    rgba(98,70,217,.20);

  pointer-events:none;
}


/* =====================================================
   TOOLS
===================================================== */

.tools{
  margin-top:10px;

  min-height:32px;

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;
}

.results{
  font-size:9px;
  color:var(--muted);
  font-weight:700;
}

.sort-btn{
  height:31px;

  padding:
    0
    10px;

  display:flex;
  align-items:center;

  gap:6px;

  border-radius:10px;

  background:#fff;

  border:
    1px solid var(--line);

  color:#59636B;

  font-size:8px;
  font-weight:900;

  box-shadow:
    0 5px
    13px
    rgba(23,32,42,.035);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.sort-btn:active{
  transform:scale(.96);

  box-shadow:
    0 3px
    9px
    rgba(23,32,42,.04);
}


/* =====================================================
   DEVICES
===================================================== */

.devices-grid{
  margin-top:8px;

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.device-card{
  position:relative;

  overflow:hidden;

  background:#fff;

  border:
    1px solid #E5E2F1;

  border-radius:17px;

  box-shadow:
    0 9px
    22px
    rgba(98,70,217,.08);

  cursor:pointer;

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.device-card:active{
  transform:scale(.975);

  box-shadow:
    0 6px
    16px
    rgba(98,70,217,.06);
}


/* =====================================================
   PHOTO
===================================================== */

.device-photo{
  height:175px;

  background:#fff;

  display:grid;
  place-items:center;

  position:relative;

  overflow:hidden;
}

.device-photo img{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;

  background:#fff;
}

.photo-placeholder{
  color:#111827;

  font-size:9px;
  font-weight:900;

  text-align:center;

  padding:
    9px
    11px;

  border-radius:10px;

  background:#FAFAFA;

  border:
    1px solid #EEEEEE;

  box-shadow:
    0 5px
    12px
    rgba(23,32,42,.025);
}


/* =====================================================
   FAVORITE
===================================================== */

.favorite{
  position:absolute;

  top:8px;
  left:8px;

  width:33px;
  height:33px;

  border-radius:50%;

  background:
    rgba(255,255,255,.97);

  display:grid;
  place-items:center;

  color:#727A82;

  box-shadow:
    0 5px
    13px
    rgba(23,32,42,.10);

  z-index:3;

  transition:
    transform .18s ease,
    color .18s ease,
    background .18s ease,
    box-shadow .18s ease;
}

.favorite:active{
  transform:scale(.88);
}


/* =====================================================
   FAVORITE ACTIVE
   واضح جداً عند الضغط
===================================================== */

.favorite.active{
  color:#FFFFFF;

  background:
    linear-gradient(
      145deg,
      #6246D9 0%,
      #5147B8 100%
    );

  box-shadow:
    0 7px
    17px
    rgba(98,70,217,.32);

  border:
    1px solid
    rgba(98,70,217,.45);
}

.favorite.active svg{
  fill:#FFFFFF;
  stroke:#FFFFFF;
}


/* =====================================================
   SALE TYPE
===================================================== */

.sale-type{
  position:absolute;

  top:8px;
  right:8px;

  padding:
    6px
    8px;

  border-radius:8px;

  background:
    linear-gradient(
      145deg,
      #FAF9FF 0%,
      #F0EDFF 100%
    );

  color:#51477D;

  font-size:8px;
  font-weight:950;

  box-shadow:
    0 5px
    12px
    rgba(81,71,125,.08);
}


/* =====================================================
   DEVICE INFO
===================================================== */

.device-info{
  min-height:128px;

  padding:
    10px
    12px
    10px;

  background:
    linear-gradient(
      145deg,
      #FAF9FF 0%,
      #F6F3FF 45%,
      #EEEAFE 100%
    );

  color:#17202A;

  position:relative;

  overflow:hidden;
}

.device-info::before{
  content:"";

  position:absolute;

  width:72px;
  height:72px;

  right:-35px;
  top:-38px;

  border-radius:50%;

  background:
    rgba(98,70,217,.065);

  pointer-events:none;
}

.device-info::after{
  content:"";

  position:absolute;

  width:8px;
  height:8px;

  left:14px;
  bottom:13px;

  border-radius:3px;

  background:
    rgba(98,70,217,.10);

  transform:rotate(18deg);

  pointer-events:none;
}


/* =====================================================
   DEVICE NAME
===================================================== */

.device-name{
  position:relative;
  z-index:1;

  font-size:15px;

  font-weight:950;

  line-height:1.3;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  letter-spacing:-.02em;

  color:#2B2460;
}


/* =====================================================
   DEVICE DETAILS
===================================================== */

.device-details{
  position:relative;
  z-index:1;

  margin-top:7px;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:5px 8px;
}

.detail-item{
  min-width:0;

  display:flex;

  flex-direction:column;

  gap:2px;

  padding:2px 0;
}

.detail-item span{
  color:#7C758F;

  font-size:8px;

  line-height:1.25;

  font-weight:800;
}

.detail-item strong{
  min-width:0;

  color:#29243F;

  font-size:10px;

  line-height:1.3;

  font-weight:950;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =====================================================
   PRICE
===================================================== */

.price-row{
  position:relative;
  z-index:1;

  margin-top:6px;

  padding-top:5px;

  border-top:
    1px solid
    rgba(81,71,125,.12);

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:6px;
}

.price-label{
  color:#7C758F;

  font-size:8px;

  line-height:1.2;

  font-weight:800;
}

.device-price{
  color:#51477D;

  font-size:14px;

  line-height:1.1;

  font-weight:950;

  white-space:nowrap;

  letter-spacing:-.025em;
}


/* =====================================================
   EMPTY
===================================================== */

.empty-state{
  margin-top:14px;

  padding:
    22px
    18px;

  border-radius:19px;

  background:#fff;

  border:
    1px solid var(--line);

  box-shadow:var(--shadow);

  text-align:center;
}

.empty-icon{
  width:51px;
  height:51px;

  margin:auto;

  border-radius:15px;

  background:var(--primary-soft);

  color:var(--primary);

  display:grid;
  place-items:center;
}

.empty-state h3{
  margin:
    11px
    0
    0;

  font-size:14px;
  font-weight:950;
}

.empty-state p{
  margin:
    6px
    auto
    0;

  max-width:270px;

  font-size:10px;

  line-height:1.7;

  color:var(--muted);
}


/* =====================================================
   LOADING
===================================================== */

.loading-state{
  grid-column:1 / -1;

  padding:
    32px
    18px;

  text-align:center;

  color:var(--muted);

  font-size:11px;

  background:#fff;

  border:
    1px solid var(--line);

  border-radius:19px;
}

.loading-spinner{
  width:29px;
  height:29px;

  margin:
    0
    auto
    10px;

  border-radius:50%;

  border:
    3px solid #E5E8EB;

  border-top-color:
    var(--purple);

  animation:
    spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:40;

  padding:
    7px
    10px
    calc(7px + var(--safe-bottom));

  background:
    rgba(255,255,255,.97);

  border-top:
    1px solid rgba(23,107,135,.10);

  box-shadow:
    0 -10px
    28px
    rgba(23,107,135,.07);

  backdrop-filter:blur(16px);
}

.bottom-inner{
  width:min(100%,520px);

  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  align-items:center;
}

.nav-item{
  min-width:0;

  height:51px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:4px;

  color:#858D94;

  background:transparent;

  font-size:8px;
  font-weight:850;

  transition:
    color .18s ease,
    transform .18s ease;
}

.nav-item:active{
  transform:scale(.95);
}

.nav-item.active{
  color:var(--primary-dark);
}

.nav-icon{
  width:21px;
  height:21px;
}

.add-button{
  width:43px;
  height:43px;

  margin-top:-13px;

  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      #176B87,
      #257F98
    );

  color:#fff;

  display:grid;
  place-items:center;

  box-shadow:
    0 8px
    20px
    rgba(23,107,135,.20);
}


/* =====================================================
   ANIMATION
===================================================== */

.header{
  animation:
    headerIn .42s cubic-bezier(.2,.7,.2,1) both;
}

.header-content{
  animation:
    contentIn .42s .05s cubic-bezier(.2,.7,.2,1) both;
}

.search-box{
  animation:
    contentIn .42s .09s cubic-bezier(.2,.7,.2,1) both;
}

.filters-wrap{
  animation:
    contentIn .42s .13s cubic-bezier(.2,.7,.2,1) both;
}

.tools{
  animation:
    contentIn .42s .17s cubic-bezier(.2,.7,.2,1) both;
}

.device-card{
  animation:
    cardIn .38s cubic-bezier(.2,.7,.2,1) both;
}

@keyframes headerIn{
  from{
    opacity:0;
    transform:translateY(-10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes contentIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}


@media(max-height:700px){

  .device-photo{
    height:175px;
  }

  .device-info{
    min-height:125px;
  }

}


@media(max-width:360px){

  .device-photo{
    height:175px;
  }

  .device-info{
    min-height:126px;

    padding:
      9px
      10px
      9px;
  }

  .device-name{
    font-size:14px;
  }

  .detail-item span{
    font-size:7px;
  }

  .detail-item strong{
    font-size:9px;
  }

  .device-price{
    font-size:13px;
  }

}


@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none !important;
    transition:none !important;
  }

}

</style>
</head>


<body>

<main class="page">

<header class="header">

  <div class="topbar">

    <button
      class="back-btn"
      id="backBtn"
      type="button"
      aria-label="رجوع">

      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M15 18l-6-6 6-6"/>

      </svg>

    </button>


    <div class="brand">

      <strong>MZAD</strong>

      <span>PHONE</span>

    </div>


    <button
      class="action-btn"
      id="searchFocusBtn"
      type="button"
      aria-label="بحث">

      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8">

        <circle cx="11" cy="11" r="6.5"/>
        <path d="m16 16 5 5"/>

      </svg>

    </button>

  </div>


  <div class="header-content">

    <div class="header-title-row">

      <div class="header-title">

        <h1 id="pageTitle">
          كل الأجهزة
        </h1>

        <p id="pageSubtitle">
          تصفح الأجهزة المعروضة للبيع والمزادات
        </p>

      </div>


      <span
        class="header-count"
        id="headerCount">

        الأجهزة

      </span>

    </div>


    <div class="search-box">

      <svg
        class="search-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8">

        <circle cx="11" cy="11" r="6.5"/>
        <path d="m16 16 5 5"/>

      </svg>


      <input
        id="searchInput"
        type="search"
        placeholder="ابحث عن جهاز أو موديل..."
        autocomplete="off">


      <button
        class="clear-search"
        id="clearSearch"
        type="button"
        aria-label="مسح البحث">

        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">

          <path d="M6 6l12 12"/>
          <path d="M18 6 6 18"/>

        </svg>

      </button>

    </div>

  </div>

</header>


<div class="filters-wrap">

  <div
    class="filters"
    id="filters">

    <button class="filter active" data-brand="all">
      الكل
    </button>

    <button class="filter" data-brand="Apple">
      iPhone
    </button>

    <button class="filter" data-brand="Samsung">
      Samsung
    </button>

    <button class="filter" data-brand="Xiaomi">
      Xiaomi
    </button>

    <button class="filter" data-brand="Google">

<script type="module">

import { supabase } from "./js/supabase.js";


const searchInput =
  document.getElementById("searchInput");

const clearSearch =
  document.getElementById("clearSearch");

const filters =
  [...document.querySelectorAll(".filter")];

const devicesGrid =
  document.getElementById("devicesGrid");

const loadingState =
  document.getElementById("loadingState");

const emptyState =
  document.getElementById("emptyState");

const emptyTitle =
  document.getElementById("emptyTitle");

const emptyText =
  document.getElementById("emptyText");

const resultsText =
  document.getElementById("resultsText");

const headerCount =
  document.getElementById("headerCount");

const backBtn =
  document.getElementById("backBtn");

const searchFocusBtn =
  document.getElementById("searchFocusBtn");

const pageTitle =
  document.getElementById("pageTitle");

const pageSubtitle =
  document.getElementById("pageSubtitle");

const sortBtn =
  document.getElementById("sortBtn");

const sortLabel =
  document.getElementById("sortLabel");


const brandConfig = {

  all:{
    title:"كل الأجهزة",
    subtitle:"تصفح الأجهزة المعروضة للبيع والمزادات"
  },

  Apple:{
    title:"أجهزة iPhone",
    subtitle:"تصفح أجهزة iPhone المعروضة للبيع والمزادات"
  },

  Samsung:{
    title:"أجهزة Samsung",
    subtitle:"تصفح أجهزة Samsung المعروضة للبيع والمزادات"
  },

  Xiaomi:{
    title:"أجهزة Xiaomi",
    subtitle:"تصفح أجهزة Xiaomi المعروضة للبيع والمزادات"
  },

  Google:{
    title:"أجهزة Google",
    subtitle:"تصفح أجهزة Google المعروضة للبيع والمزادات"
  },

  Huawei:{
    title:"أجهزة Huawei",
    subtitle:"تصفح أجهزة Huawei المعروضة للبيع والمزادات"
  },

  OPPO:{
    title:"أجهزة OPPO",
    subtitle:"تصفح أجهزة OPPO المعروضة للبيع والمزادات"
  },

  HONOR:{
    title:"أجهزة HONOR",
    subtitle:"تصفح أجهزة HONOR المعروضة للبيع والمزادات"
  },

  OnePlus:{
    title:"أجهزة OnePlus",
    subtitle:"تصفح أجهزة OnePlus المعروضة للبيع والمزادات"
  },

  realme:{
    title:"أجهزة realme",
    subtitle:"تصفح أجهزة realme المعروضة للبيع والمزادات"
  },

  Motorola:{
    title:"أجهزة Motorola",
    subtitle:"تصفح أجهزة Motorola المعروضة للبيع والمزادات"
  },

  Sony:{
    title:"أجهزة Sony",
    subtitle:"تصفح أجهزة Sony المعروضة للبيع والمزادات"
  },

  Nokia:{
    title:"أجهزة Nokia",
    subtitle:"تصفح أجهزة Nokia المعروضة للبيع والمزادات"
  },

  Tecno:{
    title:"أجهزة Tecno",
    subtitle:"تصفح أجهزة Tecno المعروضة للبيع والمزادات"
  },

  Infinix:{
    title:"أجهزة Infinix",
    subtitle:"تصفح أجهزة Infinix المعروضة للبيع والمزادات"
  }

};


const brandAliases = {

  all:"all",

  apple:"Apple",
  iphone:"Apple",

  samsung:"Samsung",

  xiaomi:"Xiaomi",

  google:"Google",

  huawei:"Huawei",

  oppo:"OPPO",

  honor:"HONOR",

  oneplus:"OnePlus",

  realme:"realme",

  motorola:"Motorola",

  sony:"Sony",

  nokia:"Nokia",

  tecno:"Tecno",

  infinix:"Infinix"

};


let devices = [];

let selectedBrand = "all";

let sortMode = "newest";


const params =
  new URLSearchParams(
    window.location.search
  );

const rawBrand =
  (
    params.get("brand") || "all"
  )
  .trim()
  .toLowerCase();

selectedBrand =
  brandAliases[rawBrand] || "all";


function updateURL(){

  if(selectedBrand === "all"){

    window.history.replaceState(
      {},
      "",
      "market.html"
    );

    return;
  }

  window.history.replaceState(
    {},
    "",
    `market.html?brand=${encodeURIComponent(selectedBrand.toLowerCase())}`
  );

}


function formatPrice(price){

  const number =
    Number(price);

  if(
    !Number.isFinite(number) ||
    number <= 0
  ){

    return "السعر يحدد لاحقاً";

  }

  return (
    new Intl.NumberFormat("en-US")
      .format(number)
    + " د.ع"
  );

}


function getDeviceImages(value){

  if(!value){
    return [];
  }

  if(Array.isArray(value)){
    return value.filter(Boolean);
  }

  if(typeof value === "string"){

    const text =
      value.trim();

    if(!text){
      return [];
    }

    try{

      const parsed =
        JSON.parse(text);

      if(Array.isArray(parsed)){
        return parsed.filter(Boolean);
      }

    }catch(error){}

    return [text];
  }

  return [];

}


function normalizeDevice(device){

  const images =
    getDeviceImages(device.images);

  const saleType =
    String(
      device.sale_type || "direct"
    ).toLowerCase();

  const isAuction =
    saleType === "auction" ||
    saleType === "مزاد";

  return {

    ...device,

    _images:images,

    _saleType:
      isAuction
        ? "auction"
        : "direct",

    _searchText:[
      device.brand,
      device.model,
      device.storage,
      device.color,
      device.battery_health,
      device.condition,
      device.body_condition,
      device.screen_condition,
      device.location
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase()

  };

}


async function loadDevices(){

  showLoading();

  const {
    data,
    error
  } =
    await supabase
      .from("devices")
      .select(`
        id,
        created_at,
        brand,
        model,
        storage,
        color,
        battery_health,
        condition,
        body_condition,
        screen_condition,
        face_id,
        cameras,
        charging,
        replaced_parts,
        price,
        location,
        sale_type,
        seller_id,
        seller_name,
        images,
        notes
      `)
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(error){

    console.error(
      "MARKET LOAD ERROR:",
      error
    );

    hideLoading();

    devices = [];

    resultsText.textContent =
      "تعذر تحميل الأجهزة";

    emptyState.style.display =
      "block";

    emptyTitle.textContent =
      "تعذر تحميل الأجهزة";

    emptyText.textContent =
      "تأكد من اتصالك بالإنترنت وحاول مرة ثانية.";

    return;
  }

  devices =
    (data || [])
      .map(normalizeDevice);

  hideLoading();

  renderDevices();

}


function showLoading(){

  loadingState.style.display =
    "block";

  emptyState.style.display =
    "none";

  devicesGrid
    .querySelectorAll(".device-card")
    .forEach(
      card => card.remove()
    );

  resultsText.textContent =
    "جاري تحميل الأجهزة...";

}


function hideLoading(){

  loadingState.style.display =
    "none";

}


function createImageElement(device){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "device-photo";

  const images =
    device._images;

  if(images.length){

    const img =
      document.createElement("img");

    img.src =
      images[0];

    img.alt =
      `${device.brand || ""} ${device.model || "جهاز"}`;

    img.loading =
      "lazy";

    img.decoding =
      "async";

    img.addEventListener(
      "error",
      () => {

        img.remove();

        const placeholder =
          document.createElement("span");

        placeholder.className =
          "photo-placeholder";

        placeholder.textContent =
          "تعذر تحميل الصورة";

        wrapper.prepend(
          placeholder
        );

      }
    );

    wrapper.appendChild(img);

  }else{

    const placeholder =
      document.createElement("span");

    placeholder.className =
      "photo-placeholder";

    placeholder.textContent =
      "لا توجد صورة";

    wrapper.appendChild(
      placeholder
    );

  }

  return wrapper;

}


function createDetailItem(
  label,
  value
){

  const item =
    document.createElement("div");

  item.className =
    "detail-item";


  const labelElement =
    document.createElement("span");

  labelElement.textContent =
    label;


  const valueElement =
    document.createElement("strong");

  valueElement.textContent =
    value || "غير محدد";


  item.appendChild(
    labelElement
  );

  item.appendChild(
    valueElement
  );

  return item;

}


function createDeviceCard(
  device,
  index
){

  const card =
    document.createElement("article");

  card.className =
    "device-card";

  card.dataset.brand =
    device.brand || "";

  card.dataset.deviceId =
    device.id || "";

  card.style.animationDelay =
    `${Math.min(index * .04,.35)}s`;


  const photo =
    createImageElement(device);


  const favorite =
    document.createElement("button");

  favorite.className =
    "favorite";

  favorite.type =
    "button";

  favorite.setAttribute(
    "aria-label",
    "المفضلة"
  );

  favorite.innerHTML = `

    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8">

      <path
        d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/>

    </svg>

  `;

  favorite.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      favorite.classList.toggle(
        "active"
      );

    }
  );

  photo.appendChild(
    favorite
  );


  const saleType =
    document.createElement("span");

  saleType.className =
    "sale-type";

  saleType.textContent =
    device._saleType === "auction"
      ? "مزاد"
      : "بيع مباشر";

  photo.appendChild(
    saleType
  );


  const info =
    document.createElement("div");

  info.className =
    "device-info";


  const name =
    document.createElement("div");

  name.className =
    "device-name";

  name.textContent =
    [
      device.brand,
      device.model
    ]
    .filter(Boolean)
    .join(" ") ||
    "جهاز";


  const details =
    document.createElement("div");

  details.className =
    "device-details";


  const storage =
    device.storage ||
    "غير محدد";


  const color =
    device.color ||
    "غير محدد";


  let battery =
    "غير محددة";

  if(
    device.battery_health !== null &&
    device.battery_health !== undefined &&
    device.battery_health !== ""
  ){

    battery =
      `${device.battery_health}%`;

  }


  details.appendChild(
    createDetailItem(
      "التخزين",
      storage
    )
  );

  details.appendChild(
    createDetailItem(
      "اللون",
      color
    )
  );

  details.appendChild(
    createDetailItem(
      "البطارية",
      battery
    )
  );


  const priceRow =
    document.createElement("div");

  priceRow.className =
    "price-row";


  const priceLabel =
    document.createElement("span");

  priceLabel.className =
    "price-label";

  priceLabel.textContent =
    "السعر";


  const price =
    document.createElement("strong");

  price.className =
    "device-price";

  price.textContent =
    formatPrice(
      device.price
    );


  priceRow.appendChild(
    priceLabel
  );

  priceRow.appendChild(
    price
  );


  info.appendChild(
    name
  );

  info.appendChild(
    details
  );

  info.appendChild(
    priceRow
  );


  card.appendChild(
    photo
  );

  card.appendChild(
    info
  );


  card.addEventListener(
    "click",
    () => {

      if(!device.id){
        return;
      }

      window.location.href =
        `device.html?id=${encodeURIComponent(device.id)}`;

    }
  );


  return card;

}


function getFilteredDevices(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  let result =
    devices.filter(
      device => {

        const brandMatch =
          selectedBrand === "all" ||
          device.brand === selectedBrand;

        const searchMatch =
          !query ||
          device._searchText.includes(query);

        return (
          brandMatch &&
          searchMatch
        );

      }
    );


  if(sortMode === "newest"){

    result.sort(
      (a,b) =>
        new Date(b.created_at || 0).getTime() -
        new Date(a.created_at || 0).getTime()
    );

  }else if(sortMode === "price_low"){

    result.sort(
      (a,b) =>
        (Number(a.price) || 0) -
        (Number(b.price) || 0)
    );

  }else if(sortMode === "price_high"){

    result.sort(
      (a,b) =>
        (Number(b.price) || 0) -
        (Number(a.price) || 0)
    );

  }

  return result;

}


function renderDevices(){

  const result =
    getFilteredDevices();

  devicesGrid
    .querySelectorAll(".device-card")
    .forEach(
      card => card.remove()
    );

  result.forEach(
    (device,index) => {

      devicesGrid.appendChild(
        createDeviceCard(
          device,
          index
        )
      );

    }
  );

  updateHeaderCount(
    result.length
  );

  updateResultsText(
    result.length
  );

  updateEmptyState(
    result.length
  );

  clearSearch.classList.toggle(
    "show",
    !!searchInput.value.trim()
  );

}


function updateHeaderCount(count){

  if(count === 0){

    headerCount.textContent =
      "لا توجد نتائج";

    return;
  }

  if(selectedBrand === "all"){

    headerCount.textContent =
      `${count} أجهزة`;

    return;
  }

  const brandName =
    brandConfig[selectedBrand]
      .title
      .replace("أجهزة ","");

  headerCount.textContent =
    `${count} ${brandName}`;

}


function updateResultsText(count){

  if(count === 0){

    resultsText.textContent =
      "لا توجد نتائج";

    return;
  }

  if(selectedBrand === "all"){

    resultsText.textContent =
      `${count} أجهزة معروضة`;

    return;
  }

  const brandName =
    brandConfig[selectedBrand]
      .title
      .replace("أجهزة ","");

  resultsText.textContent =
    `${count} أجهزة من ${brandName}`;

}


function updateEmptyState(count){

  if(count > 0){

    emptyState.style.display =
      "none";

    return;
  }

  emptyState.style.display =
    "block";

  const query =
    searchInput.value.trim();

  if(query){

    emptyTitle.textContent =
      "ماكو نتائج للبحث";

    emptyText.textContent =
      "جرّب اسم جهاز أو موديل مختلف.";

    return;
  }

  if(selectedBrand === "all"){

    emptyTitle.textContent =
      "ماكو أجهزة حالياً";

    emptyText.textContent =
      "ماكو أجهزة منشورة حالياً.";

    return;
  }

  const brandName =
    brandConfig[selectedBrand]
      .title
      .replace("أجهزة ","");

  emptyTitle.textContent =
    `ماكو أجهزة ${brandName} حالياً`;

  emptyText.textContent =
    "جرّب تصنيف آخر.";

}


function applyBrand(){

  filters.forEach(
    filter => {

      filter.classList.toggle(
        "active",
        filter.dataset.brand === selectedBrand
      );

    }
  );

  const config =
    brandConfig[selectedBrand];

  pageTitle.textContent =
    config.title;

  pageSubtitle.textContent =
    config.subtitle;

  renderDevices();

}


filters.forEach(
  filter => {

    filter.addEventListener(
      "click",
      () => {

        selectedBrand =
          filter.dataset.brand;

        updateURL();

        filters.forEach(
          item =>
            item.classList.remove("active")
        );

        filter.classList.add("active");

        const config =
          brandConfig[selectedBrand];

        pageTitle.textContent =
          config.title;

        pageSubtitle.textContent =
          config.subtitle;

        renderDevices();

      }
    );

  }
);


searchInput.addEventListener(
  "input",
  () => {

    renderDevices();

  }
);


clearSearch.addEventListener(
  "click",
  () => {

    searchInput.value =
      "";

    renderDevices();

    searchInput.focus();

  }
);


searchFocusBtn.addEventListener(
  "click",
  () => {

    searchInput.focus();

  }
);


sortBtn.addEventListener(
  "click",
  () => {

    if(sortMode === "newest"){

      sortMode =
        "price_low";

      sortLabel.textContent =
        "الأقل سعراً";

    }else if(sortMode === "price_low"){

      sortMode =
        "price_high";

      sortLabel.textContent =
        "الأعلى سعراً";

    }else{

      sortMode =
        "newest";

      sortLabel.textContent =
        "الأحدث";

    }

    renderDevices();

  }
);


backBtn.addEventListener(
  "click",
  () => {

    if(
      document.referrer &&
      document.referrer.includes(
        window.location.host
      )
    ){

      window.history.back();

    }else{

      window.location.href =
        "home.html";

    }

  }
);


document
  .querySelectorAll(".nav-item")
  .forEach(
    item => {

      item.addEventListener(
        "click",
        () => {

          const page =
            item.dataset.page;

          if(page){

            window.location.href =
              page;

          }

        }
      );

    }
  );


applyBrand();

loadDevices();

</script>
