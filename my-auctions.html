<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#6246d9">
<title>مزاداتي — MZAD PHONE</title>
<style>
:root{--bg:#f9f8fd;--ink:#17202a;--muted:#6b7280;--edge:#e4defa;--p:#6246d9;--pd:#4a34b8;--ps:#f3f0ff;--ok:#1e8a5a;--oks:#e8f6ef;--bad:#c62f4d;--bads:#fff0f3;--hot:#e8590c;--hots:#fff4e8;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
[hidden]{display:none!important}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.page{width:min(100%,520px);margin:0 auto;padding:0 14px calc(40px + var(--sb));overflow-x:clip}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(30,138,90,.4)}50%{box-shadow:0 0 0 7px rgba(30,138,90,0)}}
header{margin-inline:-14px;padding:0 14px 18px;background:linear-gradient(145deg,#fff,#ece8ff);border-radius:0 0 26px 26px;border-bottom:1px solid #ece8fb}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 2px 0}
.ib{width:39px;height:34px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--p)}
.ib svg{width:20px;height:20px}
.brand{display:flex;flex-direction:column;align-items:center;line-height:.9}
.brand b{font-size:16px;letter-spacing:-.03em}.brand span{font-size:7px;font-weight:800;letter-spacing:.15em;color:#8a96a3;margin-top:3px}
h1{margin:16px 2px 4px;font-size:23px;font-weight:950;letter-spacing:-.03em}
.lead{margin:0 2px 14px;font-size:12px;font-weight:700;line-height:1.9;color:var(--muted)}
.hero{padding:16px 14px;border-radius:20px;color:#fff;background:linear-gradient(145deg,#6246d9,#8b6cf0);box-shadow:0 14px 28px -12px rgba(98,70,217,.55);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.hero div+div{border-inline-start:1px solid rgba(255,255,255,.22)}
.hero strong{display:block;font-size:24px;font-weight:950;font-variant-numeric:tabular-nums}
.hero small{font-size:11px;font-weight:800;opacity:.85}
.tabs{display:flex;gap:8px;margin:16px -14px 0;padding:0 14px 2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1.5px solid var(--edge);background:#fff;font-size:12px;font-weight:900;color:var(--muted);display:flex;gap:7px;align-items:center}
.tab i{font-style:normal;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--ps);color:var(--pd);font-size:11px;display:grid;place-items:center}
.tab.on{background:var(--p);border-color:var(--p);color:#fff}
.tab.on i{background:rgba(255,255,255,.22);color:#fff}
.find{position:relative;margin-top:12px}
.find svg{position:absolute;inset-inline-start:13px;top:13px;width:20px;height:20px;color:#9a90d6}
.in{width:100%;height:46px;border:1.5px solid var(--edge);border-radius:14px;padding:0 14px;padding-inline-start:42px;outline:none;font-weight:700;background:#fff}
.in:focus{border-color:#a99cf0;box-shadow:0 0 0 4px rgba(98,70,217,.1)}

.clean{display:flex;align-items:center;gap:12px;margin-top:14px;padding:13px;border-radius:18px;background:var(--hots);border:1px solid #f7d9b8}
.clean .ci{width:40px;height:40px;flex:0 0 40px;border-radius:13px;background:var(--hot);color:#fff;display:grid;place-items:center}
.clean .ci svg{width:21px;height:21px}
.clean p{margin:0;flex:1;font-size:11.5px;font-weight:800;line-height:1.7;color:#7a4a1d}
.clean button{padding:9px 13px;border-radius:11px;background:#fff;border:1px solid #f0c79c;color:#b5480a;font-size:11px;font-weight:900}

.list{display:grid;gap:14px;margin-top:14px}
.card{border-radius:22px;background:#fff;border:1px solid var(--edge);box-shadow:0 10px 24px -14px rgba(98,70,217,.25);overflow:hidden;animation:up .45s cubic-bezier(.2,.8,.3,1) backwards}
.main{display:flex;gap:12px;padding:14px}
.ph{width:92px;height:100px;flex:0 0 92px;border-radius:16px;background:transparent;color:#9a90d6;display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;object-position:center;padding:3px;background:transparent}
.ph svg{width:34px;height:34px}
.inf{min-width:0;flex:1;display:flex;flex-direction:column}
.l1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nm{font-size:15px;font-weight:950;line-height:1.4;overflow-wrap:anywhere}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:10.5px;font-weight:900;background:var(--ps);color:var(--pd)}
.chip.live{background:var(--oks);color:var(--ok)}
.chip.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
.chip.wait{background:var(--hots);color:#b5480a}
.chip.end{background:#f1f2f5;color:#6b7280}
.chip.bad{background:var(--bads);color:var(--bad)}
.no{margin-top:3px;font-size:10.5px;font-weight:700;color:#9ca3af}
.pr{margin-top:auto;padding-top:8px}
.pr small{display:block;font-size:10px;font-weight:800;color:var(--muted)}
.pr strong{font-size:19px;font-weight:950;font-variant-numeric:tabular-nums;color:var(--pd)}
.pr strong em{font-style:normal;font-size:11px;font-weight:800;color:var(--muted);margin-inline-start:4px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);margin:0 14px;padding:10px 0;border-top:1px dashed #d8d0f6}
.nums div{text-align:center}
.nums div+div{border-inline-start:1px solid #efeafb}
.nums b{display:block;font-size:15px;font-weight:950}
.nums span{font-size:10.5px;font-weight:700;color:var(--muted)}
.note{display:flex;gap:9px;margin:0 14px 12px;padding:10px 12px;border-radius:13px;font-size:11px;font-weight:700;line-height:1.8;background:var(--hots);color:#7a4a1d}
.note svg{flex:0 0 18px;width:18px;height:18px;margin-top:2px}
.note.info{background:var(--ps);color:#4a4d6e}
.acts{display:flex;gap:8px;padding:0 14px 14px}
.btn{flex:1;min-width:0;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:950;color:#fff;background:linear-gradient(145deg,#6246d9,#8b6cf0);box-shadow:0 10px 20px rgba(98,70,217,.25);transition:.2s}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--pd);border:1.5px solid var(--edge);box-shadow:none}
.btn.warn{background:var(--hot);box-shadow:0 10px 20px rgba(232,89,12,.25)}

.refund-action{display:flex;align-items:center;gap:12px;margin:0 14px 14px;padding:12px 14px;min-height:70px;border:1px solid #0e9f6e;border-radius:17px;background:linear-gradient(110deg,#0e9f6e 0%,#13b981 100%);color:#fff;text-decoration:none;box-shadow:0 9px 20px rgba(14,159,110,.24);transition:transform .18s,border-color .18s,box-shadow .18s}
.refund-action:active{transform:scale(.99);border-color:#087f5b;box-shadow:0 4px 12px rgba(14,159,110,.28)}
.refund-icon{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.25)}
.refund-icon svg{width:21px;height:21px}
.refund-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:4px}
.refund-copy strong{font-size:14px;font-weight:950;color:#fff}
.refund-copy small{font-size:11px;font-weight:800;color:#eafff6;line-height:1.6}
.refund-arrow{display:grid;place-items:center;flex:0 0 28px;width:28px;height:28px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.28);font-size:25px;line-height:1}

.btn:disabled{opacity:.5;box-shadow:none}
.del{flex:0 0 44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1.5px solid #f3c9d1;background:var(--bads);color:var(--bad)}
.del svg{width:20px;height:20px}

.empty{padding:34px 18px;border-radius:22px;background:#fff;border:1.5px dashed #c9bff7;text-align:center}
.empty .eb{width:60px;height:60px;margin:0 auto 12px;border-radius:50%;background:var(--ps);color:var(--p);display:grid;place-items:center}
.empty .eb svg{width:28px;height:28px}
.empty h2{margin:0 0 6px;font-size:17px;font-weight:950}
.empty p{margin:0 0 16px;font-size:12px;font-weight:700;line-height:1.9;color:var(--muted)}
.empty .btn{display:inline-flex;width:auto;padding:0 26px}
.sk{height:190px;border-radius:22px;background:linear-gradient(100deg,#eeeafa 30%,#f8f6ff 50%,#eeeafa 70%);background-size:300% 100%;animation:sh 1.6s linear infinite}

.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:14px calc(14px) calc(14px + var(--sb));background:rgba(32,24,70,.55);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.sheet.show{opacity:1;visibility:visible;transition-delay:0s}
.box{width:min(100%,460px);padding:22px 18px 18px;border-radius:26px;background:#fff;text-align:center;transform:translateY(30px);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.sheet.show .box{transform:none}
.box .big{width:58px;height:58px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--bads);color:var(--bad)}
.box .big.w{background:var(--hots);color:var(--hot)}
.box .big svg{width:27px;height:27px}
.box h3{margin:0 0 6px;font-size:18px;font-weight:950}
.box p{margin:0;font-size:12.5px;font-weight:700;line-height:1.9;color:var(--muted)}
.box .row{display:flex;gap:9px;margin-top:18px}
.box .btn.red{background:var(--bad);box-shadow:0 10px 20px rgba(198,47,77,.25)}
.btn .sp{display:none;width:18px;height:18px;border-radius:50%;border:3px solid #fff6;border-top-color:#fff;animation:rot .7s linear infinite}
.btn.busy .t{display:none}.btn.busy .sp{display:block}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%) translateY(16px);max-width:calc(100% - 40px);padding:10px 14px;border-radius:13px;background:#1e2c30;color:#fff;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:60;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script type="module" src="./js/auth-guard.js"></script>



<style id="mzad-logo-back-swap-only">
/* تبديل موضع الشعار وزر الرجوع فقط داخل الهيدر الأصلي */
.top>.brand{order:1!important}.top>#back{order:-1!important}
</style>
</head>
<body>
<main class="page">
<header>
  <div class="top">
    <button class="ib" id="back" type="button" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="brand"><b>MZAD</b><span>PHONE</span></div>
    <button class="ib" id="refresh" type="button" aria-label="تحديث"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </div>
  <h1>مزاداتي</h1>
  <p class="lead">تابع أجهزتك المعروضة، شوف المزايدات، وامسح اللي ما تحتاجه.</p>
  <div class="hero"><div><strong id="sTotal">—</strong><small>مزاداتي</small></div><div><strong id="sBids">—</strong><small>مزايدة</small></div><div><strong id="sRes">—</strong><small>حاجز</small></div></div>
</header>

<nav class="tabs" id="tabs" aria-label="تصفية"></nav>
<div class="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="in" id="search" type="search" placeholder="ابحث باسم الجهاز أو رقم المزاد"></div>

<div class="clean" id="clean" hidden>
  <span class="ci"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></span>
  <p id="cleanTxt"></p>
  <button id="cleanBtn" type="button">مسحها كلها</button>
</div>

<div class="list" id="list"><div class="sk"></div><div class="sk"></div></div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="box">
    <div class="big" id="shI"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></div>
    <h3 id="shT"></h3><p id="shP"></p>
    <div class="row"><button class="btn ghost" id="shNo" type="button">رجوع</button><button class="btn red" id="shYes" type="button"><span class="t" id="shL">تأكيد</span><span class="sp"></span></button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from "./js/supabase.js";
const SUPABASE_URL = "https://ldvxctpngkidvatkisae.supabase.co";
const $ = id => document.getElementById(id);
const money = v => (Number(v) || 0).toLocaleString("en-US");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let user = null, auctions = [], tab = "all", tt, pending = null;
const toast = m => { const e = $("toast"); e.textContent = m; e.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => e.classList.remove("show"), 2600); };

const IC = {
  phone:'<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  stop:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  shield:'<svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 7.8 7 10 4-2.2 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>',
  info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ===== حالة المزاد ===== */
const DRAFT = ["draft","pending","pending_approval","awaiting_approval","awaiting_payment"];
function kind(a){
  const s = String(a.status || "").toLowerCase(), ends = a.ends_at ? new Date(a.ends_at).getTime() : 0;
  if (s === "cancelled") return "cancelled";
  if (s === "rejected") return "rejected";
  if (s === "live" && ends > Date.now()) return "live";
  if (s === "ended" || s === "completed" || (ends && ends <= Date.now() && s !== "scheduled" && !DRAFT.includes(s))) return "ended";
  if (s === "scheduled") return "scheduled";
  return "draft";
}
const CHIP = { live:["مباشر الآن","live"], scheduled:["ينتظر الافتتاح","wait"], draft:["مسودة","wait"], ended:["منتهي","end"], cancelled:["ملغي","end"], rejected:["مرفوض","bad"] };

/* مزاد عليه تأمين مدفوع ولم يُسترجع بعد → يظهر له زر الاسترجاع فقط */
const needsRefund = a => a.hasDeposit && a.depositPaid && a.depositStatus !== "refunded" && !["live","scheduled"].includes(kind(a));

/* الحذف: المسودة والمنتهي والملغي والمرفوض. المزاد اللي عليه تأمين مدفوع غير مسترجع ما ينحذف لحد ما يُسترجع. */
const canHardDelete = a => {
  if (!["draft","ended","cancelled","rejected"].includes(kind(a))) return false;
  if (needsRefund(a)) return false;
  return true;
};
const canBulkDelete = a => canHardDelete(a);
const canCancel = a => ["live","scheduled"].includes(kind(a));

async function getImage(id){
  try{
    const r = await supabase.from("mzad_device_images").select("storage_path,is_primary,sort_order").eq("device_id", id).limit(8);
    if (r.error || !r.data?.length) return "";
    const im = [...r.data].sort((a,b) => (Number(b.is_primary) - Number(a.is_primary)) || (Number(a.sort_order) - Number(b.sort_order)))[0];
    const p = String(im.storage_path || "");
    return /^https?:\/\//i.test(p) ? p : SUPABASE_URL + "/storage/v1/object/public/device-images/" + p.split("/").map(encodeURIComponent).join("/");
  }catch{ return ""; }
}

async function load(){
  $("list").innerHTML = '<div class="sk"></div><div class="sk"></div>';
  try{
    const au = await supabase.auth.getUser();
    user = au.data?.user;
    if (!user){ location.href = "index.html?login=1&returnTo=" + encodeURIComponent("my-auctions.html" + location.search); return; }
    const r = await supabase.from("mzad_auctions").select("id,auction_number,device_id,seller_user_id,starting_price_iqd,current_price_iqd,status,starts_at,ends_at,created_at").eq("seller_user_id", user.id).order("created_at",{ascending:false}).limit(100);
    if (r.error) throw r.error;
    auctions = await Promise.all((r.data || []).map(async a => {
      const [dr, br, sr, img, dep] = await Promise.all([
        supabase.from("mzad_devices").select("brand,model,storage").eq("id", a.device_id).maybeSingle(),
        supabase.from("mzad_auction_bids").select("id",{count:"exact",head:true}).eq("auction_id", a.id).eq("accepted", true),
        supabase.rpc("mzad_auction_stats",{ p_auction_id:a.id }),
        getImage(a.device_id),
        supabase.from("mzad_deposits").select("id,status,amount_iqd").eq("auction_id", a.id).eq("user_id", user.id).eq("deposit_type","auction_seller").order("created_at",{ascending:false}).limit(1).maybeSingle()
      ]);
      const pr = dep.data?.id ? await supabase.from("mzad_payment_requests").select("status").eq("deposit_id", dep.data.id).eq("user_id", user.id).order("created_at",{ascending:false}).limit(1).maybeSingle() : { data:null };
      const done = ["proof_submitted","approved","refunded"].includes(String(pr.data?.status || "").toLowerCase()) || ["approved","refunded"].includes(String(dep.data?.status || "").toLowerCase());
      return { ...a, device:dr.data || {}, bidCount:br.count ?? 0, reserved:Number(sr.data?.reserved) || 0, views:Number(sr.data?.viewers) || 0, image:img,
               hasDeposit:!!dep.data, depositId:dep.data?.id || null, depositStatus:String(dep.data?.status || "").toLowerCase(), depositAmount:Number(dep.data?.amount_iqd)||0, depositPaid:!!dep.data && done, depositPending:!!dep.data && !done };
    }));
    $("sTotal").textContent = money(auctions.length);
    $("sBids").textContent = money(auctions.reduce((n,a) => n + a.bidCount, 0));
    $("sRes").textContent = money(auctions.reduce((n,a) => n + a.reserved, 0));
    render();
  }catch(e){
    console.error("MY AUCTIONS ERROR", e);
    $("list").innerHTML = '<div class="empty"><span class="eb">' + IC.info + '</span><h2>تعذر تحميل مزاداتك</h2><p>تأكد من الاتصال وحاول مرة ثانية.</p><button class="btn" data-retry="1" type="button">إعادة المحاولة</button></div>';
  }
}

const TABS = [["all","الكل",()=>true],["live","مباشر",a=>kind(a)==="live"],["draft","مسودات",a=>["draft","scheduled"].includes(kind(a))],["ended","منتهي",a=>["ended","cancelled","rejected"].includes(kind(a))]];

function render(){
  $("tabs").innerHTML = TABS.map(([k,l,f]) => `<button class="tab ${tab===k?"on":""}" data-tab="${k}" type="button">${l}<i>${auctions.filter(f).length}</i></button>`).join("");
  const junk = auctions.filter(a => canBulkDelete(a));
  $("clean").hidden = junk.length < 2;
  if (junk.length >= 2) $("cleanTxt").textContent = "عندك " + junk.length + " مزادات (مسودات أو منتهية أو ملغية) تقدر تمسحها دفعة وحدة.";

  const q = $("search").value.trim().toLowerCase(), f = TABS.find(t => t[0] === tab)[2];
  const rows = auctions.filter(f).filter(a => !q || [a.device.brand, a.device.model, a.auction_number, a.id].some(v => String(v || "").toLowerCase().includes(q)));
  if (!rows.length){
    $("list").innerHTML = auctions.length
      ? '<div class="empty"><span class="eb">' + IC.info + '</span><h2>ما كو نتائج</h2><p>جرب قسم ثاني أو كلمة بحث مختلفة.</p></div>'
      : '<div class="empty"><span class="eb">' + IC.phone + '</span><h2>بعدك ما نشرت مزاد</h2><p>انشر جهازك بالمزاد وتابع كل شي من هنا.</p><a class="btn" style="text-decoration:none" href="sell-auction.html">' + IC.plus + 'مزاد جديد</a></div>';
    return;
  }
  $("list").innerHTML = rows.map((a,i) => {
    const k = kind(a), [cl, cc] = CHIP[k], d = a.device, name = [d.brand, d.model, d.storage].filter(Boolean).join(" ") || "جهاز بدون اسم";
    const price = Number(a.current_price_iqd || a.starting_price_iqd) || 0;
    const img = a.image ? `<img src="${esc(a.image)}" alt="${esc(name)}" loading="lazy" onerror="this.remove()">` : IC.phone;
    const refundNeeded = needsRefund(a);

    /* ملاحظة وحدة فقط */
    let note = "";
    if (k === "live" && a.bidCount > 0) note = `<div class="note info">${IC.shield}<span>عليه مزايدات، فما ينمسح. تقدر تلغيه فقط.</span></div>`;
    else if (["live","scheduled"].includes(k) && a.hasDeposit) note = `<div class="note info">${IC.shield}<span>تأمينك محفوظ لحد ما ينتهي المزاد.</span></div>`;
    else if (refundNeeded) note = `<div class="note info">${IC.shield}<span>استرجع التأمين أولاً، وبعدها يطلع زر الحذف.</span></div>`;

    const main = a.depositPending && ["draft","scheduled"].includes(k)
      ? `<button class="btn" data-pay="${esc(a.id)}" type="button">${IC.shield}إكمال التأمين</button>`
      : `<button class="btn" data-det="${esc(a.id)}" type="button">${IC.eye}التفاصيل</button>`;
    const sec = a.depositPending && ["draft","scheduled"].includes(k) ? `<button class="btn ghost" data-det="${esc(a.id)}" type="button" style="flex:.7">التفاصيل</button>` : "";

    /* زر استرجاع التأمين: فقط للمزاد اللي بيه تأمين مدفوع غير مسترجع */
    const refund = refundNeeded
      ? `<a class="refund-action" href="auction-refund.html?auction=${encodeURIComponent(a.id)}"><span class="refund-icon">${IC.shield}</span><span class="refund-copy"><strong>استرجاع التأمين</strong><small>${a.depositStatus === "proof_submitted" ? "طلبك قيد المراجعة عند الإدارة" : "المبلغ المستحق " + (a.depositAmount ? money(a.depositAmount) + " د.ع" : "حسب حالة التأمين")}</small></span><span class="refund-arrow" aria-hidden="true">‹</span></a>` : "";

    const rm = canHardDelete(a) ? `<button class="del" data-del="${esc(a.id)}" type="button" aria-label="مسح نهائي">${IC.trash}</button>`
      : canCancel(a) ? `<button class="del" data-cancel="${esc(a.id)}" type="button" aria-label="إلغاء المزاد" style="color:#b5480a;background:var(--hots);border-color:#f0c79c">${IC.stop}</button>` : "";
    return `<article class="card" style="animation-delay:${Math.min(i,5)*.06}s"><div class="main"><div class="ph">${img}</div><div class="inf"><div class="l1"><div class="nm">${esc(name)}</div><span class="chip ${cc}">${cl}</span></div><div class="no">رقم ${esc(a.auction_number || String(a.id).slice(0,8))}</div><div class="pr"><small>${a.current_price_iqd ? "السعر الحالي" : "سعر البداية"}</small><strong>${money(price)}<em>د.ع</em></strong></div></div></div><div class="nums"><div><b>${money(a.bidCount)}</b><span>مزايدة</span></div><div><b>${money(a.reserved)}</b><span>حاجز</span></div><div><b>${money(a.views)}</b><span>مشاهدة</span></div></div>${note}${refund}<div class="acts">${main}${sec}${rm}</div></article>`;
  }).join("");
}

/* ===== نافذة التأكيد ===== */
function ask(cfg){
  pending = cfg;
  $("shT").textContent = cfg.title; $("shP").textContent = cfg.text; $("shL").textContent = cfg.label;
  $("shI").className = "big" + (cfg.warn ? " w" : "");
  $("shYes").style.background = cfg.warn ? "var(--hot)" : "";
  $("sheet").classList.add("show");
}
const closeSheet = () => { $("sheet").classList.remove("show"); pending = null; };
const ERRS = { AUCTION_HAS_PROTECTED_DEPOSIT:"التأمين لازم يصير مسترجع أولاً.", AUCTION_IS_ACTIVE:"هذا المزاد شغّال أو ينتظر الافتتاح، فبقى مثل ما هو.", AUCTION_HAS_ENDED:"المزاد منتهي بالفعل.", NOT_AUCTION_OWNER:"هذا المزاد مو من حسابك.", AUCTION_NOT_FOUND:"المزاد مو موجود (يمكن انحذف قبل)." };
const errTxt = e => {
  const m = String(e?.message || e || "");
  for (const k in ERRS) if (m.includes(k)) return ERRS[k];
  return m === "TIMEOUT" ? "تأخر الرد. حدّث الصفحة وتأكد من الحالة." : "تعذر التنفيذ: " + m.slice(0, 120);
};
const rpc = (fn, id) => Promise.race([supabase.rpc(fn, { p_auction_id:id }), new Promise((_,j) => setTimeout(() => j(new Error("TIMEOUT")), 12000))]);

$("shYes").addEventListener("click", async () => {
  if (!pending) return;
  const b = $("shYes"), c = pending; b.classList.add("busy"); b.disabled = true;
  try{
    for (const id of c.ids){
      const r = await rpc(c.fn, id);
      if (r.error) throw r.error;
      const paths = Array.isArray(r.data?.storage_paths) ? r.data.storage_paths : [];
      const cleanPaths = [...new Set(paths.map(p => String(p || "").replace(/^device-images\//, "").replace(/^\/+/, "")).filter(Boolean))];
      if (cleanPaths.length){
        const sr = await supabase.storage.from("device-images").remove(cleanPaths);
        if (sr.error) { console.error("STORAGE CLEANUP ERROR", sr.error, cleanPaths); toast("انحذف السجل، لكن بعض الصور بقيت بالتخزين."); }
      }
    }
    toast(c.done); closeSheet(); await load();
  }catch(e){ console.error("ACTION ERROR", e); toast(errTxt(e)); closeSheet(); await load(); }
  finally{ b.classList.remove("busy"); b.disabled = false; }
});
$("shNo").addEventListener("click", closeSheet);
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

$("list").addEventListener("click", e => {
  const g = s => e.target.closest(s);
  let el;
  if ((el = g("[data-det]"))) location.href = "auction-details.html?auction=" + encodeURIComponent(el.dataset.det);
  else if ((el = g("[data-pay]"))) location.href = "auction-seller-deposit.html?auction=" + encodeURIComponent(el.dataset.pay);
  else if (g("[data-retry]")) load();
  else if ((el = g("[data-del]"))) ask({ ids:[el.dataset.del], fn:"mzad_seller_delete_auction_draft", title:"مسح المزاد نهائياً؟", text:"راح ينحذف المزاد وكل بياناته نهائياً (الجهاز، الصور، المزايدات). ما يرجع.", label:"امسح نهائياً", done:"انمسح المزاد" });
  else if ((el = g("[data-cancel]"))) ask({ ids:[el.dataset.cancel], fn:"mzad_seller_cancel_auction", warn:true, title:"إلغاء المزاد؟", text:"يوقف المزاد وتنحفظ بياناته. إذا كان عليه تأمين يبقى محفوظاً لحد موعد النهاية.", label:"ألغِ المزاد", done:"تم إلغاء المزاد" });
});
$("tabs").addEventListener("click", e => { const t = e.target.closest("[data-tab]"); if (t){ tab = t.dataset.tab; render(); } });
$("cleanBtn").addEventListener("click", () => {
  const ids = auctions.filter(a => canBulkDelete(a)).map(a => a.id);
  ask({ ids, fn:"mzad_seller_delete_auction_draft", title:"مسح " + ids.length + " مزادات؟", text:"تنحذف كل المزادات القابلة للحذف مع بياناتها نهائياً. اللي عليها تأمين غير مسترجع ما تنحذف.", label:"امسحها كلها", done:"تم المسح" });
});
$("search").addEventListener("input", render);
$("refresh").addEventListener("click", load);
$("back").addEventListener("click", () => history.length > 1 ? history.back() : location.href = "profile.html");
load();
</script>
