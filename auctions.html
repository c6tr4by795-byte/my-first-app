<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#6246d9">
<title>MZAD PHONE — المزادات</title>
<style>
:root{--bg:#f9f8fd;--ink:#17202a;--muted:#6b7280;--line:#ece8fb;--edge:#e0daf8;--p:#6246d9;--pd:#4a34b8;--ps:#f3f0ff;--hot:#e8590c;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.page{width:min(100%,520px);margin:0 auto;padding:0 14px calc(92px + var(--sb))}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.3}}
header{margin-inline:-14px;padding:0 14px 14px;background:linear-gradient(145deg,#fff,#ece8ff);border-radius:0 0 24px 24px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 0}
.ib{width:39px;height:34px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--p)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;flex-direction:column;align-items:center;line-height:.9}
.brand b{font-size:16px;letter-spacing:-.03em}.brand span{font-size:7px;font-weight:800;letter-spacing:.15em;color:#8a96a3;margin-top:3px}
h1{margin:14px 2px 0;font-size:22px;font-weight:950;letter-spacing:-.035em}
.sub{margin:3px 2px 12px;font-size:11px;font-weight:700;color:var(--muted)}
.sw{position:relative}
.search{width:100%;height:45px;border:1px solid var(--edge);border-radius:15px;background:#fff;padding:0 44px 0 42px;outline:none;color:var(--ink);box-shadow:0 8px 22px rgba(98,70,217,.1)}
.search:focus{border-color:#a99cf0}
.si{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);width:21px;height:21px;pointer-events:none;color:var(--p);fill:none;stroke:currentColor;stroke-width:1.9}
.clr{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:33px;height:33px;border-radius:11px;background:var(--ps);display:grid;place-items:center;opacity:0;pointer-events:none;color:var(--pd)}
.clr svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9}
.sw.has .clr{opacity:1;pointer-events:auto}
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800;color:#4b5563;white-space:nowrap}
.chip.on{background:var(--ps);border-color:#c9bff7;color:var(--pd);font-weight:900}
.result{margin:10px 4px 8px;font-size:11px;font-weight:800;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.c{position:relative;display:flex;gap:12px;padding:10px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px rgba(98,70,217,.07);cursor:pointer;animation:up .4s backwards;-webkit-tap-highlight-color:transparent}
.c:active{transform:scale(.99)}
.img{position:relative;flex:0 0 116px;height:142px;border-radius:15px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(160deg,#7b61e8,#3b2a92)}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img svg{width:34px;height:34px;opacity:.55}
.fav{position:absolute;top:6px;inset-inline-start:6px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.97);color:#7b7f84;box-shadow:0 5px 13px rgba(23,32,42,.11)}
.fav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fav.on{color:var(--p)}.fav.on svg{fill:var(--p)}
.pill{position:absolute;bottom:6px;inset-inline:6px;padding:3px 0;border-radius:9px;background:rgba(255,255,255,.96);color:var(--pd);text-align:center;font-size:10.5px;font-weight:950;direction:ltr;font-variant-numeric:tabular-nums}
.pill.hot{background:#fff4ec;color:var(--hot)}
.body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.t{margin:0;font-size:14.5px;font-weight:900;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:3px;font-size:10px;font-weight:750;color:var(--muted)}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{padding:3px 8px;border-radius:8px;background:var(--ps);color:var(--pd);font-size:9.5px;font-weight:900}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid #f1eefb}
.lbl{display:block;font-size:9px;font-weight:800;color:var(--muted)}
.price{font-size:16px;font-weight:950;color:var(--pd);font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{font-size:9px;font-weight:800;color:var(--muted);margin-inline-start:3px}
.go{height:36px;padding:0 16px;border-radius:12px;color:#fff;font-size:12px;font-weight:950;background:linear-gradient(145deg,#6246d9,#8b6cf0);box-shadow:0 6px 14px rgba(98,70,217,.28)}
.empty{padding:34px 18px;text-align:center;border-radius:20px;background:#fff;border:1px dashed #cfc7f3}
.empty h3{margin:0 0 4px;font-size:15px;font-weight:900}.empty p{margin:0;font-size:11px;font-weight:700;color:var(--muted);line-height:1.7}
.sk{height:162px;border-radius:20px;background:#f1eefb}
.bw{position:fixed;left:0;right:0;bottom:-7px;padding:7px 10px calc(7px + var(--sb));z-index:100;pointer-events:none}
.nav{width:min(100%,520px);margin:0 auto;min-height:64px;padding:5px;border-radius:20px;background:rgba(255,255,255,.97);border:1px solid #e7ecef;box-shadow:0 10px 28px rgba(23,32,42,.1);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);pointer-events:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;align-items:center}
.ni{min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:15px;color:#7e8992}
.ni.on{color:var(--pd);background:var(--ps)}
.ni svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ni span.l{font-size:8.5px;line-height:1;font-weight:900;white-space:nowrap}
.add{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#6246d9,#8b6cf0);box-shadow:0 6px 14px rgba(98,70,217,.25)}
.add svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--sb));transform:translateX(-50%) translateY(16px);padding:10px 14px;border-radius:13px;background:#1e2c30;color:#fff;font-size:11px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:120}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
<header>
  <div class="top">
    <button class="ib" id="back" type="button" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="brand"><b>MZAD</b><span>PHONE</span></div>
    <span style="width:39px"></span>
  </div>
  <h1>المزادات الحالية</h1>
  <p class="sub">تابع الأجهزة وزايد قبل ما ينتهي الوقت</p>
  <div class="sw" id="sw">
    <svg class="si" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="search" class="search" type="search" autocomplete="off" inputmode="search" placeholder='ابحث عن مزاد، مثل "iPhone 15"' aria-label="البحث عن مزاد">
    <button id="clear" class="clr" type="button" aria-label="مسح"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  </div>
</header>
<div class="filters" id="filters">
  <button class="chip on" data-f="all">الكل</button>
  <button class="chip" data-f="soon">تنتهي قريباً</button>
  <button class="chip" data-f="new">الأحدث</button>
  <button class="chip" data-f="low">الأقل سعراً</button>
  <button class="chip" data-f="high">الأعلى سعراً</button>
</div>
<div class="result" id="result"></div>
<section class="list" id="list" aria-live="polite"></section>
</main>

<div class="bw"><nav class="nav">
  <a class="ni" href="home.html"><svg class="i" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg><span class="l">الرئيسية</span></a>
  <a class="ni on" href="auctions.html"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span class="l">المزادات</span></a>
  <a class="ni" href="sell.html"><span class="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="l">إضافة</span></a>
  <a class="ni" href="favorites.html"><svg class="i" viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/></svg><span class="l">المفضلة</span></a>
  <a class="ni" href="profile.html"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.4 3.1-5 7-5s6.2 1.6 7 5"/></svg><span class="l">حسابي</span></a>
</nav></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { supabase } from "./js/supabase.js";
const $ = id => document.getElementById(id);
const fmt = n => Number(n||0).toLocaleString("en-US");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let AU = [], filter = "all", query = "", tt, loading = false;

/* المفضلة */
const FK = "mzad_favorite_auctions";
const getFavs = () => { try{ const p = JSON.parse(localStorage.getItem(FK) || "[]"); return new Set(Array.isArray(p) ? p.map(String) : []); }catch{ return new Set(); } };
const favs = getFavs();
const saveFavs = () => { try{ localStorage.setItem(FK, JSON.stringify([...favs])); }catch{} };

/* بحث عربي/إنجليزي */
const norm = v => String(v||"").toLowerCase().normalize("NFKC")
  .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
  .replace(/اي ?فون|ايفن|اىفون/g,"iphone").replace(/سامسو?نج/g,"samsung").replace(/شي?اومي/g,"xiaomi")
  .replace(/[جق]وجل/g,"google").replace(/بكسل/g,"pixel").replace(/ون بل[اس]س?/g,"oneplus").replace(/\s+/g," ").trim();

const endOf = a => new Date(a.ends_at).getTime();
const timeText = left => {
  if (left <= 0) return "انتهى";
  const D=864e5, H=36e5, M=6e4, p=n=>String(n).padStart(2,"0");
  if (left >= D) return Math.floor(left/D) + " يوم " + p(Math.floor(left%D/H)) + ":00";
  return p(Math.floor(left/H)) + ":" + p(Math.floor(left%H/M)) + ":" + p(Math.floor(left%M/1000));
};

/* الجلب: المزادات المباشرة + الأجهزة + الصور + عدد المزايدات */
async function fetchAuctions(){
  const a = await supabase.from("mzad_auctions")
    .select("id,auction_number,device_id,starting_price_iqd,current_price_iqd,status,ends_at,created_at")
    .eq("status","live").gt("ends_at", new Date().toISOString()).order("created_at",{ascending:false}).limit(100);
  if (a.error) throw a.error;
  const list = a.data || [];
  if (!list.length) return [];
  const devIds = [...new Set(list.map(x => x.device_id).filter(Boolean))];
  const ids = list.map(x => x.id);

  const [d, im, b] = await Promise.all([
    supabase.from("mzad_devices").select("id,brand,model,storage,color,condition_grade,battery_health").in("id", devIds),
    supabase.from("mzad_device_images").select("device_id,storage_path,is_primary,sort_order").in("device_id", devIds).order("sort_order",{ascending:true}),
    supabase.from("mzad_auction_bids").select("auction_id").in("auction_id", ids).eq("accepted", true)
  ]);
  const devs = new Map((d.data||[]).map(x => [x.id, x]));
  const bids = new Map();
  (b.data||[]).forEach(r => bids.set(r.auction_id, (bids.get(r.auction_id)||0) + 1));

  const pick = new Map();
  (im.data||[]).forEach(r => { const cur = pick.get(r.device_id); if (!cur || (r.is_primary && !cur.is_primary)) pick.set(r.device_id, r); });
  const paths = [...pick.values()].map(r => r.storage_path);
  const urls = new Map();
  if (paths.length){
    try{
      const s = await supabase.storage.from("device-images").createSignedUrls(paths, 3600);
      (s.data||[]).forEach(r => { if (r.signedUrl) urls.set(r.path, r.signedUrl); });
    }catch(e){ console.error("IMG:", e); }
  }
  return list.map(x => ({ ...x, dev: devs.get(x.device_id) || {}, bids: bids.get(x.id) || 0, img: urls.get(pick.get(x.device_id)?.storage_path) || "" }));
}

async function load(first){
  if (loading) return; loading = true;
  try{
    if (first){ $("result").textContent = "جاري تحميل المزادات..."; $("list").innerHTML = '<div class="sk"></div><div class="sk"></div>'; }
    AU = await fetchAuctions();
    render();
  }catch(e){
    console.error("AUCTIONS ERROR:", e);
    if (first){ $("result").textContent = ""; $("list").innerHTML = '<div class="empty"><h3>تعذر تحميل المزادات</h3><p>تأكد من الاتصال وحاول مرة ثانية.</p></div>'; }
  }finally{ loading = false; }
}

function visible(){
  const now = Date.now();
  let l = AU.filter(a => endOf(a) > now).filter(a => !query || norm([a.dev.brand,a.dev.model,a.dev.storage,a.dev.color,a.dev.condition_grade].filter(Boolean).join(" ")).includes(norm(query)));
  if (filter === "soon") l = l.filter(a => endOf(a) - now <= 30*6e4).sort((a,b) => endOf(a) - endOf(b));
  if (filter === "new")  l = [...l].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  if (filter === "low")  l = [...l].sort((a,b) => a.current_price_iqd - b.current_price_iqd);
  if (filter === "high") l = [...l].sort((a,b) => b.current_price_iqd - a.current_price_iqd);
  return l;
}

const PH = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>';
const HEART = '<svg viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/></svg>';

function render(){
  const l = visible();
  $("result").textContent = l.length + " مزاد";
  if (!l.length){
    $("list").innerHTML = `<div class="empty"><h3>لا توجد مزادات مطابقة</h3><p>${AU.length ? "جرب كلمة بحث ثانية أو ارجع لعرض الكل." : "لا توجد مزادات منشورة حالياً."}</p></div>`;
    return;
  }
  $("list").innerHTML = l.map((a,i) => {
    const d = a.dev, id = String(a.id);
    const title = [d.brand,d.model].filter(Boolean).join(" ") || "جهاز";
    const meta = [d.storage,d.color].filter(Boolean).join(" • ");
    return `<article class="c" data-id="${esc(id)}" tabindex="0" role="link" aria-label="${esc(title)}" style="animation-delay:${Math.min(i,6)*.05}s">
      <div class="img">${a.img ? `<img src="${esc(a.img)}" alt="${esc(title)}" loading="${i<2?"eager":"lazy"}" onerror="this.remove()">` : PH}
        <button class="fav${favs.has(id)?" on":""}" type="button" aria-label="المفضلة">${HEART}</button>
        <span class="pill" data-id="${esc(id)}"></span>
      </div>
      <div class="body"><div>
        <h3 class="t">${esc(title)}</h3>
        ${meta ? `<div class="meta">${esc(meta)}</div>` : ""}
        <div class="tags">${d.condition_grade ? `<span class="tag">${esc(d.condition_grade)}</span>` : ""}<span class="tag">${a.bids} مزايدة</span></div>
      </div>
      <div class="foot"><div><span class="lbl">السعر الحالي</span><div class="price">${fmt(a.current_price_iqd ?? a.starting_price_iqd)}<small>د.ع</small></div></div><button class="go" type="button">زايد</button></div></div>
    </article>`;
  }).join("");
  tick();
}

function tick(){
  const now = Date.now();
  let ended = false;
  document.querySelectorAll(".pill").forEach(el => {
    const a = AU.find(x => String(x.id) === el.dataset.id); if (!a) return;
    const left = endOf(a) - now;
    el.textContent = timeText(left);
    el.classList.toggle("hot", left > 0 && left <= 5*6e4);
    if (left <= 0) ended = true;
  });
  if (ended) render();           // يشيل المزاد المنتهي من القائمة
}

const open = id => { if (id) location.href = "auction-details.html?auction=" + encodeURIComponent(id); };
$("list").addEventListener("click", e => {
  const f = e.target.closest(".fav");
  const card = e.target.closest(".c"); if (!card) return;
  if (f){
    e.stopPropagation();
    const id = card.dataset.id, on = !favs.has(id);
    on ? favs.add(id) : favs.delete(id); saveFavs();
    f.classList.toggle("on", on);
    toast(on ? "تمت الإضافة للمفضلة" : "تمت الإزالة من المفضلة");
    return;
  }
  open(card.dataset.id);
});
$("list").addEventListener("keydown", e => { if (e.key === "Enter") open(e.target.closest(".c")?.dataset.id); });

$("filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
  render();
});
const sync = () => $("sw").classList.toggle("has", $("search").value.trim().length > 0);
$("search").addEventListener("input", e => { query = e.target.value.trim(); sync(); render(); });
$("clear").addEventListener("click", () => { $("search").value = ""; query = ""; sync(); render(); $("search").focus(); });
$("back").addEventListener("click", () => history.length > 1 ? history.back() : location.href = "home.html");

function toast(m){ const el = $("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2000); }

load(true);
const t1 = setInterval(tick, 1000);
const t2 = setInterval(() => { if (!document.hidden) load(false); }, 15000);
addEventListener("pagehide", () => { clearInterval(t1); clearInterval(t2); });
</script>
</body>
</html>
