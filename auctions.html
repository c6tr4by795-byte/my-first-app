<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MZAD PHONE — المزادات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4fc;--ink:#1b1740;--muted:#6c6f8a;--line:#e8e4f7;--p:#6246d9;--p2:#8b6cf0;--pd:#3c2a9e;--ps:#f1eeff;--night:#150d42;--hot:#e8590c;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:"Tajawal",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit}
:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
.page{width:min(100%,520px);margin:0 auto;padding:0 14px calc(104px + var(--sb));overflow-x:clip}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.35}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* الهيدر البسيط */
.hd{margin-inline:-14px;padding:calc(8px + var(--st)) 14px 10px;background:#fff;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--ps);color:var(--pd)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0;font-size:18px;font-weight:900;letter-spacing:-.01em;color:var(--ink)}
.sw{position:relative}
.search{width:100%;height:44px;border:1px solid var(--line);border-radius:999px;background:var(--ps);padding:0 44px 0 42px;outline:none;color:var(--ink);font-size:14px;font-weight:500}
.search:focus{border-color:var(--p2);background:#fff}
.search::placeholder{color:#9a9db5}
.si{position:absolute;inset-inline-end:15px;top:50%;transform:translateY(-50%);width:19px;height:19px;pointer-events:none;color:var(--p);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.clr{position:absolute;inset-inline-start:7px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;opacity:0;pointer-events:none;color:var(--pd)}
.clr svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.sw.has .clr{opacity:1;pointer-events:auto}

/* الفلاتر */
.filters{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;margin-inline:-14px;padding:12px 14px 10px;background:rgba(246,244,252,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:#55587a;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip.on{background:var(--pd);border-color:var(--pd);color:#fff}
.result{display:flex;align-items:center;gap:8px;margin:6px 4px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.result:before{content:"";width:8px;height:8px;border-radius:50%;background:#17805a;animation:blink 1.5s infinite}

/* بطاقات المزاد */
.list{display:flex;flex-direction:column;gap:6px;margin-inline:-8px}
.c{position:relative;display:grid;grid-template-columns:38% minmax(0,1fr);height:150px;min-height:150px;background:#fff;border-radius:12px;border:1px solid #ececf3;overflow:hidden;cursor:pointer;transition:transform .16s;-webkit-tap-highlight-color:transparent}
.c:active{transform:scale(.993)}
.c.enter{animation:up .4s ease-out backwards}
.im{position:relative;grid-column:1;grid-row:1;min-width:0;min-height:0;height:100%;display:grid;place-items:center;overflow:hidden;background:#f1eeff}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity .3s}
.im img.ok{opacity:1}
.im>svg{width:30px;height:30px;opacity:.25}
.lv{position:absolute;top:7px;inset-inline-end:7px;z-index:2;display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.94);color:#17805a;font-size:10px;font-weight:800}
.lv:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
.fav{position:absolute;top:7px;inset-inline-start:7px;z-index:2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.94);color:#80839c}
.fav svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.fav.on{color:var(--p)}.fav.on svg{fill:var(--p);transform:scale(1.12)}
.cb{grid-column:2;grid-row:1;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-width:0;min-height:0;height:100%;padding:10px 12px 9px;overflow:hidden}
.t{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:18px;font-weight:900;line-height:1.25;letter-spacing:-.01em;color:#3a3a4a}

/* الشكل البيضوي للمواصفات (ذاكرة / لون / بطارية) */
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-width:0;max-height:62px;overflow:hidden}
.tag{flex:0 0 auto;max-width:100%;padding:4px 12px;border:1px solid #ddd5fb;border-radius:999px;background:var(--ps);color:var(--pd);font-size:12.5px;font-weight:800;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ft{display:flex;direction:ltr;align-items:flex-end;justify-content:space-between;gap:7px;min-width:0;margin-top:auto}
.pricebox{min-width:0;overflow:hidden}
.lbl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9.5px;font-weight:500;color:#858585;line-height:1.35;direction:rtl;text-align:left}
.pv{display:flex;direction:ltr;align-items:baseline;gap:4px;margin:0 0 1px;white-space:nowrap}
.pv strong{font-size:22px;font-weight:800;color:#e94d45;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.08}
.pv small{font-size:10px;font-weight:700;color:#858585}
.pv.flash strong{animation:pf .8s}
@keyframes pf{0%{color:#17805a;transform:scale(1.05)}100%{transform:none}}
.pill{display:flex;flex:0 0 auto;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:1px;max-width:46%;text-align:right;direction:rtl}
.pill small{font-size:9.5px;font-weight:500;color:#858585;white-space:nowrap}
.pill b{font-size:12.5px;font-weight:800;color:#666;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.hot b{color:#e8590c}
.empty{padding:40px 20px;text-align:center;border-radius:16px;background:#fff;border:1px dashed #cfc7f3}
.empty h3{margin:0 0 6px;font-size:16px;font-weight:900}
.empty p{margin:0;font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.8}
.sk{height:150px;border-radius:12px;background:linear-gradient(100deg,#eeeafa 30%,#f8f6ff 50%,#eeeafa 70%);background-size:300% 100%;animation:shimmer 1.6s linear infinite}
@media(max-width:360px){
  .c{height:146px;min-height:146px}
  .cb{padding:8px 9px 7px}
  .t{font-size:16px}
  .tag{padding:3px 9px;font-size:11.5px}
  .pv strong{font-size:19px}
  .pill{max-width:43%}
  .pill b{font-size:11px}
}

/* الشريط السفلي */
.bw{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + var(--sb));z-index:100;pointer-events:none}
.nav{width:min(100%,520px);margin:0 auto;min-height:66px;padding:6px;border-radius:22px;background:rgba(255,255,255,.96);border:1px solid #e7e3f6;box-shadow:0 14px 30px rgba(45,27,122,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);pointer-events:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;align-items:center}
.ni{min-height:54px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:16px;color:#80839c}
.ni.on{color:var(--pd);background:var(--ps)}
.ni svg.i{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ni .l{font-size:10px;line-height:1;font-weight:800;white-space:nowrap}
.add{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#4a34b8,#7a5cf0);box-shadow:0 8px 16px rgba(98,70,217,.3)}
.add svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.toast{position:fixed;left:50%;bottom:calc(98px + var(--sb));transform:translateX(-50%) translateY(16px);padding:11px 18px;border-radius:14px;background:var(--night);color:#fff;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:120;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
<header class="hd">
  <div class="top">
    <button class="ib" id="back" type="button" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <h1>المزادات المباشرة</h1>
    <span style="width:38px"></span>
  </div>
  <div class="sw" id="sw">
    <svg class="si" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="search" class="search" type="search" autocomplete="off" inputmode="search" placeholder='ابحث عن جهاز، مثل "iPhone 15"' aria-label="البحث عن مزاد">
    <button id="clear" class="clr" type="button" aria-label="مسح"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  </div>
</header>

<div class="filters" id="filters">
  <button class="chip on" data-f="all" type="button">الكل</button>
  <button class="chip" data-f="soon" type="button">تنتهي قريباً</button>
  <button class="chip" data-f="new" type="button">الأحدث</button>
  <button class="chip" data-f="low" type="button">الأقل سعراً</button>
  <button class="chip" data-f="high" type="button">الأعلى سعراً</button>
</div>

<div class="result" id="result"></div>
<section class="list" id="list" aria-live="polite"></section>
<div class="empty" id="empty" hidden><h3 id="eT"></h3><p id="eP"></p></div>
</main>

<div class="bw"><nav class="nav">
  <a class="ni" href="home.html"><svg class="i" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg><span class="l">الرئيسية</span></a>
  <a class="ni on" href="auctions.html"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span class="l">المزادات</span></a>
  <a class="ni" href="sell.html"><span class="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="l">إضافة</span></a>
  <a class="ni" href="favorites.html"><svg class="i" viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/></svg><span class="l">المفضلة</span></a>
  <a class="ni" href="profile.html"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.4 3.1-5 7-5s6.2 1.6 7 5"/></svg><span class="l">حسابي</span></a>
</nav></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { supabase } from "./js/supabase.js";
const $ = id => document.getElementById(id);
const fmt = n => Number(n||0).toLocaleString("en-US");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let AU = [], filter = "all", query = "", tt, loading = false;
const els = new Map();
const devCache = new Map();
const picCache = new Map();
const urlCache = new Map();

/* المفضلة */
const FK = "mzad_favorite_auctions";
const getFavs = () => { try{ const p = JSON.parse(localStorage.getItem(FK) || "[]"); return new Set(Array.isArray(p) ? p.map(String) : []); }catch{ return new Set(); } };
const favs = getFavs();
const saveFavs = () => { try{ localStorage.setItem(FK, JSON.stringify([...favs])); }catch{} };

/* بحث عربي/إنجليزي */
const norm = v => String(v||"").toLowerCase().normalize("NFKC")
  .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
  .replace(/اي ?فون|ايفن|اىفون/g,"iphone").replace(/سامسو?نج/g,"samsung").replace(/شي?اومي/g,"xiaomi")
  .replace(/[جق]وجل/g,"google").replace(/بكسل/g,"pixel").replace(/ون بل[اس]س?/g,"oneplus").replace(/\s+/g," ").trim();

const endOf = a => new Date(a.ends_at).getTime();
const p2 = n => String(n).padStart(2,"0");
const timeText = left => {
  if (left <= 0) return "انتهى";
  const D=864e5, H=36e5, M=6e4;
  if (left >= D) return Math.floor(left/D) + " يوم و " + Math.floor(left%D/H) + " ساعة";
  return p2(Math.floor(left/H)) + ":" + p2(Math.floor(left%H/M)) + ":" + p2(Math.floor(left%M/1000));
};

async function fetchAuctions(){
  const a = await supabase.from("mzad_auctions")
    .select("id,auction_number,device_id,starting_price_iqd,current_price_iqd,bid_increment_iqd,status,ends_at,created_at")
    .eq("status","live").gt("ends_at", new Date().toISOString()).order("created_at",{ascending:false}).limit(100);
  if (a.error) throw a.error;
  const list = a.data || [];
  if (!list.length) return [];
  const ids = list.map(x => x.id);
  const devIds = [...new Set(list.map(x => x.device_id).filter(Boolean))];
  const needDev = devIds.filter(i => !devCache.has(i));
  const needPic = devIds.filter(i => !picCache.has(i));

  const [d, im, b] = await Promise.all([
    needDev.length ? supabase.from("mzad_devices").select("id,brand,model,storage,color,condition_grade,battery_health").in("id", needDev) : null,
    needPic.length ? supabase.from("mzad_device_images").select("device_id,storage_path,is_primary,sort_order").in("device_id", needPic).order("sort_order",{ascending:true}) : null,
    supabase.from("mzad_auction_bids").select("auction_id").in("auction_id", ids).eq("accepted", true)
  ]);
  (d?.data||[]).forEach(x => devCache.set(x.id, x));
  if (im){
    const pick = new Map();
    (im.data||[]).forEach(r => { const cur = pick.get(r.device_id); if (!cur || (r.is_primary && !cur.is_primary)) pick.set(r.device_id, r); });
    needPic.forEach(id => picCache.set(id, pick.get(id)?.storage_path || ""));
  }
  const bids = new Map();
  (b.data||[]).forEach(r => bids.set(r.auction_id, (bids.get(r.auction_id)||0) + 1));

  const now = Date.now();
  const missing = [...new Set(devIds.map(i => picCache.get(i)).filter(p => p && (!urlCache.get(p) || now - urlCache.get(p).t > 45*6e4)))];
  if (missing.length){
    try{
      const s = await supabase.storage.from("device-images").createSignedUrls(missing, 3600);
      (s.data||[]).forEach(r => { if (r.signedUrl) urlCache.set(r.path, { url:r.signedUrl, t:now }); });
    }catch(e){ console.error("IMG:", e); }
  }
  return list.map(x => ({ ...x, dev: devCache.get(x.device_id) || {}, bids: bids.get(x.id) || 0, img: urlCache.get(picCache.get(x.device_id))?.url || "" }));
}

async function load(first){
  if (loading) return; loading = true;
  try{
    if (first){ $("result").textContent = "جاري تحميل المزادات..."; $("list").innerHTML = '<div class="sk"></div><div class="sk"></div>'; }
    AU = await fetchAuctions();
    render();
  }catch(e){
    console.error("AUCTIONS ERROR:", e);
    if (first){ $("result").textContent = ""; $("list").replaceChildren(); showEmpty("تعذر تحميل المزادات","تأكد من الاتصال وحاول مرة ثانية."); }
  }finally{ loading = false; }
}

function visible(){
  const now = Date.now();
  const q = norm(query);
  let l = AU.filter(a => endOf(a) > now).filter(a => !q || norm([a.dev.brand,a.dev.model,a.dev.storage,a.dev.color,a.dev.condition_grade].filter(Boolean).join(" ")).includes(q));
  if (filter === "soon") l = l.filter(a => endOf(a) - now <= 3*36e5).sort((a,b) => endOf(a) - endOf(b));
  if (filter === "new")  l = [...l].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  if (filter === "low")  l = [...l].sort((a,b) => a.current_price_iqd - b.current_price_iqd);
  if (filter === "high") l = [...l].sort((a,b) => b.current_price_iqd - a.current_price_iqd);
  return l;
}

const PH = '<svg viewBox="0 0 24 24" fill="none" stroke="#6246d9" stroke-width="1.5"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>';
const HEART = '<svg viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/></svg>';

function setImg(el, a){
  const box = el.querySelector(".im");
  if (!a.img || box.querySelector("img")) return;
  const img = document.createElement("img");
  img.alt = [a.dev.brand,a.dev.model].filter(Boolean).join(" ");
  img.onload = () => img.classList.add("ok");
  img.onerror = () => img.remove();
  img.decoding = "async";
  img.src = a.img;
  box.querySelector("svg")?.remove();
  box.prepend(img);
}

function makeCard(a, i){
  const d = a.dev, id = String(a.id);
  const title = [d.brand,d.model].filter(Boolean).join(" ") || "جهاز";
  const bat = d.battery_health ? "بطارية " + (/^\d+$/.test(String(d.battery_health)) ? d.battery_health + "%" : d.battery_health) : "";
  const specs = [d.storage,d.color,bat,d.condition_grade].filter(Boolean).slice(0,4);
  const el = document.createElement("article");
  el.className = "c enter"; el.dataset.id = id; el.tabIndex = 0; el.setAttribute("role","link"); el.setAttribute("aria-label", title);
  el.style.animationDelay = Math.min(i,5)*.06 + "s";
  el.addEventListener("animationend", () => el.classList.remove("enter"), { once:true });
  el.innerHTML = `<div class="im">${PH}
      <span class="lv">مباشر</span>
      <button class="fav${favs.has(id)?" on":""}" type="button" aria-label="المفضلة">${HEART}</button>
    </div>
    <div class="cb">
      <h3 class="t">${esc(title)}</h3>
      <div class="tags">${specs.map(s => `<span class="tag">${esc(s)}</span>`).join("")}</div>
      <div class="ft">
        <div class="pricebox">
          <div class="pv"><strong data-price></strong><small>د.ع</small></div>
          <span class="lbl">بدأ من ${fmt(a.starting_price_iqd)} د.ع · <span data-bids></span></span>
        </div>
        <span class="pill"><small>ينتهي بعد</small><b></b></span>
      </div>
    </div>`;
  return el;
}

function updateCard(el, a){
  setImg(el, a);
  const price = fmt(a.current_price_iqd ?? a.starting_price_iqd);
  const pe = el.querySelector("[data-price]");
  if (pe.textContent !== price){
    const first = pe.textContent === "";
    pe.textContent = price;
    if (!first){ const pv = pe.parentElement; pv.classList.remove("flash"); void pv.offsetWidth; pv.classList.add("flash"); }
  }
  const bt = a.bids + " مزايدة";
  const be = el.querySelector("[data-bids]"); if (be.textContent !== bt) be.textContent = bt;
  timerOne(el, a);
}

function timerOne(el, a){
  const left = endOf(a) - Date.now();
  const pill = el.querySelector(".pill");
  pill.querySelector("b").textContent = timeText(left);
  pill.classList.toggle("hot", left > 0 && left <= 5*6e4);
  return left <= 0;
}

function showEmpty(t, p){ $("eT").textContent = t; $("eP").textContent = p; $("empty").hidden = false; }

function render(){
  const l = visible();
  $("result").textContent = l.length + " مزاد مباشر";
  const list = $("list");
  const alive = new Set(AU.map(a => String(a.id)));
  [...els.keys()].forEach(k => { if (!alive.has(k)) els.delete(k); });

  if (!l.length){
    list.replaceChildren();
    showEmpty(AU.length ? "لا توجد مزادات مطابقة" : "لا توجد مزادات الآن", AU.length ? "جرب كلمة بحث ثانية أو ارجع لعرض الكل." : "ارجع بعد قليل، المزادات الجديدة تظهر هنا فور نشرها.");
    return;
  }
  $("empty").hidden = true;
  const want = l.map((a,i) => {
    const id = String(a.id);
    let el = els.get(id);
    if (!el){ el = makeCard(a, i); els.set(id, el); }
    updateCard(el, a);
    return el;
  });
  [...list.children].forEach(ch => { if (!want.includes(ch)) ch.remove(); });
  want.forEach((el, i) => { if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null); });
}

function tick(){
  let ended = false;
  const byId = new Map(AU.map(a => [String(a.id), a]));
  $("list").querySelectorAll(".c").forEach(el => {
    const a = byId.get(el.dataset.id);
    if (a && timerOne(el, a)) ended = true;
  });
  if (ended){ AU = AU.filter(a => endOf(a) > Date.now()); render(); }
}

const open = id => { if (id) location.href = "auction-details.html?auction=" + encodeURIComponent(id); };
$("list").addEventListener("click", e => {
  const card = e.target.closest(".c"); if (!card) return;
  const f = e.target.closest(".fav");
  if (f){
    e.stopPropagation();
    const id = card.dataset.id, on = !favs.has(id);
    on ? favs.add(id) : favs.delete(id); saveFavs();
    f.classList.toggle("on", on);
    toast(on ? "تمت الإضافة للمفضلة" : "تمت الإزالة من المفضلة");
    return;
  }
  open(card.dataset.id);
});
$("list").addEventListener("keydown", e => { if (e.key === "Enter") open(e.target.closest(".c")?.dataset.id); });

$("filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
  render();
  if (filter === "soon" && !visible().length) showEmpty("لا توجد مزادات تنتهي قريباً","لا يوجد مزاد ينتهي خلال الساعات الثلاث القادمة.");
});
const sync = () => $("sw").classList.toggle("has", $("search").value.trim().length > 0);
$("search").addEventListener("input", e => { query = e.target.value.trim(); sync(); render(); });
$("clear").addEventListener("click", () => { $("search").value = ""; query = ""; sync(); render(); $("search").focus(); });
$("back").addEventListener("click", () => history.length > 1 ? history.back() : location.href = "home.html");

function toast(m){ const el = $("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1800); }

load(true);
const t1 = setInterval(tick, 1000);
const t2 = setInterval(() => { if (!document.hidden) load(false); }, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });
addEventListener("pagehide", () => { clearInterval(t1); clearInterval(t2); });
</script>
<script type="module" src="./js/platform-guard.js"></script>
</body>
