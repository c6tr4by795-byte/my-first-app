<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>MZAD PHONE — المزادات</title>

<style>
:root{
  --bg:#f9f8fd; --ink:#17202a; --muted:#6b7280; --line:#ece8fb;
  --primary:#176b87; --purple:#6246d9; --purple-dark:#4a34b8; --purple-soft:#f3f0ff; --edge:#e0daf8;
  --hot:#e8590c; --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.page{width:min(100%,520px);margin:0 auto;padding:0 14px calc(92px + var(--safe-bottom))}

/* header */
header{margin-inline:-14px;padding:0 14px 14px;background:linear-gradient(145deg,#fff 0%,#f7f5ff 55%,#ece8ff 100%);
  border-radius:0 0 24px 24px;border-bottom:1px solid var(--line);box-shadow:0 10px 26px rgba(23,32,42,.05)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px 0}
.brand-mini{display:flex;flex-direction:column;align-items:center;line-height:.9}
.brand-mini strong{font-size:16px;letter-spacing:-.03em}
.brand-mini span{font-size:7px;font-weight:800;letter-spacing:.15em;color:#8a96a3;margin-top:3px}
.icon-btn{width:39px;height:34px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:12px;background:#fff;
  color:var(--purple);box-shadow:0 7px 18px rgba(23,32,42,.045)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.spacer{width:39px}
.head-copy{margin:14px 2px 12px}
.head-copy h1{margin:0;font-size:22px;letter-spacing:-.035em;font-weight:950}
.head-copy p{margin:3px 0 0;font-size:11px;font-weight:700;color:var(--muted)}

.search-wrap{position:relative}
.search{width:100%;height:45px;border:1px solid var(--edge);border-radius:15px;background:#fff;padding:0 44px 0 42px;outline:none;color:var(--ink);
  box-shadow:0 8px 22px rgba(98,70,217,.10)}
.search::placeholder{color:#9ba6aa}
.search:focus{border-color:#a99cf0}
.search-icon{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);width:21px;height:21px;pointer-events:none;color:var(--purple);
  fill:none;stroke:currentColor;stroke-width:1.9}
.search-clear{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:33px;height:33px;border-radius:11px;background:var(--purple-soft);
  display:grid;place-items:center;opacity:0;pointer-events:none;color:var(--purple-dark)}
.search-clear svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9}
.search-wrap.has-value .search-clear{opacity:1;pointer-events:auto}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800;color:#4b5563;white-space:nowrap}
.fchip.active{background:var(--purple-soft);border-color:#c9bff7;color:var(--purple-dark);font-weight:900}
.result{margin:10px 4px 8px;font-size:11px;font-weight:800;color:var(--muted)}

/* auction cards */
.list{display:flex;flex-direction:column;gap:10px}
.a-card{position:relative;display:flex;gap:12px;padding:10px;border-radius:20px;background:#fff;border:1px solid var(--line);
  box-shadow:0 8px 20px rgba(98,70,217,.07);cursor:pointer;-webkit-tap-highlight-color:transparent}
.a-card:active{transform:scale(.99)}
.a-card.done{opacity:.65}
.a-img{position:relative;flex:0 0 116px;height:142px;border-radius:15px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(145deg,#fff,#f1edff);border:1px solid var(--line)}
.a-img img{width:100%;height:100%;object-fit:cover}
.a-img svg{height:76%;width:auto;filter:drop-shadow(0 8px 10px rgba(74,52,184,.22))}
.fav{position:absolute;top:6px;inset-inline-start:6px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.97);color:#7b7f84;box-shadow:0 5px 13px rgba(23,32,42,.11)}
.fav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fav.active{color:var(--purple)}
.fav.active svg{fill:var(--purple)}
.pill{position:absolute;bottom:6px;inset-inline:6px;padding:3px 0;border-radius:9px;background:rgba(255,255,255,.96);color:var(--purple-dark);
  text-align:center;font-size:10.5px;font-weight:950;direction:ltr;font-variant-numeric:tabular-nums;box-shadow:0 4px 10px rgba(23,32,42,.08)}
.pill.hot{background:#fff4ec;color:var(--hot)}

.a-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.a-title{margin:0;font-size:14.5px;font-weight:900;line-height:1.3;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a-meta{margin-top:3px;font-size:10px;font-weight:750;color:var(--muted);line-height:1.5}
.a-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{padding:3px 8px;border-radius:8px;background:var(--purple-soft);color:var(--purple-dark);font-size:9px;font-weight:900}
.a-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid #f1eefb}
.lbl{display:block;font-size:9px;font-weight:800;color:var(--muted)}
.a-price{font-size:16px;font-weight:950;color:var(--purple-dark);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.a-price small{font-size:9px;font-weight:800;color:var(--muted);margin-inline-start:3px}
.go{flex:0 0 auto;height:36px;padding:0 16px;border-radius:12px;color:#fff;font-size:12px;font-weight:950;
  background:linear-gradient(145deg,#6246d9,#8b6cf0);box-shadow:0 6px 14px rgba(98,70,217,.28)}
.a-card.done .go{background:#9ca3af;box-shadow:none}

.empty{padding:34px 18px;text-align:center;border-radius:20px;background:#fff;border:1px dashed #cfc7f3}
.empty h3{margin:0 0 4px;font-size:15px;font-weight:900}
.empty p{margin:0;font-size:11px;font-weight:700;color:var(--muted);line-height:1.7}

/* bottom nav */
.bottom-wrap{position:fixed;left:0;right:0;bottom:-7px;width:100%;padding:7px 10px calc(7px + var(--safe-bottom));z-index:100;pointer-events:none}
.bottom-nav{width:min(100%,520px);margin:0 auto;min-height:64px;padding:5px;border-radius:20px;background:rgba(255,255,255,.97);border:1px solid #e7ecef;
  box-shadow:0 10px 28px rgba(23,32,42,.10);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);pointer-events:auto;
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;align-items:center}
.nav-item{min-width:0;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:15px;color:#7e8992}
.nav-item.active{color:var(--purple-dark);background:var(--purple-soft)}
.nav-icon{width:20px;height:20px;flex:0 0 20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item>span:not(.add-button){font-size:8.5px;line-height:1;font-weight:900;white-space:nowrap}
.add-button{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#176b87,#32b8c4);box-shadow:0 6px 14px rgba(23,107,135,.18)}
.add-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-bottom));transform:translateX(-50%) translateY(16px);max-width:calc(100% - 40px);
  padding:10px 14px;border-radius:13px;background:#1e2c30;color:#fff;font-size:11px;font-weight:800;box-shadow:0 14px 34px rgba(24,44,49,.12);
  opacity:0;pointer-events:none;transition:.25s ease;z-index:120;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast,.a-card{transition:none}.a-card:active{transform:none}}
@media (max-width:360px){.a-img{flex-basis:100px}.a-price{font-size:14.5px}.go{padding:0 12px}}
</style>
</head>

<script type="module">

/* =========================================================
   SUPABASE
========================================================= */

import {
  supabase
} from "./js/supabase.js?v=auctions-final-2";


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);


const fmt = n =>
  Number(n || 0).toLocaleString("en-US");


const escapeHtml = value =>
  String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");


/* =========================================================
   STATE
========================================================= */

let AUCTIONS = [];
let filter = "all";
let query = "";
let toastT = null;
let loading = false;


/* =========================================================
   FAVORITES
========================================================= */

const FAVORITE_KEY = "mzad_favorite_auctions";


function getFavorites(){

  try{

    const raw =
      localStorage.getItem(FAVORITE_KEY);

    if(!raw){
      return new Set();
    }

    const parsed =
      JSON.parse(raw);

    if(!Array.isArray(parsed)){
      return new Set();
    }

    return new Set(
      parsed.map(id => String(id))
    );

  }catch{

    return new Set();

  }

}


function saveFavorites(set){

  try{

    localStorage.setItem(
      FAVORITE_KEY,
      JSON.stringify([...set])
    );

  }catch{}

}


let favs = getFavorites();


/* =========================================================
   SEARCH NORMALIZATION
========================================================= */

const norm = value =>
  String(value || "")
    .toLowerCase()
    .normalize("NFKC")
    .replace(/[أإآٱ]/g,"ا")
    .replace(/ة/g,"ه")
    .replace(/ى/g,"ي")
    .replace(/ؤ/g,"و")
    .replace(/ئ/g,"ي")
    .replace(/ايفون/g,"iphone")
    .replace(/اىفون/g,"iphone")
    .replace(/اي فون/g,"iphone")
    .replace(/ايفن/g,"iphone")
    .replace(/سامسونج/g,"samsung")
    .replace(/سامسنج/g,"samsung")
    .replace(/شاومي/g,"xiaomi")
    .replace(/شياومي/g,"xiaomi")
    .replace(/جوجل/g,"google")
    .replace(/قوقل/g,"google")
    .replace(/بكسل/g,"pixel")
    .replace(/ون بلس/g,"oneplus")
    .replace(/ون بلاس/g,"oneplus")
    .replace(/\s+/g," ")
    .trim();


/* =========================================================
   IMAGE PARSER
========================================================= */

function parseImages(value){

  if(!value){
    return [];
  }

  let data = value;

  if(typeof data === "string"){

    try{

      data = JSON.parse(data);

    }catch{

      data =
        data
          .split(",")
          .map(x => x.trim())
          .filter(Boolean);

    }

  }

  if(!Array.isArray(data)){

    if(typeof data === "object"){

      data = Object.values(data);

    }else{

      data = [data];

    }

  }

  return data
    .map(item => {

      if(!item){
        return "";
      }

      if(typeof item === "string"){
        return item.trim();
      }

      if(typeof item === "object"){

        return (
          item.url ||
          item.path ||
          item.src ||
          item.publicUrl ||
          item.public_url ||
          ""
        );

      }

      return "";

    })
    .filter(Boolean);

}


function imageUrl(path){

  if(!path){
    return "";
  }

  if(
    path.startsWith("http://") ||
    path.startsWith("https://") ||
    path.startsWith("data:")
  ){

    return path;

  }

  const clean =
    path
      .replace(/^\/+/,"")
      .replace(/^device-images\//,"");

  const { data } =
    supabase
      .storage
      .from("device-images")
      .getPublicUrl(clean);

  return data?.publicUrl || "";

}


/* =========================================================
   AUCTION TIME
========================================================= */

function endTimeOf(auction){

  /*
    الأولوية:
    1) auction_ends_at
    2) created_at + duration_hours
  */

  if(auction?.auction_ends_at){

    const direct =
      new Date(
        auction.auction_ends_at
      ).getTime();

    if(Number.isFinite(direct)){
      return direct;
    }

  }


  const created =
    new Date(
      auction?.created_at || ""
    ).getTime();

  const duration =
    Number(
      auction?.duration_hours
    );


  if(
    Number.isFinite(created) &&
    Number.isFinite(duration) &&
    duration > 0
  ){

    return (
      created +
      duration * 60 * 60 * 1000
    );

  }


  return null;

}


function isEnded(auction){

  const end =
    endTimeOf(auction);

  if(
    end !== null &&
    end <= Date.now()
  ){

    return true;

  }

  const status =
    String(
      auction?.auction_status || ""
    )
      .trim()
      .toLowerCase();


  if(
    [
      "ended",
      "closed",
      "finished",
      "expired"
    ].includes(status)
  ){

    return true;

  }


  return false;

}


function isActive(auction){

  return !isEnded(auction);

}


function timeText(left){

  if(left <= 0){
    return "انتهى";
  }

  const D = 24 * 60 * 60 * 1000;
  const H = 60 * 60 * 1000;
  const M = 60 * 1000;

  const p = n =>
    String(n).padStart(2,"0");


  if(left >= D){

    const days =
      Math.floor(left / D);

    const hours =
      Math.floor((left % D) / H);

    return `${days} يوم ${p(hours)}:00`;

  }


  return `
    ${p(Math.floor(left / H))}:${p(
      Math.floor((left % H) / M)
    )}:${p(
      Math.floor((left % M) / 1000)
    )}
  `.trim();

}


/* =========================================================
   CURRENT PRICE
========================================================= */

function currentPrice(auction){

  return Number(
    auction?.auction_current_price ??
    auction?.auction_start_price ??
    auction?.price ??
    0
  );

}


/* =========================================================
   BID COUNT
========================================================= */

function bidCount(auction){

  return Number(
    auction?.bid_count ||
    auction?.bids_count ||
    auction?.auction_bid_count ||
    0
  );

}


/* =========================================================
   LOAD BID COUNTS
========================================================= */

async function loadBidCounts(){

  if(!AUCTIONS.length){
    return;
  }

  const ids =
    AUCTIONS
      .map(a => a.id)
      .filter(
        id =>
          id !== null &&
          id !== undefined &&
          id !== ""
      );


  if(!ids.length){
    return;
  }


  try{

    const {
      data,
      error
    } =
      await supabase
        .from("auction_bids")
        .select(`
          auction_id,
          amount
        `)
        .in("auction_id",ids);


    if(error){

      console.error(
        "AUCTION BID COUNTS ERROR:",
        error
      );

      return;

    }


    const counts = new Map();


    for(
      const row of data || []
    ){

      const key =
        String(row.auction_id);

      counts.set(
        key,
        (counts.get(key) || 0) + 1
      );

    }


    AUCTIONS =
      AUCTIONS.map(
        auction => ({
          ...auction,
          bid_count:
            counts.get(
              String(auction.id)
            ) || 0
        })
      );


  }catch(error){

    console.error(
      "BID COUNT LOAD ERROR:",
      error
    );

  }

}


/* =========================================================
   LOAD REAL AUCTIONS
========================================================= */

async function fetchAuctions(){

  /*
    الاستعلام الأساسي.
    duration_hours أضيف حتى نقدر
    نحسب نهاية المزاد إذا auction_ends_at
    غير موجود.
  */

  const response =
    await supabase
      .from("devices")
      .select(`
        id,
        created_at,
        brand,
        model,
        storage,
        color,
        battery_health,
        condition,
        price,
        images,
        location,
        sale_type,
        seller_name,
        auction_start_price,
        auction_current_price,
        auction_bid_step,
        duration_hours,
        auction_ends_at,
        auction_status,
        notes
      `)
      .eq(
        "sale_type",
        "auction"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(100);


  if(!response.error){

    return response.data || [];

  }


  console.error(
    "FULL AUCTION QUERY ERROR:",
    response.error
  );


  /*
    Fallback:
    إذا duration_hours أو أحد أعمدة المزاد
    غير متاح في قاعدة البيانات، نستمر
    بتحميل المزادات الأساسية.
  */

  const fallback =
    await supabase
      .from("devices")
      .select(`
        id,
        created_at,
        brand,
        model,
        storage,
        color,
        battery_health,
        condition,
        price,
        images,
        location,
        sale_type,
        seller_name,
        auction_start_price,
        auction_current_price,
        auction_bid_step,
        auction_ends_at,
        auction_status,
        notes
      `)
      .eq(
        "sale_type",
        "auction"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(100);


  if(!fallback.error){

    return fallback.data || [];

  }


  console.error(
    "FALLBACK AUCTION QUERY ERROR:",
    fallback.error
  );


  /*
    آخر fallback حتى إذا بعض أعمدة المزاد
    غير موجودة، تظهر الأجهزة التي sale_type
    فيها auction.
  */

  const basic =
    await supabase
      .from("devices")
      .select(`
        id,
        created_at,
        brand,
        model,
        storage,
        color,
        condition,
        price,
        images,
        location,
        sale_type,
        seller_name,
        notes
      `)
      .eq(
        "sale_type",
        "auction"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(100);


  if(basic.error){

    throw basic.error;

  }


  return basic.data || [];

}


/* =========================================================
   LOAD
========================================================= */

async function loadAuctions(){

  if(loading){
    return;
  }

  loading = true;

  try{

    $("result").textContent =
      "جاري تحميل المزادات...";

    $("list").innerHTML = "";


    AUCTIONS =
      await fetchAuctions();


    await loadBidCounts();


    render();


  }catch(error){

    console.error(
      "AUCTIONS LOAD ERROR:",
      error
    );

    AUCTIONS = [];

    $("result").textContent = "";

    $("list").innerHTML = `

      <div class="empty">

        <h3>
          تعذر تحميل المزادات
        </h3>

        <p>
          تأكد من الاتصال أو حاول مرة ثانية.
        </p>

      </div>

    `;

    toast(
      "تعذر تحميل المزادات"
    );


  }finally{

    loading = false;

  }

}


/* =========================================================
   SEARCH
========================================================= */

function matchesSearch(auction){

  if(!query){
    return true;
  }

  const text =
    [
      auction.brand,
      auction.model,
      auction.storage,
      auction.color,
      auction.condition,
      auction.location,
      auction.seller_name,
      auction.notes
    ]
      .filter(Boolean)
      .join(" ");


  return norm(text)
    .includes(
      norm(query)
    );

}


/* =========================================================
   VISIBLE
========================================================= */

function visible(){

  /*
    صفحة "المزادات الحالية"
    تعرض المزادات الفعالة فقط.
  */

  let list =
    AUCTIONS
      .filter(isActive)
      .filter(matchesSearch);


  if(filter === "soon"){

    const now =
      Date.now();

    const thirtyMinutes =
      30 * 60 * 1000;


    list =
      list.filter(
        auction => {

          const end =
            endTimeOf(
              auction
            );

          return (
            end !== null &&
            end > now &&
            end - now <= thirtyMinutes
          );

        }
      );


    list =
      [...list].sort(
        (a,b) =>
          endTimeOf(a) -
          endTimeOf(b)
      );

  }


  if(filter === "new"){

    list =
      [...list].sort(
        (a,b) =>
          new Date(
            b.created_at || 0
          ).getTime() -
          new Date(
            a.created_at || 0
          ).getTime()
      );

  }


  if(filter === "low"){

    list =
      [...list].sort(
        (a,b) =>
          currentPrice(a) -
          currentPrice(b)
      );

  }


  if(filter === "high"){

    list =
      [...list].sort(
        (a,b) =>
          currentPrice(b) -
          currentPrice(a)
      );

  }


  return list;

}


/* =========================================================
   FALLBACK PHONE
========================================================= */

const tones = [
  "#6246d9",
  "#8b6cf0",
  "#4a34b8",
  "#7c5cf0"
];


function phone(c){

  return `
    <svg
      viewBox="0 0 120 240"
      aria-hidden="true"
    >

      <rect
        x="4"
        y="4"
        width="112"
        height="232"
        rx="22"
        fill="#1d2430"
      />

      <rect
        x="10"
        y="10"
        width="100"
        height="220"
        rx="17"
        fill="${c}"
      />

      <rect
        x="44"
        y="16"
        width="32"
        height="9"
        rx="4.5"
        fill="#0c0f11"
      />

    </svg>
  `;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const list =
    visible();


  $("result").textContent =
    `${list.length} مزاد`;


  if(!list.length){

    $("list").innerHTML = `

      <div class="empty">

        <h3>
          لا توجد مزادات مطابقة
        </h3>

        <p>
          ${
            AUCTIONS.filter(isActive).length
              ? "جرب كلمة بحث ثانية أو ارجع لعرض الكل."
              : "لا توجد مزادات منشورة حالياً."
          }
        </p>

      </div>

    `;

    return;

  }


  $("list").innerHTML =
    list
      .map(
        (auction,index) =>
          renderCard(
            auction,
            index
          )
      )
      .join("");


  tick();

}


/* =========================================================
   CARD
========================================================= */

function renderCard(
  auction,
  index
){

  const id =
    String(
      auction.id
    );


  const images =
    parseImages(
      auction.images
    );


  const firstImage =
    images.length
      ? imageUrl(images[0])
      : "";


  const title =
    [
      auction.brand,
      auction.model
    ]
      .filter(Boolean)
      .join(" ") ||
    "جهاز";


  const meta =
    [
      auction.storage,
      auction.color,
      auction.location
    ]
      .filter(Boolean)
      .join(" • ") ||
    "داخل النجف";


  const condition =
    auction.condition ||
    "غير محدد";


  const price =
    currentPrice(
      auction
    );


  const bids =
    bidCount(
      auction
    );


  const image =
    firstImage
      ? `
        <img
          src="${escapeHtml(firstImage)}"
          alt="${escapeHtml(title)}"
          loading="${index < 2 ? "eager" : "lazy"}"
          decoding="async"
          draggable="false"
          onerror="this.style.display='none'"
        >
      `
      : phone(
          tones[
            index % tones.length
          ]
        );


  return `

    <article
      class="a-card"
      data-id="${escapeHtml(id)}"
      tabindex="0"
      role="link"
      aria-label="${escapeHtml(title)}"
    >

      <div class="a-img">

        ${image}

        <button
          class="fav${
            favs.has(id)
              ? " active"
              : ""
          }"
          type="button"
          aria-label="${
            favs.has(id)
              ? "إزالة من المفضلة"
              : "إضافة إلى المفضلة"
          }"
        >

          <svg viewBox="0 0 24 24">
            <path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/>
          </svg>

        </button>


        <span
          class="pill"
          data-id="${escapeHtml(id)}"
          data-end="${escapeHtml(
            auction.auction_ends_at || ""
          )}"
        ></span>

      </div>


      <div class="a-body">

        <div>

          <h3 class="a-title">
            ${escapeHtml(title)}
          </h3>

          <div class="a-meta">
            ${escapeHtml(meta)}
          </div>

          <div class="a-tags">

            <span class="tag">
              ${escapeHtml(condition)}
            </span>

            <span class="tag">
              ${bids} مزايدة
            </span>

          </div>

        </div>


        <div class="a-foot">

          <div>

            <span class="lbl">
              السعر الحالي
            </span>

            <div class="a-price">

              ${fmt(price)}

              <small>
                د.ع
              </small>

            </div>

          </div>


          <button
            class="go"
            type="button"
          >
            زايد
          </button>

        </div>

      </div>

    </article>

  `;

}


/* =========================================================
   TICK
========================================================= */

function tick(){

  const now =
    Date.now();


  document
    .querySelectorAll(".pill")
    .forEach(
      el => {

        const id =
          el.dataset.id;


        const auction =
          AUCTIONS.find(
            item =>
              String(item.id) ===
              String(id)
          );


        if(!auction){
          return;
        }


        const end =
          endTimeOf(
            auction
          );


        /*
          إذا ما قدرنا نحدد وقت النهاية،
          نخلي المكان بدون وقت بدل 00:00:00.
        */

        if(!Number.isFinite(end)){

          el.textContent =
            "";

          return;

        }


        /*
          نحدّث data-end أيضاً
          إذا حسبنا النهاية من duration_hours.
        */

        el.dataset.end =
          new Date(end).toISOString();


        const left =
          end - now;


        el.textContent =
          timeText(left);


        /*
          أحمر قبل النهاية بـ 5 دقائق.
        */

        el.classList.toggle(
          "hot",
          left > 0 &&
          left <= 5 * 60 * 1000
        );


        const card =
          el.closest(".a-card");


        if(card){

          const done =
            left <= 0;


          card.classList.toggle(
            "done",
            done
          );


          const button =
            card.querySelector(".go");


          if(button){

            button.disabled =
              done;

            button.textContent =
              done
                ? "انتهى"
                : "زايد";

          }

        }

      }
    );

}


/* =========================================================
   CARD CLICK
========================================================= */

$("list").addEventListener(
  "click",
  event => {

    const fav =
      event.target.closest(".fav");


    if(fav){

      event.preventDefault();
      event.stopPropagation();


      const card =
        fav.closest(".a-card");


      if(!card){
        return;
      }


      const id =
        String(
          card.dataset.id
        );


      const on =
        !favs.has(id);


      if(on){
        favs.add(id);
      }else{
        favs.delete(id);
      }


      saveFavorites(favs);


      fav.classList.toggle(
        "active",
        on
      );


      fav.setAttribute(
        "aria-label",
        on
          ? "إزالة من المفضلة"
          : "إضافة إلى المفضلة"
      );


      toast(
        on
          ? "تمت إضافة المزاد إلى المفضلة"
          : "تمت إزالة المزاد من المفضلة"
      );


      return;

    }


    const card =
      event.target.closest(".a-card");


    if(!card){
      return;
    }


    const id =
      card.dataset.id;


    if(!id){
      return;
    }


    location.href =
      `auction-details.html?id=${encodeURIComponent(id)}`;

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

$("list").addEventListener(
  "keydown",
  event => {

    if(event.key !== "Enter"){
      return;
    }


    const card =
      event.target.closest(".a-card");


    if(!card){
      return;
    }


    const id =
      card.dataset.id;


    if(id){

      location.href =
        `auction-details.html?id=${encodeURIComponent(id)}`;

    }

  }
);


/* =========================================================
   FILTERS
========================================================= */

$("filters").addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(".fchip");


    if(!button){
      return;
    }


    filter =
      button.dataset.f;


    document
      .querySelectorAll(".fchip")
      .forEach(
        chip => {

          const active =
            chip === button;

          chip.classList.toggle(
            "active",
            active
          );

          chip.setAttribute(
            "aria-selected",
            active
          );

        }
      );


    render();

  }
);


/* =========================================================
   SEARCH
========================================================= */

function syncSearch(){

  $("searchWrap")
    .classList
    .toggle(
      "has-value",
      $("search")
        .value
        .trim()
        .length > 0
    );

}


$("search").addEventListener(
  "input",
  event => {

    query =
      event.target
        .value
        .trim();


    syncSearch();
    render();

  }
);


$("clear").addEventListener(
  "click",
  () => {

    $("search").value = "";
    query = "";

    syncSearch();
    render();

    $("search").focus();

  }
);


/* =========================================================
   BACK
========================================================= */

$("back").addEventListener(
  "click",
  () => {

    if(window.history.length > 1){

      window.history.back();

    }else{

      location.href =
        "home.html";

    }

  }
);


/* =========================================================
   TOAST
========================================================= */

function toast(message){

  const el =
    $("toast");


  el.textContent =
    message;


  el.classList.add(
    "show"
  );


  clearTimeout(
    toastT
  );


  toastT =
    setTimeout(
      () => {

        el.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =========================================================
   REFRESH
========================================================= */

async function refreshAuctions(){

  try{

    const data =
      await fetchAuctions();


    AUCTIONS =
      data || [];


    await loadBidCounts();


    render();


  }catch(error){

    console.error(
      "AUCTION REFRESH ERROR:",
      error
    );

  }

}


/* =========================================================
   START
========================================================= */

loadAuctions();


/*
  العداد:
  كل ثانية.
*/
const timer =
  setInterval(
    tick,
    1000
  );


/*
  البيانات:
  كل 15 ثانية.
*/
const refreshTimer =
  setInterval(
    refreshAuctions,
    15000
  );


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "pagehide",
  () => {

    clearInterval(timer);
    clearInterval(refreshTimer);

  }
);

</script>
