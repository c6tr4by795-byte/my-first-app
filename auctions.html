<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#5a45d4">
<title>MZAD PHONE — المزادات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4fc;--ink:#1b1740;--muted:#6c6f8a;--line:#e8e4f7;--edge:#ddd8f8;--p:#6246d9;--p2:#8b6cf0;--pd:#3c2a9e;--ps:#f1eeff;--night:#150d42;--hot:#e8590c;--ok:#17805a;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:"Tajawal",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit}
:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
.page{width:min(100%,520px);margin:0 auto;padding:0 14px calc(104px + var(--sb));overflow-x:clip}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.35}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes pf{0%{color:#17805a;transform:scale(1.05)}100%{transform:none}}

/* ===== الهيدر ===== */
.hd{position:relative;overflow:hidden;isolation:isolate;margin-inline:-14px;padding:calc(6px + var(--st)) 14px 14px;border-radius:0 0 22px 22px;border-bottom:1px solid #5f4cd0;
  background:radial-gradient(circle at 12% 0%,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 46%),linear-gradient(145deg,#5a45d4 0%,#7a67e8 50%,#a496f3 100%);
  box-shadow:0 10px 24px rgba(74,52,184,.26)}
.web{position:absolute;top:0;z-index:0;pointer-events:none;opacity:.26}
.web svg{display:block;width:100%;height:100%}
.web-a{left:0;width:150px;height:150px}
.web-b{right:0;width:120px;height:120px;opacity:.2;transform:scaleX(-1)}
.top,.sw{position:relative;z-index:2}
.top{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;padding:8px 0 10px}
.ib{width:40px;height:36px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.6);border-radius:12px;background:rgba(255,255,255,.92);color:var(--p);box-shadow:0 7px 18px rgba(23,32,42,.1)}
.ib:active{transform:scale(.93)}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tt{text-align:center;min-width:0}
h1{margin:0;font-size:16px;font-weight:900;letter-spacing:-.01em;color:#fff;line-height:1.2}
.tt small{display:block;margin-top:2px;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.82)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:4px;color:#fff;line-height:1}
.brand strong{font-size:25px;font-weight:950;letter-spacing:.02em;line-height:1;text-shadow:0 2px 10px rgba(20,14,48,.3)}
.brand span{font-size:9.5px;font-weight:900;letter-spacing:.5em;margin-inline-end:-.5em;color:#fff;line-height:1;opacity:.95}
.sw{position:relative}
.search{width:100%;height:44px;border:1.5px solid var(--edge);border-radius:15px;background:#fff;padding:0 44px 0 42px;outline:none;color:var(--ink);font-size:14px;font-weight:600;box-shadow:0 8px 20px rgba(40,24,120,.16);transition:border-color .25s,box-shadow .25s}
.search:focus{border-color:#a99cf0;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.search::placeholder{color:#a0a3bb;font-weight:500}
.si{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;pointer-events:none;color:var(--p);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.clr{position:absolute;inset-inline-start:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:10px;background:var(--ps);display:grid;place-items:center;opacity:0;pointer-events:none;color:var(--pd)}
.clr svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.sw.has .clr{opacity:1;pointer-events:auto}
@media(max-width:360px){.brand strong{font-size:22px}.brand span{font-size:8.5px}}

/* ===== الفلاتر ===== */
.filters{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;margin-inline:-14px;padding:12px 14px 10px;background:rgba(246,244,252,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--edge);font-size:12.5px;font-weight:800;color:#55587a;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.on{background:linear-gradient(145deg,#4a34b8,#7a5cf0);border-color:transparent;color:#fff;box-shadow:0 8px 16px -8px rgba(98,70,217,.7)}
.result{display:flex;align-items:center;gap:8px;margin:4px 4px 12px;font-size:12.5px;font-weight:800;color:var(--muted)}
.result:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.5s infinite}

/* ===== بطاقة المزاد ===== */
.list{display:flex;flex-direction:column;gap:12px}
.c{position:relative;display:grid;grid-template-columns:42% minmax(0,1fr);min-height:176px;background:#fff;border-radius:20px;border:1px solid var(--edge);overflow:hidden;cursor:pointer;box-shadow:0 12px 24px -16px rgba(98,70,217,.4);transition:transform .16s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.c:active{transform:scale(.99)}
.c.enter{animation:none!important;opacity:1;transform:none}
.im{position:relative;grid-column:1;min-width:0;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,#ebe6ff,#d9d0fb)}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:1;transition:none}
.im img.ok{opacity:1}
.im>svg{width:34px;height:34px;opacity:.35}
.im:after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(to top,rgba(20,14,48,.35),rgba(20,14,48,0));pointer-events:none}
.lv{position:absolute;top:9px;inset-inline-end:9px;z-index:2;display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.95);color:var(--ok);font-size:10px;font-weight:900;box-shadow:0 4px 10px rgba(23,32,42,.12)}
.lv:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
.lv.sch{color:var(--pd)}
.fav{position:absolute;top:9px;inset-inline-start:9px;z-index:2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.95);color:#80839c;box-shadow:0 4px 10px rgba(23,32,42,.12)}
.fav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.fav.on{color:#e5365f}.fav.on svg{fill:currentColor;transform:scale(1.12)}
.cb{grid-column:2;display:flex;flex-direction:column;gap:8px;min-width:0;padding:12px 13px 11px}
.t{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;font-weight:900;line-height:1.25;letter-spacing:-.01em;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:5px;min-width:0;max-height:56px;overflow:hidden}
.tag{flex:0 0 auto;max-width:100%;padding:3px 10px;border:1px solid #ddd5fb;border-radius:999px;background:var(--ps);color:var(--pd);font-size:11.5px;font-weight:800;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{margin-top:auto;padding:9px 10px;border-radius:14px;background:linear-gradient(145deg,#faf8ff,#f1eeff);border:1px solid #e6e0fb;min-width:0}
.price .lb{display:block;font-size:10px;font-weight:700;color:var(--muted);line-height:1.3}
.pv{display:flex;align-items:baseline;gap:4px;margin-top:1px;white-space:nowrap}
.pv strong{font-size:21px;font-weight:900;color:#e94d45;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1}
.pv small{font-size:10px;font-weight:800;color:#858585}
.pv.flash strong{animation:pf .8s}
.meta{display:flex;align-items:center;justify-content:space-between;gap:6px;direction:rtl}
.mi{display:inline-flex;align-items:center;gap:4px;min-width:0;font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi svg{width:12px;height:12px;flex:0 0 12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{display:flex;flex-direction:column;align-items:flex-start;gap:1px;flex:0 0 auto;direction:rtl;color:var(--pd)}
.pill small{font-size:9.5px;font-weight:700;color:var(--muted);white-space:nowrap;line-height:1.2}
.pill b{font-size:17px;font-weight:900;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1;letter-spacing:.01em}
.pill.hot{color:var(--hot)}
.pill.hot b{animation:blink 1s infinite}
.pill.sch{color:var(--muted)}
.meta{align-items:flex-end;padding-top:2px}
.prg{height:4px;border-radius:99px;background:#ece8fb;overflow:hidden}
.prg i{display:block;height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#8b6cf0,#6246d9);transition:width 1s linear}
.prg.hot i{background:linear-gradient(90deg,#ffb36b,#e8590c)}
.empty{padding:40px 20px;text-align:center;border-radius:20px;background:#fff;border:1px dashed #cfc7f3}
.empty h3{margin:0 0 6px;font-size:16px;font-weight:900}
.empty p{margin:0;font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.8}
.sk{height:176px;border-radius:20px;background:#f1eefb;animation:none}
@media(max-width:360px){
  .c{min-height:168px}
  .cb{padding:10px 10px 9px}
  .t{font-size:15.5px}
  .pv strong{font-size:18px}
  .tag{font-size:10.5px;padding:3px 8px}
  .pill small{display:none}
}

/* ===== الشريط السفلي ===== */
.bw{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + var(--sb));z-index:100;pointer-events:none}
.nav{width:min(100%,520px);margin:0 auto;min-height:66px;padding:6px;border-radius:22px;background:#fff;border:1px solid #e7e3f6;box-shadow:0 14px 30px rgba(45,27,122,.14);pointer-events:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;align-items:center}
.ni{min-height:54px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:16px;color:#80839c}
.ni.on{color:var(--pd);background:var(--ps)}
.ni svg.i{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ni .l{font-size:10px;line-height:1;font-weight:800;white-space:nowrap}
.add{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#4a34b8,#7a5cf0);box-shadow:0 8px 16px rgba(98,70,217,.3)}
.add svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.toast{position:fixed;left:50%;bottom:calc(98px + var(--sb));transform:translateX(-50%) translateY(16px);padding:11px 18px;border-radius:14px;background:var(--night);color:#fff;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:120;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="/css/responsive-compat.css">


</head>
<body>
<main class="page">
<header class="hd">
  <div class="web web-a" aria-hidden="true"><svg viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0L184.0 0.0M0 0L170.0 70.4M0 0L130.1 130.1M0 0L70.4 170.0M0 0L0.0 184.0M46.0 0.0L42.5 17.6L32.5 32.5L17.6 42.5L0.0 46.0M92.0 0.0L85.0 35.2L65.1 65.1L35.2 85.0L0.0 92.0M138.0 0.0L127.5 52.8L97.6 97.6L52.8 127.5L0.0 138.0"/></svg></div>
  <div class="web web-b" aria-hidden="true"><svg viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0L184.0 0.0M0 0L170.0 70.4M0 0L130.1 130.1M0 0L70.4 170.0M0 0L0.0 184.0M46.0 0.0L42.5 17.6L32.5 32.5L17.6 42.5L0.0 46.0M92.0 0.0L85.0 35.2L65.1 65.1L35.2 85.0L0.0 92.0M138.0 0.0L127.5 52.8L97.6 97.6L52.8 127.5L0.0 138.0"/></svg></div>
  <div class="top">

    <div class="tt"><h1>المزادات المباشرة</h1><small id="sub">ابحث وزايد على جهازك</small></div>

  <button class="chip" data-f="new" type="button">الأحدث</button>

</main>

  <a class="ni" href="home.html"><svg class="i" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg><span class="l">الرئيسية</span></a>
  <a class="ni on" href="auctions.html"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span class="l">المزادات</span></a>
  <a class="ni" href="sell.html"><span class="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="l">إضافة</span></a>
  <a class="ni" href="favorites.html"><svg class="i" viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/></svg><span class="l">المفضلة</span></a>
  <a class="ni" href="profile.html"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.4 3.1-5 7-5s6.2 1.6 7 5"/></svg><span class="l">حسابي</span></a>

<script type="module">
import { supabase } from "./js/supabase.js";
const $ = id => document.getElementById(id);
const fmt = n => Number(n||0).toLocaleString("en-US");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let AU = [], filter = "all", query = "", tt, loading = false;
const els = new Map();
const devCache = new Map();
const picCache = new Map();
const urlCache = new Map();

/* المفضلة: استخدم نفس مفتاح صفحة المفضلة وبحسب الحساب المسجّل */
let FAV_KEY = "mzad_phone_favorites:guest";
try {
  const { data, error } = await supabase.auth.getUser();
  if (!error && data?.user?.id) FAV_KEY = "mzad_phone_favorites:user:" + data.user.id;
} catch {}
const getFavs = () => {
  try {
    const a = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
    const b = JSON.parse(localStorage.getItem("mzad_favorite_auctions") || "[]");
    const c = JSON.parse(localStorage.getItem("mzad_favorite_auction_" + (FAV_KEY.split(":").pop())) || "[]");
    return new Set([...(Array.isArray(a)?a:[]), ...(Array.isArray(b)?b:[]), ...(Array.isArray(c)?c:[])].map(String));
  } catch { return new Set(); }
};
const favs = getFavs();
const saveFavs = () => {
  try {
    localStorage.setItem(FAV_KEY, JSON.stringify([...favs]));
    localStorage.setItem("mzad_favorite_auctions", JSON.stringify([...favs]));
  } catch {}
};

/* بحث عربي/إنجليزي */
const norm = v => String(v||"").toLowerCase().normalize("NFKC")
  .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
  .replace(/اي ?فون|ايفن|اىفون/g,"iphone").replace(/سامسو?نج/g,"samsung").replace(/شي?اومي/g,"xiaomi")
  .replace(/[جق]وجل/g,"google").replace(/بكسل/g,"pixel").replace(/ون بل[اس]س?/g,"oneplus").replace(/\s+/g," ").trim();

const endOf = a => new Date(a.ends_at).getTime();
const p2 = n => String(n).padStart(2,"0");
const timeText = left => {
  if (left <= 0) return "انتهى";
  const D=864e5, H=36e5, M=6e4;
  if (left >= D) return Math.floor(left/D) + " يوم و " + Math.floor(left%D/H) + " ساعة";
  return p2(Math.floor(left/H)) + ":" + p2(Math.floor(left%H/M)) + ":" + p2(Math.floor(left%M/1000));
};

async function fetchAuctions(){
  const a = await supabase.from("mzad_auctions")
    .select("id,auction_number,device_id,starting_price_iqd,current_price_iqd,bid_increment_iqd,status,starts_at,ends_at,created_at")
    .in("status",["live","scheduled"]).gt("ends_at", new Date().toISOString()).order("created_at",{ascending:false}).limit(100);
  if (a.error) throw a.error;
  const list = a.data || [];
  if (!list.length) return [];
  const ids = list.map(x => x.id);
  const devIds = [...new Set(list.map(x => x.device_id).filter(Boolean))];
  const needDev = devIds.filter(i => !devCache.has(i));
  const needPic = devIds.filter(i => !picCache.has(i));

  const [d, im, b] = await Promise.all([
    needDev.length ? supabase.from("mzad_devices").select("id,brand,model,storage,color,condition_grade,battery_health").in("id", needDev) : null,
    needPic.length ? supabase.from("mzad_device_images").select("device_id,storage_path,is_primary,sort_order").in("device_id", needPic).order("sort_order",{ascending:true}) : null,
    supabase.from("mzad_auction_bids").select("auction_id").in("auction_id", ids).eq("accepted", true)
  ]);
  (d?.data||[]).forEach(x => devCache.set(x.id, x));
  if (im){
    const pick = new Map();
    (im.data||[]).forEach(r => { const cur = pick.get(r.device_id); if (!cur || (r.is_primary && !cur.is_primary)) pick.set(r.device_id, r); });
    needPic.forEach(id => picCache.set(id, pick.get(id)?.storage_path || ""));
  }
  const bids = new Map();
  (b.data||[]).forEach(r => bids.set(r.auction_id, (bids.get(r.auction_id)||0) + 1));

  const now = Date.now();
  const normalizeAuctionImagePath = value => {
    let p = String(value || "").trim();
    const marker = /\/storage\/v1\/object\/(?:public|sign|authenticated)\/device-images\//i;
    const match = p.match(marker);
    if (match) p = p.slice(match.index + match[0].length).split("?")[0];
    p = p.replace(/^\/+/, "").replace(/^device-images\//i, "").split("?")[0];
    try { p = decodeURIComponent(p); } catch {}
    return p;
  };
  const missing = [...new Set(devIds.map(i => normalizeAuctionImagePath(picCache.get(i))).filter(p => p && (!urlCache.get(p) || now - urlCache.get(p).t > 45*6e4)))];
  if (missing.length){
    try{
      const s = await supabase.storage.from("device-images").createSignedUrls(missing, 3600);
      (s.data||[]).forEach(r => { if (r.signedUrl) urlCache.set(r.path, { url:r.signedUrl, t:now }); });
    }catch(e){ console.error("IMG:", e); }
  }
  return list.map(x => ({ ...x, dev: devCache.get(x.device_id) || {}, bids: bids.get(x.id) || 0, img: urlCache.get(normalizeAuctionImagePath(picCache.get(x.device_id)))?.url || "" }));
}

async function preloadAuctionImages(items){
  const urls = [...new Set(items.map(a => a.img).filter(Boolean))];
  if (!urls.length) return;
  // انتظر الصور كلها أو 4 ثوانٍ كحد أقصى، حتى لا تظهر البطاقات صورة وراء صورة.
  await Promise.race([
    Promise.allSettled(urls.map(url => new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = url;
      if (img.complete) resolve(img.naturalWidth > 0);
    }))),
    new Promise(resolve => setTimeout(resolve, 4000))
  ]);
}

async function load(first){
  if (loading) return; loading = true;
  try{
    if (first && !AU.length){ $("result").textContent = "جاري تحميل المزادات..."; $("list").innerHTML = '<div class="sk"></div><div class="sk"></div>'; }
    AU = await fetchAuctions();
    if (first) await preloadAuctionImages(AU);
    render();
  }catch(e){
    console.error("AUCTIONS ERROR:", e);
    if (first){ $("result").textContent = ""; $("list").replaceChildren(); showEmpty("تعذر تحميل المزادات","تأكد من الاتصال وحاول مرة ثانية."); }
  }finally{ loading = false; }
}

function visible(){
  const now = Date.now();
  const q = norm(query);
  let l = AU.filter(a => endOf(a) > now && (a.status !== "scheduled" || new Date(a.starts_at).getTime() > now)).filter(a => !q || norm([a.dev.brand,a.dev.model,a.dev.storage,a.dev.color,a.dev.condition_grade].filter(Boolean).join(" ")).includes(q));
  if (filter === "soon") l = l.filter(a => endOf(a) - now <= 3*36e5).sort((a,b) => endOf(a) - endOf(b));
  if (filter === "new")  l = [...l].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  if (filter === "low")  l = [...l].sort((a,b) => a.current_price_iqd - b.current_price_iqd);
  if (filter === "high") l = [...l].sort((a,b) => b.current_price_iqd - a.current_price_iqd);
  return l;
}

const PH = '<svg viewBox="0 0 24 24" fill="none" stroke="#6246d9" stroke-width="1.5"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>';
const HEART = '<svg viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/></svg>';
const I_CLOCK = '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/></svg>';
const I_BID = '<svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="10" height="5" rx="1.3" transform="rotate(45 14 6)"/><path d="M12.2 7.8 4.5 15.5"/><path d="M4 21h9"/></svg>';

function setImg(el, a){
  const box = el.querySelector(".im");
  if (!a.img || box.querySelector("img")) return;
  const img = document.createElement("img");
  img.alt = [a.dev.brand,a.dev.model].filter(Boolean).join(" ");
  img.onload = () => img.classList.add("ok");
  img.onerror = () => img.remove();
  img.decoding = "async";
  img.src = a.img;
  box.querySelector(":scope > svg")?.remove();
  box.prepend(img);
}

function makeCard(a, i){
  const d = a.dev, id = String(a.id);
  const title = [d.brand,d.model].filter(Boolean).join(" ") || "جهاز";
  const bat = d.battery_health ? "بطارية " + (/^\d+$/.test(String(d.battery_health)) ? d.battery_health + "%" : d.battery_health) : "";
  const specs = [d.storage,d.color,bat,d.condition_grade].filter(Boolean).slice(0,4);
  const el = document.createElement("article");
  el.className = "c enter"; el.dataset.id = id; el.tabIndex = 0; el.setAttribute("role","link"); el.setAttribute("aria-label", title);
  el.style.animationDelay = Math.min(i,5)*.06 + "s";
  el.addEventListener("animationend", () => el.classList.remove("enter"), { once:true });
  el.innerHTML = `<div class="im">${PH}
      <span class="lv" data-state>مباشر</span>
      <button class="fav${favs.has(id)?" on":""}" type="button" aria-label="المفضلة">${HEART}</button>
    </div>
    <div class="cb">
      <h3 class="t">${esc(title)}</h3>
      <div class="tags">${specs.map(s => `<span class="tag">${esc(s)}</span>`).join("")}</div>
      <div class="price">
        <span class="lb">السعر الحالي</span>
        <div class="pv"><strong data-price></strong><small>د.ع</small></div>
      </div>
      <div class="meta">
        <span class="mi">${I_BID}<span data-bids></span></span>
        <span class="pill"><small data-timer-label>ينتهي بعد</small><b></b></span>
      </div>
      <div class="prg"><i data-prog></i></div>
    </div>`;
  return el;
}

function updateCard(el, a){
  setImg(el, a);
  const price = fmt(a.current_price_iqd ?? a.starting_price_iqd);
  const pe = el.querySelector("[data-price]");
  if (pe.textContent !== price){
    const first = pe.textContent === "";
    pe.textContent = price;
    if (!first){ const pv = pe.parentElement; pv.classList.remove("flash"); void pv.offsetWidth; pv.classList.add("flash"); }
  }
  const bt = a.bids + " مزايدة · بدأ من " + fmt(a.starting_price_iqd);
  const be = el.querySelector("[data-bids]"); if (be.textContent !== bt) be.textContent = bt;
  timerOne(el, a);
}

function timerOne(el, a){
  const scheduled = a.status === "scheduled" && a.starts_at && new Date(a.starts_at).getTime() > Date.now();
  const left = (scheduled ? new Date(a.starts_at).getTime() : endOf(a)) - Date.now();
  const pill = el.querySelector(".pill");
  const label = el.querySelector("[data-timer-label]");
  if (label) label.textContent = scheduled ? "يبدأ بعد" : "ينتهي بعد";
  const state = el.querySelector("[data-state]");
  if (state){ state.textContent = scheduled ? "محجوز" : "مباشر"; state.classList.toggle("sch", scheduled); }
  pill.querySelector("b").textContent = timeText(left);
  pill.classList.toggle("sch", scheduled);
  const hot = !scheduled && left > 0 && left <= 5*6e4;
  pill.classList.toggle("hot", hot);
  const prg = el.querySelector(".prg");
  if (prg){
    const total = Math.max(1, endOf(a) - new Date(a.starts_at || a.created_at).getTime());
    const pct = scheduled ? 100 : Math.max(0, Math.min(100, left / total * 100));
    prg.firstElementChild.style.width = pct + "%";
    prg.classList.toggle("hot", hot);
  }
  return left <= 0;
}

function showEmpty(t, p){ $("eT").textContent = t; $("eP").textContent = p; $("empty").hidden = false; }

function render(){
  const l = visible();
  $("result").textContent = l.length + " مزاد مباشر";
  const list = $("list");
  const alive = new Set(AU.map(a => String(a.id)));
  [...els.keys()].forEach(k => { if (!alive.has(k)) els.delete(k); });

  if (!l.length){
    list.replaceChildren();
    showEmpty(AU.length ? "لا توجد مزادات مطابقة" : "لا توجد مزادات الآن", AU.length ? "جرب كلمة بحث ثانية أو ارجع لعرض الكل." : "ارجع بعد قليل، المزادات الجديدة تظهر هنا فور نشرها.");
    return;
  }
  $("empty").hidden = true;
  const want = l.map((a,i) => {
    const id = String(a.id);
    let el = els.get(id);
    if (!el){ el = makeCard(a, i); els.set(id, el); }
    updateCard(el, a);
    return el;
  });
  [...list.children].forEach(ch => { if (!want.includes(ch)) ch.remove(); });
  want.forEach((el, i) => { if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null); });
}

function tick(){
  let ended = false;
  const byId = new Map(AU.map(a => [String(a.id), a]));
  $("list").querySelectorAll(".c").forEach(el => {
    const a = byId.get(el.dataset.id);
    if (a && timerOne(el, a)) ended = true;
  });
  if (ended){ AU = AU.filter(a => endOf(a) > Date.now()); render(); }
}

const open = id => { if (id) location.href = "auction-details.html?auction=" + encodeURIComponent(id); };
$("list").addEventListener("click", e => {
  const card = e.target.closest(".c"); if (!card) return;
  const f = e.target.closest(".fav");
  if (f){
    e.stopPropagation();
    const id = card.dataset.id, on = !favs.has(id);
    on ? favs.add(id) : favs.delete(id); saveFavs();
    f.classList.toggle("on", on);
    toast(on ? "تمت الإضافة للمفضلة" : "تمت الإزالة من المفضلة");
    return;
  }
  open(card.dataset.id);
});
$("list").addEventListener("keydown", e => { if (e.key === "Enter") open(e.target.closest(".c")?.dataset.id); });

$("filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
  render();
  if (filter === "soon" && !visible().length) showEmpty("لا توجد مزادات تنتهي قريباً","لا يوجد مزاد ينتهي خلال الساعات الثلاث القادمة.");
});
const sync = () => $("sw").classList.toggle("has", $("search").value.trim().length > 0);
$("search").addEventListener("input", e => { query = e.target.value.trim(); sync(); render(); });
$("clear").addEventListener("click", () => { $("search").value = ""; query = ""; sync(); render(); $("search").focus(); });
$("back").addEventListener("click", () => history.length > 1 ? history.back() : location.href = "home.html");

function toast(m){ const el = $("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1800); }

load(true);

const t1 = setInterval(tick, 1000);
const t2 = setInterval(() => { if (!document.hidden) load(false); }, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });
addEventListener("pagehide", () => { clearInterval(t1); clearInterval(t2); });
</script>
<script type="module" src="./js/platform-guard.js"></script>
<style id="mzad-scroll-nav-style">
.mzad-scroll-nav-target{transition:transform .32s cubic-bezier(.22,.8,.3,1)!important;will-change:transform}
.mzad-scroll-nav-target.mzad-nav-hidden{transform:translate3d(0,calc(100% + 24px),0)!important;pointer-events:none!important}
</style>
<script>
(function(){
  const target = document.querySelector(".bottom-wrap") || document.querySelector(".bw") || document.querySelector("nav.bottom-nav") || (document.querySelector("nav.nav") ? document.querySelector("nav.nav").parentElement : null);
  if(!target || target.dataset.scrollNavReady) return;
  target.dataset.scrollNavReady = "1";
  target.classList.add("mzad-scroll-nav-target");
  let lastY = window.scrollY, acc = 0, hidden = false, ticking = false;
  const setHidden = value => {
    if(hidden === value) return;
    hidden = value;
    target.classList.toggle("mzad-nav-hidden", value);
  };
  const update = () => {
    ticking = false;
    const y = window.scrollY;
    const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    if(y <= 0 || y >= max - 1){
      lastY = Math.min(Math.max(y,0),max); acc = 0;
      if(y <= 0) setHidden(false);
      return;
    }
    const diff = y - lastY; lastY = y;
    if(y < 80){ setHidden(false); acc = 0; return; }
    if(diff * acc < 0) acc = 0;
    acc += diff;
    if(acc > 28){ setHidden(true); acc = 0; }
    else if(acc < -12){ setHidden(false); acc = 0; }
  };
  window.addEventListener("scroll", () => {
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }, {passive:true});
  window.addEventListener("pageshow", () => { lastY = window.scrollY; if(window.scrollY < 80) setHidden(false); });
})();
</script>
