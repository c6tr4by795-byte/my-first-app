<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">

<title>MZAD PHONE — المفضلة</title>

<style>

:root{
  --bg:#F7F8FA;
  --white:#FFFFFF;
  --ink:#17202A;
  --muted:#667085;
  --line:#E6E9ED;

  --primary:#176B87;
  --primary-dark:#125A73;
  --primary-soft:#E8F3F6;

  --purple:#6246D9;
  --purple-dark:#51477D;

  --shadow:0 10px 28px rgba(23,32,42,.06);

  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:var(--bg);
  color:var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  color:inherit;
}

.page{
  width:min(100%,520px);
  margin:auto;

  padding:
    0
    14px
    calc(100px + var(--safe-bottom));
}


/* =====================================================
   HEADER
===================================================== */

.header{
  margin-inline:-14px;

  padding:
    7px
    14px
    15px;

  background:
    linear-gradient(
      145deg,
      #FFFFFF 0%,
      #F5F2FF 45%,
      #E6E1FF 100%
    );

  border-bottom:
    1px solid var(--line);

  border-radius:
    0
    0
    24px
    24px;

  box-shadow:
    0 10px
    26px
    rgba(23,32,42,.06);

  position:relative;
  overflow:hidden;
}

.header::before{
  content:"";

  position:absolute;

  width:170px;
  height:170px;

  left:-82px;
  top:-112px;

  border-radius:50%;

  background:
    rgba(98,70,217,.055);

  pointer-events:none;
}

.header::after{
  content:"";

  position:absolute;

  width:125px;
  height:125px;

  right:-65px;
  bottom:-88px;

  border-radius:50%;

  background:
    rgba(98,70,217,.07);

  pointer-events:none;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
  position:relative;
  z-index:2;

  display:flex;
  align-items:center;

  gap:8px;
}

.back-btn,
.refresh-btn{
  width:37px;
  height:37px;

  flex:0 0 37px;

  border-radius:12px;

  background:#fff;

  border:
    1px solid #DDD8F8;

  color:var(--primary);

  display:grid;
  place-items:center;

  box-shadow:
    0 7px
    18px
    rgba(23,32,42,.045);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.back-btn:active,
.refresh-btn:active{
  transform:scale(.93);

  box-shadow:
    0 4px
    11px
    rgba(23,32,42,.05);
}

.brand{
  flex:1;

  text-align:center;

  line-height:.9;
}

.brand strong{
  display:block;

  font-size:18px;
  font-weight:950;

  letter-spacing:-.05em;
}

.brand span{
  display:block;

  margin-top:3px;

  color:#8A929A;

  font-size:7px;
  font-weight:950;

  letter-spacing:.2em;
}


/* =====================================================
   TITLE
===================================================== */

.header-content{
  position:relative;
  z-index:2;

  margin-top:9px;
}

.header-title-row{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:9px;
}

.header-title{
  min-width:0;
}

.header-title h1{
  margin:0;

  font-size:19px;
  line-height:1.15;

  font-weight:950;

  letter-spacing:-.045em;
}

.header-title p{
  margin:
    4px
    0
    0;

  color:#667085;

  font-size:9px;

  line-height:1.4;
}

.header-count{
  flex:0 0 auto;

  padding:
    6px
    9px;

  border-radius:10px;

  background:
    rgba(255,255,255,.86);

  border:
    1px solid rgba(98,70,217,.12);

  color:#51477D;

  font-size:8px;
  font-weight:950;

  white-space:nowrap;

  box-shadow:
    0 5px
    13px
    rgba(98,70,217,.055);
}


/* =====================================================
   DEVICES
===================================================== */

.devices-grid{
  margin-top:10px;

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.device-card{
  position:relative;

  overflow:hidden;

  background:#fff;

  border:
    1px solid #E5E2F1;

  border-radius:17px;

  box-shadow:
    0 9px
    22px
    rgba(98,70,217,.08);

  cursor:pointer;

  animation:
    cardIn .38s cubic-bezier(.2,.7,.2,1) both;

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.device-card:active{
  transform:scale(.975);

  box-shadow:
    0 6px
    16px
    rgba(98,70,217,.06);
}


/* =====================================================
   PHOTO
===================================================== */

.device-photo{
  height:175px;

  background:#fff;

  display:grid;
  place-items:center;

  position:relative;

  overflow:hidden;
}

.device-photo img{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;

  background:#fff;
}

.photo-placeholder{
  color:#111827;

  font-size:9px;
  font-weight:900;

  text-align:center;

  padding:
    9px
    11px;

  border-radius:10px;

  background:#FAFAFA;

  border:
    1px solid #EEEEEE;
}


/* =====================================================
   REMOVE FAVORITE
===================================================== */

.remove-btn{
  position:absolute;

  top:8px;
  left:8px;

  width:33px;
  height:33px;

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #6246D9 0%,
      #5147B8 100%
    );

  color:#fff;

  display:grid;
  place-items:center;

  box-shadow:
    0 7px
    17px
    rgba(98,70,217,.30);

  z-index:4;

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.remove-btn:active{
  transform:scale(.88);

  box-shadow:
    0 4px
    10px
    rgba(98,70,217,.20);
}


/* =====================================================
   SALE TYPE
===================================================== */

.sale-type{
  position:absolute;

  top:8px;
  right:8px;

  padding:
    6px
    8px;

  border-radius:8px;

  background:
    linear-gradient(
      145deg,
      #FAF9FF 0%,
      #F0EDFF 100%
    );

  color:#51477D;

  font-size:8px;
  font-weight:950;

  box-shadow:
    0 5px
    12px
    rgba(81,71,125,.08);

  z-index:3;
}


/* =====================================================
   INFO
===================================================== */

.device-info{
  min-height:128px;

  padding:
    10px
    12px
    10px;

  background:
    linear-gradient(
      145deg,
      #FAF9FF 0%,
      #F6F3FF 45%,
      #EEEAFE 100%
    );

  position:relative;

  overflow:hidden;
}

.device-info::before{
  content:"";

  position:absolute;

  width:72px;
  height:72px;

  right:-35px;
  top:-38px;

  border-radius:50%;

  background:
    rgba(98,70,217,.065);

  pointer-events:none;
}

.device-info::after{
  content:"";

  position:absolute;

  width:8px;
  height:8px;

  left:14px;
  bottom:13px;

  border-radius:3px;

  background:
    rgba(98,70,217,.10);

  transform:rotate(18deg);

  pointer-events:none;
}

.device-name{
  position:relative;
  z-index:1;

  font-size:15px;

  font-weight:950;

  line-height:1.3;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  letter-spacing:-.02em;

  color:#2B2460;
}

.device-details{
  position:relative;
  z-index:1;

  margin-top:7px;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:5px 8px;
}

.detail-item{
  min-width:0;

  display:flex;

  flex-direction:column;

  gap:2px;

  padding:2px 0;
}

.detail-item span{
  color:#7C758F;

  font-size:8px;

  line-height:1.25;

  font-weight:800;
}

.detail-item strong{
  min-width:0;

  color:#29243F;

  font-size:10px;

  line-height:1.3;

  font-weight:950;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =====================================================
   PRICE
===================================================== */

.price-row{
  position:relative;
  z-index:1;

  margin-top:6px;

  padding-top:5px;

  border-top:
    1px solid
    rgba(81,71,125,.12);

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:6px;
}

.price-label{
  color:#7C758F;

  font-size:8px;

  line-height:1.2;

  font-weight:800;
}

.device-price{
  color:#51477D;

  font-size:14px;

  line-height:1.1;

  font-weight:950;

  white-space:nowrap;

  letter-spacing:-.025em;
}


/* =====================================================
   EMPTY
===================================================== */

.empty-state{
  margin-top:14px;

  padding:
    28px
    18px;

  min-height:300px;

  border-radius:21px;

  background:#fff;

  border:
    1px solid var(--line);

  box-shadow:var(--shadow);

  text-align:center;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  position:relative;

  overflow:hidden;
}

.empty-state::before{
  content:"";

  position:absolute;

  width:180px;
  height:180px;

  right:-75px;
  top:-105px;

  border-radius:50%;

  background:
    rgba(98,70,217,.055);

  pointer-events:none;
}

.empty-state::after{
  content:"";

  position:absolute;

  width:130px;
  height:130px;

  left:-55px;
  bottom:-78px;

  border-radius:50%;

  background:
    rgba(23,107,135,.045);

  pointer-events:none;
}

.empty-icon{
  position:relative;
  z-index:1;

  width:62px;
  height:62px;

  border-radius:19px;

  background:
    linear-gradient(
      145deg,
      #F0EEFF,
      #E7E2FF
    );

  color:var(--purple);

  border:
    1px solid #DDD8F7;

  display:grid;
  place-items:center;

  box-shadow:
    0 11px
    24px
    rgba(98,70,217,.10);
}

.empty-state h3{
  position:relative;
  z-index:1;

  margin:
    15px
    0
    0;

  font-size:16px;

  font-weight:950;
}

.empty-state p{
  position:relative;
  z-index:1;

  max-width:285px;

  margin:
    7px
    auto
    0;

  color:var(--muted);

  font-size:10px;

  line-height:1.8;
}

.browse-btn{
  position:relative;
  z-index:1;

  margin-top:16px;

  height:43px;

  padding:
    0
    18px;

  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      #176B87,
      #257F98
    );

  color:#fff;

  font-size:11px;

  font-weight:950;

  box-shadow:
    0 10px
    22px
    rgba(23,107,135,.18);

  transition:
    transform .18s ease;
}

.browse-btn:active{
  transform:scale(.97);
}


/* =====================================================
   LOADING
===================================================== */

.loading-state{
  grid-column:1 / -1;

  padding:
    32px
    18px;

  text-align:center;

  color:var(--muted);

  font-size:11px;

  background:#fff;

  border:
    1px solid var(--line);

  border-radius:19px;
}

.loading-spinner{
  width:29px;
  height:29px;

  margin:
    0
    auto
    10px;

  border-radius:50%;

  border:
    3px solid #E5E8EB;

  border-top-color:
    var(--purple);

  animation:
    spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:40;

  padding:
    7px
    10px
    calc(7px + var(--safe-bottom));

  background:
    rgba(255,255,255,.97);

  border-top:
    1px solid rgba(23,107,135,.10);

  box-shadow:
    0 -10px
    28px
    rgba(23,107,135,.07);

  backdrop-filter:blur(16px);
}

.bottom-inner{
  width:min(100%,520px);

  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  align-items:center;
}

.nav-item{
  min-width:0;

  height:51px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:4px;

  color:#858D94;

  background:transparent;

  font-size:8px;
  font-weight:850;

  transition:
    color .18s ease,
    transform .18s ease;
}

.nav-item:active{
  transform:scale(.95);
}

.nav-item.active{
  color:var(--primary-dark);
}

.nav-icon{
  width:21px;
  height:21px;
}

.add-button{
  width:43px;
  height:43px;

  margin-top:-13px;

  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      #176B87,
      #257F98
    );

  color:#fff;

  display:grid;
  place-items:center;

  box-shadow:
    0 8px
    20px
    rgba(23,107,135,.20);
}


/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  left:50%;
  bottom:88px;

  transform:
    translateX(-50%)
    translateY(12px);

  max-width:
    calc(100% - 40px);

  padding:
    10px
    14px;

  border-radius:13px;

  background:#1E2C30;

  color:#fff;

  font-size:11px;

  font-weight:800;

  text-align:center;

  box-shadow:
    0 12px
    30px
    rgba(23,32,42,.16);

  opacity:0;

  pointer-events:none;

  transition:
    opacity .22s ease,
    transform .22s ease;

  z-index:80;
}

.toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =====================================================
   ANIMATION
===================================================== */

.header{
  animation:
    headerIn .42s cubic-bezier(.2,.7,.2,1) both;
}

.header-content{
  animation:
    contentIn .42s .05s cubic-bezier(.2,.7,.2,1) both;
}

.empty-state{
  animation:
    contentIn .42s .09s cubic-bezier(.2,.7,.2,1) both;
}

@keyframes headerIn{
  from{
    opacity:0;
    transform:translateY(-10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes contentIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}


@media(max-width:360px){

  .device-photo{
    height:175px;
  }

  .device-info{
    min-height:126px;

    padding:
      9px
      10px
      9px;
  }

  .device-name{
    font-size:14px;
  }

  .detail-item span{
    font-size:7px;
  }

  .detail-item strong{
    font-size:9px;
  }

  .device-price{
    font-size:13px;
  }

}


@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none !important;
    transition:none !important;
  }

}


/* UNIFIED MZAD PHONE BOTTOM NAV */
.bottom-wrap,.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
}
.bottom-wrap{
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.bottom-nav{
  width:min(100%,520px);
  margin:0 auto;
  min-height:64px;
  padding:5px;
  border-radius:20px;
  background:rgba(255,255,255,.97);
  border:1px solid #E7ECEF;
  box-shadow:0 10px 28px rgba(23,32,42,.10);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  pointer-events:auto;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:3px;
}
.bottom-nav .nav-inner,.bottom-nav .bottom-inner{
  width:100%;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:3px;
  align-items:center;
  grid-column:1/-1;
}
.bottom-nav .nav-item{
  min-width:0;
  min-height:52px;
  padding:4px 2px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  border:0;
  border-radius:15px;
  background:transparent;
  color:#7E8992;
  text-decoration:none;
  transition:transform .16s ease,background .16s ease,color .16s ease;
}
.bottom-nav .nav-item:active{transform:scale(.96)}
.bottom-nav .nav-item.active{
  color:#176B87;background:#EAF6F8;
}
.bottom-nav .nav-item svg,
.bottom-nav .nav-icon{
  width:20px;
  height:20px;
  flex:0 0 20px;
  color:currentColor;
}
.bottom-nav .nav-label,
.bottom-nav .nav-item>span:not(.action-icon):not(.add-button){
  margin:0;
  font-size:8.5px;
  line-height:1;
  font-weight:900;
  white-space:nowrap;
}
.bottom-nav .action-icon,
.bottom-nav .add-button{
  width:38px!important;
  height:38px!important;
  flex:0 0 38px;
  border-radius:13px!important;
  display:grid!important;
  place-items:center;
  background:linear-gradient(145deg,#176B87,#32B8C4)!important;color:#fff!important;box-shadow:0 6px 14px rgba(23,107,135,.18);
}
.bottom-nav .action-icon svg,.bottom-nav .add-button svg{
  width:20px!important;
  height:20px!important;
}
@media(max-width:360px){
  .bottom-wrap{padding-inline:8px}
  .bottom-nav{border-radius:18px}
  .bottom-nav .nav-item{min-height:50px;border-radius:14px}
  .bottom-nav .nav-item svg,.bottom-nav .nav-icon{width:19px;height:19px;flex-basis:19px}
  .bottom-nav .nav-label,.bottom-nav .nav-item>span:not(.action-icon):not(.add-button){font-size:8px}
}

/* FINAL NAV SIZE — match the unified compact bottom navigation */
.bottom-nav{
  position:fixed!important;
  left:10px!important;
  right:10px!important;
  bottom:7px!important;
  width:auto!important;
  max-width:520px!important;
  height:64px!important;
  min-height:64px!important;
  max-height:64px!important;
  margin:0 auto!important;
  padding:5px!important;
  display:block!important;

</style>

<body>

<main class="page">

<div
  class="toast"
  id="toast">
</div>


<script type="module">

import { supabase } from "./js/supabase.js";


const devicesGrid =
  document.getElementById("devicesGrid");

const loadingState =
  document.getElementById("loadingState");

const emptyState =
  document.getElementById("emptyState");

const headerCount =
  document.getElementById("headerCount");

const browseBtn =
  document.getElementById("browseBtn");

const backBtn =
  document.getElementById("backBtn");

const refreshBtn =
  document.getElementById("refreshBtn");

const toast =
  document.getElementById("toast");


const FAVORITES_KEY =
  "mzad_phone_favorites";


let toastTimer;


/* =====================================================
   FAVORITES STORAGE
===================================================== */

function getFavoriteIds(){

  try{

    const raw =
      localStorage.getItem(
        FAVORITES_KEY
      );

    if(!raw){
      return [];
    }

    const parsed =
      JSON.parse(raw);

    if(!Array.isArray(parsed)){
      return [];
    }

    return [
      ...new Set(
        parsed
          .map(
            id => String(id).trim()
          )
          .filter(Boolean)
      )
    ];

  }catch(error){

    console.error(
      "Favorites read error:",
      error
    );

    return [];

  }

}


function saveFavoriteIds(ids){

  try{

    localStorage.setItem(
      FAVORITES_KEY,
      JSON.stringify(
        [
          ...new Set(
            ids
              .map(
                id => String(id).trim()
              )
              .filter(Boolean)
          )
        ]
      )
    );

  }catch(error){

    console.error(
      "Favorites save error:",
      error
    );

  }

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(price){

  const number =
    Number(price);

  if(
    !Number.isFinite(number) ||
    number <= 0
  ){

    return "السعر يحدد لاحقاً";

  }

  return (
    new Intl.NumberFormat("en-US")
      .format(number)
    + " د.ع"
  );

}


/* =====================================================
   IMAGES
===================================================== */

function getDeviceImages(value){

  if(!value){
    return [];
  }

  if(Array.isArray(value)){

    return value
      .filter(Boolean);

  }

  if(typeof value === "string"){

    const text =
      value.trim();

    if(!text){
      return [];
    }

    try{

      const parsed =
        JSON.parse(text);

      if(Array.isArray(parsed)){

        return parsed
          .filter(Boolean);

      }

    }catch(error){}

    return [text];

  }

  return [];

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =====================================================
   LOADING
===================================================== */

function showLoading(){

  loadingState.style.display =
    "block";

  emptyState.style.display =
    "none";

}


function hideLoading(){

  loadingState.style.display =
    "none";

}


/* =====================================================
   DETAIL ITEM
===================================================== */

function createDetailItem(
  label,
  value
){

  const item =
    document.createElement("div");

  item.className =
    "detail-item";


  const labelElement =
    document.createElement("span");

  labelElement.textContent =
    label;


  const valueElement =
    document.createElement("strong");

  valueElement.textContent =
    value || "غير محدد";


  item.appendChild(
    labelElement
  );

  item.appendChild(
    valueElement
  );


  return item;

}


/* =====================================================
   DEVICE CARD
===================================================== */

function createDeviceCard(
  device,
  index
){

  const card =
    document.createElement("article");

  card.className =
    "device-card";

  card.dataset.deviceId =
    device.id || "";

  card.style.animationDelay =
    `${Math.min(index * .04,.35)}s`;


  /* PHOTO */

  const photo =
    document.createElement("div");

  photo.className =
    "device-photo";


  const images =
    getDeviceImages(
      device.images
    );


  if(images.length){

    const img =
      document.createElement("img");

    img.src =
      images[0];

    img.alt =
      `${device.brand || ""} ${device.model || "جهاز"}`;

    img.loading =
      "lazy";

    img.decoding =
      "async";


    img.addEventListener(
      "error",
      () => {

        img.remove();

        const placeholder =
          document.createElement("span");

        placeholder.className =
          "photo-placeholder";

        placeholder.textContent =
          "تعذر تحميل الصورة";

        photo.prepend(
          placeholder
        );

      }
    );


    photo.appendChild(
      img
    );

  }else{

    const placeholder =
      document.createElement("span");

    placeholder.className =
      "photo-placeholder";

    placeholder.textContent =
      "لا توجد صورة";

    photo.appendChild(
      placeholder
    );

  }


  /* REMOVE */

  const removeButton =
    document.createElement("button");

  removeButton.type =
    "button";

  removeButton.className =
    "remove-btn";

  removeButton.setAttribute(
    "aria-label",
    "إزالة من المفضلة"
  );


  removeButton.innerHTML = `

    <svg
      width="17"
      height="17"
      viewBox="0 0 24 24"
      fill="#FFFFFF"
      stroke="#FFFFFF"
      stroke-width="1.8">

      <path
        d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/>

    </svg>

  `;


  removeButton.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      removeFavorite(
        device.id
      );

    }
  );


  photo.appendChild(
    removeButton
  );


  /* SALE TYPE */

  const saleType =
    document.createElement("span");

  saleType.className =
    "sale-type";

  saleType.textContent =
    normalizeSaleType(
      device.sale_type
    );


  photo.appendChild(
    saleType
  );


  /* INFO */

  const info =
    document.createElement("div");

  info.className =
    "device-info";


  const name =
    document.createElement("div");

  name.className =
    "device-name";

  name.textContent =
    [
      device.brand,
      device.model
    ]
    .filter(Boolean)
    .join(" ") ||
    "جهاز";


  const details =
    document.createElement("div");

  details.className =
    "device-details";


  details.appendChild(
    createDetailItem(
      "التخزين",
      device.storage || "غير محدد"
    )
  );


  details.appendChild(
    createDetailItem(
      "اللون",
      device.color || "غير محدد"
    )
  );


  let battery =
    "غير محددة";


  if(
    device.battery_health !== null &&
    device.battery_health !== undefined &&
    device.battery_health !== ""
  ){

    battery =
      `${device.battery_health}%`;

  }


  details.appendChild(
    createDetailItem(
      "البطارية",
      battery
    )
  );


  const priceRow =
    document.createElement("div");

  priceRow.className =
    "price-row";


  const priceLabel =
    document.createElement("span");

  priceLabel.className =
    "price-label";

  priceLabel.textContent =
    "السعر";


  const price =
    document.createElement("strong");

  price.className =
    "device-price";

  price.textContent =
    formatPrice(
      device.price
    );


  priceRow.appendChild(
    priceLabel
  );

  priceRow.appendChild(
    price
  );


  info.appendChild(
    name
  );

  info.appendChild(
    details
  );

  info.appendChild(
    priceRow
  );


  card.appendChild(
    photo
  );

  card.appendChild(
    info
  );


  card.addEventListener(
    "click",
    () => {

      if(!device.id){
        return;
      }

      window.location.href =
        `device.html?id=${encodeURIComponent(device.id)}`;

    }
  );


  return card;

}


/* =====================================================
   SALE TYPE
===================================================== */

function normalizeSaleType(value){

  const type =
    String(
      value || "direct"
    )
    .toLowerCase();


  if(
    type === "auction" ||
    type === "مزاد"
  ){

    return "مزاد";

  }


  return "بيع مباشر";

}


/* =====================================================
   CLEAR CARDS
===================================================== */

function clearCards(){

  devicesGrid
    .querySelectorAll(
      ".device-card"
    )
    .forEach(
      card => card.remove()
    );

}


/* =====================================================
   LOAD ONE FAVORITE
   الطريقة الجديدة:
   كل ID ينفحص بشكل مستقل
===================================================== */

async function loadOneFavorite(id){

  try{

    const {
      data,
      error
    } =
      await supabase
        .from("devices")
        .select(`
          id,
          created_at,
          brand,
          model,
          storage,
          color,
          battery_health,
          condition,
          body_condition,
          screen_condition,
          face_id,
          cameras,
          charging,
          replaced_parts,
          price,
          location,
          sale_type,
          seller_id,
          seller_name,
          images,
          notes
        `)
        .eq(
          "id",
          id
        )
        .maybeSingle();


    if(error){

      console.error(
        `Favorite device ${id} error:`,
        error
      );

      return null;

    }


    return data || null;

  }catch(error){

    console.error(
      `Favorite device ${id} exception:`,
      error
    );

    return null;

  }

}


/* =====================================================
   LOAD FAVORITES
===================================================== */

async function loadFavorites(){

  showLoading();

  clearCards();


  const favoriteIds =
    getFavoriteIds();


  /* لا توجد مفضلة */

  if(!favoriteIds.length){

    hideLoading();

    emptyState.style.display =
      "flex";

    headerCount.textContent =
      "0 جهاز";

    return;

  }


  /*
    نجلب كل جهاز محفوظ بشكل مستقل.
    هذا يلغي الاعتماد على .in()
  */

  const results =
    await Promise.all(
      favoriteIds.map(
        id =>
          loadOneFavorite(id)
      )
    );


  /*
    نحذف النتائج الفارغة
    ونبقي ترتيب الأجهزة نفس ترتيب الحفظ.
  */

  const favorites =
    results.filter(
      device =>
        device !== null
    );


  /*
    IDs الموجودة فعلياً في قاعدة البيانات
  */

  const existingIds =
    new Set(
      favorites.map(
        device =>
          String(device.id)
      )
    );


  /*
    تنظيف المفضلة من الأجهزة المحذوفة
  */

  const cleanedIds =
    favoriteIds.filter(
      id =>
        existingIds.has(
          String(id)
        )
    );


  if(
    cleanedIds.length !==
    favoriteIds.length
  ){

    saveFavoriteIds(
      cleanedIds
    );

  }


  /*
    رسم الأجهزة
  */

  favorites.forEach(
    (device,index) => {

      devicesGrid.appendChild(
        createDeviceCard(
          device,
          index
        )
      );

    }
  );


  hideLoading();


  /*
    لا توجد أجهزة فعلية
  */

  if(!favorites.length){

    emptyState.style.display =
      "flex";

    headerCount.textContent =
      "0 جهاز";


    showToast(
      "الأجهزة المحفوظة غير متاحة حالياً"
    );

    return;

  }


  emptyState.style.display =
    "none";


  headerCount.textContent =
    `${favorites.length} ${
      favorites.length === 1
        ? "جهاز"
        : "أجهزة"
    }`;

}


/* =====================================================
   REMOVE FAVORITE
===================================================== */

function removeFavorite(deviceId){

  if(
    deviceId === undefined ||
    deviceId === null
  ){

    return;

  }


  const id =
    String(deviceId);


  const current =
    getFavoriteIds();


  const next =
    current.filter(
      favoriteId =>
        String(favoriteId) !== id
    );


  saveFavoriteIds(
    next
  );


  showToast(
    "تمت إزالة الجهاز من المفضلة"
  );


  loadFavorites();

}


/* =====================================================
   BROWSE
===================================================== */

browseBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      "market.html";

  }
);


/* =====================================================
   REFRESH
===================================================== */

refreshBtn.addEventListener(
  "click",
  () => {

    loadFavorites();

  }
);


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if(
      document.referrer &&
      document.referrer.includes(
        window.location.host
      )
    ){

      window.history.back();

    }else{

      window.location.href =
        "home.html";

    }

  }
);


/* =====================================================
   BOTTOM NAV
===================================================== */

document
  .querySelectorAll(".nav-item")
  .forEach(
    item => {

      item.addEventListener(
        "click",
        () => {

          const page =
            item.dataset.page;

          if(page){

            window.location.href =
              page;

          }

        }
      );

    }
  );


/* =====================================================
   START
===================================================== */

loadFavorites();

</script>
