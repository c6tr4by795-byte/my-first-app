<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#6f5ce0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MZAD PHONE — المفضلة</title>

<style>
:root{
  --bg:#f9f8fd;--ink:#17202a;--muted:#6b7280;--line:#ece8fb;--edge:#ddd8f8;
  --p:#6246d9;--p-dark:#4a34b8;--p-soft:#f3f0ff;--hot:#e8590c;--ok:#1e8a5a;
  --safe-bottom:env(safe-area-inset-bottom,0px)
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility
}

button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}

.page{
  width:min(100%,520px);
  margin:0 auto;
  padding:0 14px calc(112px + var(--safe-bottom));
  overflow-x:clip
}

@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pulse2{50%{opacity:.3}}

/* ============ الهيدر (نفس هوية الرئيسية: بنفسجي + شبكة هندسية ثابتة) ============ */

header{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  margin-inline:-14px;
  padding:env(safe-area-inset-top,0px) 14px 18px;
  background:
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 46%),
    linear-gradient(145deg,#5a45d4 0%,#7a67e8 50%,#a496f3 100%);
  border-radius:0 0 24px 24px;
  border-bottom:1px solid #5f4cd0;
  box-shadow:0 10px 26px rgba(74,52,184,.28)
}

.web{position:absolute;top:0;z-index:0;pointer-events:none;opacity:.26}
.web svg{display:block;width:100%;height:100%}
.web-a{left:0;width:190px;height:190px}
.web-b{right:0;width:150px;height:150px;opacity:.2;transform:scaleX(-1)}

.topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 6px}
.topbar-side{display:flex;align-items:center;gap:8px}

.brand-mini{display:flex;flex-direction:column;align-items:flex-start;gap:4px;color:#fff;line-height:1}
.brand-mini strong{font-size:25px;font-weight:950;letter-spacing:.02em;line-height:1}
.brand-mini span{font-size:9.5px;font-weight:800;letter-spacing:.5em;margin-inline-end:-.5em;color:rgba(255,255,255,.85);line-height:1}

.icon-btn{
  width:40px;height:36px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.6);border-radius:12px;background:rgba(255,255,255,.9);color:var(--p);
  box-shadow:0 7px 18px rgba(23,32,42,.08);flex:0 0 auto;transition:transform .18s ease
}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.head-row{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px;padding:0 2px}
.head-row h1{margin:0;font-size:24px;font-weight:950;letter-spacing:-.04em;color:#fff;line-height:1.15}
.head-row p{margin:5px 0 0;font-size:11px;font-weight:700;line-height:1.6;color:rgba(255,255,255,.82)}
.count-chip{
  flex:0 0 auto;padding:6px 12px;border-radius:999px;
  background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.32);
  color:#fff;font-size:11px;font-weight:900;white-space:nowrap
}

/* ============ التبويبات ============ */

.section{margin-top:16px}

.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.tabs::-webkit-scrollbar{display:none}

.tab{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:999px;background:#fff;border:1.5px solid var(--edge);
  font-size:12.5px;font-weight:900;color:#4b5563;
  transition:background .2s,border-color .2s,color .2s,transform .18s
}
.tab:active{transform:scale(.95)}
.tab small{
  min-width:20px;padding:1px 6px;border-radius:999px;background:var(--p-soft);
  color:var(--p-dark);font-size:10px;font-weight:900;text-align:center
}
.tab.active{background:var(--p-soft);border-color:#8977e9;color:var(--p-dark)}
.tab.active small{background:var(--p);color:#fff}

/* ============ شبكة الكروت (نفس كرت الرئيسية) ============ */

.grid{
  margin-top:14px;
  display:grid;grid-template-columns:minmax(0,1fr);gap:18px
}

.fcard,.sk{
  position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden
}

.fcard{
  display:block;cursor:pointer;background:#1d2430;
  box-shadow:0 12px 24px -12px rgba(74,52,184,.45),inset 0 0 0 1px rgba(255,255,255,.08);
  animation:up .4s ease backwards;
  transition:transform .2s ease,opacity .22s ease
}
.fcard:active{transform:scale(.97)}
.fcard.leaving{opacity:0;transform:scale(.9)}

.fmedia{
  position:absolute;inset:0;overflow:hidden;isolation:isolate;
  background:#20242c
}
/* تعبئة مساحة الصورة بصورة طبيعية من دون شريط ضبابي منفصل */
.fmedia::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:var(--img,none) center/cover no-repeat;
  filter:blur(10px);opacity:.42;transform:scale(1.06)
}
.fmedia img{
  position:absolute;inset:0;z-index:1;display:block;
  width:100%;height:100%;object-fit:contain;object-position:center;background:transparent
}
.no-img{position:absolute;inset:0;z-index:1;display:grid;place-items:center}
.no-img svg{width:38px;height:38px;opacity:.5}

.shade{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(to top,rgba(20,14,48,.94) 0%,rgba(20,14,48,.62) 28%,rgba(20,14,48,0) 58%)
}

.fav-btn{
  position:absolute;top:12px;inset-inline-start:12px;z-index:10;
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:0;
  background:rgba(255,255,255,.96);color:#e5365f;
  box-shadow:0 5px 13px rgba(23,32,42,.15);transition:transform .18s
}
.fav-btn:active{transform:scale(.85)}
.fav-btn svg{width:19px;height:19px;fill:currentColor;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.fbody{
  position:absolute;inset-inline:0;bottom:0;z-index:3;padding:16px 16px 17px;color:#fff;
  display:flex;flex-direction:column;gap:9px
}

.cd{
  align-self:flex-start;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:#fff;font-size:12px;font-weight:950;font-variant-numeric:tabular-nums;direction:ltr
}
.cd:before{content:"";width:5px;height:5px;border-radius:50%;background:#7CFFB2;animation:pulse2 1.6s infinite}
.cd.urgent{background:rgba(232,89,12,.94)}
.cd.urgent:before{background:#fff}
.cd.over{background:rgba(255,255,255,.14);color:rgba(255,255,255,.8)}
.cd.over:before{background:#c8c3e6;animation:none}

.ftitle{
  margin:0;font-size:16px;font-weight:950;line-height:1.35;letter-spacing:-.015em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}

.specs{display:flex;flex-wrap:wrap;gap:4px}
.spec{
  padding:5px 9px;border-radius:7px;background:rgba(255,255,255,.16);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-size:11px;font-weight:800;color:#fff
}

.frow{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,.18)}
.frow-main{min-width:0;flex:1}
.frow small{display:block;font-size:8.5px;font-weight:800;color:#ffffffb3}
.frow b{display:block;margin-top:2px;font-size:19px;font-weight:950;white-space:nowrap}

.type{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:8.5px;font-weight:900;white-space:nowrap}
.type.auc{background:var(--p);color:#fff}
.type.dir{background:rgba(255,255,255,.95);color:var(--ok);font-size:9px;padding:4px 7px;line-height:1.2}
.type.end{background:rgba(255,255,255,.2);color:#fff}

/* ============ التحميل والحالة الفارغة ============ */

.sk{
  border:1px solid var(--line);
  background:linear-gradient(90deg,#f1eefb 25%,#faf8ff 50%,#f1eefb 75%);
  background-size:200% 100%;animation:shimmer 1.4s linear infinite
}

.empty{
  position:relative;overflow:hidden;margin-top:12px;min-height:300px;padding:28px 18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  border:1px solid var(--edge);border-radius:22px;
  background:linear-gradient(145deg,#fff 0%,#faf8ff 100%);
  box-shadow:0 10px 24px -14px rgba(98,70,217,.22);
  animation:up .4s ease backwards
}
.empty-web{position:absolute;z-index:0;pointer-events:none;width:110px;height:110px;opacity:.2}
.empty-web svg{display:block;width:100%;height:100%}
.ew-a{top:0;right:0;transform:scaleX(-1)}
.ew-b{bottom:0;left:0;transform:scaleY(-1)}

.empty-icon{
  position:relative;z-index:1;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
  background:var(--p-soft);color:var(--p-dark);border:1px solid #e3defa;
  box-shadow:0 11px 24px rgba(98,70,217,.12)
}
.empty-icon svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.empty h3{position:relative;z-index:1;margin:16px 0 0;font-size:17px;font-weight:950}
.empty p{position:relative;z-index:1;max-width:270px;margin:7px auto 0;color:var(--muted);font-size:11.5px;font-weight:700;line-height:1.9}
.empty-btn{
  position:relative;z-index:1;margin-top:18px;height:46px;padding:0 24px;border-radius:14px;color:#fff;
  font-size:13px;font-weight:900;background:linear-gradient(145deg,#6246d9,#8b6cf0);
  box-shadow:0 10px 22px rgba(98,70,217,.32);transition:transform .18s ease
}
.empty-btn:active{transform:scale(.96)}

/* ============ الشريط السفلي (نفس الرئيسية) ============ */

.bottom-wrap{
  position:fixed;left:0;right:0;bottom:-6px;width:100%;
  padding:6px 12px calc(6px + var(--safe-bottom));z-index:100;pointer-events:none
}

.bottom-nav{
  width:min(100%,500px);margin:0 auto;min-height:66px;padding:6px;border-radius:22px;
  background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 10px 28px rgba(23,32,42,.13);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);pointer-events:auto
}

.bottom-inner{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;align-items:center}

.nav-item{
  min-width:0;min-height:54px;padding:4px 2px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;border-radius:16px;color:#7e8992;
  transition:transform .18s ease
}
.nav-item:active{transform:scale(.93)}
.nav-item.active{color:var(--p-dark);background:var(--p-soft)}
.nav-icon{width:23px;height:23px;flex:0 0 23px}
.nav-item>span:not(.add-button){font-size:10px;line-height:1;font-weight:900;white-space:nowrap}

.add-button{
  width:40px;height:40px;flex:0 0 40px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(145deg,#6246d9,#8b6cf0);color:#fff;box-shadow:0 6px 14px rgba(98,70,217,.32)
}
.add-button svg{width:22px;height:22px}

/* ============ التوست ============ */

.toast{
  position:fixed;left:50%;bottom:calc(92px + var(--safe-bottom));
  transform:translateX(-50%) translateY(16px);max-width:calc(100% - 40px);
  padding:10px 14px;border-radius:13px;background:#1e2c30;color:#fff;font-size:11px;font-weight:800;
  box-shadow:0 14px 34px rgba(24,44,49,.14);opacity:0;pointer-events:none;transition:.25s ease;z-index:120;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:360px){
  .nav-icon{width:21px;height:21px}
  .nav-item>span:not(.add-button){font-size:9px}
  .head-row h1{font-size:22px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<script type="module">

import { supabase } from "./js/supabase.js";

const $ = id => document.getElementById(id);

const grid = $("grid");
const emptyBox = $("empty");
const toast = $("toast");

let toastTimer;

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

const esc = v => String(v ?? "").replace(
  /[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])
);

const go = url => { window.location.href = url; };

/* ================================
   مخزن المفضلة
   الصفحات المختلفة تحفظ بمفاتيح مختلفة، فنقرأ منها كلها ونحذف من كلها
================================ */

const FAV_PREFIXES = ["mzad_phone_favorites", "mzad_favs"];
const AUC_PREFIX = "mzad_favorite_auction_";

let uid = null;

async function initScope(){
  try{
    const { data, error } = await supabase.auth.getUser();
    if(error) throw error;
    uid = data?.user?.id || null;
  }catch(error){
    console.warn("FAVORITES SCOPE:", error);
    uid = null;
  }
}

const keyOf = prefix => prefix + ":" + (uid ? "user:" + uid : "guest");

function readList(key){
  try{
    const arr = JSON.parse(localStorage.getItem(key) || "[]");
    return Array.isArray(arr) ? arr.map(x => String(x).trim()).filter(Boolean) : [];
  }catch{
    return [];
  }
}

function writeList(key, list){
  try{
    localStorage.setItem(key, JSON.stringify([...new Set(list)]));
  }catch{}
}

/* الأحدث حفظاً أولاً */
function favoriteIds(){

  const ids = [];

  FAV_PREFIXES.forEach(p => ids.push(...readList(keyOf(p))));

  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(AUC_PREFIX) && localStorage.getItem(k) === "1")
        ids.push(k.slice(AUC_PREFIX.length));
    }
  }catch{}

  return [...new Set(ids)].reverse();
}

function removeId(id){

  FAV_PREFIXES.forEach(p => {
    const k = keyOf(p);
    writeList(k, readList(k).filter(x => x !== id));
  });

  try{ localStorage.removeItem(AUC_PREFIX + id); }catch{}
}

/* ================================
   مساعدات الأجهزة
================================ */

function getImages(images){

  if(!images) return [];

  if(Array.isArray(images)) return images.filter(Boolean);

  if(typeof images === "string"){

    const value = images.trim();

    if(!value) return [];

    try{
      const parsed = JSON.parse(value);
      if(Array.isArray(parsed)) return parsed.filter(Boolean);
    }catch{}

    return [value];
  }

  return [];
}

function imageUrl(images){

  const first = getImages(images)[0];

  if(!first) return "";

  const value = String(first).trim();

  if(/^(https?:|data:)/.test(value)) return value;

  const { data } = supabase.storage.from("device-images").getPublicUrl(value);

  return data?.publicUrl || "";
}

const nameOf = d => [d.brand, d.model].filter(Boolean).join(" ") || "جهاز";

function formatPrice(price){

  const number = Number(price);

  if(!Number.isFinite(number) || number <= 0) return "السعر يحدد لاحقاً";

  return new Intl.NumberFormat("en-US").format(number) + " د.ع";
}

function batteryText(value){

  if(value === null || value === undefined || String(value).trim() === "") return "";

  const v = String(value).trim();

  return "بطارية " + (/^\d+$/.test(v) ? v + "%" : v);
}

const isAuctionType = v => String(v || "").toLowerCase().includes("auction");

/* ================================
   تحميل جهاز واحد (بيع مباشر أو مزاد)
   null = غير موجود فعلاً، { failed:true } = تعذر الفحص (لا نحذفه)
================================ */

const COLS = "id,created_at,brand,model,storage,color,battery_health,price,sale_type,images";

async function loadAuctionItem(id){
  // بعض أزرار المفضلة تحفظ معرّف المزاد، وبعضها معرّف الجهاز نفسه.
  const auctionResult = await supabase
    .from("mzad_auctions")
    .select("id,device_id,starting_price_iqd,current_price_iqd,status,ends_at,created_at")
    .eq("id", id)
    .maybeSingle();

  if(auctionResult.error) return { failed:true };
  let auction = auctionResult.data;
  let deviceId = auction?.device_id || null;

  // إذا لم يكن المعرّف مزاداً، جرّب اعتباره معرّف جهاز مزاد.
  if(!auction){
    const byDevice = await supabase
      .from("mzad_auctions")
      .select("id,device_id,starting_price_iqd,current_price_iqd,status,ends_at,created_at")
      .eq("device_id", id)
      .order("created_at", { ascending:false })
      .limit(1);
    if(byDevice.error) return { failed:true };
    auction = byDevice.data?.[0] || null;
    deviceId = auction?.device_id || id;
  }
  if(!auction) return null;

  const [deviceResult, imagesResult] = await Promise.all([
    supabase.from("mzad_devices")
      .select("brand,model,storage,color,battery_health")
      .eq("id", deviceId).maybeSingle(),
    supabase.from("mzad_device_images")
      .select("storage_path,is_primary,sort_order")
      .eq("device_id", deviceId).limit(8)
  ]);

  if(deviceResult.error || imagesResult.error) return { failed:true };
  const imgs = [...(imagesResult.data || [])]
    .sort((x,y) => (Number(y.is_primary) - Number(x.is_primary)) || (Number(x.sort_order) - Number(y.sort_order)))
    .map(i => i.storage_path).filter(Boolean);
  const d = deviceResult.data || {};

  return {
    id: String(auction.id), kind:"auction", brand:d.brand, model:d.model,
    storage:d.storage, color:d.color, battery_health:d.battery_health,
    price:Number(auction.current_price_iqd || auction.starting_price_iqd) || 0,
    ends_at:auction.ends_at, status:auction.status, images:imgs
  };
}

async function loadOne(id){
  let hadError = false;

  // البيع المباشر القديم يستخدم public.devices (معرّف رقمي).
  try {
    const direct = await supabase.from("devices").select(COLS).eq("id", id).maybeSingle();
    if(direct.data) {
      return isAuctionType(direct.data.sale_type)
        ? { ...direct.data, id:String(direct.data.id), kind:"auction", ends_at:direct.data.auction_ends_at || null }
        : { ...direct.data, id:String(direct.data.id), kind:"direct" };
    }
    if(direct.error) hadError = true;
  } catch { hadError = true; }

  // نظام المزاد الجديد يستخدم UUID في mzad_devices، وقد يكون المحفوظ هو device_id.
  try {
    const modernDevice = await supabase.from("mzad_devices")
      .select("id,brand,model,storage,color,battery_health,created_at")
      .eq("id", id).maybeSingle();

    if(modernDevice.error) hadError = true;
    if(modernDevice.data) {
      const auction = await supabase.from("mzad_auctions")
        .select("id,device_id,starting_price_iqd,current_price_iqd,status,ends_at,created_at")
        .eq("device_id", modernDevice.data.id)
        .order("created_at", {ascending:false}).limit(1);

      if(auction.error) return {failed:true};
      if(auction.data?.length) {
        const a = auction.data[0];
        const images = await supabase.from("mzad_device_images")
          .select("storage_path,is_primary,sort_order").eq("device_id", modernDevice.data.id).limit(8);
        if(images.error) return {failed:true};
        const imgs = [...(images.data||[])]
          .sort((x,y)=>(Number(y.is_primary)-Number(x.is_primary))||(Number(x.sort_order)-Number(y.sort_order)))
          .map(x=>x.storage_path).filter(Boolean);
        return {id:String(a.id),kind:"auction",brand:modernDevice.data.brand,model:modernDevice.data.model,
          storage:modernDevice.data.storage,color:modernDevice.data.color,battery_health:modernDevice.data.battery_health,
          price:Number(a.current_price_iqd||a.starting_price_iqd)||0,ends_at:a.ends_at,status:a.status,images:imgs};
      }
      return null;
    }
  } catch { hadError = true; }

  try {
    const item = await loadAuctionItem(id);
    if(item && !item.failed) return item;
    if(item && item.failed) hadError = true;
  } catch { hadError = true; }

  return hadError ? {failed:true} : null;
}

/* ================================
   الحالة والرسم
================================ */

const state = { items:[], tab:"all", loading:true };

const HEART =
  '<svg viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7Z"/></svg>';

const PH_ICON =
  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M9.5 5.5h5"/><path d="M11 18.5h2"/></svg>';

function cardHTML(it, i){

  const auction = it.kind === "auction";

  const url = imageUrl(it.images);

  const specs = [it.storage, it.color, batteryText(it.battery_health)]
    .map(v => String(v ?? "").trim())
    .filter(Boolean)
    .slice(0, 3);

  const over = auction && it.ends_at && new Date(it.ends_at).getTime() <= Date.now();

  return `
    <article class="fcard" data-id="${esc(it.id)}" data-kind="${it.kind}" style="animation-delay:${Math.min(i * 50, 350)}ms">

      <div class="fmedia"${url ? ` style="--img:url('${esc(url)}')"` : ""}>
        ${
          url
            ? `<img src="${esc(url)}" alt="${esc(nameOf(it))}" loading="lazy" decoding="async" draggable="false" onerror="this.remove()">`
            : `<div class="no-img">${PH_ICON}</div>`
        }
      </div>

      <div class="shade"></div>

      <button class="fav-btn" type="button" data-remove="${esc(it.id)}" aria-label="إزالة من المفضلة">${HEART}</button>

      <div class="fbody">

        ${
          auction && it.ends_at
            ? `<span class="cd" data-end="${esc(it.ends_at)}">--:--:--</span>`
            : ""
        }

        <h3 class="ftitle">${esc(nameOf(it))}</h3>

        <div class="specs">
          ${specs.map(s => `<span class="spec">${esc(s)}</span>`).join("")}
        </div>

        <div class="frow">

          <div class="frow-main">
            <small>${auction ? "السعر الحالي" : "السعر"}</small>
            <b>${esc(formatPrice(it.price))}</b>
          </div>

          ${
            auction
              ? `<span class="type ${over ? "end" : "auc"}">${over ? "انتهى" : "مزاد"}</span>`
              : '<span class="type dir">بيع مباشر</span>'
          }

        </div>

      </div>

    </article>
  `;
}

function render(){

  const all = state.items;

  const aucs = all.filter(x => x.kind === "auction").length;

  $("cAll").textContent = all.length;
  $("cAuc").textContent = aucs;
  $("cDir").textContent = all.length - aucs;

  $("headerCount").textContent =
    all.length === 1 ? "جهاز واحد" : `${all.length} ${all.length === 2 || (all.length >= 3 && all.length <= 10) ? "أجهزة" : "جهاز"}`;

  document.querySelectorAll(".tab").forEach(t => {
    const on = t.dataset.tab === state.tab;
    t.classList.toggle("active", on);
    t.setAttribute("aria-selected", on);
  });

  if(state.loading){
    emptyBox.hidden = true;
    grid.innerHTML = Array.from({length:4}, () => '<div class="sk"></div>').join("");
    return;
  }

  const list = state.tab === "all" ? all : all.filter(x => x.kind === state.tab);

  if(!list.length){

    grid.innerHTML = "";
    emptyBox.hidden = false;

    if(!all.length){
      $("emptyTitle").textContent = "ما عندك أجهزة بالمفضلة بعد";
      $("emptyText").textContent = "احفظ أي جهاز يعجبك حتى تقدر ترجعله بسرعة من هنا.";
    }else{
      $("emptyTitle").textContent = state.tab === "auction" ? "ماكو مزادات محفوظة" : "ماكو أجهزة بيع مباشر محفوظة";
      $("emptyText").textContent = "جرّب قسم ثاني، أو استكشف أجهزة جديدة.";
    }

    return;
  }

  emptyBox.hidden = true;

  grid.innerHTML = list.map(cardHTML).join("");

  tickTimers();
}

/* ================================
   العدادات
================================ */

function fmtLeft(ms){

  if(ms <= 0) return "انتهى";

  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;

  const p = n => String(n).padStart(2, "0");

  return d > 0 ? `${d} يوم ${h} س` : `${p(h)}:${p(m)}:${p(sec)}`;
}

function tickTimers(){

  const now = Date.now();

  document.querySelectorAll("[data-end]").forEach(el => {

    const left = new Date(el.dataset.end).getTime() - now;

    el.textContent = fmtLeft(left);

    el.classList.toggle("urgent", left > 0 && left < 3600e3);
    el.classList.toggle("over", left <= 0);
  });
}

setInterval(tickTimers, 1000);

/* ================================
   التحميل
================================ */

async function loadFavorites(){

  state.loading = true;
  render();

  const ids = favoriteIds();

  if(!ids.length){
    state.items = [];
    state.loading = false;
    render();
    return;
  }

  const results = await Promise.all(ids.map(loadOne));

  /* ننظف فقط الأجهزة المحذوفة فعلاً، وما نحذف شي إذا الفحص فشل */
  ids.forEach((id, i) => {
    if(results[i] === null) removeId(id);
  });

  state.items = results.filter(r => r && !r.failed);

  state.loading = false;
  render();

  if(results.some(r => r && r.failed))
    showToast("بعض الأجهزة تعذر تحميلها، حاول التحديث");
}

/* ================================
   الأحداث
================================ */

grid.addEventListener("click", event => {

  const rm = event.target.closest("[data-remove]");

  if(rm){

    event.preventDefault();
    event.stopPropagation();

    const id = rm.dataset.remove;
    const card = rm.closest(".fcard");

    if(card) card.classList.add("leaving");

    setTimeout(() => {
      removeId(id);
      state.items = state.items.filter(x => x.id !== id);
      render();
      showToast("تمت إزالة الجهاز من المفضلة");
    }, 220);

    return;
  }

  const card = event.target.closest(".fcard");

  if(!card || !card.dataset.id) return;

  const id = encodeURIComponent(card.dataset.id);

  go(
    card.dataset.kind === "auction"
      ? `auction-details.html?auction=${id}`
      : `device.html?id=${id}`
  );
});

$("tabs").addEventListener("click", event => {

  const tab = event.target.closest(".tab");

  if(!tab) return;

  state.tab = tab.dataset.tab;
  render();
});

$("browseBtn").addEventListener("click", () => go("market.html"));

$("refreshBtn").addEventListener("click", async () => {
  await loadFavorites();
  showToast("تم تحديث المفضلة");
});

$("backBtn").addEventListener("click", () => {

  if(document.referrer && document.referrer.includes(window.location.host))
    window.history.back();
  else
    go("home.html");
});

/* ================================
   START
================================ */

initScope().finally(() => loadFavorites());

</script>

<style id="mzad-scroll-nav-style">
.mzad-scroll-nav-target{transition:transform .32s cubic-bezier(.22,.8,.3,1)!important;will-change:transform}
.mzad-scroll-nav-target.mzad-nav-hidden{transform:translate3d(0,calc(100% + 24px),0)!important;pointer-events:none!important}

/* توحيد موضع زر الرجوع في واجهات RTL: اليمين */
#backBtn{order:-10}
</style>
<script>
(function(){
  const target = document.querySelector(".bottom-wrap") || document.querySelector(".bw") || document.querySelector("nav.bottom-nav") || (document.querySelector("nav.nav") ? document.querySelector("nav.nav").parentElement : null);
  if(!target || target.dataset.scrollNavReady) return;
  target.dataset.scrollNavReady = "1";
  target.classList.add("mzad-scroll-nav-target");
  let lastY = window.scrollY, acc = 0, hidden = false, ticking = false;
  const setHidden = value => {
    if(hidden === value) return;
    hidden = value;
    target.classList.toggle("mzad-nav-hidden", value);
  };
  const update = () => {
    ticking = false;
    const y = window.scrollY;
    const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    if(y <= 0 || y >= max - 1){
      lastY = Math.min(Math.max(y,0),max); acc = 0;
      if(y <= 0) setHidden(false);
      return;
    }
    const diff = y - lastY; lastY = y;
    if(y < 80){ setHidden(false); acc = 0; return; }
    if(diff * acc < 0) acc = 0;
    acc += diff;
    if(acc > 28){ setHidden(true); acc = 0; }
    else if(acc < -12){ setHidden(false); acc = 0; }
  };
  window.addEventListener("scroll", () => {
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }, {passive:true});
  window.addEventListener("pageshow", () => { lastY = window.scrollY; if(window.scrollY < 80) setHidden(false); });
})();
</script>
