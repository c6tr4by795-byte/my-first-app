linear-gradient(
145deg,

/* =========================
LOADING
========================= */

.loading{
position:fixed;

inset:0;

background:var(--bg);

z-index:100;

display:flex;

align-items:center;

justify-content:center;

transition:.3s ease
}

.loading.hidden{
opacity:0;

visibility:hidden;

pointer-events:none
}

.loader{
width:34px;
height:34px;

border:
3px solid
#dbe8eb;

border-top-color:
var(--primary);

border-radius:50%;

animation:
spin .8s linear infinite
}

@keyframes spin{
to{
transform:rotate(360deg)
}
}


/* =========================
TOAST
========================= */

.toast{
position:fixed;

left:50%;

bottom:94px;

transform:
translateX(-50%)
translateY(16px);

calc(100% - 40px);

10px
14px;

color:#fff;

font-size:11px;

font-weight:800;

box-shadow:var(--shadow);

opacity:0;

pointer-events:none;

transition:.25s ease;

z-index:80;

text-align:center
}

.toast.show{
opacity:1;

translateX(-50%)
translateY(0)
}

<script type="module">

import { supabase } from "./js/supabase.js";


const loading =
document.getElementById("loading");

const emptyState =
document.getElementById("emptyState");

const devicesGrid =
document.getElementById("devicesGrid");

const browseBtn =
document.getElementById("browseBtn");

const backBtn =
document.getElementById("backBtn");

const toast =
document.getElementById("toast");

let toastTimer;


/* =========================
TOAST
========================= */

function showToast(message){

toast.textContent =
message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer =
setTimeout(()=>{

toast.classList.remove("show");

},2200);

}


/* =========================
CHECK AUTH
========================= */

async function checkAuth(){

try{

const {
data,
error
} =
await supabase.auth.getSession();


if(
error ||
!data?.session
){

window.location.replace(
"index.html?login=1&returnTo=favorites.html"
);

return false;

}

return true;

}catch(error){

console.error(
"Auth error:",
error
);

window.location.replace(
"index.html?login=1&returnTo=favorites.html"
);

return false;

}

}


/* =========================
LOAD FAVORITES
========================= */

async function loadFavorites(){

const loggedIn =
await checkAuth();


if(!loggedIn)return;


/*
  حالياً ما عدنا جدول المفضلة
  مربوط بالواجهة.

  لذلك نعرض Empty State
  بشكل صحيح بدل بيانات وهمية.

  لاحقاً هنا راح يكون الاستعلام
  الحقيقي من Supabase.
*/

emptyState.hidden = false;

devicesGrid.hidden = true;

loading.classList.add(
"hidden"
);

}


/* =========================
BROWSE
========================= */

browseBtn.addEventListener(
"click",
()=>{

window.location.href =
"market.html";

});


/* =========================
BACK
========================= */

backBtn.addEventListener(
"click",
()=>{

if(
document.referrer &&
document.referrer.includes(
window.location.host
)
){

window.history.back();

}else{

window.location.href =
"home.html";

}

});


/* =========================
BOTTOM NAV
========================= */

document
.querySelectorAll("[data-go]")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

const url =
button.dataset.go;

if(!url)return;

window.location.href =
url;

});

});


/* =========================
START
========================= */

loadFavorites();

</script>
