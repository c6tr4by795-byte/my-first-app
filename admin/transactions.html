<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex,nofollow">
<title>إدارة التسليم والرسوم | MZAD PHONE</title>
<style>
:root{--p:#E91D4F;--c:#32B8C4;--bg:#f4f5f7;--card:#fff;--line:#e7e8eb;--text:#20242a;--muted:#737983;--ok:#16875d;--bad:#c92a45;--warn:#8b6400}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}main{max-width:950px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.brand{font-weight:900;font-size:20px}.brand i{color:var(--p);font-style:normal}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 14px}.logout,.refresh{background:#fff;border:1px solid var(--line)}.hero,.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:12px}.hero h1{margin:0 0 6px}.hero p,.muted{color:var(--muted);font-size:12px;line-height:1.8}.hero p{margin:0}.msg{display:none;padding:11px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);margin:12px 0;font-size:13px}.msg.on{display:block}.msg.bad{color:var(--bad)}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-weight:900}.badge{border-radius:999px;padding:6px 9px;font-size:11px;background:#eaf9fb;color:#167984}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.cell{background:#fbfaf7;border-radius:12px;padding:9px}.cell small{display:block;color:var(--muted);font-size:10px}.cell b{display:block;font-size:13px;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.ok{background:var(--ok);color:white}.neutral{background:#eef9fa;color:#176c74}.no{background:#fff;color:var(--bad);border:1px solid #efc6ce}.empty{text-align:center;padding:35px;color:var(--muted);background:#fff;border:1px dashed #d8dbe0;border-radius:16px}.fee{padding:10px 0;border-bottom:1px dashed var(--line)}.fee:last-child{border-bottom:0}.ref{width:100%;margin-top:7px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}}
</style></head>
<body><main>
<div class="top"><div><div class="brand">MZAD <i>PHONE</i></div><div class="muted">إدارة التسليم ورسوم المنصة</div></div><button class="logout" id="logout">خروج</button></div>
<section class="hero"><h1>إدارة المعاملات</h1><p>تظهر هنا المعاملات المفتوحة، ورسوم البائع والمشتري، وتأكيد الإدارة بعد التسليم الفعلي. لا تسجّل الرسوم مدفوعة إلا بعد استلامها نقداً، ولا تؤكد اكتمال التسليم إلا بعد التحقق من الجهاز والمبلغ.</p></section>
<div><button class="refresh" id="refresh">تحديث القائمة</button></div><div id="msg" class="msg"></div><div id="list" class="muted">جاري التحميل…</div>
</main>
<script type="module">
import {supabase} from "../js/supabase.js";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const money=v=>new Intl.NumberFormat("ar-IQ").format(Number(v||0))+" د.ع";
const date=v=>v?new Date(v).toLocaleString("ar-IQ"):"—";
const statuses={open:"مفتوحة",appointment_pending:"بانتظار موعد التسليم",seller_arrived:"وصل البائع",buyer_arrived:"وصل المشتري",inspection:"فحص الجهاز",payment_pending:"بانتظار تأكيد الدفع",handover_pending:"بانتظار إكمال التسليم",completed:"مكتملة",cancelled:"ملغاة",disputed:"متنازع عليها"};
function show(t,bad=false){$("msg").textContent=t;$("msg").className="msg on"+(bad?" bad":"")}
async function auth(){const s=await supabase.auth.getSession();if(!s.data.session){location.href="../index.html?next="+encodeURIComponent("admin/transactions.html");throw Error("AUTH_REQUIRED")}const a=await supabase.rpc("mzad_is_admin");if(a.error)throw a.error;if(a.data!==true){await supabase.auth.signOut();location.href="../index.html?next="+encodeURIComponent("admin/transactions.html");throw Error("ADMIN_REQUIRED")}}
async function load(){ $("list").innerHTML='<div class="empty">جاري تحميل المعاملات…</div>';try{await auth();const r=await supabase.from("mzad_transactions").select("*").order("created_at",{ascending:false}).limit(150);if(r.error)throw r.error;const all=r.data||[];if(!all.length){$("list").innerHTML='<div class="empty">لا توجد معاملات حالياً.</div>';return}
const ids=all.map(t=>t.id);const [fees,devices,points]=await Promise.all([supabase.from("mzad_transaction_fees").select("*").in("transaction_id",ids),supabase.from("mzad_devices").select("id,brand,model,storage,mzad_id").in("id",[...new Set(all.map(t=>t.device_id))]),supabase.from("mzad_handover_appointments").select("transaction_id,scheduled_at,status,handover_point_id").in("transaction_id",ids).order("created_at",{ascending:false})]);for(const x of [fees,devices,points])if(x.error)throw x.error;const fm=new Map();for(const f of fees.data||[]){if(!fm.has(f.transaction_id))fm.set(f.transaction_id,[]);fm.get(f.transaction_id).push(f)}const dm=new Map((devices.data||[]).map(d=>[d.id,d]));const pm=new Map();for(const p of points.data||[])if(!pm.has(p.transaction_id))pm.set(p.transaction_id,p);
$("list").innerHTML=all.map(t=>{const d=dm.get(t.device_id)||{},fs=fm.get(t.id)||[],p=pm.get(t.id),done=t.status==="completed"||t.status==="cancelled"||t.status==="disputed";return '<article class="item"><div class="head"><div><div class="title">'+esc([d.brand,d.model,d.storage].filter(Boolean).join(" ")||"جهاز بدون اسم")+'</div><div class="muted">رقم المعاملة: '+esc(t.transaction_number||t.id)+'</div></div><span class="badge">'+esc(statuses[t.status]||t.status)+'</span></div><div class="grid"><div class="cell"><small>نوع العملية</small><b>'+ (t.operation_type==="auction"?"مزاد":"بيع مباشر")+'</b></div><div class="cell"><small>سعر الجهاز</small><b>'+money(t.final_price_iqd)+'</b></div><div class="cell"><small>معرّف الجهاز</small><b>'+esc(d.mzad_id||"—")+'</b></div></div><div class="muted" style="margin-top:10px">موعد التسليم: '+esc(date(p?.scheduled_at))+' — '+esc(p?.status||"غير محدد")+'</div><div style="margin-top:10px"><b>رسوم المنصة</b>'+(fs.length?fs.map(f=>'<div class="fee"><div>'+ (f.payer_role==="buyer"?"المشتري":"البائع")+' — '+money(f.amount_iqd)+' — '+(f.status==="paid"?"مدفوعة":f.status==="waived"?"معفاة":f.status==="cancelled"?"ملغاة":"بانتظار الدفع")+'</div>'+(f.status==="pending"&&!done?'<input class="ref" data-ref="'+esc(t.id+":"+f.payer_role)+'" placeholder="مرجع أو ملاحظة الدفع النقدي (اختياري)"><button class="ok" style="margin-top:7px" data-fee="'+esc(t.id)+'" data-role="'+esc(f.payer_role)+'">تأكيد استلام الرسوم نقداً</button>':"")+'</div>').join(""):'<div class="muted">لا توجد سجلات رسوم لهذه المعاملة.</div>')+'</div>'+(t.status!=="completed"&&t.status!=="cancelled"&&t.status!=="disputed"?'<div class="actions"><button class="neutral" data-open="'+esc(t.id)+'">فتح تفاصيل المعاملة</button><button class="ok" data-platform="'+esc(t.id)+'">تأكيد الإدارة بعد التحقق</button></div>':'')+'</article>'}).join("");}
catch(e){console.error(e);$("list").innerHTML='<div class="empty">تعذر تحميل القائمة. '+esc(e.message||e)+'</div>'}}
$("list").addEventListener("click",async e=>{const fee=e.target.closest("[data-fee]"),platform=e.target.closest("[data-platform]"),open=e.target.closest("[data-open]");if(open){location.href="../transaction.html?id="+encodeURIComponent(open.dataset.open);return}if(!fee&&!platform)return;const b=fee||platform;if(!confirm(fee?"تأكد أن رسوم هذا الطرف استلمت فعلياً قبل التسجيل. هل تريد المتابعة؟":"لا تؤكد الإدارة إلا بعد فحص الجهاز والتحقق من استلام المبلغ وموافقة الطرفين. هل تحققت من ذلك؟"))return;b.disabled=true;try{let r;if(fee){const selector='[data-ref="'+CSS.escape(fee.dataset.fee+":"+fee.dataset.role)+'"]';const ref=$( "list").querySelector(selector)?.value.trim()||null;r=await supabase.rpc("mzad_admin_mark_transaction_fee_paid",{p_transaction_id:fee.dataset.fee,p_payer_role:fee.dataset.role,p_payment_reference:ref});}else{r=await supabase.rpc("mzad_confirm_handover",{p_transaction_id:platform.dataset.platform,p_action:"platform_confirm"});}if(r.error)throw r.error;show(fee?"تم تسجيل استلام الرسوم.":"تم تسجيل تأكيد الإدارة.");await load()}catch(err){console.error(err);show("تعذر تنفيذ الإجراء: "+(err.message||err),true);b.disabled=false}});
$("refresh").addEventListener("click",load);$("logout").addEventListener("click",async()=>{await supabase.auth.signOut();location.href="../index.html"});load();
</script></body></html>
