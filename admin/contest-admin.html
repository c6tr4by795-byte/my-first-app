<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة المسابقة | MZAD PHONE</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#8E3B46;--i:#F5E9DA;--line:rgba(142,59,70,.18);--soft:rgba(142,59,70,.08);--mute:rgba(142,59,70,.65);--ob:rgba(245,233,218,.72);--obl:rgba(245,233,218,.24)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--i);color:var(--b);font-family:'Tajawal',system-ui,sans-serif}
body{display:flex;justify-content:center}
.app{width:100%;max-width:560px;min-height:100vh;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}

.hero{background:var(--b);color:var(--i);border-radius:0 0 32px 32px;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 24px}
.bar{display:flex;align-items:center;justify-content:space-between}
.bar h1{font-size:18px;font-weight:800}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--obl);background:var(--b);color:var(--i);display:grid;place-items:center;text-decoration:none}
.live{margin-top:20px;border:1px solid var(--obl);border-radius:24px;padding:18px}
.live .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.live h2{font-size:20px;font-weight:800}
.pill{font-size:13px;font-weight:700;padding:5px 12px;border-radius:20px;border:1px solid var(--i);white-space:nowrap}
.pill.on{background:var(--i);color:var(--b)}
.clock{margin-top:16px;display:flex;align-items:flex-end;justify-content:space-between}
.clock b{font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.clock span{font-size:14px;color:var(--ob)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:20px 20px 0}
.tab{height:46px;border-radius:14px;border:1.5px solid var(--b);background:transparent;color:var(--b);font-size:15px;font-weight:700;transition:background .15s,color .15s}
.tab[aria-selected=true]{background:var(--b);color:var(--i)}
.panel{display:none;padding:18px 20px 0}
.panel.show{display:block}

.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb{height:56px;border-radius:18px;border:1.5px solid var(--b);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;transition:transform .15s,opacity .15s}
.cb:active:not(:disabled){transform:scale(.97)}
.cb.fill{background:var(--b);color:var(--i)}
.cb.line{background:transparent;color:var(--b)}
.cb:disabled{opacity:.3;cursor:not-allowed}

.card{border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}
.card h3{font-size:17px;font-weight:800;margin-bottom:12px}
.rd{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--soft)}
.rd+.rd{margin-top:8px}
.rd b{font-size:15px}.rd small{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.rd .s{font-size:13px;font-weight:700}
.rd.cur{background:var(--b);color:var(--i)}.rd.cur small{color:var(--ob)}
.res{background:var(--b);color:var(--i);border-radius:22px;padding:18px;margin-top:14px;display:none}
.res.show{display:block}
.res small{color:var(--ob);font-size:13px}.res h3{font-size:22px;margin:2px 0 12px}
.res ul{list-style:none;display:grid;gap:8px}
.res li{padding:10px 14px;border-radius:14px;border:1px solid var(--obl);font-weight:700;font-size:15px}

label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
label:first-of-type{margin-top:0}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--i);color:var(--b);font-family:inherit;font-size:16px;padding:12px 14px}
input:focus,textarea:focus{outline:none;border-color:var(--b)}
textarea{resize:none;height:84px;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.three label{font-size:13px;font-weight:500;color:var(--mute);margin-top:0}
.note{font-size:13px;color:var(--mute);line-height:1.7;margin-top:12px}
.end{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--soft);font-size:14px}
.end b{font-size:15px}
.save{margin-top:16px;width:100%;height:56px;border-radius:18px;border:0;background:var(--b);color:var(--i);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.save:active{transform:scale(.97)}

.pr{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.pr+.pr{margin-top:10px}
.seat{width:40px;height:40px;border-radius:50%;background:var(--b);color:var(--i);display:grid;place-items:center;font-weight:800}
.pr b{font-size:16px}.pr small{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.rm{width:42px;height:42px;border-radius:14px;border:1.5px solid var(--b);background:transparent;color:var(--b);display:grid;place-items:center}
.cnt{font-size:14px;color:var(--mute);margin-bottom:12px}

.modal{position:fixed;inset:0;background:rgba(142,59,70,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.show{display:flex}
.sheet{width:100%;max-width:560px;background:var(--i);border-radius:28px 28px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:20px;font-weight:800}
.sheet p{font-size:15px;color:var(--mute);line-height:1.7;margin-top:8px}
.sheet .two{margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--b);color:var(--i);padding:12px 20px;border-radius:16px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="bar">
      <a class="ib" href="contests.html" aria-label="رجوع"><i data-i="back"></i></a>
      <h1>إدارة المسابقة</h1>
      <span style="width:42px"></span>
    </div>
    <section class="live">
      <div class="top"><h2 id="cname"></h2><span class="pill" id="pill"></span></div>
      <div class="clock"><b id="clock">00:00</b><span id="rlabel"></span></div>
    </section>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-p="p1" aria-selected="true">التحكم</button>
    <button class="tab" role="tab" data-p="p2" aria-selected="false">التفاصيل والوقت</button>
    <button class="tab" role="tab" data-p="p3" aria-selected="false">المتسابقون</button>
  </div>

  <!-- التحكم -->
  <section class="panel show" id="p1">
    <div class="ctrl">
      <button class="cb fill" id="bStart"></button>
      <button class="cb line" id="bPause"><i data-i="pause"></i>إيقاف مؤقت</button>
      <button class="cb line" id="bNext"><i data-i="next"></i>الجولة التالية</button>
      <button class="cb fill" id="bEnd"><i data-i="stop"></i>إنهاء المسابقة</button>
    </div>
    <div class="card"><h3>الجولات</h3><div id="rounds"></div></div>
    <div class="res" id="res">
      <small>الفائز بالجائزة الكبرى</small><h3 id="winner"></h3>
      <small>الداعمون الفائزون (سحب تلقائي)</small>
      <ul id="lucky" style="margin-top:8px"></ul>
    </div>
  </section>

  <!-- التفاصيل والوقت -->
  <section class="panel" id="p2">
    <div class="card" style="margin-top:0">
      <h3>تفاصيل المسابقة</h3>
      <label for="fName">اسم المسابقة</label><input id="fName">
      <label for="fDesc">الوصف</label><textarea id="fDesc"></textarea>
      <label for="fPrize">الجائزة الكبرى</label><input id="fPrize">
      <div class="two">
        <div><label for="fSeats">عدد المقاعد</label><input id="fSeats" type="number" min="2" inputmode="numeric"></div>
        <div><label for="fLucky">عدد الداعمين الفائزين</label><input id="fLucky" type="number" min="1" inputmode="numeric"></div>
      </div>
    </div>
    <div class="card">
      <h3>الوقت</h3>
      <label for="fStart">موعد البدء</label><input id="fStart" type="datetime-local">
      <label style="margin-top:14px">مدة كل جولة بالدقائق</label>
      <div class="three">
        <div><label for="d0">الجولة 1</label><input id="d0" type="number" min="1" inputmode="numeric"></div>
        <div><label for="d1">الجولة 2</label><input id="d1" type="number" min="1" inputmode="numeric"></div>
        <div><label for="d2">النهائي</label><input id="d2" type="number" min="1" inputmode="numeric"></div>
      </div>
      <div class="end"><span>الانتهاء المتوقع</span><b id="endAt"></b></div>
      <p class="note">إذا غيّرت المدة والمسابقة جارية، التغيير يطبق على الجولات القادمة فقط.</p>
    </div>
    <button class="save" id="save"><i data-i="save"></i>حفظ التعديلات</button>
  </section>

  <!-- المتسابقون -->
  <section class="panel" id="p3">
    <div class="cnt" id="cnt"></div>
    <div id="plist"></div>
  </section>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <h3 id="mT"></h3><p id="mP"></p>
    <div class="two"><button class="cb line" id="mNo">تراجع</button><button class="cb fill" id="mYes">تأكيد</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import {supabase} from '../js/supabase.js';
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const localInput=v=>{const d=new Date(v);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
const toIso=v=>new Date(v).toISOString();
let contest=null,rounds=[],entries=[],busy=false,clockTimer=null;
const labels={draft:'مسودة',scheduled:'مجدولة',active:'جارية',paused:'متوقفة مؤقتاً',ended:'انتهت',completed:'مكتملة',cancelled:'ملغاة'};
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function ask(title,text,yes){$('mT').textContent=title;$('mP').textContent=text;$('modal').classList.add('show');$('mYes').onclick=()=>{$('modal').classList.remove('show');yes()}}
$('mNo').onclick=()=>$('modal').classList.remove('show');
function render(){
 if(!contest){$('cname').textContent='لا توجد مسابقة';$('pill').textContent='—';$('clock').textContent='—';return}
 $('cname').textContent=contest.title_ar||'المسابقة';$('pill').textContent=labels[contest.status]||contest.status;$('pill').className='pill'+(contest.status==='active'?' on':'');
 const r=rounds.find(x=>x.round_no===contest.current_round_no)||rounds[0];
 $('rlabel').textContent=r?'الجولة '+r.round_no+' من '+rounds.length:'لا توجد جولات';
 $('rounds').replaceChildren();
 rounds.forEach((x)=>{const d=document.createElement('div');d.className='rd'+(x.round_no===contest.current_round_no?' cur':'');const left=document.createElement('div');const b=document.createElement('b');b.textContent='الجولة '+x.round_no;const sm=document.createElement('small');sm.textContent=Math.max(1,Math.round((new Date(x.ends_at)-new Date(x.starts_at))/60000))+' دقيقة · يتأهل '+x.qualifiers_count;left.append(b,sm);const st=document.createElement('span');st.className='s';st.textContent=x.round_no<contest.current_round_no?'انتهت':x.round_no===contest.current_round_no?(contest.status==='paused'?'متوقفة':contest.status==='active'?'جارية':'قادمة'):'لاحقاً';d.append(left,st);$('rounds').append(d)});
 $('cnt').textContent=entries.length+' متسابق'+(contest.max_entries?' من '+contest.max_entries+' مقعد':'');
 $('plist').replaceChildren();
 entries.forEach((p,n)=>{const row=document.createElement('div');row.className='pr';const seat=document.createElement('div');seat.className='seat';seat.textContent=String(n+1);const info=document.createElement('div');const name=document.createElement('b');name.textContent=p.name||'مشارك';const small=document.createElement('small');small.textContent=p.status==='winner'?'الفائز':p.status==='disqualified'?'غير متأهل':'مشاركة مسجلة';info.append(name,small);row.append(seat,info);$('plist').append(row)});
 $('bStart').disabled=!['draft','scheduled'].includes(contest.status);
 $('bStart').innerHTML=ic('play')+'بدء المسابقة';
 $('bPause').disabled=contest.status!=='active';$('bNext').disabled=!['active','paused'].includes(contest.status)||contest.current_round_no>=rounds.length;
 $('bEnd').disabled=!['active','paused','scheduled','draft'].includes(contest.status);
}
const P={play:'<path d="M7 5l11 7-11 7z"/>',pause:'<path d="M8 5v14M16 5v14"/>',next:'<path d="M5 5l9 7-9 7zM19 5v14"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>'};
const ic=n=>'<svg class="ic" viewBox="0 0 24 24">'+(P[n]||'')+'</svg>';
async function load(){
 const {data:cs,error}=await supabase.from('mzad_contests').select('*').order('created_at',{ascending:false}).limit(1);
 if(error)throw error;contest=cs?.[0]||null;
 if(!contest){render();toast('لا توجد مسابقة حالياً.');return}
 const [{data:rs,error:re},{data:es,error:ee}]=await Promise.all([
  supabase.from('mzad_contest_rounds').select('*').eq('contest_id',contest.id).order('round_no'),
  supabase.from('mzad_contest_entries').select('id,user_id,status,joined_at,answer_text').eq('contest_id',contest.id).order('joined_at')
 ]);
 if(re)throw re;if(ee)throw ee;rounds=rs||[];
 const {data:home}=await supabase.rpc('mzad_get_contest_home');
 const board=home?.board||[];
 entries=(es||[]).map(e=>({...e,name:board.find(x=>x.id===e.id)?.name||'مشارك'}));
 $('fName').value=contest.title_ar||'';$('fDesc').value=contest.short_description||contest.description_ar||'';
 $('fPrize').value=contest.prize_title||contest.prize_description||'';
 $('fSeats').value=contest.max_entries||'';
 $('fLucky').value=3;$('fStart').value=localInput(contest.starts_at);
 [0,1,2].forEach(i=>{const r=rounds[i];$('d'+i).value=r?Math.max(1,Math.round((new Date(r.ends_at)-new Date(r.starts_at))/60000)):10});
 calcEnd();render();clock();
}
function clock(){clearInterval(clockTimer);const tick=()=>{const r=rounds.find(x=>x.round_no===contest?.current_round_no);if(!r){$('clock').textContent='—';return}const end=new Date(r.ends_at).getTime();$('clock').textContent=contest.status==='paused'?'متوقف':fmt((end-Date.now())/1000)};tick();clockTimer=setInterval(tick,1000)}
async function control(action){
 if(busy)return;busy=true;try{const {data,error}=await supabase.rpc('mzad_admin_contest_control',{p_contest_id:contest.id,p_action:action});if(error)throw error;await load();toast('تم تنفيذ الأمر وحفظه في قاعدة البيانات.')}catch(e){toast(e.message||'تعذر تنفيذ الأمر.')}finally{busy=false}
}
$('bStart').onclick=()=>ask('بدء المسابقة','سيبدأ توقيت الجولة الأولى من وقت التنفيذ.',()=>control('start'));
$('bPause').onclick=()=>ask('إيقاف مؤقت','سيتم إيقاف الدعم وتجميد توقيت الجولات.',()=>control('pause'));
$('bNext').onclick=()=>ask('الانتقال للجولة التالية','سيتم اعتماد ترتيب الجولة الحالية وفق مدة الدعم المسجلة ثم فتح الجولة التالية.',()=>control('next'));
$('bEnd').onclick=()=>ask('إنهاء المسابقة','سيتم إغلاق جلسات الدعم وإنهاء المسابقة. هذا لا يعلن فائزاً تلقائياً.',()=>control('end'));
function calcEnd(){const start=new Date($('fStart').value);const total=[0,1,2].reduce((a,i)=>a+(+$('d'+i).value||0),0);$('endAt').textContent=isNaN(start)?'—':new Intl.DateTimeFormat('ar-IQ',{dateStyle:'medium',timeStyle:'short'}).format(new Date(start.getTime()+total*60000))}
['fStart','d0','d1','d2'].forEach(id=>$(id).addEventListener('input',calcEnd));
$('save').onclick=async()=>{
 if(busy||!contest)return;
 const durations=[0,1,2].map(i=>+$('d'+i).value).filter(v=>v>0);
 if(!$('fName').value.trim()||!durations.length||durations.some(v=>v<1)){toast('تحقق من العنوان ومدد الجولات.');return}
 if(entries.length&&contest.status!=='draft'){toast('هذه المسابقة تحتوي مشاركين؛ لا يمكن تغيير أوقاتها أو تقسيم جولاتها بعد التسجيل.');return}
 busy=true;$('save').disabled=true;
 try{
  const {error}=await supabase.rpc('mzad_admin_save_contest_v2',{
   p_contest_id:contest.id,p_title_ar:$('fName').value.trim(),p_short_description:$('fDesc').value.trim(),
   p_description_ar:$('fDesc').value.trim(),p_prize_title:$('fPrize').value.trim(),p_prize_description:null,
   p_starts_at:toIso($('fStart').value),p_max_entries:$('fSeats').value?Number($('fSeats').value):null,
   p_contest_type:contest.contest_type||'challenge',p_status:contest.status==='draft'?'draft':'scheduled',
   p_round_minutes:durations,p_round_qualifiers:durations.map((_,i)=>i===durations.length-1?1:Math.max(1,Math.ceil((Number($('fSeats').value)||10)/(i+2))))
  });
  if(error)throw error;await load();toast('تم حفظ إعدادات المسابقة والجولات.');
 }catch(e){toast(e.message||'تعذر حفظ الإعدادات.')}finally{busy=false;$('save').disabled=false}
};
$('tabs').onclick=e=>{const t=e.target.closest('.tab');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('show',p.id===t.dataset.p))};
load().catch(e=>toast(e.message||'تعذر تحميل لوحة الإدارة.'));
</script>
</body>
</html>
