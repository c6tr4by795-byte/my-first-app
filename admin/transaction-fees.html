<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6246d9"><title>رسوم المعاملات — MZAD PHONE</title>
<style>
:root{--bg:#f9f8fd;--ink:#17202a;--muted:#6b7280;--edge:#e4defa;--p:#6246d9;--ps:#f3f0ff;--ok:#1e8a5a;--oks:#e8f6ef;--bad:#c62f4d;--bads:#fff0f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.page{width:min(100%,560px);margin:auto;padding:0 14px 34px}.head{position:sticky;top:0;background:linear-gradient(145deg,#fff,#ece8ff);padding:14px 0;border-bottom:1px solid var(--edge);z-index:5}.top{display:flex;justify-content:space-between;align-items:center}.brand{text-align:center}.brand b{font-size:15px}.brand small{display:block;font-size:10px;color:var(--p);margin-top:3px;font-weight:800}.ib{width:40px;height:38px;border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--p);font-size:18px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;padding:4px;background:#fff;border:1px solid var(--edge);border-radius:14px}.tab{padding:10px 4px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:900}.tab.on{background:var(--p);color:#fff}.list{display:grid;gap:11px;margin-top:14px}.card{padding:14px;border-radius:18px;background:#fff;border:1px solid var(--edge);box-shadow:0 8px 22px -17px #6246d9}.title{font-size:14px;font-weight:950}.sub{font-size:11px;color:var(--muted);line-height:1.8;margin-top:4px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--edge);font-size:12px}.row:last-child{border:0}.row span{color:var(--muted)}.row b{text-align:left;overflow-wrap:anywhere}.amount{color:var(--p);font-size:15px}.pill{padding:4px 9px;border-radius:99px;background:var(--ps);color:var(--p);font-size:10px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{padding:11px 8px;border:0;border-radius:12px;font-weight:900;font-size:12px}.btn.main{background:var(--ok);color:#fff}.btn.alt{background:var(--ps);color:var(--p)}.btn:disabled{opacity:.5}.empty,.error{padding:28px 15px;text-align:center;background:#fff;border:1px dashed var(--edge);border-radius:18px;color:var(--muted);font-size:12px;line-height:1.8}.error{color:var(--bad)}.note{width:100%;margin-top:10px;padding:10px;border:1px solid var(--edge);border-radius:10px;font:inherit;font-size:12px}
</style></head><body><main class="page"><header class="head"><div class="top"><button class="ib" id="back" aria-label="رجوع">›</button><div class="brand"><b>MZAD PHONE</b><small>الإدارة — رسوم المعاملات</small></div><button class="ib" id="reload" aria-label="تحديث">↻</button></div><div class="tabs"><button class="tab on" data-tab="pending">بانتظار التسجيل <span id="n1">0</span></button><button class="tab" data-tab="paid">مدفوعة <span id="n2">0</span></button></div></header><section class="list" id="list"><div class="empty">جاري تحميل الرسوم…</div></section></main>
<script type="module">
import {supabase} from "../js/supabase.js";
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>Number(v||0).toLocaleString("en-US")+" د.ع";let tab="pending",busy=false,rows=[];
const must=r=>{if(r.error)throw r.error;return r.data};
async function load(){
 $("list").innerHTML='<div class="empty">جاري تحميل الرسوم…</div>';
 const u=must(await supabase.auth.getUser());if(!u.user){location.href="../index.html?login=1&returnTo="+encodeURIComponent(location.pathname);return}
 const admin=must(await supabase.rpc("mzad_is_admin"));if(admin!==true){$("list").innerHTML='<div class="error">هذه الصفحة مخصصة للإدارة فقط.</div>';return}
 const fees=must(await supabase.from("mzad_transaction_fees").select("id,transaction_id,payer_role,amount_iqd,status,paid_at,payment_reference,created_at").in("status",["pending","paid"]).order("created_at",{ascending:false}).limit(300));
 const ids=[...new Set(fees.map(x=>x.transaction_id))];
 const tx=ids.length?must(await supabase.from("mzad_transactions").select("id,transaction_number,operation_type,device_id,seller_user_id,buyer_user_id,final_price_iqd,status").in("id",ids)):[];
 const tids=[...new Set(tx.map(x=>x.device_id).filter(Boolean))];
 const dev=tids.length?must(await supabase.from("mzad_devices").select("id,brand,model,storage").in("id",tids)):[];
 const tm=new Map(tx.map(x=>[x.id,x])),dm=new Map(dev.map(x=>[x.id,[x.brand,x.model,x.storage].filter(Boolean).join(" ")]));
 rows=fees.map(f=>({f,t:tm.get(f.transaction_id),device:dm.get(tm.get(f.transaction_id)?.device_id)||"جهاز"}));
 render();
}
function render(){
 const pending=rows.filter(x=>x.f.status==="pending"),paid=rows.filter(x=>x.f.status==="paid");
 $("n1").textContent=pending.length;$("n2").textContent=paid.length;
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
 const list=tab==="pending"?pending:paid;
 $("list").innerHTML=list.length?list.map(x=>{
 const f=x.f,t=x.t||{},isBuyer=f.payer_role==="buyer";
 return '<article class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><div><div class="title">'+esc(x.device)+'</div><div class="sub">'+esc(t.transaction_number||f.transaction_id)+' • '+(isBuyer?"رسوم المشتري":"رسوم البائع")+'</div></div><span class="pill">'+(f.status==="paid"?"مدفوعة":"بانتظار الدفع")+'</span></div><div style="margin-top:8px"><div class="row"><span>مبلغ الرسوم</span><b class="amount">'+esc(money(f.amount_iqd))+'</b></div><div class="row"><span>نوع المعاملة</span><b>'+ (t.operation_type==="auction"?"مزاد":"بيع مباشر")+'</b></div><div class="row"><span>حالة المعاملة</span><b>'+esc(t.status||"—")+'</b></div><div class="row"><span>مرجع الدفع</span><b>'+esc(f.payment_reference||"—")+'</b></div></div>'+(f.status==="pending"?'<input class="note" data-ref="'+esc(f.id)+'" placeholder="مرجع الإيصال أو ملاحظة (اختياري)"><button class="btn main" style="width:100%;margin-top:9px" data-pay="'+esc(f.transaction_id)+'" data-role="'+esc(f.payer_role)+'">تأكيد استلام الرسوم نقداً</button>':'<div class="sub">تاريخ التسجيل: '+esc(f.paid_at?new Date(f.paid_at).toLocaleString("ar-IQ"):"—")+'</div>')+'</article>';
 }).join(""):'<div class="empty">'+(tab==="pending"?"ماكو رسوم تنتظر التسجيل حالياً.":"ماكو رسوم مدفوعة مسجلة حالياً.")+'</div>';
}
$("list").addEventListener("click",async e=>{
 const b=e.target.closest("[data-pay]");if(!b||busy)return;
 const note=document.querySelector('[data-ref="'+CSS.escape(rows.find(x=>x.f.transaction_id===b.dataset.pay&&x.f.payer_role===b.dataset.role)?.f.id||"")+'"]')?.value.trim()||null;
 if(!confirm("تأكدت فعلياً من استلام مبلغ "+(b.dataset.role==="buyer"?"المشتري":"البائع")+" نقداً؟ لن يتم تسجيله مدفوعاً إلا بعد تأكيدك."))return;
 busy=true;b.disabled=true;
 try{must(await supabase.rpc("mzad_admin_mark_transaction_fee_paid",{p_transaction_id:b.dataset.pay,p_payer_role:b.dataset.role,p_payment_reference:note}));await load();alert("تم تسجيل الرسوم بعد تأكيد الاستلام.");}
 catch(err){console.error(err);alert("فشل تسجيل الرسوم: "+(err.message||err));b.disabled=false}
 finally{busy=false}
});
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;render()}});
$("reload").addEventListener("click",()=>load().catch(e=>{$("list").innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}));
$("back").addEventListener("click",()=>history.length>1?history.back():location.href="../profile.html");
load().catch(e=>{$("list").innerHTML='<div class="error">'+esc(e.message||e)+'</div>';console.error(e)});
</script></body></html>
