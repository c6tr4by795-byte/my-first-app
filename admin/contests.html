<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>إدارة المسابقات | MZAD</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--p:#247b83;--bg:#f4f5f8;--ink:#202735;--muted:#747d8c;--line:#e4e7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;padding:env(safe-area-inset-top) 15px 30px}main{max-width:540px;margin:auto}header{height:60px;display:flex;align-items:center;gap:12px}header a{font-size:25px;color:var(--p)}h1{font-size:19px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0}.field{display:block;margin:13px 0;font-size:13px;font-weight:700}input,textarea,select{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--p);color:white;font:inherit;font-weight:700;margin-top:10px}.btn.alt{background:#edf3f4;color:#246d74}.btn:disabled{opacity:.5}.muted{font-size:12px;color:var(--muted);line-height:1.8}.item{padding:13px 0;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.pill{font-size:11px;padding:4px 9px;border-radius:20px;background:#edf3f4;color:#246d74}.msg{font-size:13px;line-height:1.8;color:#b44855}
</style></head><body><main><header><a href="dashboard.html">‹</a><h1>إدارة المسابقات</h1></header><section class="card"><h2 id="formTitle">إنشاء مسابقة</h2><input id="contestId" type="hidden"><label class="field">عنوان المسابقة<input id="title" maxlength="180" required></label><label class="field">وصف مختصر<input id="short" maxlength="250"></label><label class="field">تفاصيل المسابقة<textarea id="description" rows="3"></textarea></label><label class="field">الجائزة<input id="prize"></label><label class="field">تفاصيل الجائزة<textarea id="prizeDesc" rows="2"></textarea></label><label class="field">تبدأ بتاريخ ووقت<input id="start" type="datetime-local" required></label><label class="field">تنتهي بتاريخ ووقت<input id="end" type="datetime-local" required></label><label class="field">الحد الأعلى للمشاركين (اختياري)<input id="max" type="number" min="1" placeholder="اتركه فارغاً بدون حد"></label><label class="field">حالة المسابقة<select id="status"><option value="draft">مسودة</option><option value="scheduled">مجدولة</option><option value="active">نشطة</option><option value="cancelled">ملغاة</option></select></label><p class="muted">ماكو جولات. كل حساب يشارك مرة واحدة. الدعم مستمر أثناء الضغط، والترتيب حسب الداعمين الموجودين فعلياً.</p><button class="btn" id="save">حفظ المسابقة</button><button class="btn alt" id="reset">مسابقة جديدة</button><p class="msg" id="msg"></p></section><h2>المسابقات المسجلة</h2><div class="card" id="list">جاري التحميل…</div></main>
<script type="module">
import{supabase}from"../js/supabase.js";const $=id=>document.getElementById(id),names={draft:"مسودة",scheduled:"مجدولة",active:"نشطة",cancelled:"ملغاة",ended:"منتهية",completed:"مكتملة"};let records=[];
async function gate(){const s=await supabase.auth.getSession();if(!s.data.session){location.href="../admin-login.html";throw Error("سجل الدخول أولاً")}const a=await supabase.rpc("mzad_has_permission",{permission_code:"contests.manage"});if(a.error||a.data!==true){location.href="../admin/dashboard.html";throw Error("ما عندك صلاحية إدارة المسابقات")}}
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function reset(){$("contestId").value="";["title","short","description","prize","prizeDesc","start","end","max"].forEach(x=>$(x).value="");$("status").value="draft";$("formTitle").textContent="إنشاء مسابقة"}
const toIso=v=>new Date(v).toISOString(),local=v=>{const d=new Date(v);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
$("reset").onclick=reset;
$("save").onclick=async()=>{const b=$("save");try{b.disabled=true;const st=$("start").value,en=$("end").value;if(!st||!en)throw Error("حدد وقت البداية والنهاية");if(new Date(en)<=new Date(st))throw Error("وقت النهاية لازم يكون بعد البداية");const r=await supabase.rpc("mzad_admin_save_contest",{p_contest_id:$("contestId").value||null,p_title_ar:$("title").value.trim(),p_short_description:$("short").value.trim(),p_description_ar:$("description").value.trim(),p_prize_title:$("prize").value.trim(),p_prize_description:$("prizeDesc").value.trim(),p_starts_at:toIso(st),p_ends_at:toIso(en),p_max_entries:$("max").value?Number($("max").value):null,p_contest_type:"challenge",p_status:$("status").value});if(r.error)throw r.error;$("msg").textContent="تم حفظ المسابقة.";reset();await load()}catch(e){$("msg").textContent=e.message||String(e)}finally{b.disabled=false}};
async function load(){const r=await supabase.from("mzad_contests").select("id,title_ar,prize_title,status,starts_at,ends_at,max_entries,short_description,description_ar,prize_description").order("created_at",{ascending:false});if(r.error)throw r.error;records=r.data||[];$("list").innerHTML=records.length?records.map(c=>'<article class="item"><div class="row"><b>'+safe(c.title_ar)+'</b><span class="pill">'+(names[c.status]||c.status)+'</span></div><p class="muted">'+safe(c.prize_title||"بدون جائزة")+' · '+new Date(c.starts_at).toLocaleString("ar-IQ")+'</p><div class="row"><button class="btn alt" data-edit="'+c.id+'" style="flex:1">تعديل</button>'+(["active","scheduled"].includes(c.status)?'<button class="btn" data-end="'+c.id+'" style="flex:1;background:#9b4651">إنهاء المسابقة</button>':"")+'</div><p class="muted">النهاية: '+new Date(c.ends_at).toLocaleString("ar-IQ")+'</p></article>').join(""):"لا توجد مسابقات مسجلة.";
$("list").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const c=records.find(x=>x.id===b.dataset.edit);$("contestId").value=c.id;$("title").value=c.title_ar;$("short").value=c.short_description||"";$("description").value=c.description_ar||"";$("prize").value=c.prize_title||"";$("prizeDesc").value=c.prize_description||"";$("start").value=local(c.starts_at);$("end").value=local(c.ends_at);$("max").value=c.max_entries||"";$("status").value=c.status;$("formTitle").textContent="تعديل المسابقة";scrollTo({top:0,behavior:"smooth"})});
$("list").querySelectorAll("[data-end]").forEach(b=>b.onclick=async()=>{if(!confirm("تأكيد إنهاء المسابقة؟ راح يتوقف الدعم المباشر."))return;b.disabled=true;try{const x=await supabase.rpc("mzad_admin_end_contest",{p_contest_id:b.dataset.end});if(x.error)throw x.error;await load()}catch(e){alert(e.message||String(e));b.disabled=false}});
}
gate().then(load).catch(e=>$("msg").textContent=e.message||String(e));
</script></body></html>
