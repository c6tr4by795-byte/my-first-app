<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>إدارة المسابقات | MZAD</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--p:#6246d9;--bg:#f8f7fc;--ink:#211d32;--muted:#777187;--line:#eae7f2;--ok:#16865b;--bad:#c64b5c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 15px calc(24px + env(safe-area-inset-bottom));}
main{max-width:520px;margin:auto}header{display:flex;align-items:center;gap:12px;padding:15px 0}header a{font-size:24px;color:var(--p)}h1{font-size:21px;margin:0}p{color:var(--muted);line-height:1.8}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.field{display:block;margin:13px 0;font-weight:700;font-size:13px}input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit;margin-top:7px}.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--p);color:#fff;font:inherit;font-weight:700;margin-top:12px}.btn:disabled{opacity:.5}.muted{color:var(--muted);font-size:12px}.error{color:var(--bad);white-space:pre-wrap}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{padding:5px 10px;border-radius:20px;background:#f0edfc;color:var(--p);font-size:12px}
</style><style>textarea{min-height:75px} .btn.secondary{background:#eeeafb;color:#4932b4}</style></head><body><main><header><a href="dashboard.html">‹</a><h1>إدارة المسابقات</h1></header><section class="card"><h2 id="formTitle">إنشاء مسابقة</h2><input id="contestId" type="hidden"><label class="field">عنوان المسابقة<input id="title" maxlength="180"></label><label class="field">وصف مختصر<input id="short"></label><label class="field">تفاصيل المسابقة<textarea id="description"></textarea></label><label class="field">الجائزة<input id="prize"></label><label class="field">تفاصيل الجائزة<textarea id="prizeDesc"></textarea></label><label class="field">نوع المسابقة<select id="type"><option value="challenge">منافسة دعم الأجهزة والجولات</option></select></label><label class="field">تبدأ<input id="start" type="datetime-local"></label><label class="field">تنتهي<input id="end" type="datetime-local"></label><label class="field">عدد المقاعد (اتركه فارغاً بلا حد)<input id="max" type="number" min="1"></label><div class="card" style="margin:12px 0;padding:13px;background:#faf9fd"><b>تسلسل الجولات المعتمد</b><p class="muted" style="margin:6px 0 0">1. التصفية: يتأهل أفضل 5 مشاركين.<br>2. نصف النهائي: يتأهل أفضل 3 من المتأهلين.<br>3. النهائي: يتنافس 3 على الجائزة، ويُعلن فائز واحد.</p></div><label class="field">الحالة<select id="status"><option value="draft">مسودة</option><option value="scheduled">مجدولة</option><option value="active">نشطة</option><option value="cancelled">ملغاة</option></select></label><button class="btn" id="save">حفظ المسابقة</button><button class="btn secondary" id="reset">مسابقة جديدة</button><p id="msg"></p></section><h2>المسابقات المسجلة</h2><div id="list" class="card">جاري التحميل…</div></main><script type="module">
import {supabase} from "../js/supabase.js";
const $=id=>document.getElementById(id),msg=t=>$("msg").textContent=t,isoLocal=v=>{const d=new Date(v);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)},toIso=v=>new Date(v).toISOString();
async function gate(){const s=await supabase.auth.getSession();if(!s.data.session){location.href="../admin-login.html";throw Error("AUTH_REQUIRED");}const a=await supabase.rpc("mzad_has_permission",{permission_code:"contests.manage"});if(a.error||a.data!==true){location.href="../admin/dashboard.html";throw Error("لا تملك صلاحية إدارة المسابقات");}}
function reset(){["contestId","title","short","description","prize","prizeDesc","start","end","max"].forEach(x=>$(x).value="");$("status").value="draft";$("type").value="challenge";$("formTitle").textContent="إنشاء مسابقة";}
$("reset").onclick=reset;
$("save").onclick=async()=>{try{$("save").disabled=true;const start=$("start").value,end=$("end").value;if(!start||!end)throw Error("حدد وقت البداية والنهاية");const r=await supabase.rpc("mzad_admin_save_contest",{p_contest_id:$("contestId").value||null,p_title_ar:$("title").value,p_short_description:$("short").value,p_description_ar:$("description").value,p_prize_title:$("prize").value,p_prize_description:$("prizeDesc").value,p_starts_at:toIso(start),p_ends_at:toIso(end),p_max_entries:$("max").value?Number($("max").value):null,p_contest_type:$("type").value,p_status:$("status").value});if(r.error)throw r.error;msg("تم حفظ المسابقة.");reset();await load();}catch(e){msg(e.message||String(e));}finally{$("save").disabled=false;}};
async function load(){const r=await supabase.from("mzad_contests").select("*").order("created_at",{ascending:false});if(r.error)throw r.error;$("list").innerHTML=(r.data||[]).map(c=>'<article class="item"><div class="row"><b>'+c.title_ar+'</b><span class="pill">'+({draft:"مسودة",scheduled:"مجدولة",active:"نشطة",cancelled:"ملغاة",ended:"منتهية",completed:"مكتملة"}[c.status]||c.status)+'</span></div><p>'+(c.prize_title||"الجائزة غير محددة")+' · '+new Date(c.starts_at).toLocaleString("ar-IQ")+'</p><div class="row"><button class="btn secondary" data-edit="'+c.id+'">تعديل</button></div><p class="muted">حسم النتائج بعد انتهاء وقت كل جولة:</p><div class="row" style="gap:7px"><button class="btn secondary" style="width:auto;flex:1;padding:10px 4px;font-size:12px" data-final="'+c.id+'" data-round="1">حسم التصفية</button><button class="btn secondary" style="width:auto;flex:1;padding:10px 4px;font-size:12px" data-final="'+c.id+'" data-round="2">حسم النصف النهائي</button><button class="btn secondary" style="width:auto;flex:1;padding:10px 4px;font-size:12px" data-final="'+c.id+'" data-round="3">حسم النهائي</button></div></article>').join("")||"لا توجد مسابقات بعد.";
 $("list").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const c=r.data.find(x=>x.id===b.dataset.edit);$("contestId").value=c.id;$("title").value=c.title_ar;$("short").value=c.short_description||"";$("description").value=c.description_ar||"";$("prize").value=c.prize_title||"";$("prizeDesc").value=c.prize_description||"";$("type").value=c.contest_type;$("start").value=isoLocal(c.starts_at);$("end").value=isoLocal(c.ends_at);$("max").value=c.max_entries||"";$("status").value=c.status;$("formTitle").textContent="تعديل المسابقة";scrollTo({top:0,behavior:"smooth"});});
 $("list").querySelectorAll("[data-final]").forEach(b=>b.onclick=async()=>{const n=Number(b.dataset.round);const names=["التصفية","نصف النهائي","النهائي"];if(!confirm("تأكيد حسم "+names[n-1]+"؟ سيتم اعتماد المتأهلين حسب عدد الدعم."))return;b.disabled=true;try{const v=await supabase.rpc("mzad_admin_finalize_contest_round",{p_contest_id:b.dataset.final,p_round_no:n});if(v.error)throw v.error;alert(n===3?"تم إعلان الفائز وإكمال المسابقة.":"تم حسم الجولة. المتأهلون: "+(v.data?.remaining??"—"));await load();}catch(e){alert(e.message||String(e));b.disabled=false;}});
}
gate().then(load).catch(e=>msg(e.message||String(e)));
</script></body></html>
