<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6246d9">
<title>طلبات الشراء المباشر — MZAD ADMIN</title>
<style>
:root{--bg:#f7f6fc;--ink:#202033;--muted:#77778a;--line:#e9e5f5;--p:#6246d9;--soft:#f1edff;--ok:#168451;--bad:#bd3852;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:calc(28px + var(--sb))}
.wrap{width:min(100%,650px);margin:auto;padding:14px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.back,.refresh{border:0;border-radius:12px;background:var(--soft);color:var(--p);padding:10px 13px;font-weight:900}
h1{font-size:16px;margin:0;font-weight:950}.sub{font-size:10px;color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{display:block;font-size:18px;margin-top:4px}
.search{width:100%;height:46px;border:1px solid var(--line);border-radius:13px;padding:0 13px;background:#fff;font:inherit;outline:none}
.filters{display:flex;gap:7px;overflow:auto;padding:11px 0;scrollbar-width:none}.filters button{white-space:nowrap;border:1px solid var(--line);border-radius:99px;background:#fff;padding:9px 13px;color:var(--muted);font-size:11px;font-weight:900}.filters button.on{background:var(--soft);border-color:var(--p);color:var(--p)}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;margin:10px 0;box-shadow:0 8px 22px -18px #6246d9}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.code{direction:ltr;color:var(--p);font-size:11px;font-weight:950}.badge{padding:5px 8px;border-radius:99px;background:var(--soft);color:var(--p);font-size:10px;font-weight:900}
.name{font-size:14px;font-weight:950;margin:10px 0 4px}.meta{font-size:11px;line-height:1.9;color:var(--muted)}.price{font-size:15px;font-weight:950;color:#4b3bb0;margin-top:8px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1;min-width:110px;border:1px solid var(--line);border-radius:11px;padding:10px 8px;background:var(--soft);color:var(--p);font-size:11px;font-weight:900}
.actions .danger{background:#fff0f2;color:var(--bad);border-color:#f3cbd4}
.empty{padding:35px 14px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--muted);font-size:12px;line-height:2}
.modal-bg{position:fixed;inset:0;z-index:20;background:#17132688;display:none;align-items:flex-end;justify-content:center}.modal-bg.open{display:flex}
.modal{width:min(100%,620px);max-height:88dvh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--sb))}
.modal h2{font-size:17px;margin:0 0 12px}.field{display:block;margin-top:12px;font-size:11px;font-weight:900;color:var(--muted)}.field select,.field textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;color:var(--ink);background:#fff}.field textarea{min-height:76px;resize:vertical}
.save{width:100%;border:0;border-radius:13px;padding:14px;background:var(--p);color:#fff;font-weight:950;margin-top:14px}
@media(max-width:360px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><button class="back" id="back">رجوع</button><div style="flex:1"><h1>طلبات الشراء المباشر</h1><div class="sub">متابعة طلبات المشترين من الإدارة</div></div><button class="refresh" id="refresh">تحديث</button></header>
<main class="wrap">
<div class="stats"><div class="stat"><small>كل الطلبات</small><b id="total">—</b></div><div class="stat"><small>طلبات جديدة</small><b id="pending">—</b></div><div class="stat"><small>قيد التنفيذ</small><b id="working">—</b></div></div>
<input class="search" id="search" placeholder="ابحث برقم الطلب أو اسم المشتري أو الهاتف أو الجهاز">
<div class="filters" id="filters"></div>
<div id="list"><div class="empty">جاري تحميل الطلبات...</div></div>
</main>
<div class="modal-bg" id="bg"><section class="modal" id="modal"></section></div>
<script type="module">
import {supabase} from "../js/supabase.js";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>Number(n||0).toLocaleString("en-US")+" د.ع";
const fmt=v=>v?new Date(v).toLocaleString("ar-IQ",{dateStyle:"medium",timeStyle:"short"}):"—";
const statuses=[["all","الكل"],["pending","جديد"],["contacted","تم التواصل"],["confirmed","مؤكد"],["inspection","الفحص والتسليم"],["completed","مكتمل"],["cancelled","ملغى"]];
const labels={pending:"طلب جديد",contacted:"تم التواصل",confirmed:"مؤكد",inspection:"قيد الفحص والتسليم",completed:"مكتمل",cancelled:"ملغى"};
let rows=[],filter="all",query="",current=null;
function renderFilters(){$("filters").innerHTML=statuses.map(([k,v])=>'<button class="'+(filter===k?"on":"")+'" data-filter="'+k+'">'+v+'</button>').join("");}
function matches(o){const d=o.device_snapshot||{},s=[o.order_number,o.buyer_name,o.buyer_phone,o.address,d.brand,d.model,d.storage].join(" ").toLowerCase();return (!query||s.includes(query))&&(filter==="all"||o.status===filter);}
function render(){
 const shown=rows.filter(matches);
 $("total").textContent=rows.length;$("pending").textContent=rows.filter(x=>x.status==="pending").length;
 $("working").textContent=rows.filter(x=>["contacted","confirmed","inspection"].includes(x.status)).length;
 if(!shown.length){$("list").innerHTML='<div class="empty">ماكو طلبات ضمن هذا الاختيار.</div>';return;}
 $("list").innerHTML=shown.map(o=>{const d=o.device_snapshot||{},name=[d.brand,d.model,d.storage,d.color].filter(Boolean).join(" ")||"جهاز";
 return '<article class="card"><div class="row"><span class="code">'+esc(o.order_number)+'</span><span class="badge">'+esc(labels[o.status]||o.status)+'</span></div>'+
 '<div class="name">'+esc(name)+'</div><div class="meta">المشتري: '+esc(o.buyer_name)+' · '+esc(o.buyer_phone)+'</div>'+
 '<div class="meta">العنوان: '+esc(o.address)+'</div><div class="meta">تاريخ الطلب: '+esc(fmt(o.created_at))+'</div>'+
 '<div class="price">'+money(o.price_iqd)+'</div><div class="actions"><button data-open="'+esc(o.id)+'">تفاصيل وإدارة الطلب</button></div></article>';
 }).join("");
}
async function load(){
 $("list").innerHTML='<div class="empty">جاري تحميل الطلبات...</div>';
 const {data,error}=await supabase.from("mzad_orders").select("*").order("created_at",{ascending:false}).limit(300);
 if(error){$("list").innerHTML='<div class="empty">تعذر تحميل الطلبات: '+esc(error.message)+'</div>';return;}
 rows=data||[];render();
}
function openOrder(o){
 current=o;const d=o.device_snapshot||{};
 $("modal").innerHTML='<h2>طلب '+esc(o.order_number)+'</h2>'+
 '<div class="meta">الجهاز: '+esc([d.brand,d.model,d.storage,d.color].filter(Boolean).join(" ")||"جهاز")+'</div>'+
 '<div class="meta">المشتري: '+esc(o.buyer_name)+' · '+esc(o.buyer_phone)+'</div>'+
 '<div class="meta">العنوان: '+esc(o.address)+'</div>'+
 '<div class="meta">طريقة الاستلام: '+(o.payment_method==="office"?"من المكتب":"عند الاستلام")+'</div>'+
 '<div class="meta">السعر المثبت: '+money(o.price_iqd)+'</div>'+
 '<div class="meta">ملاحظات المشتري: '+esc(o.notes||"لا توجد")+'</div>'+
 '<label class="field">حالة الطلب<select id="status">'+statuses.filter(x=>x[0]!=="all").map(([k,v])=>'<option value="'+k+'" '+(o.status===k?"selected":"")+'>'+v+'</option>').join("")+'</select></label>'+
 '<label class="field">ملاحظة داخلية من الإدارة<textarea id="note" maxlength="1000">'+esc(o.admin_note||"")+'</textarea></label>'+
 '<button class="save" id="save">حفظ التحديث</button><button class="save" id="close" style="background:#eee;color:#555;margin-top:8px">إغلاق</button>';
 $("bg").classList.add("open");
 $("close").onclick=closeModal;
 $("save").onclick=save;
}
function closeModal(){$("bg").classList.remove("open");current=null;}
async function save(){
 if(!current)return;
 const status=$("status").value,note=$("note").value.trim()||null;
 const b=$("save");b.disabled=true;b.textContent="جاري الحفظ...";
 const {data,error}=await supabase.from("mzad_orders").update({status,admin_note:note,handled_by:(await supabase.auth.getUser()).data.user.id}).eq("id",current.id).select("*").single();
 if(error){alert("تعذر حفظ الطلب: "+error.message);b.disabled=false;b.textContent="حفظ التحديث";return;}
 try{await supabase.rpc("mzad_admin_log",{p_action:"direct_order_status",p_target:current.id,p_details:{order_number:current.order_number,status}});}catch{}
 const i=rows.findIndex(x=>x.id===data.id);if(i>=0)rows[i]=data;closeModal();render();
}
$("filters").onclick=e=>{const b=e.target.closest("[data-filter]");if(!b)return;filter=b.dataset.filter;renderFilters();render();};
$("search").oninput=e=>{query=e.target.value.trim().toLowerCase();render();};
$("list").onclick=e=>{const b=e.target.closest("[data-open]");if(b){const o=rows.find(x=>x.id===b.dataset.open);if(o)openOrder(o);}};
$("refresh").onclick=load;$("back").onclick=()=>location.href="dashboard.html";
(async()=>{const {data:{user}}=await supabase.auth.getUser();if(!user){location.href="../admin-login.html";return;}const {data,error}=await supabase.rpc("mzad_is_admin");if(error||data!==true){location.href="../admin-login.html";return;}renderFilters();await load();setInterval(()=>{if(!document.hidden)load();},20000);})();
</script>
</body></html>
