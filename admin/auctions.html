

<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="theme-color" content="#6246d9">

<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>إدارة المزادات والتأمينات — MZAD PHONE</title>

<style>

:root{--bg:#f9f8fd;--ink:#17202a;--muted:#6b7280;--edge:#e4defa;--p:#6246d9;--ps:#f3f0ff;--ok:#1e8a5a;--oks:#e8f6ef;--bad:#c62f4d;--bads:#fff0f3;--hot:#e8590c;--sb:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}

body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}

button,textarea{font:inherit;color:inherit}

button{border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}

.page{width:min(100%,560px);margin:auto;padding:0 14px calc(40px + var(--sb));overflow-x:clip}

@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@keyframes rot{to{transform:rotate(360deg)}}

header{margin-inline:-14px;padding:0 14px 14px;background:linear-gradient(145deg,#fff,#ece8ff);border-radius:0 0 24px 24px;border-bottom:1px solid #ece8fb;position:sticky;top:0;z-index:30}

.top{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 0}

.ib{width:39px;height:34px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--p)}

.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.ib.spin svg{animation:rot .7s linear infinite}

.brand{text-align:center;line-height:1}

.brand b{font-size:16px;letter-spacing:-.03em}

.brand small{display:block;margin-top:3px;font-size:9px;font-weight:900;color:var(--p)}

.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:12px;padding:4px;border-radius:15px;background:#fff;border:1px solid var(--edge)}

.tab{padding:10px 4px;border-radius:11px;font-size:12px;font-weight:900;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;min-height:42px}

.tab.on{background:var(--p);color:#fff}

.tab i{font-style:normal;min-width:18px;padding:1px 5px;border-radius:9px;background:var(--ps);color:var(--p);font-size:10px}

.tab.on i{background:rgba(255,255,255,.25);color:#fff}

.list{display:flex;flex-direction:column;gap:12px;margin-top:14px}

.card{padding:14px;border-radius:20px;background:#fff;border:1px solid var(--edge);box-shadow:0 10px 24px -16px rgba(98,70,217,.3);animation:up .4s backwards}

.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}

.hd h3{margin:0;font-size:14.5px;font-weight:950;line-height:1.4}

.hd small{display:block;margin-top:2px;font-size:10.5px;font-weight:700;color:var(--muted)}

.pill{flex:0 0 auto;padding:4px 10px;border-radius:999px;background:var(--ps);color:var(--p);font-size:10px;font-weight:900}

.pill.ok{background:var(--oks);color:var(--ok)}

.pill.hot{background:#fff4ec;color:var(--hot)}

.rows{margin-top:10px}

.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #e9e5f8;font-size:12px;font-weight:700}

.r:last-child{border:0}

.r span{color:var(--muted)}

.r strong{font-weight:900;text-align:end;overflow-wrap:anywhere}

.ltr{direction:ltr}

.cp{padding:3px 9px;margin-inline-start:6px;border-radius:8px;background:var(--ps);color:var(--p);font-size:10px;font-weight:900}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

.acts.one{grid-template-columns:1fr}

.b{min-height:44px;padding:8px;border-radius:13px;font-size:13px;font-weight:950;display:flex;align-items:center;justify-content:center}

.b:active{transform:scale(.98)}

.b:disabled{opacity:.5}

.b.main{color:#fff;background:linear-gradient(145deg,#6246d9,#8b6cf0)}

.b.ok{color:#fff;background:var(--ok)}

.b.no{background:var(--bads);color:var(--bad)}

.b.alt{background:var(--ps);color:var(--p);grid-column:1/-1}

.cd{font-variant-numeric:tabular-nums;direction:ltr}

.cd.late{color:var(--bad)}

.empty{padding:34px 18px;text-align:center;border-radius:20px;background:#fff;border:1px dashed #cfc7f3}

.empty h3{margin:0 0 4px;font-size:15px;font-weight:900}

.empty p{margin:0;font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.8}

.sk{height:150px;border-radius:20px;background:#f1eefb;animation:up .4s}

.warn{margin-top:14px;padding:12px;border-radius:14px;background:var(--bads);color:var(--bad);font-size:12px;font-weight:800;line-height:1.8;word-break:break-word}
.diag{margin-top:10px;padding:10px 12px;border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--muted);font-size:11px;line-height:1.8;word-break:break-word}
.diag b{color:var(--ink)}

.ov{position:fixed;inset:0;z-index:100;background:rgba(23,32,42,.5);display:none;align-items:flex-end;justify-content:center}

.ov.show{display:flex}

.sheet{width:min(100%,560px);padding:18px 16px calc(18px + var(--sb));border-radius:24px 24px 0 0;background:#fff;animation:up .3s}

.sheet h3{margin:0 0 4px;font-size:16px;font-weight:950}

.sheet p{margin:0 0 12px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.8}

.sheet textarea{width:100%;min-height:80px;padding:12px;border:1.5px solid var(--edge);border-radius:14px;outline:none;resize:none;font-weight:700}

.img-ov{align-items:center}

.img-ov img{max-width:94%;max-height:86dvh;border-radius:16px;background:#fff}

.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%) translateY(16px);max-width:calc(100% - 32px);padding:10px 14px;border-radius:13px;background:#1e2c30;color:#fff;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:200;text-align:center}

.toast.show{opacity:1;transform:translateX(-50%)}

[hidden]{display:none!important}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>


</head>

<body>

<main class="page">

<header>

  <div class="top">

    <button class="ib" id="back" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

    <div class="brand"><b>MZAD PHONE</b><small>لوحة الإدارة — إدارة المزادات والتأمينات · إصدار إصلاح 16-10-2026</small></div>

    <button class="ib" id="reload" aria-label="تحديث"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg></button>

  </div>

  <div class="tabs" id="tabs">

    <button class="tab on" data-t="sale">تأمين البيع <i id="n1">0</i></button>

    <button class="tab" data-t="purchase">تأمين الشراء <i id="n2">0</i></button>

    <button class="tab" data-t="refund">الاسترداد <i id="n3">0</i></button>

    <button class="tab" data-t="live">المزادات المباشرة <i id="n4">0</i></button>

  </div>

</header>

<div id="warn" class="warn" hidden></div>
<div id="diag" class="diag" style="display:block!important;margin:10px 0;padding:12px;border:2px solid #6b4ce6;border-radius:12px;background:#fff;color:#202334;font-size:12px;line-height:1.9">تشخيص الإدارة: جارٍ تحميل البيانات…</div>

<section class="list" id="list"><div class="sk"></div><div class="sk"></div></section>

</main>

<div class="ov" id="ov">

  <div class="sheet">

    <h3 id="sT"></h3><p id="sP"></p>

    <textarea id="sR" placeholder="اكتب السبب (اختياري)"></textarea>

    <div class="acts">

      <button class="b alt" id="sNo" style="grid-column:auto">إلغاء</button>

      <button class="b main" id="sYes">تأكيد</button>

    </div>

  </div>

</div>

<div class="ov img-ov" id="iov"><img id="iimg" alt="إثبات الدفع"></div>

<div class="toast" id="toast"></div>

<script type="module">

import { supabase } from "../js/supabase.js";

const $=id=>document.getElementById(id);

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const money=n=>Number(n||0).toLocaleString("en-US")+" د.ع";

const fmtT=v=>{const d=new Date(v);return isNaN(d)?"—":d.toLocaleString("ar-IQ",{dateStyle:"medium",timeStyle:"short"})};

const must=r=>{if(r.error)throw r.error;return r.data};

let toastTimer;

function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2800)}

const validTabs=["sale","purchase","refund","live"];
const requestedTab=new URLSearchParams(location.search).get("tab");
const D={tab:validTabs.includes(requestedTab)?requestedTab:"sale",sale:[],purchase:[],live:[],refund:[],busy:false,requestCodeMap:new Map(),buyerCodeMap:new Map(),debug:{deposits:0,proofs:0,userId:"",aal:"unknown",admin:false}};

const TYPE={auction_seller:"تأمين البيع — بائع المزاد",auction_buyer:"تأمين الشراء — مشتري المزاد",direct_buyer:"تأمين الشراء المباشر"};

const AST={live:"مباشر",ended:"منتهي",cancelled:"ملغي",draft:"مسودة",pending:"بانتظار الموافقة",pending_deposit:"بانتظار التأمين"};

function row(k,v,cls,copy){

  return '<div class="r"><span>'+esc(k)+'</span><strong class="'+(cls||"")+'">'+esc(v)+(copy?'<button class="cp" type="button" data-copy="'+esc(copy)+'">نسخ</button>':"")+'</strong></div>';

}

async function loadAll(){

  const deps=must(await supabase.from("mzad_deposits")

    .select("id,deposit_number,user_id,auction_id,deposit_type,amount_iqd,status,created_at,updated_at,refund_reason")

    .order("created_at",{ascending:false}).limit(500));
  D.debug.deposits=deps.length;

  const live=must(await supabase.from("mzad_auctions")

    .select("id,auction_number,device_id,seller_user_id,current_price_iqd,starting_price_iqd,status,ends_at")

    .eq("status","live").order("ends_at",{ascending:true}).limit(100));

  const allA=[...new Set([...deps.map(d=>d.auction_id),...live.map(a=>a.id)].filter(Boolean))];

  const auctions=allA.length?must(await supabase.from("mzad_auctions")

    .select("id,auction_number,device_id,status,final_price_iqd,winner_user_id,seller_user_id").in("id",allA)):[];

  const am=new Map(auctions.map(a=>[a.id,a]));

  const devIds=[...new Set(auctions.map(a=>a.device_id).filter(Boolean))];

  const devs=devIds.length?must(await supabase.from("mzad_devices")

    .select("id,brand,model,storage").in("id",devIds)):[];

  const dm=new Map(devs.map(d=>[d.id,[d.brand,d.model,d.storage].filter(Boolean).join(" ")]));

  const reqs=deps.length?must(await supabase.from("mzad_payment_requests")

    .select("id,request_number,deposit_id,payment_method_id,status,created_at")

    .in("deposit_id",deps.map(d=>d.id)).order("created_at",{ascending:false})):[];

  const rm=new Map();

  reqs.forEach(r=>{if(!rm.has(r.deposit_id))rm.set(r.deposit_id,r)});

  // اعتمد على إثبات الدفع نفسه أيضاً، حتى لا يختفي من التبويب إذا اختلفت حالة سجل التأمين.
  const pendingProofs=must(await supabase.from("mzad_payment_proofs")
    .select("id,request_id,user_id,review_status,created_at")
    .eq("review_status","pending")
    .order("created_at",{ascending:false}).limit(500));
  D.debug.proofs=pendingProofs.length;

  const proofRequestIds=[...new Set(pendingProofs.map(p=>p.request_id).filter(Boolean))];
  const proofRequests=proofRequestIds.length?must(await supabase.from("mzad_payment_requests")
    .select("id,request_number,deposit_id,payment_method_id,status,created_at,user_id")
    .in("id",proofRequestIds)):[];
  const proofDepositIds=new Set(proofRequests.map(r=>r.deposit_id).filter(Boolean));
  proofRequests.forEach(r=>{if(!rm.has(r.deposit_id))rm.set(r.deposit_id,r)});

  const pend=deps.filter(d=>d.status==="proof_submitted" ||
    rm.get(d.id)?.status==="proof_submitted" || proofDepositIds.has(d.id));

  // إظهار كود الطلب DP وكود المشتري MZ داخل نفس بطاقة المراجعة.
  const requestIds=[...new Set([...reqs,...proofRequests].map(r=>r.id).filter(Boolean))];
  let requestCodeRows=[];
  try{
    requestCodeRows=requestIds.length?must(await supabase.from("mzad_request_codes")
      .select("request_id,code").in("request_id",requestIds)):[];
  }catch(e){console.warn("أكواد الطلب غير متاحة في لوحة الإدارة",e)}
  D.requestCodeMap=new Map(requestCodeRows.map(x=>[x.request_id,x.code]));
  const buyerIds=[...new Set(pend.map(d=>d.user_id).filter(Boolean))];
  let buyerCodeRows=[];
  try{
    buyerCodeRows=buyerIds.length?must(await supabase.from("mzad_buyer_codes")
      .select("user_id,code").in("user_id",buyerIds)):[];
  }catch(e){console.warn("أكواد المشتري غير متاحة في لوحة الإدارة",e)}
  D.buyerCodeMap=new Map(buyerCodeRows.map(x=>[x.user_id,x.code]));

  let mm=new Map();

  try{

    const methods=must(await supabase.rpc("mzad_get_enabled_payment_methods"));

    mm=new Map((methods||[]).map(x=>[x.id,x.name_ar]));

  }catch(e){console.warn("طرق الدفع غير متاحة",e)}

  const name=a=>a?(dm.get(a.device_id)||"جهاز"):"—";

  const makeReview=d=>{

    const a=am.get(d.auction_id),r=rm.get(d.id);

    return {d,a,r,dev:name(a),method:mm.get(r&&r.payment_method_id)||"",requestCode:r&&D.requestCodeMap.get(r.id)||"—",buyerCode:D.buyerCodeMap.get(d.user_id)||"—"};

  };

  const sortReview=(x,y)=>new Date((x.r&&x.r.created_at)||x.d.created_at)-new Date((y.r&&y.r.created_at)||y.d.created_at);

  // تأمين البيع: طلبات البائع فقط

  D.sale=pend.filter(d=>d.deposit_type==="auction_seller").map(makeReview).sort(sortReview);

  // تأمين الشراء: مشتري المزاد والشراء المباشر

  D.purchase=pend.filter(d=>d.deposit_type==="auction_buyer" || d.deposit_type==="direct_buyer" || (d.deposit_type!=="auction_seller" && !!d.user_id) || (am.get(d.auction_id)?.seller_user_id && d.user_id!==am.get(d.auction_id).seller_user_id)).map(makeReview).sort(sortReview);

  // المزادات المباشرة تبقى كما كانت

  D.live=live.map(a=>({a,dev:name(a)}));

  // الاسترداد مشترك

  D.refund=deps.filter(d=>{
    if(d.status==="refundable") return true;
    if(d.status!=="approved" || !d.auction_id) return false;
    const auction=am.get(d.auction_id);
    return !!auction && ["ended","cancelled"].includes(auction.status);
  }).map(d=>{
    const a=am.get(d.auction_id);
    return {d,a,dev:a?name(a):"تأمين بدون مزاد"};
  });

}

function reviewCard(x,i){

  const d=x.d,a=x.a,r=x.r,t=(r&&r.created_at)||d.created_at;

  return '<article class="card" style="animation-delay:'+Math.min(i,6)*.04+'s">'+

    '<div class="hd"><div><h3>'+esc(x.dev)+'</h3><small>'+esc(TYPE[d.deposit_type]||d.deposit_type)+' • '+esc(d.deposit_number||"")+'</small></div><span class="pill hot">'+money(d.amount_iqd)+'</span></div>'+

    '<div class="rows">'+

    row("رقم طلب الدفع",r&&r.request_number||"—","ltr")+
    row("كود الطلب DP",x.requestCode||"—","ltr")+
    row("كود المستخدم MZ",x.buyerCode||"—","ltr")+

    row("رقم المزاد",a&&a.auction_number||"—","ltr")+

    (x.method?row("طريقة الدفع",x.method):"")+

    row("معرّف المستخدم",String(d.user_id||"").slice(0,8),"ltr",d.user_id)+

    row("وقت الإرسال",fmtT(t))+

    '<div class="r"><span>الوقت منذ الإرسال</span><strong class="cd" data-t0="'+esc(t)+'">--:--:--</strong></div>'+

    '</div><div class="acts">'+

    '<button class="b alt" data-a="proof" data-id="'+esc(r&&r.id||"")+'" data-u="'+esc(d.user_id)+'">عرض إيصال الدفع</button>'+

    '<button class="b no" data-a="reject" data-id="'+esc(d.id)+'">رفض الإثبات</button>'+

    '<button class="b ok" data-a="approve" data-id="'+esc(d.id)+'" data-t="'+esc(d.deposit_type)+'">موافقة</button>'+

    '</div></article>';

}

function liveCard(x,i){

  const a=x.a;

  return '<article class="card" style="animation-delay:'+Math.min(i,6)*.04+'s">'+

    '<div class="hd"><div><h3>'+esc(x.dev)+'</h3><small>'+esc(a.auction_number||"")+'</small></div><span class="pill ok">مباشر</span></div>'+

    '<div class="rows">'+row("السعر الحالي",money(a.current_price_iqd??a.starting_price_iqd))+

    row("موعد الانتهاء",fmtT(a.ends_at))+

    '<div class="r"><span>الوقت المتبقي</span><strong class="cd" data-end="'+esc(a.ends_at||"")+'">--:--:--</strong></div></div>'+

    '<div class="acts"><button class="b no" data-a="cancel" data-id="'+esc(a.id)+'">إلغاء المزاد</button><button class="b main" data-a="finish" data-id="'+esc(a.id)+'">إنهاء الآن</button></div></article>';

}

function refundCard(x,i){

  const d=x.d,a=x.a;

  return '<article class="card" style="animation-delay:'+Math.min(i,6)*.04+'s">'+

    '<div class="hd"><div><h3>'+esc(x.dev)+'</h3><small>'+esc(TYPE[d.deposit_type]||d.deposit_type)+' • '+esc(d.deposit_number||"")+'</small></div><span class="pill">'+esc(a?(AST[a.status]||a.status):"جاهز للاسترداد")+'</span></div>'+

    '<div class="rows">'+row("مبلغ التأمين",money(d.amount_iqd))+

    row("رقم المزاد",a.auction_number||"—","ltr")+

    row("معرّف المستخدم",String(d.user_id||"").slice(0,8),"ltr",d.user_id)+

    (a.final_price_iqd?row("السعر النهائي",money(a.final_price_iqd)):"")+

    '</div><div class="acts one"><button class="b main" data-a="refunded" data-id="'+esc(d.id)+'">تأكيد إرجاع التأمين</button></div></article>';

}

const empty={

  sale:["لا توجد طلبات تأمين بيع","طلبات تأمين البائع التي تنتظر المراجعة ستظهر هنا."],

  purchase:["لا توجد طلبات تأمين شراء","طلبات تأمين مشتري المزاد والشراء المباشر ستظهر هنا."],

  live:["لا توجد مزادات مباشرة","المزادات المنشورة تظهر هنا."],

  refund:["لا توجد تأمينات للاسترداد","تظهر التأمينات المؤهلة بعد انتهاء المزاد أو إلغائه."]

};

function render(){

  $("n1").textContent=D.sale.length;

  $("n2").textContent=D.purchase.length;

  $("n3").textContent=D.refund.length;

  $("n4").textContent=D.live.length;

  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===D.tab));

  const arr=D[D.tab],fn={sale:reviewCard,purchase:reviewCard,live:liveCard,refund:refundCard}[D.tab];

  $("list").innerHTML=arr.length?arr.map(fn).join(""):'<div class="empty"><h3>'+esc(empty[D.tab][0])+'</h3><p>'+esc(empty[D.tab][1])+'</p></div>';

  tick();

}

function fmtLeft(ms){

  const s=Math.floor(Math.abs(ms)/1000),p=n=>String(n).padStart(2,"0");

  return p(Math.floor(s/3600))+":"+p(Math.floor(s%3600/60))+":"+p(s%60);

}

function tick(){

  const now=Date.now();

  document.querySelectorAll("[data-t0]").forEach(el=>{

    const left=new Date(el.dataset.t0).getTime()+3600000-now;

    el.textContent=left>0?fmtLeft(left):"تأخر "+fmtLeft(left);

    el.classList.toggle("late",left<=0);

  });

  document.querySelectorAll("[data-end]").forEach(el=>{

    const end=new Date(el.dataset.end).getTime();

    el.textContent=Number.isFinite(end)?(end>now?fmtLeft(end-now):"انتهى الوقت"):"—";

  });

}

setInterval(tick,1000);

function ask(o){

  return new Promise(resolve=>{

    $("sT").textContent=o.title;$("sP").textContent=o.text;

    $("sR").hidden=!o.reason;$("sR").value="";

    $("sYes").textContent=o.yes;

    $("sYes").className="b "+(o.danger?"no":"main");

    $("ov").classList.add("show");

    const done=v=>{

      $("ov").classList.remove("show");

      $("sYes").onclick=$("sNo").onclick=$("ov").onclick=null;

      resolve(v);

    };

    $("sYes").onclick=()=>done({note:$("sR").value.trim()});

    $("sNo").onclick=()=>done(null);

    $("ov").onclick=e=>{if(e.target===$("ov"))done(null)};

  });

}

async function showProof(reqId,userId){

  if(!reqId){toast("لا يوجد طلب دفع مرتبط");return}

  try{

    const proof=must(await supabase.from("mzad_payment_proofs")

      .select("proof_storage_path,created_at")

      .eq("request_id",reqId).eq("user_id",userId)

      .order("created_at",{ascending:false}).limit(1).maybeSingle());

    if(!proof||!proof.proof_storage_path){toast("لا يوجد ملف إيصال مرتبط بهذا الطلب");return}

    const signed=must(await supabase.storage.from("mzad-payment-proofs")

      .createSignedUrl(proof.proof_storage_path,600));

    $("iimg").src=signed.signedUrl;

    $("iov").classList.add("show");

  }catch(e){console.error(e);toast("تعذر عرض الإيصال: "+(e.message||e))}

}

$("iov").addEventListener("click",()=>{$("iov").classList.remove("show");$("iimg").removeAttribute("src")});

const ACT={

  approve:async(id,el)=>{

    const r=await ask({

      title:"تأكيد الموافقة",

      text:el.dataset.t==="auction_seller"

        ?"سيتم اعتماد تأمين البائع. تأكد من جاهزية إجراءات البائع الخلفية."

        :"سيتم اعتماد التأمين وتفعيل أهلية المشتري أو المزايد حسب إعدادات النظام.",

      yes:"موافقة"

    });

    if(r)must(await supabase.rpc("mzad_approve_deposit",{p_deposit_id:id,p_approve:true,p_note:r.note||null}));

    return r&&"تمت الموافقة";

  },

  reject:async id=>{

    const r=await ask({title:"رفض إثبات الدفع",text:"سيتم رفض الإثبات المسجل.",reason:true,yes:"رفض الإثبات",danger:true});

    if(r)must(await supabase.rpc("mzad_approve_deposit",{p_deposit_id:id,p_approve:false,p_note:r.note||"مرفوض"}));

    return r&&"تم رفض الإثبات";

  },

  cancel:async id=>{

    const r=await ask({title:"إلغاء المزاد",text:"سيتم إرسال طلب إلغاء المزاد إلى قاعدة البيانات.",reason:true,yes:"إلغاء المزاد",danger:true});

    if(r)must(await supabase.rpc("mzad_cancel_auction",{p_auction_id:id,p_reason:r.note||"إلغاء من الإدارة"}));

    return r&&"تم إلغاء المزاد";

  },

  finish:async id=>{

    const r=await ask({title:"إنهاء المزاد الآن",text:"سيتم حسم المزاد وفق منطق قاعدة البيانات الحالي.",yes:"إنهاء"});

    if(r)must(await supabase.rpc("mzad_finish_auction",{p_auction_id:id}));

    return r&&"تم إنهاء المزاد";

  },

  refunded:async id=>{

    const r=await ask({title:"تأكيد الاسترداد",text:"أكد فقط بعد إرجاع مبلغ التأمين فعلياً للمستخدم.",yes:"تم إرجاع المبلغ"});

    if(r)must(await supabase.rpc("mzad_mark_deposit_refunded",{p_deposit_id:id}));

    return r&&"تم تسجيل الاسترداد";

  }

};

$("list").addEventListener("click",async e=>{

  const c=e.target.closest("[data-copy]");

  if(c){

    try{await navigator.clipboard.writeText(c.dataset.copy);toast("تم النسخ")}

    catch{toast("تعذر النسخ")}

    return;

  }

  const b=e.target.closest("[data-a]");

  if(!b||D.busy)return;

  if(b.dataset.a==="proof"){showProof(b.dataset.id,b.dataset.u);return}

  D.busy=true;b.disabled=true;

  try{

    const msg=await ACT[b.dataset.a](b.dataset.id,b);

    if(msg){toast(msg);await reload()}

  }catch(err){

    console.error(err);toast("فشل الإجراء: "+(err.message||err));

  }finally{D.busy=false;b.disabled=false}

});

$("tabs").addEventListener("click",e=>{

  const b=e.target.closest(".tab");

  if(!b)return;

  D.tab=b.dataset.t;

  render();

});

async function reload(){

  $("reload").classList.add("spin");

  try{await loadAll();$("warn").hidden=true;render()}

  catch(e){

    console.error("ADMIN AUCTIONS LOAD",e);

    $("warn").hidden=false;

    $("warn").textContent="تعذر تحميل البيانات: "+(e.message||e)+(e.code==="42501"?" — تحقق من صلاحيات RLS للأدمن.":"");

  }finally{$("reload").classList.remove("spin")}

}

$("reload").addEventListener("click",reload);

$("back").addEventListener("click",()=>history.length>1?history.back():location.href="../home.html");

(async()=>{

  try{

    const u=must(await supabase.auth.getUser());
    D.debug.userId=u.user?.id||"غير مسجل";
    try{
      const assurance=await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
      D.debug.aal=assurance.data?.currentLevel||"unknown";
    }catch(e){D.debug.aal="تعذر القراءة"}

    if(!u.user){

      location.href="../index.html?login=1&returnTo="+encodeURIComponent(location.pathname);

      return;

    }

    const a=must(await supabase.rpc("mzad_is_admin"));
    D.debug.admin=a===true;
    const showDiag=()=>{
      const el=$("diag");
      el.hidden=false;
      el.innerHTML="<b>تشخيص الجلسة:</b> المستخدم "+esc(String(D.debug.userId).slice(0,8))+
        " • AAL: "+esc(D.debug.aal)+
        " • صلاحية الإدارة: "+(D.debug.admin?"نعم":"لا")+
        " • سجلات التأمين المقروءة: "+esc(D.debug.deposits)+
        " • الإثباتات المعلقة المقروءة: "+esc(D.debug.proofs);
    };

    if(a!==true){

      $("list").innerHTML='<div class="empty"><h3>غير مصرح</h3><p>هذه الصفحة مخصصة للإدارة فقط.</p></div>';

      return;

    }

    await reload();
    showDiag();
    if(D.debug.deposits===0 || D.debug.proofs===0){
      $("warn").hidden=false;
      $("warn").textContent="هذه الجلسة لا تقرأ سجلات التأمين أو إثباتات متوقعة. قارن سطر التشخيص بين المتصفحين؛ لا تغيّر صلاحيات قاعدة البيانات الآن.";
    }
    setInterval(()=>{if(!document.hidden&&!D.busy&&!$("ov").classList.contains("show"))reload().then(showDiag)},20000);

  }catch(e){

    console.error(e);

    $("warn").hidden=false;

    $("warn").textContent="تعذر التحقق من صلاحية الإدارة أو تحميل الصفحة: "+(e.message||e);

    $("list").innerHTML="";

  }

})();

</script>
