<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#6f5ce0">
<title>MZAD PHONE — تأكيد الشراء</title>
<!-- طلبات الشراء المباشر تُنشأ وتُحمى بسياسات RLS في Supabase. -->
<style>
:root{--bg:#f9f8fd;--ink:#17202a;--muted:#6b7280;--line:#ece8fb;--edge:#ddd8f8;--p:#6246d9;--p2:#8b6cf0;--pd:#4a34b8;--soft:#f3f0ff;--danger:#e5365f;--ok:#1e8a5a;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(120px + var(--sb))}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.wrap{width:min(100%,560px);margin:0 auto;padding:0 14px}

/* هيدر: الرجوع يمين، الشعار يسار */
.top{position:sticky;top:0;z-index:50;padding:calc(8px + var(--st)) 14px 12px;background:linear-gradient(145deg,#5a45d4,#7a67e8 55%,#a496f3);border-radius:0 0 20px 20px;box-shadow:0 8px 20px rgba(74,52,184,.24)}
.top-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.back{grid-column:1;justify-self:start;width:36px;height:32px;display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.92);color:var(--p)}
.back svg{width:18px;height:18px}
.ttl{grid-column:2;margin:0;font-size:16px;font-weight:900;color:#fff}
.logo{grid-column:3;justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:3px;color:#fff;line-height:1}
.logo b{font-size:20px;font-weight:950;letter-spacing:.02em}
.logo small{font-size:8px;font-weight:800;letter-spacing:.46em;margin-inline-end:-.46em;opacity:.85}

/* الخطوات */
.steps{display:flex;align-items:center;justify-content:center;gap:6px;margin:16px 0 4px;font-size:11px;font-weight:800;color:var(--muted)}
.steps i{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:11px;background:#fff;border:1.5px solid var(--edge);margin-inline-end:5px}
.steps .on{color:var(--pd)}.steps .on i{background:var(--p);border-color:var(--p);color:#fff}
.steps hr{flex:0 0 22px;border:0;height:2px;background:var(--edge);margin:0}

.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px;box-shadow:0 10px 24px -18px rgba(98,70,217,.35)}
.card h2{margin:0 0 12px;font-size:14px;font-weight:950;display:flex;align-items:center;gap:8px}
.card h2 span{width:6px;height:16px;border-radius:4px;background:linear-gradient(var(--p),var(--p2))}

/* ملخص الجهاز */
.prod{display:flex;gap:12px;align-items:center}
.prod .img{flex:0 0 84px;height:104px;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#7b61e8,#3b2a92)}
.prod img{width:100%;height:100%;object-fit:cover;display:block}
.prod small{font-size:11px;font-weight:900;color:var(--p)}
.prod h3{margin:2px 0 8px;font-size:17px;font-weight:950;line-height:1.25}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pills span{padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--edge);font-size:10.5px;font-weight:800;color:var(--pd)}

/* كيف تتم العملية */
.flow{display:grid;gap:0}
.fs{display:flex;gap:12px;position:relative;padding-bottom:14px}
.fs:last-child{padding-bottom:0}
.fs:not(:last-child)::before{content:"";position:absolute;inset-inline-start:13px;top:28px;bottom:2px;width:2px;background:var(--edge)}
.fs b{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;font-size:12px}
.fs strong{display:block;font-size:13px;font-weight:900}
.fs p{margin:2px 0 0;font-size:11.5px;line-height:1.7;font-weight:700;color:var(--muted)}

/* ضمانات */
.trust{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tr{padding:11px;border-radius:15px;background:var(--soft);border:1px solid var(--edge)}
.tr svg{width:20px;height:20px;color:var(--p)}
.tr strong{display:block;margin-top:6px;font-size:12px;font-weight:900}
.tr p{margin:2px 0 0;font-size:10.5px;line-height:1.6;font-weight:700;color:var(--muted)}

/* الفورم */
label.f{display:block;margin-bottom:11px;font-size:11.5px;font-weight:900;color:#4b5563}
.in{display:block;width:100%;margin-top:6px;height:46px;padding:0 14px;border-radius:14px;border:1.5px solid var(--edge);background:#fff;font-size:14px;font-weight:700;outline:none;transition:border-color .2s,box-shadow .2s}
textarea.in{height:76px;padding:12px 14px;resize:none}
.in:focus{border-color:#a99cf0;box-shadow:0 0 0 4px rgba(98,70,217,.1)}
.in.bad{border-color:var(--danger)}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay button{padding:12px 8px;border-radius:14px;border:1.5px solid var(--edge);background:#fff;font-size:12px;font-weight:900;color:#4b5563;line-height:1.5}
.pay button small{display:block;font-size:10px;font-weight:700;color:var(--muted)}
.pay button.on{border-color:var(--p);background:var(--soft);color:var(--pd)}

/* السعر */
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:12.5px;font-weight:800;color:#4b5563}
.row.tot{margin-top:6px;padding-top:12px;border-top:1px dashed var(--edge);font-size:15px;font-weight:950;color:var(--ink)}
.row.tot span:last-child{color:var(--pd);font-size:18px}
.ok{color:var(--ok)}

.agree{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:11.5px;line-height:1.8;font-weight:700;color:#4b5563}
.agree input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--p);flex:0 0 20px}

/* شريط التأكيد */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:100;padding:10px 14px calc(10px + var(--sb));background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);box-shadow:0 -10px 28px rgba(23,32,42,.08)}
.bar-in{width:min(100%,560px);margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .t small{display:block;font-size:10px;font-weight:800;color:var(--muted)}
.bar .t b{font-size:16px;font-weight:950;color:var(--pd);white-space:nowrap}
.go{flex:1;height:50px;border-radius:15px;color:#fff;font-size:14.5px;font-weight:950;background:linear-gradient(145deg,var(--p),var(--p2));box-shadow:0 10px 22px rgba(98,70,217,.32);transition:transform .15s,opacity .2s}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.55}

/* نجاح */
.done{text-align:center;padding:46px 22px}
.done .c{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:#e4f6ec;color:var(--ok);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,.8,.3,1)}
.done .c svg{width:42px;height:42px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.done h2{margin:0;font-size:20px;font-weight:950}
.done p{margin:8px 0 0;font-size:12.5px;line-height:1.9;font-weight:700;color:var(--muted)}
.code{display:inline-block;margin-top:14px;padding:8px 16px;border-radius:12px;background:var(--soft);border:1px dashed #a99cf0;color:var(--pd);font-weight:950;letter-spacing:.08em;direction:ltr}
.btn2{display:block;width:100%;height:48px;margin-top:18px;border-radius:14px;background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;font-weight:900;line-height:48px;text-decoration:none}

.toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translateX(-50%) translateY(14px);max-width:calc(100% - 40px);padding:10px 14px;border-radius:13px;background:#1e2c30;color:#fff;font-size:11.5px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%)}
.sk{height:120px;border-radius:20px;margin-top:12px;background:linear-gradient(90deg,#f1eefb 25%,#faf8ff 50%,#f1eefb 75%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <button class="back" id="back" type="button" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <h1 class="ttl">تأكيد الشراء</h1>
    <div class="logo"><b>MZAD</b><small>PHONE</small></div>
  </div>
</header>

<main class="wrap" id="main"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="t"><small>المجموع</small><b id="barTotal">—</b></div>
    <button class="go" id="go" type="button">تأكيد الطلب</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { supabase } from "./js/supabase.js";

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => new Intl.NumberFormat("en-US").format(n) + " د.ع";
const params = new URLSearchParams(location.search);
const id = params.get("id");
const saleId = params.get("sale");
const S = { dev:null, user:null, profile:null, pay:"cash" };

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2400)}
const imgUrl = p => { const v=String(p||"").trim(); if(!v) return ""; if(/^https?:/i.test(v)&&!/device-images\//i.test(v)) return v;
  const clean=v.replace(/^https?:.*\/device-images\//i,"").replace(/^\/+/,"").replace(/^device-images\//i,"").split("?")[0];
  return supabase.storage.from("device-images").getPublicUrl(clean).data?.publicUrl||"" };

async function loadDevice(){
  if (!saleId) throw new Error("missing direct sale id");
  const { data:r, error } = await supabase.from("mzad_direct_sales")
    .select("id,device_id,seller_user_id,display_price_iqd,asking_price_iqd,status,device:mzad_devices!mzad_direct_sales_device_id_fkey(id,brand,model,storage,color,battery_health,mzad_device_images(storage_path,sort_order))")
    .eq("id", saleId).eq("device_id", id).eq("status","active").maybeSingle();
  if(error) throw error;
  if(!r?.device) throw new Error("direct sale unavailable");
  const d=r.device, im=(d.mzad_device_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))[0];
  return { id:d.id, saleId:r.id, sellerUserId:r.seller_user_id, brand:d.brand, model:d.model, storage:d.storage, color:d.color,
    battery:d.battery_health, price:Number(r.display_price_iqd ?? r.asking_price_iqd), img:imgUrl(im?.storage_path) };
}

const IC = {
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M4 4l16 16"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M9.5 12l2 2 3-4"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};

function view(){
  const d=S.dev, title=d.model||d.brand||"جهاز";
  const pills=[d.storage,d.color,d.battery&&/\d/.test(d.battery)?String(d.battery).replace(/\D/g,"")+"% بطارية":""].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("");
  $("main").innerHTML=`
  <div class="steps"><span class="on"><i>1</i>الطلب</span><hr><span><i>2</i>الفحص</span><hr><span><i>3</i>التسليم</span></div>

  <section class="card"><div class="prod">
    <div class="img">${d.img?`<img src="${esc(d.img)}" alt="${esc(title)}">`:""}</div>
    <div><small>${esc(d.brand||"")}</small><h3>${esc(title)}</h3><div class="pills">${pills}</div></div>
  </div></section>

  <section class="card"><h2><span></span>بيانات حسابك</h2>
    <div class="row"><span>الاسم</span><strong id="buyerName" style="color:var(--ink)">—</strong></div>
    <div class="row"><span>رقم هاتفك</span><strong id="buyerPhone" dir="ltr" style="color:var(--ink)">—</strong></div>
    <p style="margin:8px 0 0;color:var(--muted);font-size:11px;line-height:1.8;font-weight:700">راح نستخدم الاسم ورقم الهاتف المسجلين بملفك الشخصي لإرسال طلب الشراء، بدون ما تحتاج تكتبهن من جديد.</p>
    <label class="f" style="margin:12px 0 0">ملاحظة (اختياري)<textarea class="in" id="notes" maxlength="500" placeholder="أي تفاصيل تحب توصلها لفريق المنصة"></textarea></label>
  </section>
  <section class="card"><h2><span></span>تواصل ويا المنصة</h2>
    <p style="margin:0 0 10px;color:var(--muted);font-size:12px;line-height:1.8;font-weight:700">للاستفسار عن طلبك تواصل ويانه مباشرة:</p>
    <a href="tel:07838003991" dir="ltr" style="display:flex;align-items:center;justify-content:space-between;padding:13px;border-radius:14px;background:var(--soft);border:1px solid var(--edge);color:var(--pd);text-decoration:none">
      <strong style="font-size:17px;letter-spacing:.04em">07838003991</strong><span dir="rtl" style="font-size:11px;font-weight:900">اتصال بالمنصة</span>
    </a>
    <a href="https://wa.me/9647838003991" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:9px;padding:10px;border-radius:12px;border:1px solid var(--edge);color:var(--pd);font-size:12px;font-weight:900;text-decoration:none">مراسلة المنصة عبر واتساب</a>
  </section>

  <section class="card"><h2><span></span>طريقة الدفع</h2>
    <div class="pay" id="pay">
      <button type="button" data-p="cash" class="on">عند الاستلام<small>تدفع بعد ما تفحص الجهاز</small></button>
      <button type="button" data-p="office">من المكتب<small>تستلم وتدفع بالمكتب</small></button>
    </div>
  </section>

  <section class="card"><h2><span></span>شلون تتم العملية؟</h2>
    <div class="flow">
      <div class="fs"><b>1</b><div><strong>تأكد طلبك هنا</strong><p>طلبك يوصل لفريق المنصة مباشرة.</p></div></div>
      <div class="fs"><b>2</b><div><strong>نتواصل ويا البائع بدالك</strong><p>إحنا نتفق وياه ونجهز الجهاز، وما تحتاج تكلمه.</p></div></div>
      <div class="fs"><b>3</b><div><strong>نفحص الجهاز ونسلمك ياه</strong><p>نتأكد من حالته قبل التسليم، وتدفع بس إذا ارتحت.</p></div></div>
    </div>
  </section>

  <section class="card"><div class="trust">
    <div class="tr">${IC.shield}<strong>وسيط موثوق</strong><p>المنصة هي الطرف بينك وبين البائع.</p></div>
    <div class="tr">${IC.chat}<strong>بدون تواصل مباشر</strong><p>رقمك يبقى خاص وما ينعطى للبائع.</p></div>
    <div class="tr">${IC.check}<strong>جهاز مفحوص</strong><p>نراجع الجهاز قبل ما يوصلك.</p></div>
    <div class="tr">${IC.lock}<strong>ما تدفع قبل الفحص</strong><p>الدفع عند الاستلام فقط.</p></div>
  </div></section>

  <section class="card"><h2><span></span>ملخص السعر</h2>
    <div class="row"><span>سعر الجهاز</span><span>${money(d.price)}</span></div>
    <div class="row"><span>رسوم المنصة</span><span class="ok">مجاناً</span></div>
    <div class="row tot"><span>المجموع</span><span>${money(d.price)}</span></div>
    <label class="agree"><input type="checkbox" id="agree"><span>أوافق على أن المنصة تتولى التواصل والتسليم، وأن بياناتي تُستخدم لإتمام هذا الطلب فقط.</span></label>
  </section>`;
  $("barTotal").textContent=money(d.price);
  $("bar").hidden=false;
  $("pay").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b)return;S.pay=b.dataset.p;$("pay").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
  $("buyerName").textContent=S.profile.name;
  $("buyerPhone").textContent=S.profile.phone;
  document.querySelectorAll(".in").forEach(i=>i.addEventListener("input",()=>i.classList.remove("bad")));
}

async function submit(){
  const name=S.profile?.name||"", phone=String(S.profile?.phone||"").replace(/\s/g,"");
  if(name.length<3){toast("أضف اسمك الكامل إلى ملفك الشخصي أولاً");return;}
  if(!/^(07\d{9}|\+?9647\d{9})$/.test(phone)){toast("أضف رقم هاتف صحيح إلى ملفك الشخصي أولاً");return;}
  if(!$("agree").checked){ toast("لازم توافق على الشروط حتى تكمل"); return; }

  const btn=$("go"); btn.disabled=true; btn.textContent="جاري الإرسال…";
  try{
    // منع تكرار الطلب: إذا سبق إنشاء طلب لهذا الإعلان نعرض نفس الطلب بدلاً من إرسال طلب ثانٍ.
    const {data:existing,error:checkError}=await supabase.from("mzad_orders")
      .select("id,order_number,buyer_user_id,status")
      .eq("direct_sale_id",S.dev.saleId)
      .in("status",["pending","contacted","confirmed","inspection"])
      .maybeSingle();
    if(checkError) throw checkError;
    if(existing){
      if(existing.buyer_user_id===S.user){success(existing);return;}
      throw new Error("SALE_ALREADY_RESERVED");
    }
    const { data:order, error } = await supabase.from("mzad_orders").insert({
      direct_sale_id:S.dev.saleId, device_id:S.dev.id, buyer_user_id:S.user, seller_user_id:S.dev.sellerUserId,
      buyer_name:name, buyer_phone:phone, address:(S.profile.address||S.profile.city||"يتم تحديده مع المنصة"), notes:$("notes").value.trim()||null,
      payment_method:S.pay, price_iqd:S.dev.price,
      device_snapshot:{brand:S.dev.brand,model:S.dev.model,storage:S.dev.storage,color:S.dev.color,battery_health:S.dev.battery},
      status:"pending"
    }).select("id,order_number,buyer_user_id").single();
    if(error) throw error;
    success(order);
  }catch(e){
    console.error("ORDER ERROR:", e);
    if(e.message==="SALE_ALREADY_RESERVED" || e.code==="23505"){
      toast("هذا الجهاز عليه طلب شراء قيد المعالجة حالياً");
    }else{
      toast("ما قدرنا نرسل الطلب، جرّب مرة ثانية");
    }
    btn.disabled=false; btn.textContent="تأكيد الطلب";
  }
}
function success(order){
  const ref=order?.order_number || "MZB";
  $("bar").hidden=true; window.scrollTo(0,0);
  $("main").innerHTML=`<section class="card done">
    <div class="c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>تم استلام طلبك</h2>
    <p>فريق المنصة راح يتواصل ويا البائع وبعدها يتصل بيك على رقمك لتأكيد موعد الفحص والتسليم.</p>
    <div class="code">${ref}</div>
    <a class="btn2" href="my-orders.html">متابعة طلباتي</a>
    <a class="btn2 home-btn" href="home.html">الصفحة الرئيسية</a></section>`;
}

$("back").addEventListener("click",()=>history.length>1?history.back():location.href="market.html");
$("go").addEventListener("click",submit);

(async()=>{
  if(!id || !saleId){ $("main").innerHTML='<section class="card done"><h2>رابط الشراء غير صحيح</h2><p>ارجع إلى تفاصيل الجهاز واضغط شراء من جديد.</p><a class="btn2" href="market.html">رجوع للسوق</a></section>'; return; }
  try{
    const { data } = await supabase.auth.getUser();
    const user=data?.user||null, meta=user?.user_metadata||{};
    S.user=user?.id||null;
    S.profile={
      name:String(meta.full_name||meta.name||"").trim(),
      phone:String(meta.phone||"").trim(),
      address:String(meta.address||meta.full_address||"").trim(),
      city:String(meta.city||meta.governorate||"").trim()
    };
  }catch{}
  try{ if(!S.user) throw new Error("يجب تسجيل الدخول"); S.dev=await loadDevice(); if(!(S.dev.price>0) || !S.dev.sellerUserId || S.dev.sellerUserId===S.user) throw new Error("غير متاح"); view(); }
  catch(e){ console.error("CHECKOUT LOAD:",e); $("main").innerHTML='<section class="card done"><h2>الجهاز غير متاح للشراء</h2><p>قد يكون محجوزاً أو انتهى عرضه أو أن رابط الشراء غير صحيح.</p><a class="btn2" href="market.html">رجوع للسوق</a></section>'; }
})();
</script>
