<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>استرجاع كلمة المرور - Iraq Green</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7f3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 60px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      color: #1d6b35;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .input {
      width: 100%;
      height: 55px;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 0 18px;
      font-size: 17px;
      margin-bottom: 15px;
      outline: none;
      direction: rtl;
    }

    .input:focus {
      border-color: #2f8f46;
    }

    .button {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 16px;
      background: #2f8f46;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.6;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.7;
    }

    .success {
      display: block;
      background: #e8f7ec;
      color: #176b2e;
    }

    .error {
      display: block;
      background: #fdeaea;
      color: #a51d1d;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: #2f8f46;
      text-decoration: none;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🔐</div>

    <h1>استرجاع كلمة المرور</h1>

    <div class="subtitle">
      أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.
    </div>

    <input
      id="email"
      class="input"
      type="email"
      placeholder="البريد الإلكتروني"
      autocomplete="email"
    >

    <button id="resetBtn" class="button">
      إرسال رابط الاسترجاع
    </button>

    <div id="message" class="message"></div>

    <a class="back" href="index.html">
      العودة إلى تسجيل الدخول
    </a>

  </div>

  <script>

    const SUPABASE_URL =
      "https://ldvxctpngkidvatkisae.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_iKh2hmOMdDYt9MmGmCX3jA_Hs-MovbK";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const emailInput =
      document.getElementById("email");

    const resetBtn =
      document.getElementById("resetBtn");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    resetBtn.addEventListener("click", async () => {

      const email =
        emailInput.value.trim();


      message.className = "message";
      message.textContent = "";


      if (!email) {

        showMessage(
          "رجاءً أدخل بريدك الإلكتروني.",
          "error"
        );

        return;
      }


      resetBtn.disabled = true;

      resetBtn.textContent =
        "جاري الإرسال...";


      try {

        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
              redirectTo:
                window.location.origin + "/reset.html"
            }
          );


        if (error) {

          showMessage(
            "تعذر إرسال رابط الاسترجاع. حاول مرة أخرى.",
            "error"
          );

          return;
        }


        showMessage(
          "تم إرسال رابط استرجاع كلمة المرور إلى بريدك الإلكتروني. افحص البريد الوارد والرسائل غير المرغوب بها.",
          "success"
        );


      } catch (error) {

        showMessage(
          "حدث خطأ غير متوقع. حاول مرة أخرى.",
          "error"
        );

      } finally {

        resetBtn.disabled = false;

        resetBtn.textContent =
          "إرسال رابط الاسترجاع";

      }

    });

  </script>

</body>
</html>
