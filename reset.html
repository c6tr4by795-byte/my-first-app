<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no,email=no,address=no">

  <title>تغيير كلمة المرور - العراق الأخضر</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cairo", Arial, sans-serif;
      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255,255,255,0.10) 0 90px,
          transparent 91px
        ),
        radial-gradient(
          circle at 100% 90%,
          rgba(255,255,255,0.08) 0 150px,
          transparent 151px
        ),
        #e91d4f;
      color: white;
    }

    .page {
      min-height: 100vh;
      padding: 25px 16px 45px;
      position: relative;
      overflow: hidden;
    }

    .circle {
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      bottom: -100px;
      left: -90px;
    }

    .content {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .back {
      display: inline-block;
      background: #32b8c4;
      color: #111;
      text-decoration: none;
      padding: 8px 15px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 4px 0 rgba(0,0,0,0.16);
    }

    .hero {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 25px;
    }

    .tree {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.3;
    }

    .subtitle {
      margin: 8px 0 0;
      font-size: 16px;
      font-weight: 600;
    }

    .card {
      background: #fffaf7;
      border-radius: 30px;
      padding: 28px 22px;
      box-shadow: 0 12px 30px rgba(80,0,20,0.14);
    }

    .email-box {
      background: #f1f8f1;
      color: #17853e;
      border-radius: 15px;
      padding: 12px 14px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      direction: ltr;
      margin-bottom: 22px;
      word-break: break-all;
    }

    .label {
      display: block;
      color: #17853e;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      border: 2px solid #eee;
      background: #f7f7f5;
      border-radius: 16px;
      padding: 15px 16px;
      margin-bottom: 17px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #32b8c4;
    }

    #code {
      text-align: center;
      letter-spacing: 8px;
      font-size: 25px;
      font-weight: 800;
      direction: ltr;
    }

    .submit {
      width: 100%;
      border: none;
      background: #32b8c4;
      color: #111;
      border-radius: 17px;
      padding: 15px;
      font-family: "Cairo", Arial, sans-serif;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0,0,0,0.16);
      margin-top: 3px;
    }

    .submit:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.16);
    }

    .submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .resend {
      display: block;
      text-align: center;
      margin-top: 19px;
      color: #17853e;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }

    #message {
      margin-top: 17px;
      text-align: center;
      color: #d71945;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.7;
    }

    #success {
      color: #17853e;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="circle"></div>

    <main class="content">

      <a href="forgot.html" class="back">
        رجوع
      </a>

      <section class="hero">

        <div class="tree">🌳</div>

        <h1>
          تغيير كلمة المرور
        </h1>

        <p class="subtitle">
          أدخل الرمز وكلمة المرور الجديدة
        </p>

      </section>

      <section class="card">

        <div class="email-box" id="emailBox">
          جاري تحميل البريد...
        </div>

        <label class="label">
          رمز التحقق
        </label>

        <input
          id="code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="000000">

        <label class="label">
          كلمة المرور الجديدة
        </label>

        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          placeholder="أدخل كلمة المرور الجديدة">

        <label class="label">
          تأكيد كلمة المرور
        </label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="أعد كتابة كلمة المرور">

        <button
          class="submit"
          id="submitBtn">
          تغيير كلمة المرور
        </button>

        <div id="message"></div>

        <a
          href="forgot.html"
          class="resend">
          لم يصلك الرمز؟ إرسال رمز جديد
        </a>

      </section>

    </main>

  </div>

  <script>

    const email =
      sessionStorage.getItem("resetEmail");

    const emailBox =
      document.getElementById("emailBox");

    const code =
      document.getElementById("code");

    const newPassword =
      document.getElementById("newPassword");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const submitBtn =
      document.getElementById("submitBtn");

    const message =
      document.getElementById("message");


    if (!email) {

      emailBox.textContent =
        "لم يتم العثور على بريد إلكتروني.";

      submitBtn.disabled = true;

    } else {

      emailBox.textContent = email;

    }


    code.addEventListener("input", () => {

      code.value =
        code.value.replace(/\D/g, "").slice(0, 6);

    });


    submitBtn.addEventListener("click", async () => {

      message.textContent = "";
      message.id = "message";


      const codeValue =
        code.value.trim();

      const passwordValue =
        newPassword.value;

      const confirmValue =
        confirmPassword.value;


      if (!email) {

        message.textContent =
          "انتهت جلسة استعادة الحساب. ابدأ من جديد.";

        return;
      }


      if (!/^\d{6}$/.test(codeValue)) {

        message.textContent =
          "أدخل رمز التحقق المكوّن من 6 أرقام.";

        return;
      }


      if (passwordValue.length < 6) {

        message.textContent =
          "كلمة المرور يجب أن تكون 6 أحرف أو أكثر.";

        return;
      }


      if (passwordValue !== confirmValue) {

        message.textContent =
          "كلمتا المرور غير متطابقتين.";

        return;
      }


      submitBtn.disabled = true;

      submitBtn.textContent =
        "جاري تغيير كلمة المرور...";


      try {

        const response =
          await fetch("/api/verify-otp", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              email: email,

              code: codeValue,

              newPassword: passwordValue

            })

          });


        const data =
          await response.json();


        if (!response.ok || !data.success) {

          message.textContent =
            data.message ||
            "تعذر تغيير كلمة المرور.";

          submitBtn.disabled = false;

          submitBtn.textContent =
            "تغيير كلمة المرور";

          return;
        }


        sessionStorage.removeItem(
          "resetEmail"
        );


        message.id = "success";

        message.textContent =
          "تم تغيير كلمة المرور بنجاح. سيتم تحويلك لتسجيل الدخول...";


        submitBtn.textContent =
          "تم بنجاح";


        setTimeout(() => {

          window.location.href =
            "index.html";

        }, 1800);


      } catch (error) {

        console.error(error);

        message.textContent =
          "تعذر الاتصال بالخادم. حاول مرة أخرى.";

        submitBtn.disabled = false;

        submitBtn.textContent =
          "تغيير كلمة المرور";

      }

    });

  </script>

</body>

</html>
