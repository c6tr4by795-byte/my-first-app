<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المسابقات | MZAD PHONE</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#8E3B46;--i:#F5E9DA;--line:rgba(142,59,70,.16);--soft:rgba(142,59,70,.08);--mute:rgba(142,59,70,.65);--ob:rgba(245,233,218,.7);--obl:rgba(245,233,218,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--i);color:var(--b);font-family:'Tajawal',system-ui,sans-serif}
body{display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.hero{background-color:var(--b);color:var(--i);border-radius:0 0 32px 32px;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 24px;
  }
.bar{display:flex;align-items:center;justify-content:space-between}
.bar h1{font-size:20px;font-weight:800}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--obl);background:var(--b);color:var(--i);display:grid;place-items:center;text-decoration:none;cursor:pointer}

.now{margin-top:22px;border:1px solid var(--obl);border-radius:24px;padding:18px;background:var(--b)}
.now .tag{font-size:13px;color:var(--ob)}
.now h2{font-size:24px;font-weight:800;margin-top:4px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--obl);padding-top:14px}
.meta div{text-align:center}
.meta div+div{border-inline-start:1px solid var(--obl)}
.meta b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.meta span{font-size:12px;color:var(--ob)}
.btns{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:16px}
.btn{height:52px;border-radius:16px;font-family:inherit;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.fill{background:var(--i);color:var(--b);border:1.5px solid var(--i)}
.btn.line{background:transparent;color:var(--i);border:1.5px solid var(--i)}
.btn:focus-visible{outline:2px solid var(--i);outline-offset:3px}

.prize{margin:20px 20px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pz{border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px}
.pz .ico{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.pz b{display:block;font-size:15px}
.pz span{font-size:12.5px;color:var(--mute)}

.sec{display:flex;align-items:center;justify-content:space-between;padding:26px 22px 10px}
.sec h3{font-size:18px;font-weight:800}
.sec span{font-size:13px;color:var(--mute)}
.list{padding:0 20px;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;border:1px solid var(--line);border-radius:20px;padding:12px 14px;text-decoration:none;color:var(--b);transition:background .15s}
.row:active{background:var(--soft)}
.row:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.rk{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:800}
.row.top .rk{background:var(--b);color:var(--i);border-color:var(--b)}
.nm{font-weight:700;font-size:16px}
.tr{height:4px;border-radius:4px;background:var(--soft);margin-top:8px;overflow:hidden}
.tr i{display:block;height:100%;background:var(--b);border-radius:4px}
.tm{text-align:left;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.tm b{display:block;font-size:16px;color:var(--b)}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="bar">
      <a class="ib" href="home.html" aria-label="رجوع"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></a>
      <h1>المسابقات</h1>
      <a class="ib" href="contest-intro.html" aria-label="كيف تشتغل"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg></a>
    </div>

    <section class="now">
      <div class="tag">المسابقة الحالية</div>
      <h2>مسابقة الموسم الأول</h2>
      <div class="meta">
        <div><b>2</b><span>من 3 جولة</span></div>
        <div><b>12</b><span>متسابق</span></div>
        <div><b id="cd">02:14:30</b><span>متبقي</span></div>
      </div>
      <div class="btns">
        <a class="btn fill" href="contest-register.html">
          <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="9" rx="3"/><path d="M7 9V7a3 3 0 013-3h4a3 3 0 013 3v2"/></svg>
          احجز مقعد
        </a>
        <a class="btn line" href="contest-results.html">النتائج</a>
      </div>
    </section>
  </header>

  <section class="prize">
    <div class="pz"><div class="ico"><svg class="ic" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 01-10 0V4zM7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3M12 14v4M8 20h8"/></svg></div><div><b>الجائزة الكبرى</b><span>للمركز الأول</span></div></div>
    <div class="pz"><div class="ico"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg></div><div><b>3 داعمين</b><span>سحب تلقائي بالنهاية</span></div></div>
  </section>

  <div class="sec"><h3>المتسابقون</h3><span id="count"></span></div>
  <main class="list" id="list"></main>
</div>

<script>
/* بيانات تجريبية: استبدلها لاحقاً ببيانات Supabase */
const contestants = [
  {id:1,name:'علي حسين',time:5120,sup:212},
  {id:2,name:'محمد صابر',time:4380,sup:148},
  {id:3,name:'زينب كريم',time:3905,sup:131},
  {id:4,name:'حسن جاسم',time:3310,sup:117},
  {id:5,name:'سارة نبيل',time:2740,sup:96},
  {id:6,name:'أحمد رعد',time:2195,sup:81},
  {id:7,name:'نور الهدى',time:1630,sup:64},
  {id:8,name:'مصطفى عباس',time:980,sup:42}
];
const fmt = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const max = Math.max(...contestants.map(c=>c.time));
document.getElementById('count').textContent = contestants.length + ' مشارك';
document.getElementById('list').innerHTML = contestants.map((c,i)=>`
  <a class="row ${i<3?'top':''}" href="contest-profile.html?id=${c.id}">
    <div class="rk">${i+1}</div>
    <div><div class="nm">${c.name}</div><div class="tr"><i style="width:${Math.round(c.time/max*100)}%"></i></div></div>
    <div class="tm"><b>${fmt(c.time)}</b>${c.sup} داعم</div>
  </a>`).join('');

/* عد تنازلي تجريبي */
let left = 2*3600+14*60+30;
const cd = document.getElementById('cd');
setInterval(()=>{ left=Math.max(0,left-1);
  const h=String(Math.floor(left/3600)).padStart(2,'0'),m=String(Math.floor(left%3600/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');
  cd.textContent=h+':'+m+':'+s; },1000);
</script>
</body>
</html>
