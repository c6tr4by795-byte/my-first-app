<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المسابقات | MZAD PHONE</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#8E3B46;--t:#B64E2D;--s:#E7ECD9;--i:#F5E9DA;--line:rgba(142,59,70,.18);--soft:rgba(245,233,218,.62);--mute:rgba(142,59,70,.68);--ob:rgba(245,233,218,.8);--chip:rgba(245,233,218,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--s);color:var(--b);font-family:'Tajawal',system-ui,sans-serif}
body{display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--t);outline-offset:3px}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.app{width:100%;max-width:480px;min-height:100vh;padding:0 18px calc(32px + env(safe-area-inset-bottom,0px))}
.top{height:56px;margin-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:space-between}
.top h1{font-size:19px;font-weight:800}
.plain{width:44px;height:44px;display:grid;place-items:center;color:var(--b);text-decoration:none;margin-inline:-10px}

/* البطاقة */
.stage{background:var(--t);color:var(--i);border-radius:28px;padding:18px}
.r1{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ob)}
.pill{display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--i);position:relative}
.live .dot{background:var(--i)}
.live .dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--i);animation:ping 1.7s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.stage h2{font-size:18px;font-weight:700;margin-top:12px;line-height:1.35;color:var(--ob)}
.prize{display:flex;align-items:center;gap:14px;margin-top:10px;background:var(--i);color:var(--t);border-radius:22px;padding:14px 16px}
.prize .ci{width:46px;height:46px;border-radius:50%;background:var(--t);color:var(--i);display:grid;place-items:center;flex:none}
.prize small{display:block;font-size:12.5px;color:var(--mute)}
.prize b{display:block;font-size:24px;font-weight:800;line-height:1.25;color:var(--b)}
.tm{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding:0 4px}
.tm span{font-size:13px;color:var(--ob)}
.tm b{font-size:38px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.seats{margin-top:12px;background:var(--chip);border-radius:20px;padding:12px 14px}
.sr{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ob)}
.sr b{font-size:16px;color:var(--i)}
.bar{height:8px;border-radius:8px;background:rgba(245,233,218,.22);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--i);border-radius:8px;transition:width .8s}
.acts{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;margin-top:12px}
.acts.one{grid-template-columns:1fr}
.btn{height:52px;border-radius:18px;border:0;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px;font-weight:800;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.cream{background:var(--i);color:var(--b)}
.btn.ghost{background:var(--chip);color:var(--i)}
.btn.fill{background:var(--t);color:var(--i)}
.btn.off{opacity:.55;pointer-events:none}

/* الجولات */
.chain{display:grid;align-items:center;margin-top:22px;padding:0 6px}
.node{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--s);color:var(--mute);display:grid;place-items:center;font-size:13px;font-weight:800;padding:0;transition:box-shadow .2s}
.node.done{background:var(--t);border-color:var(--t);color:var(--i)}
.node.cur{border-color:var(--t);color:var(--t)}
.node[aria-pressed=true]{box-shadow:0 0 0 5px rgba(182,78,45,.16)}
.link{height:6px;border-radius:6px;background:rgba(142,59,70,.1);margin-inline:6px;overflow:hidden}
.link i{display:block;height:100%;width:0;background:var(--t);border-radius:6px;transition:width .6s}
.lb{justify-self:center;margin-top:8px;font-size:12px;color:var(--mute);white-space:nowrap}
.lb.on{color:var(--b);font-weight:800}

/* السباق */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.sec h3{font-size:18px;font-weight:800}
.sec span{font-size:13px;color:var(--mute)}
.lane{width:100%;border:0;background:var(--soft);color:var(--b);border-radius:22px;padding:13px 14px 14px;display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:0 10px;text-align:start;transition:transform .15s}
.lane+.lane{margin-top:8px}
.lane:active{transform:scale(.98)}
.rk{font-size:15px;font-weight:800;text-align:center;color:var(--mute)}
.mid b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{font-size:12px;color:var(--mute)}
.vl{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.track{grid-column:1/-1;position:relative;height:12px;border-radius:12px;background:rgba(142,59,70,.1);margin-top:10px}
.track .fl{position:absolute;inset-block:0;inset-inline-start:0;border-radius:12px;background:var(--t)}
.track .mk{position:absolute;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--i);border:2.5px solid var(--t);color:var(--t);display:grid;place-items:center;font-size:11px;font-weight:800;font-style:normal}
.lane.lead{background:var(--b);color:var(--i)}
.lane.lead .rk,.lane.lead .mid small{color:var(--ob)}
.lane.lead .track{background:rgba(245,233,218,.22)}
.lane.lead .track .fl{background:var(--i)}
.lane.lead .track .mk{background:var(--b);border-color:var(--i);color:var(--i)}
.state{background:var(--soft);border-radius:22px;padding:26px 18px;text-align:center;color:var(--mute);font-size:15px;line-height:1.7}
.sk{background:rgba(142,59,70,.08);border-radius:22px;animation:sh 1.4s ease-in-out infinite}
@keyframes sh{50%{opacity:.45}}

/* لا توجد مسابقة */
.empty{min-height:calc(100vh - 110px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 10px}
.scene{width:230px;height:230px;overflow:visible}
.scene .glow{fill:var(--t);opacity:.12;transform-origin:100px 100px;animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.14);opacity:.2}}
.scene .r1c{fill:none;stroke:var(--t);stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:3 9;stroke-linecap:round;transform-origin:100px 100px;animation:spin 40s linear infinite}
.scene .r2c{fill:none;stroke:var(--t);stroke-opacity:.6;stroke-width:2;stroke-dasharray:60 150;stroke-linecap:round;transform-origin:100px 100px;animation:spin 14s linear infinite reverse}
.scene .core{fill:var(--t)}
.scene .cup{fill:none;stroke:var(--i);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;transform-origin:100px 100px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
.o{transform-origin:100px 100px}
.o1{animation:spin 9s linear infinite}.o2{animation:spin 13s linear infinite reverse}.o3{animation:spin 19s linear infinite}
.o circle{fill:var(--b)}.o2 circle{fill:var(--t)}.o3 circle{fill:var(--b);opacity:.55}
.tw{fill:var(--t);transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
.tw.b{animation-delay:.8s}.tw.c{animation-delay:1.6s}
@keyframes tw{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.empty h2,.empty p,.empty .acts{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.empty h2{font-size:26px;font-weight:800;margin-top:18px;animation-delay:.25s}
.empty p{font-size:15px;color:var(--mute);line-height:1.8;margin-top:8px;max-width:300px;animation-delay:.5s}
.empty .acts{width:100%;margin-top:26px;animation-delay:.75s}

/* إعلان انتهاء الجولة */
.ann{position:fixed;inset:0;z-index:50;background:var(--t);color:var(--i);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .4s}
.ann.show{opacity:1;pointer-events:auto}
.ann .big{position:relative;width:130px;height:130px;border-radius:50%;background:var(--i);color:var(--t);display:grid;place-items:center;font-size:60px;font-weight:800;transform:scale(.4)}
.ann.show .big{animation:pop .7s cubic-bezier(.2,1.3,.3,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.ann .big::before,.ann .big::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--i);opacity:0}
.ann.show .big::before{animation:burst 1.8s .3s ease-out infinite}
.ann.show .big::after{animation:burst 1.8s 1.2s ease-out infinite}
@keyframes burst{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.ann h2,.ann p,.ann small{opacity:0}
.ann.show h2{animation:rise .6s .4s forwards}.ann.show p{animation:rise .6s .6s forwards}.ann.show small{animation:rise .6s .8s forwards}
.ann h2{font-size:28px;font-weight:800;margin-top:26px}
.ann p{font-size:17px;margin-top:8px;color:var(--ob)}
.ann small{font-size:13px;margin-top:22px;color:var(--ob)}

/* ورقة المتسابق */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(142,59,70,.5);opacity:0;transition:opacity .25s}
.panel{position:relative;width:100%;max-width:480px;background:var(--s);border-radius:32px 32px 0 0;padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);text-align:center}
.sheet.show{pointer-events:auto}
.sheet.show .scrim{opacity:1}
.sheet.show .panel{transform:none}
.grab{height:28px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:44px;height:5px;border-radius:5px;background:var(--line)}
.shr{font-size:14px;color:var(--mute);margin-top:4px}
.shn{font-size:26px;font-weight:800;margin-top:2px}
.shc{font-size:14px;color:var(--mute)}
.pad{position:relative;width:190px;height:190px;margin:16px auto 0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pad svg.rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--line);stroke-width:5}
.prg{fill:none;stroke:var(--t);stroke-width:5;stroke-linecap:round}
.wave{position:absolute;inset:20px;border-radius:50%;border:1.5px solid var(--t);opacity:0;pointer-events:none}
.hb{position:absolute;inset:20px;border-radius:50%;border:0;background:var(--t);color:var(--i);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none;outline:none;box-shadow:0 0 0 6px var(--s),0 0 0 7px var(--line);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.hb:focus-visible{box-shadow:0 0 0 6px var(--s),0 0 0 8px var(--b)}
.hb:disabled{opacity:.4;cursor:not-allowed}
.hb .t{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.hb .s{font-size:12px;color:var(--ob)}
.pad.on .hb{transform:scale(.93)}
.pad.on .wave{animation:wave 1.4s ease-out infinite}
.pad.on .wave.w2{animation-delay:.7s}
@keyframes wave{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.42);opacity:0}}
.hm{margin-top:14px;font-size:15px;font-weight:700;min-height:24px}
.shs{margin-top:2px;font-size:13.5px;color:var(--mute)}
.shs b{color:var(--b)}
.full{display:inline-block;margin-top:12px;font-size:15px;font-weight:700;color:var(--t);text-decoration:none;padding:8px 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.empty h2,.empty p,.empty .acts{opacity:1}.panel{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="plain" href="home.html" aria-label="رجوع"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></a>
    <h1>المسابقات</h1>
    <a class="plain" href="contest-intro.html" aria-label="كيف تشتغل المسابقة"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg></a>
  </header>

  <div id="skel" aria-hidden="true">
    <div class="sk" style="height:330px;border-radius:28px"></div>
    <div class="sk" style="height:46px;margin-top:22px"></div>
    <div class="sk" style="height:74px;margin-top:26px"></div>
  </div>

  <div id="main" hidden>
    <section class="stage" id="stage">
      <div class="r1"><span class="pill"><span class="dot"></span><span id="stateLabel"></span></span><span id="rLabel"></span></div>
      <h2 id="contestTitle"></h2>
      <div class="prize">
        <span class="ci"><svg class="ic" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 14v4M8 20h8M9.5 18h5"/></svg></span>
        <span><small>الجائزة الكبرى</small><b id="prize"></b></span>
      </div>
      <div class="tm"><span id="cdLabel"></span><b id="cd"></b></div>
      <div class="seats">
        <div class="sr"><span>المقاعد</span><span><b id="seatsTxt"></b> <span id="seatsLeft"></span></span></div>
        <div class="bar"><i id="seatBar"></i></div>
      </div>
      <div class="acts" id="acts">
        <a class="btn cream" id="btnMain" href="contest-register.html">احجز مقعدك</a>
        <a class="btn ghost" href="contest-results.html">النتائج</a>
      </div>
    </section>

    <section class="chain" id="chain" aria-label="الجولات"></section>

    <div class="sec"><h3>السباق</h3><span id="unit"></span></div>
    <div id="board"></div>
  </div>

  <section class="empty" id="empty" hidden>
    <svg class="scene" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="glow" cx="100" cy="100" r="92"/>
      <circle class="r1c" cx="100" cy="100" r="86"/>
      <circle class="r2c" cx="100" cy="100" r="68"/>
      <g class="o o1"><circle cx="100" cy="14" r="5"/></g>
      <g class="o o2"><circle cx="100" cy="32" r="4"/></g>
      <g class="o o3"><circle cx="100" cy="186" r="3.5"/></g>
      <circle class="core" cx="100" cy="100" r="44"/>
      <path class="cup" d="M87 82h26v11a13 13 0 0 1-26 0zM87 87h-7a7 7 0 0 0 7 9M113 87h7a7 7 0 0 1-7 9M100 106v10M92 119h16"/>
      <path class="tw" d="M30 60l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
      <path class="tw b" d="M170 48l2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5z"/>
      <path class="tw c" d="M158 150l2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5z"/>
    </svg>
    <h2 id="emT"></h2>
    <p id="emP"></p>
    <div class="acts one">
      <a class="btn fill" id="emA" href="contest-intro.html">كيف تشتغل المسابقة</a>
      <button class="btn fill" id="emR" hidden>إعادة المحاولة</button>
    </div>
  </section>
</div>

<div class="ann" id="ann" role="status"><div class="big" id="annN"></div><h2 id="annT"></h2><p id="annP"></p><small>المسابقة مستمرة. المتصدرين تحدثوا</small></div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="scrim" id="scrim"></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="المتسابق">
    <div class="grab" id="grab"><i></i></div>
    <div class="shr" id="shRank"></div>
    <div class="shn" id="shName"></div>
    <div class="shc" id="shCity"></div>
    <div class="pad" id="pad">
      <svg class="rg" viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="54"/><circle class="prg" id="ring" cx="60" cy="60" r="54"/></svg>
      <div class="wave"></div><div class="wave w2"></div>
      <button class="hb" id="hb" aria-label="اضغط وثبّت لدعم المتسابق"><span class="t" id="ht">00:00</span><span class="s">ثبّت للدعم</span></button>
    </div>
    <div class="hm" id="hm"></div>
    <div class="shs"><b id="shSup">0</b> داعم الآن</div>
    <a class="full" id="shOpen" href="contest-profile.html">افتح البروفايل الكامل</a>
  </div>
</div>

<script type="module">
import {supabase} from './js/supabase.js';
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return h?p(h)+':'+p(m)+':'+p(x):p(m)+':'+p(x)};
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
let contest=null,home=null,timer=null,sel=1,board=[],loaded=false,kicked=false,prevRound=null,topName='';

function show(which){$('skel').hidden=which!=='skel';$('main').hidden=which!=='main';$('empty').hidden=which!=='empty'}
function showEmpty(title,text,retry){
  clearInterval(timer);contest=null;$('emT').textContent=title;$('emP').textContent=text;
  $('emA').hidden=!!retry;$('emR').hidden=!retry;show('empty');
}
$('emR').onclick=()=>{show('skel');load().catch(fail)};
function fail(e){console.error(e);if(!loaded)showEmpty('تعذر تحميل المسابقة','تأكد من اتصالك بالإنترنت وحاول مرة ثانية.',true)}

/* إعلان نهاية الجولة */
let annTimer;
function announce(from,to,name){
  $('annN').textContent=from;$('annT').textContent='انتهت الجولة '+from;
  $('annP').textContent=(name?'المتصدر: '+name+'. ':'')+'نبدأ الجولة '+to+' الآن';
  const a=$('ann');a.classList.remove('show');void a.offsetWidth;a.classList.add('show');
  if(navigator.vibrate)navigator.vibrate([20,40,20]);
  clearTimeout(annTimer);annTimer=setTimeout(()=>a.classList.remove('show'),4500);
}
$('ann').onclick=()=>$('ann').classList.remove('show');

/* سلسلة الجولات */
function roundState(k){const c=contest.currentRound;
  if(contest.status==='ended'||(c&&k<c))return 'done';
  if(contest.status==='live'&&k===c)return 'cur';
  return 'next'}
function renderChain(){
  const rs=(home.rounds||[]).slice().sort((a,b)=>a.roundNo-b.roundNo);
  const n=Math.max(rs.length,contest.roundsCount||3),root=$('chain');root.replaceChildren();
  root.style.gridTemplateColumns=Array.from({length:n*2-1},(_,i)=>i%2?'1fr':'auto').join(' ');
  for(let k=1;k<=n;k++){
    const st=roundState(k),col=k*2-1;
    const nd=el('button','node '+st,String(k));nd.type='button';nd.dataset.k=k;nd.setAttribute('aria-pressed',String(k===sel));
    nd.setAttribute('aria-label','الجولة '+k);nd.style.gridColumn=col;nd.style.gridRow=1;
    const lb=el('span','lb'+(k===sel?' on':''),k===n&&n>1?'النهائي':'الجولة '+k);lb.dataset.k=k;lb.style.gridColumn=col;lb.style.gridRow=2;
    root.append(nd,lb);
    if(k<n){const l=el('div','link'),f=el('i');f.dataset.k=k;f.style.width=st==='done'?'100%':'0%';l.style.gridColumn=col+1;l.style.gridRow=1;l.append(f);root.append(l)}
  }
}
$('chain').addEventListener('click',e=>{const b=e.target.closest('.node');if(!b||!home)return;sel=+b.dataset.k;
  document.querySelectorAll('.node').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.k===sel)));
  document.querySelectorAll('.lb').forEach(x=>x.classList.toggle('on',+x.dataset.k===sel));renderBoard()});

/* السباق */
function lane(p,i,v,max,useMin){
  const b=el('button','lane'+(i===0?' lead':''));b.type='button';b.dataset.i=i;
  const mid=el('span','mid');mid.append(el('b','',p.name||'مشارك'),el('small','',i===0?'المتصدر':(p.city||'')));
  const tr=el('span','track'),fl=el('i','fl'),mk=el('i','mk',(p.name||'م').trim().charAt(0));
  const pct=Math.max(7,Math.round(v/max*100));
  fl.style.width=pct+'%';mk.style.insetInlineStart='clamp(0px,calc('+pct+'% - 12px),calc(100% - 24px))';
  tr.append(fl,mk);
  b.append(el('span','rk',String(i+1)),mid,el('span','vl',useMin?Math.floor(v/60)+' د':v+' داعم'),tr);
  return b;
}
function renderBoard(){
  const rr=(home.rounds||[]).find(x=>x.roundNo===sel);
  const rows=((rr&&rr.board)||home.board||[]).slice();
  const secs=p=>p.supportSeconds!=null?p.supportSeconds:p.seconds!=null?p.seconds:p.minutes!=null?p.minutes*60:null;
  const useMin=rows.some(p=>secs(p)!=null);
  const num=p=>useMin?(secs(p)||0):(p.support||0);
  rows.sort((a,b)=>num(b)-num(a));board=rows;
  if(sel===contest.currentRound)topName=rows[0]?rows[0].name||'':'';
  $('unit').textContent=rows.length?(useMin?'بالدقائق':'بعدد الداعمين'):'';
  const root=$('board');root.replaceChildren();
  if(!rows.length){root.append(el('div','state','ما كو متسابقين بعد. احجز مقعدك وكن أول من يدخل السباق.'));return}
  const max=Math.max(1,num(rows[0]));
  rows.forEach((p,i)=>root.append(lane(p,i,num(p),max,useMin)));
}
$('board').addEventListener('click',e=>{const b=e.target.closest('.lane');if(b)openSheet(board[+b.dataset.i],+b.dataset.i)});

/* العد */
function startClock(){
  clearInterval(timer);
  const tick=()=>{if(!contest)return;
    const n=Date.now(),s=new Date(contest.startsAt).getTime(),rs=home.rounds||[];
    const r=rs.find(x=>x.roundNo===contest.currentRound),e=new Date((r&&r.endsAt)||contest.endsAt).getTime();
    const left=contest.status==='open'&&s>n?(s-n)/1000:contest.status==='live'&&e>n?(e-n)/1000:0;
    $('cd').textContent=fmt(left);
    $('cdLabel').textContent=contest.status==='open'?'حتى البداية':'متبقي بالجولة';
    if(left<=0&&!kicked){kicked=true;setTimeout(()=>load().catch(()=>{}),1500)}
    if(contest.status==='live'&&r){
      const prev=rs.find(x=>x.roundNo===contest.currentRound-1);
      const st=new Date(r.startsAt||(prev&&prev.endsAt)||contest.startsAt).getTime();
      const f=document.querySelector('.link i[data-k="'+contest.currentRound+'"]');
      if(f&&e>st)f.style.width=Math.min(100,Math.max(0,(n-st)/(e-st)*100))+'%';
    }
  };
  tick();timer=setInterval(tick,1000);
}

/* التحميل */
async function load(){
  const {data,error}=await supabase.rpc('mzad_get_contest_home');if(error)throw error;
  const old=prevRound,oldTop=topName;
  home=data||{};contest=home.contest;loaded=true;kicked=false;
  /* انتهت المسابقة = تختفي كل شي وتظهر شاشة الانتظار */
  if(!contest||contest.status==='ended'){prevRound=null;showEmpty('المسابقة الجاية قريباً','انتهت المسابقة. جهّز جهازك بالسوق حتى تدخل أول ما تنزل مسابقة جديدة بجوائز أكبر.',false);return}
  const taken=home.seatsTaken||0,max=contest.seatsMax||0,n=Math.max((home.rounds||[]).length,contest.roundsCount||3);
  $('stage').classList.toggle('live',contest.status==='live');
  $('stateLabel').textContent=contest.status==='live'?'مباشر الآن':'قريباً';
  $('rLabel').textContent=contest.status==='live'&&contest.currentRound?'الجولة '+contest.currentRound+' من '+n:'';
  $('contestTitle').textContent=contest.title||'المسابقة';
  $('prize').textContent=contest.prize||'قريباً';
  $('seatsTxt').textContent=max?taken+' من '+max:taken+' مشارك';
  $('seatsLeft').textContent=max?(taken>=max?'اكتملت':'باقي '+(max-taken)):'';
  $('seatBar').style.width=(max?Math.min(100,taken/max*100):0)+'%';
  if(contest.currentRound&&old&&contest.currentRound>old&&contest.status==='live'){sel=contest.currentRound;announce(old,contest.currentRound,oldTop)}
  else if(!document.querySelector('.node')||sel>n)sel=contest.currentRound||1;
  prevRound=contest.currentRound||null;
  const btn=$('btnMain'),full=max&&taken>=max;
  btn.classList.remove('off');
  if(home.myEntry){btn.href='contest-profile.html?id='+encodeURIComponent(home.myEntry.id);btn.textContent='مشاركتي'}
  else if(full){btn.removeAttribute('href');btn.textContent='المقاعد اكتملت';btn.classList.add('off')}
  else{btn.href='contest-register.html';btn.textContent='احجز مقعدك'}
  renderChain();renderBoard();startClock();show('main');
}
load().catch(fail);
setInterval(()=>{if(loaded)load().catch(()=>{})},10000);

/* ورقة المتسابق + زر الدعم */
const DASH=2*Math.PI*54,pad=$('pad'),hb=$('hb'),ring=$('ring'),sheet=$('sheet'),panel=$('panel');
ring.style.strokeDasharray=DASH;
let cur=null,held=0,sent=0,last=0,raf=0,holding=false;
function renderHold(){ring.style.strokeDashoffset=DASH*(1-(held%60)/60);$('ht').textContent=fmt(held)}
function openSheet(p,i){
  cur=p;held=0;sent=0;renderHold();
  $('shRank').textContent='المركز '+(i+1);$('shName').textContent=p.name||'مشارك';$('shCity').textContent=p.city||'';
  $('shSup').textContent=String(p.support||0);$('shOpen').href='contest-profile.html?id='+encodeURIComponent(p.id);
  const live=contest&&contest.status==='live';hb.disabled=!live;
  $('hm').textContent=live?'اضغط وثبّت إصبعك':'الدعم يفتح أثناء الجولة';
  sheet.classList.add('show');sheet.setAttribute('aria-hidden','false');
}
function closeSheet(){stopHold();sheet.classList.remove('show');sheet.setAttribute('aria-hidden','true');panel.style.transform=''}
function tickHold(n){if(!holding)return;held+=(n-last)/1000;last=n;renderHold();raf=requestAnimationFrame(tickHold)}
function startHold(e){if(holding||hb.disabled)return;e.preventDefault();try{hb.setPointerCapture(e.pointerId)}catch(_){}
  holding=true;last=performance.now();pad.classList.add('on');$('hm').textContent='ثبّت... لا ترفع إصبعك';
  if(navigator.vibrate)navigator.vibrate(12);raf=requestAnimationFrame(tickHold)}
function stopHold(){if(!holding)return;holding=false;cancelAnimationFrame(raf);pad.classList.remove('on');
  $('hm').textContent='توقف العد. اضغط لتكمل';
  const s=Math.floor(held-sent);if(s>0){sent+=s;sendSupport(cur&&cur.id,s)}}
/* هنا تربط تسجيل الدعم بـ Supabase. الحساب الحقيقي والتحقق لازم يصيرون بالسيرفر */
function sendSupport(entryId,seconds){}
hb.addEventListener('pointerdown',startHold);
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>hb.addEventListener(ev,stopHold));
window.addEventListener('blur',stopHold);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopHold()});
hb.addEventListener('contextmenu',e=>e.preventDefault());
$('scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const grab=$('grab');let y0=null;
grab.addEventListener('pointerdown',e=>{y0=e.clientY;panel.style.transition='none';grab.setPointerCapture(e.pointerId)});
grab.addEventListener('pointermove',e=>{if(y0===null)return;panel.style.transform='translateY('+Math.max(0,e.clientY-y0)+'px)'});
const endDrag=e=>{if(y0===null)return;const dy=e.clientY-y0;y0=null;panel.style.transition='';dy>90?closeSheet():panel.style.transform=''};
grab.addEventListener('pointerup',endDrag);grab.addEventListener('pointercancel',endDrag);
</script>
