<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f7f6fb">
<title>MZAD PHONE — المسابقات</title>
<style>
:root{--bg:#f7f6fb;--card:#fff;--ink:#16181d;--muted:#737a86;--muted2:#a0a6b1;--line:#eeecf6;--p:#6246d9;--p2:#8b6cf0;--p-dark:#3f2a9c;--p-soft:#f1eeff;--ok:#1e8a5a;--bad:#c62f4d;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.page{width:min(100%,520px);margin:0 auto;padding:0 16px calc(96px + var(--sb))}

/* top bar */
.top{position:sticky;top:0;z-index:30;margin-inline:-16px;padding:calc(10px + var(--st)) 16px 10px;display:flex;align-items:center;justify-content:space-between;background:rgba(247,246,251,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--ink);transition:transform .15s}
.ib:active{transform:scale(.93)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top h2{margin:0;font-size:16px;font-weight:900}
.sp{width:40px}

/* identity */
.who{padding:6px 2px 14px}
.wm{min-width:0;flex:1}
.wm h1{margin:0;font-size:22px;line-height:1.25;font-weight:900;letter-spacing:-.02em;overflow-wrap:anywhere}
.live{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font-size:11.5px;font-weight:800;color:var(--ok)}
.live i{width:7px;height:7px;border-radius:50%;background:#2fb67e}

/* ID card - the one bold element */
.idcard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#4a34b8,#6246d9 60%,#7c5ee8)}
.idcard small{display:block;font-size:11.5px;font-weight:800;opacity:.8}
.code{margin:4px 0 0;font-size:22px;font-weight:900;letter-spacing:2px;direction:ltr;text-align:right;overflow-wrap:anywhere}
.code.sm{font-size:14px;letter-spacing:0;font-weight:800}
.copy{flex:0 0 auto;padding:8px 16px;border-radius:99px;background:#fff;color:var(--p-dark);font-size:12px;font-weight:900;transition:transform .15s}
.copy:active{transform:scale(.95)}
.copy:disabled{opacity:.55;cursor:wait}

/* quick tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 4px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:transform .15s}
.tile:active{transform:scale(.95)}
.tile .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--p-soft);color:var(--p)}
.tile svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile span.l{font-size:11px;font-weight:800;line-height:1.3;text-align:center}
.badge{position:absolute;top:7px;inset-inline-start:7px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--p);color:#fff;font-size:10.5px;font-weight:900;display:grid;place-items:center}

/* sections */
.sec{margin-top:28px}
.sec>h3{margin:0 2px 6px;font-size:18px;font-weight:900;letter-spacing:-.01em}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:2px 14px}
.row{width:100%;display:flex;align-items:center;gap:13px;padding:14px 0;text-align:right;border-bottom:1px solid var(--line);transition:opacity .15s}
.row:last-child{border-bottom:0}
.row:active{opacity:.6}
.row .ic{width:24px;height:24px;flex:0 0 24px;color:#7b8394}
.row .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rt{min-width:0;flex:1}
.rt b{display:block;font-size:14px;font-weight:800}
.rt small{display:block;margin-top:2px;font-size:11.5px;font-weight:600;color:var(--muted);direction:rtl}
.rt small.ltr{direction:ltr;text-align:right}
.ar{width:17px;height:17px;flex:0 0 17px;fill:none;stroke:#bfc4ce;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* wins */

.out{width:100%;height:52px;margin-top:24px;border-radius:18px;background:#fff;border:1px solid #f1c4cd;color:var(--bad);font-size:14px;font-weight:900;transition:transform .15s}
.out:active{transform:scale(.98)}
.out:disabled{opacity:.6}
.ver{margin:14px 0 0;text-align:center;font-size:11px;font-weight:700;color:var(--muted2)}

/* bottom nav */
.bw{position:fixed;left:0;right:0;bottom:0;z-index:50}
.bn{width:100%;max-width:520px;margin:0 auto;padding:8px 10px calc(8px + var(--sb));background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.ni{min-width:0;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;color:#7e8992;transition:color .16s,background .16s}
.ni:active{background:var(--p-soft)}
.ni.on{color:var(--p)}
.ni svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ni span{font-size:10px;line-height:1;font-weight:800;white-space:nowrap}
.add{width:44px;height:26px;border-radius:13px;display:grid;place-items:center;background:var(--p);color:#fff}
.add svg{width:18px;height:18px;stroke-width:2.4}

.toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translate(-50%,14px);max-width:calc(100% - 40px);padding:10px 15px;border-radius:13px;background:#16181d;color:#fff;font-size:12px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:.28s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:.28s}
.loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--p);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:340px){.tiles{grid-template-columns:repeat(2,1fr)}.code{font-size:25px}.ct{grid-template-columns:1fr}}
.empty{margin:0;padding:18px 0;font-size:12.5px;line-height:1.9;font-weight:700;color:var(--muted)}
.win{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.win:last-child{border-bottom:0}
.wi{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;background:#fff6dc;color:#b7860b}
.wi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wn{min-width:0;flex:1}
.wn b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn small{display:block;margin-top:3px;font-size:11px;font-weight:600;color:var(--muted)}
.an{direction:ltr;text-align:right;font-size:10px!important;color:var(--muted2)!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct{padding:15px 0;border-bottom:1px solid var(--line)}
.ct:last-child{border-bottom:0}
.ct h4{margin:0;font-size:14.5px;font-weight:900}
.ct p{margin:5px 0 0;font-size:12px;line-height:1.8;font-weight:600;color:var(--muted)}
.ct .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.ct .meta span{padding:3px 10px;border-radius:99px;background:var(--p-soft);color:var(--p-dark);font-size:11px;font-weight:800}
.wp{text-align:left;white-space:nowrap}
.wp b{display:block;font-size:13px;font-weight:900;color:var(--p-dark)}
.wp small{display:inline-block;margin-top:3px;padding:2px 8px;border-radius:99px;background:#e8f6ef;color:var(--ok);font-size:10px;font-weight:800}
</style>
<script type="module" src="./js/auth-guard.js"></script>
</head>
<body>
<main class="page">
  <div class="top">
    <button class="ib" id="backBtn" type="button" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <h2>المسابقات</h2>
    <span class="sp"></span>
  </div>
  <section class="sec" style="margin-top:8px">
    <div class="box" id="winsList"><p class="empty">جاري تحميل نتائج مزاداتك...</p></div>
  </section>
</main>
<div class="bw"><nav class="bn">
  <a class="ni" href="home.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg><span>الرئيسية</span></a>
  <a class="ni" href="market.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>الأجهزة</span></a>
  <a class="ni" href="sell.html"><span class="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span>إضافة</span></a>
  <a class="ni" href="favorites.html"><svg viewBox="0 0 24 24"><path d="M20.8 8.4c0 5-8.8 10.3-8.8 10.3S3.2 13.4 3.2 8.4A4.8 4.8 0 0 1 12 5.7a4.8 4.8 0 0 1 8.8 2.7z"/></svg><span>المفضلة</span></a>
  <a class="ni" href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.4 3.1-5 7-5s6.2 1.6 7 5"/></svg><span>حسابي</span></a>
</nav></div>


<script type="module">
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const list = document.getElementById("winsList");

/* أضف المسابقات هنا. مثال:
   { title: "مسابقة أفضل مزاد", desc: "شارك بمزاد واربح جائزة", prize: "هاتف", ends: "2026-11-30" } */
const CONTESTS = [];

document.getElementById("backBtn").onclick = () => {
  if (document.referrer && document.referrer.includes(location.host)) history.back();
  else location.href = "profile.html";
};

list.innerHTML = CONTESTS.length ? CONTESTS.map(c => `<div class="ct">
  <h4>${esc(c.title)}</h4>
  ${c.desc ? `<p>${esc(c.desc)}</p>` : ""}
  <div class="meta">${c.prize ? `<span>الجائزة: ${esc(c.prize)}</span>` : ""}${c.ends ? `<span>تنتهي: ${esc(new Date(c.ends).toLocaleDateString("ar-IQ"))}</span>` : ""}</div>
</div>`).join("") : '<p class="empty">ماكو مسابقات حالياً. راح يظهر هنا أي إعلان عن مسابقة جديدة.</p>';
</script>
</body>
</html>
