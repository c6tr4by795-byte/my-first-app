<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>غرفة المسابقة | MZAD</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--p:#6246d9;--bg:#f8f7fc;--ink:#211d32;--muted:#777187;--line:#eae7f2;--ok:#16865b;--bad:#c64b5c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 15px calc(24px + env(safe-area-inset-bottom));}
main{max-width:520px;margin:auto}header{display:flex;align-items:center;gap:12px;padding:15px 0}header a{font-size:24px;color:var(--p)}h1{font-size:21px;margin:0}p{color:var(--muted);line-height:1.8}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.field{display:block;margin:13px 0;font-weight:700;font-size:13px}input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit;margin-top:7px}.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--p);color:#fff;font:inherit;font-weight:700;margin-top:12px}.btn:disabled{opacity:.5}.muted{color:var(--muted);font-size:12px}.error{color:var(--bad);white-space:pre-wrap}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{padding:5px 10px;border-radius:20px;background:#f0edfc;color:var(--p);font-size:12px}
</style></head><body><main><header><a href="contests.html">‹</a><h1>غرفة المسابقة</h1></header><section class="card"><h2 id="title">جاري التحميل…</h2><p id="meta"></p><p class="muted">رتّب دعمك بعناية: دعم واحد لكل جولة، وتكدر تدعم متسابقاً واحداً غير مشاركتك.</p><div id="joinBox" hidden><p>بعدك ما حاجز مقعدك. تگدر تشارك مباشرة بدون نشر جهاز.</p><a class="btn" id="joinLink">احجز مقعدك</a></div><div id="board"></div><p id="msg"></p></section></main><script type="module">
import {supabase} from "./js/supabase.js";
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get("id");
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));\nlet activeSupport=false;
async function load(){
 const s=await supabase.auth.getSession();const user=s.data.session?.user;
 const r=await supabase.rpc("mzad_get_contest_home");if(r.error)throw r.error;
 const x=r.data;if(!x.contest)throw Error("لا توجد مسابقة حالياً");
 const c=x.contest;if(id&&id!==c.id)throw Error("هذه الغرفة ليست للمسابقة الحالية");
 $("title").textContent=c.title;$("meta").textContent="الجائزة: "+c.prize+" · "+(["التصفية","نصف النهائي","النهائي"][Number(c.round||1)-1]||("الجولة "+c.round));
 $("joinBox").hidden=!!x.myEntry;$("joinLink").href="contest-join.html?id="+encodeURIComponent(c.id);
 $("board").innerHTML=(x.board||[]).map((m,i)=>'<div class="item row"><div><b>'+(i+1)+'. '+esc(m.name)+'</b><div class="muted">'+esc(m.device)+' · الدعم '+Number(m.support||0).toLocaleString("en-US")+'</div><a class="muted" href="contestant.html?id='+encodeURIComponent(m.id)+'">عرض ملف المتسابق</a></div><button class="btn support-hold" style="width:auto;margin:0;touch-action:none;user-select:none;-webkit-user-select:none" data-entry="'+m.id+'">اضغط باستمرار</button></div>').join("")||"لا يوجد مشاركون بعد.";
 $("board").querySelectorAll(".support-hold").forEach(b=>{
  let pressed=false,starting=false,timer=0,pointer=null;
  const stop=async()=>{if(!pressed&&!starting)return;const active=pressed;pressed=false;starting=false;activeSupport=false;clearInterval(timer);timer=0;if(active)await supabase.rpc("mzad_contest_support_stop",{p_contest_id:c.id});b.textContent="اضغط باستمرار";b.style.background="";};
  b.addEventListener("pointerdown",async e=>{
   if(!e.isPrimary||e.button!==0||pressed||starting)return;e.preventDefault();pointer=e.pointerId;
   if(!user){location.href="index.html?login=1&returnTo="+encodeURIComponent(location.pathname+location.search);return;}
   starting=true;b.textContent="جارٍ بدء الدعم…";
   try{const v=await supabase.rpc("mzad_contest_support_start",{p_contest_id:c.id,p_entry_id:b.dataset.entry});if(v.error)throw v.error;if(!starting){await supabase.rpc("mzad_contest_support_stop",{p_contest_id:c.id});return;}starting=false;pressed=true;activeSupport=true;b.textContent="استمر بالضغط…";b.style.background="#16865b";
    timer=setInterval(async()=>{const h=await supabase.rpc("mzad_contest_support_heartbeat",{p_contest_id:c.id});if(h.error||h.data!==true){await stop();$("msg").textContent=h.error?.message||"انتهت الجولة."; }},2500);
   }catch(err){starting=false;b.textContent="اضغط باستمرار";$("msg").textContent=err.message||"تعذر بدء الدعم";}
  });
  const release=e=>{if(e?.pointerId!==undefined&&pointer!==null&&e.pointerId!==pointer)return;pointer=null;stop();};
  b.addEventListener("pointerup",release);b.addEventListener("pointercancel",release);b.addEventListener("lostpointercapture",release);
  addEventListener("blur",release);document.addEventListener("visibilitychange",()=>{if(document.hidden)release();});
 });

}
load().catch(e=>$("msg").textContent=e.message||String(e));addEventListener("pagehide",()=>{if(activeSupport)supabase.rpc("mzad_contest_support_stop",{p_contest_id:id||""});});setInterval(()=>{if(!document.hidden&&!activeSupport)load()},4000);
</script></body></html>
