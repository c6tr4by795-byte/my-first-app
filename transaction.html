<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>تفاصيل المعاملة — MZAD PHONE</title>
<style>
:root{--bg:#f8f8fc;--ink:#17202a;--muted:#6b7280;--edge:#e6e3ef;--p:#e91d4f;--teal:#32b8c4;--ok:#1e8a5a;--warn:#a35b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.page{width:min(100%,560px);margin:auto;padding:0 14px 34px}.head{position:sticky;top:0;background:#fff;z-index:3;border-bottom:1px solid var(--edge);padding:13px 0}.top{display:flex;align-items:center;justify-content:space-between}.back{width:40px;height:38px;border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--p);font-size:20px}.brand{text-align:center}.brand b{font-size:15px}.brand small{display:block;font-size:10px;color:var(--muted);margin-top:3px}.card{margin-top:14px;padding:15px;background:#fff;border:1px solid var(--edge);border-radius:18px}.h{font-size:15px;font-weight:950;margin:0 0 8px}.sub{color:var(--muted);font-size:11px;line-height:1.8}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--edge);font-size:12px}.row:last-child{border:0}.row span{color:var(--muted)}.row b{text-align:left;overflow-wrap:anywhere}.price{color:var(--p);font-size:16px}.pill{display:inline-block;border-radius:99px;padding:5px 9px;background:#fce8ed;color:var(--p);font-size:10px;font-weight:900}.step{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--edge);font-size:12px;line-height:1.7}.step:last-child{border:0}.dot{flex:0 0 9px;width:9px;height:9px;margin-top:5px;border-radius:50%;background:var(--teal)}.empty,.error{padding:26px 15px;text-align:center;background:#fff;border:1px dashed var(--edge);border-radius:17px;margin-top:15px;color:var(--muted);font-size:12px;line-height:1.8}.error{color:#c62f4d}
</style></head><body><main class="page"><header class="head"><div class="top"><button id="back" class="back" aria-label="رجوع">›</button><div class="brand"><b>MZAD PHONE</b><small>تفاصيل المعاملة والتسليم</small></div><span style="width:40px"></span></div></header><div id="app"><div class="empty">جاري تحميل تفاصيل المعاملة…</div></div></main>
<script type="module">
import {supabase} from "./js/supabase.js";
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get("id");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>Number(v||0).toLocaleString("en-US")+" د.ع";
const date=v=>{if(!v)return "لم يحدد بعد";const d=new Date(v);return isNaN(d)?"—":d.toLocaleString("ar-IQ",{dateStyle:"medium",timeStyle:"short"})};
const states={open:"بانتظار التنسيق",appointment_pending:"بانتظار الموعد",seller_arrived:"وصل البائع",buyer_arrived:"وصل المشتري",inspection:"فحص الجهاز",payment_pending:"بانتظار الدفع",handover_pending:"بانتظار التسليم",completed:"مكتملة",cancelled:"ملغاة",disputed:"قيد النزاع"};
function row(k,v,cl=""){return '<div class="row"><span>'+esc(k)+'</span><b class="'+cl+'">'+esc(v)+'</b></div>'}
async function load(){
 if(!id)throw new Error("رابط المعاملة غير صحيح");
 const ur=await supabase.auth.getUser();if(ur.error)throw ur.error;
 if(!ur.data.user){location.href="index.html?login=1&returnTo="+encodeURIComponent(location.pathname+location.search);return}
 const user=ur.data.user;
 const tr=await supabase.from("mzad_transactions").select("*").eq("id",id).maybeSingle();if(tr.error)throw tr.error;if(!tr.data)throw new Error("المعاملة غير موجودة أو لا تملك صلاحية عرضها");
 const t=tr.data;if(t.buyer_user_id!==user.id&&t.seller_user_id!==user.id)throw new Error("هذه المعاملة ليست مرتبطة بحسابك");
 const [dr,ar,sr,pr,hr]=await Promise.all([
  supabase.from("mzad_devices").select("id,brand,model,storage,mzad_id,verification_status").eq("id",t.device_id).maybeSingle(),
  t.auction_id?supabase.from("mzad_auctions").select("auction_number,status,winner_user_id,final_price_iqd").eq("id",t.auction_id).maybeSingle():Promise.resolve({data:null,error:null}),
  t.direct_sale_id?supabase.from("mzad_direct_sales").select("sale_number,status,asking_price_iqd").eq("id",t.direct_sale_id).maybeSingle():Promise.resolve({data:null,error:null}),
  supabase.from("mzad_handover_appointments").select("scheduled_at,status,handover_point_id,notes").eq("transaction_id",t.id).order("created_at",{ascending:false}).limit(1).maybeSingle(),
  supabase.from("mzad_handover_records").select("handover_at,seller_confirmed,buyer_confirmed,platform_confirmed,seller_payment_confirmed,buyer_device_received").eq("transaction_id",t.id).maybeSingle()
 ]);
 for(const x of [dr,ar,sr,pr,hr])if(x.error)throw x.error;
 let fees=[];try{const fr=await supabase.from("mzad_transaction_fees").select("payer_role,amount_iqd,status,paid_at,payment_reference").eq("transaction_id",t.id);if(!fr.error)fees=fr.data||[]}catch(e){console.warn("Transaction fee visibility unavailable",e)}
 const feeStatus={pending:"بانتظار الدفع المباشر",paid:"مدفوعة",waived:"معفاة",cancelled:"ملغاة"};
 const d=dr.data||{},a=ar.data,s=sr.data,p=pr.data,h=hr.data;
 let point=null;if(p?.handover_point_id){const x=await supabase.from("mzad_handover_points").select("name_ar,address_ar,phone").eq("id",p.handover_point_id).maybeSingle();if(!x.error)point=x.data}
 let handoverPoints=[];try{const hp=await supabase.from("mzad_handover_points").select("id,name_ar,address_ar").eq("is_active",true).order("name_ar");if(!hp.error)handoverPoints=hp.data||[]}catch(e){console.warn("Handover points unavailable",e)}
 let accountCode="";
 try { const codeResult=await supabase.rpc("mzad_get_my_account_code"); if(!codeResult.error && typeof codeResult.data==="string") accountCode=codeResult.data; } catch(e) { console.warn("Account code unavailable",e); }
 const accountCodeHtml=accountCode ? '<section class="card"><h2 class="h">كود حسابك</h2><p class="sub">مرجع حسابك عند التواصل مع الدعم. لا يُستخدم لتسجيل الدخول.</p><div style="padding:12px;border:1px dashed #b7dde1;border-radius:12px;text-align:center;direction:ltr;font-size:17px;font-weight:950;color:var(--teal)">'+esc(accountCode)+'</div></section>' : "";
 const status=states[t.status]||t.status||"—";
 const timeline=[["تم إنشاء المعاملة",true],["تحديد موعد التسليم",!!p&&p.status!=="cancelled"],["تأكيد حضور الطرفين",!!h&&(h.seller_confirmed&&h.buyer_confirmed)],["تأكيد استلام الجهاز",!!h?.buyer_device_received],["اكتمال المعاملة",t.status==="completed"]];
 const actionButtons=[];
 if(t.status!=="completed"&&t.status!=="cancelled"&&t.status!=="disputed"){
   if(user.id===t.seller_user_id)actionButtons.push(["seller_arrived","تأكيد وصول البائع"],["seller_payment_confirmed","تأكيد استلام المبلغ"]);
   if(user.id===t.buyer_user_id)actionButtons.push(["buyer_arrived","تأكيد وصول المشتري"],["buyer_device_received","تأكيد استلام الجهاز"]);
 }
 const handoverActions=actionButtons.length?'<section class="card"><h2 class="h">إجراءات المعاملة</h2><p class="sub">استخدم التأكيدات بعد حدوثها فعلياً فقط. لا تؤكد استلام جهاز أو مبلغ لم تستلمه.</p>'+actionButtons.map(a=>'<button class="action" data-action="'+a[0]+'" style="display:block;width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:var(--p);color:white;font-weight:900">'+a[1]+'</button>').join("")+'</section>':"";
 const canSchedule=["open","appointment_pending","seller_arrived","buyer_arrived"].includes(t.status)&&(!p||["cancelled","no_show"].includes(p.status));
 const scheduleForm=canSchedule&&handoverPoints.length?'<section class="card"><h2 class="h">تحديد موعد التسليم</h2><p class="sub">اختر نقطة تسليم فعّالة وموعداً مستقبلياً يتناسب مع الطرفين.</p><label class="sub" for="hp">نقطة التسليم</label><select id="hp" style="width:100%;margin:6px 0 12px;padding:12px;border:1px solid var(--edge);border-radius:12px;background:#fff;font:inherit">'+handoverPoints.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name_ar+" — "+x.address_ar)+'</option>').join("")+'</select><label class="sub" for="ht">موعد التسليم</label><input id="ht" type="datetime-local" style="width:100%;margin:6px 0 12px;padding:12px;border:1px solid var(--edge);border-radius:12px;background:#fff;font:inherit"><label class="sub" for="hn">ملاحظات (اختياري)</label><textarea id="hn" rows="2" style="width:100%;margin:6px 0;padding:12px;border:1px solid var(--edge);border-radius:12px;font:inherit"></textarea><button id="scheduleHandover" style="width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:900">حفظ موعد التسليم</button></section>':"";
 const feesHtml='<section class="card"><h2 class="h">رسوم المنصة</h2><p class="sub">رسوم الخدمة منفصلة عن سعر الجهاز وعن تأمين المشاركة. حالة الرسوم هنا للتسجيل والمتابعة فقط.</p>'+(fees.length?fees.map(f=>row(f.payer_role==="buyer"?"رسوم المشتري":"رسوم البائع",money(f.amount_iqd)+" — "+(feeStatus[f.status]||f.status)+(f.paid_at?" — "+date(f.paid_at):""))).join(""):'<div class="sub">لا توجد سجلات رسوم متاحة لهذه المعاملة حالياً.</div>')+'</section>';
 const appointmentHtml='<section class="card"><h2 class="h">موعد ومكان التسليم</h2>'+row("موعد التسليم",date(p?.scheduled_at))+row("حالة الموعد",p?.status||"لم يتم تحديد موعد")+(point?row("نقطة التسليم",point.name_ar+" — "+point.address_ar):"")+(point?.phone?row("هاتف نقطة التسليم",point.phone):"")+(p?.notes?row("ملاحظات",p.notes):"")+'<p class="sub">لا تدفع ثمن الجهاز إلكترونياً من هذه الصفحة. افحص الجهاز واتبع إجراء التسليم المعتمد قبل تأكيد الدفع والاستلام.</p></section>';
 const timelineHtml='<section class="card"><h2 class="h">متابعة التسليم</h2>'+timeline.map(x=>'<div class="step"><span class="dot" style="background:'+(x[1]?'var(--ok)':'var(--edge)')+'"></span><div>'+esc(x[0])+'<div class="sub">'+(x[1]?"تم تسجيل هذه المرحلة":"لم تكتمل هذه المرحلة بعد")+'</div></div></div>').join("")+(h?'<div style="margin-top:8px">'+row("تأكيد البائع",h.seller_confirmed?"تم":"بانتظار")+row("تأكيد المشتري",h.buyer_confirmed?"تم":"بانتظار")+row("تأكيد الإدارة",h.platform_confirmed?"تم":"بانتظار")+'</div>':"")+'</section>';
 $("app").innerHTML=accountCodeHtml+'<section class="card"><h2 class="h">'+esc([d.brand,d.model,d.storage].filter(Boolean).join(" ")||"تفاصيل الجهاز")+'</h2><span class="pill">'+esc(status)+'</span><div style="margin-top:10px">'+row("رقم المعاملة",t.transaction_number||"—")+row("نوع العملية",t.operation_type==="auction"?"شراء عن طريق مزاد":"شراء مباشر")+row("معرّف الجهاز",d.mzad_id||d.id||"—")+row("حالة توثيق الجهاز",d.verification_status||"—")+row("تاريخ المعاملة",date(t.created_at))+row("سعر الجهاز",money(t.final_price_iqd),"price")+'</div></section>'+handoverActions+feesHtml+appointmentHtml+scheduleForm+timelineHtml;
 const ht=$("ht");if(ht){const now=new Date(Date.now()+60*60*1000);now.setMinutes(now.getMinutes()-now.getTimezoneOffset());ht.min=now.toISOString().slice(0,16)}
}
$("app").addEventListener("click",async e=>{
 const schedule=e.target.closest("#scheduleHandover");
 if(schedule){
   const pointId=$("hp")?.value,raw=$("ht")?.value,note=$("hn")?.value.trim()||null;
   if(!pointId||!raw){alert("اختر نقطة التسليم والموعد أولاً.");return}
   const scheduledAt=new Date(raw);
   if(!Number.isFinite(scheduledAt.getTime())||scheduledAt<=new Date()){alert("اختَر موعداً مستقبلياً صحيحاً.");return}
   schedule.disabled=true;
   try{const r=await supabase.rpc("mzad_schedule_handover",{p_transaction_id:id,p_handover_point_id:pointId,p_scheduled_at:scheduledAt.toISOString(),p_notes:note});if(r.error)throw r.error;alert("تم حفظ الموعد. تأكد من تنسيقه مع الطرف الآخر.");await load()}
   catch(err){console.error(err);alert("تعذر حفظ الموعد: "+(err.message||err));schedule.disabled=false}
   return;
 }
 const b=e.target.closest("[data-action]");if(!b)return;
 const action=b.dataset.action;
 if(!confirm("تأكيد تسجيل هذا الإجراء؟ لا تتابع إلا إذا حدث فعلياً."))return;
 b.disabled=true;
 try{const r=await supabase.rpc("mzad_confirm_handover",{p_transaction_id:id,p_action:action});if(r.error)throw r.error;alert("تم تسجيل التأكيد. قد تبقى المعاملة غير مكتملة حتى تُستوفى جميع شروط التسليم والرسوم.");await load()}
 catch(err){console.error(err);alert("تعذر تسجيل التأكيد: "+(err.message||err));b.disabled=false}
});
$("back").addEventListener("click",()=>history.length>1?history.back():location.href="my-activity.html?tab=purchases");
load().catch(e=>{$("app").innerHTML='<div class="error">'+esc(e.message||e)+'</div>';console.error("TRANSACTION PAGE",e)});
</script></body></html>
